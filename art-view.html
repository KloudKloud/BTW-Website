<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art ✦ Between Two Worlds</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <div class="nav-left">
  <a class="nav-brand" href="/">Between Two Worlds</a>
  </div>
  <ul class="nav-links">
    <li><a href="/">Home</a></li>
    <li><a href="/chapters">Chapters</a></li>
    <li><a href="/characters">Characters</a></li>
    <li><a href="/art" class="active">Gallery</a></li>
    <li><a href="/spicy">Spicy</a></li>
    <li><a href="https://btwfics.net/join">Community</a></li>
    <li><a href="/discord">Discord</a></li>
    <li><a href="/inbox">Inbox</a></li>
    <li><a href="/login" class="nav-login">Log In / Register</a></li>
  </ul>
</nav>

<main class="art-view-wrapper">

  <a class="art-view-back" id="art-view-back" href="/art">← Back to Gallery</a>

  <div class="art-view-image-wrap">
    <img id="art-view-img" src="" alt="" />
  </div>

  <div class="art-view-info">
    <h1 id="art-view-title" class="art-view-title"></h1>
    <button class="like-btn art-view-like" id="art-view-like" data-type="art" data-id="" aria-label="Like">
      <span class="like-icon">♡</span><span class="like-count">0</span>
    </button>
  </div>

  <div id="art-view-desc" class="art-view-desc"></div>

  <div id="art-nav" class="art-nav"></div>

  <!-- Comments -->
  <section class="art-view-comments" id="comments-section">
    <h2 class="comments-heading">Comments</h2>
    <div id="comments-area"></div>
  </section>

</main>



<script src="gallery-data.js"></script>
<script src="likes.js"></script>
<script>
  const API    = '/api';
  const params = new URLSearchParams(window.location.search);
  const id     = parseInt(params.get('id'), 10);
  const entry  = GALLERY.find(g => g.num === id);

  if (!entry) {
    window.location.href = '/art';
  } else {
    document.title = `${entry.title || 'Art'} ✦ Between Two Worlds`;

    const imgEl = document.getElementById('art-view-img');
    if (entry.cat === 'spicy') {
      const spicyToken = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
      const srcFile = entry.src.split('/').pop();
      imgEl.src = spicyToken ? `/api/spicy-img/${srcFile}?token=${encodeURIComponent(spicyToken)}` : '';
    } else {
      imgEl.src = entry.src;
    }
    imgEl.alt = entry.title || '';
    const titleEl = document.getElementById('art-view-title');
    titleEl.textContent = entry.title || '';

    const likeBtn = document.getElementById('art-view-like');
    likeBtn.dataset.id = entry.num;
    LikeButtons.init('art');

    const backLink = document.getElementById('art-view-back');
    if (entry.cat === 'sketches') {
      backLink.href = '/art-sketches';
      backLink.textContent = '← Back to Sketches';
    } else if (entry.cat === 'spicy') {
      backLink.href = '/spicy';
      backLink.textContent = '← Back to Spicy';
    }

    const descWrap = document.getElementById('art-view-desc');
    if (entry.desc && entry.desc.length) {
      entry.desc.forEach(item => {
        const p = document.createElement('p');
        if (item && typeof item === 'object' && item.html) {
          p.innerHTML = item.html;
        } else {
          p.textContent = item;
        }
        descWrap.appendChild(p);
      });
      if (entry.credit) {
        const cred = document.createElement('p');
        cred.className = 'art-view-credit';
        cred.append(entry.credit.gifted ? 'Gifted by ' : 'Commissioned by ');
        const a = document.createElement('a');
        a.href = entry.credit.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = entry.credit.name;
        cred.appendChild(a);
        if (entry.credit.platform) cred.append(' ' + entry.credit.platform);
        descWrap.appendChild(cred);
      }
      if (entry.links && entry.links.length) {
        entry.links.forEach(link => {
          const p = document.createElement('p');
          p.className = 'art-view-extra-link';
          const a = document.createElement('a');
          a.href = link.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = link.label;
          p.appendChild(a);
          descWrap.appendChild(p);
        });
      }
    } else if (entry.caption) {
      const p = document.createElement('p');
      p.textContent = entry.caption;
      descWrap.appendChild(p);
    } else {
      descWrap.remove();
    }

    // ── Slideshow nav ───────────────────────────────────────────────────────
    (function () {
      const siblings = GALLERY.filter(g => g.cat === entry.cat).sort((a, b) => a.num - b.num);
      const idx = siblings.findIndex(g => g.num === entry.num);
      const prevEntry = idx > 0 ? siblings[idx - 1] : null;
      const nextEntry = idx < siblings.length - 1 ? siblings[idx + 1] : null;
      const navEl = document.getElementById('art-nav');
      function truncate(s, n) { return s.length > n ? s.slice(0, n).trimEnd() + '…' : s; }
      if (prevEntry) {
        const a = document.createElement('a');
        a.className = 'art-nav-btn art-nav-prev';
        a.href = `/art-view?id=${prevEntry.num}`;
        const arrow = document.createTextNode('← ');
        const lbl = document.createElement('span');
        lbl.className = 'art-nav-label';
        lbl.textContent = truncate(prevEntry.title || 'Previous', 28);
        a.appendChild(arrow); a.appendChild(lbl);
        navEl.appendChild(a);
      }
      if (nextEntry) {
        const a = document.createElement('a');
        a.className = 'art-nav-btn art-nav-next';
        a.href = `/art-view?id=${nextEntry.num}`;
        const lbl = document.createElement('span');
        lbl.className = 'art-nav-label';
        lbl.textContent = truncate(nextEntry.title || 'Next', 28);
        const arrow = document.createTextNode(' →');
        a.appendChild(lbl); a.appendChild(arrow);
        navEl.appendChild(a);
      }
      if (!prevEntry && !nextEntry) navEl.remove();

      // ── Swipe navigation with live drag + slide-out ─────────────────────────
      (function () {
        const page = document.querySelector('main.art-view-wrapper') || document.body;
        let startX = 0, startY = 0, dirLock = null, busy = false, dragging = false;
        const THRESHOLD = () => window.innerWidth * 0.25;

        document.addEventListener('touchstart', (e) => {
          if (busy) return;
          startX = e.changedTouches[0].screenX;
          startY = e.changedTouches[0].screenY;
          dirLock = null; dragging = false;
          page.style.transition = 'none';
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
          if (busy) return;
          const dx = e.changedTouches[0].screenX - startX;
          const dy = e.changedTouches[0].screenY - startY;
          // Lock direction only after 12px; horizontal must not be clearly beaten by vertical
          if (!dirLock && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
            dirLock = Math.abs(dx) >= Math.abs(dy) * 0.8 ? 'h' : 'v';
          }
          if (dirLock === 'h') {
            e.preventDefault();
            dragging = true;
            // Resistance at edges (no sibling in that direction)
            let dampedDx = dx;
            if ((dx > 0 && !prevEntry) || (dx < 0 && !nextEntry)) dampedDx = dx * 0.2;
            page.style.transform = `translateX(${dampedDx}px)`;
          }
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
          if (busy) return;
          const dx = e.changedTouches[0].screenX - startX;
          if (dirLock !== 'h' || !dragging) {
            page.style.transition = '';
            page.style.transform = '';
            return;
          }
          if (Math.abs(dx) < THRESHOLD()) {
            // Snap back
            page.style.transition = 'transform 0.22s cubic-bezier(0.4,0,0.2,1)';
            page.style.transform = '';
            setTimeout(() => { page.style.transition = ''; }, 250);
            return;
          }
          const target = dx < 0 ? nextEntry : prevEntry;
          if (!target) {
            page.style.transition = 'transform 0.22s cubic-bezier(0.4,0,0.2,1)';
            page.style.transform = '';
            setTimeout(() => { page.style.transition = ''; }, 250);
            return;
          }
          busy = true;
          page.style.transition = 'transform 0.25s cubic-bezier(0.4,0,0.2,1)';
          page.style.transform = `translateX(${dx < 0 ? '-110vw' : '110vw'})`;
          setTimeout(() => { window.location.href = `/art-view?id=${target.num}`; }, 240);
        }, { passive: true });
      })();
    })();

    // ── Comments ────────────────────────────────────────────────────────────
    const token    = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
    const rawUser  = localStorage.getItem('btw_user')  || sessionStorage.getItem('btw_user');
    const loggedIn = !!token;
    let   currentUser = null;
    try { currentUser = rawUser ? JSON.parse(rawUser) : null; } catch {}
    const isSpicy  = entry.cat === 'spicy';
    const area     = document.getElementById('comments-area');

    function timeAgo(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1)  return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24)  return `${hrs}h ago`;
      const days = Math.floor(hrs / 24);
      if (days < 30) return `${days}d ago`;
      return new Date(dateStr).toLocaleDateString();
    }

    function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    function makeCommentAvatar(c) {
      const name = c.display_name || c.username || '?';
      const initial = name.charAt(0).toUpperCase();
      if (c.avatar) {
        const img = document.createElement('img');
        img.src = c.avatar; img.alt = name;
        img.className = 'comment-avatar';
        img.onerror = function() {
          const fb = document.createElement('div');
          fb.className = 'comment-avatar comment-avatar--fallback';
          fb.textContent = initial;
          this.replaceWith(fb);
        };
        return img;
      }
      const fb = document.createElement('div');
      fb.className = 'comment-avatar comment-avatar--fallback';
      fb.textContent = initial;
      return fb;
    }

    function renderComment(c) {
      const name      = c.display_name || c.username;
      const isOwn     = currentUser && (c.username === currentUser.username);
      const isAdmin   = currentUser && currentUser.is_admin;
      const canDelete = isOwn || isAdmin;
      const div = document.createElement('div');
      div.className    = 'comment-item';
      div.dataset.id   = c.id;
      div.dataset.body = c.body;

      div.appendChild(makeCommentAvatar(c));

      const inner = document.createElement('div');
      inner.className = 'comment-inner';
      inner.innerHTML = `
        <div class="comment-meta">
          <span class="comment-author">${esc(name)}</span>
          <span class="comment-time">${timeAgo(c.created_at)}</span>
        </div>
        <p class="comment-body">${esc(c.body)}</p>
        <div class="comment-actions"></div>
      `;
      div.appendChild(inner);

      const actionsWrap = inner.querySelector('.comment-actions');

      // Reply — all logged-in users
      if (currentUser) {
        const repBtn = document.createElement('button');
        repBtn.className = 'comment-action-btn';
        repBtn.textContent = 'Reply';
        repBtn.addEventListener('click', () => {
          const ta = document.getElementById('comment-input');
          if (!ta) return;
          const prefix = `@${name} `;
          if (!ta.value.startsWith(prefix)) ta.value = prefix + ta.value;
          ta.focus();
          ta.selectionStart = ta.selectionEnd = ta.value.length;
          ta.dispatchEvent(new Event('input'));
          ta.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
        actionsWrap.appendChild(repBtn);
      }

      // Delete — owner or admin
      if (canDelete) {
        const delBtn = document.createElement('button');
        delBtn.className = 'comment-action-btn comment-action-btn--delete';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => deleteComment(div, c.id));
        actionsWrap.appendChild(delBtn);
      }

      // Report — logged-in non-owners
      if (currentUser && !isOwn) {
        const flagBtn = document.createElement('button');
        flagBtn.className = 'comment-action-btn comment-action-btn--report';
        flagBtn.textContent = '⚑ Report';
        flagBtn.addEventListener('click', () => buildReportForm('art-comment', c.id, div));
        actionsWrap.appendChild(flagBtn);
      }

      return div;
    }

    // ── Shared report form ─────────────────────────────────────────────────────
    function buildReportForm(type, id, anchorEl) {
      const existing = anchorEl.querySelector('.report-form');
      if (existing) { existing.remove(); return; }

      const form = document.createElement('div');
      form.className = 'report-form';
      form.innerHTML = `
        <label class="report-form-label">Please describe the issue you are reporting:</label>
        <textarea class="report-form-textarea" maxlength="1000" placeholder="Describe the problem…"></textarea>
        <div class="report-form-actions">
          <button class="report-form-submit">Send Report</button>
          <button class="report-form-cancel">Cancel</button>
        </div>
        <span class="report-form-msg"></span>
      `;

      const ta     = form.querySelector('.report-form-textarea');
      const submit = form.querySelector('.report-form-submit');
      const cancel = form.querySelector('.report-form-cancel');
      const msg    = form.querySelector('.report-form-msg');

      cancel.addEventListener('click', () => form.remove());
      submit.addEventListener('click', async () => {
        const description = ta.value.trim();
        if (!description) { msg.textContent = 'Please describe the issue first.'; return; }
        submit.disabled = true;
        try {
          const res = await fetch('/api/report', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ type, id, description }),
          });
          const data = await res.json();
          if (!res.ok) { msg.textContent = data.error || 'Failed to send.'; submit.disabled = false; return; }
          ta.remove(); submit.remove(); cancel.remove();
          msg.className = 'report-form-msg report-form-msg--ok';
          msg.textContent = '✓ Report submitted. Thank you!';
          setTimeout(() => form.remove(), 3000);
        } catch { msg.textContent = 'Network error.'; submit.disabled = false; }
      });

      anchorEl.appendChild(form);
      ta.focus();
    }

    async function deleteComment(div, id) {
      if (!confirm('Delete this comment?')) return;
      try {
        const res = await fetch(`${API}/comments/${id}`, {
          method:  'DELETE',
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.ok) div.remove();
      } catch {}
    }

    function buildCommentForm(listEl) {
      const form = document.createElement('div');
      form.className = 'comment-form';
      form.innerHTML = `
        <textarea id="comment-input" placeholder="Leave a comment…" maxlength="500"></textarea>
        <div class="comment-form-row">
          <span class="comment-char-count" id="comment-chars">0 / 500</span>
          <button class="comment-submit-btn" id="comment-submit">Post</button>
        </div>
        <div id="comment-error" style="font-size:0.83rem;color:#e8849e;display:none;"></div>
      `;

      const textarea  = form.querySelector('#comment-input');
      const charCount = form.querySelector('#comment-chars');
      const submitBtn = form.querySelector('#comment-submit');
      const errEl     = form.querySelector('#comment-error');

      textarea.addEventListener('input', () => {
        const len = textarea.value.length;
        charCount.textContent = `${len} / 500`;
        charCount.classList.toggle('near-limit', len > 450);
      });

      submitBtn.addEventListener('click', async () => {
        const body = textarea.value.trim();
        if (!body) return;
        errEl.style.display = 'none';
        submitBtn.disabled = true;

        try {
          const res  = await fetch(`${API}/comments`, {
            method:  'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify({ art_id: entry.num, body }),
          });
          const data = await res.json();
          if (!res.ok) {
            errEl.textContent = data.error || 'Failed to post comment.';
            errEl.style.display = 'block';
          } else {
            const emptyMsg = listEl.querySelector('.comments-empty');
            if (emptyMsg) emptyMsg.remove();
            listEl.appendChild(renderComment(data.comment));
            textarea.value = '';
            charCount.textContent = '0 / 500';
          }
        } catch {
          errEl.textContent = 'Network error. Please try again.';
          errEl.style.display = 'block';
        } finally {
          submitBtn.disabled = false;
        }
      });

      return form;
    }

    async function loadComments() {
      // Spicy art: gate entire comments section behind login
      if (isSpicy && !loggedIn) {
        area.innerHTML = `
          <div class="comments-gate">
            <a href="/login?from=${encodeURIComponent(`/art-view?id=${entry.num}`)}">Log in</a> to view and leave comments on this artwork.
          </div>
        `;
        return;
      }

      // Build the list container
      const listEl = document.createElement('div');
      listEl.className = 'comments-list';
      listEl.id = 'comments-list';

      // Comment form for logged-in users
      if (loggedIn) {
        area.appendChild(buildCommentForm(listEl));
      } else {
        const prompt = document.createElement('div');
        prompt.className = 'comment-signin-prompt';
        prompt.innerHTML = `<a href="/login?from=${encodeURIComponent(`/art-view?id=${entry.num}`)}">Sign in</a> to leave a comment.`;
        area.appendChild(prompt);
      }

      area.appendChild(listEl);

      // Fetch existing comments
      try {
        const res  = await fetch(`${API}/comments?art_id=${entry.num}`);
        const data = await res.json();

        if (!data.comments || data.comments.length === 0) {
          listEl.innerHTML = '<p class="comments-empty">No comments yet. Be the first!</p>';
        } else {
          data.comments.forEach(c => listEl.appendChild(renderComment(c)));
        }
      } catch {
        listEl.innerHTML = '<p class="comments-empty">Could not load comments.</p>';
      }
    }

    loadComments();
  }
</script>

<script src="nav.js"></script>
</body>
</html>
