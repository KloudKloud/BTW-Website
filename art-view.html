<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art — Between Two Worlds</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">Between Two Worlds</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="chapters.html">Chapters</a></li>
    <li><a href="art.html" class="active">Art</a></li>
    <li><a href="characters.html">Characters</a></li>
  </ul>
</nav>

<main class="art-view-wrapper">

  <a class="art-view-back" id="art-view-back" href="art.html">← Back to Gallery</a>

  <div class="art-view-image-wrap">
    <img id="art-view-img" src="" alt="" />
  </div>

  <div class="art-view-info">
    <h1 id="art-view-title" class="art-view-title"></h1>
  </div>

  <p id="art-view-caption" class="art-view-caption"></p>

  <!-- Comments -->
  <section class="art-view-comments">
    <h2 class="comments-heading">Comments</h2>

    <div class="comment-signin-prompt">
      <span>Sign in to leave a comment.</span>
    </div>

    <div class="comments-list" id="comments-list">
      <p class="comments-empty">No comments yet. Be the first!</p>
    </div>
  </section>

</main>

<footer>
  <p>Between Two Worlds &mdash; a Pokémon fan fiction. Not affiliated with Nintendo or Game Freak.</p>
</footer>

<script src="gallery-data.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const id     = parseInt(params.get('id'), 10);
  const entry  = GALLERY.find(g => g.num === id);

  if (!entry) {
    window.location.href = 'art.html';
  } else {
    document.title = `${entry.title || 'Art'} — Between Two Worlds`;

    document.getElementById('art-view-img').src = entry.src;
    document.getElementById('art-view-img').alt = entry.title || '';
    document.getElementById('art-view-title').textContent = entry.title || '';

    // Back link goes to the right gallery page
    const backLink = document.getElementById('art-view-back');
    backLink.href = entry.cat === 'sketches' ? 'art-sketches.html' : 'art.html';
    backLink.textContent = entry.cat === 'sketches'
      ? '← Back to Sketches'
      : '← Back to Gallery';

    const capEl = document.getElementById('art-view-caption');
    if (entry.caption) {
      capEl.textContent = entry.caption;
    } else {
      capEl.remove();
    }
  }
</script>

</body>
</html>
