<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sketches — Between Two Worlds</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <a class="nav-brand" href="index.html">Between Two Worlds</a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="chapters.html">Chapters</a></li>
    <li><a href="art.html" class="active">Art</a></li>
    <li><a href="characters.html">Characters</a></li>
  </ul>
</nav>

<div class="site-banner">
  <div class="site-banner-inner">
    <img src="images/gallery/bordergallery.png" alt="Art Gallery — banner" />
  </div>
</div>

<main class="gallery-page-wrapper">
  <div class="gallery-page-card">
    <div class="gallery-inner">

      <aside class="gallery-sidebar">
        <p class="gallery-sidebar-label">Browse</p>
        <a class="gallery-cat" href="art.html">Art</a>
        <a class="gallery-cat active" href="art-sketches.html">Sketches</a>
      </aside>

      <div class="gallery-main">
        <p class="gallery-eyebrow">Works in Progress</p>
        <h1 class="gallery-title">Sketches</h1>
        <div class="gallery-rule"></div>
        <div class="gallery-grid" id="gallery-grid"></div>
      </div>

    </div>
  </div>
</main>

<footer>
  <p>Between Two Worlds &mdash; a Pokémon fan fiction. Not affiliated with Nintendo or Game Freak.</p>
</footer>

<script src="gallery-data.js"></script>
<script>
  const grid  = document.getElementById('gallery-grid');
  const items = GALLERY.filter(g => g.cat === 'sketches').sort((a, b) => a.num - b.num);

  if (items.length === 0) {
    grid.innerHTML = '<p class="gallery-empty-msg">No sketches yet — check back soon.</p>';
  } else {
    items.forEach(g => {
      const a = document.createElement('a');
      a.className = 'gallery-tile';
      a.href = `art-view.html?id=${g.num}`;
      a.innerHTML = `<img src="${g.prev}" alt="${g.title || 'Gallery image'}" loading="lazy" />`;
      grid.appendChild(a);
    });
  }
</script>

</body>
</html>
