const DEFAULT_REF = 'images/characters/noreference.png';

function getActiveId() {
  return new URLSearchParams(window.location.search).get('char') || CHARACTERS[0].id;
}

function updateActiveTab(id) {
  document.querySelectorAll('.chars-tab').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.id === id);
  });
}

function renderProfile(char) {
  const profile = document.getElementById('char-profile');
  profile.innerHTML = '';

  // Reference image
  const refWrap = document.createElement('div');
  refWrap.className = 'char-ref-wrap';
  refWrap.style.aspectRatio = char.refAspect || (char.hasRef ? '1 / 1' : '13 / 10');
  const imgSrc = char.ref || (char.hasRef ? `images/characters/${char.id}_ref.png` : DEFAULT_REF);
  const img = document.createElement('img');
  img.alt = char.name;
  img.src = imgSrc;
  img.onerror = function () {
    refWrap.innerHTML = '<div class="char-ref-placeholder"><span>✦</span><span>No reference yet</span></div>';
  };
  refWrap.appendChild(img);
  profile.appendChild(refWrap);

  // Bio box
  const bio = document.createElement('div');
  bio.className = 'char-bio-box';

  const nameEl = document.createElement('h1');
  nameEl.className = 'char-name';
  if (char.nameHtml) { nameEl.innerHTML = char.nameHtml; } else { nameEl.textContent = char.name; }
  bio.appendChild(nameEl);

  const descWrap = document.createElement('div');
  descWrap.className = 'char-desc';
  if (char.desc && char.desc.length) {
    char.desc.forEach(text => {
      const p = document.createElement('p');
      if (text && typeof text === 'object' && text.html) {
        p.innerHTML = text.html;
      } else {
        p.textContent = text;
      }
      descWrap.appendChild(p);
    });
  } else {
    const p = document.createElement('p');
    p.className = 'char-desc-placeholder';
    p.textContent = 'Description coming soon…';
    descWrap.appendChild(p);
  }
  bio.appendChild(descWrap);
  profile.appendChild(bio);

  // Stats + Facts row
  const row = document.createElement('div');
  row.className = 'char-cards-row';

  // Stats box
  const statsBox = document.createElement('div');
  statsBox.className = 'char-box';
  const statsTitle = document.createElement('span');
  statsTitle.className = 'char-box-title';
  statsTitle.textContent = 'Stats';
  statsBox.appendChild(statsTitle);
  Object.entries(char.stats || {}).forEach(([label, value]) => {
    const statRow = document.createElement('div');
    statRow.className = 'char-stat-row';
    const lbl = document.createElement('span');
    lbl.className = 'char-stat-label';
    lbl.textContent = label;
    const val = document.createElement('span');
    val.className = 'char-stat-value';
    val.textContent = value || '—';
    statRow.appendChild(lbl);
    statRow.appendChild(val);
    statsBox.appendChild(statRow);
  });
  row.appendChild(statsBox);

  // Fun facts box
  const factsBox = document.createElement('div');
  factsBox.className = 'char-box';
  const factsTitle = document.createElement('span');
  factsTitle.className = 'char-box-title';
  factsTitle.textContent = 'Fun Facts';
  factsBox.appendChild(factsTitle);
  if (char.facts && char.facts.length) {
    char.facts.forEach(item => {
      const fact = document.createElement('div');
      fact.className = 'char-fact';
      const bullet = document.createElement('span');
      bullet.className = 'char-fact-bullet';
      bullet.textContent = '✦';
      const content = document.createElement('span');
      if (item && typeof item === 'object' && item.html) {
        content.innerHTML = item.html;
      } else {
        content.textContent = item;
      }
      fact.appendChild(bullet);
      fact.appendChild(content);
      factsBox.appendChild(fact);
    });
  } else {
    const fact = document.createElement('div');
    fact.className = 'char-fact';
    const bullet = document.createElement('span');
    bullet.className = 'char-fact-bullet';
    bullet.textContent = '✦';
    const content = document.createElement('span');
    content.style.color = 'rgba(255,255,255,0.15)';
    content.style.fontStyle = 'italic';
    content.textContent = 'Fun facts coming soon…';
    fact.appendChild(bullet);
    fact.appendChild(content);
    factsBox.appendChild(fact);
  }
  row.appendChild(factsBox);

  profile.appendChild(row);

  // Lore spoiler box
  if (char.lore && char.lore.length) {
    const loreBox = document.createElement('div');
    loreBox.className = 'char-box char-lore-box';

    const loreTitle = document.createElement('span');
    loreTitle.className = 'char-box-title';
    loreTitle.textContent = 'Lore';
    loreBox.appendChild(loreTitle);

    const spoiler = document.createElement('div');
    spoiler.className = 'char-lore-spoiler';

    const textWrap = document.createElement('div');
    textWrap.className = 'char-lore-text';
    char.lore.forEach(item => {
      const p = document.createElement('p');
      if (item && typeof item === 'object' && item.html) {
        p.innerHTML = item.html;
      } else {
        p.textContent = item;
      }
      textWrap.appendChild(p);
    });
    spoiler.appendChild(textWrap);

    const revealBtn = document.createElement('button');
    revealBtn.className = 'char-lore-reveal';
    revealBtn.textContent = '⚠ Spoilers — click to reveal';
    revealBtn.addEventListener('click', () => spoiler.classList.add('revealed'));
    spoiler.appendChild(revealBtn);

    loreBox.appendChild(spoiler);
    profile.appendChild(loreBox);
  }
}

function buildNav() {
  const nav = document.getElementById('chars-nav');
  const activeId = getActiveId();
  CHARACTERS.forEach(char => {
    const btn = document.createElement('button');
    btn.className = 'chars-tab' + (char.id === activeId ? ' active' : '');
    btn.dataset.id = char.id;
    btn.textContent = char.name;
    btn.addEventListener('click', () => {
      history.pushState(null, '', `?char=${char.id}`);
      document.title = `${char.name} — Between Two Worlds`;
      renderProfile(char);
      updateActiveTab(char.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    nav.appendChild(btn);
  });
}

window.addEventListener('popstate', () => {
  const id = getActiveId();
  const char = CHARACTERS.find(c => c.id === id) || CHARACTERS[0];
  document.title = `${char.name} — Between Two Worlds`;
  renderProfile(char);
  updateActiveTab(char.id);
});

// Init
buildNav();
const activeChar = CHARACTERS.find(c => c.id === getActiveId()) || CHARACTERS[0];
document.title = `${activeChar.name} — Between Two Worlds`;
renderProfile(activeChar);
</script>

<script src="nav.js"></script>
