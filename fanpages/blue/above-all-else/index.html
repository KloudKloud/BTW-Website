<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Above All Else</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
</head>
<body class="mod-theme">

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<!-- Edit bar — only shown while editing -->
<div class="mod-edit-bar" id="edit-bar" style="display:none;">
  <span class="mod-edit-bar-label">Currently editing your profile</span>
  <div class="mod-edit-bar-actions">
    <div class="mod-theme-picker">
      <button class="mod-edit-bar-theme-btn" id="theme-btn" type="button">🎨 Theme</button>
      <div class="mod-theme-popover" id="theme-popover" hidden>
        <p class="mod-theme-popover-label">Page Theme</p>
        <div class="mod-theme-grid" id="theme-grid"></div>
      </div>
    </div>
    <button class="mod-edit-bar-save" id="save-edit-btn">Save Changes</button>
    <button class="mod-edit-bar-cancel" id="cancel-edit-btn" type="button">Cancel</button>
  </div>
</div>

<!-- Cover -->
<div class="wiki-cover" id="wiki-cover">
  <img alt="Above All Else — cover art" id="banner-img" class="mod-banner-loading" />

  <div class="mod-banner-reposition" id="banner-reposition" style="display:none;">
    <label for="banner-position-slider">Reposition</label>
    <input type="range" id="banner-position-slider" min="0" max="100" value="50" />
  </div>

  <div class="mod-banner-edit-wrap" id="banner-edit-wrap" style="display:none;">
    <button class="mod-banner-edit-btn" id="banner-edit-btn" type="button">📷 Change Banner Image</button>
    <span class="mod-banner-edit-hint">Recommended size: 1600 × 560px</span>
  </div>
  <input type="file" id="banner-file-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />

  <button class="mod-edit-toggle-btn" id="edit-profile-btn" style="display:none;" type="button">✎ Edit Profile</button>
</div>

<!-- Custom theme background (blurred, only shown when a custom image is set) -->
<div class="mod-page-bg-wrap" id="page-bg-wrap">
  <img class="mod-page-bg-img" id="page-bg-img" style="display:none;" alt="" />
  <div class="mod-page-bg-overlay" id="page-bg-overlay" style="display:none;"></div>

  <!-- Wiki-style layout -->
  <main class="wiki-layout">

    <div class="wiki-main">
      <div class="mod-editable-block">
        <h1 class="wiki-title" id="site-title-display">Above All Else</h1>
        <input class="mod-input mod-edit-input" id="site-title-input" style="display:none;" maxlength="60" />
      </div>

      <section class="wiki-section">
        <h2 class="wiki-section-title">About</h2>
        <div class="wiki-rule"></div>
        <div class="mod-about-row">
          <div class="mod-cover-wrap" id="cover-wrap">
            <img id="cover-img" alt="Book cover" style="display:none;" />
            <div class="mod-cover-placeholder" id="cover-placeholder">No cover yet</div>

            <button class="mod-cover-edit-btn" id="cover-edit-btn" type="button" style="display:none;">📷 Change Cover</button>
            <input type="file" id="cover-file-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />

            <div class="mod-cover-reposition" id="cover-reposition" style="display:none;">
              <label>H <input type="range" id="cover-position-x-slider" min="0" max="100" value="50" /></label>
              <label>V <input type="range" id="cover-position-y-slider" min="0" max="100" value="50" /></label>
            </div>
          </div>

          <div class="mod-editable-block">
            <blockquote class="wiki-quote" id="site-synopsis-display">N/A</blockquote>
            <textarea class="mod-textarea mod-edit-input" id="site-synopsis-input" style="display:none;"></textarea>
          </div>
        </div>
      </section>

      <section class="wiki-section">
        <h2 class="wiki-section-title">Meet Blue</h2>
        <div class="wiki-rule"></div>
        <div class="wiki-meet-split">
          <div class="wiki-meet-text mod-editable-block">
            <p id="site-bio-display">N/A</p>
            <textarea class="mod-textarea mod-edit-input" id="site-bio-input" style="display:none;"></textarea>
          </div>
          <div class="wiki-meet-divider"></div>
          <div class="wiki-meet-links mod-editable-block">
            <p class="wiki-meet-links-label">Find Me</p>
            <ul class="wiki-links-list" id="site-links-display">
              <li>N/A</li>
            </ul>
            <div id="site-links-editor" style="display:none;"></div>
            <button class="mod-btn mod-btn--small" id="add-link-edit-row" type="button" style="display:none;">+ Add Link</button>
          </div>
        </div>
      </section>
    </div>

    <!-- Side column -->
    <div class="wiki-side-col">

      <aside class="mod-side-nav">
        <p class="mod-side-nav-label">Navigate</p>
        <ul class="mod-side-nav-list">
          <li><a href="/fanpages/blue/above-all-else" class="mod-side-nav-link active">Home</a></li>
          <li><a href="/fanpages/blue/above-all-else/characters" class="mod-side-nav-link">Characters</a></li>
          <li><a href="/fanpages/blue/above-all-else/chapters" class="mod-side-nav-link">Chapters</a></li>
          <li><a href="/fanpages/blue/above-all-else/gallery" class="mod-side-nav-link">Gallery</a></li>
        </ul>
      </aside>

    </div>

  </main>
</div>

<footer>
  <p>Above All Else is a fan-made moderator page hosted on Between Two Worlds.</p>
</footer>

<script src="/fanpages/fanpages-site.js"></script>
<script>
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => ({ Authorization: `Bearer ${token}` });

let siteData = { site: {} };
let editing = false;

// ── Themes ───────────────────────────────────────────────────────────────────
const THEMES = [
  { id: 'default',    label: 'Default (Dark)', c1: '#7fa8d9', c2: '#d97a72', bg: '#0a0a0a', cardBg: '#161616', text: '#f0f0f0', dark: true },
  { id: 'gold-black', label: 'Gold & Black',   c1: '#f0c060', c2: '#6b3fa0', bg: '#0a0a0a', cardBg: '#141414', text: '#f0f0f0', dark: true },
  { id: 'light',      label: 'Light',          c1: '#4d6f99', c2: '#c05a52', bg: '#ffffff', cardBg: '#faf8f6', text: '#2a2a2a' },
  { id: 'sunset',     label: 'Sunset',         c1: '#e07856', c2: '#c2547a', bg: '#fff8f2', cardBg: '#fdf1e8', text: '#2a2a2a' },
  { id: 'forest',     label: 'Forest',         c1: '#3f7a5c', c2: '#2c4a35', bg: '#f6faf7', cardBg: '#eef5f0', text: '#2a2a2a' },
  { id: 'ocean',      label: 'Ocean',          c1: '#2f8f9d', c2: '#1f4e5f', bg: '#f2fafb', cardBg: '#e8f4f6', text: '#2a2a2a' },
  { id: 'rose',       label: 'Rose Quartz',    c1: '#c2547a', c2: '#8a5a72', bg: '#fff5f8', cardBg: '#fbe9ef', text: '#2a2a2a' },
];

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function applyTheme(themeId, customBgUrl) {
  const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
  document.body.style.setProperty('--gold', theme.c1);
  document.body.style.setProperty('--violet', theme.c1);
  document.body.style.setProperty('--rose', theme.c2);
  document.body.style.background = theme.bg;
  document.body.style.color = theme.text;

  // The persistent Navigate/Account boxes read these — keeps them in step
  // with whatever theme is active instead of being hardcoded.
  document.body.style.setProperty('--mod-card-bg', theme.cardBg);
  document.body.style.setProperty('--mod-card-border', theme.dark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)');
  document.body.style.setProperty('--mod-text-primary', theme.text);
  document.body.style.setProperty('--mod-text-secondary', hexToRgba(theme.text, 0.65));
  document.body.style.setProperty('--mod-accent-border', hexToRgba(theme.c1, 0.4));
  document.body.style.setProperty('--mod-accent-bg', hexToRgba(theme.c1, 0.08));
  document.body.style.setProperty('--mod-accent-bg-hover', hexToRgba(theme.c1, 0.12));
  document.body.style.setProperty('--mod-accent2-border', hexToRgba(theme.c2, 0.3));
  document.body.style.setProperty('--mod-accent2-bg', hexToRgba(theme.c2, 0.06));
  document.body.style.setProperty('--mod-accent2-bg-hover', hexToRgba(theme.c2, 0.12));

  const bgImg = document.getElementById('page-bg-img');
  const bgOverlay = document.getElementById('page-bg-overlay');
  if (themeId === 'custom' && customBgUrl) {
    bgImg.src = customBgUrl;
    bgImg.style.display = 'block';
    bgOverlay.style.background = hexToRgba(theme.bg, 0.78);
    bgOverlay.style.display = 'block';
  } else {
    bgImg.style.display = 'none';
    bgOverlay.style.display = 'none';
  }

  document.querySelectorAll('.mod-theme-swatch').forEach(el => el.classList.toggle('active', el.dataset.theme === themeId));
}

function buildThemeGrid() {
  const grid = document.getElementById('theme-grid');
  grid.innerHTML = '';
  THEMES.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'mod-theme-swatch';
    btn.type = 'button';
    btn.title = t.label;
    btn.dataset.theme = t.id;
    btn.innerHTML = `<span style="background:${t.c1};"></span><span style="background:${t.c2};"></span>`;
    btn.addEventListener('click', () => selectTheme(t.id));
    grid.appendChild(btn);
  });

  const uploadBtn = document.createElement('button');
  uploadBtn.className = 'mod-theme-swatch mod-theme-swatch--upload';
  uploadBtn.type = 'button';
  uploadBtn.title = 'Upload your own background image';
  uploadBtn.textContent = '+';
  uploadBtn.addEventListener('click', () => document.getElementById('theme-bg-file-input').click());
  grid.appendChild(uploadBtn);
}

async function selectTheme(themeId) {
  applyTheme(themeId, siteData.site.theme_bg_url);
  const res = await fetch('/api/moderator/site', {
    method: 'PUT',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify({ theme: themeId }),
  });
  if (res.ok) {
    const { site } = await res.json();
    siteData.site = site;
  }
}

const themeBgFileInput = document.createElement('input');
themeBgFileInput.type = 'file';
themeBgFileInput.accept = 'image/png,image/jpeg,image/webp,image/gif';
themeBgFileInput.id = 'theme-bg-file-input';
themeBgFileInput.style.display = 'none';
document.body.appendChild(themeBgFileInput);
themeBgFileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  applyTheme('custom', URL.createObjectURL(file)); // instant preview
  const fd = new FormData();
  fd.append('image', file);
  const res = await fetch('/api/moderator/site/theme-bg', { method: 'PUT', headers: authHeaders(), body: fd });
  if (res.ok) {
    const { site } = await res.json();
    siteData.site = site;
    applyTheme(site.theme, site.theme_bg_url);
  } else {
    alert('Background upload failed. Please try again.');
  }
});

document.getElementById('theme-btn').addEventListener('click', () => {
  document.getElementById('theme-popover').hidden = !document.getElementById('theme-popover').hidden;
});
document.addEventListener('click', (e) => {
  const picker = document.querySelector('.mod-theme-picker');
  if (picker && !picker.contains(e.target)) document.getElementById('theme-popover').hidden = true;
});

// ── Site text/links ────────────────────────────────────────────────────────────
const LINK_ICONS = [
  [/wattpad/i,               '📖'],
  [/(archiveofourown|ao3)/i, '📜'],
  [/discord/i,               '💬'],
  [/(twitter|^x\.com| x$)/i, '🐦'],
  [/instagram/i,             '📷'],
  [/(youtube|youtu\.be)/i,   '▶️'],
  [/tiktok/i,                '🎵'],
  [/tumblr/i,                '📝'],
  [/(furaffinity|deviantart|toyhou)/i, '🎨'],
  [/twitch/i,                '🎮'],
  [/spotify/i,                '🎧'],
  [/patreon|ko-?fi/i,        '☕'],
];
function linkIcon(label, url) {
  const haystack = `${label} ${url}`;
  const match = LINK_ICONS.find(([re]) => re.test(haystack));
  return match ? match[1] : '🔗';
}

function populateDisplay() {
  const s = siteData.site || {};
  document.getElementById('site-title-display').textContent    = s.site_title || 'Above All Else';
  document.getElementById('site-synopsis-display').textContent = s.synopsis   || 'N/A';
  document.getElementById('site-bio-display').textContent      = s.bio        || 'N/A';
  const bannerImg = document.getElementById('banner-img');
  bannerImg.style.objectPosition = `center ${s.banner_position != null ? s.banner_position : 50}%`;
  document.getElementById('banner-position-slider').value = s.banner_position != null ? s.banner_position : 50;

  const targetBannerSrc = s.banner_url || '/images/gallery/kloudsaphbedroom_1.png';
  if (bannerImg.src.endsWith(targetBannerSrc)) {
    // Already showing the right image (e.g. instant preview during upload) — just reveal it.
    bannerImg.classList.remove('mod-banner-loading');
  } else {
    const reveal = () => bannerImg.classList.remove('mod-banner-loading');
    bannerImg.addEventListener('load', reveal, { once: true });
    bannerImg.addEventListener('error', reveal, { once: true });
    bannerImg.src = targetBannerSrc;
  }

  const linksList = document.getElementById('site-links-display');
  linksList.innerHTML = '';
  if (s.links && s.links.length) {
    s.links.forEach(l => {
      const li = document.createElement('li');
      const a  = document.createElement('a');
      a.className = 'wiki-link-item';
      a.href = l.url; a.target = '_blank'; a.rel = 'noopener';
      a.innerHTML = `<span class="link-icon">${linkIcon(l.label, l.url)}</span><span class="link-name">${l.label}</span><span class="link-arrow">↗</span>`;
      li.appendChild(a);
      linksList.appendChild(li);
    });
  } else {
    linksList.innerHTML = '<li>N/A</li>';
  }

  const coverImg = document.getElementById('cover-img');
  const coverPlaceholder = document.getElementById('cover-placeholder');
  const coverX = s.cover_position_x != null ? s.cover_position_x : 50;
  const coverY = s.cover_position_y != null ? s.cover_position_y : 50;
  document.getElementById('cover-position-x-slider').value = coverX;
  document.getElementById('cover-position-y-slider').value = coverY;
  if (s.cover_url) {
    coverImg.src = s.cover_url;
    coverImg.style.objectPosition = `${coverX}% ${coverY}%`;
    coverImg.style.display = 'block';
    coverPlaceholder.style.display = 'none';
  } else {
    coverImg.style.display = 'none';
    coverPlaceholder.style.display = 'flex';
  }
}

function addLinkEditRow(label, url) {
  const wrap = document.createElement('div');
  wrap.className = 'mod-stat-row';
  wrap.innerHTML = `
    <input class="mod-input link-label" placeholder="Label (e.g. Twitter)" value="${label || ''}" />
    <input class="mod-input link-url" placeholder="https://…" value="${url || ''}" />
    <button class="mod-btn mod-btn--small mod-btn--danger" type="button">✕</button>`;
  wrap.querySelector('button').addEventListener('click', () => wrap.remove());
  document.getElementById('site-links-editor').appendChild(wrap);
}
document.getElementById('add-link-edit-row').addEventListener('click', () => addLinkEditRow('', ''));

function toggle(el, show) { el.style.display = show ? '' : 'none'; }

function enterEditMode() {
  editing = true;
  const s = siteData.site || {};

  document.getElementById('edit-bar').style.display = 'flex';
  toggle(document.getElementById('edit-profile-btn'), false);
  document.getElementById('banner-edit-wrap').style.display = 'flex';
  document.getElementById('banner-reposition').style.display = 'flex';
  document.getElementById('wiki-cover').classList.add('mod-editing-banner');

  document.getElementById('cover-edit-btn').style.display = 'block';
  document.getElementById('cover-reposition').style.display = 'flex';

  toggle(document.getElementById('site-title-display'), false);
  const titleInput = document.getElementById('site-title-input');
  titleInput.style.display = 'block';
  titleInput.value = s.site_title || '';

  toggle(document.getElementById('site-synopsis-display'), false);
  const synInput = document.getElementById('site-synopsis-input');
  synInput.style.display = 'block';
  synInput.value = s.synopsis || '';

  toggle(document.getElementById('site-bio-display'), false);
  const bioInput = document.getElementById('site-bio-input');
  bioInput.style.display = 'block';
  bioInput.value = s.bio || '';

  toggle(document.getElementById('site-links-display'), false);
  document.getElementById('site-links-editor').style.display = 'block';
  document.getElementById('add-link-edit-row').style.display = 'inline-block';
  document.getElementById('site-links-editor').innerHTML = '';
  const links = s.links && s.links.length ? s.links : [{ label: '', url: '' }];
  links.forEach(l => addLinkEditRow(l.label, l.url));
}

function exitEditMode() {
  editing = false;
  document.getElementById('edit-bar').style.display = 'none';
  document.getElementById('theme-popover').hidden = true;
  document.getElementById('edit-profile-btn').style.display = 'flex';
  document.getElementById('banner-edit-wrap').style.display = 'none';
  document.getElementById('banner-reposition').style.display = 'none';
  document.getElementById('wiki-cover').classList.remove('mod-editing-banner');

  document.getElementById('cover-edit-btn').style.display = 'none';
  document.getElementById('cover-reposition').style.display = 'none';

  toggle(document.getElementById('site-title-display'), true);
  document.getElementById('site-title-input').style.display = 'none';
  toggle(document.getElementById('site-synopsis-display'), true);
  document.getElementById('site-synopsis-input').style.display = 'none';
  toggle(document.getElementById('site-bio-display'), true);
  document.getElementById('site-bio-input').style.display = 'none';
  toggle(document.getElementById('site-links-display'), true);
  document.getElementById('site-links-editor').style.display = 'none';
  document.getElementById('add-link-edit-row').style.display = 'none';
}

document.getElementById('edit-profile-btn').addEventListener('click', enterEditMode);
document.getElementById('cancel-edit-btn').addEventListener('click', exitEditMode);

document.getElementById('save-edit-btn').addEventListener('click', async () => {
  const links = Array.from(document.querySelectorAll('#site-links-editor .mod-stat-row')).map(row => ({
    label: row.querySelector('.link-label').value.trim(),
    url:   row.querySelector('.link-url').value.trim(),
  })).filter(l => l.label && l.url);

  const body = {
    site_title: document.getElementById('site-title-input').value.trim(),
    synopsis:   document.getElementById('site-synopsis-input').value.trim(),
    bio:        document.getElementById('site-bio-input').value.trim(),
    links,
  };

  const res = await fetch('/api/moderator/site', {
    method: 'PUT',
    headers: { ...authHeaders(), 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (res.ok) {
    const { site } = await res.json();
    siteData.site = site;
    populateDisplay();
    exitEditMode();
  } else {
    alert('Something went wrong saving. Please try again.');
  }
});

// ── Banner image + reposition ───────────────────────────────────────────────
document.getElementById('banner-edit-btn').addEventListener('click', () => {
  document.getElementById('banner-file-input').click();
});
document.getElementById('banner-file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  // Instant local preview — no waiting on the network round trip
  const localUrl = URL.createObjectURL(file);
  document.getElementById('banner-img').src = localUrl;

  const fd = new FormData();
  fd.append('banner', file);
  fd.append('position', document.getElementById('banner-position-slider').value);
  const res = await fetch('/api/moderator/site/banner', { method: 'PUT', headers: authHeaders(), body: fd });
  if (res.ok) {
    const { site } = await res.json();
    siteData.site = site;
    document.getElementById('banner-img').src = site.banner_url;
    URL.revokeObjectURL(localUrl);
  } else {
    alert('Banner upload failed. Please try again.');
  }
});

let repositionTimer = null;
document.getElementById('banner-position-slider').addEventListener('input', (e) => {
  document.getElementById('banner-img').style.objectPosition = `center ${e.target.value}%`;
  clearTimeout(repositionTimer);
  repositionTimer = setTimeout(async () => {
    const res = await fetch('/api/moderator/site/banner-position', {
      method: 'PUT',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ position: parseInt(e.target.value, 10) }),
    });
    if (res.ok) siteData.site = (await res.json()).site;
  }, 400);
});

// ── Book cover + reposition ─────────────────────────────────────────────────
document.getElementById('cover-edit-btn').addEventListener('click', () => {
  document.getElementById('cover-file-input').click();
});
document.getElementById('cover-file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const localUrl = URL.createObjectURL(file);
  const coverImg = document.getElementById('cover-img');
  coverImg.src = localUrl;
  coverImg.style.display = 'block';
  document.getElementById('cover-placeholder').style.display = 'none';

  const fd = new FormData();
  fd.append('cover', file);
  fd.append('position_x', document.getElementById('cover-position-x-slider').value);
  fd.append('position_y', document.getElementById('cover-position-y-slider').value);
  const res = await fetch('/api/moderator/site/cover', { method: 'PUT', headers: authHeaders(), body: fd });
  if (res.ok) {
    const { site } = await res.json();
    siteData.site = site;
    coverImg.src = site.cover_url;
    URL.revokeObjectURL(localUrl);
  } else {
    alert('Cover upload failed. Please try again.');
  }
});

let coverRepositionTimer = null;
function handleCoverReposition() {
  const x = document.getElementById('cover-position-x-slider').value;
  const y = document.getElementById('cover-position-y-slider').value;
  document.getElementById('cover-img').style.objectPosition = `${x}% ${y}%`;
  clearTimeout(coverRepositionTimer);
  coverRepositionTimer = setTimeout(async () => {
    const res = await fetch('/api/moderator/site/cover-position', {
      method: 'PUT',
      headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ position_x: parseInt(x, 10), position_y: parseInt(y, 10) }),
    });
    if (res.ok) siteData.site = (await res.json()).site;
  }, 400);
}
document.getElementById('cover-position-x-slider').addEventListener('input', handleCoverReposition);
document.getElementById('cover-position-y-slider').addEventListener('input', handleCoverReposition);

// ── Boot ─────────────────────────────────────────────────────────────────────
(async () => {
  buildThemeGrid();
  const data = await ModeratorSite.load('blue');
  if (data) siteData = data;
  populateDisplay();
  applyTheme(siteData.site.theme || 'default', siteData.site.theme_bg_url);

  if (await ModeratorSite.isOwner('blue')) {
    document.getElementById('edit-profile-btn').style.display = 'flex';
  }
})();
</script>
</body>
</html>
