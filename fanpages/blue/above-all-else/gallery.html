<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery ✦ Above All Else</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
</head>
<body class="mod-theme">

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="site-banner">
  <div class="site-banner-inner">
    <img id="page-banner-img" alt="Gallery — banner" />
  </div>
</div>

<main class="mod-page-row" style="padding: 0 3rem; margin-top: 3rem;">

  <div class="mod-gallery-main">

    <aside>
      <p class="mod-gallery-sidebar-label">Browse</p>
      <button class="mod-gallery-cat active" id="cat-art" type="button">SFW</button>
      <button class="mod-gallery-cat" id="cat-sketches" type="button">Sketches</button>
      <button class="mod-gallery-cat" id="cat-spicy" type="button">Spicy</button>
    </aside>

    <div class="mod-gallery-content">
      <p class="mod-gallery-eyebrow" id="gallery-eyebrow">Fan Art &amp; Illustrations</p>
      <h1 class="wiki-title" style="margin-bottom: 0.5rem;" id="gallery-title-text">SFW</h1>
      <div class="wiki-rule"></div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>

  </div>

  <div class="wiki-side-col">

    <aside class="mod-side-nav">
      <p class="mod-side-nav-label">Navigate</p>
      <ul class="mod-side-nav-list">
        <li><a href="/fanpages/blue/above-all-else" class="mod-side-nav-link">Home</a></li>
        <li><a href="/fanpages/blue/above-all-else/characters" class="mod-side-nav-link">Characters</a></li>
        <li><a href="/fanpages/blue/above-all-else/chapters" class="mod-side-nav-link">Chapters</a></li>
        <li><a href="/fanpages/blue/above-all-else/gallery" class="mod-side-nav-link active">Gallery</a></li>
      </ul>
    </aside>


  </div>

</main>

<footer>
  <p>Above All Else is a fan-made moderator page hosted on Between Two Worlds.</p>
</footer>

<script src="/fanpages/fanpages-site.js"></script>
<script>
let GALLERY_ART      = [];
let GALLERY_SKETCHES = [];
let GALLERY_SPICY    = [];

const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const grid    = document.getElementById('gallery-grid');
const eyebrow = document.getElementById('gallery-eyebrow');
const title   = document.getElementById('gallery-title-text');
const catArt      = document.getElementById('cat-art');
const catSketches = document.getElementById('cat-sketches');
const catSpicy    = document.getElementById('cat-spicy');

function setActiveTab(btn) {
  [catArt, catSketches, catSpicy].forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function renderTiles(items, emptyMsg) {
  if (!items.length) {
    grid.innerHTML = `<p class="gallery-empty-msg">${emptyMsg}</p>`;
    return;
  }
  grid.innerHTML = '';
  items.forEach(g => {
    const a = document.createElement('a');
    a.className = 'gallery-tile';
    a.href = '#';
    a.innerHTML = `<img src="${g.image_url}" alt="${g.title || 'Gallery image'}" loading="lazy" />`;
    grid.appendChild(a);
  });
}

function renderArt() {
  setActiveTab(catArt);
  eyebrow.textContent = 'Fan Art & Illustrations';
  title.textContent = 'SFW';
  renderTiles(GALLERY_ART, 'No art yet — check back soon.');
}

function renderSketches() {
  setActiveTab(catSketches);
  eyebrow.textContent = 'Sketches & WIPs';
  title.textContent = 'Sketches';
  renderTiles(GALLERY_SKETCHES, 'No sketches yet — check back soon.');
}

function renderSpicy() {
  setActiveTab(catSpicy);
  eyebrow.textContent = 'Mature Content — 18+';
  title.textContent = 'Spicy';

  if (!token) {
    grid.innerHTML = `
      <div class="mod-gallery-locked">
        <div class="mod-gallery-locked-icon">🔒</div>
        <p class="mod-gallery-locked-title">Members Only</p>
        <p class="mod-gallery-locked-text">
          This section contains mature content intended for adults.<br />
          You must be <strong>18 or older</strong> and logged in to view it.
        </p>
        <a href="/login" class="mod-gallery-locked-btn">Log In / Register →</a>
      </div>`;
    return;
  }

  renderTiles(GALLERY_SPICY, 'Nothing here yet — check back soon.');
}

catArt.addEventListener('click', renderArt);
catSketches.addEventListener('click', renderSketches);
catSpicy.addEventListener('click', renderSpicy);

(async () => {
  const data = await ModeratorSite.load('blue');
  ModeratorSite.applyBanner(document.getElementById('page-banner-img'), data && data.site);
  GALLERY_ART      = (data && data.gallery_sfw)      || [];
  GALLERY_SKETCHES = (data && data.gallery_sketches) || [];
  GALLERY_SPICY    = (data && data.gallery_spicy)    || [];
  renderArt();
})();
</script>

</body>
</html>
