<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapters ✦ Above All Else</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
</head>
<body class="mod-theme">

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="site-banner">
  <div class="site-banner-inner">
    <img id="page-banner-img" alt="Chapters — banner" />
  </div>
</div>

<main class="mod-page-row" style="padding: 0 3rem; margin-top: 3rem;">

  <div class="mod-chapters-main">

    <h1 class="hub-title">Chapters</h1>

    <div class="chapters-list" id="chapters-list">
      <p class="gallery-empty-msg">Loading…</p>
    </div>

  </div>

  <div class="wiki-side-col">

    <aside class="mod-side-nav">
      <p class="mod-side-nav-label">Navigate</p>
      <ul class="mod-side-nav-list">
        <li><a href="/fanpages/blue/above-all-else" class="mod-side-nav-link">Home</a></li>
        <li><a href="/fanpages/blue/above-all-else/characters" class="mod-side-nav-link">Characters</a></li>
        <li><a href="/fanpages/blue/above-all-else/chapters" class="mod-side-nav-link active">Chapters</a></li>
        <li><a href="/fanpages/blue/above-all-else/gallery" class="mod-side-nav-link">Gallery</a></li>
      </ul>
    </aside>


  </div>

</main>

<footer>
  <p>Above All Else is a fan-made moderator page hosted on Between Two Worlds.</p>
</footer>

<script src="/fanpages/fanpages-site.js"></script>
<script>
(async () => {
  const data = await ModeratorSite.load('blue');
  ModeratorSite.applyBanner(document.getElementById('page-banner-img'), data && data.site);
  const list = document.getElementById('chapters-list');
  const chapters = (data && data.chapters) || [];
  if (!chapters.length) {
    list.innerHTML = '<p class="gallery-empty-msg">No chapters yet — check back soon.</p>';
  } else {
    list.innerHTML = '';
    chapters.forEach(ch => {
      const row = document.createElement('div');
      row.className = 'chapter-row';
      row.innerHTML = `
        <a class="chapter-row-link" href="${ch.url || '#'}">
          <div class="cr-thumb"><img src="/images/gallery/kloudsaphbedroom_1.png" alt="${ch.title} thumbnail" /></div>
          <div class="cr-info"><span class="cr-title">${ch.title}</span></div>
        </a>`;
      list.appendChild(row);
    });
  }
})();
</script>
</body>
</html>
