<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Editor Hub ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    * { box-sizing: border-box; }
    body { background: #0d0d0d; color: #f0f0f0; font-family: 'Lato', Arial, sans-serif; min-height: 100vh; margin: 0; padding: 0; }
    a { color: inherit; }
    [hidden] { display: none !important; }

    .ed-page { max-width: 1100px; margin: 0 auto; padding: 6rem 1.5rem 5rem; }
    .ed-title {
      font-family: 'Cinzel', serif; font-size: 2.1rem; font-weight: 700; color: #f0f0f0;
      margin: 0 0 1.5rem;
    }
    .ed-tabs {
      display: flex; gap: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 2rem;
    }
    .ed-tab {
      background: none; border: none; cursor: pointer; color: #999;
      font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700;
      padding: 0.9rem 0.1rem; position: relative;
    }
    .ed-tab:hover { color: #ccc; }
    .ed-tab.active { color: #f0f0f0; }
    .ed-tab.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 3px; background: #f0c060; border-radius: 2px;
    }

    .ed-layout { display: grid; grid-template-columns: 240px 1fr; gap: 2rem; align-items: start; }

    /* Left column card — search on top, create button underneath, same
       glass-card recipe used for side boxes elsewhere in fanpages. */
    .ed-side-box {
      background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.1rem;
      display: flex; flex-direction: column; gap: 0.9rem;
    }
    .ed-search-wrap { position: relative; }
    .ed-search-icon {
      position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);
      color: #7fa8d9; font-size: 0.85rem; pointer-events: none; opacity: 0.8;
    }
    .ed-search-input {
      width: 100%; box-sizing: border-box;
      background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.14); border-radius: 20px;
      padding: 0.6rem 0.9rem 0.6rem 2.15rem; color: #f0f0f0; font-family: inherit; font-size: 0.85rem;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3);
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .ed-search-input:focus {
      outline: none; border-color: #7fa8d9; background: rgba(127,168,217,0.07);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.3), 0 0 0 3px rgba(127,168,217,0.18);
    }
    .ed-search-input::placeholder { color: #777; }
    .ed-search-count { font-size: 0.74rem; color: #888; padding: 0 0.2rem; }

    .ed-side-rule { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.15rem 0; }

    /* Same size/shape as the search bar, not the old oversized square card. */
    .ed-create-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      width: 100%; box-sizing: border-box;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); border: none; border-radius: 20px;
      padding: 0.65rem 0.9rem; cursor: pointer; text-decoration: none;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700; color: #fff; text-align: center;
      box-shadow: 0 0 14px rgba(107,63,160,0.5);
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .ed-create-btn:hover { box-shadow: 0 0 22px rgba(107,63,160,0.75); transform: translateY(-1px); }
    .ed-create-btn-icon { font-size: 1rem; line-height: 1; }

    .ed-list-col { display: flex; flex-direction: column; gap: 1rem; min-width: 0; }
    .ed-empty {
      color: #999; font-size: 0.9rem; padding: 3rem 1rem; text-align: center;
      border: 1px dashed rgba(255,255,255,0.12); border-radius: 14px;
    }

    /* Wattpad-style horizontal card */
    .ed-card {
      display: flex; align-items: center; gap: 1.1rem;
      background: #161616; border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 0.9rem 1.1rem; text-decoration: none; color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .ed-card:hover { border-color: rgba(240,192,96,0.4); background: #1a1a1a; }
    .ed-card-img {
      width: 56px; height: 56px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
      background: #222; border: 1px solid rgba(255,255,255,0.1);
    }
    .ed-card-img--story { width: 46px; height: 66px; border-radius: 6px; }
    .ed-card-info { flex: 1; min-width: 0; }
    .ed-card-title {
      font-size: 1rem; font-weight: 700; margin: 0 0 0.2rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ed-card-sub { font-size: 0.82rem; color: #999; margin: 0; }
    .ed-card-arrow { flex-shrink: 0; color: #666; font-size: 1.3rem; }
    .ed-card:hover .ed-card-arrow { color: #f0c060; }

    @media (max-width: 700px) {
      .ed-layout { grid-template-columns: 1fr; }
      .ed-create-btn { min-height: 90px; flex-direction: row; }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>

<main class="ed-page">
  <h1 class="ed-title">My Editor Hub</h1>

  <div class="ed-tabs">
    <button class="ed-tab active" id="ed-tab-stories" type="button" data-tab="stories">Stories</button>
    <button class="ed-tab" id="ed-tab-characters" type="button" data-tab="characters">Characters</button>
    <button class="ed-tab" id="ed-tab-gallery" type="button" data-tab="gallery">Gallery</button>
  </div>

  <div class="ed-layout">
    <div class="ed-create-col">
      <div class="ed-side-box">
        <div class="ed-search-wrap">
          <span class="ed-search-icon">🔍</span>
          <input type="text" class="ed-search-input" id="ed-search-input" placeholder="Find a story, character, art..." />
        </div>
        <p class="ed-search-count" id="ed-search-count" hidden></p>
        <hr class="ed-side-rule" />
        <a class="ed-create-btn" id="ed-create-btn" href="/fanpages/create">
          <span class="ed-create-btn-icon">➕</span>
          <span id="ed-create-btn-label">Create Story</span>
        </a>
      </div>
    </div>
    <div class="ed-list-col" id="ed-list"><p class="ed-empty">Loading…</p></div>
  </div>
</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
  const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
  if (!token) window.location.href = `/fanpages/login?from=${encodeURIComponent(window.location.pathname)}`;

  function escapeHtml(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  const TABS = ['stories', 'characters', 'gallery'];
  const CREATE_CONFIG = {
    stories:    { href: '/fanpages/create',          label: 'Create Story' },
    characters: { href: '/fanpages/create-character', label: 'Create Character' },
    gallery:    { href: '/fanpages/create-gallery',   label: 'Create Gallery' },
  };
  const SEARCH_FIELD = { stories: 'site_title', characters: 'name', gallery: 'title' };
  const SEARCH_PLACEHOLDER = {
    stories: 'Find a story...', characters: 'Find a character...', gallery: 'Find gallery art...',
  };

  let USERNAME = null;
  let currentTab = 'stories';
  const cache = { stories: null, characters: null, gallery: null };

  function switchEdTab(tab) {
    currentTab = tab;
    TABS.forEach(t => document.getElementById(`ed-tab-${t}`).classList.toggle('active', t === tab));
    document.getElementById('ed-create-btn').href = CREATE_CONFIG[tab].href;
    document.getElementById('ed-create-btn-label').textContent = CREATE_CONFIG[tab].label;
    const searchInput = document.getElementById('ed-search-input');
    searchInput.value = '';
    searchInput.placeholder = SEARCH_PLACEHOLDER[tab];
    document.getElementById('ed-search-count').hidden = true;
    history.replaceState(null, '', tab === 'stories' ? location.pathname : `#${tab}`);
    renderTab(tab);
  }
  TABS.forEach(t => document.getElementById(`ed-tab-${t}`).addEventListener('click', () => switchEdTab(t)));

  // Live client-side search — everything for a tab is already loaded/cached,
  // so filtering as-you-type is instant with no extra requests.
  document.getElementById('ed-search-input').addEventListener('input', function () {
    const q = this.value.trim().toLowerCase();
    const items = cache[currentTab] || [];
    const countEl = document.getElementById('ed-search-count');
    if (!q) { countEl.hidden = true; renderItems(currentTab, items); return; }
    const field = SEARCH_FIELD[currentTab];
    const filtered = items.filter(item => String(item[field] || '').toLowerCase().includes(q));
    countEl.hidden = false;
    countEl.textContent = `${filtered.length} match${filtered.length === 1 ? '' : 'es'}`;
    renderItems(currentTab, filtered, true);
  });

  function edCard(href, imgSrc, imgClass, title, sub) {
    const a = document.createElement('a');
    a.className = 'ed-card';
    a.href = href;
    a.innerHTML = `
      <img class="ed-card-img ${imgClass || ''}" src="${imgSrc}" alt="" />
      <div class="ed-card-info">
        <p class="ed-card-title">${escapeHtml(title)}</p>
        <p class="ed-card-sub">${escapeHtml(sub)}</p>
      </div>
      <span class="ed-card-arrow">→</span>
    `;
    return a;
  }

  async function loadStories() {
    if (cache.stories) return cache.stories;
    const res = await fetch('/api/moderator/my-sites', { headers: authHeaders() });
    const data = await res.json();
    cache.stories = data.sites || [];
    return cache.stories;
  }
  async function loadCharacters() {
    if (cache.characters) return cache.characters;
    const res = await fetch('/api/characters/mine', { headers: authHeaders() });
    const data = await res.json();
    cache.characters = data.characters || [];
    return cache.characters;
  }
  async function loadGallery() {
    if (cache.gallery) return cache.gallery;
    if (!USERNAME) {
      const me = await fetch('/api/auth/me', { headers: authHeaders() }).then(r => r.json()).catch(() => null);
      USERNAME = me && me.user ? me.user.username : null;
    }
    if (!USERNAME) { cache.gallery = []; return cache.gallery; }
    const res = await fetch(`/api/fanpage-profile/${USERNAME}/all-gallery`, { headers: authHeaders() });
    const data = await res.json();
    cache.gallery = data.gallery || [];
    return cache.gallery;
  }

  // Builds the cards for a given tab from an already-loaded items array —
  // shared by the initial render and the live search filter, so filtering
  // never has to re-fetch anything.
  function renderItems(tab, items, isFiltered) {
    const list = document.getElementById('ed-list');
    if (!items.length) {
      list.innerHTML = isFiltered
        ? '<p class="ed-empty">No matches.</p>'
        : `<p class="ed-empty">No ${tab === 'stories' ? 'stories' : tab} yet — create your first one!</p>`;
      return;
    }
    list.innerHTML = '';
    if (tab === 'stories') {
      items.forEach(s => list.appendChild(edCard(
        `/fanpages/${s.story_path || s.slug}/edit?from=hub`,
        s.cover_url || '/images/defaultcover.png', 'ed-card-img--story',
        s.site_title, 'Click to edit this story →'
      )));
    } else if (tab === 'characters') {
      items.forEach(c => list.appendChild(edCard(
        `/fanpages/create-character?id=${c.id}`,
        c.ref_image || '/images/defaultchar.jpg', '',
        c.name, 'Click to edit or delete'
      )));
    } else {
      items.forEach(g => list.appendChild(edCard(
        `/fanpages/create-gallery?id=${g.id}`,
        g.image, '',
        g.title || 'Untitled', `${(g.category || 'sfw').toUpperCase()} — Click to edit or delete`
      )));
    }
  }

  async function renderTab(tab) {
    const list = document.getElementById('ed-list');
    list.innerHTML = '<p class="ed-empty">Loading…</p>';
    try {
      const items = tab === 'stories' ? await loadStories() : tab === 'characters' ? await loadCharacters() : await loadGallery();
      renderItems(tab, items, false);
    } catch {
      list.innerHTML = '<p class="ed-empty">Couldn\'t load this right now.</p>';
    }
  }

  const initialTab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'stories';
  switchEdTab(initialTab);
</script>

</body>
</html>
