<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <script>
    // Inlined here (rather than loading fanpages-nav.js) because this page
    // redirects away almost immediately -- an external script wouldn't have
    // a meaningful chance to run first. Keep in sync with the FP_BASE/fpUrl
    // definitions at the top of fanpages/fanpages-nav.js.
    window.FP_BASE = /^(www\.)?btwfics\.net$/.test(location.hostname) ? '' : '/fanpages';
    window.fpUrl = function (path) {
      return window.FP_BASE + (path || '/');
    };
    document.write('<link rel="canonical" href="' + window.fpUrl('/admin#bulletin') + '">');
    window.location.replace(window.fpUrl('/admin#bulletin'));
  </script>
  <noscript><meta http-equiv="refresh" content="1; url=/fanpages/admin#bulletin" /></noscript>
  <title>Redirecting… ✦ BTW</title>
</head>
<body>
<p>The Hub Image Builder moved to <a href="/fanpages/admin#bulletin">Admin → Bulletin</a>.</p>
</body>
</html>
