<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    body { background: #0d0d0d; }
    .auth-wrapper { padding-top: 6.5rem; }
  </style>
</head>
<body>

<!-- This page only exists as a landing target for links that carry a real
     query string (email activation autotoken, password-reset token, or a
     gated redirect's ?from=). Visiting it with none of those just opens the
     same "Welcome" modal every other page uses, over a blank background,
     and closing it sends you back to ?from (or home) since there's no real
     page underneath to reveal. -->
<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<main class="auth-wrapper">
  <div class="auth-card" id="reset-card" style="display:none">

    <!-- ── Reset password (arrived via ?reset=token) ── -->
    <div class="auth-panel auth-panel--reset" id="panel-reset">
      <h2 class="auth-heading">Set New Password</h2>
      <div id="reset-alert" class="auth-alert" hidden></div>
      <form class="auth-form" id="reset-form" novalidate>
        <div class="auth-field auth-field--password">
          <input type="password" id="reset-password" name="password"
                 placeholder="New password" autocomplete="new-password" required />
          <button type="button" class="auth-eye" aria-label="Toggle" data-target="reset-password">&#128065;</button>
        </div>
        <div class="auth-field auth-field--password">
          <input type="password" id="reset-confirm" name="confirm"
                 placeholder="Confirm new password" autocomplete="new-password" required />
          <button type="button" class="auth-eye" aria-label="Toggle" data-target="reset-confirm">&#128065;</button>
        </div>
        <button type="submit" class="auth-btn auth-btn--primary">Update Password</button>
      </form>
    </div>

  </div>
</main>

<footer>
  <p>Between Two Worlds is a pokémon fanfiction! I am not affiliated with Nintendo or Game Freak. This website is simply a fandom page, nothing more</p>
</footer>

<script>
  const API = '/api';
  const params = new URLSearchParams(location.search);
  const from = params.get('from') || '/';

  // Auto-login from welcome email link — fetch user data first so nav shows name
  const autoToken = params.get('autotoken');
  if (autoToken) {
    fetch('/api/auth/me', { headers: { 'Authorization': `Bearer ${autoToken}` } })
      .then(r => r.json())
      .then(data => {
        localStorage.setItem('btw_token', autoToken);
        if (data.user) localStorage.setItem('btw_user', JSON.stringify(data.user));
      })
      .catch(() => { localStorage.setItem('btw_token', autoToken); })
      .finally(() => { window.location.href = from; });
  }

  // Toggle password visibility (reset panel)
  document.querySelectorAll('.auth-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.classList.toggle('auth-eye--visible');
    });
  });

  function showAlert(id, message, type = 'error') {
    const el = document.getElementById(id);
    el.textContent = message;
    el.className = `auth-alert auth-alert--${type}`;
    el.hidden = false;
  }

  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.style.opacity = loading ? '0.6' : '';
  }

  // ── Reset password flow (arrived via ?reset=token) ─────────────────────────
  const resetToken = params.get('reset');
  if (resetToken) {
    document.getElementById('reset-card').style.display = 'flex';
  } else if (!autoToken) {
    // No token of any kind — just show the same Welcome modal every other
    // page uses, in standalone mode (closing it sends you to ?from/home).
    window.fpOpenLoginModal({ standalone: true, from });
  }

  document.getElementById('reset-form').addEventListener('submit', async e => {
    e.preventDefault();
    const btn      = e.target.querySelector('button[type=submit]');
    const password = document.getElementById('reset-password').value;
    const confirm  = document.getElementById('reset-confirm').value;
    if (password !== confirm) { showAlert('reset-alert', 'Passwords do not match.'); return; }
    if (password.length < 8)  { showAlert('reset-alert', 'Password must be at least 8 characters.'); return; }
    setLoading(btn, true);
    try {
      const res  = await fetch(`${API}/auth/reset-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: resetToken, password }),
      });
      const data = await res.json();
      if (!res.ok) { showAlert('reset-alert', data.error || 'Reset failed.'); }
      else {
        showAlert('reset-alert', data.message + ' Redirecting to login…', 'success');
        setTimeout(() => { window.location.href = window.fpUrl('/login'); }, 2500);
      }
    } catch { showAlert('reset-alert', 'Network error. Please try again.'); }
    finally { setLoading(btn, false); }
  });
</script>

</body>
</html>
