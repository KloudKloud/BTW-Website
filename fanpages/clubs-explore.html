<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore ✦ Clubs ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    .soc-layout { position: relative; z-index: 1; }

    .soc-sidebar {
      position: fixed; top: 64px; left: 0; bottom: 0; width: 250px; z-index: 5;
      display: flex; flex-direction: column; overflow-y: auto;
      padding: 1.1rem 1.25rem; box-sizing: border-box;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
      border-right: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 4px 0 30px rgba(0,0,0,0.35);
      transition: width 0.2s ease;
    }
    .soc-sidebar-toggle {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; align-self: flex-end; margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
      color: #ccc; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .soc-sidebar-toggle:hover { background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04)); color: #fff; }
    .soc-layout.soc-collapsed .soc-sidebar { width: 56px; padding-left: 0.6rem; padding-right: 0.6rem; }
    .soc-layout.soc-collapsed .soc-sidebar-content { display: none; }
    .soc-layout.soc-collapsed .soc-main { margin-left: 56px; }
    .soc-sidebar-user-wrap { position: relative; margin-bottom: 0.5rem; }
    .soc-sidebar-user {
      display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: inherit;
      padding: 0.4rem 0.4rem 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.08);
      width: 100%; background: none; border-left: none; border-right: none; border-top: none;
      cursor: pointer; font-family: inherit; text-align: left;
    }
    .soc-sidebar-avatar, .soc-sidebar-avatar-fallback { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .soc-sidebar-avatar-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.25rem; }
    .soc-sidebar-username { font-weight: 700; font-size: 1.1rem; color: #f0f0f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .soc-sidebar-login { font-size: 1rem; color: #7fa8d9; text-decoration: none; display: block; padding: 0.4rem 0.4rem 0.9rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .soc-sidebar-guest-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      padding: 0.75rem 0.4rem 1.1rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .soc-sidebar-guest-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
    .soc-sidebar-guest-tag { font-weight: 700; font-size: 1rem; color: #f0f0f0; }
    .soc-sidebar-guest-signin-btn {
      background: #93b8e2; color: #0a0a0a; border: none; border-radius: 16px; padding: 0.4rem 1.1rem;
      font-weight: 700; font-size: 0.85rem; cursor: pointer; font-family: inherit;
    }
    .soc-sidebar-guest-signin-btn:hover { background: #a8c6e8; }
    .soc-sidebar-note-signin-btn {
      display: inline-block; margin-top: 0.4rem; background: #93b8e2; color: #0a0a0a; border: none;
      border-radius: 14px; padding: 0.35rem 0.9rem; font-weight: 700; font-size: 0.8rem; cursor: pointer; font-family: inherit;
    }
    .soc-sidebar-note-signin-btn:hover { background: #a8c6e8; }
    .soc-sidebar-user-menu {
      position: absolute; top: 100%; left: 0.2rem; right: 0.2rem; margin-top: 0.35rem;
      background: #1c1c1e; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.45); padding: 0.5rem; z-index: 60;
    }
    .soc-sidebar-user-menu-status-text {
      font-size: 0.82rem; color: #ccc; line-height: 1.5; margin: 0;
      padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 0.3rem;
    }
    .soc-sidebar-user-menu-status-hint { color: #888; font-weight: 400; }
    .soc-sidebar-user-menu-divider { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.35rem 0.4rem; }
    .soc-sidebar-user-menu-item {
      display: block; padding: 0.55rem 0.6rem; border-radius: 6px; color: #ddd;
      text-decoration: none; font-size: 0.9rem;
    }
    .soc-sidebar-user-menu-item:hover { background: rgba(255,255,255,0.08); }

    .soc-sidebar-nav {
      display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
      gap: 0.2rem; position: static; height: auto; padding: 0; background: none; border: none; backdrop-filter: none;
    }
    .soc-nav-link {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.5rem; border-radius: 8px;
      color: #ccc; text-decoration: none; font-size: 1.05rem; font-weight: 600; transition: background 0.15s, color 0.15s;
    }
    .soc-nav-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .soc-nav-link.active { color: #f0c060; background: rgba(240,192,96,0.1); }
    .soc-nav-icon { width: 1.3em; text-align: center; font-size: 1.1rem; }
    .soc-nav-create-btn {
      display: flex; align-items: center; gap: 0.5rem; width: 100%; margin-top: 0.4rem;
      background: linear-gradient(135deg, #3d3a52, #5a4f78); border: none; color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif; font-weight: 600;
      font-size: 1.05rem; padding: 0.65rem 0.75rem; border-radius: 20px; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .soc-nav-create-btn:hover {
      transform: translateY(-1px); background: linear-gradient(135deg, #47435f, #665887);
      box-shadow: 0 3px 9px rgba(0,0,0,0.3);
    }
    .soc-sidebar-rule { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.9rem 0; }
    .soc-sidebar-label { font-size: 0.88rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #999; padding: 0 0.5rem; margin-bottom: 0.5rem; }
    .soc-sidebar-clubs { display: flex; flex-direction: column; gap: 0.15rem; }
    .soc-sidebar-club-link {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.5rem; border-radius: 8px;
      color: #ddd; text-decoration: none; font-size: 1rem; transition: background 0.15s;
    }
    .soc-sidebar-club-link:hover { background: rgba(255,255,255,0.06); }
    .soc-sidebar-club-icon, .soc-sidebar-club-icon-fallback { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .soc-sidebar-club-icon-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 0.82rem; }
    .soc-sidebar-club-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .soc-sidebar-club-owner-rose { flex-shrink: 0; font-size: 0.85rem; }
    .soc-sidebar-empty, .soc-sidebar-note { font-size: 0.9rem; color: #888; padding: 0.4rem 0.5rem; line-height: 1.5; }
    .soc-sidebar-label-row { display: flex; align-items: center; justify-content: space-between; padding: 0 0.5rem; margin-bottom: 0.5rem; }
    .soc-sidebar-label-row .soc-sidebar-label { padding: 0; margin-bottom: 0; }
    .soc-sidebar-collapse-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 6px;
      color: #ccc; cursor: pointer; width: 22px; height: 22px; padding: 0;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: transform 0.2s, color 0.15s, background 0.15s;
    }
    .soc-sidebar-collapse-btn svg { width: 15px; height: 15px; }
    .soc-sidebar-collapse-btn:hover { color: #fff; background: rgba(255,255,255,0.12); }
    .soc-sidebar-collapse-btn.soc-collapsed { transform: rotate(180deg); }
    #soc-mod-content { transition: none; }
    #soc-mod-content.soc-collapsed { display: none; }
    .soc-sidebar-manage-btn {
      display: flex; align-items: center; gap: 0.6rem; width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      color: #ddd; font-family: inherit; font-size: 0.95rem; font-weight: 600; text-align: left;
      padding: 0.55rem 0.6rem; cursor: pointer; transition: background 0.15s; margin-bottom: 0.35rem;
    }
    .soc-sidebar-manage-btn:hover { background: rgba(255,255,255,0.08); }
    .soc-sidebar-showall-btn {
      background: none; border: none; color: #7fa8d9; font-family: inherit; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; padding: 0.4rem 0.5rem; text-align: left;
    }
    .soc-sidebar-showall-btn:hover { text-decoration: underline; }
    .soc-sidebar-club-role-badge {
      flex-shrink: 0; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
      color: #f0c060; background: rgba(240,192,96,0.12); border: 1px solid rgba(240,192,96,0.3);
      border-radius: 10px; padding: 0.1em 0.5em;
    }
    .soc-manage-list { display: flex; flex-direction: column; gap: 0.3rem; max-height: 50vh; overflow-y: auto; margin-bottom: 1rem; }

    .soc-main { margin-left: 250px; padding: 1.5rem 2.5rem 5rem; transition: margin-left 0.2s ease; }

    .soc-create-types-box {
      background: linear-gradient(160deg, rgba(240,192,96,0.1), rgba(107,63,160,0.06));
      border: 1px solid rgba(240,192,96,0.3); border-radius: 14px;
      padding: 0.9rem; box-shadow: 0 0 20px rgba(240,192,96,0.08);
    }

    .ce-heading { font-family: 'Fredoka', 'Lato', cursive; font-size: 1.7rem; font-weight: 700; color: #fff; margin-bottom: 1.25rem; }

    /* ── Topics row -- horizontally scrollable pill strip, "All" always
       first and always present. ── */
    .ce-topics-wrap {
      display: flex; align-items: center; gap: 0.5rem; padding-bottom: 0.85rem; margin-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .ce-topics-row {
      display: flex; gap: 0.6rem; overflow-x: auto; min-width: 0; scroll-behavior: smooth;
      /* Arrow buttons replace the scrollbar as the way to page through this
         row -- the underlying mechanism is still a native scroll (just
         driven by button clicks instead of a visible scrollbar/dragging),
         so the bar itself stays hidden in both engines. */
      scrollbar-width: none;
    }
    .ce-topics-row::-webkit-scrollbar { display: none; }
    .ce-topics-arrow {
      flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); color: #ddd;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s, opacity 0.15s;
    }
    .ce-topics-arrow:hover:not(:disabled) { background: rgba(255,255,255,0.14); color: #fff; }
    .ce-topics-arrow:disabled { opacity: 0.3; cursor: default; }
    .ce-topic-pill {
      flex-shrink: 0; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #ccc;
      border-radius: 20px; padding: 0.5em 1.1em; font-family: inherit; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .ce-topic-pill:hover { color: #fff; border-color: rgba(240,192,96,0.4); }
    .ce-topic-pill.active { background: #f0c060; border-color: #f0c060; color: #14121a; }

    .ce-section-title { font-family: 'Fredoka', 'Lato', cursive; font-size: 1.3rem; font-weight: 700; color: #f0f0f0; margin: 2rem 0 1rem; }
    .ce-section-title:first-of-type { margin-top: 0; }
    .ce-empty { color: rgba(255,255,255,0.4); padding: 1.5rem 0; }

    /* ── Club cards -- icon/name/topic-row/description/member-count, Join
       button bottom-right. Reddit-Explore-inspired but far simpler --
       no banner image, no live visitor count (we don't track that; member
       count stands in for it). ── */
    .ce-club-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .ce-club-card {
      display: flex; flex-direction: column; text-decoration: none; color: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 1.1rem;
      transition: border-color 0.15s, background 0.15s;
    }
    .ce-club-card:hover { border-color: rgba(240,192,96,0.4); background: rgba(255,255,255,0.08); }
    .ce-club-card-head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .ce-club-card-icon, .ce-club-card-icon-fallback { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .ce-club-card-icon-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.1rem; }
    .ce-club-card-name { font-size: 1.05rem; font-weight: 700; color: #fff; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ce-club-card-meta { font-size: 0.78rem; color: #999; margin-top: 0.1rem; }
    .ce-club-card-desc {
      font-size: 0.86rem; color: #bbb; line-height: 1.5; margin-bottom: 0.85rem; flex: 1;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }
    .ce-club-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
    .ce-club-card-types { display: flex; flex-wrap: wrap; gap: 0.3rem; min-width: 0; }
    .ce-club-card-type-tag {
      font-size: 0.68rem; font-weight: 700; color: #a8c6e8; background: rgba(127,168,217,0.12);
      border: 1px solid rgba(127,168,217,0.3); border-radius: 8px; padding: 0.15em 0.5em; white-space: nowrap;
    }
    .ce-join-btn {
      flex-shrink: 0; background: rgba(127,168,217,0.15); border: 1px solid rgba(127,168,217,0.5); color: #cfe0f5;
      border-radius: 14px; padding: 0.35em 0.9em; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .ce-join-btn:hover { background: rgba(127,168,217,0.28); }
    .ce-join-btn.ce-joined { background: rgba(127,168,217,0.3); color: #fff; cursor: default; }

    @media (max-width: 860px) {
      .soc-sidebar { position: static; width: auto; height: auto; border-right: none; }
      .soc-main { margin-left: 0; padding: 1.5rem 1.25rem 4rem; }
      .soc-layout.soc-collapsed .soc-main { margin-left: 0; }
    }

    /* ── Mobile (≤720px): Reddit-style off-canvas drawer for the club
       sidebar, same pattern as social.html — see that file's ≤720px block
       for the full rationale. Collapsed by default, entirely separate from
       the desktop icon-rail's .soc-collapsed/localStorage state. ── */
    .soc-mobile-toprow { display: none; }
    @media (max-width: 720px) {
      .soc-sidebar {
        position: fixed; top: 0; left: -80vw; bottom: 0; width: 78vw; max-width: 300px;
        height: auto; border-right: none; z-index: 300;
        padding: 1.5rem 1.25rem 1.1rem;
        transition: left 0.28s ease;
        box-shadow: 8px 0 40px rgba(0,0,0,0.55);
        /* Same fix as social.html: solid-ish background of its own instead
           of relying on backdrop-filter (which creates a containing block
           for position:fixed descendants -- was silently pinning the old
           nested toggle button to the drawer's own off-screen position). */
        background: linear-gradient(175deg, rgba(16,14,22,0.97), rgba(16,14,22,0.94));
        backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      .soc-layout.soc-mobile-drawer-open .soc-sidebar { left: 0; }
      /* While the drawer is open, force the shared top nav bar to stay
         pinned/visible (it's normally position:relative on mobile, so it
         scrolls away with the page) and start the drawer below it instead
         of at the very top of the viewport -- without this, whatever sat
         at the top of the drawer's own content (a pfp, in practice) was
         rendering right underneath the topbar and reading as "cut off" by
         it. Reverts to normal the instant the drawer closes. */
      body.soc-drawer-open #fanpages-topbar-root {
        position: fixed; top: 0; left: 0; right: 0; z-index: 320;
      }
      body.soc-drawer-open .soc-sidebar { top: 76px; }
      body.soc-drawer-open .soc-mobile-drawer-backdrop { top: 76px; }
      /* See social.html: overriding just `display:flex` here (to defeat
         the desktop collapse's display:none) defaults to flex-direction:
         row, which laid every section out side by side instead of
         stacked -- explicit column fixes it. */
      .soc-sidebar-content { display: flex; flex-direction: column; }
      .soc-sidebar-toggle { display: none; }
      .soc-mobile-drawer-backdrop {
        display: none; position: fixed; inset: 0; z-index: 290;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      }
      .soc-layout.soc-mobile-drawer-open .soc-mobile-drawer-backdrop { display: block; }
      .soc-main, .soc-layout.soc-collapsed .soc-main { margin-left: 0; padding-top: 0.5rem; }

      /* In-flow top row (hamburger only, no search on this page) sitting
         directly under the shared topbar -- see social.html for the fuller
         rationale/its own search-relocation variant. */
      .soc-mobile-toprow { display: flex; align-items: center; padding: 0.7rem 0.9rem; box-sizing: border-box; }
      .soc-mobile-drawer-toggle {
        flex-shrink: 0; display: flex; align-items: center; justify-content: center;
        width: 38px; height: 38px; border-radius: 10px;
        background: rgba(255,255,255,0.06); border: 1px solid rgba(127,168,217,0.4);
        color: #cfe0f5; cursor: pointer; box-shadow: 0 0 12px rgba(127,168,217,0.28);
      }
      .soc-mobile-drawer-toggle:hover { color: #fff; border-color: rgba(127,168,217,0.7); }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="page-bg">
  <img src="/images/gallery/solusgarnet_17.png" alt="" />
  <div class="page-bg-overlay"></div>
</div>

<div class="soc-layout" id="soc-layout">

  <div class="soc-mobile-drawer-backdrop" id="soc-mobile-drawer-backdrop"></div>

  <div class="soc-mobile-toprow" id="soc-mobile-toprow">
    <button class="soc-mobile-drawer-toggle" id="soc-mobile-drawer-toggle" type="button" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
  </div>

  <aside class="soc-sidebar">
    <button class="soc-sidebar-toggle" id="soc-sidebar-toggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">☰</button>

    <div class="soc-sidebar-content" id="soc-sidebar-content">
      <div id="soc-sidebar-user-slot"></div>

      <nav class="soc-sidebar-nav">
        <a class="soc-nav-link" id="soc-nav-home" href="/fanpages/social"><span class="soc-nav-icon">🏠</span> Home</a>
        <a class="soc-nav-link" id="soc-nav-recent" href="/fanpages/clubs-recent"><span class="soc-nav-icon">🕓</span> Recent</a>
        <a class="soc-nav-link active" id="soc-nav-explore" href="/fanpages/clubs-explore"><span class="soc-nav-icon">🧭</span> Explore</a>
        <button class="soc-nav-create-btn" id="soc-create-club-btn" type="button"><span>+</span> Start a Club</button>
      </nav>

      <hr class="soc-sidebar-rule" />
      <p class="soc-sidebar-label">Your Clubs</p>
      <hr class="soc-sidebar-rule" />
      <div class="soc-sidebar-clubs" id="soc-sidebar-clubs"><p class="soc-sidebar-empty">Loading…</p></div>

      <div id="soc-sidebar-moderation-section" style="display:none;">
        <hr class="soc-sidebar-rule" />
        <div class="soc-sidebar-label-row">
          <p class="soc-sidebar-label">Moderation</p>
          <button class="soc-sidebar-collapse-btn" id="soc-mod-collapse-btn" type="button" title="Collapse" aria-label="Collapse Moderation section">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"></polyline></svg>
          </button>
        </div>
        <hr class="soc-sidebar-rule" />
        <div id="soc-mod-content">
          <button class="soc-sidebar-manage-btn" id="soc-mod-manage-btn" type="button"><span>⚙️</span> Manage</button>
          <div class="soc-sidebar-clubs" id="soc-sidebar-mod-clubs"></div>
          <button class="soc-sidebar-showall-btn" id="soc-mod-showall-btn" type="button" style="display:none;">Show All</button>
        </div>
      </div>
    </div>
  </aside>

  <main class="soc-main">
    <p class="ce-heading">Explore Clubs</p>
    <div class="ce-topics-wrap">
      <button class="ce-topics-arrow" id="ce-topics-prev" type="button" aria-label="Previous topics" disabled>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="ce-topics-row" id="ce-topics-row"></div>
      <button class="ce-topics-arrow" id="ce-topics-next" type="button" aria-label="Next topics">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div id="ce-content">
      <p class="ce-empty">Loading…</p>
    </div>
  </main>

</div>

<!-- Manage Communities modal -->
<div class="char-editor-overlay" id="soc-manage-overlay" hidden>
  <div class="char-editor-modal">
    <h2 class="char-editor-title">Manage Communities</h2>
    <div class="soc-manage-list" id="soc-manage-list"></div>
    <div class="char-editor-actions">
      <button class="mod-btn" id="soc-manage-close" type="button">Close</button>
    </div>
  </div>
</div>

<!-- Create Club modal -->
<div class="char-editor-overlay" id="soc-create-overlay" hidden>
  <div class="char-editor-modal">
    <h2 class="char-editor-title">Create a Club</h2>
    <div class="mod-field">
      <label for="soc-create-name">Club Name</label>
      <input class="mod-input" id="soc-create-name" maxlength="60" placeholder="e.g. Cafe Plaisir" />
    </div>
    <div class="mod-field">
      <label>Topics <span style="font-weight:400;color:#888;">(pick 1 to 3 — required, helps people find your club)</span></label>
      <div class="soc-create-types-box">
        <div class="wiki-meta-check-row" id="soc-create-types"></div>
      </div>
    </div>
    <div class="mod-field" style="margin-bottom:0;">
      <label>NSFW?</label>
      <div class="nsfw-toggle-row">
        <label class="nsfw-toggle-switch">
          <input type="checkbox" id="soc-create-nsfw-toggle" />
          <span class="nsfw-toggle-slider"></span>
        </label>
        <span class="nsfw-toggle-label nsfw-toggle-label--sfw" id="soc-create-nsfw-label">SFW</span>
      </div>
      <p class="nsfw-toggle-note">If this club features adult discussions, posts, or media, please label it as NSFW :3</p>
    </div>
    <p class="mod-panel-msg" id="soc-create-msg"></p>
    <div class="char-editor-actions">
      <button class="mod-btn" id="soc-create-cancel" type="button">Cancel</button>
      <button class="mod-btn" id="soc-create-save" type="button">Create</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
window.fpFixLinks();
document.getElementById('soc-nav-home').href = window.fpUrl('/social');
document.getElementById('soc-nav-recent').href = window.fpUrl('/clubs-recent');
document.getElementById('soc-nav-explore').href = window.fpUrl('/clubs-explore');
let currentUser = null;
try {
  const raw = localStorage.getItem('btw_user') || sessionStorage.getItem('btw_user');
  if (raw) currentUser = JSON.parse(raw);
} catch {}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Sidebar: user block ─────────────────────────────────────────────────
const sidebarUserSlot = document.getElementById('soc-sidebar-user-slot');
if (token && currentUser) {
  const avatarHtml = currentUser.avatar
    ? `<img class="soc-sidebar-avatar" src="${currentUser.avatar}" alt="" />`
    : `<span class="soc-sidebar-avatar-fallback">${escapeHtml((currentUser.display_name || currentUser.username || '?').charAt(0).toUpperCase())}</span>`;
  sidebarUserSlot.innerHTML = `
    <div class="soc-sidebar-user-wrap">
      <button type="button" class="soc-sidebar-user" id="soc-sidebar-user-btn">
        ${avatarHtml}
        <span class="soc-sidebar-username">${escapeHtml(currentUser.display_name || currentUser.username)}</span>
      </button>
      <div class="soc-sidebar-user-menu" id="soc-sidebar-user-menu" hidden>
        <a class="soc-sidebar-user-menu-item" href="${window.fpUrl('/your-posts')}">Your Posts</a>
        <hr class="soc-sidebar-user-menu-divider" />
        <a class="soc-sidebar-user-menu-item" href="${window.fpUrl(`/${encodeURIComponent(currentUser.username)}`)}">View Profile</a>
        <a class="soc-sidebar-user-menu-item" href="${window.fpUrl('/account-settings')}">Account Settings</a>
      </div>
    </div>
  `;
  const menuBtn = document.getElementById('soc-sidebar-user-btn');
  const menu = document.getElementById('soc-sidebar-user-menu');
  menuBtn.addEventListener('click', (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; });
  document.addEventListener('click', (e) => {
    if (!menu.hidden && !e.target.closest('.soc-sidebar-user-wrap')) menu.hidden = true;
  });
} else {
  sidebarUserSlot.innerHTML = `
    <div class="soc-sidebar-guest-wrap">
      <img class="soc-sidebar-guest-avatar" src="/images/defaultchar.jpg" alt="" />
      <span class="soc-sidebar-guest-tag">Guest</span>
      <button type="button" class="soc-sidebar-guest-signin-btn" id="soc-sidebar-guest-signin-btn">Sign In</button>
    </div>
  `;
  document.getElementById('soc-sidebar-guest-signin-btn').addEventListener('click', () => window.fpOpenLoginModal());
}

function clubIconHtml(club, sizeClass) {
  if (club.icon_url) return `<img class="${sizeClass}" src="${club.icon_url}" alt="" />`;
  const letter = escapeHtml((club.name || '?').charAt(0).toUpperCase());
  return `<span class="${sizeClass}-fallback">${letter}</span>`;
}

// ── Sidebar: Moderation (owned/admin) + Your Clubs (every membership) ────
let modClubsCache = [];
async function loadSidebarClubs() {
  const wrap = document.getElementById('soc-sidebar-clubs');
  const modSection = document.getElementById('soc-sidebar-moderation-section');
  if (!token) {
    wrap.innerHTML = '<p class="soc-sidebar-note">Sign in to see your clubs~ <button type="button" class="soc-sidebar-note-signin-btn" id="soc-sidebar-clubs-signin-btn">Sign In</button></p>';
    document.getElementById('soc-sidebar-clubs-signin-btn').addEventListener('click', () => window.fpOpenLoginModal());
    modSection.style.display = 'none';
    return;
  }
  try {
    const res = await fetch(`${API}/clubs?mine=1&limit=50`, { headers: authHeaders() });
    const data = await res.json();
    const clubs = data.clubs || [];

    modClubsCache = clubs.filter(c => c.viewer_role === 'owner' || c.viewer_role === 'admin');
    modSection.style.display = modClubsCache.length ? '' : 'none';
    renderModClubsPreview();

    if (!clubs.length) {
      wrap.innerHTML = '<p class="soc-sidebar-note">You haven\'t joined any clubs yet.</p>';
      return;
    }
    wrap.innerHTML = '';
    clubs.forEach(c => wrap.appendChild(sidebarClubLink(c, c.viewer_role === 'owner')));
  } catch {
    wrap.innerHTML = '<p class="soc-sidebar-note">Couldn\'t load your clubs.</p>';
    modSection.style.display = 'none';
  }
}
function sidebarClubLink(c, showOwnerRose) {
  const a = document.createElement('a');
  a.className = 'soc-sidebar-club-link';
  a.href = window.fpUrl(`/club?slug=${encodeURIComponent(c.slug)}`);
  a.innerHTML = `${clubIconHtml(c, 'soc-sidebar-club-icon')}<span class="soc-sidebar-club-name">${escapeHtml(c.name)}</span>${showOwnerRose ? '<span class="soc-sidebar-club-owner-rose" title="You own this club">🌹</span>' : ''}`;
  return a;
}
function sidebarModClubLink(c) {
  const a = document.createElement('a');
  a.className = 'soc-sidebar-club-link';
  a.href = window.fpUrl(`/club?slug=${encodeURIComponent(c.slug)}`);
  a.innerHTML = `${clubIconHtml(c, 'soc-sidebar-club-icon')}<span class="soc-sidebar-club-name">${escapeHtml(c.name)}</span><span class="soc-sidebar-club-role-badge">${c.viewer_role}</span>`;
  return a;
}
let modPreviewExpanded = false;
function renderModClubsPreview() {
  const wrap = document.getElementById('soc-sidebar-mod-clubs');
  const showAllBtn = document.getElementById('soc-mod-showall-btn');
  wrap.innerHTML = '';
  const shown = modPreviewExpanded ? modClubsCache : modClubsCache.slice(0, 5);
  shown.forEach(c => wrap.appendChild(sidebarModClubLink(c)));
  showAllBtn.style.display = (!modPreviewExpanded && modClubsCache.length > 5) ? 'block' : 'none';
}
document.getElementById('soc-mod-showall-btn').addEventListener('click', () => {
  modPreviewExpanded = true;
  renderModClubsPreview();
});
const modCollapseBtn = document.getElementById('soc-mod-collapse-btn');
function setModCollapsed(collapsed) {
  modCollapseBtn.classList.toggle('soc-collapsed', collapsed);
  document.getElementById('soc-mod-content').classList.toggle('soc-collapsed', collapsed);
  localStorage.setItem('soc_mod_collapsed', collapsed ? '1' : '0');
}
modCollapseBtn.addEventListener('click', () => setModCollapsed(!modCollapseBtn.classList.contains('soc-collapsed')));
if (localStorage.getItem('soc_mod_collapsed') === '1') setModCollapsed(true);
document.getElementById('soc-mod-manage-btn').addEventListener('click', () => {
  const list = document.getElementById('soc-manage-list');
  list.innerHTML = modClubsCache.length ? '' : '<p class="soc-sidebar-note">Nothing to manage yet.</p>';
  modClubsCache.forEach(c => list.appendChild(sidebarModClubLink(c)));
  document.getElementById('soc-manage-overlay').hidden = false;
});
document.getElementById('soc-manage-close').addEventListener('click', () => {
  document.getElementById('soc-manage-overlay').hidden = true;
});

// ── Create Club modal ────────────────────────────────────────────────────
let clubTypesCatalog = [];
async function loadClubTypesCatalog() {
  if (clubTypesCatalog.length) return clubTypesCatalog;
  try {
    const res = await fetch(`${API}/club-types`);
    if (res.ok) clubTypesCatalog = (await res.json()).types || [];
  } catch {}
  return clubTypesCatalog;
}
function buildTypeChecks(selected) {
  const wrap = document.getElementById('soc-create-types');
  wrap.innerHTML = '';
  clubTypesCatalog.forEach(({ name, emoji }) => {
    const isChecked = selected.includes(name);
    const label = document.createElement('label');
    label.className = 'wiki-meta-check-item' + (isChecked ? ' wiki-meta-check-item--checked' : '');
    label.innerHTML = `<input type="checkbox" value="${escapeHtml(name)}" ${isChecked ? 'checked' : ''} /> <span>${emoji} ${escapeHtml(name)}</span>`;
    const input = label.querySelector('input');
    input.addEventListener('change', () => {
      const checkedCount = wrap.querySelectorAll('input:checked').length;
      if (input.checked && checkedCount > 3) { input.checked = false; return; }
      label.classList.toggle('wiki-meta-check-item--checked', input.checked);
    });
    wrap.appendChild(label);
  });
}
document.getElementById('soc-create-club-btn').addEventListener('click', async () => {
  if (!token) { window.fpRequireSignIn('To start a club, you must create an account!'); return; }
  document.getElementById('soc-create-name').value = '';
  document.getElementById('soc-create-nsfw-toggle').checked = false;
  document.getElementById('soc-create-nsfw-label').textContent = 'SFW';
  document.getElementById('soc-create-nsfw-label').classList.add('nsfw-toggle-label--sfw');
  document.getElementById('soc-create-msg').textContent = '';
  await loadClubTypesCatalog();
  buildTypeChecks([]);
  document.getElementById('soc-create-overlay').hidden = false;
});
document.getElementById('soc-create-cancel').addEventListener('click', () => {
  document.getElementById('soc-create-overlay').hidden = true;
});
document.getElementById('soc-create-nsfw-toggle').addEventListener('change', function () {
  const label = document.getElementById('soc-create-nsfw-label');
  label.textContent = this.checked ? 'NSFW' : 'SFW';
  label.classList.toggle('nsfw-toggle-label--sfw', !this.checked);
});
document.getElementById('soc-create-save').addEventListener('click', async () => {
  const msgEl = document.getElementById('soc-create-msg');
  const name = document.getElementById('soc-create-name').value.trim();
  if (!name) { msgEl.className = 'mod-panel-msg mod-panel-msg--error'; msgEl.textContent = 'A club name is required.'; return; }
  const isNsfw = document.getElementById('soc-create-nsfw-toggle').checked;
  const clubTypes = Array.from(document.querySelectorAll('#soc-create-types input:checked')).map(c => c.value);
  if (!clubTypes.length) { msgEl.className = 'mod-panel-msg mod-panel-msg--error'; msgEl.textContent = 'Pick at least one Topic for your club.'; return; }

  const btn = document.getElementById('soc-create-save');
  btn.disabled = true;
  btn.textContent = 'Creating…';
  try {
    const res = await fetch(`${API}/clubs`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ name, is_nsfw: isNsfw, club_types: clubTypes }),
    });
    const data = await res.json();
    if (!res.ok) {
      msgEl.className = 'mod-panel-msg mod-panel-msg--error';
      msgEl.textContent = data.error || 'Something went wrong. Please try again.';
      return;
    }
    window.location.href = window.fpUrl(`/club?slug=${encodeURIComponent(data.club.slug)}`);
  } catch {
    msgEl.className = 'mod-panel-msg mod-panel-msg--error';
    msgEl.textContent = 'Network error. Please try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Create';
  }
});

loadSidebarClubs();

// ── Explore content ───────────────────────────────────────────────────────
function clubCard(c) {
  const a = document.createElement('a');
  a.className = 'ce-club-card';
  a.href = window.fpUrl(`/club?slug=${encodeURIComponent(c.slug)}`);
  const typesHtml = (c.club_types || []).slice(0, 3)
    .map(t => `<span class="ce-club-card-type-tag">${escapeHtml(t)}</span>`).join('');
  a.innerHTML = `
    <div class="ce-club-card-head">
      ${clubIconHtml(c, 'ce-club-card-icon')}
      <div style="min-width:0;">
        <p class="ce-club-card-name">${escapeHtml(c.name)}</p>
        <p class="ce-club-card-meta">${c.member_count.toLocaleString()} member${c.member_count === 1 ? '' : 's'}${c.is_nsfw ? ' · NSFW' : ''}</p>
      </div>
    </div>
    <p class="ce-club-card-desc">${escapeHtml(c.description || 'No description yet.')}</p>
    <div class="ce-club-card-foot">
      <div class="ce-club-card-types">${typesHtml}</div>
    </div>
  `;
  if (c.viewer_role) return a;
  const joinBtn = document.createElement('button');
  joinBtn.type = 'button';
  joinBtn.className = 'ce-join-btn';
  joinBtn.textContent = '+ Join';
  joinBtn.addEventListener('click', async (e) => {
    e.preventDefault(); e.stopPropagation();
    if (!token) { window.fpOpenLoginModal(); return; }
    joinBtn.disabled = true;
    try {
      const res = await fetch(`${API}/clubs/${encodeURIComponent(c.slug)}/join`, { method: 'POST', headers: authHeaders() });
      if (res.ok) { joinBtn.textContent = '✓ Joined'; joinBtn.classList.add('ce-joined'); }
    } catch {}
    joinBtn.disabled = false;
  });
  a.querySelector('.ce-club-card-foot').appendChild(joinBtn);
  return a;
}
function clubGrid(clubs) {
  const grid = document.createElement('div');
  grid.className = 'ce-club-grid';
  clubs.forEach(c => grid.appendChild(clubCard(c)));
  return grid;
}

async function loadExploreDefault() {
  const content = document.getElementById('ce-content');
  content.innerHTML = '<p class="ce-empty">Loading…</p>';
  try {
    const res = await fetch(`${API}/clubs-explore`, { headers: authHeaders() });
    const data = await res.json();
    content.innerHTML = '';

    const recTitle = document.createElement('p');
    recTitle.className = 'ce-section-title';
    recTitle.textContent = 'Recommended for you';
    content.appendChild(recTitle);
    if (data.recommended && data.recommended.length) {
      content.appendChild(clubGrid(data.recommended));
    } else {
      content.insertAdjacentHTML('beforeend', '<p class="ce-empty">Join a club or two and we\'ll start recommending more like them~</p>');
    }

    (data.sections || []).forEach(section => {
      const title = document.createElement('p');
      title.className = 'ce-section-title';
      title.textContent = section.title;
      content.appendChild(title);
      content.appendChild(clubGrid(section.clubs));
    });
  } catch {
    content.innerHTML = '<p class="ce-empty">Couldn\'t load Explore right now.</p>';
  }
}

async function loadExploreByType(type) {
  const content = document.getElementById('ce-content');
  content.innerHTML = '<p class="ce-empty">Loading…</p>';
  try {
    const res = await fetch(`${API}/clubs?type=${encodeURIComponent(type)}&limit=60`, { headers: authHeaders() });
    const data = await res.json();
    const clubs = data.clubs || [];
    content.innerHTML = '';
    const title = document.createElement('p');
    title.className = 'ce-section-title';
    title.textContent = type;
    content.appendChild(title);
    if (clubs.length) content.appendChild(clubGrid(clubs));
    else content.insertAdjacentHTML('beforeend', '<p class="ce-empty">No clubs under this topic yet.</p>');
  } catch {
    content.innerHTML = '<p class="ce-empty">Couldn\'t load these clubs right now.</p>';
  }
}

async function initTopicsRow() {
  const row = document.getElementById('ce-topics-row');
  const types = await loadClubTypesCatalog();
  row.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'ce-topic-pill active';
  allBtn.textContent = 'All';
  allBtn.addEventListener('click', () => {
    row.querySelectorAll('.ce-topic-pill').forEach(b => b.classList.toggle('active', b === allBtn));
    loadExploreDefault();
  });
  row.appendChild(allBtn);
  types.forEach(({ name, emoji }) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'ce-topic-pill';
    btn.textContent = `${emoji} ${name}`;
    btn.addEventListener('click', () => {
      row.querySelectorAll('.ce-topic-pill').forEach(b => b.classList.toggle('active', b === btn));
      loadExploreByType(name);
    });
    row.appendChild(btn);
  });
  wireTopicsArrows();
}

// Left/right arrows page through the topics row instead of a visible
// scrollbar -- each click scrolls by ~90% of the visible width (so the
// next click's leading pill overlaps slightly with what was last visible,
// same "paged" feel as Reddit's own topic row). The left arrow starts
// disabled since there's nothing before "All", and re-disables any time
// we scroll back to the start; same idea in reverse at the far end.
function wireTopicsArrows() {
  const row = document.getElementById('ce-topics-row');
  const prevBtn = document.getElementById('ce-topics-prev');
  const nextBtn = document.getElementById('ce-topics-next');
  function updateArrows() {
    prevBtn.disabled = row.scrollLeft <= 4;
    nextBtn.disabled = row.scrollLeft >= row.scrollWidth - row.clientWidth - 4;
  }
  prevBtn.onclick = () => row.scrollBy({ left: -row.clientWidth * 0.9, behavior: 'smooth' });
  nextBtn.onclick = () => row.scrollBy({ left: row.clientWidth * 0.9, behavior: 'smooth' });
  row.addEventListener('scroll', updateArrows);
  window.addEventListener('resize', updateArrows);
  updateArrows();
}

initTopicsRow();
loadExploreDefault();

// ── Collapsible sidebar (persisted, Reddit-style) ────────────────────────
const socLayout = document.getElementById('soc-layout');
const sidebarToggleBtn = document.getElementById('soc-sidebar-toggle');
function setSidebarCollapsed(collapsed) {
  socLayout.classList.toggle('soc-collapsed', collapsed);
  const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
  sidebarToggleBtn.title = label;
  sidebarToggleBtn.setAttribute('aria-label', label);
  localStorage.setItem('soc_sidebar_collapsed', collapsed ? '1' : '0');
}
function isMobileNav() { return window.innerWidth <= 720; }
if (!isMobileNav() && localStorage.getItem('soc_sidebar_collapsed') === '1') setSidebarCollapsed(true);
sidebarToggleBtn.addEventListener('click', () => setSidebarCollapsed(!socLayout.classList.contains('soc-collapsed')));

// ── Mobile-only: Reddit-style off-canvas drawer (see the ≤720px block in
// <style>) — entirely separate from the desktop icon-rail collapse above,
// doesn't persist across visits, always starts closed on load. Its own
// toggle button lives in the in-flow .soc-mobile-toprow, not nested inside
// .soc-sidebar (backdrop-filter containing-block gotcha -- see social.html). ──
const mobileDrawerBackdrop = document.getElementById('soc-mobile-drawer-backdrop');
const mobileDrawerToggle = document.getElementById('soc-mobile-drawer-toggle');
function setMobileDrawerOpen(open) {
  socLayout.classList.toggle('soc-mobile-drawer-open', open);
  document.body.classList.toggle('soc-drawer-open', open);
  document.body.style.overflow = open ? 'hidden' : '';
}
mobileDrawerBackdrop.addEventListener('click', () => setMobileDrawerOpen(false));
mobileDrawerToggle.addEventListener('click', () => setMobileDrawerOpen(!socLayout.classList.contains('soc-mobile-drawer-open')));
window.addEventListener('resize', () => {
  if (isMobileNav()) socLayout.classList.remove('soc-collapsed');
  else setMobileDrawerOpen(false);
});
</script>

</body>
