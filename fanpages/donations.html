<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donations ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    .fp-donate-bg {
      position: fixed; inset: 0; z-index: -1;
      background: url('/images/home/browse-background-4.png') center / cover no-repeat;
    }
    .fp-donate-bg::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(160deg, rgba(10,8,14,0.6), rgba(10,8,14,0.5));
    }
    .fp-donate-wrapper {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 7rem 1.5rem 3rem;
      box-sizing: border-box;
    }
    .fp-donate-card {
      max-width: 520px;
      width: 100%;
      background: linear-gradient(160deg, rgba(10,8,14,0.82), rgba(10,8,14,0.76)), url('/images/home/box-background-3.png');
      background-size: cover;
      background-position: center;
      border: 1px solid rgba(255,255,255,0.14);
      border-top: 3px solid var(--rose);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .fp-donate-icon { font-size: 2.4rem; margin-bottom: 0.75rem; }
    .fp-donate-title {
      font-family: 'Fredoka', 'Lato', cursive;
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--gold);
      margin-bottom: 0;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .fp-donate-title img { width: 26px; height: 26px; object-fit: contain; flex-shrink: 0; }
    .fp-donate-body {
      font-family: 'Fredoka', 'Lato', cursive;
      color: #ddd; font-size: 1.02rem; line-height: 1.65;
      margin: 1.5rem 0 2rem;
    }
    .fp-donate-btns { display: flex; gap: 0.85rem; }
    .fp-donate-btn {
      flex: 1 1 0; display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      text-decoration: none; font-family: 'Fredoka', 'Lato', cursive; font-weight: 700; font-size: 0.98rem;
      color: #fff; padding: 0.85rem 1rem; border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .fp-donate-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.45); }
    .fp-donate-btn--kofi { background: linear-gradient(135deg, #29abe0, #1a7fae); }
    .fp-donate-btn--paypal { background: linear-gradient(135deg, #2a9fd6, #0b3d91); }
    @media (max-width: 480px) {
      .fp-donate-btns { flex-direction: column; }
      .fp-donate-card { padding: 2.25rem 1.5rem; }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>

<div class="fp-donate-bg"></div>

<main class="fp-donate-wrapper">
  <div class="fp-donate-card">

    <div class="fp-donate-icon">💜</div>
    <h1 class="fp-donate-title">Support BTW <img src="/images/home/decoration-2.png" alt="" /></h1>
    <div class="author-rule" style="margin: 1rem auto 0;"></div>

    <p class="fp-donate-body">
      Donations help keep this website running and funneling hugs into this
      'vee. Any and all support is greatly appreciated! &lt;3
    </p>

    <div class="fp-donate-btns" id="fp-donate-btns"></div>

  </div>
</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  // Links built in JS rather than inlined as static href markup.
  var KOFI_URL = 'https://ko-fi.com/veekitpaws';
  var PAYPAL_URL = 'https://www.paypal.com/donate?business=mewtwosmew%40gmail.com&currency_code=USD';
  var wrap = document.getElementById('fp-donate-btns');
  var kofi = document.createElement('a');
  kofi.className = 'fp-donate-btn fp-donate-btn--kofi';
  kofi.href = KOFI_URL; kofi.target = '_blank'; kofi.rel = 'noopener';
  kofi.dataset.skipLeavingWarning = '1';
  kofi.textContent = '☕ Ko-fi';
  var paypal = document.createElement('a');
  paypal.className = 'fp-donate-btn fp-donate-btn--paypal';
  paypal.href = PAYPAL_URL; paypal.target = '_blank'; paypal.rel = 'noopener';
  paypal.dataset.skipLeavingWarning = '1';
  paypal.textContent = '💳 PayPal';
  wrap.appendChild(kofi);
  wrap.appendChild(paypal);
</script>
</body>
</html>
