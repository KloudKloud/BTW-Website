<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create an account ✦ Between Two Worlds</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <script src="/fanpages/fanpages-nav.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Inter', 'Lato', sans-serif;
      background: #0a0908;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .signup-bg {
      position: fixed; inset: 0; z-index: -2;
      background-image: url('/images/gallery/solusgarnet_17.png');
      background-size: cover; background-position: center;
      filter: blur(14px) brightness(0.55) saturate(1.05);
      transform: scale(1.08); /* hide the blurred edge */
    }
    .signup-bg-overlay {
      position: fixed; inset: 0; z-index: -1;
      background: linear-gradient(120deg, rgba(10,9,8,0.75) 0%, rgba(10,9,8,0.45) 55%, rgba(10,9,8,0.75) 100%);
    }

    .signup-brand {
      position: fixed; top: 1.75rem; left: 2rem; z-index: 5;
    }
    .signup-brand a {
      color: #f0c060; text-decoration: none; font-family: 'Cinzel', serif;
      font-size: 1.15rem; font-weight: 600; text-shadow: 0 0 16px rgba(240,192,96,0.4);
    }
    .signup-brand a:hover { color: #ffd888; }

    .signup-wrap {
      position: relative; z-index: 2;
      width: 100%; max-width: 440px;
      margin: 3rem 4vw 3rem 0;
      padding: 2.6rem 2.4rem 2.2rem;
      background: linear-gradient(165deg, #1a1510, #0c0a08);
      border: 1px solid rgba(240,192,96,0.28);
      border-radius: 18px;
      box-shadow: 0 0 0 1px rgba(240,192,96,0.05), 0 24px 70px rgba(0,0,0,0.6), 0 0 40px rgba(240,192,96,0.06);
    }

    .signup-heading {
      font-family: 'Fredoka', 'Inter', sans-serif;
      font-size: 2.1rem;
      font-weight: 600;
      color: #f0c060;
      text-shadow: 0 0 22px rgba(240,192,96,0.35);
      text-align: center;
      margin: 0 0 0.3rem;
    }
    .signup-subtitle {
      text-align: center; font-size: 0.88rem; color: rgba(230,220,200,0.55); margin: 0 0 1.5rem;
    }

    .signup-age-notice {
      display: flex; align-items: flex-start; gap: 0.6rem;
      font-size: 0.82rem; line-height: 1.55; color: rgba(230,220,200,0.8);
      background: rgba(217,90,90,0.09);
      border: 1px solid rgba(217,90,90,0.3);
      border-radius: 10px;
      padding: 0.75rem 0.9rem;
      margin-bottom: 1.4rem;
    }
    .signup-age-notice .signup-age-icon { font-size: 1.1rem; line-height: 1; flex-shrink: 0; }
    .signup-age-notice strong { color: #e8849e; }

    .signup-form { display: flex; flex-direction: column; gap: 0.9rem; }
    .signup-field { position: relative; }
    .signup-field label {
      display: block; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.02em;
      color: rgba(240,192,96,0.75); margin-bottom: 0.35rem;
    }
    .signup-field input {
      width: 100%;
      background: #171310;
      border: 1px solid rgba(240,192,96,0.18);
      border-radius: 9px;
      color: #f2ece0;
      font-family: 'Lato', sans-serif;
      font-size: 0.93rem;
      padding: 0.75rem 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .signup-field input::placeholder { color: rgba(242,236,224,0.32); }
    .signup-field input:focus { border-color: rgba(240,192,96,0.6); }
    .signup-field--password input { padding-right: 2.8rem; }
    .signup-eye {
      position: absolute; right: 0.75rem; bottom: 0.7rem;
      background: none; border: none; cursor: pointer;
      color: rgba(242,236,224,0.3); font-size: 1rem; padding: 0; line-height: 1;
      transition: color 0.2s;
    }
    .signup-eye:hover, .signup-eye--visible { color: #f0c060; }

    .signup-btn {
      width: 100%; padding: 0.85rem; border: none; border-radius: 9px;
      font-family: 'Lato', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.03em;
      cursor: pointer; margin-top: 0.5rem; transition: opacity 0.2s, transform 0.15s;
      background: linear-gradient(135deg, #f0c060, #d4a03f); color: #1a1510;
    }
    .signup-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .signup-btn:active { transform: translateY(0); }
    .signup-btn:disabled { opacity: 0.55; cursor: default; transform: none; }

    .signup-alert {
      font-size: 0.85rem; padding: 0.65rem 0.9rem; border-radius: 7px; margin-bottom: 0.9rem; line-height: 1.5;
    }
    .signup-alert--error   { background: rgba(194,84,122,0.15); color: #e8849e; border: 1px solid rgba(194,84,122,0.3); }
    .signup-alert--success { background: rgba(80,160,100,0.15); color: #7dd4a0; border: 1px solid rgba(80,160,100,0.3); }

    .signup-login-row {
      text-align: center; font-size: 0.86rem; color: rgba(230,220,200,0.55); margin: 1.4rem 0 0;
    }
    .signup-login-row a { color: #f0c060; font-weight: 700; text-decoration: none; cursor: pointer; }
    .signup-login-row a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      body { justify-content: center; }
      .signup-wrap { margin: 2rem 1rem; max-width: 420px; }
      .signup-brand { left: 1.25rem; }
    }
  </style>
</head>
<body>

<div class="signup-bg"></div>
<div class="signup-bg-overlay"></div>

<div class="signup-brand"><a id="signup-home-link" href="/">Between Two Worlds</a></div>

<div class="signup-wrap">
  <h1 class="signup-heading">Create an account</h1>
  <p class="signup-subtitle">Join the Between Two Worlds community</p>

  <div class="signup-age-notice">
    <span class="signup-age-icon">🔒</span>
    <span>You must be <strong>18 or older</strong> to register. Creating an account grants access to mature content.</span>
  </div>

  <div id="signup-alert" class="signup-alert" hidden></div>

  <form class="signup-form" id="signup-form" novalidate>
    <div class="signup-field">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" name="username" placeholder="Choose a username" autocomplete="off" required />
    </div>
    <div class="signup-field">
      <label for="reg-email">Email address</label>
      <input type="email" id="reg-email" name="email" placeholder="you@example.com" autocomplete="email" required />
    </div>
    <div class="signup-field signup-field--password">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" name="password" placeholder="At least 8 characters" autocomplete="new-password" required />
      <button type="button" class="signup-eye" data-target="reg-password" aria-label="Toggle password visibility">&#128065;</button>
    </div>
    <div class="signup-field signup-field--password">
      <label for="reg-confirm">Confirm password</label>
      <input type="password" id="reg-confirm" name="confirm" placeholder="Type it again" autocomplete="new-password" required />
      <button type="button" class="signup-eye" data-target="reg-confirm" aria-label="Toggle password visibility">&#128065;</button>
    </div>
    <button type="submit" class="signup-btn">Create Account</button>
  </form>

  <p class="signup-login-row" id="signup-login-row">Already have an account? <a href="#" id="signup-login-link">Log in</a></p>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const from = params.get('from') || '/';
  document.getElementById('signup-home-link').href = from;

  document.getElementById('signup-login-link').addEventListener('click', (e) => {
    e.preventDefault();
    window.fpOpenLoginModal({ standalone: true, from });
  });

  document.querySelectorAll('.signup-eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.classList.toggle('signup-eye--visible');
    });
  });

  function showAlert(message, type = 'error') {
    const el = document.getElementById('signup-alert');
    el.textContent = message;
    el.className = `signup-alert signup-alert--${type}`;
    el.hidden = false;
  }

  function setLoading(btn, loading) {
    btn.disabled = loading;
    btn.textContent = loading ? 'Creating account…' : 'Create Account';
  }

  document.getElementById('signup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn      = e.target.querySelector('button[type=submit]');
    const username = document.getElementById('reg-username').value.trim();
    const email     = document.getElementById('reg-email').value.trim();
    const password  = document.getElementById('reg-password').value;
    const confirm   = document.getElementById('reg-confirm').value;

    if (!username || !email || !password || !confirm) {
      showAlert('Please fill in all fields.');
      return;
    }
    if (password !== confirm) {
      showAlert('Passwords do not match.');
      return;
    }
    if (password.length < 8) {
      showAlert('Password must be at least 8 characters.');
      return;
    }

    setLoading(btn, true);
    try {
      const res  = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, email, password, from }),
      });
      const data = await res.json();
      if (!res.ok) {
        showAlert(data.error || 'Registration failed.');
        return;
      }
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('signup-login-row').style.display = 'none';
      showAlert(`Activation email sent to ${email} — check your inbox and click the link to activate your account. Be sure to check spam!`, 'success');
    } catch {
      showAlert('Network error. Please try again.');
    } finally {
      setLoading(btn, false);
    }
  });
</script>

</body>
</html>
