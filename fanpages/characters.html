<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Characters ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <!-- Pulls in the shared character-profile (.char-*/.art-*) and comment
       (.cc-*) styling the profile's Characters tab uses, so the in-page
       detail view opened from this browse grid can look identical to it. -->
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      background: #0d0d0d; color: #f0f0f0;
      font-family: 'Baloo 2', 'Fredoka', 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* Same treatment as the Posts search/browse pages -- potential-box-
       background art, lightly blurred (not the old heavy blur(18px)
       wallpaper), and scrolling with the page instead of staying pinned
       (position:absolute with height measured in JS to match the full
       page, since percentage/inset heights can't resolve against a body
       whose height is just "however tall its content is"). */
    .fp-bg-img {
      /* Starts right where the sidebar ends instead of running full-bleed
         underneath it -- 280px column + the 2.5rem the sidebar's own
         negative margin pulls it flush past. */
      position: absolute; top: 0; left: calc(280px + 2.5rem); right: 0; bottom: auto;
      width: calc(100% - 280px - 2.5rem); height: 100vh; object-fit: cover;
      filter: blur(4px); z-index: 0;
    }
    .fp-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.45); z-index: 0; }
    .fp-content-z { position: relative; z-index: 1; }

    .fp-layout {
      padding: 0 2.5rem 5rem;
      display: grid; grid-template-columns: 280px 1fr; column-gap: 2rem; align-items: stretch;
    }

    /* ── Left sidebar — pfp/username, keyword search, and the browse
       filter menu (All/Your/Followed/Liked). ── */
    .fp-char-sidebar {
      position: sticky; top: 76px;
      margin-bottom: -5rem; margin-left: -2.5rem;
      height: calc(100vh - 76px); max-height: calc(100vh - 76px);
      display: flex; flex-direction: column;
      background: linear-gradient(175deg, rgba(14,12,20,0.75), rgba(14,12,20,0.68)), url('/images/home/box-background-4.jpg');
      background-size: cover; background-position: center;
      border-right: 2px solid rgba(255,255,255,0.4);
      padding: 1.5rem; overflow-y: auto;
      scrollbar-color: #444 transparent;
      overscroll-behavior: contain;
    }
    .fp-char-sidebar::-webkit-scrollbar { width: 8px; }
    .fp-char-sidebar::-webkit-scrollbar-track { background: #1a1a1e; border-radius: 8px; }
    .fp-char-sidebar::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
    .fp-char-sidebar::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Signed-in viewer's own pfp + username, big and up top -- gives the
       sidebar a "this is your space" feel instead of a plain filter box. */
    .fp-char-viewer-box {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      gap: 0.6rem; margin-bottom: 1.5rem; padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .fp-char-viewer-avatar-wrap {
      width: 72px; height: 72px; border-radius: 50%; overflow: hidden;
      border: 2px solid rgba(240,192,96,0.55); box-shadow: 0 0 22px rgba(240,192,96,0.25);
    }
    .fp-char-viewer-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fp-char-viewer-avatar-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.7rem;
    }
    .fp-char-viewer-name { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .fp-char-viewer-login {
      display: block; text-decoration: none; color: #7fa8d9; font-size: 0.9rem; font-weight: 600;
      margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.1);
      text-align: center;
    }
    .fp-char-viewer-login:hover { color: #a8c6e8; }

    .fp-char-search-wrap { position: relative; margin-bottom: 1.5rem; }
    .fp-char-search-icon {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: #888; pointer-events: none;
    }
    /* Search input, sort select, and filter-menu buttons all share the
       same box-background-2 + scrim treatment as the rest of the boxed
       card system on this page, instead of a flat dark fill. */
    .fp-char-search-wrap input {
      width: 100%;
      background: linear-gradient(160deg, rgba(10,8,14,0.85), rgba(10,8,14,0.78)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 20px;
      color: #f0f0f0; font-family: inherit; font-size: 0.95rem; padding: 0.6em 0.9em 0.6em 2.4rem;
    }
    .fp-char-search-wrap input:focus { outline: none; border-color: #7fa8d9; }

    .fp-char-sort-wrap { margin-bottom: 1.5rem; }
    .fp-char-sort-wrap label {
      display: block; font-size: 0.78rem; font-weight: 700; color: #999; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 0.4rem;
    }
    .fp-char-sort-wrap select {
      width: 100%;
      background: linear-gradient(160deg, rgba(10,8,14,0.85), rgba(10,8,14,0.78)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
      color: #f0f0f0; font-family: inherit; font-size: 0.9rem; font-weight: 600; padding: 0.55em 0.7em;
    }
    .fp-char-sort-wrap select:focus { outline: none; border-color: #7fa8d9; }

    .fp-char-filter-menu { display: flex; flex-direction: column; gap: 0.4rem; }
    .fp-char-guest-filters { display: flex; flex-direction: column; gap: 0.4rem; }
    .fp-char-filter-item {
      display: flex; align-items: center; gap: 0.6rem;
      background: linear-gradient(160deg, rgba(10,8,14,0.85), rgba(10,8,14,0.78)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
      padding: 0.6em 0.85em; font-size: 0.9rem; font-weight: 600; color: #ccc; cursor: pointer;
      text-align: left; width: 100%; font-family: inherit; text-decoration: none;
      transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .fp-char-filter-item:hover { border-color: rgba(127,168,217,0.6); color: #fff; box-shadow: 0 0 16px rgba(127,168,217,0.25); }
    .fp-char-filter-item--active {
      border-color: rgba(240,192,96,0.65); color: #fff; box-shadow: 0 0 0 1px rgba(240,192,96,0.4), 0 0 20px rgba(240,192,96,0.35);
    }
    .fp-char-filter-icon { font-size: 1rem; }

    /* ── Main content — heading + card grid, 4-per-row and noticeably
       smaller than the old 3-per-row layout. ── */
    .fp-char-main-heading {
      font-family: 'Fredoka', 'Lato', cursive; font-size: 1.5rem; font-weight: 700; color: #fff;
      margin: 1.1rem 0 0.3rem;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .fp-char-main-heading img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
    .fp-char-main-sub { color: #ccc; font-size: 0.9rem; margin-bottom: 0.9rem; }
    .fp-char-main-sub strong { color: #fff; }
    .fp-char-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.7rem;
    }
    .fp-char-card {
      position: relative;
      display: block; text-decoration: none; color: inherit;
      background: #161616; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      overflow: hidden; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .fp-char-card:hover {
      transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,0.45); border-color: rgba(240,192,96,0.4);
    }
    .fp-char-card-img-wrap {
      position: relative; width: 100%; aspect-ratio: 1 / 1; background: #1e1e1e; overflow: hidden;
    }
    .fp-char-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fp-char-card-locked {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6); font-size: 1.6rem;
    }
    .fp-char-card-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 2rem;
    }
    /* Fixed height (not just padding-driven) so every card's info box is
       the exact same crop window every time -- a variable-height box
       (species pill present or not) against a big background image was
       cropping a different slice of it per card, reading as
       inconsistent even though background-position never changed. */
    .fp-char-card-body {
      position: relative; overflow: hidden; height: 72px; padding: 0.45rem 0.55rem 0.55rem;
      background: linear-gradient(160deg, rgba(10,8,14,0.82), rgba(10,8,14,0.72)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
    }
    .fp-char-card-body-deco { position: absolute; top: -8px; right: -6px; width: 26px; height: 26px; object-fit: contain; opacity: 0.9; pointer-events: none; }
    .fp-char-card-name-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
    .fp-char-card-name {
      font-family: 'Fredoka', 'Lato', cursive; font-size: 1.05rem; font-weight: 700; color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .fp-char-card-species {
      display: inline-block; flex-shrink: 0; background: rgba(127,168,217,0.16); color: #a8c6e8; border-radius: 20px;
      padding: 0.15em 0.6em; font-size: 0.92rem; font-weight: 700;
    }
    .fp-char-card-owner { font-size: 0.72rem; color: #999; }

    /* Like button — floats over the top-right corner of the image, same
       heart-toggle pattern used on gallery posts. */
    .fp-char-like-btn {
      position: absolute; top: 0.5rem; right: 0.5rem; z-index: 2;
      display: flex; align-items: center; gap: 0.3rem;
      background: rgba(10,10,10,0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
      padding: 0.28em 0.6em; font-size: 0.78rem; font-weight: 700; color: #fff; cursor: pointer;
      line-height: 1; transition: color 0.15s, border-color 0.15s, transform 0.1s;
    }
    .fp-char-like-btn:hover { border-color: rgba(240,192,96,0.6); transform: scale(1.05); }
    .fp-char-like-btn.liked { color: #f0708a; }
    .fp-char-like-btn .fp-char-like-icon { font-size: 0.9rem; }

    .fp-char-empty { color: #ddd; font-size: 1rem; padding: 2rem 0; grid-column: 1 / -1; }

    /* e621-style numbered pagination -- shown above AND below the grid. */
    .fp-pagination { display: flex; justify-content: center; align-items: center; gap: 0.35rem; margin: 1.25rem 0; flex-wrap: wrap; }
    .fp-page-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #ccc; border-radius: 8px;
      min-width: 2.2rem; height: 2.2rem; padding: 0 0.5em; cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 600;
    }
    .fp-page-btn:hover:not(:disabled):not(.fp-page-btn--active) { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-page-btn:disabled { opacity: 0.35; cursor: default; }
    .fp-page-btn--active { background: #f0c060; border-color: #f0c060; color: #14121a; box-shadow: 0 0 16px rgba(240,192,96,0.65); }
    .fp-page-ellipsis { color: #777; padding: 0 0.2rem; font-size: 0.9rem; }

    /* ── Character detail overlay — opened in-place from a card click,
       replaces the grid in the main column while the sidebar/background
       stay put. Reuses the profile Characters tab's own .char-*/.art-*/
       .cc-* classes (loaded from /style.css + /fanpages/fanpages.css) so
       it looks identical to that view -- just without its "Character
       Spotlights" side nav (this page already has its own sidebar), plus
       a Back button, and a prev/next slideshow that walks the current
       *search results* instead of the same owner's other characters. ── */
    .fp-char-back-btn {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #ddd;
      border-radius: 20px; padding: 0.5em 1.1em; font-family: inherit; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; margin: 1.1rem 0 1rem; transition: border-color 0.15s, color 0.15s, box-shadow 0.15s;
    }
    .fp-char-back-btn:hover { border-color: rgba(240,192,96,0.6); color: #fff; box-shadow: 0 0 16px rgba(240,192,96,0.25); }
    /* Cap the detail view's width instead of letting it stretch across the
       entire remaining page -- that's what made the (aspect-ratio 1:1)
       reference image balloon to a huge size. Matches the width the same
       card gets on the profile Characters tab, where it's the "main"
       column of a 240px-sidebar + capped-1240px-total layout, only
       left-aligned against this page's own sidebar instead of centered. */
    #fp-char-detail-view.chars-main { padding-bottom: 4rem; max-width: 900px; }

    @media (max-width: 1300px) {
      .fp-char-grid { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 1100px) {
      .fp-char-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 900px) {
      .fp-layout { grid-template-columns: 1fr; }
      .fp-char-sidebar {
        position: static; max-height: none; height: auto;
        margin-bottom: 0; margin-left: 0; border-radius: 18px;
        border-right: none; border-bottom: 1px solid rgba(255,255,255,0.14);
      }
      .fp-char-grid { grid-template-columns: repeat(3, 1fr); }
      .fp-bg-img { left: 0; width: 100%; }
    }
    @media (max-width: 560px) {
      .fp-char-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<img class="fp-bg-img" src="/images/home/potential-box-background.png" alt="" />
<div class="fp-bg-overlay"></div>

<div class="fp-content-z">
<div id="fanpages-topbar-root"></div>

<main class="fp-layout">
  <aside class="fp-char-sidebar">
    <div id="fp-char-viewer-slot"></div>

    <div class="fp-char-search-wrap">
      <svg class="fp-char-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="fp-char-search-input" placeholder="Search Keywords…" />
    </div>

    <div class="fp-char-sort-wrap">
      <label for="fp-char-sort-select">Sort</label>
      <select id="fp-char-sort-select">
        <option value="best_match">Best Match</option>
        <option value="updated">Date Updated</option>
        <option value="popular">Popular</option>
      </select>
    </div>

    <nav class="fp-char-filter-menu" id="fp-char-filter-menu">
      <button type="button" class="fp-char-filter-item" data-filter="">
        <span class="fp-char-filter-icon">🐾</span> All Characters
      </button>
      <div class="fp-guest-blur-wrap" id="fp-char-guest-filters-wrap">
        <div class="fp-char-guest-filters">
          <button type="button" class="fp-char-filter-item" data-filter="mine">
            <span class="fp-char-filter-icon">✨</span> Your Characters
          </button>
          <button type="button" class="fp-char-filter-item" data-filter="followed">
            <span class="fp-char-filter-icon">💫</span> Followed Characters
          </button>
          <button type="button" class="fp-char-filter-item" data-filter="liked">
            <span class="fp-char-filter-icon">💖</span> Liked Characters
          </button>
        </div>
        <div class="fp-guest-blur-overlay" id="fp-char-guest-filters-overlay" hidden><p><a href="#" id="fp-char-guest-filters-signin">Sign in</a> to create and save characters!</p></div>
      </div>
    </nav>
  </aside>

  <div>
    <div id="fp-char-list-view">
      <h1 class="fp-char-main-heading">Characters <img src="/images/home/decoration-1.png" alt="" /></h1>
      <p class="fp-char-main-sub" id="fp-char-main-sub"></p>
      <div class="fp-pagination" id="fp-pagination-top" hidden></div>
      <div class="fp-char-grid" id="fp-char-grid"><p class="fp-char-empty">Loading…</p></div>
      <div class="fp-pagination" id="fp-pagination-bottom" hidden></div>
    </div>

    <div id="fp-char-detail-view" class="chars-main" hidden>
      <button type="button" class="fp-char-back-btn" id="fp-char-back-btn">← Back to Characters</button>
      <div id="fp-char-profile" class="char-profile"></div>

      <div id="fp-char-detail-nav" class="art-nav"></div>

      <div class="cc-section" id="fp-char-detail-comments">
        <p class="cc-title">💬 Comments</p>
        <div class="cc-compose" id="fp-char-cc-compose" style="display:none;">
          <textarea id="fp-char-cc-compose-input" placeholder="Add a comment…" maxlength="2000"></textarea>
          <button class="cc-compose-btn" id="fp-char-cc-compose-btn" type="button">Post</button>
        </div>
        <div class="cc-list" id="fp-char-cc-list"><p class="cc-empty">Loading…</p></div>
      </div>
    </div>
  </div>
</main>
</div>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});

if (!token) {
  document.querySelector('#fp-char-guest-filters-wrap .fp-char-guest-filters').classList.add('fp-guest-blur-content');
  document.getElementById('fp-char-guest-filters-overlay').hidden = false;
  document.getElementById('fp-char-guest-filters-signin').addEventListener('click', (e) => {
    e.preventDefault();
    window.fpOpenLoginModal();
  });
}

const FILTER_LABELS = {
  '': 'All Characters', mine: 'Your Characters', followed: 'Followed Characters', liked: 'Liked Characters',
};

const SORT_OPTIONS = ['best_match', 'updated', 'popular'];

function readParams() {
  const p = new URLSearchParams(window.location.search);
  const filter = p.get('filter') || '';
  const sort = p.get('sort') || '';
  return {
    q: p.get('q') || '',
    filter: ['mine', 'followed', 'liked'].includes(filter) ? filter : '',
    sort: SORT_OPTIONS.includes(sort) ? sort : 'best_match',
    page: Math.max(1, parseInt(p.get('page'), 10) || 1),
  };
}

function goToParams(mutate) {
  const usp = new URLSearchParams(window.location.search);
  mutate(usp);
  window.location.search = usp.toString();
}

function paginationHtml(page, totalPages) {
  const pageSet = new Set([1, totalPages, page]);
  for (let i = page - 2; i <= page + 2; i++) if (i >= 1 && i <= totalPages) pageSet.add(i);
  const sorted = [...pageSet].sort((a, b) => a - b);
  let html = `<button type="button" class="fp-page-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
  let prev = 0;
  sorted.forEach(p => {
    if (p - prev > 1) html += '<span class="fp-page-ellipsis">…</span>';
    html += `<button type="button" class="fp-page-btn${p === page ? ' fp-page-btn--active' : ''}" data-page="${p}">${p}</button>`;
    prev = p;
  });
  html += `<button type="button" class="fp-page-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''} aria-label="Next page">›</button>`;
  return html;
}

function wirePagination(el) {
  el.querySelectorAll('.fp-page-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => goToParams(usp => usp.set('page', btn.dataset.page)));
  });
}

async function loadViewerBox() {
  const slot = document.getElementById('fp-char-viewer-slot');
  if (!token) {
    slot.innerHTML = `
      <div class="fp-char-viewer-box">
        <div class="fp-char-viewer-avatar-wrap"><img src="/images/defaultchar.jpg" alt="" /></div>
        <span class="fp-char-viewer-name">Guest</span>
      </div>
    `;
    return;
  }
  try {
    const res = await fetch('/api/auth/me', { headers: authHeaders() });
    if (!res.ok) throw new Error();
    const { user } = await res.json();
    const avatarHtml = user.avatar
      ? `<img src="${escapeHtml(user.avatar)}" alt="" style="object-position:${user.avatar_position_x != null ? user.avatar_position_x : 50}% ${user.avatar_position_y != null ? user.avatar_position_y : 50}%;" />`
      : `<div class="fp-char-viewer-avatar-fallback">${escapeHtml((user.display_name || user.username || '?').charAt(0).toUpperCase())}</div>`;
    slot.innerHTML = `
      <div class="fp-char-viewer-box">
        <a class="fp-char-viewer-avatar-wrap" href="${window.fpUrl(`/${encodeURIComponent(user.username)}`)}">${avatarHtml}</a>
        <a class="fp-char-viewer-name" href="${window.fpUrl(`/${encodeURIComponent(user.username)}`)}" style="text-decoration:none;">${escapeHtml(user.display_name || user.username)}</a>
      </div>
    `;
  } catch {
    slot.innerHTML = '';
  }
}

function charCardHtml(c) {
  const href = window.fpUrl(`/${escapeHtml(c.owner_username)}?char=${c.id}#characters`);
  const posX = c.position_x != null ? c.position_x : 50;
  const posY = c.position_y != null ? c.position_y : 50;
  const imgHtml = c.nsfw_locked
    ? `<div class="fp-char-card-locked">🔒</div>`
    : c.image
      ? `<img src="${escapeHtml(c.image)}" alt="" style="object-position:${posX}% ${posY}%;" />`
      : `<div class="fp-char-card-fallback">${escapeHtml((c.name[0] || '?').toUpperCase())}</div>`;
  return `
    <div class="fp-char-card">
      <a href="${href}" data-char-id="${c.id}">
        <div class="fp-char-card-img-wrap">${imgHtml}</div>
        <div class="fp-char-card-body">
          <img class="fp-char-card-body-deco" src="/images/home/decoration-8.png" alt="" />
          <div class="fp-char-card-name-row">
            <p class="fp-char-card-name">${escapeHtml(c.name)}</p>
            ${c.species ? `<span class="fp-char-card-species">${escapeHtml(c.species)}</span>` : ''}
          </div>
          <p class="fp-char-card-owner">by ${escapeHtml(c.owner)}</p>
        </div>
      </a>
      <button type="button" class="fp-char-like-btn${c.liked ? ' liked' : ''}" data-char-id="${c.id}" aria-label="Like this character">
        <span class="fp-char-like-icon">${c.liked ? '♥' : '♡'}</span><span class="fp-char-like-count">${c.like_count || 0}</span>
      </button>
    </div>
  `;
}

function wireLikeButtons(root) {
  root.querySelectorAll('.fp-char-like-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }
      const id = btn.dataset.charId;
      const liked = btn.classList.contains('liked');
      btn.disabled = true;
      try {
        const res = await fetch(`/api/moderator/character/${id}/like`, { method: liked ? 'DELETE' : 'POST', headers: authHeaders() });
        const data = await res.json();
        btn.classList.toggle('liked', data.liked);
        btn.querySelector('.fp-char-like-icon').textContent = data.liked ? '♥' : '♡';
        btn.querySelector('.fp-char-like-count').textContent = data.like_count;
      } catch {}
      btn.disabled = false;
    });
  });
}

// ── Character detail overlay — clicking a card opens it in-place instead
// of navigating to the owner's profile. Sidebar/background stay put; only
// the grid swaps out for a detail view built with the exact same
// .char-*/.art-*/.cc-* markup and classes as the profile's Characters tab
// (see fanpages/profile-template.html's renderFpCharProfile), just without
// its "Character Spotlights" side nav -- this page already has its own
// sidebar -- plus a Back button, and a prev/next slideshow that walks the
// current *search results* instead of the same owner's other characters. ──
const NA = 'N/A';
const DEFAULT_REF = '/images/defaultchar.jpg';
let lastSearchItems = [];
function isBlank(v) { return !v || !String(v).trim() || String(v).trim() === NA; }
function richText(s) {
  let out = escapeHtml(s || '');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return out;
}

function wireCardClicks(root) {
  root.querySelectorAll('.fp-char-card > a[data-char-id]').forEach(a => {
    a.addEventListener('click', (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      const id = a.dataset.charId;
      const item = lastSearchItems.find(c => String(c.id) === String(id));
      openCharacterDetail(id, item ? !!item.nsfw_locked : false);
    });
  });
}

// ── Comments (target_type 'character') — same content_comments-backed
// system as the profile's Characters tab, reused verbatim so a comment
// posted from either place shows up in both. ──
const CURRENT_USER = (() => {
  try { return JSON.parse(localStorage.getItem('btw_user') || sessionStorage.getItem('btw_user') || 'null'); } catch { return null; }
})();
let ccTargetId = null;
function ccAvatarHtml(c) {
  const name = c.display_name || c.username || '?';
  const initial = escapeHtml(name.charAt(0).toUpperCase());
  return c.avatar ? `<img class="cc-avatar" src="${c.avatar}" alt="" />` : `<span class="cc-avatar-fallback">${initial}</span>`;
}
function ccTimeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}
function ccIsMine(c) { return CURRENT_USER && CURRENT_USER.id === c.user_id; }
function ccCommentEl(c, isReply) {
  const wrap = document.createElement('div');
  wrap.className = 'cc-item';
  const avatarHolder = document.createElement('div');
  avatarHolder.innerHTML = ccAvatarHtml(c);
  wrap.appendChild(avatarHolder.firstElementChild);

  const body = document.createElement('div');
  body.className = 'cc-body-wrap';
  body.innerHTML = `
    <div class="cc-bubble">
      <span class="cc-name"><a href="${window.fpUrl(`/${encodeURIComponent(c.username)}`)}">${escapeHtml(c.display_name || c.username)}</a></span>
      <span class="cc-time">${ccTimeAgo(c.created_at)}</span>
      <p class="cc-text">${c.reply_to_username ? `<span class="cc-mention">@${escapeHtml(c.reply_to_username)}</span> ` : ''}${escapeHtml(c.body)}</p>
    </div>
    <div class="cc-actions">
      ${token && !isReply ? '<button class="cc-action-btn" data-action="reply">Reply</button>' : ''}
      ${ccIsMine(c) ? '<button class="cc-action-btn" data-action="delete">Delete</button>' : (token ? '<button class="cc-action-btn cc-action-btn--flag" data-action="report" title="Report">&#127987;&#65039;</button>' : '')}
    </div>
  `;
  wrap.appendChild(body);

  const replyBtn = body.querySelector('[data-action="reply"]');
  if (replyBtn) replyBtn.addEventListener('click', () => ccOpenReplyBox(body, c));
  const deleteBtn = body.querySelector('[data-action="delete"]');
  if (deleteBtn) deleteBtn.addEventListener('click', () => ccDeleteComment(c.id));
  const reportBtn = body.querySelector('[data-action="report"]');
  if (reportBtn) reportBtn.addEventListener('click', () => window.reportContent('comment', c.id));

  if (!isReply && (c.replies || []).length) {
    const repliesWrap = document.createElement('div');
    repliesWrap.className = 'cc-replies';
    c.replies.forEach(r => repliesWrap.appendChild(ccCommentEl(r, true)));
    body.appendChild(repliesWrap);
  }
  return wrap;
}
function ccOpenReplyBox(bodyEl, parentComment) {
  const existing = bodyEl.querySelector('.cc-reply-box');
  if (existing) { existing.querySelector('textarea').focus(); return; }
  const box = document.createElement('div');
  box.className = 'cc-reply-box';
  box.innerHTML = `
    <textarea placeholder="Reply to ${escapeHtml(parentComment.display_name || parentComment.username)}…" maxlength="2000"></textarea>
    <button class="cc-compose-btn" type="button">Reply</button>
  `;
  const textarea = box.querySelector('textarea');
  box.querySelector('button').addEventListener('click', async () => {
    const text = textarea.value.trim();
    if (!text) return;
    const btn = box.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/content-comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ target_type: 'character', target_id: ccTargetId, body: text, parent_id: parentComment.id }),
      });
      if (res.ok) await ccLoadComments();
    } finally { btn.disabled = false; }
  });
  const repliesWrap = bodyEl.querySelector('.cc-replies');
  bodyEl.insertBefore(box, repliesWrap || null);
  textarea.focus();
}
async function ccDeleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await fetch(`/api/content-comments/${id}`, { method: 'DELETE', headers: authHeaders() });
    ccLoadComments();
  } catch {}
}
async function ccLoadComments() {
  const list = document.getElementById('fp-char-cc-list');
  if (!list) return;
  try {
    const res = await fetch(`/api/content-comments?target_type=character&target_id=${ccTargetId}`);
    const data = await res.json();
    const comments = data.comments || [];
    list.innerHTML = '';
    if (!comments.length) { list.innerHTML = '<p class="cc-empty">No comments yet — be the first!</p>'; return; }
    comments.forEach(c => list.appendChild(ccCommentEl(c, false)));
  } catch { list.innerHTML = '<p class="cc-empty">Couldn\'t load comments right now.</p>'; }
}
function ccInitSection(targetId) {
  ccTargetId = targetId;
  document.getElementById('fp-char-cc-compose').style.display = token ? 'flex' : 'none';
  ccLoadComments();
}
async function ccHandleCompose() {
  const input = document.getElementById('fp-char-cc-compose-input');
  const text = input.value.trim();
  if (!text || !ccTargetId) return;
  const btn = document.getElementById('fp-char-cc-compose-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/content-comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ target_type: 'character', target_id: ccTargetId, body: text }),
    });
    if (res.ok) { input.value = ''; await ccLoadComments(); }
  } finally { btn.disabled = false; }
}
document.getElementById('fp-char-cc-compose-btn').addEventListener('click', ccHandleCompose);

// ── Character card — identical markup/classes to the profile Characters
// tab's renderFpCharProfile, so the two views look the same. Relationship
// links open the linked character in this same overlay (in-page) instead
// of leaving to that character's owner's profile. ──
function renderCharDetailProfile(char, locked) {
  const profile = document.getElementById('fp-char-profile');
  profile.innerHTML = '';

  const refWrap = document.createElement('div');
  refWrap.className = 'char-ref-wrap';
  if (locked) {
    refWrap.style.aspectRatio = '1 / 1';

  } else {
    refWrap.style.aspectRatio = char.ref_image ? '1 / 1' : '13 / 10';
    const img = document.createElement('img');
    img.alt = char.name;
    img.src = char.ref_image || DEFAULT_REF;
    img.style.objectPosition = `${char.ref_position_x != null ? char.ref_position_x : 50}% ${char.ref_position_y != null ? char.ref_position_y : 50}%`;

  profile.appendChild(refWrap);

  const bio = document.createElement('div');
  bio.className = 'char-bio-box';
  const nameRow = document.createElement('div');

  const nameEl = document.createElement('h1');
  nameEl.className = 'char-name';
  nameEl.textContent = char.name;
  nameRow.appendChild(nameEl);
  const shareBtn = document.createElement('button');
  shareBtn.className = 'fp-share-icon-btn';
  shareBtn.type = 'button';
  shareBtn.title = 'Share this character';
  shareBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 20.5c-0.5-8 5-13 11.5-13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M13.3 2.2l8.7 6.3-8.7 6.3V2.2z" fill="currentColor"/></svg>';
  shareBtn.addEventListener('click', (e) => {
    window.fpShare(e.currentTarget, `${window.location.origin}${window.location.pathname}?char=${char.id}`);
  });
  nameRow.appendChild(shareBtn);
  bio.appendChild(nameRow);
  const descWrap = document.createElement('div');
  descWrap.className = 'char-desc';
  (char.description || NA).split('\n').filter(Boolean).forEach(text => {
    const p = document.createElement('p');
    p.innerHTML = richText(text);
    descWrap.appendChild(p);
  });
  bio.appendChild(descWrap);
  profile.appendChild(bio);

  const row = document.createElement('div');
  row.className = 'char-cards-row';

  const statsBox = document.createElement('div');
  statsBox.className = 'char-box';
  const statsTitle = document.createElement('span');
  statsTitle.className = 'char-box-title';
  statsTitle.textContent = 'Stats';
  statsBox.appendChild(statsTitle);

  const stats = char.stats || {};

    lbl.textContent = label;

    statRow.appendChild(val);

  const relationships = (char.relationships || []).filter(r => r && r.name);
  if (relationships.length) {
    const relDivider = document.createElement('div');

    statsBox.appendChild(relDivider);
    const relLabel = document.createElement('span');

    relationships.forEach(rel => {
      const relLine = document.createElement('div');

      if (rel.character_id) {

        avatar.alt = '';

        relLine.appendChild(avatar);

        const nameLink = document.createElement('a');
        nameLink.href = '#';
        nameLink.style.cssText = 'color:#f0c060; font-weight:700; text-decoration:none; text-shadow:0 0 12px rgba(240,192,96,0.6);';
        nameLink.textContent = rel.name;
        nameLink.addEventListener('click', (e) => { e.preventDefault(); openCharacterDetail(rel.character_id, false); });
        relLine.appendChild(nameLink);

        const known = lastSearchItems.find(c => String(c.id) === String(rel.character_id));
        if (known && known.image) avatar.src = known.image;
        else {
          fetch(`/api/characters/${rel.character_id}`)
            .then(r => r.ok ? r.json() : null)

  const factsBox = document.createElement('div');
  factsBox.className = 'char-box';
  const factsTitle = document.createElement('span');
  factsTitle.className = 'char-box-title';
  factsTitle.textContent = 'Fun Facts';
  factsBox.appendChild(factsTitle);

  const themeFact = document.createElement('div');
  themeFact.className = 'char-fact';
  const themeBullet = document.createElement('span');
  themeBullet.className = 'char-fact-bullet';
  themeBullet.textContent = '✦';
  themeFact.appendChild(themeBullet);
  const themeContent = document.createElement('span');
  if (!isBlank(themeSong) && /^https?:\/\//i.test(themeSong.trim())) {
    const a = document.createElement('a');
    a.href = themeSong.trim(); a.target = '_blank'; a.rel = 'noopener'; a.style.color = '#f0c060'; a.textContent = 'Theme Song';

    themeContent.textContent = 'Theme Song: N/A';
  }
  themeFact.appendChild(themeContent);
  factsBox.appendChild(themeFact);

  const storiesFact = document.createElement('div');
  storiesFact.className = 'char-fact';
  const storiesBullet = document.createElement('span');
  storiesBullet.className = 'char-fact-bullet';
  storiesBullet.textContent = '✦';
  storiesFact.appendChild(storiesBullet);
  const storiesContent = document.createElement('div');
  storiesContent.style.cssText = 'flex:1; min-width:0;';
  const storiesHeading = document.createElement('span');
  storiesHeading.style.cssText = 'color:#f0c060; font-weight:700; text-shadow:0 0 12px rgba(240,192,96,0.6);';
  storiesHeading.textContent = 'Stories';
  storiesContent.appendChild(storiesHeading);
  const storiesWrap = document.createElement('div');
  storiesWrap.style.cssText = 'margin-top:0.55rem;';
  storiesWrap.innerHTML = '<p style="color:#888; font-size:0.82rem;">Loading…</p>';
  storiesContent.appendChild(storiesWrap);
  storiesFact.appendChild(storiesContent);
  factsBox.appendChild(storiesFact);
  fetch(`/api/characters/${char.id}/stories`)
    .then(r => r.ok ? r.json() : { stories: [] })
    .then(data => {

      if (!stories.length) {

      storiesRow.style.cssText = 'display:flex; flex-wrap:wrap; gap:0.6rem;';
      stories.forEach(s => {
        const a = document.createElement('a');
        a.href = window.fpUrl(`/${s.story_path}`);
        a.style.cssText = 'display:flex; align-items:center; gap:0.5rem; text-decoration:none; background:#1a1a1a; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:0.35rem 0.6rem 0.35rem 0.35rem; max-width:180px;';
        const cover = document.createElement('img');
        cover.src = s.cover_url || '/images/noimage.png';

        cover.style.cssText = 'width:28px; height:38px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#222;';
        const span = document.createElement('span');
        span.style.cssText = 'font-size:0.8rem; color:#ddd; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
        span.textContent = s.site_title;
        a.appendChild(cover); a.appendChild(span);
        storiesRow.appendChild(a);
      });
      storiesWrap.appendChild(storiesRow);
    })
    .catch(() => { storiesWrap.innerHTML = '<p style="color:#888; font-size:0.82rem;">Couldn\'t load linked stories right now.</p>'; });

  (char.facts && char.facts.length ? char.facts : [NA]).forEach(item => {
    const fact = document.createElement('div');
    fact.className = 'char-fact';
    const bullet = document.createElement('span');
    bullet.className = 'char-fact-bullet';
    bullet.textContent = '✦';
    const content = document.createElement('span');
    content.innerHTML = richText(item);

    fact.appendChild(content);
    factsBox.appendChild(fact);

  row.appendChild(factsBox);
  profile.appendChild(row);

  const loreBox = document.createElement('div');
  loreBox.className = 'char-box char-lore-box';
  const loreTitle = document.createElement('span');
  loreTitle.className = 'char-box-title';
  loreTitle.textContent = 'Lore';

  const textWrap = document.createElement('div');

  ((char.lore && char.lore.length) ? char.lore : [NA]).forEach(item => {
    const p = document.createElement('p');
    p.innerHTML = richText(item);
    textWrap.appendChild(p);
  });
  spoiler.appendChild(textWrap);
  const revealBtn = document.createElement('button');
  revealBtn.className = 'char-lore-reveal';
  revealBtn.textContent = '⚠ Spoilers — click to reveal';
  revealBtn.addEventListener('click', () => spoiler.classList.add('revealed'));
  spoiler.appendChild(revealBtn);
  loreBox.appendChild(spoiler);
  profile.appendChild(loreBox);

  const footer = document.createElement('div');
  footer.className = 'char-detail-footer';

  const viewsEl = document.createElement('span');
  viewsEl.className = 'char-detail-views';

  footer.appendChild(viewsEl);

  const likeBtn = document.createElement('button');
  likeBtn.className = 'art-view-like art-view-like--big' + (char.liked ? ' liked' : '');
  likeBtn.type = 'button';
  likeBtn.setAttribute('aria-label', 'Like this character');
  likeBtn.innerHTML = `<span class="char-like-icon">${char.liked ? '♥' : '♡'}</span> <span class="char-like-count">${char.like_count || 0}</span>`;
  likeBtn.addEventListener('click', async () => {
    if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }
    likeBtn.disabled = true;
    try {
      const res = await fetch(`/api/moderator/character/${char.id}/like`, { method: char.liked ? 'DELETE' : 'POST', headers: authHeaders() });
      const data = await res.json();
      char.liked = data.liked; char.like_count = data.like_count;
      likeBtn.classList.toggle('liked', data.liked);
      likeBtn.querySelector('.char-like-icon').textContent = data.liked ? '♥' : '♡';

    } catch {}

  const bookmarkBtn = document.createElement('button');

  bookmarkBtn.addEventListener('click', async () => {
    if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }

    try {

      bookmarkBtn.classList.toggle('bookmarked', data.bookmarked);

    bookmarkBtn.disabled = false;

  footer.appendChild(bookmarkBtn);

  profile.appendChild(footer);

// Prev/next "slideshow" -- unlike the profile Characters tab (which cycles
// through the same owner's other characters), this walks the current
// *search results* array: whatever the next/previous index in the loaded
// grid happens to be, regardless of who made it.
function renderCharDetailNav(char) {
  const navEl = document.getElementById('fp-char-detail-nav');
  navEl.innerHTML = '';
  const idx = lastSearchItems.findIndex(c => String(c.id) === String(char.id));
  if (idx === -1) return;
  const prev = idx > 0 ? lastSearchItems[idx - 1] : null;
  const next = idx < lastSearchItems.length - 1 ? lastSearchItems[idx + 1] : null;
  if (prev) {
    const a = document.createElement('a');
    a.className = 'art-nav-btn art-nav-prev';
    a.href = '#';
    a.innerHTML = `← <span class="art-nav-label">${escapeHtml(prev.name)}</span>`;
    a.addEventListener('click', (e) => { e.preventDefault(); openCharacterDetail(prev.id, !!prev.nsfw_locked); });
    navEl.appendChild(a);
  }
  if (next) {
    const a = document.createElement('a');
    a.className = 'art-nav-btn art-nav-next';
    a.href = '#';
    a.innerHTML = `<span class="art-nav-label">${escapeHtml(next.name)}</span> →`;
    a.addEventListener('click', (e) => { e.preventDefault(); openCharacterDetail(next.id, !!next.nsfw_locked); });
    navEl.appendChild(a);
  }
}

async function showCharacterDetail(id, locked) {
  const listView = document.getElementById('fp-char-list-view');
  const detailView = document.getElementById('fp-char-detail-view');
  const profileEl = document.getElementById('fp-char-profile');
  listView.hidden = true;
  detailView.hidden = false;
  profileEl.innerHTML = '<p class="fp-char-empty">Loading…</p>';
  document.getElementById('fp-char-detail-nav').innerHTML = '';
  window.scrollTo(0, 0);
  try {
    const res = await fetch(`/api/characters/${id}`, { headers: authHeaders() });
    if (!res.ok) throw new Error();
    const { character } = await res.json();
    renderCharDetailProfile(character, !!locked);
  } catch {
    profileEl.innerHTML = '<p class="fp-char-empty">Couldn\'t load this character right now.</p>';
  }
  syncBgHeight();
}

function openCharacterDetail(id, locked) {
  const usp = new URLSearchParams(window.location.search);
  usp.set('char', id);
  history.pushState({ fpCharId: id }, '', `${window.location.pathname}?${usp.toString()}`);
  showCharacterDetail(id, locked);
}

function closeCharacterDetail() {
  const usp = new URLSearchParams(window.location.search);
  usp.delete('char');
  const qs = usp.toString();
  history.pushState({}, '', qs ? `${window.location.pathname}?${qs}` : window.location.pathname);
  document.getElementById('fp-char-list-view').hidden = false;
  document.getElementById('fp-char-detail-view').hidden = true;
  syncBgHeight();
}

document.getElementById('fp-char-back-btn').addEventListener('click', closeCharacterDetail);

window.addEventListener('popstate', () => {
  const id = new URLSearchParams(window.location.search).get('char');
  if (id) {
    showCharacterDetail(id, false);
  } else {
    document.getElementById('fp-char-list-view').hidden = false;
    document.getElementById('fp-char-detail-view').hidden = true;
    syncBgHeight();
  }
});

let searchDebounce = null;
document.getElementById('fp-char-search-input').addEventListener('input', (e) => {
  clearTimeout(searchDebounce);
  const val = e.target.value;
  searchDebounce = setTimeout(() => {
    goToParams(usp => {
      if (val.trim()) usp.set('q', val.trim()); else usp.delete('q');
      usp.delete('page');
    });
  }, 400);
});

document.getElementById('fp-char-sort-select').addEventListener('change', (e) => {
  goToParams(usp => { usp.set('sort', e.target.value); usp.delete('page'); });
});

function wireFilterMenu() {
  const { filter: activeFilter } = readParams();
  document.querySelectorAll('.fp-char-filter-item').forEach(btn => {
    btn.classList.toggle('fp-char-filter-item--active', btn.dataset.filter === activeFilter);
    btn.addEventListener('click', () => {
      goToParams(usp => {
        if (btn.dataset.filter) usp.set('filter', btn.dataset.filter); else usp.delete('filter');
        usp.delete('page');
      });
    });
  });
}

const SORT_LABELS = { best_match: 'Best Match', updated: 'Date Updated', popular: 'Popular' };

// Filter-specific empty-state splash — only shown for the bare "browsing
// your own list" case (no search query typed on top of the filter); a
// query still falls through to the generic "no characters match" message.
const EMPTY_FILTER_HTML = {
  mine: `You have not created any characters yet! If you'd like to make characters and link them to stories, art, and posts you make across the website, <a href="${escapeHtml(window.fpUrl('/create-character'))}">Create a Character</a> and get started! ❤️`,
  followed: `Nobody you follow has characters posted! Follow your favorite writers and artists for their characters to appear here! ❤️`,
  liked: `You haven't liked any characters yet! Like or bookmark your favorite characters for them to appear here. ❤️`,
};

async function runCharacterSearch() {
  const gridEl = document.getElementById('fp-char-grid');
  const subEl = document.getElementById('fp-char-main-sub');
  const topEl = document.getElementById('fp-pagination-top');
  const bottomEl = document.getElementById('fp-pagination-bottom');
  gridEl.innerHTML = '<p class="fp-char-empty">Loading…</p>';
  topEl.hidden = true; bottomEl.hidden = true;

  const { q, filter, sort, page } = readParams();
  document.getElementById('fp-char-search-input').value = q;
  document.getElementById('fp-char-sort-select').value = sort;
  const limit = 25;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (filter) params.set('filter', filter);
  params.set('sort', sort);
  params.set('page', page);
  params.set('limit', limit);

  if (['mine', 'followed', 'liked'].includes(filter) && !token) {
    gridEl.innerHTML = `<p class="fp-char-empty">Log in to see ${escapeHtml(FILTER_LABELS[filter])}.</p>`;
    subEl.textContent = '';
    return;
  }

  try {
    const res = await fetch(`/api/search/characters?${params.toString()}`, { headers: authHeaders() });
    const data = await res.json();
    const items = data.items || [];
    const bits = [];
    if (filter) bits.push(FILTER_LABELS[filter].toLowerCase());
    if (q) bits.push(`"${q}"`);
    subEl.innerHTML = `<strong>${data.total || 0}</strong> character${data.total === 1 ? '' : 's'} found${bits.length ? ` for ${escapeHtml(bits.join(', '))}` : ''} — sorted by ${escapeHtml(SORT_LABELS[data.sort] || 'Best Match')}.`;

    if (!items.length) {
      gridEl.innerHTML = (filter && !q && EMPTY_FILTER_HTML[filter])
        ? `<p class="fp-char-empty">${EMPTY_FILTER_HTML[filter]}</p>`
        : '<p class="fp-char-empty">No characters match that search.</p>';
      syncBgHeight();
      return;
    }
    gridEl.innerHTML = items.map(charCardHtml).join('');
    lastSearchItems = items;
    wireLikeButtons(gridEl);
    wireCardClicks(gridEl);

    const totalPages = Math.max(1, Math.ceil((data.total || 0) / limit));
    const pagHtml = paginationHtml(page, totalPages);
    topEl.hidden = false; topEl.innerHTML = pagHtml; wirePagination(topEl);
    bottomEl.hidden = false; bottomEl.innerHTML = pagHtml; wirePagination(bottomEl);
    syncBgHeight();
    gridEl.querySelectorAll('img').forEach(img => img.addEventListener('load', syncBgHeight, { once: true }));
  } catch {
    gridEl.innerHTML = '<p class="fp-char-empty">Couldn\'t load characters right now.</p>';
  }
}

// Background scrolls with the page (position:absolute) instead of staying
// pinned, same treatment as the Posts pages -- needs its height measured
// in JS since percentage/inset sizing can't resolve against a body whose
// height is just "however tall its content is." Re-measured after the
// grid renders, as thumbnails finish loading in, and on resize.
function syncBgHeight() {
  // Reset first -- the element being measured is itself absolutely
  // positioned and contributes to document.documentElement.scrollHeight,
  // so measuring without resetting first would just re-read its own old
  // (possibly much taller, e.g. from before switching into the shorter
  // character detail view) height back and never let the page shrink.
  const bgEl = document.querySelector('.fp-bg-img');
  bgEl.style.height = '0';
  const h = Math.max(document.documentElement.scrollHeight, window.innerHeight) + 'px';
  bgEl.style.height = h;
}
window.addEventListener('resize', syncBgHeight);
window.addEventListener('load', syncBgHeight);

loadViewerBox();
wireFilterMenu();
runCharacterSearch();

const initialCharId = new URLSearchParams(window.location.search).get('char');
if (initialCharId) showCharacterDetail(initialCharId, false);
</script>
