<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Posts ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    html, body { background: #0e141b; min-height: 100vh; }
    [hidden] { display: none !important; }
    .nw-wrap { position: relative; z-index: 1; padding: 1.5rem 1.75rem 4rem 2.25rem; display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 2rem; align-items: stretch; }
    .nw-wrap--edit { padding-left: 1.75rem; grid-template-columns: minmax(0, 1fr); max-width: 1320px; margin: 0 auto; }
    .nw-main { min-width: 0; }

    .nw-btn {
      font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 0.95rem; cursor: pointer;
      padding: 0.5rem 1.15rem; border-radius: 999px; text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem;
      color: #f0c060; background: rgba(20,16,30,0.75); border: 1px solid rgba(240,192,96,0.6);
      box-shadow: 0 0 8px rgba(240,192,96,0.22); transition: background 0.15s, box-shadow 0.15s;
    }
    .nw-btn:hover { background: rgba(240,192,96,0.14); box-shadow: 0 0 12px rgba(240,192,96,0.35); }
    .nw-btn:disabled { opacity: 0.5; cursor: default; }
    .nw-btn--blue { color: #cfe0f5; border-color: rgba(127,168,217,0.7); box-shadow: 0 0 8px rgba(127,168,217,0.25); }
    .nw-btn--blue:hover { background: rgba(127,168,217,0.16); box-shadow: 0 0 12px rgba(127,168,217,0.4); }
    .nw-btn--danger { color: #ff9a9a; border-color: rgba(255,120,120,0.6); box-shadow: none; }
    .nw-btn--danger:hover { background: rgba(255,120,120,0.14); box-shadow: none; }
    .nw-btn--sm { font-size: 0.8rem; padding: 0.3rem 0.75rem; }

    /* ── Sidebar: Latest Newsletters ── */
    /* No box: the aside stretches the full height of the grid row so its right
       border reads as one continuous vertical divider; the content inside sticks. */
    .nw-side { border-right: 1px solid rgba(255,255,255,0.1); padding-right: 1.4rem; }
    .nw-side-in { position: sticky; top: 1.25rem; }
    .nw-side-art { display: block; width: 190px; max-width: 70%; margin: 0 auto 1.1rem; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.5)); }
    .nw-side h2 { cursor: pointer; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.25rem; color: #cfe0f5; margin: 0 0 0.8rem 0.4rem; text-shadow: 0 0 12px rgba(127,168,217,0.4); display: flex; align-items: center; gap: 0.45rem; }
    .nw-side h2 img { width: 20px; height: 20px; object-fit: contain; }
    .nw-new-btn { width: 100%; justify-content: center; margin-bottom: 0.9rem; }
    .nw-list { display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 24rem); min-height: 6rem; overflow-y: auto; }
    .nw-item { display: block; padding: 0.55rem 0.7rem; border-radius: 8px; cursor: pointer; border-left: 3px solid transparent; color: #b6c2d3; }
    .nw-item:hover { background: rgba(127,168,217,0.1); color: #fff; }
    .nw-item.active { background: rgba(127,168,217,0.16); border-left-color: #7fa8d9; color: #fff; }
    .nw-item-title { font-family: 'Fredoka', 'Lato', cursive; font-weight: 500; font-size: 0.97rem; line-height: 1.25; }
    .nw-item-date { font-size: 0.75rem; color: #7d8ba0; margin-top: 0.12rem; }
    .nw-draft { font-family: 'Fredoka', 'Lato', cursive; font-size: 0.68rem; font-weight: 600; color: #ff9a9a; border: 1px solid rgba(255,154,154,0.55); border-radius: 999px; padding: 0 0.45rem; margin-left: 0.35rem; vertical-align: middle; }
    .nw-empty { text-align: center; color: #7d8ba0; padding: 2rem 0.5rem; font-size: 0.92rem; }

    /* ── Banner slideshow ── */
    .nw-banner { position: relative; width: 100%; aspect-ratio: 3.2 / 1; border-radius: 10px; overflow: hidden; background: #0a0f15; box-shadow: 0 10px 40px rgba(0,0,0,0.45); margin-bottom: 2rem; }
    .nw-banner-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; display: block; pointer-events: none; }
    .nw-banner-slide.active { opacity: 1; pointer-events: auto; }
    .nw-banner-bg { position: absolute; inset: 0; background-repeat: no-repeat; background-size: cover; background-position: center; }
    .nw-banner-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); background: rgba(10,14,20,0.6); color: #fff; font-size: 1.3rem; line-height: 1; cursor: pointer; }
    .nw-banner-arrow:hover { background: rgba(127,168,217,0.3); }
    .nw-banner-arrow--prev { left: 0.7rem; } .nw-banner-arrow--next { right: 0.7rem; }
    .nw-banner-dots { position: absolute; bottom: 0.7rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.4rem; z-index: 3; }
    .nw-banner-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
    .nw-banner-dot.active { background: #7fa8d9; }

    /* ── Home: Latest updates + cards ── */
    .nw-home-title { font-family: 'Fredoka', 'Lato', cursive; font-size: 1.9rem; color: #cfe0f5; margin: 0 0 1.2rem; display: flex; align-items: center; gap: 0.6rem; text-shadow: 0 0 14px rgba(127,168,217,0.4); }
    .nw-home-title img { width: 26px; height: 26px; object-fit: contain; }
    .nw-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
    .nw-ncard { cursor: pointer; background: #1c1e2b; border: 1px solid rgba(255,255,255,0.08); border-left: 3px solid #d9c9a3; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; }
    .nw-ncard:hover { transform: translateY(-3px); border-color: rgba(127,168,217,0.6); box-shadow: 0 10px 28px rgba(0,0,0,0.5); }
    .nw-ncard-body { padding: 1rem 1.1rem 0.9rem; flex: 1; }
    .nw-ncard-title { font-family: 'Fredoka', 'Lato', cursive; font-size: 1.2rem; font-weight: 600; color: #6ea8ec; margin: 0 0 0.3rem; }
    .nw-ncard-date { font-size: 0.78rem; color: #7d8ba0; margin-bottom: 0.55rem; }
    .nw-ncard-sum { color: #c9ced9; font-size: 0.9rem; line-height: 1.55; margin: 0; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
    .nw-ncard-img { width: calc(100% - 2rem); margin: 0 1rem 1rem; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; display: block; background: #12141d; }
    .nw-back { margin-bottom: 1rem; }

    /* ── Article (reader + preview) ── */
    .nw-article { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 2rem 2.4rem 2.4rem; min-width: 0; }
    .nw-article-date { font-size: 0.85rem; color: #7d8ba0; }
    .nw-article h1 { font-family: 'Fredoka', 'Lato', cursive; font-size: 2.3rem; color: #cfe0f5; margin: 0.2rem 0 1.4rem; text-shadow: 0 0 14px rgba(127,168,217,0.4); }
    .nw-article-actions { display: flex; gap: 0.6rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.08); }
    .nw-blk { margin: 0 0 1.6rem; }
    .nw-blk-title { font-family: 'Fredoka', 'Lato', cursive; font-size: 1.5rem; color: #f0c060; margin: 0 0 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid rgba(240,192,96,0.25); }
    .nw-prose { color: #d6dbe5; line-height: 1.7; font-size: 1.02rem; }
    .nw-prose h2 { font-family: 'Fredoka', 'Lato', cursive; color: #f0c060; font-size: 1.35rem; margin: 1.3rem 0 0.4rem; }
    .nw-prose h3 { font-family: 'Fredoka', 'Lato', cursive; color: #cfe0f5; font-size: 1.12rem; margin: 1.1rem 0 0.3rem; }
    .nw-prose p { margin: 0.6rem 0; }
    .nw-prose > :first-child { margin-top: 0; }
    .nw-prose a, .nw-blk a { color: #7fa8d9; }
    .nw-prose hr { border: none; border-top: 1px solid rgba(255,255,255,0.15); margin: 1.2rem 0; }
    .nw-prose ul { list-style: none; padding: 0; margin: 0.5rem 0; }
    .nw-prose li { display: flex; gap: 0.6rem; align-items: baseline; padding: 0.2rem 0; }
    .nw-prose li .nw-bullet { flex: 0 0 auto; font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 0.7rem; padding: 0.05rem 0.5rem; border-radius: 999px; border: 1px solid; min-width: 3.6em; text-align: center; }
    .nw-bullet--add { color: #8fe0a8; border-color: rgba(143,224,168,0.55); background: rgba(143,224,168,0.1); }
    .nw-bullet--chg { color: #8fbfff; border-color: rgba(143,191,255,0.55); background: rgba(143,191,255,0.1); }
    .nw-bullet--fix { color: #ffc77a; border-color: rgba(255,199,122,0.55); background: rgba(255,199,122,0.1); }
    .nw-bullet--dot { color: #9aa4b8; border: none !important; min-width: 0 !important; padding: 0 !important; }
    .nw-img { display: block; max-width: 100%; border-radius: 8px; margin: 0 auto; }
    .nw-img--medium { max-width: 70%; }
    .nw-img--small { max-width: 40%; }
    .nw-caption { text-align: center; color: #7d8ba0; font-size: 0.85rem; margin-top: 0.4rem; }
    .nw-video { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; }
    .nw-video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .nw-side-blk { display: flex; gap: 1.4rem; align-items: flex-start; }
    .nw-side-blk--right { flex-direction: row-reverse; }
    .nw-side-blk > img { flex: 0 0 38%; max-width: 38%; border-radius: 8px; }
    .nw-side-blk > div { flex: 1; min-width: 0; }
    .nw-linkbtn { display: inline-block; font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; padding: 0.55rem 1.4rem; border-radius: 999px; color: #0e141b !important; background: #7fa8d9; text-decoration: none; }
    .nw-linkbtn:hover { background: #9bbfe8; }
    .nw-divider { border: none; border-top: 1px solid rgba(255,255,255,0.15); }

    /* ── Builder ── */
    .nw-bar { display: flex; align-items: center; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .nw-bar-title { flex: 1 1 280px; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.5rem; font-weight: 600; color: #cfe0f5; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 0.5rem 0.9rem; }
    .nw-bar-title:focus, .nw-in:focus { outline: none; border-color: rgba(127,168,217,0.9); box-shadow: 0 0 8px rgba(127,168,217,0.35); }
    .nw-builder { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 1.25rem; align-items: start; }
    .nw-palette { position: sticky; top: 1.25rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .nw-palette h3 { font-family: 'Fredoka', 'Lato', cursive; color: #cfe0f5; font-size: 1.05rem; margin: 0 0 0.2rem; }
    .nw-palette .nw-btn { justify-content: flex-start; }
    .nw-canvas { display: flex; flex-direction: column; gap: 0.8rem; min-height: 200px; }
    .nw-canvas-empty { border: 2px dashed rgba(255,255,255,0.14); border-radius: 12px; padding: 3rem 1rem; text-align: center; color: #7d8ba0; }
    .nw-card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; }
    .nw-card.dragging { opacity: 0.4; }
    .nw-card.drop-before { box-shadow: 0 -3px 0 #7fa8d9; }
    .nw-card.drop-after { box-shadow: 0 3px 0 #7fa8d9; }
    .nw-card-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.7rem; background: rgba(127,168,217,0.1); border-bottom: 1px solid rgba(255,255,255,0.08); }
    .nw-grip { cursor: grab; color: #7fa8d9; font-size: 1.2rem; line-height: 1; user-select: none; padding: 0 0.2rem; }
    .nw-card-type { font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; color: #cfe0f5; flex: 1; }
    .nw-ic { background: none; border: 1px solid rgba(255,255,255,0.15); color: #cfe0f5; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; font-size: 0.85rem; }
    .nw-ic:hover { background: rgba(127,168,217,0.2); }
    .nw-ic--del:hover { background: rgba(255,120,120,0.2); color: #ff9a9a; }
    .nw-card-body { padding: 0.9rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .nw-lbl { font-family: 'Fredoka', 'Lato', cursive; font-size: 0.85rem; color: #9fb0c8; margin-bottom: 0.15rem; display: block; }
    .nw-in { width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px; color: #f0f0f0; padding: 0.5rem 0.7rem; font: inherit; font-size: 0.95rem; }
    textarea.nw-in { min-height: 140px; resize: vertical; line-height: 1.55; }
    .nw-hint { font-size: 0.78rem; color: #7d8ba0; }
    .nw-row { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: flex-end; }
    .nw-row > div { flex: 1 1 160px; }
    .nw-thumb { max-width: 220px; max-height: 140px; border-radius: 8px; display: block; margin-bottom: 0.4rem; }
    .nw-error { color: #ff9a9a; }
    .nw-note { font-size: 0.85rem; color: #7d8ba0; margin-top: 0.4rem; }

    @media (max-width: 860px) {
      .nw-wrap { grid-template-columns: 1fr; padding: 1rem 1rem 3rem; }
      .nw-side { border-right: none; padding-right: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
      .nw-side-in { position: static; }
      .nw-side-art { width: 110px; }
      .nw-banner { aspect-ratio: 2 / 1; }
      .nw-cards { grid-template-columns: 1fr; }
      .nw-list { max-height: 260px; }
      .nw-builder { grid-template-columns: 1fr; }
      .nw-palette { position: static; flex-direction: row; flex-wrap: wrap; }
      .nw-palette h3 { width: 100%; }
      .nw-article { padding: 1.3rem 1.1rem 1.6rem; }
      .nw-article h1 { font-size: 1.8rem; }
      .nw-side-blk, .nw-side-blk--right { flex-direction: column; }
      .nw-side-blk > img { flex-basis: auto; max-width: 100%; }
    }
  </style>
</head>
<body>
<div class="fp-content-z">
<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="nw-wrap" id="nw-wrap">
  <aside class="nw-side" id="nw-side"><div class="nw-side-in">
    <img class="nw-side-art" src="/images/fayesketch.png" alt="" />
    <h2>Latest Newsletters <img src="/images/home/decoration-1.png" alt="" /></h2>
    <button class="nw-btn nw-new-btn" id="nw-new-btn" hidden>✎ New Post</button>
    <div class="nw-list" id="nw-list"><p class="nw-empty">Loading…</p></div>
  </div></aside>

  <main class="nw-main" id="nw-main"></main>

  <section id="nw-builder" hidden>
    <div class="nw-bar">
      <input type="text" class="nw-bar-title" id="nw-title" maxlength="200" placeholder="Name of this update — e.g. Patch Notes: Week of Oct 27" />
      <button class="nw-btn nw-btn--blue" id="nw-preview-btn">👁 Preview</button>
      <button class="nw-btn nw-btn--blue" id="nw-draft-btn">Save Draft</button>
      <button class="nw-btn" id="nw-publish-btn">Publish</button>
      <button class="nw-btn nw-btn--danger" id="nw-cancel-btn">Cancel</button>
    </div>
    <div class="nw-error" id="nw-error"></div>
    <div class="nw-builder" id="nw-builder-grid">
      <div class="nw-palette">
        <h3>Add a block</h3>
        <button class="nw-btn nw-btn--blue nw-btn--sm" data-add="text">¶ Text</button>
        <button class="nw-btn nw-btn--blue nw-btn--sm" data-add="image">🖼 Image</button>
        <button class="nw-btn nw-btn--blue nw-btn--sm" data-add="side">◧ Text + Side Image</button>
        <button class="nw-btn nw-btn--blue nw-btn--sm" data-add="video">▶ Video Link</button>
        <button class="nw-btn nw-btn--blue nw-btn--sm" data-add="link">🔗 Link Button</button>
        <button class="nw-btn nw-btn--blue nw-btn--sm" data-add="divider">― Divider</button>
        <p class="nw-note">Drag the ⠿ handle (or use ↑ ↓) to rearrange.</p>
      </div>
      <div class="nw-canvas" id="nw-canvas"></div>
      <div id="nw-preview" hidden></div>
    </div>
  </section>
</div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => token ? { Authorization: 'Bearer ' + token } : {};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDate = d => d ? new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }) : '';
let isAdmin = false, posts = [], currentPost = null, editingId = null, blocks = [], previewing = false;

// ── Rendering ─────────────────────────────────────────────────────────────
// Everything is HTML-escaped before markup is applied; links restricted to http(s).
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
const safeImg = u => /^(https?:\/\/|\/)/i.test(u || '') && !/^\/\//.test(u) ? u : '';
function inline(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}
function renderText(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  let html = '', para = [], list = [];
  const flushPara = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const flushList = () => { if (list.length) { html += '<ul>' + list.join('') + '</ul>'; list = []; } };
  const li = (cls, label, t) => `<li><span class="nw-bullet ${cls}">${label}</span><span>${inline(t)}</span></li>`;
  for (const raw of lines) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { flushPara(); flushList(); continue; }
    if ((m = l.match(/^### (.+)/))) { flushPara(); flushList(); html += '<h3>' + inline(m[1]) + '</h3>'; }
    else if ((m = l.match(/^## (.+)/))) { flushPara(); flushList(); html += '<h2>' + inline(m[1]) + '</h2>'; }
    else if (/^---+$/.test(l.trim())) { flushPara(); flushList(); html += '<hr>'; }
    else if ((m = l.match(/^\+ (.+)/))) { flushPara(); list.push(li('nw-bullet--add', 'Added', m[1])); }
    else if ((m = l.match(/^~ (.+)/))) { flushPara(); list.push(li('nw-bullet--chg', 'Changed', m[1])); }
    else if ((m = l.match(/^! (.+)/))) { flushPara(); list.push(li('nw-bullet--fix', 'Fixed', m[1])); }
    else if ((m = l.match(/^- (.+)/))) { flushPara(); list.push(li('nw-bullet--dot', '•', m[1])); }
    else { flushList(); para.push(l); }
  }
  flushPara(); flushList();
  return html;
}
function embedFor(url) {
  const u = safeUrl(url); if (!u) return '';
  let m;
  if ((m = u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{11})/i)))
    return `<div class="nw-video"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  if ((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i)))
    return `<div class="nw-video"><iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy"></iframe></div>`;
  return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a>`;
}
const titleHtml = t => t && t.trim() ? `<h2 class="nw-blk-title">${esc(t)}</h2>` : '';
function blockHtml(b) {
  switch (b.type) {
    case 'text': return `<div class="nw-blk">${titleHtml(b.title)}<div class="nw-prose">${renderText(b.text)}</div></div>`;
    case 'image': {
      const src = safeImg(b.url); if (!src) return '';
      return `<div class="nw-blk"><img class="nw-img nw-img--${esc(b.size || 'full')}" src="${esc(src)}" alt="" loading="lazy" />${b.caption ? `<div class="nw-caption">${esc(b.caption)}</div>` : ''}</div>`;
    }
    case 'side': {
      const src = safeImg(b.url);
      return `<div class="nw-blk nw-side-blk${b.side === 'right' ? ' nw-side-blk--right' : ''}">${src ? `<img src="${esc(src)}" alt="" loading="lazy" />` : ''}<div>${titleHtml(b.title)}<div class="nw-prose">${renderText(b.text)}</div></div></div>`;
    }
    case 'video': return `<div class="nw-blk">${embedFor(b.url)}${b.caption ? `<div class="nw-caption">${esc(b.caption)}</div>` : ''}</div>`;
    case 'link': { const u = safeUrl(b.url); return u ? `<div class="nw-blk" style="text-align:center"><a class="nw-linkbtn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(b.label || u)}</a></div>` : ''; }
    case 'divider': return '<div class="nw-blk"><hr class="nw-divider" /></div>';
  }
  return '';
}
function parseBody(body) {
  try { const o = JSON.parse(body); if (o && Array.isArray(o.blocks)) return o.blocks; } catch {}
  return body && body.trim() ? [{ type: 'text', title: '', text: body }] : []; // legacy plain-text post
}
function articleHtml(p) {
  const draft = p.is_published ? '' : '<span class="nw-draft">Draft</span>';
  return `<article class="nw-article">
    <div class="nw-article-date">${esc(fmtDate(p.published_at || p.created_at || new Date()))} ${draft}</div>
    <h1>${esc(p.title || 'Untitled')}</h1>
    ${parseBody(p.body).map(blockHtml).join('')}
  </article>`;
}

// ── List + reader ─────────────────────────────────────────────────────────
function renderList() {
  if (!posts.length) { $('nw-list').innerHTML = '<p class="nw-empty">No newsletters yet — check back soon!</p>'; return; }
  $('nw-list').innerHTML = posts.map(p => `
    <a class="nw-item${currentPost && currentPost.id === p.id ? ' active' : ''}" data-id="${p.id}">
      <div class="nw-item-title">${esc(p.title)}${p.is_published ? '' : '<span class="nw-draft">Draft</span>'}</div>
      <div class="nw-item-date">${esc(fmtDate(p.published_at || p.created_at))}</div>
    </a>`).join('');
}
async function loadList() {
  try {
    const res = await fetch(`${API}/news?limit=50&all=1`, { headers: authHeaders() });
    const data = await res.json();
    isAdmin = !!data.is_admin;
    posts = data.posts || [];
    $('nw-new-btn').hidden = !isAdmin;
    renderList();
  } catch { $('nw-list').innerHTML = '<p class="nw-empty">Couldn’t load newsletters.</p>'; }
}
$('nw-list').addEventListener('click', e => {
  const a = e.target.closest('.nw-item'); if (a) openPost(a.dataset.id, true);
});
function showReader() {
  $('nw-wrap').classList.remove('nw-wrap--edit');
  $('nw-side').hidden = false; $('nw-main').hidden = false; $('nw-builder').hidden = true;
}

// ── Home: banner slideshow + update cards ─────────────────────────────────
let bannerSlides = [], bannerIdx = 0, bannerTimer = null, bannerRO = null;
const imgDims = {};
function loadDims(url) {
  if (imgDims[url]) return Promise.resolve(imgDims[url]);
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { imgDims[url] = { w: im.naturalWidth || 1, h: im.naturalHeight || 1 }; res(imgDims[url]); };
    im.onerror = () => res({ w: 1, h: 1 });
    im.src = url;
  });
}
function applyBannerCrop() {
  const box = document.querySelector('.nw-banner'); if (!box) return;
  const bw = box.clientWidth, bh = box.clientHeight; if (!bw || !bh) return;
  box.querySelectorAll('.nw-banner-bg').forEach(el => {
    const s = bannerSlides[+el.dataset.i], d = s && imgDims[s.image_url]; if (!d) return;
    const scale = Math.max(bw / d.w, bh / d.h), f = (s.zoom || 100) / 100;
    el.style.backgroundSize = `${(d.w * scale / bw) * 100 * f}% ${(d.h * scale / bh) * 100 * f}%`;
    el.style.backgroundPosition = `${s.position_x}% ${s.position_y}%`;
  });
}
function showBannerSlide(i) {
  const n = bannerSlides.length; bannerIdx = (i + n) % n;
  document.querySelectorAll('.nw-banner-slide').forEach((el, k) => el.classList.toggle('active', k === bannerIdx));
  document.querySelectorAll('.nw-banner-dot').forEach((el, k) => el.classList.toggle('active', k === bannerIdx));
}
function startBannerTimer() {
  clearInterval(bannerTimer);
  if (bannerSlides.length > 1) bannerTimer = setInterval(() => showBannerSlide(bannerIdx + 1), 6000);
}
async function renderBanner(host) {
  clearInterval(bannerTimer); if (bannerRO) bannerRO.disconnect();
  try { bannerSlides = (await (await fetch(`${API}/news/banner-slides`)).json()).slides || []; } catch { bannerSlides = []; }
  if (!host.isConnected) return; // navigated away while loading
  if (!bannerSlides.length) { host.innerHTML = ''; return; }
  const n = bannerSlides.length;
  host.innerHTML = `<div class="nw-banner">
    ${bannerSlides.map((s, i) => {
      const inner = `<div class="nw-banner-bg" data-i="${i}" style="background-image:url('${esc(s.image_url)}')"></div>`;
      return (safeUrl(s.link) || (s.link || '').startsWith('/'))
        ? `<a class="nw-banner-slide" href="${esc(s.link)}">${inner}</a>` : `<div class="nw-banner-slide">${inner}</div>`;
    }).join('')}
    ${n > 1 ? `<button class="nw-banner-arrow nw-banner-arrow--prev" type="button" aria-label="Previous">‹</button><button class="nw-banner-arrow nw-banner-arrow--next" type="button" aria-label="Next">›</button>
    <div class="nw-banner-dots">${bannerSlides.map((_, i) => `<div class="nw-banner-dot" data-i="${i}"></div>`).join('')}</div>` : ''}
  </div>`;
  showBannerSlide(0);
  const box = host.firstElementChild;
  if (n > 1) {
    box.querySelector('.nw-banner-arrow--prev').addEventListener('click', () => { showBannerSlide(bannerIdx - 1); startBannerTimer(); });
    box.querySelector('.nw-banner-arrow--next').addEventListener('click', () => { showBannerSlide(bannerIdx + 1); startBannerTimer(); });
    box.querySelectorAll('.nw-banner-dot').forEach(d => d.addEventListener('click', () => { showBannerSlide(+d.dataset.i); startBannerTimer(); }));
    startBannerTimer();
  }
  await Promise.all(bannerSlides.map(s => loadDims(s.image_url)));
  applyBannerCrop();
  bannerRO = new ResizeObserver(applyBannerCrop); bannerRO.observe(box);
}
function showHome() {
  showReader();
  currentPost = null; renderList();
  const vis = posts.filter(p => p.is_published || isAdmin);
  $('nw-main').innerHTML = `<div id="nw-banner-host"></div>
    <h2 class="nw-home-title">Latest updates <img src="/images/home/decoration-1.png" alt="" /></h2>
    ${vis.length ? `<div class="nw-cards">${vis.map(p => `
      <div class="nw-ncard" data-id="${p.id}">
        <div class="nw-ncard-body">
          <h3 class="nw-ncard-title">${esc(p.title)}${p.is_published ? '' : '<span class="nw-draft">Draft</span>'}</h3>
          <div class="nw-ncard-date">${esc(fmtDate(p.published_at || p.created_at))}</div>
          ${p.summary ? `<p class="nw-ncard-sum">${esc(p.summary)}</p>` : ''}
        </div>
        ${safeImg(p.cover_url) ? `<img class="nw-ncard-img" src="${esc(p.cover_url)}" alt="" loading="lazy" />` : ''}
      </div>`).join('')}</div>` : '<p class="nw-empty">No newsletters yet — check back soon!</p>'}`;
  renderBanner($('nw-banner-host'));
}
async function openPost(id, push) {
  showReader();
  if (push) history.pushState({}, '', `?post=${id}`);
  $('nw-main').innerHTML = '<p class="nw-empty">Loading…</p>';
  const res = await fetch(`${API}/news/${id}`, { headers: authHeaders() });
  if (!res.ok) { $('nw-main').innerHTML = '<p class="nw-empty">That newsletter doesn’t exist.</p>'; return; }
  const data = await res.json();
  currentPost = data.post; isAdmin = data.is_admin;
  $('nw-new-btn').hidden = !isAdmin;
  clearInterval(bannerTimer);
  $('nw-main').innerHTML = '<div class="nw-back"><button class="nw-btn nw-btn--blue nw-btn--sm" data-home>‹ All updates</button></div>' + articleHtml(currentPost).replace('</article>', isAdmin
    ? `<div class="nw-article-actions"><button class="nw-btn nw-btn--blue" data-edit>Edit</button><button class="nw-btn nw-btn--danger" data-del>Delete</button></div></article>` : '</article>');
  renderList();
  window.scrollTo(0, 0);
}
function goHome() { history.pushState({}, '', location.pathname); showHome(); window.scrollTo(0, 0); }
document.querySelector('.nw-side h2').addEventListener('click', goHome);
$('nw-main').addEventListener('click', async e => {
  const card = e.target.closest('.nw-ncard'); if (card) { openPost(card.dataset.id, true); return; }
  if (e.target.closest('[data-home]')) { goHome(); return; }
  if (e.target.closest('[data-edit]')) { openBuilder(currentPost); return; }
  if (e.target.closest('[data-del]') && confirm('Delete this newsletter permanently?')) {
    await fetch(`${API}/admin/news/${currentPost.id}`, { method: 'DELETE', headers: authHeaders() });
    currentPost = null; history.pushState({}, '', location.pathname); await loadList(); showHome();
  }
});

// ── Builder ───────────────────────────────────────────────────────────────
const BLOCK_LABELS = { text: '¶ Text', image: '🖼 Image', side: '◧ Text + Side Image', video: '▶ Video Link', link: '🔗 Link Button', divider: '― Divider' };
const BLOCK_DEFAULTS = {
  text: () => ({ type: 'text', title: '', text: '' }),
  image: () => ({ type: 'image', url: '', caption: '', size: 'full' }),
  side: () => ({ type: 'side', url: '', title: '', text: '', side: 'left' }),
  video: () => ({ type: 'video', url: '', caption: '' }),
  link: () => ({ type: 'link', label: '', url: '' }),
  divider: () => ({ type: 'divider' }),
};
function openBuilder(p) {
  editingId = p ? p.id : null;
  $('nw-title').value = p ? p.title : '';
  blocks = p ? parseBody(p.body) : [BLOCK_DEFAULTS.text()];
  $('nw-error').textContent = '';
  setPreview(false);
  $('nw-wrap').classList.add('nw-wrap--edit');
  $('nw-side').hidden = true; $('nw-main').hidden = true; $('nw-builder').hidden = false;
  renderCanvas();
  window.scrollTo(0, 0);
}
const fld = (i, key, label, val, attrs = '') => `<div><label class="nw-lbl">${label}</label><input class="nw-in" type="text" data-i="${i}" data-k="${key}" value="${esc(val)}" ${attrs} /></div>`;
const area = (i, key, label, val) => `<div><label class="nw-lbl">${label}</label><textarea class="nw-in" data-i="${i}" data-k="${key}" placeholder="Write here…">${esc(val)}</textarea><div class="nw-hint">## Heading · ### Subheading · + Added · ~ Changed · ! Fixed · - bullet · --- divider · **bold** · [text](https://link)</div></div>`;
const imgPicker = (i, b) => `<div>${safeImg(b.url) ? `<img class="nw-thumb" src="${esc(b.url)}" alt="" />` : ''}<label class="nw-lbl">Image</label><input type="file" data-up="${i}" accept="image/png,image/jpeg,image/webp,image/gif" /></div>`;
function blockFields(b, i) {
  switch (b.type) {
    case 'text': return fld(i, 'title', 'Title (optional)', b.title) + area(i, 'text', 'Text', b.text);
    case 'image': return imgPicker(i, b) + `<div class="nw-row">${fld(i, 'caption', 'Caption (optional)', b.caption)}<div><label class="nw-lbl">Size</label><select class="nw-in" data-i="${i}" data-k="size">${['full', 'medium', 'small'].map(s => `<option value="${s}"${b.size === s ? ' selected' : ''}>${s[0].toUpperCase() + s.slice(1)}</option>`).join('')}</select></div></div>`;
    case 'side': return imgPicker(i, b) + `<div><label class="nw-lbl">Image side</label><select class="nw-in" data-i="${i}" data-k="side"><option value="left"${b.side !== 'right' ? ' selected' : ''}>Left</option><option value="right"${b.side === 'right' ? ' selected' : ''}>Right</option></select></div>` + fld(i, 'title', 'Title (optional)', b.title) + area(i, 'text', 'Text', b.text);
    case 'video': return fld(i, 'url', 'YouTube / Vimeo link', b.url, 'placeholder="https://www.youtube.com/watch?v=…"') + fld(i, 'caption', 'Caption (optional)', b.caption);
    case 'link': return `<div class="nw-row">${fld(i, 'label', 'Button text', b.label)}${fld(i, 'url', 'Link (https://…)', b.url)}</div>`;
    case 'divider': return '<div class="nw-hint">A thin horizontal line between sections.</div>';
  }
  return '';
}
function renderCanvas() {
  const c = $('nw-canvas');
  if (!blocks.length) { c.innerHTML = '<div class="nw-canvas-empty">Nothing here yet — add a block from the left.</div>'; return; }
  c.innerHTML = blocks.map((b, i) => `
    <div class="nw-card" data-idx="${i}">
      <div class="nw-card-head">
        <span class="nw-grip" title="Drag to move">⠿</span>
        <span class="nw-card-type">${BLOCK_LABELS[b.type]}</span>
        <button class="nw-ic" data-act="up" title="Move up">↑</button>
        <button class="nw-ic" data-act="down" title="Move down">↓</button>
        <button class="nw-ic" data-act="dup" title="Duplicate">⧉</button>
        <button class="nw-ic nw-ic--del" data-act="del" title="Delete">✕</button>
      </div>
      <div class="nw-card-body">${blockFields(b, i)}</div>
    </div>`).join('');
}
document.querySelectorAll('[data-add]').forEach(btn => btn.addEventListener('click', () => {
  blocks.push(BLOCK_DEFAULTS[btn.dataset.add]()); renderCanvas();
  const last = $('nw-canvas').lastElementChild; if (last) last.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}));
const canvas = $('nw-canvas');
canvas.addEventListener('input', e => {
  const t = e.target; if (t.dataset.i == null || !t.dataset.k) return;
  blocks[+t.dataset.i][t.dataset.k] = t.value;
});
canvas.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.k && t.tagName === 'SELECT') blocks[+t.dataset.i][t.dataset.k] = t.value;
  if (t.dataset.up != null && t.files[0]) {
    const i = +t.dataset.up, fd = new FormData(); fd.append('image', t.files[0]);
    $('nw-error').textContent = '';
    try {
      const res = await fetch(`${API}/admin/news/image`, { method: 'POST', headers: authHeaders(), body: fd });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Upload failed.');
      blocks[i].url = data.url; renderCanvas();
    } catch (err) { $('nw-error').textContent = err.message; }
  }
});
canvas.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const i = +b.closest('.nw-card').dataset.idx;
  if (b.dataset.act === 'up' && i > 0) [blocks[i - 1], blocks[i]] = [blocks[i], blocks[i - 1]];
  else if (b.dataset.act === 'down' && i < blocks.length - 1) [blocks[i + 1], blocks[i]] = [blocks[i], blocks[i + 1]];
  else if (b.dataset.act === 'dup') blocks.splice(i + 1, 0, JSON.parse(JSON.stringify(blocks[i])));
  else if (b.dataset.act === 'del') { if (!confirm('Remove this block?')) return; blocks.splice(i, 1); }
  renderCanvas();
});
// Drag-reorder: only draggable while the grip is held, so text selection in fields still works.
let dragIdx = null;
canvas.addEventListener('mousedown', e => {
  const card = e.target.closest('.nw-card'); if (!card) return;
  card.draggable = !!e.target.closest('.nw-grip');
});
canvas.addEventListener('dragstart', e => {
  const card = e.target.closest('.nw-card'); if (!card) return;
  dragIdx = +card.dataset.idx; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
});
canvas.addEventListener('dragover', e => {
  if (dragIdx == null) return; e.preventDefault();
  const card = e.target.closest('.nw-card'); if (!card) return;
  canvas.querySelectorAll('.drop-before,.drop-after').forEach(n => n.classList.remove('drop-before', 'drop-after'));
  const r = card.getBoundingClientRect();
  card.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
});
canvas.addEventListener('drop', e => {
  if (dragIdx == null) return; e.preventDefault();
  const card = e.target.closest('.nw-card'); if (!card) return;
  const r = card.getBoundingClientRect();
  let to = +card.dataset.idx + (e.clientY < r.top + r.height / 2 ? 0 : 1);
  const [moved] = blocks.splice(dragIdx, 1);
  if (dragIdx < to) to--;
  blocks.splice(to, 0, moved); dragIdx = null; renderCanvas();
});
canvas.addEventListener('dragend', () => { dragIdx = null; renderCanvas(); });

function summaryFromBlocks(bl) {
  const t = bl.find(b => (b.type === 'text' || b.type === 'side') && (b.text || '').trim());
  if (!t) return '';
  return t.text.replace(/^[#+~!\-]+ /gm, '').replace(/\*\*(.+?)\*\*/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/\s+/g, ' ').trim().slice(0, 400);
}
function coverFromBlocks(bl) {
  const i = bl.find(b => (b.type === 'image' || b.type === 'side') && safeImg(b.url));
  return i ? i.url : '';
}
function currentDraft(published) {
  return { title: $('nw-title').value.trim(), body: JSON.stringify({ v: 2, blocks }), is_published: published };
}
function setPreview(on) {
  previewing = on;
  $('nw-preview').hidden = !on; $('nw-canvas').hidden = on;
  document.querySelector('.nw-palette').hidden = on;
  $('nw-builder-grid').style.gridTemplateColumns = on ? '1fr' : '';
  $('nw-preview-btn').textContent = on ? '✎ Back to Editing' : '👁 Preview';
  if (on) $('nw-preview').innerHTML = articleHtml({ ...currentDraft(true), title: $('nw-title').value || 'Untitled', published_at: new Date().toISOString() });
}
$('nw-preview-btn').addEventListener('click', () => setPreview(!previewing));
$('nw-cancel-btn').addEventListener('click', () => {
  if (!confirm('Discard unsaved changes?')) return;
  if (editingId) openPost(editingId, false); else showHome();
});
async function save(published) {
  const d = currentDraft(published);
  if (!d.title) { $('nw-error').textContent = 'Give this update a name first.'; $('nw-title').focus(); return; }
  $('nw-error').textContent = '';
  const fd = new FormData();
  fd.append('title', d.title); fd.append('body', d.body); fd.append('is_published', d.is_published);
  fd.append('is_pinned', editingId && currentPost ? !!currentPost.is_pinned : false);
  fd.append('category', editingId && currentPost ? currentPost.category : 'patch-notes');
  fd.append('version_label', editingId && currentPost ? currentPost.version_label || '' : '');
  fd.append('summary', summaryFromBlocks(blocks));
  fd.append('cover_url', coverFromBlocks(blocks));
  document.querySelectorAll('.nw-bar .nw-btn').forEach(b => b.disabled = true);
  try {
    const res = await fetch(editingId ? `${API}/admin/news/${editingId}` : `${API}/admin/news`, { method: editingId ? 'PUT' : 'POST', headers: authHeaders(), body: fd });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Save failed.');
    await loadList();
    openPost(data.post.id, true);
  } catch (err) { $('nw-error').textContent = err.message; }
  document.querySelectorAll('.nw-bar .nw-btn').forEach(b => b.disabled = false);
}
$('nw-draft-btn').addEventListener('click', () => save(false));
$('nw-publish-btn').addEventListener('click', () => save(true));
$('nw-new-btn').addEventListener('click', () => { editingId = null; openBuilder(null); });

// ── Routing ───────────────────────────────────────────────────────────────
function route() {
  const id = new URLSearchParams(location.search).get('post');
  if (id) return openPost(id, false);
  showHome();
}
window.addEventListener('popstate', route);
loadList().then(route);
</script>
</body>
</html>
