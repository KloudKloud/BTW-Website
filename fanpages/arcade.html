<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcade ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      background: #000; color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif;
      /* A hair taller than the viewport so the page background is
         actually reachable by scrolling, instead of being completely
         hidden behind a hero that exactly fills the screen. More content
         boxes land below the hero as they're built, pushing this further
         anyway -- this is just enough room for now. */
      min-height: 130vh; overflow-x: hidden;
    }
    a { color: inherit; }
    h1, h2, h3, .ar-font-display { font-family: 'Fredoka', 'Lato', cursive; }

    /* ── Full-width video hero -- sits directly in the page flow (not
       inside a max-width wrap), same full-bleed pattern as the homepage's
       own .fp-video-area sections. Building the rest of the page one box
       at a time from here. ── */
    .ar-hero { position: relative; width: 100%; height: 420px; overflow: hidden; background: #000; }
    .ar-hero-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .ar-hero-scrim {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.15) 40%, rgba(0,0,0,0.75) 100%);
    }

    @media (max-width: 720px) {
      .ar-hero { height: 280px; }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>

<section class="ar-hero">
  <video class="ar-hero-video" autoplay muted loop playsinline>
    <source src="/images/home/main-background.mp4" type="video/mp4" />
  </video>
  <div class="ar-hero-scrim"></div>
</section>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');

if (!token) {
  location.href = window.fpUrl('/');
}
</script>
</body>
</html>
