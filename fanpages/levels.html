<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Levels ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      background: #0d0d0d; color: #f0f0f0;
      font-family: 'Baloo 2', 'Fredoka', 'Lato', Arial, sans-serif;
      min-height: 100vh; position: relative; overflow-x: hidden;
    }
    a { color: inherit; }
    h1, h2, h3, .lv-font-display { font-family: 'Fredoka', 'Lato', cursive; }

    /* Scrolling page background -- same technique as the Posts/Characters
       browse pages: position:absolute with a JS-measured height, since
       percentage/inset sizing can't resolve against a body whose height is
       just "however tall its content is." */
    .lv-bg-img {
      position: absolute; top: 0; left: 0; right: 0; width: 100%; height: 100vh;
      object-fit: cover; object-position: center top; filter: blur(4px); z-index: 0;
    }
    .lv-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.5); z-index: 0; }
    .lv-content-z { position: relative; z-index: 1; }

    .lv-wrap { max-width: 1180px; margin: 0 auto; padding: 2rem 2.5rem 5rem; }

    /* ── Hero header ───────────────────────────────────────────────────── */
    .lv-hero {
      display: flex; align-items: center; gap: 1.8rem; flex-wrap: wrap;
      border-radius: 20px; padding: 2rem; position: relative; overflow: hidden;
      background-image: linear-gradient(160deg, rgba(10,8,20,0.55), rgba(10,8,20,0.78)), url('/images/home/box-background-3.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 14px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .lv-hero-avatar-wrap {
      width: 128px; height: 128px; border-radius: 20px; flex-shrink: 0; overflow: hidden;
      border: 3px solid var(--gold, #f0c060); box-shadow: 0 0 22px rgba(240,192,96,0.35);
      background: #1a1626; display: flex; align-items: center; justify-content: center;
    }
    .lv-hero-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .lv-hero-avatar-fallback { font-size: 3rem; font-family: 'Fredoka', cursive; color: var(--gold, #f0c060); }
    .lv-hero-info { flex: 1; min-width: 220px; }
    .lv-hero-name {
      font-size: 2rem; font-weight: 600; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .lv-hero-name img.lv-deco { width: 22px; height: 22px; }
    .lv-hero-title {
      color: #7fa8d9; font-size: 1.05rem; margin-top: 0.3rem; display: flex; align-items: center; gap: 0.5rem;
      text-shadow: 0 0 18px rgba(127,168,217,0.55), 0 1px 3px rgba(0,0,0,0.5);
    }
    .lv-hero-title img { width: 22px; height: 22px; filter: drop-shadow(0 0 4px rgba(240,192,96,0.5)); }
    .lv-hero-xpbar-wrap { margin-top: 1rem; max-width: 420px; }
    .lv-hero-xp-label { font-size: 0.8rem; color: #c9bfe0; margin-bottom: 0.3rem; display: flex; justify-content: space-between; }
    .lv-hero-xp-track {
      height: 12px; border-radius: 8px; background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative;
    }
    .lv-hero-xp-fill {
      height: 100%; border-radius: 8px;
      background: linear-gradient(90deg, #5e32a8, #9b5de5, #f0c060);
      box-shadow: 0 0 10px rgba(155,93,229,0.6); position: relative; overflow: hidden;
    }
    .lv-hero-xp-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.45) 50%, transparent 70%);
      background-size: 200% 100%; animation: lv-shimmer 2.4s linear infinite;
    }
    @keyframes lv-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .lv-hero-level-badge {
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem; flex-shrink: 0;
    }
    .lv-hero-level-circle {
      width: 96px; height: 96px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5e32a8, #2a0f52);
      border: 3px solid var(--gold, #f0c060);
      box-shadow: 0 0 18px rgba(240,192,96,0.4), inset 0 0 14px rgba(155,93,229,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.3rem; font-weight: 700; font-family: 'Fredoka', cursive; color: #fff;
      text-shadow: 0 0 10px rgba(240,192,96,0.6);
    }
    .lv-hero-level-label { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: #c9bfe0; }

    /* ── Stat tiles ────────────────────────────────────────────────────── */
    .lv-stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem; margin-top: 1.4rem; }
    /* Gems are an Arcade-page currency, not a leveling stat -- same tile
       styling as the other four so it doesn't read as a different kind of
       info, just a distinct accent color (matches the Arcade page's own
       gem color) so it's still visually distinguishable at a glance. */
    .lv-stat-num--gems { color: #7fe0c9; }
    .lv-stat-tile {
      border-radius: 14px; padding: 1rem 1.1rem; text-align: center;
      background-image: linear-gradient(160deg, rgba(6,6,16,0.55), rgba(6,6,16,0.75)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .lv-stat-tile .lv-stat-num { font-size: 1.6rem; font-weight: 700; font-family: 'Fredoka', cursive; color: var(--gold, #f0c060); }
    .lv-stat-tile .lv-stat-lbl { font-size: 0.78rem; color: #c9bfe0; margin-top: 0.2rem; }

    /* ── Section boxes ─────────────────────────────────────────────────── */
    .lv-section { margin-top: 2.2rem; }
    .lv-section-title {
      font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
    }
    .lv-section-title img { width: 20px; height: 20px; }
    .lv-box {
      border-radius: 16px; padding: 1.4rem;
      background-image: linear-gradient(160deg, rgba(6,6,16,0.55), rgba(6,6,16,0.75)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    /* ── Badge grid ────────────────────────────────────────────────────── */
    .lv-badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
    .lv-badge-card {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.5rem;
      padding: 1rem 0.6rem; border-radius: 14px;
      background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .lv-badge-card.earned {
      border-color: rgba(240,192,96,0.5); box-shadow: 0 0 16px rgba(240,192,96,0.18);
    }
    .lv-badge-card.earned:hover { transform: translateY(-3px); box-shadow: 0 0 20px rgba(240,192,96,0.32); }
    .lv-badge-icon-wrap {
      width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 30%, rgba(94,50,168,0.5), rgba(42,15,82,0.5));
      border: 2px solid rgba(255,255,255,0.12);
    }
    .lv-badge-card.earned .lv-badge-icon-wrap { border-color: var(--gold, #f0c060); }
    .lv-badge-icon-wrap img { width: 52px; height: 52px; object-fit: contain; }
    .lv-badge-card:not(.earned) .lv-badge-icon-wrap img { filter: grayscale(1) brightness(0.45); }
    .lv-badge-name { font-size: 0.88rem; font-weight: 600; font-family: 'Fredoka', cursive; }
    .lv-badge-card.earned .lv-badge-name { color: var(--gold, #f0c060); }
    .lv-badge-card:not(.earned) .lv-badge-name { color: #847f94; }
    .lv-badge-req { font-size: 0.72rem; color: #a89bc4; }
    .lv-badge-card:not(.earned) .lv-badge-req::before { content: '🔒 '; }

    /* ── Two-column: activity + leaderboard ───────────────────────────── */
    .lv-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6rem; align-items: start; }
    @media (max-width: 860px) { .lv-two-col { grid-template-columns: 1fr; } .lv-stats-row { grid-template-columns: repeat(2, 1fr); } }

    .lv-activity-row {
      display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
      padding: 0.65rem 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .lv-activity-row:last-child { border-bottom: none; }
    .lv-activity-label { font-size: 0.9rem; color: #e4ddf2; }
    .lv-activity-time { font-size: 0.75rem; color: #8d85a3; margin-top: 0.1rem; }
    .lv-activity-xp { font-size: 0.9rem; font-weight: 700; color: #7fd98a; white-space: nowrap; }
    .lv-empty { color: #8d85a3; font-size: 0.9rem; padding: 0.5rem 0; }

    .lv-lb-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .lv-lb-tab {
      flex: 1; text-align: center; padding: 0.5rem 0.7rem; border-radius: 10px; cursor: pointer;
      background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); font-size: 0.88rem;
      font-family: 'Fredoka', cursive; color: #c9bfe0; transition: all 0.15s ease;
    }
    .lv-lb-tab.active { background: rgba(240,192,96,0.16); border-color: var(--gold, #f0c060); color: var(--gold, #f0c060); }
    .lv-lb-row {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.3rem; border-radius: 10px;
    }
    .lv-lb-row:nth-child(odd) { background: rgba(255,255,255,0.03); }
    .lv-lb-rank {
      width: 24px; text-align: center; font-weight: 700; font-family: 'Fredoka', cursive; color: #8d85a3; flex-shrink: 0;
    }
    .lv-lb-row:nth-child(1) .lv-lb-rank { color: #f0c060; }
    .lv-lb-row:nth-child(2) .lv-lb-rank { color: #c9c9d4; }
    .lv-lb-row:nth-child(3) .lv-lb-rank { color: #cd8a5c; }
    .lv-lb-avatar {
      width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      background: #1a1626; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-family: 'Fredoka', cursive; color: var(--gold, #f0c060);
    }
    .lv-lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .lv-lb-name { flex: 1; font-size: 0.88rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lv-lb-name a { text-decoration: none; }
    .lv-lb-name a:hover { text-decoration: underline; }
    .lv-lb-lvl { font-size: 0.72rem; color: #8d85a3; margin-left: 0.4rem; }
    .lv-lb-xp { font-size: 0.85rem; font-weight: 700; color: #f0c060; white-space: nowrap; }

    .lv-loading { text-align: center; padding: 4rem 0; color: #8d85a3; font-size: 1rem; }
  </style>
</head>
<body>

<img class="lv-bg-img" id="lv-bg-img" src="/images/home/potential-box-background.png" alt="" />
<div class="lv-bg-overlay"></div>

<div class="lv-content-z">
<div id="fanpages-topbar-root"></div>

<main class="lv-wrap">
  <div id="lv-loading" class="lv-loading">Loading your badges…</div>

  <div id="lv-content" hidden>
    <section class="lv-hero">
      <div class="lv-hero-avatar-wrap" id="lv-hero-avatar-wrap"></div>
      <div class="lv-hero-info">
        <div class="lv-hero-name" id="lv-hero-name">
          <img class="lv-deco" src="/images/home/decoration-2.png" alt="" />
          <span id="lv-hero-name-text"></span>
        </div>
        <div class="lv-hero-title" id="lv-hero-title" hidden>
          <img id="lv-hero-title-icon" src="" alt="" />
          <span id="lv-hero-title-text"></span>
        </div>
        <div class="lv-hero-xpbar-wrap">
          <div class="lv-hero-xp-label">
            <span id="lv-hero-xp-into"></span>
            <span id="lv-hero-xp-need"></span>
          </div>
          <div class="lv-hero-xp-track"><div class="lv-hero-xp-fill" id="lv-hero-xp-fill" style="width:0%"></div></div>
        </div>
      </div>
      <div class="lv-hero-level-badge">
        <div class="lv-hero-level-circle" id="lv-hero-level-circle"></div>
        <div class="lv-hero-level-label">Level</div>
      </div>
    </section>

    <div class="lv-stats-row">
      <div class="lv-stat-tile"><div class="lv-stat-num" id="lv-stat-level"></div><div class="lv-stat-lbl">Current Level</div></div>
      <div class="lv-stat-tile"><div class="lv-stat-num" id="lv-stat-xp"></div><div class="lv-stat-lbl">Total XP</div></div>
      <div class="lv-stat-tile"><div class="lv-stat-num" id="lv-stat-badges"></div><div class="lv-stat-lbl">Badges Earned</div></div>
      <div class="lv-stat-tile"><div class="lv-stat-num" id="lv-stat-member"></div><div class="lv-stat-lbl">Member Since</div></div>
      <div class="lv-stat-tile"><div class="lv-stat-num lv-stat-num--gems" id="lv-stat-gems"></div><div class="lv-stat-lbl">💎 Gems</div></div>
    </div>

    <section class="lv-section">
      <h2 class="lv-section-title"><img src="/images/home/decoration-8.png" alt="" /> Milestone Badges</h2>
      <div class="lv-box">
        <div class="lv-badge-grid" id="lv-badge-grid"></div>
      </div>
    </section>

    <div class="lv-two-col">
      <section class="lv-section">
        <h2 class="lv-section-title"><img src="/images/home/decoration-1.png" alt="" /> Recent Activity</h2>
        <div class="lv-box" id="lv-activity-box">
          <div class="lv-empty">Loading…</div>
        </div>
      </section>

      <section class="lv-section">
        <h2 class="lv-section-title"><img src="/images/home/decoration-1.png" alt="" /> Leaderboard</h2>
        <div class="lv-box">
          <div class="lv-lb-tabs">
            <div class="lv-lb-tab active" data-tab="weekly" id="lv-lb-tab-weekly">This Week</div>
            <div class="lv-lb-tab" data-tab="global" id="lv-lb-tab-global">All-Time</div>
          </div>
          <div id="lv-lb-list"><div class="lv-empty">Loading…</div></div>
        </div>
      </section>
    </div>
  </div>
</main>
</div>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
const fpUrl = window.fpUrl;

if (!token) {
  location.href = fpUrl('/');
}

let LB_DATA = { leaderboard_weekly: [], leaderboard_global: [] };

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}
function avatarHtml(user, size) {
  const initial = (user.display_name || user.username || '?').charAt(0).toUpperCase();
  return user.avatar
    ? `<img src="${escapeHtml(user.avatar)}" alt="" />`
    : `<span style="font-size:${size ? size * 0.4 : 14}px;">${initial}</span>`;
}

async function loadLevelHub() {
  try {
    const res = await fetch('/api/level-hub', { headers: authHeaders() });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    renderHero(data.user);
    renderBadges(data.badges);
    renderActivity(data.recent_activity);
    LB_DATA.leaderboard_weekly = data.leaderboard_weekly;
    LB_DATA.leaderboard_global = data.leaderboard_global;
    renderLeaderboard('weekly');
    document.getElementById('lv-loading').hidden = true;
    document.getElementById('lv-content').hidden = false;
    syncBgHeight();
  } catch (e) {
    document.getElementById('lv-loading').textContent = "Couldn't load your level data — try refreshing.";
  }
}

function renderHero(u) {
  const name = u.display_name || u.username;
  document.getElementById('lv-hero-name-text').textContent = name;
  document.getElementById('lv-hero-avatar-wrap').innerHTML = u.avatar
    ? `<img src="${escapeHtml(u.avatar)}" alt="" />`
    : `<span class="lv-hero-avatar-fallback">${escapeHtml(name.charAt(0).toUpperCase())}</span>`;
  document.getElementById('lv-hero-level-circle').textContent = u.level;

  if (u.title) {
    const titleEl = document.getElementById('lv-hero-title');
    titleEl.hidden = false;
    document.getElementById('lv-hero-title-text').textContent = u.title;
    document.getElementById('lv-hero-title-icon').src = u.title_icon || '';
  }

  const into = u.xp_into_level || 0;
  const need = u.xp_for_next_level || 1;
  const pct = Math.max(0, Math.min(100, (into / need) * 100));
  document.getElementById('lv-hero-xp-fill').style.width = `${pct}%`;
  document.getElementById('lv-hero-xp-into').textContent = `${into.toLocaleString()} / ${need.toLocaleString()} XP`;
  document.getElementById('lv-hero-xp-need').textContent = `Level ${u.level + 1}`;

  document.getElementById('lv-stat-level').textContent = u.level;
  document.getElementById('lv-stat-xp').textContent = u.xp.toLocaleString();
  document.getElementById('lv-stat-badges').textContent = `${u.badges_earned} / ${u.badges_total}`;
  document.getElementById('lv-stat-member').textContent = u.member_since
    ? new Date(u.member_since).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })
    : '—';
  document.getElementById('lv-stat-gems').textContent = (u.gems || 0).toLocaleString();
}

function renderBadges(badges) {
  const grid = document.getElementById('lv-badge-grid');
  grid.innerHTML = badges.map(b => `
    <div class="lv-badge-card ${b.earned ? 'earned' : ''}" title="${b.earned ? 'Earned!' : `Reach Level ${b.level} to unlock`}">
      <div class="lv-badge-icon-wrap"><img src="${escapeHtml(b.icon)}" alt="" /></div>
      <div class="lv-badge-name">${escapeHtml(b.name)}</div>
      <div class="lv-badge-req">Level ${b.level}</div>
    </div>
  `).join('');
}

function renderActivity(activity) {
  const box = document.getElementById('lv-activity-box');
  if (!activity.length) { box.innerHTML = '<div class="lv-empty">No activity yet — go post something!</div>'; return; }
  box.innerHTML = activity.map(a => `
    <div class="lv-activity-row">
      <div>
        <div class="lv-activity-label">${escapeHtml(a.label)}</div>
        <div class="lv-activity-time">${timeAgo(a.created_at)}</div>
      </div>
      <div class="lv-activity-xp">+${a.xp_amount} XP</div>
    </div>
  `).join('');
}

function renderLeaderboard(which) {
  document.getElementById('lv-lb-tab-weekly').classList.toggle('active', which === 'weekly');
  document.getElementById('lv-lb-tab-global').classList.toggle('active', which === 'global');
  const rows = which === 'weekly' ? LB_DATA.leaderboard_weekly : LB_DATA.leaderboard_global;
  const list = document.getElementById('lv-lb-list');
  if (!rows.length) { list.innerHTML = `<div class="lv-empty">${which === 'weekly' ? 'Nobody has earned XP this week yet.' : 'No XP earned yet.'}</div>`; return; }
  list.innerHTML = rows.map((r, i) => `
    <div class="lv-lb-row">
      <div class="lv-lb-rank">${i + 1}</div>
      <div class="lv-lb-avatar">${avatarHtml(r)}</div>
      <div class="lv-lb-name"><a href="${fpUrl('/' + r.username)}">${escapeHtml(r.display_name || r.username)}</a><span class="lv-lb-lvl">Lv ${r.level}</span></div>
      <div class="lv-lb-xp">${r.xp.toLocaleString()} XP</div>
    </div>
  `).join('');
}

document.getElementById('lv-lb-tab-weekly').addEventListener('click', () => renderLeaderboard('weekly'));
document.getElementById('lv-lb-tab-global').addEventListener('click', () => renderLeaderboard('global'));

function syncBgHeight() {
  const bgEl = document.getElementById('lv-bg-img');
  bgEl.style.height = '0';
  const h = Math.max(document.documentElement.scrollHeight, window.innerHeight) + 'px';
  bgEl.style.height = h;
}
let bgResizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(bgResizeTimer); bgResizeTimer = setTimeout(syncBgHeight, 200); });
window.addEventListener('load', syncBgHeight);

if (token) loadLevelHub();
</script>
</body>
</html>
