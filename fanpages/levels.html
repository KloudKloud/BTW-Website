<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Levels ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      background: #0d0d0d; color: #f0f0f0;
      font-family: 'Baloo 2', 'Fredoka', 'Lato', Arial, sans-serif;
      min-height: 100vh; position: relative; overflow-x: hidden;
    }
    a { color: inherit; }
    h1, h2, h3, .lv-font-display { font-family: 'Fredoka', 'Lato', cursive; }

    /* Scrolling page background -- same technique as the Posts/Characters
       browse pages: position:absolute with a JS-measured height, since
       percentage/inset sizing can't resolve against a body whose height is
       just "however tall its content is." */
    .lv-bg-img {
      position: absolute; top: 0; left: 0; right: 0; width: 100%; height: 100vh;
      object-fit: cover; object-position: center top; filter: blur(4px); z-index: 0;
    }
    .lv-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.5); z-index: 0; }
    .lv-content-z { position: relative; z-index: 1; }

    .lv-wrap { max-width: 1180px; margin: 0 auto; padding: 2rem 2.5rem 5rem; }

    /* ── Hero header ───────────────────────────────────────────────────── */
    .lv-hero {
      display: flex; align-items: center; gap: 1.8rem; flex-wrap: wrap;
      border-radius: 20px; padding: 2rem; position: relative; overflow: hidden;
      background-image: linear-gradient(160deg, rgba(10,8,20,0.55), rgba(10,8,20,0.78)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 14px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .lv-hero-avatar-wrap {
      width: 128px; height: 128px; border-radius: 20px; flex-shrink: 0; overflow: hidden;
      border: 3px solid var(--gold, #f0c060); box-shadow: 0 0 22px rgba(240,192,96,0.35);
      background: #1a1626; display: flex; align-items: center; justify-content: center;
    }
    .lv-hero-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .lv-hero-avatar-fallback { font-size: 3rem; font-family: 'Fredoka', cursive; color: var(--gold, #f0c060); }
    .lv-hero-info { flex: 1; min-width: 220px; }
    .lv-hero-name {
      font-size: 2rem; font-weight: 600; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    }
    .lv-hero-name img.lv-deco { width: 22px; height: 22px; }
    .lv-hero-title {
      color: #7fa8d9; font-size: 1.05rem; margin-top: 0.3rem; display: flex; align-items: center; gap: 0.5rem;
      text-shadow: 0 0 18px rgba(127,168,217,0.55), 0 1px 3px rgba(0,0,0,0.5);
    }
    .lv-hero-title img { width: 22px; height: 22px; filter: drop-shadow(0 0 4px rgba(240,192,96,0.5)); }
    .lv-hero-xpbar-wrap { margin-top: 1rem; max-width: 420px; }
    .lv-hero-xp-label { font-size: 0.8rem; color: #c9bfe0; margin-bottom: 0.3rem; display: flex; justify-content: space-between; }
    .lv-hero-xp-track {
      height: 12px; border-radius: 8px; background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.1); overflow: hidden; position: relative;
    }
    .lv-hero-xp-fill {
      height: 100%; border-radius: 8px;
      background: linear-gradient(90deg, #5e32a8, #9b5de5, #f0c060);
      box-shadow: 0 0 10px rgba(155,93,229,0.6); position: relative; overflow: hidden;
    }
    .lv-hero-xp-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.45) 50%, transparent 70%);
      background-size: 200% 100%; animation: lv-shimmer 2.4s linear infinite;
    }
    @keyframes lv-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    .lv-hero-level-badge {
      display: flex; flex-direction: column; align-items: center; gap: 0.3rem; flex-shrink: 0;
    }
    .lv-hero-level-circle {
      width: 96px; height: 96px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #5e32a8, #2a0f52);
      border: 3px solid var(--gold, #f0c060);
      box-shadow: 0 0 18px rgba(240,192,96,0.4), inset 0 0 14px rgba(155,93,229,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.3rem; font-weight: 700; font-family: 'Fredoka', cursive; color: #fff;
      text-shadow: 0 0 10px rgba(240,192,96,0.6);
    }
    .lv-hero-level-label { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: #c9bfe0; }

    /* ── Stat tiles ────────────────────────────────────────────────────── */
    .lv-stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-top: 1.4rem; }
    .lv-stat-tile {
      border-radius: 14px; padding: 1rem 1.1rem; text-align: center;
      background-image: linear-gradient(160deg, rgba(6,6,16,0.55), rgba(6,6,16,0.75)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.12);
    }
    .lv-stat-tile .lv-stat-num {
      font-size: 1.6rem; font-weight: 700; font-family: 'Fredoka', cursive; color: #ffffff;
      text-shadow: 0 0 14px rgba(255,255,255,0.75), 0 1px 3px rgba(0,0,0,0.5);
    }
    .lv-stat-tile .lv-stat-lbl { font-size: 0.78rem; color: #c9bfe0; margin-top: 0.2rem; }

    /* ── Section boxes ─────────────────────────────────────────────────── */
    .lv-section { margin-top: 2.2rem; }
    .lv-section-title {
      font-size: 1.4rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;
    }
    .lv-section-title img { width: 20px; height: 20px; }
    .lv-box {
      border-radius: 16px; padding: 1.4rem;
      background-image: linear-gradient(160deg, rgba(6,6,16,0.55), rgba(6,6,16,0.75)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    /* ── Badge grid ────────────────────────────────────────────────────── */
    .lv-badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }
    .lv-badge-card {
      display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.5rem;
      padding: 1rem 0.6rem; border-radius: 14px;
      background: rgba(0,0,0,0.28); border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .lv-badge-card.earned {
      border-color: rgba(240,192,96,0.5); box-shadow: 0 0 16px rgba(240,192,96,0.18);
    }
    .lv-badge-card.earned:hover { transform: translateY(-3px); box-shadow: 0 0 20px rgba(240,192,96,0.32); }
    .lv-badge-icon-wrap {
      width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 30%, rgba(94,50,168,0.5), rgba(42,15,82,0.5));
      border: 2px solid rgba(255,255,255,0.12);
    }
    .lv-badge-card.earned .lv-badge-icon-wrap { border-color: var(--gold, #f0c060); }
    .lv-badge-icon-wrap img { width: 52px; height: 52px; object-fit: contain; }
    .lv-badge-card:not(.earned) .lv-badge-icon-wrap img { filter: grayscale(1) brightness(0.45); }
    .lv-badge-name { font-size: 0.88rem; font-weight: 600; font-family: 'Fredoka', cursive; }
    .lv-badge-card.earned .lv-badge-name { color: var(--gold, #f0c060); }
    .lv-badge-card:not(.earned) .lv-badge-name { color: #847f94; }
    .lv-badge-req { font-size: 0.72rem; color: #a89bc4; }
    .lv-badge-card:not(.earned) .lv-badge-req::before { content: '🔒 '; }

    /* ── Banner row: almost-full-width admin-managed image carousel, with a
       narrow side column holding a shrunk/rectangular Leaderboard box and
       the Recent Activity box stacked underneath it. Mirrors the Home
       hero's "main area + narrow flanking side boxes" shape. The banner is
       deliberately NOT as tall as the side column -- JS (syncBannerHeight)
       pins its top to 1/4 of the way down the Leaderboard box and its
       bottom to 1/4 up from the bottom of the Recent Activity box (i.e.
       3/4 of the way down it), via margin-top + height, so it reads as a
       shorter strip "threaded" between the two side boxes rather than
       matching their full span. The height/margin-top below are just a
       pre-JS fallback. ─────────────────────────────────────────────────── */
    .lv-banner-row { display: flex; gap: 1.6rem; align-items: flex-start; }
    .lv-banner-main {
      flex: 1; min-width: 0; position: relative; height: 200px; border-radius: 16px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 10px 40px rgba(0,0,0,0.4); background: #0a0812;
    }
    /* Slide carousel -- a flex track of full-width slides translated
       horizontally, with a real (uncropped) clone of the last slide glued
       to the front and of the first slide glued to the end so prev/next
       always has something to slide into in either direction. Landing on
       either clone triggers an instant (no-transition) jump back to the
       matching real slide once the animation finishes -- see lvGoTo()/the
       track's transitionend handler below -- so the loop reads as
       infinite instead of snapping back visibly. */
    .lv-banner-track { position: absolute; inset: 0; display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.3, 0, 0.2, 1); }
    .lv-banner-slide {
      flex: 0 0 100%; width: 100%; height: 100%; position: relative;
      text-decoration: none; color: #fff; display: block;
    }
    .lv-banner-slide-bg { position: absolute; inset: 0; background-size: cover; background-position: center; background-repeat: no-repeat; }
    .lv-banner-empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #8d85a3; font-size: 0.95rem; text-align: center; padding: 1rem;
      background-image: linear-gradient(160deg, rgba(6,6,16,0.55), rgba(6,6,16,0.75)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
    }
    .lv-banner-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
      background: rgba(10,8,16,0.55); color: #fff; font-size: 1.2rem; line-height: 1; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, border-color 0.2s; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    .lv-banner-arrow:hover { background: rgba(240,192,96,0.25); border-color: rgba(240,192,96,0.5); }
    .lv-banner-arrow--prev { left: 0.6rem; }
    .lv-banner-arrow--next { right: 0.6rem; }
    .lv-banner-dots { position: absolute; bottom: 0.7rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.4rem; z-index: 2; }
    .lv-banner-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); border: 1px solid rgba(0,0,0,0.3); cursor: pointer; }
    .lv-banner-dot.active { background: var(--gold, #f0c060); }

    .lv-banner-side { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 1.2rem; }
    .lv-banner-side .lv-box { padding: 1rem 1.1rem; }
    .lv-side-box-title {
      font-size: 1rem; font-family: 'Fredoka', cursive; display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.7rem;
    }
    .lv-side-box-title img { width: 16px; height: 16px; }
    .lv-scroll-5 {
      max-height: 215px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.3) transparent;
    }
    .lv-scroll-5::-webkit-scrollbar { width: 5px; }
    .lv-scroll-5::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.25); border-radius: 4px; }

    @media (max-width: 860px) {
      .lv-banner-row { flex-direction: column; }
      /* flex:1 (flex-basis:0) only grows into space the column already has,
         but an auto-height column container has none to give -- pin an
         explicit height here instead of relying on flex-grow. */
      /* align-items is flex-start on desktop now (not stretch), which in
         column mode controls the cross axis (width) -- without an explicit
         width here the banner collapses to its own intrinsic (near-zero)
         width instead of filling the column. */
      .lv-banner-main { flex: none; width: 100%; height: 200px; }
      .lv-banner-side { width: 100%; }
      .lv-stats-row { grid-template-columns: repeat(2, 1fr); }
    }

    .lv-activity-row {
      display: flex; align-items: center; justify-content: space-between; gap: 0.8rem;
      padding: 0.65rem 0; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .lv-activity-row:last-child { border-bottom: none; }
    .lv-activity-label { font-size: 0.9rem; color: #e4ddf2; }
    .lv-activity-time { font-size: 0.75rem; color: #8d85a3; margin-top: 0.1rem; }
    .lv-activity-xp { font-size: 0.9rem; font-weight: 700; color: #7fd98a; white-space: nowrap; }
    .lv-empty { color: #8d85a3; font-size: 0.9rem; padding: 0.5rem 0; }

    .lv-lb-tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .lv-lb-tab {
      flex: 1; text-align: center; padding: 0.5rem 0.7rem; border-radius: 10px; cursor: pointer;
      background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); font-size: 0.88rem;
      font-family: 'Fredoka', cursive; color: #c9bfe0; transition: all 0.15s ease;
    }
    .lv-lb-tab.active { background: rgba(240,192,96,0.16); border-color: var(--gold, #f0c060); color: var(--gold, #f0c060); }
    .lv-lb-row {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0.3rem; border-radius: 10px;
    }
    .lv-lb-row:nth-child(odd) { background: rgba(255,255,255,0.03); }
    .lv-lb-rank {
      width: 24px; text-align: center; font-weight: 700; font-family: 'Fredoka', cursive; color: #8d85a3; flex-shrink: 0;
    }
    .lv-lb-row:nth-child(1) .lv-lb-rank { color: #f0c060; }
    .lv-lb-row:nth-child(2) .lv-lb-rank { color: #c9c9d4; }
    .lv-lb-row:nth-child(3) .lv-lb-rank { color: #cd8a5c; }
    .lv-lb-avatar {
      width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
      background: #1a1626; display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255,255,255,0.15); font-size: 0.9rem; font-family: 'Fredoka', cursive; color: var(--gold, #f0c060);
    }
    .lv-lb-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .lv-lb-name { flex: 1; font-size: 0.88rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lv-lb-name a { text-decoration: none; }
    .lv-lb-name a:hover { text-decoration: underline; }
    .lv-lb-lvl { font-size: 0.72rem; color: #8d85a3; margin-left: 0.4rem; }
    .lv-lb-xp { font-size: 0.85rem; font-weight: 700; color: #f0c060; white-space: nowrap; }

    .lv-loading { text-align: center; padding: 4rem 0; color: #8d85a3; font-size: 1rem; }
  </style>
</head>

<img class="lv-bg-img" id="lv-bg-img" src="/images/home/potential-box-background.png" alt="" />
<div class="lv-bg-overlay"></div>

<div class="lv-content-z">
<div id="fanpages-topbar-root"></div>

<main class="lv-wrap">
  <div id="lv-loading" class="lv-loading">Loading your badges…</div>

  <div id="lv-content" hidden>
    <section class="lv-hero">
      <div class="lv-hero-avatar-wrap" id="lv-hero-avatar-wrap"></div>
      <div class="lv-hero-info">
        <div class="lv-hero-name" id="lv-hero-name">

        <div class="lv-hero-title" id="lv-hero-title" hidden>

        <div class="lv-hero-xpbar-wrap">
          <div class="lv-hero-xp-label">
            <span id="lv-hero-xp-into"></span>

    <div class="lv-stats-row">

      <div class="lv-stat-tile"><div class="lv-stat-num" id="lv-stat-xp"></div><div class="lv-stat-lbl">Total XP</div></div>
      <div class="lv-stat-tile"><div class="lv-stat-num" id="lv-stat-badges"></div><div class="lv-stat-lbl">Badges Earned</div></div>
      <div class="lv-stat-tile"><div class="lv-stat-num" id="lv-stat-member"></div><div class="lv-stat-lbl">Member Since</div></div>
    </div>

    <section class="lv-section">
      <h2 class="lv-section-title"><img src="/images/home/decoration-8.png" alt="" /> Milestone Badges</h2>
      <div class="lv-box">
        <div class="lv-badge-grid" id="lv-badge-grid"></div>
      </div>
    </section>

    <section class="lv-section">
      <div class="lv-banner-row">
        <div class="lv-banner-main" id="lv-banner-main">

        </div>

        <div class="lv-banner-side">
          <div class="lv-box">
            <h3 class="lv-side-box-title"><img src="/images/home/decoration-1.png" alt="" /> Leaderboard</h3>
            <div class="lv-lb-tabs">
              <div class="lv-lb-tab active" data-tab="weekly" id="lv-lb-tab-weekly">This Week</div>

          <div class="lv-box">

              <div class="lv-empty">Loading…</div>

          </div>

</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
const fpUrl = window.fpUrl;

if (!token) {
  location.href = fpUrl('/');
}

let LB_DATA = { leaderboard_weekly: [], leaderboard_global: [] };

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}
function avatarHtml(user, size) {
  const initial = (user.display_name || user.username || '?').charAt(0).toUpperCase();
  return user.avatar
    ? `<img src="${escapeHtml(user.avatar)}" alt="" />`
    : `<span style="font-size:${size ? size * 0.4 : 14}px;">${initial}</span>`;
}

let LV_BANNER_SLIDES = [];
let lvBannerTimer = null;
const LV_BANNER_INTERVAL_MS = 10000;
// Position within the *extended* track (real slides padded with a clone of
// the last slide at index 0 and a clone of the first slide at the end) --
// real slide i sits at track position i+1. See the infinite-loop comment
// on .lv-banner-track above.
let lvTrackPos = 1;
let lvTransitioning = false;

// Same admin-cropped background-size/position technique as the Fanpages
// hub billboard (position_x/position_y/zoom, cover-fit then zoomed/panned
// relative to that) instead of a plain CSS `background-size: cover` --
// lets the Admin → Levels Banner crop editor's choice actually take effect
// here instead of every slide just auto-centering.
const lvBannerImgDims = {};
function lvLoadImageDims(url) {
  if (lvBannerImgDims[url]) return Promise.resolve(lvBannerImgDims[url]);
  return new Promise(resolve => {
    const probe = new Image();
    probe.onload = () => { const d = { w: probe.naturalWidth || 1, h: probe.naturalHeight || 1 }; lvBannerImgDims[url] = d; resolve(d); };
    probe.onerror = () => resolve({ w: 1, h: 1 });
    probe.src = url;
  });
}
function lvCoverBgSize(dims, boxW, boxH, zoomPercent) {
  const scale = Math.max(boxW / dims.w, boxH / dims.h) || 1;
  const renderedW = dims.w * scale, renderedH = dims.h * scale;
  const factor = (zoomPercent || 100) / 100;
  return { w: (renderedW / (boxW || 1)) * 100 * factor, h: (renderedH / (boxH || 1)) * 100 * factor };
}
// Re-applies every slide's (including both clones') crop sizing against the
// box's *current* dimensions -- needed on resize/syncBannerHeight since the
// box itself is fluid.
function lvApplyBannerCrop() {
  const main = document.getElementById('lv-banner-main');
  const boxW = main.clientWidth, boxH = main.clientHeight;
  if (!boxW || !boxH) return;
  document.querySelectorAll('.lv-banner-slide-bg').forEach(el => {
    const slideId = el.dataset.slideId;
    const slide = LV_BANNER_SLIDES.find(s => String(s.id) === slideId);
    const dims = slide && lvBannerImgDims[slide.image_url];
    if (!slide || !dims) return;
    const size = lvCoverBgSize(dims, boxW, boxH, slide.zoom);
    el.style.backgroundSize = `${size.w}% ${size.h}%`;
    el.style.backgroundPosition = `${slide.position_x}% ${slide.position_y}%`;
  });
}

function lvRealIndexFromTrackPos(pos) {
  const n = LV_BANNER_SLIDES.length;
  return ((pos - 1) % n + n) % n;
}
function lvUpdateDots() {
  const realIdx = lvRealIndexFromTrackPos(lvTrackPos);
  document.querySelectorAll('.lv-banner-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === realIdx);
  });
}

function lvSlideHtml(slide) {
  const inner = `<div class="lv-banner-slide-bg" data-slide-id="${slide.id}" style="background-image:url('${escapeHtml(slide.image_url)}')"></div>`;
  return (slide.link && isSafeLinkUrl(slide.link))
    ? `<a class="lv-banner-slide" href="${escapeHtml(slide.link)}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="lv-banner-slide">${inner}</div>`;
}
function isSafeLinkUrl(url) {
  try { return ['http:', 'https:'].includes(new URL(String(url), location.origin).protocol); }
  catch { return false; }
}

async function loadLevelsBanner() {
  const main = document.getElementById('lv-banner-main');
  try {
    const res = await fetch('/api/levels/banner-slides');
    const data = await res.json();
    LV_BANNER_SLIDES = data.slides || [];
  } catch (e) {
    LV_BANNER_SLIDES = [];
  }
  clearInterval(lvBannerTimer);
  if (!LV_BANNER_SLIDES.length) {
    main.innerHTML = '<div class="lv-banner-empty">No banner images yet — add some from Admin → Levels Banner.</div>';
    return;
  }

  const n = LV_BANNER_SLIDES.length;
  const trackSlides = n > 1
    ? [LV_BANNER_SLIDES[n - 1], ...LV_BANNER_SLIDES, LV_BANNER_SLIDES[0]]
    : LV_BANNER_SLIDES;
  lvTrackPos = n > 1 ? 1 : 0;

  main.innerHTML = `
    <div class="lv-banner-track" id="lv-banner-track">${trackSlides.map(lvSlideHtml).join('')}</div>
    ${n > 1 ? `
      <button class="lv-banner-arrow lv-banner-arrow--prev" id="lv-banner-prev" type="button" aria-label="Previous slide">‹</button>
      <button class="lv-banner-arrow lv-banner-arrow--next" id="lv-banner-next" type="button" aria-label="Next slide">›</button>
      <div class="lv-banner-dots" id="lv-banner-dots">${LV_BANNER_SLIDES.map((_, i) => `<div class="lv-banner-dot${i === 0 ? ' active' : ''}" data-idx="${i}"></div>`).join('')}</div>
    ` : ''}
  `;

  const track = document.getElementById('lv-banner-track');
  track.style.transition = 'none';
  track.style.transform = `translateX(-${lvTrackPos * 100}%)`;

  await Promise.all(LV_BANNER_SLIDES.map(s => lvLoadImageDims(s.image_url)));
  lvApplyBannerCrop();
  void track.offsetWidth;
  track.style.transition = '';

  if (n > 1) {
    document.getElementById('lv-banner-prev').addEventListener('click', () => lvManualNav(-1));
    document.getElementById('lv-banner-next').addEventListener('click', () => lvManualNav(1));
    document.querySelectorAll('.lv-banner-dot').forEach(dot => {
      dot.addEventListener('click', () => lvGoToRealIndex(parseInt(dot.dataset.idx, 10)));
    });
    track.addEventListener('transitionend', lvOnTrackTransitionEnd);
    lvStartAutoplay();
  }
}

function lvStartAutoplay() {
  clearInterval(lvBannerTimer);
  if (LV_BANNER_SLIDES.length > 1) lvBannerTimer = setInterval(() => lvStep(1), LV_BANNER_INTERVAL_MS);
}

function lvStep(dir) {
  if (lvTransitioning || LV_BANNER_SLIDES.length < 2) return;
  lvTransitioning = true;
  lvTrackPos += dir;
  const track = document.getElementById('lv-banner-track');
  track.style.transform = `translateX(-${lvTrackPos * 100}%)`;
  lvUpdateDots();
}
function lvManualNav(dir) {
  lvStep(dir);
  lvStartAutoplay();
}
function lvGoToRealIndex(targetIdx) {
  if (lvTransitioning || LV_BANNER_SLIDES.length < 2) return;
  const n = LV_BANNER_SLIDES.length;
  const curIdx = lvRealIndexFromTrackPos(lvTrackPos);
  if (targetIdx === curIdx) return;
  lvTransitioning = true;
  // Shortest direction around the loop, expressed as a signed step from the
  // current track position (not wrapped) so the slide animates through
  // however many real slides sit between here and the target.
  let delta = targetIdx - curIdx;
  if (delta > n / 2) delta -= n;
  if (delta < -n / 2) delta += n;
  lvTrackPos += delta;
  const track = document.getElementById('lv-banner-track');
  track.style.transform = `translateX(-${lvTrackPos * 100}%)`;
  lvUpdateDots();
  lvStartAutoplay();
}
// Lands on a clone (position 0 or n+1) -- jump instantly to the matching
// real slide's position once the slide animation finishes, so the loop
// reads as infinite instead of visibly snapping back.
function lvOnTrackTransitionEnd() {
  const n = LV_BANNER_SLIDES.length;
  const track = document.getElementById('lv-banner-track');
  if (lvTrackPos === 0) {
    lvTrackPos = n;
    track.style.transition = 'none';
    track.style.transform = `translateX(-${lvTrackPos * 100}%)`;
    void track.offsetWidth;
    track.style.transition = '';
  } else if (lvTrackPos === n + 1) {
    lvTrackPos = 1;
    track.style.transition = 'none';
    track.style.transform = `translateX(-${lvTrackPos * 100}%)`;
    void track.offsetWidth;
    track.style.transition = '';
  }
  lvTransitioning = false;
}

async function loadLevelHub() {
  try {
    const res = await fetch('/api/level-hub', { headers: authHeaders() });
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    renderHero(data.user);
    renderBadges(data.badges);
    renderActivity(data.recent_activity);
    LB_DATA.leaderboard_weekly = data.leaderboard_weekly;
    LB_DATA.leaderboard_global = data.leaderboard_global;
    renderLeaderboard('weekly');
    document.getElementById('lv-loading').hidden = true;
    document.getElementById('lv-content').hidden = false;
    syncBgHeight();
    syncBannerHeight();
  } catch (e) {
    document.getElementById('lv-loading').textContent = "Couldn't load your level data — try refreshing.";
  }
}

function renderHero(u) {
  const name = u.display_name || u.username;
  document.getElementById('lv-hero-name-text').textContent = name;
  document.getElementById('lv-hero-avatar-wrap').innerHTML = u.avatar
    ? `<img src="${escapeHtml(u.avatar)}" alt="" />`
    : `<span class="lv-hero-avatar-fallback">${escapeHtml(name.charAt(0).toUpperCase())}</span>`;
  document.getElementById('lv-hero-level-circle').textContent = u.level;

  if (u.title) {
    const titleEl = document.getElementById('lv-hero-title');
    titleEl.hidden = false;
    document.getElementById('lv-hero-title-text').textContent = u.title;
    document.getElementById('lv-hero-title-icon').src = u.title_icon || '';
  }

  const into = u.xp_into_level || 0;
  const need = u.xp_for_next_level || 1;
  const pct = Math.max(0, Math.min(100, (into / need) * 100));
  document.getElementById('lv-hero-xp-fill').style.width = `${pct}%`;
  document.getElementById('lv-hero-xp-into').textContent = `${into.toLocaleString()} / ${need.toLocaleString()} XP`;
  document.getElementById('lv-hero-xp-need').textContent = `Level ${u.level + 1}`;

  document.getElementById('lv-stat-level').textContent = u.level;
  document.getElementById('lv-stat-xp').textContent = u.xp.toLocaleString();
  document.getElementById('lv-stat-badges').textContent = `${u.badges_earned} / ${u.badges_total}`;
  document.getElementById('lv-stat-member').textContent = u.member_since
    ? new Date(u.member_since).toLocaleDateString(undefined, { month: 'short', year: 'numeric' })
    : '—';
}

function renderBadges(badges) {
  const grid = document.getElementById('lv-badge-grid');
  grid.innerHTML = badges.map(b => `
    <div class="lv-badge-card ${b.earned ? 'earned' : ''}" title="${b.earned ? 'Earned!' : `Reach Level ${b.level} to unlock`}">
      <div class="lv-badge-icon-wrap"><img src="${escapeHtml(b.icon)}" alt="" /></div>
      <div class="lv-badge-name">${escapeHtml(b.name)}</div>
      <div class="lv-badge-req">Level ${b.level}</div>
    </div>
  `).join('');
}

function renderActivity(activity) {
  const box = document.getElementById('lv-activity-box');
  if (!activity.length) { box.innerHTML = '<div class="lv-empty">No activity yet — go post something!</div>'; return; }
  box.innerHTML = activity.map(a => `
    <div class="lv-activity-row">
      <div>
        <div class="lv-activity-label">${escapeHtml(a.label)}</div>
        <div class="lv-activity-time">${timeAgo(a.created_at)}</div>
      </div>
      <div class="lv-activity-xp">+${a.xp_amount} XP</div>
    </div>
  `).join('');
}

function renderLeaderboard(which) {
  document.getElementById('lv-lb-tab-weekly').classList.toggle('active', which === 'weekly');
  document.getElementById('lv-lb-tab-global').classList.toggle('active', which === 'global');
  const rows = which === 'weekly' ? LB_DATA.leaderboard_weekly : LB_DATA.leaderboard_global;
  const list = document.getElementById('lv-lb-list');
  if (!rows.length) { list.innerHTML = `<div class="lv-empty">${which === 'weekly' ? 'Nobody has earned XP this week yet.' : 'No XP earned yet.'}</div>`; return; }
  list.innerHTML = rows.map((r, i) => `
    <div class="lv-lb-row">
      <div class="lv-lb-rank">${i + 1}</div>
      <div class="lv-lb-avatar">${avatarHtml(r)}</div>
      <div class="lv-lb-name"><a href="${fpUrl('/' + r.username)}">${escapeHtml(r.display_name || r.username)}</a><span class="lv-lb-lvl">Lv ${r.level}</span></div>
      <div class="lv-lb-xp">${r.xp.toLocaleString()} XP</div>
    </div>
  `).join('');
  syncBannerHeight();
}

document.getElementById('lv-lb-tab-weekly').addEventListener('click', () => renderLeaderboard('weekly'));
document.getElementById('lv-lb-tab-global').addEventListener('click', () => renderLeaderboard('global'));

// Pins the banner's top to 1/4 of the way down the Leaderboard box and its
// bottom to 1/4 up from the bottom of the Recent Activity box underneath it
// (i.e. 3/4 of the way down it), so it reads as a thicker strip "threaded"
// between the two rather than matching their full combined height. Measures via getBoundingClientRect
// deltas (relative to the row's own top) rather than offsetTop -- offsetTop
// is relative to the nearest *positioned* ancestor (here, .lv-content-z,
// much further up the page), not to the row itself, so using it directly
// as a margin-top way overshoots. No-op (clears any inline override) below
// the 860px breakpoint where the row collapses to a single column.
function syncBannerHeight() {
  const row = document.querySelector('.lv-banner-row');
  const main = document.getElementById('lv-banner-main');
  const boxes = document.querySelectorAll('.lv-banner-side .lv-box');
  if (!main || !row) return;
  if (boxes.length < 2 || window.innerWidth <= 860) {
    main.style.marginTop = '';
    main.style.height = '';
    if (typeof lvApplyBannerCrop === 'function') lvApplyBannerCrop();
    return;
  }
  const rowTop = row.getBoundingClientRect().top;
  const r1 = boxes[0].getBoundingClientRect();
  const r2 = boxes[1].getBoundingClientRect();
  const top = (r1.top - rowTop) + r1.height / 4;
  const bottom = (r2.top - rowTop) + r2.height * (3 / 4);
  main.style.marginTop = `${top}px`;
  main.style.height = `${Math.max(80, bottom - top)}px`;
  if (typeof lvApplyBannerCrop === 'function') lvApplyBannerCrop();
}

function syncBgHeight() {
  const bgEl = document.getElementById('lv-bg-img');
  bgEl.style.height = '0';
  const h = Math.max(document.documentElement.scrollHeight, window.innerHeight) + 'px';
  bgEl.style.height = h;
}
let bgResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(bgResizeTimer);
  bgResizeTimer = setTimeout(() => { syncBgHeight(); syncBannerHeight(); }, 200);
});
window.addEventListener('load', () => { syncBgHeight(); syncBannerHeight(); });

if (token) {
  loadLevelHub();
  loadLevelsBanner();
}
</script>
</body>
