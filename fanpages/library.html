<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bookmarks ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    .lib-bg-wrap { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #0d0d0d; }
    .lib-bg-img { width: 100%; height: 100%; object-fit: cover; filter: blur(20px); transform: scale(1.1); opacity: 0.4; }
    .lib-bg-overlay { position: absolute; inset: 0; background: rgba(10,10,10,0.78); }

    .lib-main { max-width: 1100px; margin: 0 auto; padding: 3rem 2rem 5rem; }
    .lib-header-row { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2rem; }
    .lib-title { font-family: 'Cinzel', Georgia, serif; font-size: 2.2rem; }
    .lib-private { display: flex; align-items: center; gap: 0.4rem; color: #999; font-size: 0.85rem; }

    /* Sidebar (left) + active section (right) — same "Browse"/"Explore the
       Cast" boxed-nav pattern used on the character/gallery pages, reusing
       those exact classes for visual consistency instead of tabs. */
    .lib-layout { display: grid; grid-template-columns: 200px 1fr; gap: 2.5rem; align-items: start; }
    .lib-sidebar { position: sticky; top: 90px; }

    .lib-section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.25rem; }
    .lib-empty { color: #999; font-size: 0.92rem; padding: 2rem 0; }

    .lib-story-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.5rem 1.1rem; }
    .lib-card { text-decoration: none; color: inherit; }
    .lib-card-cover {
      width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; display: block;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,0.08); transition: transform 0.15s;
    }
    .lib-card:hover .lib-card-cover { transform: translateY(-4px); }
    .lib-card-cover--generated {
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a);
    }
    .lib-card-cover-bg {
      position: absolute; inset: -25%; background-size: cover; background-position: center;
      filter: blur(12px) saturate(1.3) brightness(0.6); transform: scale(1.15);
    }
    .lib-card-cover-title {
      position: relative; z-index: 1; color: #fff; text-align: center; padding: 0 0.6rem;
      font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 0.92rem; line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }
    .lib-card-title { font-size: 0.9rem; font-weight: 700; margin-top: 0.5rem; line-height: 1.3; }
    .lib-card-author { font-size: 0.78rem; color: #999; margin-top: 0.15rem; }
    /* Same gold-glow treatment as chapter-detail-title — a clickable
       author/owner name reads as a "real" link instead of flat gray text. */
    .lib-author-link {
      color: #f0c060; text-shadow: 0 0 12px rgba(240,192,96,0.55);
      text-decoration: none; font-weight: 700; position: relative; z-index: 1;
    }
    .lib-author-link:hover { text-decoration: underline; }

    .lib-gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1.1rem; }
    .lib-gallery-card { text-decoration: none; color: inherit; display: block; position: relative; }
    .lib-gallery-img-wrap {
      width: 100%; aspect-ratio: 6 / 7; border-radius: 10px; overflow: hidden;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,0.08); transition: transform 0.15s;
    }
    .lib-gallery-card:hover .lib-gallery-img-wrap { transform: translateY(-4px); }
    .lib-gallery-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .lib-gallery-story { font-size: 0.76rem; color: #999; margin-top: 0.4rem; }

    @media (max-width: 760px) {
      .lib-main { padding: 2rem 1.1rem 3.5rem; }
      .lib-header-row { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      .lib-title { font-size: 1.7rem; }
      .lib-layout { grid-template-columns: 1fr; gap: 1.25rem; }
      .lib-sidebar { position: static; }
      .lib-story-grid, .lib-gallery-grid { grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 0.85rem; }
    }
  </style>
</head>
<body>

<div class="lib-bg-wrap">
  <img class="lib-bg-img" src="/images/gallery/close_6.png" alt="" />
  <div class="lib-bg-overlay"></div>
</div>

<div id="fanpages-topbar-root"></div>

<main class="lib-main">
  <div class="lib-header-row">
    <h1 class="lib-title">Bookmarks</h1>
    <span class="lib-private">🔒 Private</span>
  </div>

  <div class="lib-layout">
    <aside class="chars-create-box lib-sidebar">
      <p class="mod-gallery-sidebar-label">Browse</p>
      <button class="mod-gallery-cat active" id="lib-tab-stories" type="button">Stories</button>
      <button class="mod-gallery-cat" id="lib-tab-gallery" type="button">Galleries</button>
      <button class="mod-gallery-cat" id="lib-tab-characters" type="button">Characters</button>
    </aside>

    <div>
      <section id="lib-stories-section">
        <p class="lib-section-title">Bookmarked Stories</p>
        <div id="lib-stories-grid"><p class="lib-empty">Loading…</p></div>
      </section>

      <section id="lib-gallery-section" style="display:none;">
        <p class="lib-section-title">Bookmarked Art</p>
        <div id="lib-gallery-grid"><p class="lib-empty">Loading…</p></div>
      </section>

      <section id="lib-characters-section" style="display:none;">
        <p class="lib-section-title">Bookmarked Characters</p>
        <div id="lib-characters-grid"><p class="lib-empty">Loading…</p></div>
      </section>
    </div>
  </div>
</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
  const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // No custom cover? Fake one out of a blurred, zoomed-in crop of the
  // author's own avatar with the story title lettered over it, instead of
  // showing the same static stock image on every uncovered story.
  function buildCoverEl(site) {
    if (site.cover_url) {
      const img = document.createElement('img');
      img.className = 'lib-card-cover';
      img.src = site.cover_url;
      img.alt = `${escapeHtml(site.site_title)} cover`;
      img.loading = 'lazy';
      return img;
    }
    const wrap = document.createElement('div');
    wrap.className = 'lib-card-cover lib-card-cover--generated';
    const bg = document.createElement('div');
    bg.className = 'lib-card-cover-bg';
    if (site.author_avatar) bg.style.backgroundImage = `url(${site.author_avatar})`;
    wrap.appendChild(bg);
    const title = document.createElement('span');
    title.className = 'lib-card-cover-title';
    title.textContent = site.site_title || 'Untitled Story';
    wrap.appendChild(title);
    return wrap;
  }

  function storyCard(site) {
    // A plain <div> wrapper, not <a> — the author name below needs its own
    // separate link to their profile, and anchors can't nest.
    const wrap = document.createElement('div');
    wrap.className = 'lib-card';
    const link = document.createElement('a');
    link.href = window.fpUrl(`/${site.story_path || site.slug}`);
    link.style.display = 'block';
    link.style.textDecoration = 'none';
    link.style.color = 'inherit';
    link.appendChild(buildCoverEl(site));
    const titleP = document.createElement('p');
    titleP.className = 'lib-card-title';
    titleP.textContent = site.site_title;
    link.appendChild(titleP);
    wrap.appendChild(link);

    const authorP = document.createElement('p');
    authorP.className = 'lib-card-author';
    authorP.innerHTML = `by <a class="lib-author-link" href="${window.fpUrl(`/${encodeURIComponent(site.author_username)}`)}">${escapeHtml(site.author)}</a>`;
    wrap.appendChild(authorP);
    return wrap;
  }

  function galleryCard(item) {
    // Image click → the post's own standalone page. Author-name click →
    // their plain general profile, not the gallery tab specifically.
    const galleryUrl = window.fpUrl(`/gallery-post?id=${item.id}`);
    const profileUrl = window.fpUrl(`/${encodeURIComponent(item.owner_username)}`);
    const wrap = document.createElement('div');
    wrap.className = 'lib-gallery-card';
    const link = document.createElement('a');
    link.href = galleryUrl;
    link.style.display = 'block';
    link.innerHTML = `<div class="lib-gallery-img-wrap"><img src="${item.image_url}" alt="${escapeHtml(item.title || 'Art')}" loading="lazy" /></div>`;
    wrap.appendChild(link);

    const storyP = document.createElement('p');
    storyP.className = 'lib-gallery-story';
    storyP.innerHTML = `from <a class="lib-author-link" href="${profileUrl}">${escapeHtml(item.owner_display_name || item.owner_username)}</a>`;
    wrap.appendChild(storyP);
    return wrap;
  }

  function characterCard(c) {
    const href = window.fpUrl(`/${encodeURIComponent(c.owner_username)}?char=${c.id}#characters`);
    const posX = c.position_x != null ? c.position_x : 50;
    const posY = c.position_y != null ? c.position_y : 50;
    const wrap = document.createElement('div');
    wrap.className = 'lib-gallery-card';
    const link = document.createElement('a');
    link.href = href;
    link.style.display = 'block';
    const imgHtml = c.image
      ? `<img src="${escapeHtml(c.image)}" alt="${escapeHtml(c.name)}" style="object-position:${posX}% ${posY}%;" loading="lazy" />`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#6b3fa0,#c2547a);color:#fff;font-weight:700;font-size:1.6rem;">${escapeHtml((c.name[0] || '?').toUpperCase())}</div>`;
    link.innerHTML = `<div class="lib-gallery-img-wrap">${imgHtml}</div>`;
    wrap.appendChild(link);
    const titleP = document.createElement('p');
    titleP.className = 'lib-card-title';
    titleP.textContent = c.name;
    wrap.appendChild(titleP);
    const ownerP = document.createElement('p');
    ownerP.className = 'lib-gallery-story';
    ownerP.innerHTML = `by <a class="lib-author-link" href="${window.fpUrl(`/${encodeURIComponent(c.owner_username)}`)}">${escapeHtml(c.owner)}</a>`;
    wrap.appendChild(ownerP);
    return wrap;
  }

  const tabs = {
    stories: { btn: document.getElementById('lib-tab-stories'), section: document.getElementById('lib-stories-section') },
    gallery: { btn: document.getElementById('lib-tab-gallery'), section: document.getElementById('lib-gallery-section') },
    characters: { btn: document.getElementById('lib-tab-characters'), section: document.getElementById('lib-characters-section') },
  };
  function switchLibTab(name) {
    Object.entries(tabs).forEach(([key, t]) => {
      t.btn.classList.toggle('active', key === name);
      t.section.style.display = key === name ? 'block' : 'none';
    });
  }
  tabs.stories.btn.addEventListener('click', () => switchLibTab('stories'));
  tabs.gallery.btn.addEventListener('click', () => switchLibTab('gallery'));
  tabs.characters.btn.addEventListener('click', () => switchLibTab('characters'));

  function renderGalleryGrid(elId, items, emptyMsg) {
    const el = document.getElementById(elId);
    if (!items.length) { el.innerHTML = `<p class="lib-empty">${emptyMsg}</p>`; return; }
    const grid = document.createElement('div');
    grid.className = 'lib-gallery-grid';
    items.forEach(g => grid.appendChild(galleryCard(g)));
    el.innerHTML = '';
    el.appendChild(grid);
  }

  (async () => {
    if (!token) {
      const loginMsg = `<p class="lib-empty"><a href="${window.fpUrl(`/login?from=${encodeURIComponent(window.fpUrl('/library'))}`)}" style="color:#7fa8d9;">Log in</a> to see this.</p>`;
      document.getElementById('lib-stories-grid').innerHTML = loginMsg;
      document.getElementById('lib-gallery-grid').innerHTML = loginMsg;
      document.getElementById('lib-characters-grid').innerHTML = loginMsg;
      return;
    }
    try {
      const res = await fetch('/api/library', { headers: authHeaders() });
      const data = await res.json();

      const storiesGrid = document.getElementById('lib-stories-grid');
      const stories = data.stories || [];
      if (!stories.length) {
        storiesGrid.innerHTML = '<p class="lib-empty">You haven\'t bookmarked any stories yet.</p>';
      } else {
        const grid = document.createElement('div');
        grid.className = 'lib-story-grid';
        stories.forEach(s => grid.appendChild(storyCard(s)));
        storiesGrid.innerHTML = '';
        storiesGrid.appendChild(grid);
      }

      renderGalleryGrid('lib-gallery-grid', data.bookmarked_gallery || [], 'You haven\'t bookmarked any art yet — hit the bookmark icon on a gallery piece to save it here.');

      const charactersGrid = document.getElementById('lib-characters-grid');
      const characters = data.characters || [];
      if (!characters.length) {
        charactersGrid.innerHTML = '<p class="lib-empty">You haven\'t bookmarked any characters yet — hit the bookmark icon on a character to save it here.</p>';
      } else {
        const grid = document.createElement('div');
        grid.className = 'lib-gallery-grid';
        characters.forEach(c => grid.appendChild(characterCard(c)));
        charactersGrid.innerHTML = '';
        charactersGrid.appendChild(grid);
      }
    } catch {
      document.getElementById('lib-stories-grid').innerHTML = '<p class="lib-empty">Couldn\'t load your bookmarks right now.</p>';
      document.getElementById('lib-gallery-grid').innerHTML = '<p class="lib-empty">Couldn\'t load your bookmarks right now.</p>';
      document.getElementById('lib-characters-grid').innerHTML = '<p class="lib-empty">Couldn\'t load your bookmarks right now.</p>';
    }
  })();
</script>

</body>
</html>
