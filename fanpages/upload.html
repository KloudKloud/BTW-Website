<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    * { box-sizing: border-box; }
    body { background: #0d0d0d; color: #f0f0f0; font-family: 'Lato', Arial, sans-serif; min-height: 100vh; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }
    [hidden] { display: none !important; }

    .up-page { max-width: 1100px; margin: 0 auto; padding: 7rem 2rem 5rem; }
    .up-title {
      font-family: 'Fredoka', 'Lato', cursive; font-size: 2.2rem; font-weight: 700; color: #7fa8d9;
      text-shadow: 0 0 18px rgba(127,168,217,0.55), 0 1px 3px rgba(0,0,0,0.5);
      text-align: center; margin: 0 0 0.5rem;
    }
    .up-subtitle { text-align: center; color: #aaa; font-size: 1.05rem; margin: 0 0 2.75rem; }

    .up-row { display: flex; gap: 1.75rem; justify-content: center; flex-wrap: wrap; }
    .up-box {
      flex: 1 1 260px; max-width: 320px; min-height: 230px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.9rem;
      background: #161616; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
      padding: 2rem 1.5rem; cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
    }
    .up-box:hover {
      border-color: rgba(127,168,217,0.6); box-shadow: 0 0 22px rgba(127,168,217,0.3);
      transform: translateY(-3px);
    }
    .up-box-icon {
      width: 54px; height: 54px; color: #7fa8d9;
      display: flex; align-items: center; justify-content: center;
    }
    .up-box-icon svg { width: 100%; height: 100%; }
    .up-box-label { font-family: 'Fredoka', 'Lato', cursive; font-size: 1.25rem; font-weight: 700; color: #f0f0f0; }
    .up-box-desc { font-size: 0.9rem; color: #999; text-align: center; margin: 0; }

    @media (max-width: 720px) {
      .up-page { padding: 6rem 1.25rem 4rem; }
      .up-title { font-size: 1.7rem; }
      .up-row { gap: 1.1rem; }
      .up-box { flex: 1 1 100%; max-width: none; min-height: 180px; padding: 1.75rem 1.25rem; }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>

<main class="up-page">
  <h1 class="up-title">What are you creating?</h1>
  <p class="up-subtitle">Pick a type to get started.</p>

  <div class="up-row">
    <a class="up-box" id="up-box-story" href="#" data-gate="#">
      <span class="up-box-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      </span>
      <span class="up-box-label">Story</span>
      <p class="up-box-desc">Start a new fanfiction.</p>
    </a>

    <a class="up-box" id="up-box-art" href="#" data-gate="#">
      <span class="up-box-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </span>
      <span class="up-box-label">Art</span>
      <p class="up-box-desc">Post a gallery piece.</p>
    </a>

    <a class="up-box" id="up-box-character" href="#" data-gate="#">
      <span class="up-box-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      </span>
      <span class="up-box-label">Character</span>
      <p class="up-box-desc">Add a new character.</p>
    </a>
  </div>
</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
  if (!token) window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname)}`);

  const storyUrl = window.fpUrl('/create');
  const artUrl = window.fpUrl('/create-gallery');
  const characterUrl = window.fpUrl('/create-character');

  const storyBox = document.getElementById('up-box-story');
  const artBox = document.getElementById('up-box-art');
  const characterBox = document.getElementById('up-box-character');

  storyBox.href = storyUrl; storyBox.dataset.gate = storyUrl;
  artBox.href = artUrl; artBox.dataset.gate = artUrl;
  characterBox.href = characterUrl; characterBox.dataset.gate = characterUrl;
</script>
</body>
</html>
