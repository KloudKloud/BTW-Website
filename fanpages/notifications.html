<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* Several elements on this page (modals, .dm-panel) set their own
       display:flex unconditionally and rely on the [hidden] attribute to
       hide — but that only works automatically on pages that also load
       /style.css (which carries a global [hidden]{display:none!important}
       reset). This page doesn't, so without this override, anything toggled
       via .hidden = true stays visible. */
    [hidden] { display: none !important; }
    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* Background swapped from a full-bleed video to the same static
       box-background-3 + dark scrim the Story Editor uses (.mod-page-bg-*,
       shared in fanpages.css) -- a calmer, private-workspace-style page
       shouldn't compete with a looping video behind it. That shared
       convention already paints at negative z-index behind body's own
       background correctly, so the old .notif-main z-index:1 hack (needed
       only because the video sat at z-index:0, not negative) is no longer
       necessary, but is harmless to leave in place. */
    .notif-main { max-width: 1400px; margin: 0 auto; padding: 3rem 2rem 5rem; position: relative; z-index: 1; }

    .notif-content { min-width: 0; }

    /* Mobile-only Inbox chrome (see the ≤720px block below for real
       styling) -- explicit hidden default so desktop doesn't fall back to
       the browser's plain <button>/<div> rendering (a stray unstyled box)
       above that breakpoint. */
    .dm-mobile-fab, .dm-mobile-menu-backdrop { display: none; }

    .notif-tabs {
      display: flex; align-items: flex-end; justify-content: center; gap: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 1.75rem;
    }
    .notif-tabs-group { display: flex; gap: 2rem; }

    .notif-tab {
      background: none; border: none; cursor: pointer; color: #999;
      font-family: 'Lato', Arial, sans-serif; font-size: 1.28rem; font-weight: 700;
      padding: 0.5rem 0.1rem 1rem; position: relative;
    }
    .notif-tab:hover { color: #ccc; }
    .notif-tab.active { color: #f0f0f0; }
    .notif-tab.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
      height: 3px; background: #f0c060; border-radius: 2px;
    }
    .notif-tab-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 18px; height: 18px; padding: 0 5px; margin-left: 0.35rem;
      border-radius: 9px; background: #d97a72; color: #fff; font-size: 0.68rem; font-weight: 700;
      vertical-align: middle;
    }

    .notif-item {
      display: flex; gap: 1.1rem; align-items: flex-start;
      padding: 1.4rem 1.6rem;
      border-radius: 14px;
      margin-bottom: 0.85rem;
      background: rgba(10,8,14,0.82);
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.15s;
    }
    /* Same dark card as read notifications -- unread is told apart by a
       blue glow instead of a flat blue fill. Clears itself next visit:
       the page fires /api/notifications/mark-read right after loading, so
       by the time you leave and come back the item's is_read flag is
       already true and this class no longer applies. */
    .notif-item--unread { background: rgba(10,8,14,0.82); border-color: rgba(127,168,217,0.6); box-shadow: 0 0 14px rgba(127,168,217,0.35); }
    .notif-item[data-link] { cursor: pointer; }
    .notif-item[data-link]:hover { background: rgba(10,8,14,0.94); }

    .notif-avatar, .notif-avatar--fallback {
      width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .notif-avatar--fallback {
      background: linear-gradient(135deg, #7fa8d9, #d97a72);
      color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem;
    }
    /* Wraps the avatar when the notification has a real actor -- clicking it
       goes to their profile instead of triggering the card's own action
       link, so it needs to be its own flex child (not just an inline img)
       to keep the same size/position the bare avatar had. */
    .notif-avatar-link { display: block; flex-shrink: 0; border-radius: 50%; }
    .notif-avatar-link:hover .notif-avatar,
    .notif-avatar-link:hover .notif-avatar--fallback { box-shadow: 0 0 0 2px rgba(240,192,96,0.6); }

    .notif-item-body { min-width: 0; }
    .notif-item-text { font-size: 1.02rem; line-height: 1.55; }
    .notif-item-text strong { font-weight: 700; }
    .notif-item-time { font-size: 0.8rem; color: #999; margin-top: 0.3rem; }

    .notif-empty { color: #999; font-size: 0.92rem; padding: 2rem 0; }

    /* ── DM app (the "Inbox" tab) ── two separate boxes side by side: the
       user/nav box on the left, the actual chats/messages box on the right —
       not one box with an internal divider line. */
    .dm-app {
      display: flex; width: 100%; height: calc(100vh - 15rem); min-height: 520px; gap: 1.25rem;
    }
    .dm-sidebar {
      width: 260px; flex-shrink: 0;
      background: rgba(10,8,14,0.82);
      font-family: 'Fredoka', 'Lato', cursive;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
      padding: 1rem; display: flex; flex-direction: column; gap: 0.35rem;
      overflow: hidden;
    }
    .dm-user-block {
      display: flex; align-items: center; gap: 0.6rem;
      padding-bottom: 0.85rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .dm-user-block img, .dm-user-block-fallback {
      width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .dm-user-block-fallback {
      background: linear-gradient(135deg, #7fa8d9, #d97a72); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;
    }
    .dm-user-block-name { font-size: 0.88rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .dm-new-chat-btn {
      background: linear-gradient(160deg, rgba(10,8,14,0.85), rgba(10,8,14,0.78)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
      color: #f0c060; border: 1px solid rgba(240,192,96,0.5); border-radius: 20px;
      padding: 0.6rem 0.9rem; font-weight: 700; font-size: 0.85rem; cursor: pointer;
      font-family: inherit;
    }
    .dm-new-chat-btn:hover { border-color: rgba(240,192,96,0.8); box-shadow: 0 0 14px rgba(240,192,96,0.3); }

    .dm-sidebar-rule { height: 1px; background: rgba(255,255,255,0.12); margin: 0.5rem 0; }

    .dm-side-tab {
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(160deg, rgba(10,8,14,0.8), rgba(10,8,14,0.72)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.12); color: #ccc; text-align: left;
      padding: 0.65rem 0.7rem; border-radius: 8px; cursor: pointer;
      font-size: 0.88rem; font-weight: 600; font-family: inherit;
    }
    .dm-side-tab:hover { border-color: rgba(255,255,255,0.3); }
    .dm-side-tab.active { border-color: rgba(240,192,96,0.6); color: #f0c060; box-shadow: 0 0 14px rgba(240,192,96,0.25); }
    .dm-req-badge {
      background: #d97a72; color: #fff; font-size: 0.68rem; font-weight: 700;
      border-radius: 9px; padding: 0.1rem 0.45rem;
    }

    /* Quick-switch chat list — a compact mirror of the Chats panel, sitting
       right in the sidebar under the tabs so a conversation can be jumped to
       without first clicking into the Chats panel and scanning it. */
    .dm-sidebar-quicklist {
      flex: 1; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.15rem;
      margin: 0 -0.35rem; padding: 0 0.35rem;
    }
    .dm-sidebar-quicklist-empty { font-size: 0.78rem; color: #888; padding: 0.6rem 0.4rem; text-align: center; font-family: 'Lato', Arial, sans-serif; }
    .dm-quick-item {
      display: flex; align-items: center; gap: 0.55rem;
      padding: 0.5rem 0.4rem; border-radius: 10px; cursor: pointer;
      position: relative; transition: background 0.15s;
    }
    .dm-quick-item:hover { background: rgba(255,255,255,0.06); }
    .dm-quick-item--active { background: rgba(240,192,96,0.13); }
    .dm-quick-item--active:hover { background: rgba(240,192,96,0.17); }
    .dm-quick-item-avatar, .dm-quick-item-avatar-fallback {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .dm-quick-item-avatar-fallback {
      background: linear-gradient(135deg, #7fa8d9, #d97a72); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.72rem;
    }
    .dm-quick-item-body { min-width: 0; flex: 1; font-family: 'Lato', Arial, sans-serif; }
    .dm-quick-item-name {
      font-size: 0.8rem; font-weight: 700; color: #e8e8e8;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dm-quick-item--unread .dm-quick-item-name { color: #fff; }
    .dm-quick-item-preview {
      font-size: 0.72rem; color: #888;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dm-quick-item--unread .dm-quick-item-preview { color: #c8d8ea; }
    .dm-quick-item-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #f0c060;
      box-shadow: 0 0 6px rgba(240,192,96,0.7); flex-shrink: 0;
    }

    .dm-content {
      flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
      background: rgba(10,8,14,0.82);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 14px;
    }
    .dm-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .dm-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .dm-empty-center {
      flex: 1; display: flex; align-items: center; justify-content: center;
      text-align: center; color: #ddd; font-size: 1.2rem; font-weight: 600;
      line-height: 1.6; font-family: 'Lato', Arial, sans-serif; padding: 2rem;
    }

    .dm-subtabs {
      display: flex; gap: 1.25rem; padding: 0.85rem 1.1rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
    }
    .dm-subtab {
      background: none; border: none; color: #999; cursor: pointer; font-family: inherit;
      font-size: 0.85rem; font-weight: 700; padding: 0 0 0.7rem; position: relative;
    }
    .dm-subtab:hover { color: #ccc; }
    .dm-subtab.active { color: #f0c060; }
    .dm-subtab.active::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
      background: #f0c060; border-radius: 2px;
    }

    .dm-priority-header {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: #e0b050; padding: 0.85rem 1.1rem 0.5rem;
      text-shadow: 0 0 10px rgba(240,192,96,0.55);
    }
    .dm-flower-divider {
      padding: 0.5rem 1.1rem; overflow: hidden; text-align: center;
    }
    .dm-flower-divider-fancy {
      font-size: 0.72rem; letter-spacing: 0.1rem; color: #e0b050; opacity: 0.55;
      white-space: nowrap; overflow: hidden; text-overflow: clip;
    }
    .dm-flower-divider-blooms {
      font-size: 0.9rem; letter-spacing: 0.15rem; opacity: 0.6;
      white-space: nowrap; overflow: hidden; margin: 0.2rem 0;
    }
    .dm-chats-header {
      font-family: 'Fredoka', 'Lato', cursive;
      font-size: 0.9rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: #f0f0f0; padding: 0.85rem 1.1rem 0.5rem;
    }
    .dm-list-item--priority { background: rgba(240,192,96,0.06); }
    .dm-list-item--priority:hover { background: rgba(240,192,96,0.1); }
    .dm-list-item--priority.dm-list-item--unread {
      background: rgba(240,192,96,0.13);
      box-shadow: inset 3px 0 0 0 #f0c060, 0 0 16px rgba(240,192,96,0.3);
    }
    .dm-list-item--priority.dm-list-item--unread:hover { background: rgba(240,192,96,0.17); }
    .dm-list-item--priority .dm-list-unread-dot { background: #f0c060; box-shadow: 0 0 7px rgba(240,192,96,0.9); }

    .dm-list-item {
      position: relative; display: flex; align-items: center; gap: 0.9rem;
      padding: 0.85rem 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer;
    }
    .dm-list-item:hover { background: rgba(255,255,255,0.04); }
    /* Unread glow — a soft accent border + shadow rather than just bolder
       text, so a new message actually pops instead of blending into the
       list once you're scanning quickly. */
    .dm-list-item--unread {
      background: rgba(127,168,217,0.08);
      box-shadow: inset 3px 0 0 0 #7fa8d9, 0 0 16px rgba(127,168,217,0.25);
    }
    .dm-list-item--unread:hover { background: rgba(127,168,217,0.12); }
    .dm-list-unread-dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: #7fa8d9; box-shadow: 0 0 7px rgba(127,168,217,0.9); margin-left: 0.4rem;
    }
    .dm-list-item-content {
      display: flex; gap: 0.9rem; align-items: center; flex: 1; min-width: 0;
    }
    /* Hover-reveal delete — only a small backdrop-blurred zone in the right
       corner, not the whole card. Priority rows never render this element
       at all, so there's nothing there to blur or reveal. */
    .dm-list-delete-zone {
      position: absolute; top: 0; right: 0; bottom: 0; width: 84px;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      -webkit-mask-image: linear-gradient(to right, transparent, black 35%);
      mask-image: linear-gradient(to right, transparent, black 35%);
    }
    .dm-list-item:hover .dm-list-delete-zone { opacity: 1; pointer-events: auto; }
    .dm-list-delete-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(217,90,90,0.2); border: 1px solid rgba(217,90,90,0.45); color: #e07a7a;
      display: flex; align-items: center; justify-content: center; font-size: 0.95rem;
      cursor: pointer; font-family: inherit;
    }
    .dm-list-delete-btn:hover { background: rgba(217,90,90,0.35); }
    .dm-list-avatar, .dm-list-avatar-fallback {
      width: 46px; height: 46px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .dm-list-avatar-fallback {
      background: linear-gradient(135deg, #7fa8d9, #d97a72); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .dm-list-body { min-width: 0; flex: 1; }
    .dm-list-row { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
    .dm-list-name { font-weight: 700; font-size: 0.94rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dm-list-time { font-size: 0.72rem; color: #888; flex-shrink: 0; }
    .dm-list-preview {
      font-size: 0.85rem; color: #999; margin-top: 0.2rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dm-list-preview--unread { color: #f0f0f0; font-weight: 600; }
    .dm-list-pending-tag { font-size: 0.72rem; color: #f0c060; margin-top: 0.2rem; }

    .dm-request-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
    .dm-accept-btn, .dm-deny-btn {
      border: none; border-radius: 8px; padding: 0.4rem 0.9rem; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
    }
    .dm-accept-btn { background: #2fbf5f; color: #fff; }
    .dm-accept-btn:hover { background: #29a852; }
    .dm-deny-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: #ccc; }
    .dm-deny-btn:hover { border-color: #d97a72; color: #d97a72; }

    .dm-panel--thread { }
    .dm-thread-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .dm-thread-back { background: none; border: none; color: #2fbf5f; font-weight: 700; cursor: pointer; font-size: 0.85rem; font-family: inherit; }
    .dm-thread-back:hover { color: #29a852; }
    .dm-thread-avatar, .dm-thread-avatar-fallback {
      width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .dm-thread-avatar-fallback {
      background: linear-gradient(135deg, #7fa8d9, #d97a72); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.75rem;
    }
    .dm-thread-title { font-weight: 700; font-size: 0.95rem; }
    .dm-thread-user-link {
      display: flex; align-items: center; gap: 0.6rem; text-decoration: none; color: inherit;
      min-width: 0; flex: 1;
    }
    .dm-thread-user-link:hover .dm-thread-title { color: #f0c060; text-decoration: underline; }
    .dm-thread-dismiss-btn {
      margin-left: auto; width: 30px; height: 30px; border-radius: 50%;
      background: rgba(217,90,90,0.15); border: 1px solid rgba(217,90,90,0.45); color: #e07a7a;
      display: flex; align-items: center; justify-content: center; font-size: 0.85rem;
      cursor: pointer; font-family: inherit;
    }
    .dm-thread-dismiss-btn:hover { background: rgba(217,90,90,0.3); }
    .dm-thread-menu-wrap { position: relative; margin-left: auto; flex-shrink: 0; }
    .dm-thread-menu-btn {
      width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18); color: #ccc;
      font-size: 0.75rem; letter-spacing: 0.04em; cursor: pointer; font-family: inherit; padding: 0;
    }
    .dm-thread-menu-btn:hover { border-color: #7fa8d9; color: #7fa8d9; }
    .dm-thread-menu-dropdown {
      position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; min-width: 160px;
      background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5); overflow: hidden; padding: 0.35rem;
    }
    .dm-thread-menu-dropdown button {
      display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
      color: #e0e0e0; font-family: inherit; font-size: 0.88rem; padding: 0.6rem 0.75rem; border-radius: 8px;
    }
    .dm-thread-menu-dropdown button:hover { background: rgba(255,255,255,0.08); }
    .dm-thread-menu-dropdown button.dm-menu-danger { color: #e8849e; }
    .dm-thread-menu-dropdown button.dm-menu-danger:hover { background: rgba(194,84,122,0.12); }
    .dm-thread-messages {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 1rem 1.1rem;
      display: flex; flex-direction: column; gap: 0.55rem; min-height: 300px;
    }
    /* Slim, mostly-invisible scrollbars across the DM app — just a soft
       blue line that shows while actually scrolling/hovering. */
    .dm-thread-messages, .dm-list, .dm-sidebar, .dm-following-list, .dm-gif-results {
      scrollbar-width: thin;
      scrollbar-color: rgba(127,168,217,0.4) transparent;
    }
    .dm-thread-messages::-webkit-scrollbar,
    .dm-list::-webkit-scrollbar,
    .dm-sidebar::-webkit-scrollbar,
    .dm-following-list::-webkit-scrollbar,
    .dm-gif-results::-webkit-scrollbar { width: 5px; }
    .dm-thread-messages::-webkit-scrollbar-track,
    .dm-list::-webkit-scrollbar-track,
    .dm-sidebar::-webkit-scrollbar-track,
    .dm-following-list::-webkit-scrollbar-track,
    .dm-gif-results::-webkit-scrollbar-track { background: transparent; }
    .dm-thread-messages::-webkit-scrollbar-thumb,
    .dm-list::-webkit-scrollbar-thumb,
    .dm-sidebar::-webkit-scrollbar-thumb,
    .dm-following-list::-webkit-scrollbar-thumb,
    .dm-gif-results::-webkit-scrollbar-thumb {
      background: rgba(127,168,217,0.35); border-radius: 10px;
    }
    .dm-thread-messages::-webkit-scrollbar-thumb:hover,
    .dm-list::-webkit-scrollbar-thumb:hover,
    .dm-sidebar::-webkit-scrollbar-thumb:hover,
    .dm-following-list::-webkit-scrollbar-thumb:hover,
    .dm-gif-results::-webkit-scrollbar-thumb:hover {
      background: rgba(127,168,217,0.65);
    }
    .dm-pending-banner {
      background: rgba(240,192,96,0.1); border: 1px solid rgba(240,192,96,0.3);
      border-radius: 10px; padding: 0.7rem 0.9rem; font-size: 0.85rem; color: #e0c080;
      line-height: 1.5; margin-bottom: 0.2rem;
    }
    .dm-pending-banner strong { color: #f0c060; }
    .dm-day-divider {
      align-self: center; font-size: 0.72rem; font-weight: 700; color: rgba(255,255,255,0.45);
      letter-spacing: 0.02em; margin: 0.65rem 0 0.15rem; padding: 0.3rem 0.9rem;
      background: rgba(255,255,255,0.06); border-radius: 20px;
    }
    /* Each message is a [menu-button, bubble] row (order swaps by side) so
       the "•••" sits beside the bubble rather than needing to be absolutely
       positioned over it -- the row itself carries the mine/theirs side
       alignment that used to live directly on .dm-bubble. */
    .dm-bubble-row { display: flex; align-items: center; gap: 0.35rem; max-width: 78%; }
    .dm-bubble-row--mine { align-self: flex-end; }
    .dm-bubble-row--theirs { align-self: flex-start; }
    .dm-bubble {
      min-width: 0; padding: 0.6rem 0.9rem; border-radius: 14px;
      font-size: 0.88rem; line-height: 1.45; box-sizing: border-box;
    }
    .dm-bubble-time {
      display: block; text-align: right; font-size: 0.68rem; margin-top: 0.3rem; opacity: 0.6;
    }
    .dm-bubble--mine .dm-bubble-time { color: #3d2e08; }
    .dm-bubble--theirs .dm-bubble-time { color: rgba(255,255,255,0.45); }
    .dm-bubble p { margin: 0; white-space: pre-wrap; }
    .dm-bubble--mine { background: #f0c060; color: #0d0d0d; border-bottom-right-radius: 4px; }
    .dm-bubble--theirs { background: rgba(255,255,255,0.07); border-bottom-left-radius: 4px; }

    /* "•••" hover menu — only visible while hovering the row it belongs to. */
    .dm-bubble-menu-wrap { position: relative; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
    .dm-bubble-row:hover .dm-bubble-menu-wrap,
    .dm-bubble-menu-wrap.dm-bubble-menu-open { opacity: 1; }
    .dm-bubble-menu-btn {
      width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); color: #ccc;
      font-size: 0.7rem; letter-spacing: 0.04em; cursor: pointer; font-family: inherit; padding: 0;
    }
    .dm-bubble-menu-btn:hover { border-color: #7fa8d9; color: #7fa8d9; background: rgba(127,168,217,0.12); }
    .dm-bubble-menu-dropdown {
      position: absolute; top: calc(100% + 6px); z-index: 20; min-width: 150px;
      background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5); overflow: hidden; padding: 0.35rem;
    }
    .dm-bubble-row--mine .dm-bubble-menu-dropdown { right: 0; }
    .dm-bubble-row--theirs .dm-bubble-menu-dropdown { left: 0; }
    .dm-bubble-menu-dropdown button {
      display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
      color: #e0e0e0; font-family: inherit; font-size: 0.85rem; padding: 0.55rem 0.7rem; border-radius: 8px;
      white-space: nowrap;
    }
    .dm-bubble-menu-dropdown button:hover { background: rgba(255,255,255,0.08); }
    .dm-bubble-menu-dropdown button.dm-menu-danger { color: #e8849e; }
    .dm-bubble-menu-dropdown button.dm-menu-danger:hover { background: rgba(194,84,122,0.12); }
    .dm-bubble-attach-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.4rem; }
    .dm-bubble-attach-img {
      max-height: 260px; max-width: 280px; width: auto; height: auto;
      border-radius: 10px; object-fit: contain; display: block;
    }
    img.dm-bubble-attach-img { cursor: zoom-in; transition: opacity 0.15s; }
    img.dm-bubble-attach-img:hover { opacity: 0.88; }
    .dm-bubble-attach-link { color: #7fa8d9; font-size: 0.82rem; text-decoration: none; display: block; margin-top: 0.2rem; }
    .dm-bubble--mine .dm-bubble-attach-link { color: #5a4210; }
    .dm-bubble-attach-link:hover { text-decoration: underline; }

    /* Lightbox — click any sent image/GIF for a full, uncropped preview */
    .dm-lightbox-overlay {
      position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center; padding: 3rem;
    }
    .dm-lightbox-img { max-width: 90vw; max-height: 88vh; object-fit: contain; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
    .dm-lightbox-close {
      position: absolute; top: 1.25rem; right: 1.5rem; width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 1.3rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: background 0.15s;
    }
    .dm-lightbox-close:hover { background: rgba(255,255,255,0.22); }

    .dm-thread-reply { padding: 0.85rem 1.1rem; border-top: 1px solid rgba(255,255,255,0.08); }
    .dm-reply-msg { font-size: 0.78rem; color: #d97a72; margin-bottom: 0.4rem; }

    .dm-typing-indicator {
      padding: 0 1.1rem 0.4rem; font-size: 0.8rem; font-style: italic; color: #999;
      display: flex; align-items: center; gap: 0.4rem;
    }
    .dm-typing-dots { display: inline-flex; gap: 2px; }
    .dm-typing-dots span {
      width: 4px; height: 4px; border-radius: 50%; background: #999;
      animation: dm-typing-bounce 1.2s infinite ease-in-out;
    }
    .dm-typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .dm-typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dm-typing-bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-3px); opacity: 1; }
    }

    /* Unified typing box — same feel as the main BTW Inbox's compose/reply box */
    .dm-input-box {
      border: 1px solid rgba(180,140,255,0.25); border-radius: 14px;
      background: rgba(10,6,22,0.55); overflow: hidden; display: flex; flex-direction: column;
    }
    .dm-input-textarea {
      border: none; resize: none; outline: none;
      background: rgba(10,8,14,0.82);
      padding: 0.75rem 0.9rem 0.4rem; color: #f0f0f0; font-family: inherit;
      font-size: 0.9rem; width: 100%; box-sizing: border-box; min-height: 54px;
    }
    .dm-input-previews { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 0.75rem 0.45rem; }
    .dm-input-footer {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.75rem; border-top: 1px solid rgba(180,140,255,0.15);
      background: rgba(0,0,0,0.18);
    }
    .dm-attach-btn { cursor: pointer; font-size: 1.05rem; line-height: 1; padding: 0.2rem 0.4rem; border-radius: 8px; transition: background 0.15s; user-select: none; }
    .dm-attach-btn:hover { background: rgba(180,140,255,0.15); }
    .dm-attach-count { font-size: 0.72rem; color: rgba(200,184,232,0.55); min-width: 2.5ch; }
    .dm-gif-btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
      color: rgba(200,184,232,0.7); font-family: inherit; font-size: 0.68rem; font-weight: 700;
      letter-spacing: 0.05em; padding: 0.28rem 0.5rem; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .dm-gif-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

    .dm-gif-picker {
      position: fixed; z-index: 400; width: 260px;
      background: rgba(15,10,26,0.97); border: 1px solid rgba(255,255,255,0.13); border-radius: 14px;
      box-shadow: 0 14px 48px rgba(0,0,0,0.75); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .dm-gif-picker-top { padding: 0.6rem 0.7rem 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .dm-gif-search {
      width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11);
      border-radius: 8px; color: #f0f0f0; font-family: inherit; font-size: 0.85rem; padding: 0.4rem 0.7rem; outline: none;
      transition: border-color 0.15s;
    }
    .dm-gif-search:focus { border-color: #7fa8d9; }
    .dm-gif-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
      color: rgba(200,184,232,0.4); padding: 0.4rem 0.7rem 0.2rem;
    }
    .dm-gif-results {
      display: grid; grid-template-columns: repeat(3, 1fr); align-content: start;
      gap: 3px; max-height: 264px; overflow-y: auto; padding: 3px;
    }
    .dm-gif-item {
      width: 100%; aspect-ratio: 1; object-fit: contain; background: rgba(255,255,255,0.04);
      cursor: pointer; border-radius: 4px; display: block; transition: opacity 0.14s, transform 0.11s;
    }
    .dm-gif-item:hover { opacity: 0.8; transform: scale(0.95); }
    .dm-gif-loading { grid-column: 1 / -1; text-align: center; color: rgba(200,184,232,0.4); font-size: 0.78rem; padding: 1.5rem; }
    .dm-send-btn {
      margin-left: auto; background: #f0c060; color: #0d0d0d; border: none; border-radius: 8px;
      padding: 0.45rem 1.1rem; font-weight: 700; font-size: 0.82rem; cursor: pointer; font-family: inherit;
    }
    .dm-send-btn:hover { background: #e0b050; }

    .dm-preview-item {
      position: relative; border-radius: 9px; overflow: hidden; flex: 0 0 auto;
      background: rgba(0,0,0,0.4); border: 1px solid rgba(180,140,255,0.2);
    }
    .dm-preview-thumb { display: block; max-height: 76px; max-width: 96px; width: auto; height: auto; object-fit: contain; border-radius: 8px; }
    .dm-preview-file-icon { display: flex; align-items: center; justify-content: center; width: 64px; height: 48px; font-size: 1.3rem; }
    .dm-preview-name {
      font-size: 0.62rem; color: rgba(200,184,232,0.6); padding: 0.12rem 0.3rem 0.16rem;
      max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dm-preview-remove {
      position: absolute; top: 3px; right: 3px; background: rgba(0,0,0,0.68); border: none;
      border-radius: 50%; color: #fff; width: 18px; height: 18px; font-size: 0.62rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .dm-preview-remove:hover { background: #d97a72; }

    .dm-following-list { max-height: 280px; overflow-y: auto; margin: 1rem 0; }
    .dm-following-item {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem; border-radius: 8px; cursor: pointer;
    }
    .dm-following-item:hover { background: rgba(255,255,255,0.05); }
    .dm-following-item img, .dm-following-item-fallback {
      width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .dm-following-item-fallback {
      background: linear-gradient(135deg, #7fa8d9, #d97a72); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.82rem;
    }
    .dm-following-item-name { font-size: 0.88rem; font-weight: 600; }

    @media (max-width: 720px) {
      /* The mobile topbar is position:fixed with z-index:200 (fanpages-nav.css)
         and a sibling of this <main>, not an ancestor -- .notif-main's own
         position:relative;z-index:1 (set unconditionally above, for the
         desktop video-vs-content stacking) puts its entire subtree, thread
         panel included, in a stacking context that loses to the topbar
         outright regardless of any z-index set inside it. Bumped above 200
         here so the full-screen thread view (and its Back button) actually
         paints -- and receives clicks -- above the topbar instead of under it. */
      .notif-main { z-index: 250; }

      .dm-app { flex-direction: column; height: auto; min-height: 0; position: relative; }
      .dm-sidebar-rule { display: none; }
      .dm-sidebar-quicklist { display: none; }

      /* Chats/Requests list is the only thing visible by default -- a real
         full-screen inbox, not a squeezed 500px box under a visible sidebar.
         Height clears the topbar (in-flow on mobile, already accounted for
         by .notif-main's own top padding), the Notifications/Inbox tab row,
         and the bottom nav bar. */
      /* flex:0 0 auto, not the base rule's flex:1 -- flex:1 sets
         flex-basis:0%, which in a column flex container silently overrides
         an explicit height (flex-basis wins), collapsing this straight down
         to min-height regardless of what height computes to. */
      .dm-content { flex: 0 0 auto; width: 100%; height: calc(100vh - 242px - env(safe-area-inset-bottom, 0px)); min-height: 420px; }

      /* .dm-sidebar (pfp/+New Chat/Chats-Requests toggle -- the desktop
         "left box") becomes a hidden-by-default popover anchored above the
         floating message button, opened via #dm-mobile-fab instead of
         sitting permanently on screen. */
      .dm-sidebar {
        display: none; flex-direction: column; width: 78vw; max-width: 300px;
        height: auto; max-height: 60vh;
        position: fixed; right: 1rem; bottom: calc(58px + env(safe-area-inset-bottom, 0px) + 4.2rem);
        z-index: 420; box-shadow: 0 10px 40px rgba(0,0,0,0.55);
      }
      .dm-app.dm-mobile-menu-open .dm-sidebar { display: flex; }

      .dm-mobile-fab {
        display: flex; align-items: center; justify-content: center;
        position: fixed; right: 1rem; bottom: calc(58px + env(safe-area-inset-bottom, 0px) + 1.1rem);
        z-index: 420; width: 52px; height: 52px; border-radius: 50%;
        background: linear-gradient(135deg, #b8863a, #f0c060); color: #1a1408;
        border: none; cursor: pointer; box-shadow: 0 4px 18px rgba(0,0,0,0.45);
      }
      .dm-mobile-fab svg { width: 24px; height: 24px; }
      .dm-mobile-fab:active { transform: scale(0.94); }

      .dm-mobile-menu-backdrop {
        position: fixed; inset: 0; z-index: 410; background: rgba(0,0,0,0.4);
      }
      .dm-app:not(.dm-mobile-menu-open) .dm-mobile-menu-backdrop { display: none; }

      /* Single-thread view takes over the full viewport when open, like a
         real Twitter DM screen -- covers the bottom nav too, its own Back
         button is the only way out. */
      .dm-panel--thread:not([hidden]) {
        position: fixed; inset: 0; z-index: 400; height: 100vh;
        border-radius: 0; border: none; background: #0d0d0d;
      }
      .dm-panel--thread:not([hidden]) .dm-thread-reply {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Full-bleed width -- was inheriting the desktop 2rem side gutters,
         plus a full 3rem top gap that left the tabs floating well below the
         topbar instead of sitting right under it. */
      .notif-main { padding: 1.1rem 0.6rem 3rem; }

      /* Notifications/Inbox switch from a centered pill pair to a full-width
         Wattpad-style tab row (same recipe as Bookmarks/Profile's own mobile
         tabs) so it actually spans edge to edge instead of floating in the
         middle third of the screen. */
      .notif-tabs { justify-content: stretch; gap: 0; }
      .notif-tabs-group { flex: 1; gap: 0; }
      .notif-tab { flex: 1 1 0; text-align: center; font-size: 0.95rem; padding: 0.7rem 0.1rem 0.85rem; }

      /* Notification cards shrunk so more fit on one screen without
         scrolling. */
      .notif-item { padding: 0.8rem 0.9rem; gap: 0.7rem; margin-bottom: 0.5rem; border-radius: 12px; }
      .notif-avatar, .notif-avatar--fallback { width: 38px; height: 38px; }
      .notif-avatar--fallback { font-size: 0.92rem; }
      .notif-item-text { font-size: 0.85rem; line-height: 1.42; }
      .notif-item-time { font-size: 0.68rem; margin-top: 0.2rem; }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>

<div class="mod-page-bg-wrap">
  <img class="mod-page-bg-img" src="/images/home/box-background-3.png" alt="" />
  <div class="mod-page-bg-overlay"></div>
</div>

<div class="dm-lightbox-overlay" id="dm-lightbox-overlay" hidden>
  <button class="dm-lightbox-close" id="dm-lightbox-close" type="button" aria-label="Close">✕</button>
  <img class="dm-lightbox-img" id="dm-lightbox-img" src="" alt="" />
</div>

<div class="char-editor-overlay" id="dm-new-chat-overlay" hidden>
  <div class="char-editor-modal" style="max-width: 440px;">
    <h2 class="char-editor-title" id="dm-new-chat-title">New Chat</h2>

    <input class="mod-input" id="dm-new-chat-search" placeholder="Search for anyone…" />
    <div id="dm-new-chat-results" class="dm-following-list"><p class="notif-empty">Loading…</p></div>

    <div class="char-editor-actions">
      <button class="mod-btn" id="dm-new-chat-cancel" type="button">Cancel</button>
    </div>
  </div>
</div>

<main class="notif-main">

    <section class="notif-content">
      <div class="notif-tabs">
        <div class="notif-tabs-group">
          <button class="notif-tab active" id="notif-tab-notifications" type="button">Notifications</button>
          <button class="notif-tab" id="notif-tab-inbox" type="button">Inbox <span class="notif-tab-badge" id="notif-tab-inbox-badge" hidden></span></button>
        </div>
      </div>

      <div id="notif-list"><p class="notif-empty">Loading…</p></div>

      <div id="notif-inbox" style="display:none;">
        <div class="dm-app" id="dm-app">
          <aside class="dm-sidebar">
            <div class="dm-user-block" id="dm-user-block"></div>
            <button class="dm-new-chat-btn" id="dm-new-chat-btn" type="button">+ New Chat</button>
            <div class="dm-sidebar-rule"></div>
            <button class="dm-side-tab active" id="dm-tab-chats" type="button">
              <span>💬 Chats</span>
            </button>
            <button class="dm-side-tab" id="dm-tab-requests" type="button">
              <span>📮 Requests</span>
              <span class="dm-req-badge" id="dm-req-badge" hidden></span>
            </button>
            <div class="dm-sidebar-rule"></div>
            <div class="dm-sidebar-quicklist" id="dm-sidebar-quicklist">
              <p class="dm-sidebar-quicklist-empty">Loading…</p>
            </div>
          </aside>

          <div class="dm-content">
            <div id="dm-panel-chats" class="dm-panel">
              <div id="dm-chats-list" class="dm-list"><p class="notif-empty">Loading…</p></div>
            </div>
            <div id="dm-panel-requests" class="dm-panel" hidden>
              <div class="dm-subtabs">
                <button class="dm-subtab active" id="dm-subtab-pending" type="button">Pending</button>
                <button class="dm-subtab" id="dm-subtab-ongoing" type="button">Ongoing</button>
              </div>
              <div id="dm-requests-list" class="dm-list"><p class="notif-empty">Loading…</p></div>
            </div>
            <div id="dm-panel-thread" class="dm-panel dm-panel--thread" hidden>
              <div class="dm-thread-header">
                <button class="dm-thread-back" id="dm-thread-back" type="button">← Back</button>
                <a class="dm-thread-user-link" id="dm-thread-user-link" href="#">
                  <span id="dm-thread-avatar-wrap"></span>
                  <span class="dm-thread-title" id="dm-thread-title"></span>
                </a>
                <button class="dm-thread-dismiss-btn" id="dm-thread-dismiss-btn" type="button" title="Dismiss" hidden>🗑️</button>
                <div class="dm-thread-menu-wrap" id="dm-thread-menu-wrap">
                  <button class="dm-thread-menu-btn" id="dm-thread-menu-btn" type="button" aria-label="More actions">&#8226;&#8226;&#8226;</button>
                  <div class="dm-thread-menu-dropdown" id="dm-thread-menu-dropdown" hidden>
                    <button type="button" id="dm-thread-menu-report">Report User</button>
                    <button type="button" id="dm-thread-menu-block" class="dm-menu-danger">Block User</button>
                  </div>
                </div>
              </div>
              <div class="dm-thread-messages" id="dm-thread-messages"></div>
              <p class="dm-typing-indicator" id="dm-typing-indicator" hidden>
                <span id="dm-typing-indicator-text"></span>
                <span class="dm-typing-dots"><span></span><span></span><span></span></span>
              </p>
              <div class="dm-thread-reply">
                <p class="dm-reply-msg" id="dm-reply-msg" hidden></p>
                <div class="dm-input-box">
                  <textarea class="dm-input-textarea" id="dm-reply-input" placeholder="Type a message…" maxlength="4000"></textarea>
                  <div class="dm-input-previews" id="dm-reply-previews"></div>
                  <div class="dm-input-footer">
                    <label class="dm-attach-btn" title="Attach up to 4 files">
                      📎
                      <input type="file" id="dm-reply-file" accept="image/*,video/mp4,video/webm,application/pdf" multiple style="display:none;" />
                    </label>
                    <button class="dm-gif-btn" id="dm-reply-gif-btn" type="button">GIF</button>
                    <span class="dm-attach-count" id="dm-reply-file-count"></span>
                    <button class="dm-send-btn" id="dm-reply-send" type="button">Send</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- ── Mobile-only Twitter-style Inbox chrome. Deliberately reuses
             .dm-sidebar as-is (just repositioned via CSS into a popover) so
             every existing dm-sidebar id/listener (pfp block, +New Chat,
             Chats/Requests tabs, badges) keeps working untouched -- no
             duplicate markup, no new JS wiring for that content. Desktop
             never sees these; both are display:none outside the 720px
             breakpoint. ── -->
        <button class="dm-mobile-fab" id="dm-mobile-fab" type="button" aria-label="Messages menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <div class="dm-mobile-menu-backdrop" id="dm-mobile-menu-backdrop" hidden></div>
      </div>
    </section>

</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
  const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const time = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    if (sameDay) return `today at ${time}`;
    return `${d.toLocaleDateString([], { month: 'short', day: 'numeric' })} at ${time}`;
  }

  // ── Notifications / Inbox tabs ────────────────────────────────────────────
  const notifTabNotifications = document.getElementById('notif-tab-notifications');
  const notifTabInbox = document.getElementById('notif-tab-inbox');
  const notifListEl = document.getElementById('notif-list');
  const notifInboxEl = document.getElementById('notif-inbox');

  function switchNotifTab(tab, pushHash) {
    const isInbox = tab === 'inbox';
    notifTabInbox.classList.toggle('active', isInbox);
    notifTabNotifications.classList.toggle('active', !isInbox);
    notifInboxEl.style.display = isInbox ? '' : 'none';
    notifListEl.style.display = isInbox ? 'none' : '';
    if (isInbox) initDmAppOnce();
    else dmStopThreadPolling();
    if (pushHash !== false) location.hash = tab;
  }

  notifTabNotifications.addEventListener('click', () => switchNotifTab('notifications'));
  notifTabInbox.addEventListener('click', () => switchNotifTab('inbox'));

  // ── DM app ("Inbox" tab) — a real user-to-user chat system, separate from
  // the admin-only /inbox note system. Starting a chat requires following
  // the other person first; it stays a pending "request" until they accept.
  let dmActiveThreadId = null;
  let dmActiveOtherUser = null; // { id, username, display_name, avatar } of whoever's on the other end of the open thread

  const dmTabChats = document.getElementById('dm-tab-chats');
  const dmTabRequests = document.getElementById('dm-tab-requests');
  const dmPanelChats = document.getElementById('dm-panel-chats');
  const dmPanelRequests = document.getElementById('dm-panel-requests');
  const dmPanelThread = document.getElementById('dm-panel-thread');
  const dmChatsList = document.getElementById('dm-chats-list');
  const dmRequestsList = document.getElementById('dm-requests-list');
  const dmReqBadge = document.getElementById('dm-req-badge');

  function dmShowPanel(which) {
    dmPanelChats.hidden = which !== 'chats';
    dmPanelRequests.hidden = which !== 'requests';
    dmPanelThread.hidden = which !== 'thread';
    // Mobile's floating message button would otherwise float on top of the
    // full-screen thread's own reply box -- redundant and in the way once

  dmTabChats.addEventListener('click', () => { dmShowPanel('chats'); loadDmChats(); });
  dmTabRequests.addEventListener('click', () => {
    dmShowPanel('requests');

    loadDmRequests();

  // ── Requests sub-tabs: Pending (incoming) / Ongoing (my own sent) ────────
  let dmRequestsDirection = 'received';
  const dmSubtabPending = document.getElementById('dm-subtab-pending');
  const dmSubtabOngoing = document.getElementById('dm-subtab-ongoing');
  dmSubtabPending.addEventListener('click', () => {

  });
  dmSubtabOngoing.addEventListener('click', () => {
    dmRequestsDirection = 'sent';

    dmSubtabPending.classList.remove('active');

  });

  function dmAvatarHtml(user, cls, fbCls) {
    const name = user.display_name || user.username || '?';
    return user.avatar
      ? `<img src="${user.avatar}" class="${cls}" alt="" />`
      : `<div class="${fbCls}">${escapeHtml(name.charAt(0).toUpperCase())}</div>`;
  }

  function dmEmptyCenter(text) {
    const div = document.createElement('div');
    div.className = 'dm-empty-center';
    div.innerHTML = `<p>${text}</p>`;
    return div;
  }

  function dmChatItem(c) {

    const unread = c.unread_count > 0;
    div.className = 'dm-list-item' + (unread ? ' dm-list-item--unread' : '');
    div.innerHTML = `
      <div class="dm-list-item-content">

        <div class="dm-list-body">
          <div class="dm-list-row">
            <span class="dm-list-name">${escapeHtml(name)}${unread ? '<span class="dm-list-unread-dot"></span>' : ''}</span>
            ${c.last_message ? `<span class="dm-list-time">${formatTime(c.last_message.created_at)}</span>` : ''}
          </div>
          ${c.status === 'pending'
            ? `<p class="dm-list-pending-tag">Request sent — awaiting response</p>`
            : `<p class="dm-list-preview${unread ? ' dm-list-preview--unread' : ''}">${escapeHtml(previewText || 'No messages yet')}</p>`}
        </div>
      </div>

      </div>

    div.querySelector('.dm-list-delete-btn').addEventListener('click', async (e) => {

      await fetch(`/api/dm/${c.id}`, { method: 'DELETE', headers: authHeaders() });
      loadDmChats();
      loadDmQuickList();

    div.addEventListener('click', () => openDmThread(c.id, name, c.other_user, false));
