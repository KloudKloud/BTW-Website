  function dmPriorityItem(p) {
    const div = document.createElement('div');
    const name = p.other_user.display_name || p.other_user.username;
    const previewText = p.last_message ? p.last_message.body : '';
    const unread = p.unread_count > 0;
    div.className = 'dm-list-item dm-list-item--priority' + (unread ? ' dm-list-item--unread' : '');
    div.innerHTML = `
      <div class="dm-list-item-content">
        ${dmAvatarHtml(p.other_user, 'dm-list-avatar', 'dm-list-avatar-fallback')}
        <div class="dm-list-body">
          <div class="dm-list-row">
            <span class="dm-list-name">${escapeHtml(name)}${unread ? '<span class="dm-list-unread-dot"></span>' : ''}</span>
            ${p.last_message ? `<span class="dm-list-time">${formatTime(p.last_message.created_at)}</span>` : ''}
          </div>
          <p class="dm-list-preview${unread ? ' dm-list-preview--unread' : ''}">${escapeHtml(previewText)}</p>
        </div>
      </div>
    `;
    div.addEventListener('click', () => openDmThread(p.id, name, p.other_user, true));
    return div;
  }

  // ── Sidebar quick-switch list — compact mirror of the Chats panel ────────
  function dmQuickItem(c, isPriority) {
    const div = document.createElement('div');
    const name = c.other_user.display_name || c.other_user.username;
    const previewText = c.last_message
      ? ((!isPriority && c.last_message.is_mine) ? 'You: ' : '') + c.last_message.body
      : (c.status === 'pending' ? 'Request sent — awaiting response' : 'No messages yet');
    const unread = c.unread_count > 0;
    const active = dmActiveThreadId === c.id;
    div.className = 'dm-quick-item' + (unread ? ' dm-quick-item--unread' : '') + (active ? ' dm-quick-item--active' : '');
    div.innerHTML = `
      ${dmAvatarHtml(c.other_user, 'dm-quick-item-avatar', 'dm-quick-item-avatar-fallback')}
      <div class="dm-quick-item-body">
        <span class="dm-quick-item-name">${escapeHtml(name)}</span>
        <div class="dm-quick-item-preview">${escapeHtml(previewText)}</div>
      </div>
      ${unread ? '<span class="dm-quick-item-dot"></span>' : ''}
    `;
    div.addEventListener('click', () => openDmThread(c.id, name, c.other_user, isPriority));
    return div;
  }

  async function loadDmQuickList() {
    const list = document.getElementById('dm-sidebar-quicklist');
    try {
      const res = await fetch('/api/dm/chats', { headers: authHeaders() });
      const data = await res.json();
      const priority = data.priority || [];
      const chats = data.chats || [];
      list.innerHTML = '';
      if (!priority.length && !chats.length) {
        list.innerHTML = '<p class="dm-sidebar-quicklist-empty">No chats yet.</p>';
        return;
      }
      priority.forEach(p => list.appendChild(dmQuickItem(p, true)));
      chats.forEach(c => list.appendChild(dmQuickItem(c, false)));
    } catch {
      list.innerHTML = '<p class="dm-sidebar-quicklist-empty">Couldn\'t load chats.</p>';
    }
  }

  async function loadDmChats() {
    dmChatsList.innerHTML = '<p class="notif-empty">Loading…</p>';
    try {
      const res = await fetch('/api/dm/chats', { headers: authHeaders() });
      const data = await res.json();
      const priority = data.priority || [];
      const chats = data.chats || [];

      dmChatsList.innerHTML = '';

      if (priority.length) {
        const header = document.createElement('p');
        header.className = 'dm-priority-header';
        header.textContent = '⚠️ High Priority';
        dmChatsList.appendChild(header);
        priority.forEach(p => dmChatsList.appendChild(dmPriorityItem(p)));
        const fancyLine = '⊹₊˚‧︵‿₊⊱·✶·⊰₊‿︵‧˚₊⊹';
        const divider = document.createElement('div');
        divider.className = 'dm-flower-divider';
        divider.innerHTML = `
          <div class="dm-flower-divider-fancy">${fancyLine}</div>
          <div class="dm-flower-divider-blooms">${'🌸 '.repeat(15).trim()}</div>
          <div class="dm-flower-divider-fancy">${fancyLine}</div>
        `;
        dmChatsList.appendChild(divider);
      }

      const chatsHeader = document.createElement('p');
      chatsHeader.className = 'dm-chats-header';
      chatsHeader.textContent = 'Chats';
      dmChatsList.appendChild(chatsHeader);

      if (!chats.length) {
        dmChatsList.appendChild(dmEmptyCenter('No chats yet.<br>Start one from the "+ New Chat" button!'));
      } else {
        chats.forEach(c => dmChatsList.appendChild(dmChatItem(c)));
      }
    } catch {
      dmChatsList.innerHTML = '<p class="notif-empty">Couldn\'t load chats right now.</p>';
    }
  }

  function dmRequestItem(r, direction) {
    const div = document.createElement('div');
    div.className = 'dm-list-item';
    const name = r.other_user.display_name || r.other_user.username;
    const actionsHtml = direction === 'received'
      ? `<div class="dm-request-actions">
           <button class="dm-accept-btn" type="button">Accept</button>
           <button class="dm-deny-btn" type="button">Deny</button>
         </div>`
      : `<p class="dm-list-pending-tag">Awaiting response</p>`;
    div.innerHTML = `
      ${dmAvatarHtml(r.other_user, 'dm-list-avatar', 'dm-list-avatar-fallback')}
      <div class="dm-list-body">
        <div class="dm-list-row">
          <span class="dm-list-name">${escapeHtml(name)}</span>
          <span class="dm-list-time">${formatTime(r.created_at)}</span>
        </div>
        <p class="dm-list-preview">${escapeHtml(r.first_message)}</p>
        ${actionsHtml}
      </div>
    `;
    if (direction === 'received') {
      div.querySelector('.dm-accept-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        e.currentTarget.disabled = true;
        await fetch(`/api/dm/${r.id}/accept`, { method: 'POST', headers: authHeaders() });
        loadDmRequests();
        dmRefreshRequestBadge();
        loadDmQuickList();
      });
      div.querySelector('.dm-deny-btn').addEventListener('click', async (e) => {
        e.stopPropagation();
        e.currentTarget.disabled = true;
        await fetch(`/api/dm/${r.id}/deny`, { method: 'POST', headers: authHeaders() });
        loadDmRequests();
        dmRefreshRequestBadge();
        loadDmQuickList();
      });
    }
    div.addEventListener('click', () => openDmThread(r.id, name, r.other_user));
    return div;
  }

  async function loadDmRequests() {
    const direction = dmRequestsDirection;
    dmRequestsList.innerHTML = '<p class="notif-empty">Loading…</p>';
    try {
      const res = await fetch(`/api/dm/requests?direction=${direction}`, { headers: authHeaders() });
      const data = await res.json();
      const requests = data.requests || [];
      dmRequestsList.innerHTML = '';
      if (!requests.length) {
        dmRequestsList.appendChild(dmEmptyCenter(direction === 'sent' ? 'No ongoing requests.' : 'No pending requests.'));
      } else {
        requests.forEach(r => dmRequestsList.appendChild(dmRequestItem(r, direction)));
      }
    } catch {
      dmRequestsList.innerHTML = '<p class="notif-empty">Couldn\'t load requests right now.</p>';
    }
  }

  async function dmRefreshRequestBadge() {
    try {
      const [reqRes, unreadRes] = await Promise.all([
        fetch('/api/dm/requests', { headers: authHeaders() }),
        fetch('/api/dm/unread-count', { headers: authHeaders() }),
      ]);
      const reqData = await reqRes.json();
      const unreadData = await unreadRes.json();
      const requestCount = (reqData.requests || []).length;

      if (requestCount > 0) { dmReqBadge.textContent = requestCount; dmReqBadge.hidden = false; }
      else dmReqBadge.hidden = true;

      // Inbox tab badge — requests waiting on me + unread chat messages.
      const inboxBadge = document.getElementById('notif-tab-inbox-badge');
      const total = requestCount + (unreadData.count || 0);
      if (total > 0) { inboxBadge.textContent = total > 99 ? '99+' : total; inboxBadge.hidden = false; }
      else inboxBadge.hidden = true;
    } catch {}
  }

  // ── Thread view ────────────────────────────────────────────────────────
  let dmPendingTargetUser = null; // set while composing a brand-new chat (no thread yet)
  let dmReplyFiles = [];
  let dmLastRenderedDay = null; // tracks the day of the last message appended, for day dividers

  // ── Live polling (new messages + "is typing") while a thread is open ────
  // No websocket infra on this server, so this is a plain short-interval
  // poll -- started when a thread opens, stopped the moment its panel is
  // no longer the visible one (dmShowPanel handles that centrally).
  let dmPollTimer = null;
  let dmLastMessageId = 0;
  let dmLastDeletionId = 0;
  let dmOtherDisplayName = '';

  function dmStopThreadPolling() {
    if (dmPollTimer) { clearInterval(dmPollTimer); dmPollTimer = null; }
    document.getElementById('dm-typing-indicator').hidden = true;
  }

  function dmStartThreadPolling(threadId) {
    dmStopThreadPolling();
    dmPollTimer = setInterval(() => dmPollThread(threadId), 2500);
  }

  async function dmPollThread(threadId) {
    if (dmActiveThreadId !== threadId) return;
    try {
      const [msgRes, typingRes] = await Promise.all([
        fetch(`/api/dm/${threadId}/messages?after=${dmLastMessageId}&deleted_after=${dmLastDeletionId}`, { headers: authHeaders() }),
        fetch(`/api/dm/${threadId}/typing`, { headers: authHeaders() }),
      ]);
      if (dmActiveThreadId !== threadId) return; // switched away while these were in flight

      if (msgRes.ok) {
        const data = await msgRes.json();
        const msgs = data.messages || [];
        if (msgs.length) {
          const msgWrap = document.getElementById('dm-thread-messages');
          msgs.forEach(m => dmAppendMessage(msgWrap, m));
          dmLastMessageId = msgs[msgs.length - 1].id;
          dmScrollToBottom(msgWrap);
          dmRefreshRequestBadge();
        }
        const deletions = data.deletions || [];
        if (deletions.length) {
          deletions.forEach(d => dmRemoveBubble(d.message_id));
          dmLastDeletionId = deletions[deletions.length - 1].id;
        }
      }

      const typingEl = document.getElementById('dm-typing-indicator');
      if (typingRes.ok) {
        const { typing } = await typingRes.json();
        document.getElementById('dm-typing-indicator-text').textContent = `${dmOtherDisplayName} is typing`;
        typingEl.hidden = !typing;
      }
    } catch { /* transient network hiccup -- just try again next tick */ }
  }

  // Removes a bubble (and its row wrapper) whether it was just deleted by
  // me locally or reported as gone by a poll -- looked up by the message id
  // stamped on the row in dmBubble().
  function dmRemoveBubble(messageId) {
    const row = document.querySelector(`.dm-bubble-row[data-message-id="${messageId}"]`);
    if (row) row.remove();
  }

  // Pings the server at most once every 2s while the user keeps typing --
  // the 4s server-side TTL (see DM_TYPING_TTL_MS) means the indicator on
  // the other end clears itself a couple seconds after typing stops,
  // without needing an explicit "stopped typing" call.
  let dmTypingLastSentAt = 0;
  document.getElementById('dm-reply-input').addEventListener('input', () => {
    if (!dmActiveThreadId) return;
    const now = Date.now();
    if (now - dmTypingLastSentAt < 2000) return;
    dmTypingLastSentAt = now;
    fetch(`/api/dm/${dmActiveThreadId}/typing`, { method: 'POST', headers: authHeaders() }).catch(() => {});
  });

  function dmDayKey(dateStr) { return new Date(dateStr).toDateString(); }

  function dmDayLabel(dateStr) {
    const d = new Date(dateStr);
    const now = new Date();
    if (d.toDateString() === now.toDateString()) return 'Today';
    const yesterday = new Date(now);
    yesterday.setDate(now.getDate() - 1);
    if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
    const sameYear = d.getFullYear() === now.getFullYear();
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: sameYear ? undefined : 'numeric' });
  }

  function dmTimeLabel(dateStr) {
    return new Date(dateStr).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  }

  function dmDayDivider(dateStr) {
    const div = document.createElement('div');
    div.className = 'dm-day-divider';
    div.textContent = dmDayLabel(dateStr);
    return div;
  }

  // Appends a message, inserting a centered day-divider first whenever it
  // falls on a different day than the last message rendered into this thread.
  function dmAppendMessage(msgWrap, m) {
    const day = dmDayKey(m.created_at);
    if (day !== dmLastRenderedDay) {
      msgWrap.appendChild(dmDayDivider(m.created_at));
      dmLastRenderedDay = day;
    }
    msgWrap.appendChild(dmBubble(m));
  }

  // Scrolls the message pane all the way down. Images/GIFs load in async
  // and grow the pane's height afterward, so a single scroll right after
  // appending bubbles can land short — re-run once each image settles too.
  function dmScrollToBottom(msgWrap) {
    const jump = () => { msgWrap.scrollTop = msgWrap.scrollHeight; };
    requestAnimationFrame(() => requestAnimationFrame(jump));
    msgWrap.querySelectorAll('img').forEach(img => {
      if (img.complete) return;
      img.addEventListener('load', jump);
      img.addEventListener('error', jump);
    });
  }

  // ── Lightbox — click any sent image/GIF for a full, uncropped preview ──
  const dmLightboxOverlay = document.getElementById('dm-lightbox-overlay');
  const dmLightboxImg = document.getElementById('dm-lightbox-img');
  function dmOpenLightbox(url) {
    dmLightboxImg.src = url;
    dmLightboxOverlay.hidden = false;
  }
  function dmCloseLightbox() {
    dmLightboxOverlay.hidden = true;
    dmLightboxImg.src = '';
  }
  document.getElementById('dm-lightbox-close').addEventListener('click', dmCloseLightbox);
  dmLightboxOverlay.addEventListener('click', (e) => { if (e.target === dmLightboxOverlay) dmCloseLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !dmLightboxOverlay.hidden) dmCloseLightbox(); });

  function dmBubble(m) {
    const div = document.createElement('div');
    div.className = 'dm-bubble ' + (m.is_mine ? 'dm-bubble--mine' : 'dm-bubble--theirs');
    if (m.body) {
      const p = document.createElement('p');
      p.textContent = m.body;
      div.appendChild(p);
    }
    const atts = m.attachments || [];
    if (atts.length) {
      const grid = document.createElement('div');
      grid.className = 'dm-bubble-attach-grid';
      atts.forEach(att => {
        if (/\.(jpe?g|png|webp|gif|avif)$/i.test(att.url)) {
          const img = document.createElement('img');
          img.src = att.url; img.alt = att.name || 'Image'; img.className = 'dm-bubble-attach-img';
          img.addEventListener('click', () => dmOpenLightbox(att.url));
          grid.appendChild(img);
        } else if (/\.(mp4|webm)$/i.test(att.url)) {
          const vid = document.createElement('video');
          vid.src = att.url; vid.controls = true; vid.className = 'dm-bubble-attach-img';
          grid.appendChild(vid);
        } else {
          const a = document.createElement('a');
          a.href = att.url; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = '📎 ' + (att.name || 'View attachment');
          a.className = 'dm-bubble-attach-link';
          grid.appendChild(a);
        }
      });
      div.appendChild(grid);
    }
    const time = document.createElement('span');
    time.className = 'dm-bubble-time';
    time.textContent = dmTimeLabel(m.created_at);
    div.appendChild(time);

    const row = document.createElement('div');
    row.className = 'dm-bubble-row ' + (m.is_mine ? 'dm-bubble-row--mine' : 'dm-bubble-row--theirs');
    row.dataset.messageId = m.id;
    const menuWrap = dmBubbleMenu(m);
    if (m.is_mine) {
      // Own message — menu sits to the LEFT of the bubble.
      row.appendChild(menuWrap);
      row.appendChild(div);
    } else {
      // Their message — menu sits to the RIGHT of the bubble.
      row.appendChild(div);
      row.appendChild(menuWrap);
    }
    return row;
  }

  // "•••" hover menu beside a bubble. Own messages: just Delete (removes it
  // for both sides). Someone else's: Report (shared modal) and Hide Message
  // (removes it from my own view only, via dm_message_hides).
  function dmBubbleMenu(m) {
    const wrap = document.createElement('div');
    wrap.className = 'dm-bubble-menu-wrap';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dm-bubble-menu-btn';
    btn.textContent = '•••';
    btn.setAttribute('aria-label', 'Message actions');
    const dropdown = document.createElement('div');
    dropdown.className = 'dm-bubble-menu-dropdown';
    dropdown.hidden = true;

    function addItem(label, handler, danger) {
      const item = document.createElement('button');
      item.type = 'button';
      item.textContent = label;
      if (danger) item.className = 'dm-menu-danger';
      item.addEventListener('click', () => { dropdown.hidden = true; wrap.classList.remove('dm-bubble-menu-open'); handler(); });
      dropdown.appendChild(item);
    }

    if (m.is_mine) {
      addItem('Delete', async () => {
        if (!confirm('Delete this message? It will be removed for both of you.')) return;
        try {
          const res = await fetch(`/api/dm/${dmActiveThreadId}/messages/${m.id}`, { method: 'DELETE', headers: authHeaders() });
          if (res.ok) dmRemoveBubble(m.id);
        } catch {}
      }, true);
    } else {
      addItem('Report', () => reportContent('dm_message', m.id));
      addItem('Hide Message', async () => {
        try {
          const res = await fetch(`/api/dm/${dmActiveThreadId}/messages/${m.id}/hide`, { method: 'POST', headers: authHeaders() });
          if (res.ok) dmRemoveBubble(m.id);
        } catch {}
      });
    }

    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const opening = dropdown.hidden;
      document.querySelectorAll('.dm-bubble-menu-dropdown').forEach(d => { d.hidden = true; });
      document.querySelectorAll('.dm-bubble-menu-open').forEach(w => w.classList.remove('dm-bubble-menu-open'));
      dropdown.hidden = !opening;
      wrap.classList.toggle('dm-bubble-menu-open', opening);
    });
    wrap.appendChild(btn);
    wrap.appendChild(dropdown);
    return wrap;
  }
  document.addEventListener('click', () => {
    document.querySelectorAll('.dm-bubble-menu-dropdown').forEach(d => { d.hidden = true; });
    document.querySelectorAll('.dm-bubble-menu-open').forEach(w => w.classList.remove('dm-bubble-menu-open'));
  });

  let dmSelectedGifUrl = null;

  function dmRenderReplyPreviews() {
    const el = document.getElementById('dm-reply-previews');
    el.querySelectorAll('img[data-blob],video[data-blob]').forEach(n => URL.revokeObjectURL(n.src));
    el.innerHTML = '';
    if (dmSelectedGifUrl) {
      const item = document.createElement('div');
      item.className = 'dm-preview-item';
      const img = document.createElement('img');
      img.className = 'dm-preview-thumb';
      img.src = dmSelectedGifUrl;
      item.appendChild(img);
      const name = document.createElement('span');
      name.className = 'dm-preview-name';
      name.textContent = 'GIF';
      item.appendChild(name);
      const rm = document.createElement('button');
      rm.className = 'dm-preview-remove';
      rm.type = 'button';
      rm.textContent = '✕';
      rm.addEventListener('click', () => {
        dmSelectedGifUrl = null;
        dmRenderReplyPreviews();
        dmUpdateReplyCount();
      });
      item.appendChild(rm);
      el.appendChild(item);
    }
    dmReplyFiles.forEach((f, i) => {
      const item = document.createElement('div');
      item.className = 'dm-preview-item';
      if (/^image\//.test(f.type)) {
        const img = document.createElement('img');
        img.className = 'dm-preview-thumb'; img.src = URL.createObjectURL(f); img.setAttribute('data-blob', '1');
        item.appendChild(img);
      } else if (/^video\//.test(f.type)) {
        const vid = document.createElement('video');
        vid.className = 'dm-preview-thumb'; vid.src = URL.createObjectURL(f); vid.setAttribute('data-blob', '1'); vid.controls = true;
        item.appendChild(vid);
      } else {
        const icon = document.createElement('div');
        icon.className = 'dm-preview-file-icon';
        icon.textContent = '📄';
        item.appendChild(icon);
      }
      const name = document.createElement('span');
      name.className = 'dm-preview-name';
      name.textContent = f.name.length > 16 ? f.name.slice(0, 13) + '…' : f.name;
      item.appendChild(name);
      const rm = document.createElement('button');
      rm.className = 'dm-preview-remove';
      rm.type = 'button';
      rm.textContent = '✕';
      rm.addEventListener('click', () => {
        dmReplyFiles.splice(i, 1);
        dmRenderReplyPreviews();
        dmUpdateReplyCount();
      });
      item.appendChild(rm);
      el.appendChild(item);
    });
  }
  function dmAttachCount() { return dmReplyFiles.length + (dmSelectedGifUrl ? 1 : 0); }
  function dmUpdateReplyCount() {
    const n = dmAttachCount();
    document.getElementById('dm-reply-file-count').textContent = n ? `${n}/4` : '';
  }
  function dmResetReplyBox() {
    document.getElementById('dm-reply-input').value = '';
    dmReplyFiles = [];
    dmSelectedGifUrl = null;
    dmRenderReplyPreviews();
    dmUpdateReplyCount();
    const msgEl = document.getElementById('dm-reply-msg');
    msgEl.hidden = true;
    msgEl.textContent = '';
  }
  document.getElementById('dm-reply-file').addEventListener('change', function () {
    for (const f of Array.from(this.files)) {
      if (dmAttachCount() >= 4) break;
      if (f.size > 10 * 1024 * 1024) continue;
      dmReplyFiles.push(f);
    }
    this.value = '';
    dmRenderReplyPreviews();
    dmUpdateReplyCount();
  });

  // ── GIF picker — floating popover, positioned under the GIF button ───────
  const dmGifBtn = document.getElementById('dm-reply-gif-btn');
  const dmGifPickerWrap = document.createElement('div');
  dmGifPickerWrap.className = 'dm-gif-picker';
  dmGifPickerWrap.hidden = true;
  dmGifPickerWrap.innerHTML = `
    <div class="dm-gif-picker-top"><input type="text" class="dm-gif-search" id="dm-gif-search" placeholder="🔍 Search GIFs…" /></div>
    <div class="dm-gif-label" id="dm-gif-label">✨ Trending</div>
    <div class="dm-gif-results" id="dm-gif-results"></div>
  `;
  document.body.appendChild(dmGifPickerWrap);

  const dmGifSearch = document.getElementById('dm-gif-search');
  const dmGifLabel = document.getElementById('dm-gif-label');
  const dmGifResults = document.getElementById('dm-gif-results');
  let dmGifTrendingCache = null;
  let dmGifTimer = null;

  function dmPopulateGifResults(gifs) {
    dmGifResults.innerHTML = '';
    if (!gifs.length) { dmGifResults.innerHTML = '<div class="dm-gif-loading">No GIFs found.</div>'; return; }
    gifs.forEach(gif => {
      const img = document.createElement('img');
      img.src = gif.preview; img.title = gif.title; img.className = 'dm-gif-item'; img.loading = 'lazy';
      img.addEventListener('click', () => {
        if (dmAttachCount() >= 4 && !dmSelectedGifUrl) return;
        dmSelectedGifUrl = gif.url;
        dmRenderReplyPreviews();
        dmUpdateReplyCount();
        dmGifPickerWrap.hidden = true;
        dmGifSearch.value = '';
        dmGifLabel.textContent = '✨ Trending';
      });
      dmGifResults.appendChild(img);
    });
  }
  async function dmLoadTrendingGifs() {
    if (dmGifTrendingCache) { dmPopulateGifResults(dmGifTrendingCache); return; }
    dmGifResults.innerHTML = '<div class="dm-gif-loading">Loading…</div>';
    try {
      const res = await fetch('/api/giphy/trending');
      const data = await res.json();
      dmGifTrendingCache = data.gifs || [];
      dmPopulateGifResults(dmGifTrendingCache);
    } catch { dmGifResults.innerHTML = '<div class="dm-gif-loading">Could not load.</div>'; }
  }
  async function dmSearchGifs(q) {
    dmGifResults.innerHTML = '<div class="dm-gif-loading">Searching…</div>';
    try {
      const res = await fetch('/api/giphy/search?q=' + encodeURIComponent(q));
      const data = await res.json();
      dmPopulateGifResults(data.gifs || []);
    } catch { dmGifResults.innerHTML = '<div class="dm-gif-loading">Failed to load.</div>'; }
  }
  dmGifSearch.addEventListener('input', () => {
    clearTimeout(dmGifTimer);
    const q = dmGifSearch.value.trim();
    if (!q) { dmGifLabel.textContent = '✨ Trending'; dmGifTimer = setTimeout(dmLoadTrendingGifs, 150); return; }
    dmGifLabel.textContent = 'Results';
    dmGifTimer = setTimeout(() => dmSearchGifs(q), 350);
  });

  function dmPositionGifPicker() {
    const rect = dmGifBtn.getBoundingClientRect();
    const pw = 260;
    // Estimated rather than measured — the picker is display:none right up
    // until this runs, so offsetHeight would just read 0.
    const estHeight = 360;

    let left = rect.left;
    if (left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
    left = Math.max(10, left);
    dmGifPickerWrap.style.left = left + 'px';

    const spaceBelow = window.innerHeight - rect.bottom;
    if (spaceBelow < estHeight + 10 && rect.top > estHeight + 10) {
      // Not enough room below — open upward instead so it never runs off
      // the bottom of the screen.
      dmGifPickerWrap.style.top = 'auto';
      dmGifPickerWrap.style.bottom = (window.innerHeight - rect.top + 6) + 'px';
      dmGifPickerWrap.style.maxHeight = Math.min(estHeight, rect.top - 16) + 'px';
    } else {
      dmGifPickerWrap.style.bottom = 'auto';
      dmGifPickerWrap.style.top = (rect.bottom + 6) + 'px';
      dmGifPickerWrap.style.maxHeight = Math.min(estHeight, spaceBelow - 16) + 'px';
    }
  }
  dmGifBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (dmGifPickerWrap.hidden) {
      dmPositionGifPicker();
      dmGifPickerWrap.hidden = false;
      dmLoadTrendingGifs();
      setTimeout(() => dmGifSearch.focus(), 50);
    } else {
      dmGifPickerWrap.hidden = true;
    }
  });
  document.addEventListener('click', (e) => {
    if (!dmGifPickerWrap.hidden && !dmGifPickerWrap.contains(e.target) && e.target !== dmGifBtn) {
      dmGifPickerWrap.hidden = true;
    }
  });
  window.addEventListener('resize', () => { if (!dmGifPickerWrap.hidden) dmPositionGifPicker(); });

  function dmSetThreadHeader(user, name, isPriority) {
    document.getElementById('dm-thread-title').textContent = name;
    const avatarWrap = document.getElementById('dm-thread-avatar-wrap');
    avatarWrap.innerHTML = user ? dmAvatarHtml(user, 'dm-thread-avatar', 'dm-thread-avatar-fallback') : '';
    const userLink = document.getElementById('dm-thread-user-link');
    dmActiveOtherUser = user || null;
    // The BTW Team system account has no real profile page, and can't be
    // reported/blocked like a normal user — leave both inert there.
    const isSystemAccount = !user || !user.username || user.username === 'btwteam';
    if (!isSystemAccount) {
      userLink.href = window.fpUrl(`/${user.username}`);
    } else {
      userLink.removeAttribute('href');
    }
    document.getElementById('dm-thread-menu-wrap').hidden = isSystemAccount;
    document.getElementById('dm-thread-dismiss-btn').hidden = !isPriority;
  }

  // otherName/otherUser/isPriority are just hints for an instant paint before
  // the fetch resolves — the response's own thread.other_user is the source
  // of truth, so calling this with just a threadId (e.g. restoring straight
  // from a #inbox/<id> URL on refresh) still renders a correct header.
  async function openDmThread(threadId, otherName, otherUser, isPriority) {
    dmActiveThreadId = threadId;
    dmPendingTargetUser = null;
    if (otherName) dmSetThreadHeader(otherUser, otherName, isPriority);
    dmResetReplyBox();
    dmShowPanel('thread');
    location.hash = `inbox/${threadId}`;
    loadDmQuickList();
    const msgWrap = document.getElementById('dm-thread-messages');
    if (!otherName) msgWrap.innerHTML = '<p class="notif-empty">Loading…</p>';
    try {
      const res = await fetch(`/api/dm/${threadId}/messages`, { headers: authHeaders() });
      if (!res.ok) throw new Error();
      const data = await res.json();
      const msgs = data.messages || [];
      const resolvedName = data.thread.other_user
        ? (data.thread.other_user.display_name || data.thread.other_user.username)
        : (otherName || 'Unknown');
      dmSetThreadHeader(data.thread.other_user || otherUser, resolvedName, data.thread.is_priority);
      msgWrap.innerHTML = '';

      // Only the initiator of a still-pending thread sees this — the very
      // first message in the thread being "mine" is how we know that's me.
      if (data.thread.status === 'pending' && msgs.length && msgs[0].is_mine) {
        const banner = document.createElement('div');
        banner.className = 'dm-pending-banner';
        banner.innerHTML = `Your message has been sent to <strong>${escapeHtml(resolvedName)}</strong>'s Requests! After they accept, you'll see this log appear in your Chats!`;
        msgWrap.appendChild(banner);
      }

      dmLastRenderedDay = null;
      if (!msgs.length) {
        msgWrap.innerHTML = '<p class="notif-empty">No messages yet.</p>';
      } else {
        msgs.forEach(m => dmAppendMessage(msgWrap, m));
        dmScrollToBottom(msgWrap);
      }
      dmRefreshRequestBadge();
      loadDmQuickList();

      dmLastMessageId = msgs.length ? msgs[msgs.length - 1].id : 0;
      dmLastDeletionId = 0;
      dmOtherDisplayName = resolvedName;
      dmStartThreadPolling(threadId);
    } catch {
      msgWrap.innerHTML = '<p class="notif-empty">Couldn\'t load this chat right now.</p>';
    }
  }

  // Immediately opens a full chatroom view for someone picked from "New
  // Chat" — same header/typing box as a real thread, just no messages yet
  // and no thread_id until the first Send actually creates one.
  function startDmWithUser(user) {
    dmNewChatOverlay.hidden = true;
    dmActiveThreadId = null;
    dmPendingTargetUser = user;
    dmLastRenderedDay = null;
    const name = user.display_name || user.username;
    dmSetThreadHeader(user, name);
    dmResetReplyBox();
    dmShowPanel('thread');
    location.hash = 'inbox'; // no thread_id yet — first Send creates it and updates this
    document.getElementById('dm-thread-messages').innerHTML =
      `<p class="notif-empty">Say hello to ${escapeHtml(name)}!</p>`;
  }

  document.getElementById('dm-thread-back').addEventListener('click', () => {
    dmActiveThreadId = null;
    dmPendingTargetUser = null;
    dmShowPanel('chats');
    loadDmChats();
    loadDmQuickList();
    location.hash = 'inbox';
  });

  // Only ever shown for the High Priority thread — the sole way to scrap
  // a broadcast, since the list row itself deliberately has no trashcan.
  document.getElementById('dm-thread-dismiss-btn').addEventListener('click', async () => {
    if (!dmActiveThreadId) return;
    if (!confirm('Dismiss this message? It\'ll come back if another announcement is sent.')) return;
    await fetch(`/api/dm/${dmActiveThreadId}/dismiss`, { method: 'POST', headers: authHeaders() });
    dmActiveThreadId = null;
    dmShowPanel('chats');
    loadDmChats();
    loadDmQuickList();
    location.hash = 'inbox';
  });

  // Thread header "•••" — Report User (shared modal) / Block User (stops
  // either of you from messaging the other; see /api/blocks/:username).
  const dmThreadMenuBtn = document.getElementById('dm-thread-menu-btn');
  const dmThreadMenuDropdown = document.getElementById('dm-thread-menu-dropdown');
  dmThreadMenuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    dmThreadMenuDropdown.hidden = !dmThreadMenuDropdown.hidden;
  });
  document.addEventListener('click', () => { dmThreadMenuDropdown.hidden = true; });
  document.getElementById('dm-thread-menu-report').addEventListener('click', () => {
    dmThreadMenuDropdown.hidden = true;
    if (dmActiveOtherUser) reportContent('user', dmActiveOtherUser.id);
  });
  document.getElementById('dm-thread-menu-block').addEventListener('click', async () => {
    dmThreadMenuDropdown.hidden = true;
    if (!dmActiveOtherUser) return;
    const name = dmActiveOtherUser.display_name || dmActiveOtherUser.username;
    if (!confirm(`Block ${name}? They won't be able to message you, and you won't be able to message them, until you unblock them in Account Settings.`)) return;
    try {
      const res = await fetch(`/api/blocks/${dmActiveOtherUser.username}`, { method: 'POST', headers: authHeaders() });
      if (res.ok) {
        dmActiveThreadId = null;
        dmShowPanel('chats');
        loadDmChats();
        loadDmQuickList();
        location.hash = 'inbox';
      }
    } catch {}
  });

  document.getElementById('dm-reply-send').addEventListener('click', async () => {
    const input = document.getElementById('dm-reply-input');
    const body = input.value.trim();
    if (!body && !dmAttachCount()) return;
    const btn = document.getElementById('dm-reply-send');
    const msgEl = document.getElementById('dm-reply-msg');
    btn.disabled = true;
    msgEl.hidden = true;
    try {
      const formData = new FormData();
      formData.append('body', body);
      dmReplyFiles.forEach(f => formData.append('attachments', f));
      if (dmSelectedGifUrl) formData.append('gif_url', dmSelectedGifUrl);

      if (!dmActiveThreadId && dmPendingTargetUser) {
        formData.append('username', dmPendingTargetUser.username);
        const res = await fetch('/api/dm/start', { method: 'POST', headers: authHeaders(), body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        const targetUser = dmPendingTargetUser;
        await openDmThread(data.thread_id, targetUser.display_name || targetUser.username, targetUser);
      } else if (dmActiveThreadId) {
        const res = await fetch(`/api/dm/${dmActiveThreadId}/messages`, { method: 'POST', headers: authHeaders(), body: formData });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Something went wrong.');
        input.value = '';
        dmReplyFiles = [];
        dmSelectedGifUrl = null;
        dmRenderReplyPreviews();
        dmUpdateReplyCount();
        const msgWrap = document.getElementById('dm-thread-messages');
        dmAppendMessage(msgWrap, data.message);
        dmScrollToBottom(msgWrap);
        dmLastMessageId = data.message.id;
        document.getElementById('dm-typing-indicator').hidden = true;
        loadDmQuickList();
      }
    } catch (err) {
      msgEl.textContent = err.message || 'Something went wrong.';
      msgEl.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });
  document.getElementById('dm-reply-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      document.getElementById('dm-reply-send').click();
    }
  });

  // ── New Chat modal — just a picker now; picking someone opens the real
  // chatroom view above instead of composing inside the modal. ───────────
  const dmNewChatOverlay = document.getElementById('dm-new-chat-overlay');
  const dmNewChatResults = document.getElementById('dm-new-chat-results');
  const dmNewChatSearch = document.getElementById('dm-new-chat-search');

  function dmFollowingItem(u) {
    const div = document.createElement('div');
    div.className = 'dm-following-item';
    const name = u.display_name || u.username;
    div.innerHTML = `
      ${dmAvatarHtml(u, '', 'dm-following-item-fallback')}
      <span class="dm-following-item-name">${escapeHtml(name)}</span>
    `;
    div.addEventListener('click', () => startDmWithUser(u));
    return div;
  }

  async function dmLoadFollowing(q) {
    dmNewChatResults.innerHTML = '<p class="notif-empty">Loading…</p>';
    try {
      const res = await fetch(`/api/dm/following${q ? `?q=${encodeURIComponent(q)}` : ''}`, { headers: authHeaders() });
      const data = await res.json();
      const users = data.users || [];
      if (!users.length) {
        dmNewChatResults.innerHTML = q
          ? '<p class="notif-empty">No accounts found.</p>'
          : '<p class="notif-empty">Follow someone to see them here right away — or just start typing a username to find anyone.</p>';
      } else {
        dmNewChatResults.innerHTML = '';
        users.forEach(u => dmNewChatResults.appendChild(dmFollowingItem(u)));
      }
    } catch {
      dmNewChatResults.innerHTML = '<p class="notif-empty">Couldn\'t load results right now.</p>';
    }
  }

  let dmSearchDebounce = null;
  dmNewChatSearch.addEventListener('input', () => {
    clearTimeout(dmSearchDebounce);
    dmSearchDebounce = setTimeout(() => dmLoadFollowing(dmNewChatSearch.value.trim()), 250);
  });

  document.getElementById('dm-new-chat-btn').addEventListener('click', () => {
    dmNewChatSearch.value = '';
    dmNewChatOverlay.hidden = false;
    dmLoadFollowing('');
  });

  document.getElementById('dm-new-chat-cancel').addEventListener('click', () => { dmNewChatOverlay.hidden = true; });

  // ── Mobile-only Twitter-style Inbox chrome — the floating message button
  // opens .dm-sidebar (pfp/+New Chat/Chats-Requests) as a popover; any
  // interaction inside it (profile row, +New Chat, switching tabs) closes it
  // back down since that's always the end of that particular action.
  // No-ops on desktop -- .dm-mobile-fab/.dm-mobile-menu-backdrop are
  // display:none there, and dm-app never gets the --open class from a click
  // on a hidden button.
  const dmAppEl = document.getElementById('dm-app');
  const dmMobileFab = document.getElementById('dm-mobile-fab');
  const dmMobileMenuBackdrop = document.getElementById('dm-mobile-menu-backdrop');
  function closeDmMobileMenu() { dmAppEl.classList.remove('dm-mobile-menu-open'); }
  dmMobileFab.addEventListener('click', () => dmAppEl.classList.toggle('dm-mobile-menu-open'));
  dmMobileMenuBackdrop.addEventListener('click', closeDmMobileMenu);
  document.querySelector('.dm-sidebar').addEventListener('click', closeDmMobileMenu);

  // ── User block + lazy init on first Inbox-tab visit ──────────────────────
  function dmRenderUserBlock(u) {
    const block = document.getElementById('dm-user-block');
    const name = u.display_name || u.username;
    block.innerHTML = `
      ${dmAvatarHtml(u, '', 'dm-user-block-fallback')}
      <span class="dm-user-block-name">${escapeHtml(name)}</span>
    `;
  }

  let dmInitialized = false;
  async function initDmAppOnce() {
    if (dmInitialized) return;
    dmInitialized = true;
    if (!token) {
      dmChatsList.innerHTML = `<p class="notif-empty"><a href="${window.fpUrl(`/login?from=${encodeURIComponent(window.fpUrl('/notifications'))}`)}" style="color:#7fa8d9;">Log in</a> to chat with people you follow.</p>`;
      document.getElementById('dm-new-chat-btn').style.display = 'none';
      document.getElementById('dm-sidebar-quicklist').style.display = 'none';
      return;
    }
    try {
      const res = await fetch('/api/auth/me', { headers: authHeaders() });
      const data = await res.json();
      if (data && data.user) dmRenderUserBlock(data.user);
    } catch {}
    loadDmChats();
    loadDmQuickList();
    dmRefreshRequestBadge();
  }

  // ── Notification list ─────────────────────────────────────────────────────
  function notifItem(n) {
    const div = document.createElement('div');
    div.className = 'notif-item' + (n.is_read ? '' : ' notif-item--unread');
    const actorName = n.actor_display_name || n.actor_username || 'Between Two Worlds';
    const avatarInner = n.actor_avatar
      ? `<img src="${n.actor_avatar}" class="notif-avatar" alt="" />`
      : `<div class="notif-avatar--fallback">${escapeHtml(actorName.charAt(0).toUpperCase())}</div>`;
    // Only real actors (not system notifications) get a profile link --
    // clicking the pfp goes to their profile home; clicking anywhere else
    // on the card still fires the notification's own action link.
    const avatarHtml = n.actor_username
      ? `<a class="notif-avatar-link" href="${window.fpUrl(`/${encodeURIComponent(n.actor_username)}`)}">${avatarInner}</a>`
      : avatarInner;
    div.innerHTML = `
      ${avatarHtml}
      <div class="notif-item-body">
        <p class="notif-item-text"><strong>${escapeHtml(actorName)}</strong> ${escapeHtml(n.message)}</p>
        <p class="notif-item-time">${formatTime(n.created_at)}</p>
      </div>
    `;
    if (n.link) {
      div.dataset.link = n.link;
      div.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        window.location.href = window.fpUrl(n.link);
      });
    }
    return div;
  }

  (async () => {
    const list = document.getElementById('notif-list');
    if (!token) {
      list.innerHTML = `<p class="notif-empty"><a href="${window.fpUrl(`/login?from=${encodeURIComponent(window.fpUrl('/notifications'))}`)}" style="color:#7fa8d9;">Log in</a> to see your notifications.</p>`;
      return;
    }
    try {
      const res = await fetch('/api/notifications', { headers: authHeaders() });
      const data = await res.json();
      const notifs = data.notifications || [];

      if (!notifs.length) {
        list.innerHTML = '<p class="notif-empty">No notifications yet.</p>';
      } else {
        list.innerHTML = '';
        notifs.forEach(n => list.appendChild(notifItem(n)));
      }

      fetch('/api/notifications/mark-read', { method: 'POST', headers: authHeaders() }).catch(() => {});
    } catch {
      list.innerHTML = '<p class="notif-empty">Couldn\'t load your notifications right now.</p>';
    }
  })();

  // Refreshing the page (or following a link with #inbox) should land back
  // on whichever tab — and whichever open chatroom — was showing, not always
  // reset to Notifications. Runs last so everything switchNotifTab/
  // initDmAppOnce/openDmThread touch is already defined.
  function applyHashTab() {
    const notifThreadHashMatch = location.hash.match(/^#inbox\/(\d+)$/);
    const notifNewDmHashMatch = location.hash.match(/^#inbox\/new\/([^/]+)$/);
    if (notifThreadHashMatch) {
      switchNotifTab('inbox', false);
      if (token) openDmThread(parseInt(notifThreadHashMatch[1], 10));
    } else if (notifNewDmHashMatch) {
      // Deep link from a profile page's message icon (or the homepage
      // Feedback button, pointed at VeekitPaws) -- straight into the
      // composer for that person, same as picking them from "+ New Chat".
      switchNotifTab('inbox', false);
      if (token) {
        const targetUsername = decodeURIComponent(notifNewDmHashMatch[1]);
        fetch(`/api/fanpage-profile/${targetUsername}`, { headers: authHeaders() })
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (data && data.author) startDmWithUser(data.author);
          })
          .catch(() => {});
      }
    } else {
      switchNotifTab(location.hash === '#inbox' ? 'inbox' : 'notifications', false);
    }
  }
  applyHashTab();
  // The profile dropdown's "Inbox" link is just an #inbox hash change when
  // you're already sitting on this page — that fires 'hashchange', not a
  // real navigation, so without this the tab would silently stay wherever
  // it was instead of jumping to Inbox.
  window.addEventListener('hashchange', applyHashTab);

  // The Inbox tab badge should show up immediately, even before that tab's
  // ever been clicked (mirrors the bell in the topbar).
  if (token) dmRefreshRequestBadge();
</script>

</body>
</html>
