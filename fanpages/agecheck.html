<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="darkreader-lock" />
  <title>Age Verification ✦ Between Two Worlds</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #0a0e16;
      font-family: 'Inter', 'Lato', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }

    .age-card {
      width: 100%; max-width: 480px;
      background: #12182a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.6);
    }
    .age-card-header {
      padding: 1.4rem 1.6rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .age-card-title { margin: 0; font-size: 1.3rem; font-weight: 700; color: #f0f0f0; }

    .age-card-body { padding: 1.6rem; }
    .age-card-body p {
      margin: 0; font-size: 0.95rem; line-height: 1.65; color: rgba(230,230,235,0.85);
    }
    .age-card-body a { color: #7fa8d9; text-decoration: underline; }
    .age-card-body a:hover { color: #93b8e2; }

    .age-checkbox-row {
      display: flex; align-items: flex-start; gap: 0.65rem;
      margin-top: 1.4rem; cursor: pointer; user-select: none;
    }
    .age-checkbox-row input {
      width: 18px; height: 18px; margin: 0.1rem 0 0; accent-color: #7fa8d9; cursor: pointer; flex-shrink: 0;
    }
    .age-checkbox-row span { font-size: 0.92rem; color: #e6e6eb; }

    .age-card-footer {
      display: flex; justify-content: flex-end;
      padding: 1.1rem 1.6rem; background: rgba(255,255,255,0.02);
      border-top: 1px solid rgba(255,255,255,0.08);
    }
    .age-accept-btn {
      padding: 0.7rem 1.8rem; border: none; border-radius: 8px;
      font-family: inherit; font-size: 0.95rem; font-weight: 700;
      background: rgba(127,168,217,0.15); color: rgba(255,255,255,0.35);
      cursor: not-allowed; transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }
    .age-accept-btn.is-active {
      background: #7fa8d9; color: #0a0a0a; cursor: pointer;
      box-shadow: 0 0 22px rgba(127,168,217,0.55);
    }
    .age-accept-btn.is-active:hover { background: #93b8e2; }
  </style>
</head>
<body>

<div class="age-card">
  <div class="age-card-header">
    <h1 class="age-card-title">BTW Team</h1>
  </div>
  <div class="age-card-body">
    <p>
      This website is intended only for users who are at least 18 years of age.
      By accessing this website, you must agree with our TOS, found
      <a href="/tos" id="age-tos-link">here</a>.
    </p>
    <label class="age-checkbox-row">
      <input type="checkbox" id="age-proceed-check" />
      <span>I wish to proceed.</span>
    </label>
  </div>
  <div class="age-card-footer">
    <button type="button" class="age-accept-btn" id="age-accept-btn" disabled>Accept</button>
  </div>
</div>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const from = params.get('from') || window.fpUrl('/');
  document.getElementById('age-tos-link').href = window.fpUrl('/tos');

  const checkbox = document.getElementById('age-proceed-check');
  const acceptBtn = document.getElementById('age-accept-btn');

  checkbox.addEventListener('change', () => {
    acceptBtn.disabled = !checkbox.checked;
    acceptBtn.classList.toggle('is-active', checkbox.checked);
  });

  acceptBtn.addEventListener('click', () => {
    if (!checkbox.checked) return;
    localStorage.setItem('btw_age_confirmed', '1');
    window.location.replace(from);
  });
</script>

</body>
</html>
