<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/vendor/cropper.min.css" />
  <style>
    /* No body background override here on purpose — style.css sets
       body { background: transparent } specifically so the fixed
       .page-bg image shows through underneath. */

    /* ── Sidebar (same as fanpages/social.html — kept present on every
       club page too, with a shared collapse-state localStorage key so it
       stays collapsed/expanded consistently as you move between pages). ── */
    .soc-layout { position: relative; z-index: 1; }
    .soc-sidebar {
      position: fixed; top: 64px; left: 0; bottom: 0; width: 250px; z-index: 5;
      display: flex; flex-direction: column; overflow-y: auto;
      padding: 1.1rem 1.25rem; box-sizing: border-box;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
      border-right: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 4px 0 30px rgba(0,0,0,0.35);
      transition: width 0.2s ease;
    }
    .soc-sidebar-toggle {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; align-self: flex-end; margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
      color: #ccc; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .soc-sidebar-toggle:hover { background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04)); color: #fff; }
    .soc-layout.soc-collapsed .soc-sidebar { width: 56px; padding-left: 0.6rem; padding-right: 0.6rem; }
    .soc-layout.soc-collapsed .soc-sidebar-content { display: none; }
    .soc-layout.soc-collapsed #cl-page, .soc-layout.soc-collapsed #cl-notfound { margin-left: 56px; }
    .soc-sidebar-user {
      display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: inherit;
      padding: 0.4rem 0.4rem 0.9rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .soc-sidebar-avatar, .soc-sidebar-avatar-fallback { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .soc-sidebar-avatar-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.25rem; }
    .soc-sidebar-username { font-weight: 700; font-size: 1.1rem; color: #f0f0f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .soc-sidebar-login { font-size: 1rem; color: #7fa8d9; text-decoration: none; display: block; padding: 0.4rem 0.4rem 0.9rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .soc-sidebar-nav {
      display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
      gap: 0.2rem; position: static; height: auto; padding: 0; background: none; border: none; backdrop-filter: none;
    }
    .soc-nav-link {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.5rem; border-radius: 8px;
      color: #ccc; text-decoration: none; font-size: 1.05rem; font-weight: 600; transition: background 0.15s, color 0.15s;
    }
    .soc-nav-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .soc-nav-link.active { color: #f0c060; background: rgba(240,192,96,0.1); }
    .soc-nav-icon { width: 1.3em; text-align: center; font-size: 1.1rem; }
    .soc-nav-create-btn {
      display: flex; align-items: center; gap: 0.5rem; width: 100%; margin-top: 0.4rem;
      background: linear-gradient(135deg, #3d3a52, #5a4f78); border: none; color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif; font-weight: 600; text-decoration: none; box-sizing: border-box;
      font-size: 1.05rem; padding: 0.65rem 0.75rem; border-radius: 20px; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .soc-nav-create-btn:hover {
      transform: translateY(-1px); background: linear-gradient(135deg, #47435f, #665887);
      box-shadow: 0 3px 9px rgba(0,0,0,0.3);
    }
    .soc-sidebar-rule { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.9rem 0; }
    .soc-sidebar-label { font-size: 0.88rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #999; padding: 0 0.5rem; margin-bottom: 0.5rem; }
    .soc-sidebar-clubs { display: flex; flex-direction: column; gap: 0.15rem; }
    .soc-sidebar-club-link {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.5rem; border-radius: 8px;
      color: #ddd; text-decoration: none; font-size: 1rem; transition: background 0.15s;
    }
    .soc-sidebar-club-link:hover { background: rgba(255,255,255,0.06); }
    .soc-sidebar-club-icon, .soc-sidebar-club-icon-fallback { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .soc-sidebar-club-icon-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 0.82rem; }
    .soc-sidebar-club-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .soc-sidebar-empty, .soc-sidebar-note { font-size: 0.9rem; color: #888; padding: 0.4rem 0.5rem; line-height: 1.5; }

    #cl-page, #cl-notfound { margin-left: 250px; transition: margin-left 0.2s ease; }

    @media (max-width: 860px) {
      .soc-sidebar { position: static; width: auto; height: auto; border-right: none; }
      #cl-page, #cl-notfound { margin-left: 0; }
      .soc-layout.soc-collapsed #cl-page, .soc-layout.soc-collapsed #cl-notfound { margin-left: 0; }
    }

    /* ── Banner + pfp (the only header content left for now) ── */
    .cl-banner-wrap { position: relative; width: 100%; height: 280px; background: #161616; overflow: hidden; }
    .cl-banner-img-slot { position: absolute; inset: 0; }
    .cl-banner-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Softens the banner's bottom edge into the page instead of cutting off
       sharply. */
    .cl-banner-wrap::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 140px; z-index: 1;
      background: linear-gradient(to bottom, rgba(13,13,13,0), rgba(13,13,13,0.92));
      pointer-events: none;
    }
    .cl-banner-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #2a1a3a, #3a1f2a); color: rgba(255,255,255,0.2); font-size: 3rem;
    }
    .cl-banner-edit-btn {
      position: absolute; top: 1.1rem; right: 1.1rem; z-index: 3;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); color: #fff;
      border-radius: 24px; padding: 0.7em 1.5em; font-size: 0.98rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.15s, transform 0.15s;
    }
    .cl-banner-edit-btn:hover { background: rgba(0,0,0,0.85); transform: translateY(-1px); }

    /* .cl-body-row lays out the main column and the right sidebar as actual
       flex siblings — the sidebar's horizontal position (far right) comes
       from being LAST in a flex row, not from position:fixed, which is
       what lets it also be position:sticky vertically (fixed and sticky
       can't be combined on the same element). .cl-content-wrap is the
       flexible column; .cl-header/.cl-row center themselves within IT via
       their own "margin: 0 auto", same as before — they keep a fixed size
       and just shift as the sidebar's column width changes. */
    .cl-body-row { display: flex; align-items: flex-start; }
    .cl-content-wrap { flex: 1; min-width: 0; }

    .cl-header { max-width: 1200px; margin: -70px auto 0; padding: 0 2rem; position: relative; z-index: 2; }
    /* Pfp no longer has the dark ring around it, per request. */
    .cl-icon-wrap { width: 108px; height: 108px; border-radius: 50%; flex-shrink: 0; overflow: hidden; background: #222; }
    .cl-icon-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cl-icon-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6b3fa0, #c2547a); }

    @media (max-width: 860px) { .cl-header { margin-top: -50px; } .cl-banner-wrap { height: 180px; } .cl-icon-wrap { width: 84px; height: 84px; } }

    .cl-row { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem 5rem; position: relative; }

    /* Big banner-like slot, above everything else — will eventually cycle
       through several images as a slideshow, so it's sized generously up
       front rather than as an afterthought. Defaults to the shared
       "Image Not Available" placeholder, just center-cropped into this
       wider shape instead of shown at its native size. */
    .cl-slideshow-wrap {
      width: 100%; aspect-ratio: 5 / 2; border-radius: 16px; overflow: hidden;
      background: #161616; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 2.5rem;
    }
    .cl-slideshow-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Name sits above the row entirely; the picture (left, square) and the
       glass-card About box (right) are confined to the main column so
       neither ever reaches under the fixed sidebar. */
    .cl-name {
      font-family: 'Cinzel', Georgia, serif; font-size: 2.6rem; font-weight: 700; color: #fff;
      margin: 0 0 1.5rem; text-align: center; position: relative; padding-bottom: 1.1rem;
    }
    .cl-name::after {
      content: ''; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 100px; height: 3px; border-radius: 2px;
      background: linear-gradient(90deg, transparent, #7fa8d9, transparent);
      box-shadow: 0 0 12px rgba(127,168,217,0.75);
    }

    /* Fancy title instead of a boxed label — Cinzel serif, a touch bigger,
       with a short gradient underline flourish instead of a full-width
       rule. */
    .cl-about-label {
      font-family: 'Cinzel', Georgia, serif; font-size: 1.4rem; font-weight: 700; letter-spacing: 0.03em;
      color: #7fa8d9; text-shadow: 0 0 16px rgba(127,168,217,0.6);
      margin: 0 0 0.85rem; display: inline-block; position: relative; padding-bottom: 0.5rem;
    }
    .cl-about-label::after {
      content: ''; position: absolute; left: 0; bottom: 0; width: 64px; height: 2px;
      background: linear-gradient(90deg, #7fa8d9, transparent);
    }
    .cl-about-body { color: #bbb; font-size: 0.96rem; line-height: 1.8; margin: 0; }

    /* ── Split row: Welcome To + Featured Cards stacked on the left,
       Posts By Admin Team as its own glass-card box on the right — sized
       to match the left column's combined height via align-items:stretch,
       same idea as .cl-side. ── */
    .cl-split-row { display: flex; gap: 2rem; align-items: stretch; margin-top: 2rem; }
    .cl-split-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }

    /* ── Featured Cards (was "Meet the Admins") — freeform spotlight cards,
       not tied to any user account or role, editable title. Stacked one
       per row (not a multi-column grid) and given a stronger visual
       treatment — a left accent bar + glow, bigger picture — so each one
       reads as its own standalone thing instead of blending into a list. */
    .cl-admins-section { margin-top: 2.5rem; }
    .cl-admins-title {
      font-family: 'Cinzel', Georgia, serif; font-size: 1.4rem; font-weight: 700; letter-spacing: 0.03em;
      color: #7fa8d9; text-shadow: 0 0 16px rgba(127,168,217,0.6);
      margin: 0 0 1.1rem; display: inline-block; position: relative; padding-bottom: 0.5rem;
    }
    .cl-admins-title::after {
      content: ''; position: absolute; left: 0; bottom: 0; width: 64px; height: 2px;
      background: linear-gradient(90deg, #7fa8d9, transparent);
    }
    .cl-admins-empty { color: #888; font-size: 0.9rem; padding: 0.5rem 0; margin: 0; }
    .cl-admins-grid { display: flex; flex-direction: column; gap: 1.1rem; }
    .cl-admin-card {
      display: flex; gap: 1.5rem; padding: 1.5rem 1.75rem; box-sizing: border-box;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.12); border-left: 3px solid #7fa8d9; border-radius: 16px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.35);
    }
    .cl-admin-card-pic {
      width: 130px; height: 130px; flex-shrink: 0; border-radius: 14px; overflow: hidden;
      background: #161616; border: 1px solid rgba(255,255,255,0.1);
    }
    .cl-admin-card-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cl-admin-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .cl-admin-card-name { font-weight: 700; color: #f0f0f0; font-size: 1.3rem; margin: 0 0 0.5rem; }
    .cl-admin-card-desc { font-size: 1rem; color: #bbb; line-height: 1.65; margin: 0; }

    /* ── Posts By Admin Team — glass-card box (same recipe as .cl-side),
       Reddit-style rows inside instead of one long full-width column. ── */
    .cl-admin-posts {
      width: 300px; flex-shrink: 0; box-sizing: border-box; padding: 1.5rem;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      overflow-y: auto;
    }
    .cl-admin-posts-title {
      font-family: 'Cinzel', Georgia, serif; font-size: 1.3rem; font-weight: 700; letter-spacing: 0.03em;
      color: #7fa8d9; text-shadow: 0 0 16px rgba(127,168,217,0.6);
      margin: 0 0 1.1rem; display: inline-block; position: relative; padding-bottom: 0.5rem;
    }
    .cl-admin-posts-title::after {
      content: ''; position: absolute; left: 0; bottom: 0; width: 64px; height: 2px;
      background: linear-gradient(90deg, #7fa8d9, transparent);
    }
    .cl-admin-posts-empty { color: #888; font-size: 0.9rem; padding: 0.5rem 0; margin: 0; }
    .cl-admin-posts-list { display: flex; flex-direction: column; }
    .cl-admin-post { display: flex; gap: 0.9rem; padding: 1.1rem 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .cl-admin-post:first-child { padding-top: 0; }
    .cl-admin-post:last-child { border-bottom: none; padding-bottom: 0; }
    .cl-admin-post-avatar, .cl-admin-post-avatar-fallback { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .cl-admin-post-avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700;
    }
    .cl-admin-post-body { flex: 1; min-width: 0; }
    .cl-admin-post-meta { display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: #999; margin: 0 0 0.35rem; flex-wrap: wrap; }
    .cl-admin-post-author { font-weight: 700; color: #ddd; }
    .cl-admin-post-title { font-size: 1rem; font-weight: 700; color: #f0f0f0; margin: 0 0 0.3rem; }
    .cl-admin-post-preview {
      font-size: 0.88rem; color: #bbb; line-height: 1.6; margin: 0;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    }

    @media (max-width: 900px) {
      .cl-split-row { flex-direction: column; }
      .cl-admin-posts { width: auto; }
    }

    /* Starts just below the banner (a small gap, not touching it) since
       it's a normal flex sibling now, not fixed to the viewport. As you
       scroll past that starting point, position:sticky takes over and it
       glues to top:64px — right under the fixed topbar — instead of
       drifting further down the page like plain static content would. */
    /* height (not max-height) — stretches the box to fill nearly the full
       viewport by default regardless of how little content is in it, so
       its own "floor" sits near the bottom of the screen and stays there
       (sticky) instead of just being as tall as its (currently sparse)
       content. */
    .cl-side {
      flex-shrink: 0; width: 300px; margin: 12px 20px 0 16px;
      position: sticky; top: 64px; height: calc(100vh - 84px); z-index: 5;
      overflow-y: auto; padding: 1.25rem; box-sizing: border-box;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .cl-info-title {
      font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 1.2rem; color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cl-info-rule { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 0.9rem 0; }
    .cl-info-body { color: #999; font-size: 0.88rem; }

    @media (max-width: 1100px) {
      .cl-body-row { flex-direction: column; }
      .cl-side { position: static; width: auto; height: auto; margin: 2rem 1.25rem 0; }
    }
    @media (max-width: 860px) {
      .cl-row { padding: 2rem 1.25rem 3rem; }
    }

    .cl-gate { max-width: 500px; margin: 8rem auto; text-align: center; color: #999; padding: 0 1.5rem; }

    /* ── Edit Club modal ── */
    /* Wider than the base .char-editor-modal — this one has a Pages nav
       column sitting alongside the actual editing area, not just a single
       stacked form. */
    .cl-edit-modal { max-width: 980px; }
    .cl-edit-layout { display: flex; align-items: stretch; }
    .cl-edit-main { flex: 1; min-width: 0; }
    .cl-edit-section-title {
      font-family: 'Cinzel', Georgia, serif; font-size: 1.05rem; font-weight: 700; color: #f0f0f0;
      margin: 0 0 1.1rem; padding-bottom: 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .cl-edit-divider { width: 1px; background: rgba(255,255,255,0.12); flex-shrink: 0; margin: 0 1.75rem; }
    .cl-edit-pages-col { width: 180px; flex-shrink: 0; display: flex; flex-direction: column; }
    .cl-edit-pages-title {
      font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: #888; margin: 0 0 0.85rem;
    }
    .cl-edit-pages-create-btn {
      width: 100%; box-sizing: border-box; padding: 0.55em 0.7em; border-radius: 8px; cursor: pointer;
      background: transparent; border: 1px dashed rgba(255,255,255,0.25); color: #aaa;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
      transition: border-color 0.15s, color 0.15s;
    }
    .cl-edit-pages-create-btn:hover:not(:disabled) { border-color: rgba(240,192,96,0.5); color: #f0c060; }
    .cl-edit-pages-create-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .cl-edit-pages-rule { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 1rem 0; }
    .cl-edit-pages-list { display: flex; flex-direction: column; gap: 0.2rem; }
    .cl-edit-pages-item {
      text-align: left; padding: 0.55em 0.7em; border-radius: 8px; border: none;
      background: transparent; color: #ccc; font-size: 0.92rem; font-family: inherit; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .cl-edit-pages-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .cl-edit-pages-item.active { background: rgba(240,192,96,0.12); color: #f0c060; font-weight: 700; }
    @media (max-width: 700px) {
      .cl-edit-layout { flex-direction: column; }
      .cl-edit-divider { display: none; }
      .cl-edit-pages-col { width: auto; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); }
    }

    /* Same box/hover/overlay recipe as .char-editor-ref-wrap, just wide
       (matching the banner's own on-page proportions) instead of square. */
    .cl-edit-banner-wrap {
      position: relative; width: 100%; max-width: none; aspect-ratio: 1600 / 280; margin: 0 auto 1.75rem;
      border-radius: 14px; overflow: hidden; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .cl-edit-banner-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
    .cl-edit-banner-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45); color: #fff; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
      opacity: 0; transition: opacity 0.2s;
    }
    .cl-edit-banner-wrap:hover .cl-edit-banner-overlay { opacity: 1; }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>
<script src="/fanpages/vendor/cropper.min.js"></script>
<script src="/fanpages/crop-modal.js"></script>

<div class="page-bg">
  <img id="cl-page-bg-img" alt="" style="display:none;" />
  <div class="page-bg-overlay" id="cl-page-bg-overlay" style="display:none;"></div>
</div>

<div class="soc-layout" id="soc-layout">

  <aside class="soc-sidebar">
    <button class="soc-sidebar-toggle" id="soc-sidebar-toggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">☰</button>

    <div class="soc-sidebar-content" id="soc-sidebar-content">
      <div id="soc-sidebar-user-slot"></div>

      <nav class="soc-sidebar-nav">
        <a class="soc-nav-link" href="/fanpages/social"><span class="soc-nav-icon">🏠</span> Home</a>
        <a class="soc-nav-link" href="/fanpages/social#soc-feed-section"><span class="soc-nav-icon">🕓</span> Recent</a>
        <a class="soc-nav-link" href="/fanpages/social#soc-discover-section"><span class="soc-nav-icon">🧭</span> Explore</a>
        <a class="soc-nav-create-btn" href="/fanpages/social"><span>+</span> Start a Club</a>
      </nav>

      <hr class="soc-sidebar-rule" />
      <p class="soc-sidebar-label">Clubs</p>
      <hr class="soc-sidebar-rule" />
      <div class="soc-sidebar-clubs" id="soc-sidebar-clubs"><p class="soc-sidebar-empty">Loading…</p></div>
    </div>
  </aside>

<div id="cl-notfound" class="cl-gate" style="display:none;">
  <p>This club doesn't exist (or was deleted).</p>
  <a class="btn btn-green" href="/fanpages/social" style="margin-top:1rem; display:inline-block;">&larr; Back to Social</a>
</div>

<div id="cl-page" style="display:none;">

  <div class="cl-banner-wrap" id="cl-banner-wrap">
    <div class="cl-banner-img-slot" id="cl-banner-img-slot"></div>
    <button class="cl-banner-edit-btn" id="cl-edit-club-btn" type="button" style="display:none;">✎ Edit Club</button>
  </div>

  <div class="cl-body-row">
    <div class="cl-content-wrap">
      <div class="cl-header">
        <div class="cl-icon-wrap" id="cl-icon-wrap"></div>
      </div>

      <div class="cl-row">
        <!-- Slideshow slot — not editable/cycling yet, just the layout (a
             single "Image Not Available" placeholder for now). -->
        <div class="cl-slideshow-wrap">
          <img id="cl-slideshow-img" src="/images/nopicture2.png" alt="" />
        </div>

        <h1 class="cl-name" id="cl-name"></h1>

        <div class="cl-split-row">
          <div class="cl-split-left">
            <div class="cl-about-wrap">
              <p class="cl-about-label" id="cl-about-label"></p>
              <p class="cl-about-body" id="cl-about-body"></p>
            </div>

            <div class="cl-admins-section">
              <p class="cl-admins-title" id="cl-admins-title">Featured Cards</p>
              <div class="cl-admins-grid" id="cl-admins-grid">
                <p class="cl-admins-empty">Loading…</p>
              </div>
            </div>
          </div>

          <!-- Same glass-card recipe as .cl-side, sized to match the left
               column's combined height via align-items:stretch on the row. -->
          <aside class="cl-admin-posts">
            <p class="cl-admin-posts-title">Posts By Admin Team</p>
            <div class="cl-admin-posts-list" id="cl-admin-posts-list">
              <p class="cl-admin-posts-empty">Loading…</p>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <aside class="cl-side">
      <p class="cl-info-title" id="cl-info-title"></p>
      <hr class="cl-info-rule" />
      <div class="cl-info-body" id="cl-info-body"></div>
    </aside>
  </div>
</div>

</div> <!-- /.soc-layout -->

<!-- Edit Club modal — owners/admins only. Starts with just the banner
     image; more fields land here as the club template grows. -->
<div class="char-editor-overlay" id="cl-edit-overlay" hidden>
  <div class="char-editor-modal cl-edit-modal">
    <h2 class="char-editor-title">Edit Club</h2>

    <div class="cl-edit-layout">
      <div class="cl-edit-main">
        <h3 class="cl-edit-section-title">Banner Image</h3>

        <div class="mod-field">
          <div class="cl-edit-banner-wrap" id="cl-edit-banner-wrap">
            <img id="cl-edit-banner-preview" alt="" />
            <div class="cl-edit-banner-overlay">📷 Change Banner Image</div>
            <button type="button" class="fp-recrop-btn" id="cl-edit-banner-recrop-btn" style="position:absolute; bottom:8px; right:8px; z-index:3;">✏️ Recrop</button>
          </div>
          <input type="file" id="cl-edit-banner-file-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />
        </div>

        <p class="mod-panel-msg" id="cl-edit-msg"></p>
        <div class="char-editor-actions">
          <button class="mod-btn mod-btn--cancel" id="cl-edit-cancel" type="button">Cancel</button>
          <button class="mod-btn" id="cl-edit-save" type="button">Save</button>
        </div>
      </div>

      <div class="cl-edit-divider"></div>

      <!-- Every club gets a "Home" page (this one) for free — more pages are
           a later stage, so Create Page is just a placeholder for now. -->
      <div class="cl-edit-pages-col">
        <p class="cl-edit-pages-title">Pages</p>
        <button class="cl-edit-pages-create-btn" type="button" disabled title="Coming soon!">+ Create Page</button>
        <hr class="cl-edit-pages-rule" />
        <div class="cl-edit-pages-list">
          <button class="cl-edit-pages-item active" type="button">Home</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
const slug = new URLSearchParams(location.search).get('slug');

let currentUser = null;
try {
  const raw = localStorage.getItem('btw_user') || sessionStorage.getItem('btw_user');
  if (raw) currentUser = JSON.parse(raw);
} catch {}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Sidebar (identical to fanpages/social.html) ──────────────────────────
const sidebarUserSlot = document.getElementById('soc-sidebar-user-slot');
if (token && currentUser) {
  const sidebarAvatarHtml = currentUser.avatar
    ? `<img class="soc-sidebar-avatar" src="${currentUser.avatar}" alt="" />`
    : `<span class="soc-sidebar-avatar-fallback">${escapeHtml((currentUser.display_name || currentUser.username || '?').charAt(0).toUpperCase())}</span>`;
  sidebarUserSlot.innerHTML = `
    <a class="soc-sidebar-user" href="/fanpages/${encodeURIComponent(currentUser.username)}">
      ${sidebarAvatarHtml}
      <span class="soc-sidebar-username">${escapeHtml(currentUser.display_name || currentUser.username)}</span>
    </a>
  `;
} else {
  sidebarUserSlot.innerHTML = `<a class="soc-sidebar-login" href="/fanpages/login?from=${encodeURIComponent(location.pathname + location.search)}">Log In / Register</a>`;
}

function clubIconHtml(c, sizeClass) {
  if (c.icon_url) return `<img class="${sizeClass}" src="${c.icon_url}" alt="" />`;
  const letter = escapeHtml((c.name || '?').charAt(0).toUpperCase());
  return `<span class="${sizeClass}-fallback">${letter}</span>`;
}

async function loadSidebarClubs() {
  const wrap = document.getElementById('soc-sidebar-clubs');
  if (!token) {
    wrap.innerHTML = '<p class="soc-sidebar-note">Log in to see your clubs~</p>';
    return;
  }
  try {
    const res = await fetch(`${API}/clubs?mine=1&limit=50`, { headers: authHeaders() });
    const data = await res.json();
    const clubs = data.clubs || [];
    if (!clubs.length) {
      wrap.innerHTML = '<p class="soc-sidebar-note">You haven\'t joined any clubs yet.</p>';
      return;
    }
    wrap.innerHTML = '';
    clubs.forEach(c => {
      const a = document.createElement('a');
      a.className = 'soc-sidebar-club-link';
      a.href = `/fanpages/club?slug=${encodeURIComponent(c.slug)}`;
      a.innerHTML = `${clubIconHtml(c, 'soc-sidebar-club-icon')}<span class="soc-sidebar-club-name">${escapeHtml(c.name)}</span>`;
      wrap.appendChild(a);
    });
  } catch {
    wrap.innerHTML = '<p class="soc-sidebar-note">Couldn\'t load your clubs.</p>';
  }
}
loadSidebarClubs();

// Same localStorage key as social.html, so collapse state stays in sync
// as you move between the Social hub and any club page.
const socLayout = document.getElementById('soc-layout');
const sidebarToggleBtn = document.getElementById('soc-sidebar-toggle');
function setSidebarCollapsed(collapsed) {
  socLayout.classList.toggle('soc-collapsed', collapsed);
  const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
  sidebarToggleBtn.title = label;
  sidebarToggleBtn.setAttribute('aria-label', label);
  localStorage.setItem('soc_sidebar_collapsed', collapsed ? '1' : '0');
}
sidebarToggleBtn.addEventListener('click', () => setSidebarCollapsed(!socLayout.classList.contains('soc-collapsed')));
if (localStorage.getItem('soc_sidebar_collapsed') === '1') setSidebarCollapsed(true);

// ── Club — banner, pfp, and the (currently empty) info panel only ───────
async function loadClub() {
  try {
    const res = await fetch(`${API}/clubs/${encodeURIComponent(slug)}`, { headers: authHeaders() });
    if (!res.ok) { document.getElementById('cl-notfound').style.display = 'block'; return; }
    const data = await res.json();
    renderClub(data.club);
    document.getElementById('cl-page').style.display = 'block';
    loadAdminCards();
    loadAdminPosts();
  } catch {
    document.getElementById('cl-notfound').style.display = 'block';
  }
}

let currentClub = null;

function renderClub(club) {
  currentClub = club;
  document.title = `${club.name} ✦ Social ✦ Fanpages`;

  document.getElementById('cl-banner-img-slot').innerHTML = club.banner_url
    ? `<img src="${club.banner_url}" alt="" style="object-position:${club.banner_position_x}% ${club.banner_position_y}%;" />`
    : `<div class="cl-banner-fallback"></div>`;

  document.getElementById('cl-icon-wrap').innerHTML = club.icon_url
    ? `<img src="${club.icon_url}" alt="" />`
    : `<span class="cl-icon-fallback">${escapeHtml(club.name.charAt(0).toUpperCase())}</span>`;

  document.getElementById('cl-info-title').textContent = club.name;

  document.getElementById('cl-name').textContent = club.name;
  document.getElementById('cl-about-label').textContent = `Welcome To: ${club.name}`;
  document.getElementById('cl-about-body').textContent = club.description || 'This club hasn\'t written anything here yet.';

  const isAdminOrOwner = club.viewer_role === 'owner' || club.viewer_role === 'admin';
  document.getElementById('cl-edit-club-btn').style.display = isAdminOrOwner ? 'block' : 'none';

  applyClubTheme(club.theme, club.theme_bg_url);
}

// ── Featured Cards (was "Meet the Admins") — freeform spotlight cards, not
// tied to any user account or role. A club can feature its admins, its
// cast of characters, whatever matters to it — the title is editable per
// club (defaults to "Featured Cards"). No editor UI yet — sizing/layout
// first, matching how the rest of this template has been staged. ─────────
async function loadAdminCards() {
  const grid = document.getElementById('cl-admins-grid');
  try {
    const res = await fetch(`${API}/clubs/${encodeURIComponent(slug)}/featured-cards`);
    const data = await res.json();
    document.getElementById('cl-admins-title').textContent = data.title || 'Featured Cards';
    const cards = data.cards || [];
    if (!cards.length) {
      grid.innerHTML = '<p class="cl-admins-empty">No featured cards yet.</p>';
      return;
    }
    grid.innerHTML = '';
    cards.forEach(c => grid.appendChild(adminCard(c)));
  } catch {
    grid.innerHTML = '<p class="cl-admins-empty">Couldn\'t load featured cards right now.</p>';
  }
}

function adminCard(c) {
  const card = document.createElement('div');
  card.className = 'cl-admin-card';
  card.innerHTML = `
    <div class="cl-admin-card-pic"><img src="${c.image_url || '/images/defaultchar.jpg'}" alt="" /></div>
    <div class="cl-admin-card-body">
      <p class="cl-admin-card-name">${escapeHtml(c.name)}</p>
      <p class="cl-admin-card-desc">${escapeHtml(c.description || 'No description yet.')}</p>
    </div>
  `;
  return card;
}

// ── Posts By Admin Team — full-width Reddit-style rows. This is a per-post
// choice made at creation time (is_admin_post), NOT every post an admin
// happens to write — admins can still post to the general feed, so this
// pulls ?section=admin from the server rather than filtering by author
// role client-side. ────────────────────────────────────────────────────
function timeAgo(dateStr) {
  const sec = Math.floor((Date.now() - new Date(dateStr).getTime()) / 1000);
  const units = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
  for (const [name, secs] of units) {
    const val = Math.floor(sec / secs);
    if (val >= 1) return `${val} ${name}${val > 1 ? 's' : ''} ago`;
  }
  return 'just now';
}

async function loadAdminPosts() {
  const list = document.getElementById('cl-admin-posts-list');
  try {
    const res = await fetch(`${API}/clubs/${encodeURIComponent(slug)}/posts?section=admin`);
    const data = await res.json();
    const posts = data.posts || [];
    if (!posts.length) {
      list.innerHTML = '<p class="cl-admin-posts-empty">No posts from the admin team yet — updates, polls, and club news will show up here.</p>';
      return;
    }
    list.innerHTML = '';
    posts.forEach(p => list.appendChild(adminPostRow(p)));
  } catch {
    list.innerHTML = '<p class="cl-admin-posts-empty">Couldn\'t load posts right now.</p>';
  }
}

function adminPostRow(post) {
  const a = post.author;
  const row = document.createElement('div');
  row.className = 'cl-admin-post';

  const avatarHtml = a.avatar
    ? `<img class="cl-admin-post-avatar" src="${a.avatar}" alt="" />`
    : `<span class="cl-admin-post-avatar-fallback">${escapeHtml(a.display_name.charAt(0).toUpperCase())}</span>`;

  row.innerHTML = `
    ${avatarHtml}
    <div class="cl-admin-post-body">
      <div class="cl-admin-post-meta">
        <span class="cl-admin-post-author">${escapeHtml(a.display_name)}</span>
        <span>·</span>
        <span>${timeAgo(post.created_at)}</span>
      </div>
      ${post.title ? `<p class="cl-admin-post-title">${escapeHtml(post.title)}</p>` : ''}
      <p class="cl-admin-post-preview">${escapeHtml(post.body)}</p>
    </div>
  `;
  return row;
}

// ── Theme — default (same background as the Social hub's Home page) or a
// custom blurred background. No UI control for this right now (the old
// hover-reveal paint button was pulled — placement wasn't working and needs
// rethinking) but whatever's already stored on the club still renders. The
// PUT /api/clubs/:slug/theme(-bg) endpoints are unchanged and ready for
// whatever picker UI replaces it. ────────────────────────────────────────
const CL_DEFAULT_BG = '/images/gallery/solusgarnet_17.png';
function applyClubTheme(themeId, bgUrl) {
  const bgImg = document.getElementById('cl-page-bg-img');
  const bgOverlay = document.getElementById('cl-page-bg-overlay');
  bgImg.src = (themeId === 'custom' && bgUrl) ? bgUrl : CL_DEFAULT_BG;
  bgImg.style.display = 'block';
  bgOverlay.style.display = 'block';
}

// ── Edit Club modal — banner image only for now ──────────────────────────
let pendingBannerBlob = null;
let pendingBannerPreviewUrl = null;

function openEditClubModal() {
  if (!currentClub) return;
  pendingBannerBlob = null;
  if (pendingBannerPreviewUrl) { URL.revokeObjectURL(pendingBannerPreviewUrl); pendingBannerPreviewUrl = null; }
  document.getElementById('cl-edit-banner-preview').src = currentClub.banner_url || '/images/gallery/solusgarnet_17.png';
  document.getElementById('cl-edit-msg').textContent = '';
  document.getElementById('cl-edit-overlay').hidden = false;
}
function closeEditClubModal() {
  document.getElementById('cl-edit-overlay').hidden = true;
  pendingBannerBlob = null;
  if (pendingBannerPreviewUrl) { URL.revokeObjectURL(pendingBannerPreviewUrl); pendingBannerPreviewUrl = null; }
}

document.getElementById('cl-edit-club-btn').addEventListener('click', openEditClubModal);
document.getElementById('cl-edit-cancel').addEventListener('click', closeEditClubModal);

document.getElementById('cl-edit-banner-wrap').addEventListener('click', (e) => {
  if (e.target.closest('#cl-edit-banner-recrop-btn')) return;
  document.getElementById('cl-edit-banner-file-input').click();
});
document.getElementById('cl-edit-banner-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  openCropModal({
    title: 'Crop Banner Image', imageSrc: URL.createObjectURL(file), aspectRatio: 1600 / 280, round: false,
    onSave: saveBannerCrop,
  });
  e.target.value = '';
});
// Recrop reopens the Cropper on whatever's currently showing in the preview
// box — the pending crop if you've already picked/cropped one this session,
// otherwise the club's actual saved banner — instead of forcing a fresh
// file pick just to adjust framing.
document.getElementById('cl-edit-banner-recrop-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  const src = pendingBannerPreviewUrl || (currentClub && currentClub.banner_url);
  if (!src) return;
  openCropModal({
    title: 'Crop Banner Image', imageSrc: src, aspectRatio: 1600 / 280, round: false,
    onSave: saveBannerCrop,
  });
});
function saveBannerCrop(blob) {
  pendingBannerBlob = blob;
  if (pendingBannerPreviewUrl) URL.revokeObjectURL(pendingBannerPreviewUrl);
  pendingBannerPreviewUrl = URL.createObjectURL(blob);
  document.getElementById('cl-edit-banner-preview').src = pendingBannerPreviewUrl;
}

document.getElementById('cl-edit-save').addEventListener('click', async () => {
  const saveBtn = document.getElementById('cl-edit-save');
  const msg = document.getElementById('cl-edit-msg');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  msg.className = 'mod-panel-msg';
  msg.textContent = '';
  try {
    const fd = new FormData();
    if (pendingBannerBlob) fd.append('banner', pendingBannerBlob, 'banner.jpg');
    const res = await fetch(`${API}/clubs/${encodeURIComponent(slug)}`, { method: 'PUT', headers: authHeaders(), body: fd });
    if (!res.ok) throw new Error('save failed');
    const data = await res.json();
    renderClub(data.club);
    closeEditClubModal();
  } catch {
    msg.className = 'mod-panel-msg mod-panel-msg--error';
    msg.textContent = 'Could not save — please try again.';
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
});

if (!slug) {
  document.getElementById('cl-notfound').style.display = 'block';
} else {
  loadClub();
}
</script>

</body>
</html>
