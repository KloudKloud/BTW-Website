<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Club ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/vendor/cropper.min.css" />
  <style>
    /* No body background override here on purpose — style.css sets
       body { background: transparent } specifically so the fixed
       .page-bg image shows through underneath. */

    /* ── Sidebar (same as fanpages/social.html — kept present on every
       club page too, with a shared collapse-state localStorage key so it
       stays collapsed/expanded consistently as you move between pages). ── */
    .soc-layout { position: relative; z-index: 1; }
    .soc-sidebar {
      position: fixed; top: 64px; left: 0; bottom: 0; width: 250px; z-index: 5;
      display: flex; flex-direction: column; overflow-y: auto;
      padding: 1.1rem 1.25rem; box-sizing: border-box;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
      border-right: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 4px 0 30px rgba(0,0,0,0.35);
      transition: width 0.2s ease;
    }
    .soc-sidebar-toggle {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; align-self: flex-end; margin-bottom: 1rem;
      border: 1px solid rgba(255,255,255,0.2);
      background: linear-gradient(160deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
      color: #ccc; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, color 0.15s;
    }
    .soc-sidebar-toggle:hover { background: linear-gradient(160deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04)); color: #fff; }
    .soc-layout.soc-collapsed .soc-sidebar { width: 56px; padding-left: 0.6rem; padding-right: 0.6rem; }
    .soc-layout.soc-collapsed .soc-sidebar-content { display: none; }
    .soc-layout.soc-collapsed #cl-page, .soc-layout.soc-collapsed #cl-notfound { margin-left: 56px; }
    .soc-sidebar-user {
      display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: inherit;
      padding: 0.4rem 0.4rem 0.9rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .soc-sidebar-avatar, .soc-sidebar-avatar-fallback { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .soc-sidebar-avatar-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.25rem; }
    .soc-sidebar-username { font-weight: 700; font-size: 1.1rem; color: #f0f0f0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .soc-sidebar-login { font-size: 1rem; color: #7fa8d9; text-decoration: none; display: block; padding: 0.4rem 0.4rem 0.9rem; margin-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .soc-sidebar-nav {
      display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
      gap: 0.2rem; position: static; height: auto; padding: 0; background: none; border: none; backdrop-filter: none;
    }
    .soc-nav-link {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.6rem 0.5rem; border-radius: 8px;
      color: #ccc; text-decoration: none; font-size: 1.05rem; font-weight: 600; transition: background 0.15s, color 0.15s;
    }
    .soc-nav-link:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .soc-nav-link.active { color: #f0c060; background: rgba(240,192,96,0.1); }
    .soc-nav-icon { width: 1.3em; text-align: center; font-size: 1.1rem; }
    .soc-nav-create-btn {
      display: flex; align-items: center; gap: 0.5rem; width: 100%; margin-top: 0.4rem;
      background: linear-gradient(135deg, #3d3a52, #5a4f78); border: none; color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif; font-weight: 600; text-decoration: none; box-sizing: border-box;
      font-size: 1.05rem; padding: 0.65rem 0.75rem; border-radius: 20px; cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25); transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .soc-nav-create-btn:hover {
      transform: translateY(-1px); background: linear-gradient(135deg, #47435f, #665887);
      box-shadow: 0 3px 9px rgba(0,0,0,0.3);
    }
    .soc-sidebar-rule { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 0.9rem 0; }
    .soc-sidebar-label { font-size: 0.88rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #999; padding: 0 0.5rem; margin-bottom: 0.5rem; }
    .soc-sidebar-clubs { display: flex; flex-direction: column; gap: 0.15rem; }
    .soc-sidebar-club-link {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.5rem 0.5rem; border-radius: 8px;
      color: #ddd; text-decoration: none; font-size: 1rem; transition: background 0.15s;
    }
    .soc-sidebar-club-link:hover { background: rgba(255,255,255,0.06); }
    .soc-sidebar-club-icon, .soc-sidebar-club-icon-fallback { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .soc-sidebar-club-icon-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 0.82rem; }
    .soc-sidebar-club-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .soc-sidebar-empty, .soc-sidebar-note { font-size: 0.9rem; color: #888; padding: 0.4rem 0.5rem; line-height: 1.5; }

    #cl-page, #cl-notfound { margin-left: 250px; transition: margin-left 0.2s ease; }

    @media (max-width: 860px) {
      .soc-sidebar { position: static; width: auto; height: auto; border-right: none; }
      #cl-page, #cl-notfound { margin-left: 0; }
      .soc-layout.soc-collapsed #cl-page, .soc-layout.soc-collapsed #cl-notfound { margin-left: 0; }
    }

    /* ── Banner + pfp (the only header content left for now) ── */
    .cl-banner-wrap { position: relative; width: 100%; height: 280px; background: #161616; overflow: hidden; }
    .cl-banner-img-slot { position: absolute; inset: 0; }
    .cl-banner-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* Softens the banner's bottom edge into the page instead of cutting off
       sharply. */
    .cl-banner-wrap::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 140px; z-index: 1;
      background: linear-gradient(to bottom, rgba(13,13,13,0), rgba(13,13,13,0.92));
      pointer-events: none;
    }
    .cl-banner-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #2a1a3a, #3a1f2a); color: rgba(255,255,255,0.2); font-size: 3rem;
    }
    .cl-banner-edit-btn {
      position: absolute; top: 1.1rem; right: 1.1rem; z-index: 3;
      background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.3); color: #fff;
      border-radius: 24px; padding: 0.7em 1.5em; font-size: 0.98rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: background 0.15s, transform 0.15s;
    }
    .cl-banner-edit-btn:hover { background: rgba(0,0,0,0.85); transform: translateY(-1px); }

    .cl-header { max-width: 1200px; margin: -70px auto 0; padding: 0 2rem; position: relative; z-index: 2; }
    /* Pfp no longer has the dark ring around it, per request. */
    .cl-icon-wrap { width: 108px; height: 108px; border-radius: 50%; flex-shrink: 0; overflow: hidden; background: #222; }
    .cl-icon-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cl-icon-fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6b3fa0, #c2547a); }

    @media (max-width: 860px) { .cl-header { margin-top: -50px; } .cl-banner-wrap { height: 180px; } .cl-icon-wrap { width: 84px; height: 84px; } }

    /* ── Row: main content (left), offset by the info panel's fixed width
       on the right, same recipe as .soc-main/.soc-right-panel on the
       Social hub — the panel is taken out of normal flow entirely and
       pinned to the far right edge of the browser window (not just the
       edge of the 1200px content column), inset 20px like the Popular
       Posts panel there. ── */
    .cl-row { max-width: 1200px; margin: 0 auto; padding: 3rem 2rem 5rem; margin-right: 336px; }

    .cl-hero { text-align: center; margin-bottom: 2.5rem; }
    .cl-hero-name {
      font-family: 'Cinzel', Georgia, serif; font-size: 2.6rem; font-weight: 700; color: #f0f0f0;
      text-shadow: 0 0 24px rgba(240,192,96,0.4); margin-bottom: 1.75rem;
    }
    .cl-hero-info-label { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #888; margin-bottom: 0.6rem; }
    .cl-hero-info-body { color: #bbb; font-size: 0.96rem; max-width: 620px; margin: 0 auto; line-height: 1.75; }

    /* Fixed like the Popular Posts panel, but top is offset past the banner
       (64px topbar + 280px banner + 20px gap) instead of sitting right under
       the topbar — the banner has no fixed-position equivalent to dodge it
       otherwise, so a plain top:84px here just runs the panel straight over
       the art. */
    .cl-side {
      position: fixed; top: 364px; right: 20px; bottom: 20px; width: 300px; z-index: 5;
      overflow-y: auto; padding: 1.25rem; box-sizing: border-box;
      background: linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .cl-info-title {
      font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 1.2rem; color: #f0c060;
      text-shadow: 0 0 16px rgba(240,192,96,0.55); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .cl-info-rule { border: none; border-top: 1px solid rgba(255,255,255,0.12); margin: 0.9rem 0; }
    .cl-info-body { color: #999; font-size: 0.88rem; }

    @media (max-width: 1100px) {
      .cl-side { position: static; width: auto; height: auto; margin: 2rem 1.25rem 0; }
      .cl-row { margin-right: 0; }
    }
    @media (max-width: 860px) {
      .cl-row { padding: 2rem 1.25rem 3rem; }
    }

    .cl-gate { max-width: 500px; margin: 8rem auto; text-align: center; color: #999; padding: 0 1.5rem; }

    /* ── Edit Club modal ── */
    /* Same box/hover/overlay recipe as .char-editor-ref-wrap, just wide
       (matching the banner's own on-page proportions) instead of square. */
    .cl-edit-banner-wrap {
      position: relative; width: 100%; max-width: none; aspect-ratio: 1600 / 280; margin: 0 auto 1.75rem;
      border-radius: 14px; overflow: hidden; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .cl-edit-banner-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
    .cl-edit-banner-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.45); color: #fff; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600;
      opacity: 0; transition: opacity 0.2s;
    }
    .cl-edit-banner-wrap:hover .cl-edit-banner-overlay { opacity: 1; }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>
<script src="/fanpages/vendor/cropper.min.js"></script>
<script src="/fanpages/crop-modal.js"></script>

<div class="page-bg">
  <img src="/images/gallery/solusgarnet_17.png" alt="" />
  <div class="page-bg-overlay"></div>
</div>

<div class="soc-layout" id="soc-layout">

  <aside class="soc-sidebar">
    <button class="soc-sidebar-toggle" id="soc-sidebar-toggle" type="button" title="Collapse sidebar" aria-label="Collapse sidebar">☰</button>

    <div class="soc-sidebar-content" id="soc-sidebar-content">
      <div id="soc-sidebar-user-slot"></div>

      <nav class="soc-sidebar-nav">
        <a class="soc-nav-link" href="/fanpages/social"><span class="soc-nav-icon">🏠</span> Home</a>
        <a class="soc-nav-link" href="/fanpages/social#soc-feed-section"><span class="soc-nav-icon">🕓</span> Recent</a>
        <a class="soc-nav-link" href="/fanpages/social#soc-discover-section"><span class="soc-nav-icon">🧭</span> Explore</a>
        <a class="soc-nav-create-btn" href="/fanpages/social"><span>+</span> Start a Club</a>
      </nav>

      <hr class="soc-sidebar-rule" />
      <p class="soc-sidebar-label">Clubs</p>
      <hr class="soc-sidebar-rule" />
      <div class="soc-sidebar-clubs" id="soc-sidebar-clubs"><p class="soc-sidebar-empty">Loading…</p></div>
    </div>
  </aside>

<div id="cl-notfound" class="cl-gate" style="display:none;">
  <p>This club doesn't exist (or was deleted).</p>
  <a class="btn btn-green" href="/fanpages/social" style="margin-top:1rem; display:inline-block;">&larr; Back to Social</a>
</div>

<div id="cl-page" style="display:none;">

  <div class="cl-banner-wrap" id="cl-banner-wrap">
    <div class="cl-banner-img-slot" id="cl-banner-img-slot"></div>
    <button class="cl-banner-edit-btn" id="cl-edit-club-btn" type="button" style="display:none;">✎ Edit Club</button>
  </div>

  <div class="cl-header">
    <div class="cl-icon-wrap" id="cl-icon-wrap"></div>
  </div>

  <div class="cl-row">
    <div class="cl-hero">
      <h1 class="cl-hero-name" id="cl-hero-name"></h1>
      <p class="cl-hero-info-label">Club Info</p>
      <p class="cl-hero-info-body" id="cl-hero-info-body"></p>
    </div>
  </div>

  <aside class="cl-side">
    <p class="cl-info-title" id="cl-info-title"></p>
    <hr class="cl-info-rule" />
    <div class="cl-info-body" id="cl-info-body"></div>
  </aside>
</div>

</div> <!-- /.soc-layout -->

<!-- Edit Club modal — owners/admins only. Starts with just the banner
     image; more fields land here as the club template grows. -->
<div class="char-editor-overlay" id="cl-edit-overlay" hidden>
  <div class="char-editor-modal">
    <h2 class="char-editor-title">Edit Club</h2>

    <div class="mod-field">
      <label>Banner Image</label>
      <div class="cl-edit-banner-wrap" id="cl-edit-banner-wrap">
        <img id="cl-edit-banner-preview" alt="" />
        <div class="cl-edit-banner-overlay">📷 Change Banner Image</div>
      </div>
      <input type="file" id="cl-edit-banner-file-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />
    </div>

    <p class="mod-panel-msg" id="cl-edit-msg"></p>
    <div class="char-editor-actions">
      <button class="mod-btn mod-btn--cancel" id="cl-edit-cancel" type="button">Cancel</button>
      <button class="mod-btn" id="cl-edit-save" type="button">Save</button>
    </div>
  </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
const slug = new URLSearchParams(location.search).get('slug');

let currentUser = null;
try {
  const raw = localStorage.getItem('btw_user') || sessionStorage.getItem('btw_user');
  if (raw) currentUser = JSON.parse(raw);
} catch {}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Sidebar (identical to fanpages/social.html) ──────────────────────────
const sidebarUserSlot = document.getElementById('soc-sidebar-user-slot');
if (token && currentUser) {
  const sidebarAvatarHtml = currentUser.avatar
    ? `<img class="soc-sidebar-avatar" src="${currentUser.avatar}" alt="" />`
    : `<span class="soc-sidebar-avatar-fallback">${escapeHtml((currentUser.display_name || currentUser.username || '?').charAt(0).toUpperCase())}</span>`;
  sidebarUserSlot.innerHTML = `
    <a class="soc-sidebar-user" href="/fanpages/${encodeURIComponent(currentUser.username)}">
      ${sidebarAvatarHtml}
      <span class="soc-sidebar-username">${escapeHtml(currentUser.display_name || currentUser.username)}</span>
    </a>
  `;
} else {
  sidebarUserSlot.innerHTML = `<a class="soc-sidebar-login" href="/fanpages/login?from=${encodeURIComponent(location.pathname + location.search)}">Log In / Register</a>`;
}

function clubIconHtml(c, sizeClass) {
  if (c.icon_url) return `<img class="${sizeClass}" src="${c.icon_url}" alt="" />`;
  const letter = escapeHtml((c.name || '?').charAt(0).toUpperCase());
  return `<span class="${sizeClass}-fallback">${letter}</span>`;
}

async function loadSidebarClubs() {
  const wrap = document.getElementById('soc-sidebar-clubs');
  if (!token) {
    wrap.innerHTML = '<p class="soc-sidebar-note">Log in to see your clubs~</p>';
    return;
  }
  try {
    const res = await fetch(`${API}/clubs?mine=1&limit=50`, { headers: authHeaders() });
    const data = await res.json();
    const clubs = data.clubs || [];
    if (!clubs.length) {
      wrap.innerHTML = '<p class="soc-sidebar-note">You haven\'t joined any clubs yet.</p>';
      return;
    }
    wrap.innerHTML = '';
    clubs.forEach(c => {
      const a = document.createElement('a');
      a.className = 'soc-sidebar-club-link';
      a.href = `/fanpages/club?slug=${encodeURIComponent(c.slug)}`;
      a.innerHTML = `${clubIconHtml(c, 'soc-sidebar-club-icon')}<span class="soc-sidebar-club-name">${escapeHtml(c.name)}</span>`;
      wrap.appendChild(a);
    });
  } catch {
    wrap.innerHTML = '<p class="soc-sidebar-note">Couldn\'t load your clubs.</p>';
  }
}
loadSidebarClubs();

// Same localStorage key as social.html, so collapse state stays in sync
// as you move between the Social hub and any club page.
const socLayout = document.getElementById('soc-layout');
const sidebarToggleBtn = document.getElementById('soc-sidebar-toggle');
function setSidebarCollapsed(collapsed) {
  socLayout.classList.toggle('soc-collapsed', collapsed);
  const label = collapsed ? 'Expand sidebar' : 'Collapse sidebar';
  sidebarToggleBtn.title = label;
  sidebarToggleBtn.setAttribute('aria-label', label);
  localStorage.setItem('soc_sidebar_collapsed', collapsed ? '1' : '0');
}
sidebarToggleBtn.addEventListener('click', () => setSidebarCollapsed(!socLayout.classList.contains('soc-collapsed')));
if (localStorage.getItem('soc_sidebar_collapsed') === '1') setSidebarCollapsed(true);

// ── Club — banner, pfp, and the (currently empty) info panel only ───────
async function loadClub() {
  try {
    const res = await fetch(`${API}/clubs/${encodeURIComponent(slug)}`, { headers: authHeaders() });
    if (!res.ok) { document.getElementById('cl-notfound').style.display = 'block'; return; }
    const data = await res.json();
    renderClub(data.club);
    document.getElementById('cl-page').style.display = 'block';
  } catch {
    document.getElementById('cl-notfound').style.display = 'block';
  }
}

let currentClub = null;

function renderClub(club) {
  currentClub = club;
  document.title = `${club.name} ✦ Social ✦ Fanpages`;

  document.getElementById('cl-banner-img-slot').innerHTML = club.banner_url
    ? `<img src="${club.banner_url}" alt="" style="object-position:${club.banner_position_x}% ${club.banner_position_y}%;" />`
    : `<div class="cl-banner-fallback"></div>`;

  document.getElementById('cl-icon-wrap').innerHTML = club.icon_url
    ? `<img src="${club.icon_url}" alt="" />`
    : `<span class="cl-icon-fallback">${escapeHtml(club.name.charAt(0).toUpperCase())}</span>`;

  document.getElementById('cl-info-title').textContent = club.name;

  document.getElementById('cl-hero-name').textContent = club.name;
  document.getElementById('cl-hero-info-body').textContent = club.description || 'This club hasn\'t written anything here yet.';

  const isAdminOrOwner = club.viewer_role === 'owner' || club.viewer_role === 'admin';
  document.getElementById('cl-edit-club-btn').style.display = isAdminOrOwner ? 'block' : 'none';
}

// ── Edit Club modal — banner image only for now ──────────────────────────
let pendingBannerBlob = null;
let pendingBannerPreviewUrl = null;

function openEditClubModal() {
  if (!currentClub) return;
  pendingBannerBlob = null;
  if (pendingBannerPreviewUrl) { URL.revokeObjectURL(pendingBannerPreviewUrl); pendingBannerPreviewUrl = null; }
  document.getElementById('cl-edit-banner-preview').src = currentClub.banner_url || '/images/gallery/solusgarnet_17.png';
  document.getElementById('cl-edit-msg').textContent = '';
  document.getElementById('cl-edit-overlay').hidden = false;
}
function closeEditClubModal() {
  document.getElementById('cl-edit-overlay').hidden = true;
  pendingBannerBlob = null;
  if (pendingBannerPreviewUrl) { URL.revokeObjectURL(pendingBannerPreviewUrl); pendingBannerPreviewUrl = null; }
}

document.getElementById('cl-edit-club-btn').addEventListener('click', openEditClubModal);
document.getElementById('cl-edit-cancel').addEventListener('click', closeEditClubModal);

document.getElementById('cl-edit-banner-wrap').addEventListener('click', () => {
  document.getElementById('cl-edit-banner-file-input').click();
});
document.getElementById('cl-edit-banner-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  openCropModal({
    title: 'Crop Banner Image', imageSrc: URL.createObjectURL(file), aspectRatio: 1600 / 280, round: false,
    onSave: (blob) => {
      pendingBannerBlob = blob;
      if (pendingBannerPreviewUrl) URL.revokeObjectURL(pendingBannerPreviewUrl);
      pendingBannerPreviewUrl = URL.createObjectURL(blob);
      document.getElementById('cl-edit-banner-preview').src = pendingBannerPreviewUrl;
    },
  });
  e.target.value = '';
});

document.getElementById('cl-edit-save').addEventListener('click', async () => {
  const saveBtn = document.getElementById('cl-edit-save');
  const msg = document.getElementById('cl-edit-msg');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving…';
  msg.className = 'mod-panel-msg';
  msg.textContent = '';
  try {
    const fd = new FormData();
    if (pendingBannerBlob) fd.append('banner', pendingBannerBlob, 'banner.jpg');
    const res = await fetch(`${API}/clubs/${encodeURIComponent(slug)}`, { method: 'PUT', headers: authHeaders(), body: fd });
    if (!res.ok) throw new Error('save failed');
    const data = await res.json();
    renderClub(data.club);
    closeEditClubModal();
  } catch {
    msg.className = 'mod-panel-msg mod-panel-msg--error';
    msg.textContent = 'Could not save — please try again.';
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save';
  }
});

if (!slug) {
  document.getElementById('cl-notfound').style.display = 'block';
} else {
  loadClub();
}
</script>

</body>
</html>
