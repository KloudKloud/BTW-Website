<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fandoms ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scrollbar-gutter: stable; }
    body {
      background: #0d0d0d; color: #f0f0f0;
      font-family: 'Baloo 2', 'Fredoka', 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* Full-bleed main-background video, fixed to the viewport -- this
       page is short enough that one background covers it, no need for
       the homepage's multi-section video-per-scroll-area treatment yet.
       Revisit that approach if this page ever grows tall enough to need
       it. */
    .fp-bg-video {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      object-position: center bottom; z-index: 0;
    }
    .fp-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.5); z-index: 0; }
    .fp-content-z { position: relative; z-index: 1; }

    .fp-fd-wrap { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2.5rem 5rem; position: relative; }
    .fp-fd-title {
      font-family: 'Fredoka', 'Lato', cursive; font-size: 2.4rem; font-weight: 700; color: #fff;
      display: flex; align-items: center; gap: 0.6rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6), 0 0 20px rgba(127,168,217,0.35);
      margin-bottom: 2rem;
    }
    .fp-fd-title-deco { width: 32px; height: 32px; object-fit: contain; }
    .fp-fd-groups {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.75rem;
    }
    /* Boxed card, same box-background system as the rest of the site --
       potential-box-background art + a dark scrim, a sparkle tucked into
       the corner. */
    .fp-fd-group {
      position: relative; overflow: hidden;
      background: linear-gradient(160deg, rgba(10,8,14,0.84), rgba(10,8,14,0.76)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.14); border-radius: 14px;
      box-shadow: 0 6px 22px rgba(0,0,0,0.35);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .fp-fd-group:hover { border-color: rgba(240,192,96,0.4); box-shadow: 0 6px 22px rgba(0,0,0,0.35), 0 0 24px rgba(240,192,96,0.18); }
    .fp-fd-group-deco { position: absolute; top: -12px; right: -8px; width: 42px; height: 42px; object-fit: contain; opacity: 0.9; pointer-events: none; z-index: 1; }
    .fp-fd-group-title {
      position: relative; z-index: 1;
      font-family: 'Fredoka', 'Lato', cursive; font-size: 1.2rem; font-weight: 700; color: #f0c060;
      display: flex; align-items: center; gap: 0.45rem;
      padding: 1rem 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.12);
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }
    .fp-fd-group-title-deco { width: 20px; height: 20px; object-fit: contain; }
    .fp-fd-group-list { position: relative; z-index: 1; display: flex; flex-direction: column; }
    .fp-fd-item {
      display: block; text-decoration: none; color: #ddd; font-weight: 600; font-size: 0.95rem;
      padding: 0.85rem 1.4rem; border-bottom: 1px solid rgba(255,255,255,0.08);
      transition: color 0.15s, background 0.15s;
    }
    .fp-fd-item:last-child { border-bottom: none; }
    .fp-fd-item:hover { color: #f0c060; background: rgba(255,255,255,0.06); }
    .fp-fd-empty { color: #ddd; font-size: 0.9rem; padding: 2rem; text-align: center; }

    /* A couple of floating sparkle accents over the page, same idea as
       the Posts/Characters backgrounds. */
    .fp-fd-sparkle { position: fixed; z-index: 0; pointer-events: none; object-fit: contain; opacity: 0.75; }
    .fp-fd-sparkle--a { top: 100px; left: 3vw; width: 46px; height: 46px; }
    .fp-fd-sparkle--b { top: 160px; right: 5vw; width: 30px; height: 30px; }
  </style>
</head>
<body>

<video class="fp-bg-video" autoplay muted loop playsinline>
  <source src="/images/home/main-background.mp4" type="video/mp4" />
</video>
<img class="fp-fd-sparkle fp-fd-sparkle--a" src="/images/home/decoration-1.png" alt="" />
<img class="fp-fd-sparkle fp-fd-sparkle--b" src="/images/home/decoration-3.png" alt="" />
<div class="fp-bg-overlay"></div>

<div class="fp-content-z">
<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="fp-fd-wrap">
  <h1 class="fp-fd-title">Fandoms <img class="fp-fd-title-deco" src="/images/home/decoration-2.png" alt="" /></h1>
  <div class="fp-fd-groups" id="fp-fd-groups">
    <p class="fp-fd-empty">Loading…</p>
  </div>
</div>
</div>

<script>
// Every fandom in our catalog is manually sorted into one of these
// categories -- with only a handful of fandoms on the whole site, a fixed
// lookup table is simpler and safer than trying to auto-classify them.
// Anything not listed here falls into "Other" automatically.
const FANDOM_CATEGORIES = {
  'Pokemon': 'Anime & Manga',
  'Original Furry Characters': 'Furry Fandom',
  'Original Characters': 'Other',
};
const CATEGORY_ORDER = ['Anime & Manga', 'Furry Fandom', 'Other'];
const CATEGORY_DECO = { 'Anime & Manga': 'decoration-1.png', 'Furry Fandom': 'decoration-2.png', 'Other': 'decoration-3.png' };

function fandomUrl(name) {
  const usp = new URLSearchParams({ fandoms: name, sort: 'updated' });
  return window.fpUrl(`/search?${usp.toString()}`);
}

(async () => {
  const wrap = document.getElementById('fp-fd-groups');
  try {
    const res = await fetch('/api/fandom-catalog');
    const data = await res.json();
    const fandoms = data.fandoms || [];
    if (!fandoms.length) {
      wrap.innerHTML = '<p class="fp-fd-empty">No fandoms yet.</p>';
      return;
    }

    const grouped = {};
    fandoms.forEach(f => {
      const cat = FANDOM_CATEGORIES[f] || 'Other';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(f);
    });

    const categories = [...CATEGORY_ORDER, ...Object.keys(grouped).filter(c => !CATEGORY_ORDER.includes(c))];
    wrap.innerHTML = categories.filter(c => grouped[c] && grouped[c].length).map(cat => `
      <div class="fp-fd-group">
        <img class="fp-fd-group-deco" src="/images/home/decoration-8.png" alt="" />
        <p class="fp-fd-group-title">${cat}<img class="fp-fd-group-title-deco" src="/images/home/${CATEGORY_DECO[cat] || 'decoration-1.png'}" alt="" /></p>
        <div class="fp-fd-group-list">
          ${grouped[cat].sort((a, b) => a.localeCompare(b)).map(f => `<a class="fp-fd-item" href="${fandomUrl(f)}">${f}</a>`).join('')}
        </div>
      </div>
    `).join('');
  } catch {
    wrap.innerHTML = '<p class="fp-fd-empty">Couldn\'t load fandoms right now.</p>';
  }
})();
</script>

</body>
</html>
