<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      /* Reserves the scrollbar's width up front so the page doesn't get
         narrower the instant a scrollbar appears (which happens right as
         you start scrolling, once results have loaded in taller than one
         screen) — that width change was the "jerk" shoving the sticky
         right-hand panel sideways. */
      scrollbar-gutter: stable;
    }
    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Baloo 2', 'Fredoka', 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* Full-bleed wallpaper behind everything, fixed to the viewport
       (unaffected by scrolling) and sitting under the topbar -- z-index:0
       background layers, real content explicitly promoted to z-index:1.
       Default is the original blurred wallpaper Profiles/a plain Story
       search still use; Story tabs get the unblurred box-background-5 and
       Posts (browse or filtered search) gets browse-background-2 --
       neither blurred, both added/removed in JS based on view. */
    .fp-bg-video {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; z-index: 0;
      background: url('/images/gallery/kloudsaphbedroom_1.png') center / cover no-repeat;
      filter: blur(18px) brightness(0.55);
    }
    .fp-bg-video--stories {
      background-image: url('/images/home/box-background-5.png');
      filter: none;
    }
    /* Posts is the one wallpaper that actually scrolls with the page
       instead of staying pinned -- a fixed-length grid of cards (unlike
       Stories, which paginates), so there's no harm letting the art move
       with it. position:absolute (height set in JS to match the full
       page height) instead of the fixed/inset:0 every other variant
       uses. A light blur takes the edge off without flattening it into a
       pure gradient like the old blurred wallpaper. */
    .fp-bg-video--posts {
      background-image: url('/images/home/potential-box-background.png');
      filter: blur(4px);
      position: absolute; top: 0; left: 0; right: 0; bottom: auto; height: 100vh;
    }
    .fp-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.45); z-index: 0; }
    /* Profiles gets the actual main-background-4 video instead of a still
       image -- locked in place (fixed, full frame, no scroll) since the
       page itself never scrolls here; only the results column does (see
       .fp-layout--profiles .fp-results-col below). Hidden by default,
       shown only on the Profiles tab via JS. */
    .fp-bg-video-el {
      display: none; position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0;
      /* Anchored to the bottom -- cover crops top+bottom equally by
         default, and the sliver lost off the top sits under the topbar
         anyway, so anchoring bottom keeps the whole lower portion (where
         cover crops were most noticeable) actually on screen. */
      object-position: center bottom;
    }
    /* Starts right where the side panel ends instead of running full-bleed
       underneath it -- 250px column + the 2.5rem the panel's own
       negative margin pulls it flush past. */
    .fp-bg-video-el--active { display: block; left: calc(250px + 2.5rem); width: calc(100% - 250px - 2.5rem); }
    /* A couple of sparkle accents floating over the Posts wallpaper
       specifically -- scroll with it (position:absolute, same as the
       wallpaper itself) since it's one big image with no cards breaking
       it up like Stories has. */
    .fp-bg-sparkle { display: none; position: absolute; z-index: 0; pointer-events: none; object-fit: contain; opacity: 0.8; }
    .fp-bg-video--posts ~ .fp-bg-sparkle { display: block; }
    .fp-bg-sparkle--a { top: 90px; left: 4vw; width: 52px; height: 52px; }
    .fp-bg-sparkle--b { top: 140px; right: 6vw; width: 34px; height: 34px; }
    .fp-content-z { position: relative; z-index: 1; }

    .fp-search-sub { color: #ccc; font-size: 0.95rem; margin: 1.75rem 0 0.85rem; }
    .fp-search-page-label { color: #f0c060; font-weight: 700; margin-left: 0.5rem; }
    .fp-search-sub strong { color: #fff; }

    /* The collapse toggle animates the third column's width between
       340px (open) and 0 (fully collapsed) -- pushing/pulling the rest
       of the page as it goes. */
    .fp-layout {
      padding: 0 2.5rem 5rem;
      display: grid; grid-template-columns: 250px 1fr 250px; column-gap: 2rem; align-items: stretch;
      transition: grid-template-columns 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: grid-template-columns;
    }
    /* Left column (250px) matches the base state exactly -- it used to
       jump to 320px here, so the left panel visibly shifted too every
       time the right panel collapsed/expanded instead of only the right
       column moving. contain:layout on both side panels scopes their
       reflow cost during the animation instead of the whole page
       recalculating layout every frame, which is what read as "jittery". */
    .fp-layout--filters-collapsed { grid-template-columns: 250px 1fr 0px; }
    .fp-results-col { grid-column: 2; min-width: 0; contain: layout; }

    /* ── Posts view — the Story tab's filter panel/collapse-fab don't apply
       here (no story filters for a gallery+chapter feed); its own
       .fp-posts-panel takes column 3 instead, a bit thinner than the
       Story filter panel since it needs far fewer fields. ── */
    .fp-layout--submissions { grid-template-columns: 250px 1fr 250px; }
    .fp-layout--submissions .fp-filter-panel,
    .fp-layout--submissions .fp-filter-fab { display: none; }
    /* Hidden everywhere except the Posts view -- default .fp-layout has no
       3rd-column content of its own to give this room, so it only ever
       renders where .fp-layout--submissions has already made column 3
       260px wide. */
    .fp-posts-panel { display: none; }
    .fp-layout--submissions .fp-posts-panel { display: flex; }

    /* ── Browse mode (?browse=1, reached via the nav's Browse dropdown
       instead of the left Story/Submissions/Profiles panel) — no left
       panel, no right filter panel either; just a plain full-width
       "Recent Stories"/"Recent Submissions" feed, AO3-style. ── */
    /* AO3-style "Recent Works" feed — no left panel, no right filter panel,
       just the results filling the full width. (Story-browse used to keep
       the right filter panel/collapse-arrow here; that's gone now per a
       later revision — browse is a plain full-width recent feed, not a
       filterable one.) */
    .fp-layout--no-side { grid-template-columns: 1fr; }
    .fp-layout--no-side .fp-side-panel,
    .fp-layout--no-side .fp-filter-panel,
    .fp-layout--no-side .fp-filter-fab { display: none; }
    .fp-layout--no-side .fp-results-col { grid-column: 1; }
    /* Same bubbly-glow treatment as the homepage Spotlight titles
       (fp-spotlight-row .fp-shine-title in index.html). */
    .fp-browse-heading {
      font-family: 'Fredoka', 'Lato', cursive; font-size: 1.7rem; font-weight: 700; color: #cfe0f5;
      margin: 1.75rem 0 0.2rem; display: flex; align-items: center; gap: 0.5rem;
      text-shadow: 0 2px 6px rgba(0,0,0,0.55), 0 0 6px rgba(127,168,217,0.4);
    }
    .fp-browse-heading .fp-title-deco { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }

    /* Justified photo-wall grid — ported from the Fanpage Hub's "Recent
       Submissions" box (fanpages/index.html: rs-grid/rs-row/rs-card),
       same card look/hover-reveal-title behavior, just not capped to 3
       rows here since this is the real full listing, not a teaser. */
    .rs-tile { display: flex; flex-direction: column; min-width: 0; }
    .rs-card {
      position: relative; display: block; text-decoration: none; color: inherit;
      border-radius: 8px; overflow: hidden; background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08); transition: transform 0.15s, box-shadow 0.15s;
      aspect-ratio: 6 / 7;
    }
    .rs-card:hover { transform: translateY(-4px); box-shadow: 0 10px 26px rgba(0,0,0,0.45); z-index: 3; }
    .rs-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rs-card .wiki-generated-cover { width: 100%; height: 100%; border-radius: 0; border: none; }
    /* Just the emoji, bigger, sitting bottom-right of the tile -- no
       circular backing plate. */
    .rs-card-badge {
      position: absolute; bottom: 6px; right: 7px; z-index: 2;
      font-size: 1.35rem; line-height: 1; text-shadow: 0 1px 5px rgba(0,0,0,0.85);
    }
    /* Always-visible caption under the tile (title + "by <author>"),
       FurAffinity-style, instead of a hover-only overlay -- centered under
       the thumbnail, title itself clickable (same destination as the
       image) and colored like FA's link blue instead of plain white. */
    .rs-card-caption { padding: 0.5rem 0.05rem 0; min-width: 0; text-align: center; }
    .rs-card-caption-title {
      display: block; font-size: 0.86rem; font-weight: 700; color: #6fb3e0; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rs-card-caption-title:hover { color: #96cbef; text-decoration: underline; }
    .rs-card-caption-author { display: block; font-size: 0.78rem; color: #999; margin-top: 0.15rem; }
    .rs-card-caption-author a { color: #a8c6e8; text-decoration: none; }
    .rs-card-caption-author a:hover { text-decoration: underline; }

    /* ── Profiles view — same "no filter panel" idea as Submissions, but
       results are condensed to a centered column instead of stretching
       full width (a wall of skinny profile rows edge-to-edge would be
       much harder to scan than a photo grid is). ── */
    .fp-layout--profiles { grid-template-columns: 250px 1fr; }
    .fp-layout--profiles .fp-filter-panel,
    .fp-layout--profiles .fp-filter-fab { display: none; }
    /* Only this column scrolls -- same sticky/self-contained treatment as
       the side panel, so the fixed background video underneath never has
       to move (nothing else on the page scrolls to begin with). */
    .fp-layout--profiles .fp-results-col {
      max-width: 680px; margin: 0 auto;
      position: sticky; top: 76px; height: calc(100vh - 76px); overflow-y: auto;
      overscroll-behavior: contain; padding-right: 0.5rem;
    }
    .fp-layout--profiles .fp-results-col::-webkit-scrollbar { width: 8px; }
    .fp-layout--profiles .fp-results-col::-webkit-scrollbar-track { background: transparent; }
    .fp-layout--profiles .fp-results-col::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }

    .fp-profile-tabs { display: flex; gap: 2rem; border-bottom: 1px solid rgba(255,255,255,0.14); margin-bottom: 1.5rem; }
    .fp-profile-tab {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 1.1rem; font-weight: 800; color: #999;
      padding: 0 0 0.7rem; border-bottom: 3px solid transparent; margin-bottom: -1px;
    }
    .fp-profile-tab:hover { color: #ddd; }
    .fp-profile-tab--active { color: #fff; border-bottom-color: #7fa8d9; }

    /* Boxed card instead of a plain borderless row -- box-background-2
       art (cropped to a couple of alternating regions) + a dark scrim,
       same system as the rest of the site's boxed cards. */
    .fp-profile-card {
      display: flex; align-items: center; gap: 1.3rem; padding: 1.3rem 1.5rem; cursor: pointer;
      border-radius: 14px; margin-bottom: 1rem; position: relative; overflow: hidden;
      background: linear-gradient(160deg, rgba(10,8,14,0.82), rgba(10,8,14,0.72)), url('/images/home/box-background-4.jpg');
      background-size: cover; background-position: 40% 85%;
      border: 1px solid rgba(255,255,255,0.16);
      transition: border-color 0.15s;
    }
    .fp-profile-card:hover { border-color: rgba(240,192,96,0.4); }
    .fp-profile-card-deco { position: absolute; top: -10px; right: -8px; width: 38px; height: 38px; object-fit: contain; opacity: 0.9; pointer-events: none; }
    .fp-profile-avatar, .fp-profile-avatar-fallback {
      width: 76px; height: 76px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .fp-profile-avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.4rem;
    }
    .fp-profile-char-ref, .fp-profile-char-ref-fallback {
      width: 62px; height: 78px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
    }
    .fp-profile-char-ref-fallback {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.4rem;
    }
    .fp-profile-info { min-width: 0; flex: 1; }
    .fp-profile-name { font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none; }
    .fp-profile-name:hover { text-decoration: underline; }
    .fp-profile-handle { font-size: 0.88rem; color: #999; margin-top: 0.1rem; }
    .fp-profile-stats { display: flex; flex-wrap: wrap; gap: 0.3rem 1.1rem; margin-top: 0.5rem; font-size: 0.82rem; color: #999; }
    .fp-profile-stats strong { color: #eee; }
    .fp-profile-follow-btn {
      flex-shrink: 0; display: flex; align-items: center; gap: 0.4rem;
      background: linear-gradient(135deg, #3d6fa8, #7fa8d9); color: #fff; border: none; border-radius: 20px;
      padding: 0.55em 1.1em; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 0 12px rgba(127,168,217,0.4); transition: box-shadow 0.15s, transform 0.15s, background 0.15s;
    }
    .fp-profile-follow-btn:hover { box-shadow: 0 0 20px rgba(127,168,217,0.65); transform: translateY(-1px); }
    .fp-profile-follow-btn--following { background: rgba(255,255,255,0.08); box-shadow: none; }
    .fp-profile-follow-btn--following:hover { background: rgba(217,122,114,0.2); color: #e69a92; box-shadow: none; }

    /* ── Result rows — no card box, just a horizontal rule between each ── */
    .fp-results-list { display: flex; flex-direction: column; gap: 1.1rem; }
    /* Submissions view -- fixed-size tiles (the exact crop the uploader
       picked in the editor), not a variable-size justified photo wall.
       Bigger than the old justified-grid target height, e621-style. */
    .fp-results-list--grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; }
    /* EXPERIMENTAL -- opaque box-background-4 fill instead of the earlier
       transparent-but-bordered treatment, same "dark scrim under busy art"
       pattern as the homepage's box background system. Cards vary a lot in
       height depending on tag count, so this is a first look, not final. */
    .fp-result {
      display: flex; gap: 1.75rem; padding: 1.5rem; cursor: pointer;
      background: linear-gradient(160deg, rgba(10,8,14,0.82), rgba(10,8,14,0.72)), url('/images/home/box-background-5.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.22); border-radius: 14px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.25);
      transition: border-color 0.15s;
    }
    .fp-result:hover { border-color: rgba(240,192,96,0.35); }
    /* align-items: flex-start -- the cover should always sit flush against
       the top of the row (top-left of the card), never centered against
       whatever height the synopsis/tags on the right happen to push the
       row to. A story with a long tag list used to visibly push the cover
       down toward the middle of the row instead of staying pinned up top. */
    .fp-result-cover-link { flex-shrink: 0; text-decoration: none; display: flex; align-items: flex-start; }
    .fp-result-cover {
      width: 130px; height: 195px; object-fit: cover; object-position: top left; border-radius: 12px; display: block;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    /* search.html only links fanpages-nav.css, not the full fanpages.css
       where .wiki-generated-cover normally lives — without these rules the
       generated (no-cover) fallback renders as a bare, unstyled div and its
       title text shows as plain underlined link text instead of a cover. */
    .fp-result-cover-link .wiki-generated-cover {
      width: 130px; height: 195px; border-radius: 12px;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a);
      border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .fp-result-cover-link .wiki-generated-cover-bg {
      position: absolute; inset: -25%; background-size: cover; background-position: center;
      filter: blur(12px) saturate(1.3) brightness(0.6); transform: scale(1.15);
    }
    .fp-result-cover-link .wiki-generated-cover-title {
      position: relative; z-index: 1; color: #fff; text-align: center; padding: 0 0.6rem;
      font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 0.92rem; line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }
    .fp-result-body { min-width: 0; flex: 1; display: flex; flex-direction: column; }

    .fp-result-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    .fp-result-title {
      font-size: 1.7rem; font-weight: 700; color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .fp-result-title:hover { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,0.25), 0 1px 3px rgba(0,0,0,0.4); }
    .fp-result-date { font-size: 0.8rem; color: #999; white-space: nowrap; flex-shrink: 0; }

    /* Author row — pfp + name, right under the title. */
    .fp-result-author {
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
      margin: 0.5rem 0 0.85rem; width: fit-content;
    }
    .fp-result-author:hover .fp-result-author-name { color: #7fa8d9; text-decoration: underline; }
    .fp-result-author-avatar, .fp-result-author-avatar-fallback {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .fp-result-author-avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 0.72rem;
    }
    .fp-result-author-name { font-size: 0.92rem; font-weight: 600; color: #ccc; }

    .fp-tag-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.85rem; }
    .fp-tag-pill {
      display: inline-block; border-radius: 20px; padding: 0.32em 0.9em; font-size: 0.82rem; font-weight: 700;
      text-decoration: none; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
    }
    .fp-tag-pill:hover { filter: brightness(1.25); }
    /* Colors match the story hero card's tag cloud exactly (wiki-rating-badge /
       wiki-meta-badge-list-item / wiki-tag-bubble in fanpages.css) -- these were
       previously much lower-contrast/borderless and hard to read. */
    .fp-tag-pill--rating-general { background: rgba(122,201,141,0.14); color: #7ac98d; border-color: rgba(122,201,141,0.4); }
    .fp-tag-pill--rating-teen { background: rgba(240,192,96,0.14); color: #f0c060; border-color: rgba(240,192,96,0.4); }
    .fp-tag-pill--rating-mature { background: rgba(224,140,74,0.16); color: #e08c4a; border-color: rgba(224,140,74,0.45); }
    .fp-tag-pill--complete { background: rgba(127,168,217,0.2); color: #a8c6e8; border-color: rgba(127,168,217,0.45); }
    .fp-tag-pill--fandom { background: rgba(194,84,122,0.1); color: #c2547a; border-color: rgba(194,84,122,0.3); }
    .fp-tag-pill--relationship { background: rgba(194,84,122,0.1); color: #c2547a; border-color: rgba(194,84,122,0.3); }
    .fp-tag-pill--category { background: rgba(194,84,122,0.1); color: #c2547a; border-color: rgba(194,84,122,0.3); }
    .fp-tag-pill--tag { background: rgba(127,168,217,0.16); color: #bcd4f0; border-color: rgba(127,168,217,0.55); }

    /* Cut to a uniform length (in JS) so cards read as the same rough
       height, plus a soft fade on the last line instead of a hard stop. */
    .fp-result-synopsis {
      font-size: 0.98rem; color: #ccc; line-height: 1.6; margin-bottom: 0.9rem;
      -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
    }

    /* Small stat line at the bottom — word count stays plain text, the
       rest use the same cute emoji shorthand the profile Stories tab
       cards use (views/likes/comments/bookmarks), so a story reads the
       same whether you found it here or on an author's own profile. */
    .fp-result-stats { display: flex; flex-wrap: wrap; gap: 0.4rem 1.35rem; margin-top: auto; font-size: 0.95rem; color: #999; }
    /* Slightly dimmer than pure white -- bold #eee on the blurred-wallpaper
       background read as glowing/harsh, especially the word count (the
       biggest number here most of the time). #c9c9c9 keeps it legible and
       clearly brighter than the "Words:"/"👁"-style labels around it
       without the glare. */
    .fp-result-stats strong { color: #c9c9c9; font-weight: 700; }

    /* Top-4 tagged-character chips -- same look as the profile Stories
       tab's teaser cards. */
    .fp-result-chars { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.15rem 0 0.85rem; }
    .fp-result-char-chip {
      display: flex; align-items: center; gap: 0.4rem; background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 0.2rem 0.7rem 0.2rem 0.2rem; font-size: 0.78rem; color: #ddd; font-weight: 600;
      text-decoration: none; transition: border-color 0.15s, color 0.15s;
    }
    .fp-result-char-chip:hover { border-color: #7fa8d9; color: #fff; }
    .fp-result-char-chip img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

    /* ── Browse ("Recent Stories") card grid — take 2, a different card
       shape entirely: no tag rows anymore, just Rating + Ongoing/Complete
       badges, a big stat panel, description, then the character teaser
       row. Own "fp-bcard-*" namespace (not .fp-result) so the filtered
       Story-tab search results (still the single-column AO3-style list)
       stay completely untouched. ── */
    .fp-bcard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem; }
    /* Filtered Story search (tag click, "Sort and Filter", quick search)
       still has the side filter panel eating width -- 2 per row instead
       of 3 so cards don't get squeezed. */
    .fp-bcard-grid--narrow { grid-template-columns: repeat(2, 1fr); }
    .fp-bcard {
      display: flex; flex-direction: row; cursor: pointer; overflow: hidden; position: relative; height: 250px;
      background: linear-gradient(160deg, rgba(10,8,14,0.86), rgba(10,8,14,0.76)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.22); border-radius: 14px;
      box-shadow: 0 1px 8px rgba(0,0,0,0.25); transition: border-color 0.15s, box-shadow 0.15s;
    }
    .fp-bcard:hover { border-color: rgba(240,192,96,0.5); box-shadow: 0 1px 8px rgba(0,0,0,0.25), 0 0 22px rgba(240,192,96,0.18); }
    /* Cover back on the left, natural 2:3 ratio sized off the card's fixed
       (thin) height -- full image, no crop, no zoom. */
    .fp-bcard-cover-link { width: auto; height: 100%; aspect-ratio: 2 / 3; flex-shrink: 0; display: block; overflow: hidden; position: relative; }
    .fp-bcard-cover-link img, .fp-bcard-cover-link .wiki-generated-cover { width: 100%; height: 100%; border-radius: 0; border: none; box-shadow: none; object-fit: cover; }
    .fp-bcard-body { min-width: 0; flex: 1; display: flex; flex-direction: column; padding: 0.65rem 0.85rem 0.6rem; overflow: hidden; }
    .fp-bcard-head { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .fp-bcard-title { font-size: 1.22rem; font-weight: 700; color: #fff; line-height: 1.15; text-shadow: 0 1px 3px rgba(0,0,0,0.4); }
    .fp-bcard-title:hover { text-shadow: 0 0 6px rgba(255,255,255,0.25), 0 1px 3px rgba(0,0,0,0.4); }
    .fp-bcard-title-deco { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; margin-left: 0.2rem; vertical-align: -2px; }
    .fp-bcard-author { display: inline-flex; align-items: center; gap: 0.35rem; text-decoration: none; }
    .fp-bcard-author:hover .fp-bcard-author-name { color: #7fa8d9; text-decoration: underline; }
    .fp-bcard-author-avatar, .fp-bcard-author-avatar-fallback { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .fp-bcard-author-avatar-fallback { display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 0.68rem; }
    .fp-bcard-author-name { font-size: 0.86rem; font-weight: 600; color: #ccc; }
    .fp-bcard-badges { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
    /* Rating colors are hard-pinned to a plain green/yellow/red
       traffic-light scheme here specifically (General/Mature/Explicit),
       separate from the site's usual green/gold/orange rating palette
       used elsewhere. */
    .fp-bcard-badges .fp-tag-pill { font-size: 0.85rem; padding: 0.36em 0.9em; font-weight: 800; }
    .fp-bcard-badges .fp-tag-pill--rating-general { background: rgba(90,200,110,0.18); color: #6fe08a; border-color: rgba(90,200,110,0.5); }
    .fp-bcard-badges .fp-tag-pill--rating-teen { background: rgba(240,192,96,0.18); color: #f5cf7c; border-color: rgba(240,192,96,0.5); }
    .fp-bcard-badges .fp-tag-pill--rating-mature { background: rgba(224,80,74,0.2); color: #ff8079; border-color: rgba(224,80,74,0.55); }
    .fp-tag-pill--status-ongoing { background: rgba(90,200,110,0.18); color: #6fe08a; border-color: rgba(90,200,110,0.5); }
    .fp-tag-pill--status-complete { background: rgba(127,168,217,0.2); color: #a8c6e8; border-color: rgba(127,168,217,0.5); }
    /* Stats -- three small individual boxes instead of one shared strip.
       Padding kept tight (not "thick") so the label text can run bigger
       without the box itself growing tall. */
    .fp-bcard-statpanel { display: flex; justify-content: center; gap: 0.35rem; margin-bottom: 0.4rem; }
    .fp-bcard-stat {
      flex: 1; min-width: 0; text-align: center; padding: 0.18rem 0.2rem;
      background: linear-gradient(160deg, rgba(240,192,96,0.12), rgba(127,168,217,0.08));
      border: 1px solid rgba(240,192,96,0.28); border-radius: 8px;
    }
    .fp-bcard-stat-val { display: block; font-size: 0.86rem; font-weight: 800; color: #f0c060; text-shadow: 0 0 8px rgba(240,192,96,0.4); }
    .fp-bcard-stat-label { display: block; font-size: 0.68rem; font-weight: 600; color: #ccc; margin-top: 0.02rem; }
    .fp-bcard-synopsis {
      font-size: 0.85rem; line-height: 1.42; color: #ddd; margin-bottom: 0.4rem;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    }
    /* Character teaser row -- always renders something (real chips or the
       "No Linked Characters" placeholder) so this slot's height is
       consistent whether or not a story has any characters tagged. */
    .fp-bcard-chars { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: auto; }
    .fp-bcard-char-chip {
      display: flex; align-items: center; gap: 0.35rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 0.2rem 0.65rem 0.2rem 0.2rem; font-size: 0.74rem; color: #ddd; font-weight: 600;
      text-decoration: none; transition: border-color 0.15s, color 0.15s;
    }
    .fp-bcard-char-chip:hover { border-color: #7fa8d9; color: #fff; }
    .fp-bcard-char-chip img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .fp-bcard-char-chip--empty { color: #888; cursor: default; font-style: italic; }
    .fp-bcard-char-chip--empty:hover { border-color: rgba(255,255,255,0.1); color: #888; }
    /* Sparkle accent -- decoration-8 tucked into the card's top-right
       corner, same treatment as the homepage Spotlight cards. */
    .fp-bcard-deco--tr { position: absolute; z-index: 2; pointer-events: none; object-fit: contain; opacity: 0.9; top: -10px; right: -8px; width: 32px; height: 32px; }

    .fp-search-empty { color: #ddd; font-size: 1rem; padding: 2rem 0; }
    .fp-pagination { display: flex; justify-content: center; gap: 0.6rem; margin-top: 2.5rem; }
    .fp-pagination button {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.25); color: #ddd; border-radius: 10px;
      padding: 0.55em 1.2em; cursor: pointer; font-family: inherit; font-size: 0.9rem;
    }
    .fp-pagination button:hover:not(:disabled) { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-pagination button:disabled { opacity: 0.4; cursor: default; }

    /* Numbered e621-style pager (Submissions) -- Story keeps the plain
       Previous/Next buttons above, styled by the generic rule. */
    .fp-page-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.18); color: #ccc; border-radius: 8px;
      min-width: 2.2rem; height: 2.2rem; padding: 0 0.5em; cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 600;
    }
    .fp-page-btn:hover:not(:disabled):not(.fp-page-btn--active) { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-page-btn:disabled { opacity: 0.35; cursor: default; }
    .fp-page-btn--active { background: #f0c060; border-color: #f0c060; color: #14121a; box-shadow: 0 0 16px rgba(240,192,96,0.65); }
    .fp-page-ellipsis { color: #777; padding: 0 0.2rem; font-size: 0.9rem; }
    /* Breathing room between the top pager and where the results actually
       start -- they used to sit right on top of each other. */
    #fp-pagination-top { margin-bottom: 1.75rem; }
    #fp-pagination-top:not([hidden]) { margin-top: 0.5rem; }

    /* ── Left-hand panel — just the three big section links (Story / Posts /
       Profiles) now -- the old "Current search" indicator + "Filter
       Search" toggle that used to sit pinned to the bottom moved out
       entirely (Quick Search relocated into the new Posts-view right-hand
       panel; the rest just isn't shown anywhere left-side anymore).
       Vertically centered in the sidebar's height instead of sitting at
       the top with a lot of empty space below, now that there's nothing
       left to pin to the bottom. Fully transparent so it reads as content
       sitting on the shared blurred wallpaper, same as the results
       column, but with a clearly visible right-hand border marking where
       it ends. Pinned flush against the topbar and the page's left/bottom
       edges via the negative-margin trick. */
    .fp-side-panel {
      grid-column: 1;
      position: sticky; top: 76px;
      margin-bottom: -5rem; margin-left: -2.5rem;
      height: calc(100vh - 76px); max-height: calc(100vh - 76px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: transparent; border-right: 1px solid rgba(255,255,255,0.14);
      padding: 2rem 1.5rem 3.5rem; overflow-y: auto;
      scrollbar-color: #444 transparent; /* Firefox */
    }
    /* Profiles specifically: bolder divider than the other tabs -- with
       the video background locked behind it and only this column plus
       the results panel visibly moving, the plain 1px/0.14-alpha line
       was too faint to read as a real boundary. */
    .fp-layout--profiles .fp-side-panel {
      border-right: 2px solid rgba(255,255,255,0.4);
      background: linear-gradient(175deg, rgba(14,12,20,0.75), rgba(14,12,20,0.68)), url('/images/home/box-background-3.png');
      background-size: cover; background-position: center;
    }
    .fp-side-panel::-webkit-scrollbar { width: 8px; }
    .fp-side-panel::-webkit-scrollbar-track { background: transparent; }
    .fp-side-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
    .fp-side-menu { display: flex; flex-direction: column; gap: 1.1rem; width: 100%; }
    /* Story starts already looking hovered/selected (it's the current
       section) via .fp-side-menu-item--active sharing the :hover rule.
       Submissions / Profiles get the same blue glow treatment the
       instant you hover them, and are real clickable links. Bigger and
       more spread out than before -- with the old bottom section (Filter
       Search/Current Search/Quick Search) gone, these three are the
       entire sidebar now and should actually fill the middle of it. */
    /* Always carries a soft blue glow on its outer shell now, not just on
       hover -- hover brightens it a bit further, and the active/selected
       item gets the strongest version so it unmistakably reads as "you are
       here" rather than just "hovered". */
    /* Blue glow instead of the old gold treatment -- hover gets a soft
       outer glow around the border so it reads as "lit up" rather than
       just a flat color swap, and the active/selected item keeps a
       stronger, permanent version of that same glow so it's unmistakably
       "you are here" even without hovering it. */
    /* Each item carries the same box-background art (cropped to a
       different region per item, same "PotentialBoxBackground" trick the
       homepage's boxed spotlight cards use) with a dark scrim under it
       instead of a flat color fill. The active/"you are here" item is the
       one distinguished by a gold border + glow now -- a brighter crop of
       the same art, not a plain solid-blue box like before. */
    .fp-side-menu-item {
      display: flex; align-items: center; gap: 1.1rem; width: 100%;
      color: #ccc; text-decoration: none; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(160deg, rgba(10,8,14,0.82), rgba(10,8,14,0.72)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      padding: 1.05em 1.15em;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    #fp-side-menu-story { background-position: 20% 30%; }
    #fp-side-menu-submissions { background-position: 60% 60%; }
    #fp-side-menu-profiles { background-position: 40% 80%; }
    .fp-side-menu-item:hover {
      color: #fff; border-color: rgba(127,168,217,0.7);
      box-shadow: 0 0 0 1px rgba(127,168,217,0.35), 0 0 22px rgba(127,168,217,0.35);
    }
    .fp-side-menu-item--active {
      color: #fff; font-weight: 700; border-color: rgba(240,192,96,0.85);
      box-shadow: 0 0 0 2px rgba(240,192,96,0.55), 0 0 34px rgba(240,192,96,0.6);
    }
    .fp-side-menu-item--active:hover {
      border-color: rgba(240,192,96,0.8);
      box-shadow: 0 0 0 1px rgba(240,192,96,0.55), 0 0 30px rgba(240,192,96,0.5);
    }
    .fp-side-menu-item--active .fp-side-menu-count { color: rgba(255,255,255,0.75); }
    .fp-side-menu-icon { font-size: 1.75rem; line-height: 1; flex-shrink: 0; }
    .fp-side-menu-text { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .fp-side-menu-label { font-size: 1.22rem; font-weight: 700; }
    .fp-side-menu-count {
      font-size: 0.74rem; font-weight: 600; color: #888; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .fp-side-menu-item:hover .fp-side-menu-count { color: #cfe0f5; }

    /* Quick-search box -- was the left panel's own, now reused by the
       Posts-view right-hand panel below instead. */
    .fp-side-search-wrap { position: relative; width: 100%; margin-bottom: 1rem; }
    .fp-side-search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: #888; pointer-events: none;
    }
    .fp-side-search-wrap input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px;
      color: #f0f0f0; font-family: inherit; font-size: 0.92rem; padding: 0.6em 0.9em 0.6em 2.4rem;
    }
    .fp-side-search-wrap input:focus { outline: none; border-color: #7fa8d9; }

    /* ── Right-hand "Sort and Filter" panel — sticks to the page,
       flush against the topbar above and the page bottom/right edge
       below (negative margins cancel .fp-layout's own padding on those
       sides). Collapses fully out of view (.fp-layout--filters-collapsed
       shrinks the grid column to 0) -- the floating .fp-filter-fab arrow
       (outside this element, so it survives the collapse) is the only
       thing left on screen to bring it back. ── */
    .fp-filter-panel {
      grid-column: 3;
      position: sticky; top: 76px;
      margin-bottom: -5rem; margin-right: -2.5rem;
      height: calc(100vh - 76px);
      display: flex; flex-direction: column;
      background: linear-gradient(175deg, rgba(14,12,20,0.88), rgba(14,12,20,0.82)), url('/images/home/box-background-3.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.14);
      padding: 1.5rem; max-height: calc(100vh - 76px); overflow-y: auto;
      scrollbar-color: #444 #1a1a1e; /* Firefox */
      /* Stops wheel scroll from chaining to the main page once you hit
         the top/bottom of this panel's own scroll -- hovering anywhere
         over it only ever scrolls the panel, never the page underneath. */
      overscroll-behavior: contain;
      contain: layout;
    }
    /* Corner sparkles on the boxed background, same decoration system as
       the rest of the site -- pointer-events:none + a negative z-index
       (the sticky panel establishes its own stacking context) so they sit
       above its background art but below every real static-flow control,
       never blocking a click. */
    .fp-filter-panel-deco { position: absolute; z-index: -1; pointer-events: none; object-fit: contain; opacity: 0.85; }
    .fp-filter-panel-deco--tl { top: 10px; left: 10px; width: 34px; height: 34px; }
    .fp-filter-panel-deco--br { bottom: 10px; right: 10px; width: 46px; height: 46px; }
    .fp-filter-panel::-webkit-scrollbar { width: 8px; }
    .fp-filter-panel::-webkit-scrollbar-track { background: #1a1a1e; border-radius: 8px; }
    .fp-filter-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
    .fp-filter-panel::-webkit-scrollbar-thumb:hover { background: #555; }
    .fp-layout--filters-collapsed .fp-filter-panel { display: none; }
    /* Floating round toggle, fixed to the viewport (not the panel) so it
       stays put and visible in both states. Vertically centered on
       screen; overlaps into the panel's left edge a bit while open, and
       tucks against the screen's right edge once collapsed. Reuses the
       chapter-editor's back chevron, just much bigger, rotating to show
       which way it'll move next. */
    .fp-filter-fab {
      /* Sits right at the screen edge, on the panel's own outer edge, in
         BOTH states now -- doesn't slide between two positions anymore,
         only the arrow direction flips. */
      position: fixed; top: 50%; right: 4px; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%; z-index: 60;
      background: #14121a; border: 1px solid rgba(255,255,255,0.28);
      color: #ccc; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 22px rgba(0,0,0,0.55);
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .fp-filter-fab svg { transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1); transform: rotate(180deg); }
    .fp-filter-fab:hover { color: #fff; border-color: rgba(127,168,217,0.6); box-shadow: 0 4px 26px rgba(127,168,217,0.4); }
    .fp-filter-fab--collapsed svg { transform: rotate(0deg); }
    .fp-filter-query {
      font-size: 0.85rem; color: #bbb; background: rgba(127,168,217,0.1); border: 1px solid rgba(127,168,217,0.3);
      border-radius: 10px; padding: 0.6em 0.85em; margin-bottom: 1.25rem;
    }
    .fp-filter-query strong { color: #a8c6e8; }
    .fp-filter-section { margin-bottom: 1.4rem; }
    .fp-filter-section-title { font-size: 1.3rem; font-weight: 700; color: #ddd; margin-bottom: 0.7rem; }

    /* ── Posts view's right panel — same sticky/flush treatment as
       .fp-filter-panel, just a bit thinner (no collapse fab -- there's
       nowhere near enough here to be worth hiding). ── */
    .fp-posts-panel {
      grid-column: 3;
      position: sticky; top: 76px;
      margin-bottom: -5rem; margin-right: -2.5rem;
      height: calc(100vh - 76px);
      flex-direction: column;
      background: linear-gradient(175deg, rgba(14,12,20,0.88), rgba(14,12,20,0.82)), url('/images/home/box-background-3.png');
      background-size: cover; background-position: center;
      border: 1px solid rgba(255,255,255,0.14);
      padding: 1.5rem; max-height: calc(100vh - 76px); overflow-y: auto;
      scrollbar-color: #444 #1a1a1e; /* Firefox */
      overscroll-behavior: contain;
      contain: layout;
    }
    .fp-posts-panel::-webkit-scrollbar { width: 8px; }
    .fp-posts-panel::-webkit-scrollbar-track { background: #1a1a1e; border-radius: 8px; }
    .fp-posts-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
    .fp-posts-count { font-size: 0.95rem; color: #ddd; margin-bottom: 1.25rem; }
    .fp-posts-count strong { color: #fff; }
    .fp-posts-panel input[type="text"] {
      width: 100%; background: #1a1a1e; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
      color: #f0f0f0; font-family: inherit; font-size: 0.98rem; padding: 0.6em 0.75em;
    }
    .fp-posts-panel input[type="text"]:focus { outline: none; border-color: #7fa8d9; }

    .fp-sort-select {
      width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
      color: #f0f0f0; font-family: inherit; font-size: 1.05rem; font-weight: 600; padding: 0.7em 0.8em;
      cursor: pointer;
    }
    .fp-sort-select:focus { outline: none; border-color: #7fa8d9; }
    /* The dropdown's own popup list is browser-native chrome CSS mostly
       can't touch, but Chrome/Edge/Firefox on Windows do honor colors
       set directly on <option> -- without this the list defaults to a
       plain white background that clashes with the rest of the panel. */
    .fp-sort-select option { background: #1a1a1e; color: #f0f0f0; }

    .fp-filter-details { border-top: 1px solid rgba(255,255,255,0.1); padding: 0.75rem 0; }
    .fp-filter-details summary {
      cursor: pointer; font-size: 1.15rem; font-weight: 600; color: #ddd; list-style: none;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .fp-filter-details summary::-webkit-details-marker { display: none; }
    .fp-filter-details summary::before { content: '▸'; font-size: 0.9rem; color: #888; transition: transform 0.15s; }
    .fp-filter-details[open] summary::before { transform: rotate(90deg); }
    .fp-filter-options { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.8rem; padding-left: 0.2rem; }
    .fp-filter-options label { display: flex; align-items: center; gap: 0.55rem; font-size: 1rem; color: #ccc; cursor: pointer; }

    .fp-filter-freeform-label { display: block; font-size: 0.92rem; color: #999; margin: 0.7rem 0 0.4rem; }
    .fp-filter-panel input[type="text"], .fp-filter-panel input[type="number"] {
      width: 100%; background: #1a1a1e; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
      color: #f0f0f0; font-family: inherit; font-size: 0.98rem; padding: 0.6em 0.75em;
    }
    .fp-filter-panel input:focus { outline: none; border-color: #7fa8d9; }
    .fp-filter-word-row { display: flex; align-items: center; gap: 0.5rem; }
    .fp-filter-word-row input { flex: 1; min-width: 0; }
    .fp-filter-word-row span { color: #888; }

    /* Same blue gradient + white Inter text as the story view's own
       "Edit <character name>" button. */
    .fp-filter-apply-btn {
      width: 100%; background: linear-gradient(135deg, #3d6fa8, #7fa8d9); color: #fff; border: none; border-radius: 20px;
      padding: 0.7em; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 0 16px rgba(127,168,217,0.5); transition: box-shadow 0.15s, transform 0.15s;
    }
    .fp-filter-apply-btn:hover { box-shadow: 0 0 26px rgba(127,168,217,0.75); transform: translateY(-1px); }
    .fp-filter-apply-btn--top { margin-bottom: 1.1rem; }
    .fp-filter-apply-btn--bottom { margin-top: auto; }

    @media (max-width: 980px) {
      /* Collapse doesn't make sense once everything's stacked in one
         column -- the panel always shows and the floating arrow hides. */
      .fp-layout, .fp-layout--filters-collapsed, .fp-layout--submissions, .fp-layout--profiles, .fp-layout--no-side { grid-template-columns: 1fr; row-gap: 1.5rem; }
      .fp-layout--profiles .fp-results-col { max-width: none; }
      .fp-bg-video-el--active { left: 0; width: 100%; }
      .fp-results-col { grid-column: 1; }
      .fp-filter-panel, .fp-layout--filters-collapsed .fp-filter-panel {
        grid-column: 1; display: flex;
        position: static; max-height: none; height: auto;
        margin-bottom: 0; margin-right: 0; border-radius: 18px;
      }
      .fp-filter-fab { display: none; }
      .fp-layout--submissions .fp-posts-panel {
        grid-column: 1;
        position: static; max-height: none; height: auto;
        margin-bottom: 0; margin-right: 0; border-radius: 18px;
      }
      .fp-side-panel {
        position: static; max-height: none; height: auto;
        margin-bottom: 0; margin-left: 0;
        padding: 1.5rem 0; border-right: none; border-bottom: 2px solid rgba(255,255,255,0.4);
      }
      .fp-results-list--grid { grid-template-columns: repeat(3, 1fr); }
      .fp-layout--profiles .fp-results-col { position: static; height: auto; overflow: visible; padding-right: 0; }
    }
    @media (max-width: 720px) {
      .fp-result { flex-direction: column; }

<body>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
window.fpFixLinks();

// Story/profile cards are clickable anywhere on their (transparent) area,
// not just the cover/title -- but a click on the cover, title, an author
// link, a tag pill, a character chip, or (on profile cards) the Follow
// button still goes to/does THAT instead, since those are real nested
// <a>/<button> elements.
document.addEventListener('click', (e) => {
  const card = e.target.closest('.fp-result[data-href], .fp-bcard[data-href], .fp-profile-card[data-href]');
  if (!card || e.target.closest('a, button')) return;
  window.location.href = card.dataset.href;
});
// Live result count under the "Story" left-panel link, for the current
// query. Profiles doesn't have a backing search yet, so it just shows a
// static description instead.
function setStoryMenuCount(text) {
  const el = document.getElementById('fp-side-menu-count-story');
  if (el) el.textContent = text;
}
function setSubmissionsMenuCount(text) {
  const el = document.getElementById('fp-side-menu-count-submissions');
  if (el) el.textContent = text;
}
function setProfilesMenuCount(text) {
  const el = document.getElementById('fp-side-menu-count-profiles');
  if (el) el.textContent = text;
}
// Every synopsis cuts at the same length so cards read as a uniform size —
// the fade (see .fp-result-synopsis mask) softens the hard stop visually.
function truncateSynopsis(s) {
  const text = (s || '').trim();
  if (!text) return 'No description yet.';
  return text.length > 500 ? text.slice(0, 500).trim() + '…' : text;
}
function ratingClass(rating) {
  if (rating === 'mature') return 'fp-tag-pill--rating-teen';
  if (rating === 'explicit') return 'fp-tag-pill--rating-mature';
  return 'fp-tag-pill--rating-general';
}
function ratingLabel(rating) {
  if (rating === 'mature') return 'Mature';
  if (rating === 'explicit') return 'Explicit';
  return 'General';
}
function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function tagSearchUrl(params) {
  const usp = new URLSearchParams(params);
  usp.set('sort', 'updated');
  return window.fpUrl(`/search?${usp.toString()}`);
}

function coverHtml(site) {
  return window.wikiGeneratedCoverHtml
    ? window.wikiGeneratedCoverHtml(site, { imgClass: 'fp-result-cover' })
    : `<img class="fp-result-cover" src="${site.cover_url || '/images/gallery/pixernbath_13.png'}" alt="" />`;
}

function authorRowHtml(w) {
  const avatar = w.author_avatar
    ? `<img class="fp-result-author-avatar" src="${escapeHtml(w.author_avatar)}" alt="" />`
    : `<span class="fp-result-author-avatar-fallback">${escapeHtml(((w.author || '?')[0] || '?').toUpperCase())}</span>`;
  return `
    <a class="fp-result-author" href="${window.fpUrl(`/${escapeHtml(w.author_username || '')}`)}">
      ${avatar}
      <span class="fp-result-author-name">by ${escapeHtml(w.author || 'Unknown')}</span>
    </a>
  `;
}

function tagsRowHtml(w) {
  const tags = [];
  if (w.rating) tags.push(`<a class="fp-tag-pill ${ratingClass(w.rating)}" href="${tagSearchUrl({ rating: w.rating })}">${escapeHtml(ratingLabel(w.rating))}</a>`);
  if (w.is_complete) tags.push(`<span class="fp-tag-pill fp-tag-pill--complete">Complete</span>`);
  (w.fandoms || []).forEach(f => tags.push(`<a class="fp-tag-pill fp-tag-pill--fandom" href="${tagSearchUrl({ fandoms: f })}">${escapeHtml(f)}</a>`));
  (w.relationships || []).forEach(r => tags.push(`<a class="fp-tag-pill fp-tag-pill--relationship" href="${tagSearchUrl({ relationships: r })}">${escapeHtml(r)}</a>`));
  (w.categories || []).forEach(c => tags.push(`<a class="fp-tag-pill fp-tag-pill--category" href="${tagSearchUrl({ categories: c })}">${escapeHtml(c)}</a>`));
  (w.tags || []).forEach(t => tags.push(`<a class="fp-tag-pill fp-tag-pill--tag" href="${tagSearchUrl({ tags_include: t })}">${escapeHtml(t)}</a>`));
  return tags.length ? `<div class="fp-tag-row">${tags.join('')}</div>` : '';
}

function charsRowHtml(w) {
  const chars = w.characters || [];
  if (!chars.length) return '';
  return `
    <div class="fp-result-chars">
      ${chars.map(c => `<a class="fp-result-char-chip" href="${window.fpUrl(`/${encodeURIComponent(c.owner_username)}?char=${c.id}#characters`)}"><img src="${escapeHtml(c.ref_image || '/images/defaultchar.jpg')}" alt="" />${escapeHtml(c.name)}</a>`).join('')}
    </div>
  `;
}

// ── Browse ("Recent Stories") card -- separate markup from resultCard()
// entirely (own fp-bcard-* classes) since the shape diverges too much to
// keep sharing templates: badges instead of a tag row, a stat panel, and
// an always-present character teaser slot (real chips or a placeholder).
function bcardAuthorHtml(w) {
  const avatar = w.author_avatar
    ? `<img class="fp-bcard-author-avatar" src="${escapeHtml(w.author_avatar)}" alt="" />`
    : `<span class="fp-bcard-author-avatar-fallback">${escapeHtml(((w.author || '?')[0] || '?').toUpperCase())}</span>`;
  return `
    <a class="fp-bcard-author" href="${window.fpUrl(`/${escapeHtml(w.author_username || '')}`)}">
      ${avatar}
      <span class="fp-bcard-author-name">by ${escapeHtml(w.author || 'Unknown')}</span>
    </a>
  `;
}
function bcardCharsHtml(w) {
  const chars = w.characters || [];
  if (!chars.length) {
    return `
      <div class="fp-bcard-chars">
        <span class="fp-bcard-char-chip fp-bcard-char-chip--empty"><img src="/images/defaultchar.jpg" alt="" />No Linked Characters</span>
      </div>
    `;
  }
  return `
    <div class="fp-bcard-chars">
      ${chars.map(c => `<a class="fp-bcard-char-chip" href="${window.fpUrl(`/${encodeURIComponent(c.owner_username)}?char=${c.id}#characters`)}"><img src="${escapeHtml(c.ref_image || '/images/defaultchar.jpg')}" alt="" />${escapeHtml(c.name)}</a>`).join('')}
    </div>
  `;
}
function browseResultCard(w) {
  const isComplete = !!w.is_complete;
  return `
    <div class="fp-bcard" data-href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">
      <a class="fp-bcard-cover-link" href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">${coverHtml(w)}</a>
      <img class="fp-bcard-deco--tr" src="/images/home/decoration-8.png" alt="" />
      <div class="fp-bcard-body">
        <div class="fp-bcard-head">
          <a class="fp-bcard-title" href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">${escapeHtml(w.site_title || 'Untitled Story')}<img class="fp-bcard-title-deco" src="/images/home/decoration-1.png" alt="" /></a>
          ${bcardAuthorHtml(w)}
        </div>
        <div class="fp-bcard-badges">
          ${w.rating ? `<a class="fp-tag-pill ${ratingClass(w.rating)}" href="${tagSearchUrl({ rating: w.rating })}">${escapeHtml(ratingLabel(w.rating))}</a>` : ''}
          <a class="fp-tag-pill ${isComplete ? 'fp-tag-pill--status-complete' : 'fp-tag-pill--status-ongoing'}" href="${tagSearchUrl({ completion: isComplete ? 'complete' : 'wip' })}">${isComplete ? 'Complete' : 'Ongoing'}</a>
        </div>
        <div class="fp-bcard-statpanel">
          <div class="fp-bcard-stat"><span class="fp-bcard-stat-val">${(w.hits || 0).toLocaleString()}</span><span class="fp-bcard-stat-label">👁 Reads</span></div>
          <div class="fp-bcard-stat"><span class="fp-bcard-stat-val">${(w.kudos || 0).toLocaleString()}</span><span class="fp-bcard-stat-label">❤️ Likes</span></div>
          <div class="fp-bcard-stat"><span class="fp-bcard-stat-val">${w.word_count != null ? w.word_count.toLocaleString() : '—'}</span><span class="fp-bcard-stat-label">📖 Words</span></div>
        </div>
        <p class="fp-bcard-synopsis">${escapeHtml(truncateSynopsis(w.synopsis))}</p>
        ${bcardCharsHtml(w)}
      </div>
    </div>
  `;
}

function resultCard(w) {
  return `
    <div class="fp-result" data-href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">
      <a class="fp-result-cover-link" href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">${coverHtml(w)}</a>
      <div class="fp-result-body">
        <div class="fp-result-title-row">
          <a class="fp-result-title" href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">${escapeHtml(w.site_title || 'Untitled Story')}</a>
          ${w.created_at ? `<span class="fp-result-date">${formatDate(w.created_at)}</span>` : ''}
        </div>
        ${authorRowHtml(w)}
        ${tagsRowHtml(w)}
        <p class="fp-result-synopsis">${escapeHtml(truncateSynopsis(w.synopsis))}</p>
        ${charsRowHtml(w)}
        <div class="fp-result-stats">
          ${w.word_count != null ? `<span>Words: <strong>${w.word_count.toLocaleString()}</strong></span>` : ''}
          <span>👁 <strong>${(w.hits || 0).toLocaleString()}</strong></span>
          <span>⭐ <strong>${(w.kudos || 0).toLocaleString()}</strong></span>
          <span>💬 <strong>${(w.comments || 0).toLocaleString()}</strong></span>
          <span>🔖 <strong>${(w.bookmarks || 0).toLocaleString()}</strong></span>
        </div>
      </div>
    </div>
  `;
}


function bookmarkCard(w) {
  return `
    <div class="fp-result">
      <a class="fp-result-cover-link" href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">${coverHtml(w)}</a>
      <div class="fp-result-body">
        <a class="fp-result-title" href="${window.fpUrl(`/${escapeHtml(w.story_path)}`)}">${escapeHtml(w.site_title || 'Untitled Story')}</a>
        ${authorRowHtml(w)}
        <p class="fp-result-synopsis">${escapeHtml(truncateSynopsis(w.synopsis))}</p>
        <div class="fp-result-stats"><span>Bookmarked <strong>${formatDate(w.bookmarked_at)}</strong></span></div>
      </div>
    </div>
  `;
}

// ── Submissions view — gallery posts + chapter postings, laid out as the
// same justified photo-wall as the Fanpage Hub's "Recent Submissions" box
// (fanpages/index.html), just as the full paginated listing instead of a
// 3-row teaser. ──────────────────────────────────────────────────────────
function rsCaptionHtml(href, title, authorUsername, author) {
  return `
    <div class="rs-card-caption">
      <a class="rs-card-caption-title" href="${href}">${escapeHtml(title)}</a>
      <span class="rs-card-caption-author">by ${authorUsername ? `<a href="${window.fpUrl(`/${encodeURIComponent(authorUsername)}`)}">${escapeHtml(author || authorUsername)}</a>` : escapeHtml(author || 'Unknown')}</span>
    </div>
  `;
}
function submissionCard(it) {
  const tile = document.createElement('div');
  tile.className = 'rs-tile';
  const a = document.createElement('a');
  a.className = 'rs-card';
  const posX = it.position_x != null ? it.position_x : 50;
  const posY = it.position_y != null ? it.position_y : 50;
  if (it.type === 'art') {
    a.href = window.fpUrl(`/gallery-post?id=${it.id}`);
    a.innerHTML = `
      <img src="${escapeHtml(it.image)}" alt="" style="object-position:${posX}% ${posY}%;" />
      <span class="rs-card-badge">🎨</span>
    `;
    tile.appendChild(a);
    tile.insertAdjacentHTML('beforeend', rsCaptionHtml(a.href, it.title || 'Untitled', it.author_username, it.author));
    return tile;
  }
  // Chapter — a chapter card's "image" is really the story's own cover;
  // when there isn't one, fall back to the same generated purple/rose
  // book cover the Story tab's results already use.
  a.href = window.fpUrl(`/${escapeHtml(it.story_path)}/reader?ch=${it.id}`);
  if (it.image) {
    a.innerHTML = `
      <img src="${escapeHtml(it.image)}" alt="" style="object-position:${posX}% ${posY}%;" />
      <span class="rs-card-badge">📖</span>
    `;
  } else {
    a.innerHTML = `<span class="rs-card-badge">📖</span>`;
    if (window.wikiGeneratedCoverHtml) {
      a.insertAdjacentHTML('afterbegin', window.wikiGeneratedCoverHtml({ site_title: it.site_title, author_avatar: it.author_avatar }, {}));
    }
  }
  tile.appendChild(a);
  tile.insertAdjacentHTML('beforeend', rsCaptionHtml(a.href, it.title || 'Untitled Chapter', it.author_username, it.author));
  return tile;
}

// e621-style numbered pager, shared by Submissions (top and bottom). Always
// renders even with a single page -- prev/next just end up disabled -- so
// the page-number UI stays put instead of popping in and out.
function paginationHtml(page, totalPages) {
  const pageSet = new Set([1, totalPages, page]);
  for (let i = page - 2; i <= page + 2; i++) if (i >= 1 && i <= totalPages) pageSet.add(i);
  const sorted = [...pageSet].sort((a, b) => a - b);
  let html = `<button type="button" class="fp-page-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
  let prev = 0;
  sorted.forEach(p => {
    if (p - prev > 1) html += '<span class="fp-page-ellipsis">…</span>';
    html += `<button type="button" class="fp-page-btn${p === page ? ' fp-page-btn--active' : ''}" data-page="${p}">${p}</button>`;
    prev = p;
  });
  html += `<button type="button" class="fp-page-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''} aria-label="Next page">›</button>`;
  return html;
}
function wirePagination(el) {
  el.querySelectorAll('.fp-page-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const usp = new URLSearchParams(window.location.search);
      usp.set('page', btn.dataset.page);
      window.location.search = usp.toString();
    });
  });
}

const POSTS_RATING_VALUES = ['sfw', 'mature', 'explicit'];

// Posts view's right panel -- results count, current-search reminder,
// quick search (prefilled), sort, ratings checklist, and an exclude-keyword
// field. Nothing here navigates the instant you touch it anymore -- every
// control just updates its own state, and either hitting Enter in the
// Quick Search/Exclude boxes or clicking "Sort and Filter" applies
// everything that's currently set (search box + exclude + sort + ratings)
// in one navigation, same as the Story filter panel's own "Sort and
// Filter" button.
function wirePostsPanel(q, sort, ratings, exclude) {
  document.getElementById('fp-posts-query-text').textContent = q ? `"${q}"` : 'Everything';

  const searchInput = document.getElementById('fp-posts-search-input');
  searchInput.value = q;
  const excludeInput = document.getElementById('fp-posts-exclude-input');
  excludeInput.value = exclude;
  const sortSelect = document.getElementById('fp-posts-sort');
  sortSelect.value = sort;
  document.querySelectorAll('#fp-posts-ratings input').forEach(cb => { cb.checked = ratings.includes(cb.value); });

  const applyPostsFilters = () => {
    const usp = new URLSearchParams(window.location.search);
    if (searchInput.value.trim()) usp.set('q', searchInput.value.trim()); else usp.delete('q');
    if (excludeInput.value.trim()) usp.set('exclude', excludeInput.value.trim()); else usp.delete('exclude');
    usp.set('sort', sortSelect.value);
    const checked = Array.from(document.querySelectorAll('#fp-posts-ratings input:checked')).map(c => c.value);
    // All three checked reads the same as no filter at all -- drop the
    // param entirely instead of writing out the full list every time.
    if (checked.length === POSTS_RATING_VALUES.length) usp.delete('ratings');
    else usp.set('ratings', checked.join(','));
    usp.delete('page');
    window.location.search = usp.toString();
  };

  searchInput.onkeydown = (e) => { if (e.key === 'Enter') applyPostsFilters(); };
  excludeInput.onkeydown = (e) => { if (e.key === 'Enter') applyPostsFilters(); };
  document.getElementById('fp-posts-apply').onclick = applyPostsFilters;
}

async function runSubmissionsSearch() {
  const resultsEl = document.getElementById('fp-search-results');
  const subEl = document.getElementById('fp-search-sub');
  const countEl = document.getElementById('fp-posts-count');
  const topEl = document.getElementById('fp-pagination-top');
  const bottomEl = document.getElementById('fp-pagination');
  resultsEl.innerHTML = '<p class="fp-search-empty">Loading…</p>';
  topEl.hidden = true; bottomEl.hidden = true;

  const p = new URLSearchParams(window.location.search);
  const q = p.get('q') || '';
  const page = Math.max(1, parseInt(p.get('page'), 10) || 1);
  // Browse -> Posts opens as "Recent Submissions" (newest first), not a
  // relevance-ranked search -- the Sort dropdown should default to
  // matching that instead of showing "Best Match" while actually sorted
  // by date. A plain Posts search (no browse=1) still defaults to
  // best_match same as Stories/Profiles.
  const sort = p.get('sort') || (isBrowseMode ? 'updated' : 'best_match');
  const ratingsParam = p.get('ratings');
  const ratings = ratingsParam ? ratingsParam.split(',').filter(r => POSTS_RATING_VALUES.includes(r)) : POSTS_RATING_VALUES.slice();
  const exclude = p.get('exclude') || '';
  const limit = 30;

  wirePostsPanel(q, sort, ratings, exclude);

  try {
    const apiParams = new URLSearchParams({ q, page, limit, sort });
    if (ratingsParam) apiParams.set('ratings', ratings.join(','));
    if (exclude) apiParams.set('exclude', exclude);
    const res = await fetch(`/api/search/submissions?${apiParams.toString()}`, { headers: authHeaders() });
    const data = await res.json();
    const items = data.items || [];
    countEl.innerHTML = `<strong>${data.total || 0}</strong> post${data.total === 1 ? '' : 's'} found${q ? ` for "${escapeHtml(q)}"` : ''}.`;
    subEl.innerHTML = `<strong>${data.total || 0}</strong> post${data.total === 1 ? '' : 's'} found — sorted by ${escapeHtml(POSTS_SORT_LABELS[sort] || 'Best Match')}. ${pageLabelHtml('Posts')}`;
    setSubmissionsMenuCount(`${data.total || 0} post${(data.total || 0) === 1 ? '' : 's'}${q ? ` for "${q}"` : ''}`);

    resultsEl.classList.add('fp-results-list--grid');
    if (!items.length) {
      resultsEl.innerHTML = '<p class="fp-search-empty">No posts match that search.</p>';
      syncPostsBgHeight();
      return;
    }

    resultsEl.innerHTML = '';
    items.forEach(it => resultsEl.appendChild(submissionCard(it)));

    const totalPages = Math.max(1, Math.ceil((data.total || 0) / limit));
    const pagHtml = paginationHtml(page, totalPages);
    topEl.hidden = false; topEl.innerHTML = pagHtml; wirePagination(topEl);
    bottomEl.hidden = false; bottomEl.innerHTML = pagHtml; wirePagination(bottomEl);
    syncPostsBgHeight();
    // Card thumbnails loading in can grow the page after this point.
    resultsEl.querySelectorAll('img').forEach(img => img.addEventListener('load', syncPostsBgHeight, { once: true }));
  } catch {
    resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load posts right now.</p>';
  }
}

// ── Profiles view — accounts + characters, tabbed, matching every
// space-separated keyword in the query (AND, not OR — enforced server-side
// via bool_and() over the unnested word list). Condensed to a centered
// column instead of the full-width layouts Story/Submissions use. ────────
function accountCardHtml(u) {
  const avatar = u.avatar
    ? `<img class="fp-profile-avatar" src="${escapeHtml(u.avatar)}" alt="" />`
    : `<span class="fp-profile-avatar-fallback">${escapeHtml((u.display_name[0] || '?').toUpperCase())}</span>`;
  const followBtn = u.is_self ? '' : `
    <button class="fp-profile-follow-btn${u.is_following ? ' fp-profile-follow-btn--following' : ''}"
            data-username="${escapeHtml(u.username)}" data-following="${u.is_following ? '1' : '0'}" type="button">
      ${u.is_following ? '✓ Following' : '+ Follow'}
    </button>
  `;
  return `
    <div class="fp-profile-card" data-href="${window.fpUrl(`/${escapeHtml(u.username)}`)}">
      <img class="fp-profile-card-deco" src="/images/home/decoration-8.png" alt="" />
      <a href="${window.fpUrl(`/${escapeHtml(u.username)}`)}">${avatar}</a>
      <div class="fp-profile-info">
        <a class="fp-profile-name" href="${window.fpUrl(`/${escapeHtml(u.username)}`)}">${escapeHtml(u.display_name)}</a>
        <p class="fp-profile-handle">@${escapeHtml(u.username)}</p>
        <div class="fp-profile-stats">
          <span><strong>${(u.story_count || 0).toLocaleString()}</strong> Stories</span>
          <span><strong>${(u.following_count || 0).toLocaleString()}</strong> Following</span>
          <span><strong>${(u.follower_count || 0).toLocaleString()}</strong> Followers</span>
          <span><strong>${(u.club_count || 0).toLocaleString()}</strong> Clubs</span>
        </div>
      </div>
      ${followBtn}
    </div>
  `;
}
function wireFollowButtons() {
  document.querySelectorAll('.fp-profile-follow-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!token) { window.fpRequireSignIn('To follow this user, you must create an account!'); return; }
      const username = btn.dataset.username;
      const following = btn.dataset.following === '1';
      btn.disabled = true;
      try {
        const res = await fetch(`/api/follows/${encodeURIComponent(username)}`, { method: following ? 'DELETE' : 'POST', headers: authHeaders() });
        if (res.ok) {
          btn.dataset.following = following ? '0' : '1';
          btn.classList.toggle('fp-profile-follow-btn--following', !following);
          btn.textContent = following ? '+ Follow' : '✓ Following';
        }
      } catch {}
      btn.disabled = false;
    });
  });
}
// Accounts only now -- Characters used to have its own sub-tab here, which
// is what made the sidebar's "Profiles" preview count (accounts+characters
// combined) read as a confusing, seemingly-wrong number.
async function runProfilesSearch() {
  const resultsEl = document.getElementById('fp-search-results');
  const subEl = document.getElementById('fp-search-sub');
  const paginationEl = document.getElementById('fp-pagination');
  paginationEl.hidden = true;

  const p = new URLSearchParams(window.location.search);
  const q = p.get('q') || '';
  const page = Math.max(1, parseInt(p.get('page'), 10) || 1);
  const limit = 30;

  resultsEl.innerHTML = '<p class="fp-search-empty">Loading…</p>';

  try {
    const res = await fetch(`/api/search/profiles?q=${encodeURIComponent(q)}&type=accounts&page=${page}&limit=${limit}`, { headers: authHeaders() });
    const data = await res.json();
    const items = data.items || [];
    const totalLabel = data.total_capped ? `${data.total}+` : String(data.total || 0);
    subEl.innerHTML = `<strong>${totalLabel}</strong> account${data.total === 1 ? '' : 's'} found${q ? ` for "${escapeHtml(q)}"` : ''}. ${pageLabelHtml('Profiles')}`;
    setProfilesMenuCount(`${totalLabel} account${(data.total || 0) === 1 ? '' : 's'}${q ? ` for "${q}"` : ''}`);

    resultsEl.innerHTML = !items.length
      ? `<p class="fp-search-empty">No accounts match that search.</p>`
      : items.map(accountCardHtml).join('');
    wireFollowButtons();

    const totalPages = Math.max(1, Math.ceil((data.total || 0) / limit));
    if (totalPages > 1) {
      paginationEl.hidden = false;
      paginationEl.innerHTML = `
        <button id="fp-page-prev" ${page <= 1 ? 'disabled' : ''}>← Previous</button>
        <span style="align-self:center; color:#ddd; font-size:0.88rem;">Page ${page} of ${totalPages}</span>
        <button id="fp-page-next" ${page >= totalPages ? 'disabled' : ''}>Next →</button>
      `;
      const goPage = (pp) => { const usp = new URLSearchParams(window.location.search); usp.set('page', pp); window.location.search = usp.toString(); };
      if (page > 1) document.getElementById('fp-page-prev').addEventListener('click', () => goPage(page - 1));
      if (page < totalPages) document.getElementById('fp-page-next').addEventListener('click', () => goPage(page + 1));
    }
  } catch {
    resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load profiles right now.</p>';
  }
}

const SORT_LABELS = { best_match: 'Best Match', updated: 'Date Updated', kudos: 'Likes', hits: 'Reads' };
const POSTS_SORT_LABELS = { best_match: 'Best Match', updated: 'Date Updated', likes: 'Most Likes', views: 'Most Views', popular: 'Popular' };
// Small "· Stories/Posts/Profiles" tag appended after the results-found
// line at the top of every tab, so it's always clear which one you're on
// even before glancing at the left nav.
function pageLabelHtml(name) {
  return `<span class="fp-search-page-label">· ${escapeHtml(name)}</span>`;
}

function readParamsFromUrl() {
  const p = new URLSearchParams(window.location.search);
  return {
    q: p.get('q') || '',
    fandoms: p.get('fandoms') || '',
    relationships: p.get('relationships') || '',
    rating: p.get('rating') || '',
    tags_include: p.get('tags_include') || '',
    tags_exclude: p.get('tags_exclude') || '',
    categories: p.get('categories') || '',
    word_min: p.get('word_min') || '',
    word_max: p.get('word_max') || '',
    completion: p.get('completion') || 'all',
    sort: p.get('sort') || '',
    page: parseInt(p.get('page'), 10) || 1,
  };
}

function applyParamsToPanel(f) {
  document.getElementById('fp-story-search-input').value = f.q || '';
  document.getElementById('f-sort').value = f.sort || 'best_match';
  document.getElementById('f-fandoms').value = f.fandoms;
  document.getElementById('f-relationships').value = f.relationships;
  document.getElementById('f-tags-include').value = f.tags_include;
  document.getElementById('f-tags-exclude').value = f.tags_exclude;
  document.getElementById('f-word-min').value = f.word_min;
  document.getElementById('f-word-max').value = f.word_max;
  const ratingInput = document.querySelector(`#f-rating-options input[value="${CSS.escape(f.rating)}"]`);
  if (ratingInput) ratingInput.checked = true;
  const cats = f.categories ? f.categories.split(',') : [];
  document.querySelectorAll('#f-categories input').forEach(cb => { cb.checked = cats.includes(cb.value); });
  document.querySelectorAll('#f-completion input').forEach(r => { r.checked = r.value === f.completion; });

  // Exact-tag filters (fandoms/tags/relationships/categories/rating) get a
  // "<tag> @X" marker so it's obvious this is a narrowed exact-match search,
  // not the fuzzy keyword search a plain "X" would imply.
  const queryBits = [];
  if (f.q) queryBits.push(`"${f.q}"`);
  ['fandoms', 'tags_include', 'relationships', 'categories'].forEach(key => {
    if (f[key]) f[key].split(',').filter(Boolean).forEach(v => queryBits.push(`<tag> @${v}`));
  });
  if (f.rating) queryBits.push(`<tag> @${f.rating}`);
  const queryText = queryBits.length ? queryBits.join(', ') : 'Everything';
  document.getElementById('fp-filter-query-text').textContent = queryText;
}

function collectPanelParams() {
  const params = {};
  const q = document.getElementById('fp-story-search-input').value.trim();
  if (q) params.q = q;
  params.sort = document.getElementById('f-sort').value;
  const fandoms = document.getElementById('f-fandoms').value.trim();
  if (fandoms) params.fandoms = fandoms;
  const relationships = document.getElementById('f-relationships').value.trim();
  if (relationships) params.relationships = relationships;
  const rating = document.querySelector('#f-rating-options input:checked').value;
  if (rating) params.rating = rating;
  const tagsInclude = document.getElementById('f-tags-include').value.trim();
  if (tagsInclude) params.tags_include = tagsInclude;
  const tagsExclude = document.getElementById('f-tags-exclude').value.trim();
  if (tagsExclude) params.tags_exclude = tagsExclude;
  const cats = [...document.querySelectorAll('#f-categories input:checked')].map(c => c.value);
  if (cats.length) params.categories = cats.join(',');
  const wordMin = document.getElementById('f-word-min').value;
  if (wordMin) params.word_min = wordMin;
  const wordMax = document.getElementById('f-word-max').value;
  if (wordMax) params.word_max = wordMax;
  const completion = document.querySelector('#f-completion input:checked').value;
  if (completion !== 'all') params.completion = completion;
  return params;
}

async function loadCatalogsForAutocomplete() {
