<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      /* Reserves the scrollbar's width up front so the page doesn't get
         narrower the instant a scrollbar appears (which happens right as
         you start scrolling, once results have loaded in taller than one
         screen) — that width change was the "jerk" shoving the sticky
         right-hand panel sideways. */
      scrollbar-gutter: stable;
    }
    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Baloo 2', 'Fredoka', 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* Blurred wallpaper behind everything — z-index:0 background layers,
       real content explicitly promoted to z-index:1, same convention used
       for every other custom-background page on the site. */
    .fp-bg-img {
      position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
      filter: blur(18px) brightness(0.55); z-index: 0;
    }
    .fp-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.45); z-index: 0; }
    .fp-content-z { position: relative; z-index: 1; }

    .fp-search-sub { color: #ccc; font-size: 0.95rem; margin: 1.75rem 0 0.85rem; }
    .fp-search-sub strong { color: #fff; }

    /* The collapse toggle animates the third column's width between
       340px (open) and 0 (fully collapsed) -- pushing/pulling the rest
       of the page as it goes. */
    .fp-layout {
      padding: 0 2.5rem 5rem;
      display: grid; grid-template-columns: 290px 1fr 340px; column-gap: 2rem; align-items: stretch;
      transition: grid-template-columns 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: grid-template-columns;
    }
    /* Left column (290px) matches the base state exactly -- it used to
       jump to 320px here, so the left panel visibly shifted too every
       time the right panel collapsed/expanded instead of only the right
       column moving. contain:layout on both side panels scopes their
       reflow cost during the animation instead of the whole page
       recalculating layout every frame, which is what read as "jittery". */
    .fp-layout--filters-collapsed { grid-template-columns: 290px 1fr 0px; }
    .fp-results-col { grid-column: 2; min-width: 0; contain: layout; }

    /* ── Submissions view — the filter panel/fab/left-panel filter box
       don't apply here (no story filters for a gallery+chapter feed), so
       they're hidden entirely and the results column reclaims that space
       (2 columns instead of 3) rather than leaving it as dead space. ── */
    .fp-layout--submissions { grid-template-columns: 290px 1fr; }
    .fp-layout--submissions .fp-filter-panel,
    .fp-layout--submissions .fp-filter-fab,
    .fp-layout--submissions .fp-side-bottom { display: none; }

    /* ── Browse mode (?browse=1, reached via the nav's Browse dropdown
       instead of the left Story/Submissions/Profiles panel) — no left
       panel, no right filter panel either; just a plain full-width
       "Recent Stories"/"Recent Submissions" feed, AO3-style. ── */
    /* AO3-style "Recent Works" feed — no left panel, no right filter panel,
       just the results filling the full width. (Story-browse used to keep
       the right filter panel/collapse-arrow here; that's gone now per a
       later revision — browse is a plain full-width recent feed, not a
       filterable one.) */
    .fp-layout--no-side { grid-template-columns: 1fr; }
    .fp-layout--no-side .fp-side-panel,
    .fp-layout--no-side .fp-filter-panel,
    .fp-layout--no-side .fp-filter-fab { display: none; }
    .fp-layout--no-side .fp-results-col { grid-column: 1; }
    .fp-browse-heading {
      font-family: 'Cinzel', Georgia, serif; font-size: 1.7rem; font-weight: 700; color: #fff;
      margin: 1.75rem 0 0.5rem;
    }

    /* Justified photo-wall grid — ported from the Fanpage Hub's "Recent
       Submissions" box (fanpages/index.html: rs-grid/rs-row/rs-card),
       same card look/hover-reveal-title behavior, just not capped to 3
       rows here since this is the real full listing, not a teaser. */
    .rs-tile { display: flex; flex-direction: column; min-width: 0; }
    .rs-card {
      position: relative; display: block; text-decoration: none; color: inherit;
      border-radius: 8px; overflow: hidden; background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.08); transition: transform 0.15s, box-shadow 0.15s;
      aspect-ratio: 6 / 7;
    }
    .rs-card:hover { transform: translateY(-4px); box-shadow: 0 10px 26px rgba(0,0,0,0.45); z-index: 3; }
    .rs-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rs-card .wiki-generated-cover { width: 100%; height: 100%; border-radius: 0; border: none; }
    /* Just the emoji, bigger, sitting bottom-right of the tile -- no
       circular backing plate. */
    .rs-card-badge {
      position: absolute; bottom: 6px; right: 7px; z-index: 2;
      font-size: 1.35rem; line-height: 1; text-shadow: 0 1px 5px rgba(0,0,0,0.85);
    }
    /* Always-visible caption under the tile (title + "by <author>"),
       FurAffinity-style, instead of a hover-only overlay -- centered under
       the thumbnail, title itself clickable (same destination as the
       image) and colored like FA's link blue instead of plain white. */
    .rs-card-caption { padding: 0.5rem 0.05rem 0; min-width: 0; text-align: center; }
    .rs-card-caption-title {
      display: block; font-size: 0.86rem; font-weight: 700; color: #6fb3e0; text-decoration: none;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rs-card-caption-title:hover { color: #96cbef; text-decoration: underline; }
    .rs-card-caption-author { display: block; font-size: 0.78rem; color: #999; margin-top: 0.15rem; }
    .rs-card-caption-author a { color: #a8c6e8; text-decoration: none; }
    .rs-card-caption-author a:hover { text-decoration: underline; }

    /* ── Profiles view — same "no filter panel" idea as Submissions, but
       results are condensed to a centered column instead of stretching
       full width (a wall of skinny profile rows edge-to-edge would be
       much harder to scan than a photo grid is). ── */
    .fp-layout--profiles { grid-template-columns: 290px 1fr; }
    .fp-layout--profiles .fp-filter-panel,
    .fp-layout--profiles .fp-filter-fab,
    .fp-layout--profiles .fp-side-bottom { display: none; }
    .fp-layout--profiles .fp-results-col { max-width: 680px; margin: 0 auto; }

    .fp-profile-tabs { display: flex; gap: 2rem; border-bottom: 1px solid rgba(255,255,255,0.14); margin-bottom: 1.5rem; }
    .fp-profile-tab {
      background: none; border: none; cursor: pointer;
      font-family: inherit; font-size: 1.1rem; font-weight: 800; color: #999;
      padding: 0 0 0.7rem; border-bottom: 3px solid transparent; margin-bottom: -1px;
    }
    .fp-profile-tab:hover { color: #ddd; }
    .fp-profile-tab--active { color: #fff; border-bottom-color: #7fa8d9; }

    .fp-profile-card {
      display: flex; align-items: center; gap: 1.3rem; padding: 1.6rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.55);
    }
    .fp-profile-avatar, .fp-profile-avatar-fallback {
      width: 76px; height: 76px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .fp-profile-avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.4rem;
    }
    .fp-profile-char-ref, .fp-profile-char-ref-fallback {
      width: 62px; height: 78px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
    }
    .fp-profile-char-ref-fallback {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 1.4rem;
    }
    .fp-profile-info { min-width: 0; flex: 1; }
    .fp-profile-name { font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none; }
    .fp-profile-name:hover { text-decoration: underline; }
    .fp-profile-handle { font-size: 0.88rem; color: #999; margin-top: 0.1rem; }
    .fp-profile-stats { display: flex; flex-wrap: wrap; gap: 0.3rem 1.1rem; margin-top: 0.5rem; font-size: 0.82rem; color: #999; }
    .fp-profile-stats strong { color: #eee; }
    .fp-profile-follow-btn {
      flex-shrink: 0; display: flex; align-items: center; gap: 0.4rem;
      background: linear-gradient(135deg, #3d6fa8, #7fa8d9); color: #fff; border: none; border-radius: 20px;
      padding: 0.55em 1.1em; font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 0 12px rgba(127,168,217,0.4); transition: box-shadow 0.15s, transform 0.15s, background 0.15s;
    }
    .fp-profile-follow-btn:hover { box-shadow: 0 0 20px rgba(127,168,217,0.65); transform: translateY(-1px); }
    .fp-profile-follow-btn--following { background: rgba(255,255,255,0.08); box-shadow: none; }
    .fp-profile-follow-btn--following:hover { background: rgba(217,122,114,0.2); color: #e69a92; box-shadow: none; }

    /* ── Result rows — no card box, just a horizontal rule between each ── */
    .fp-results-list { display: flex; flex-direction: column; }
    /* Submissions view -- fixed-size tiles (the exact crop the uploader
       picked in the editor), not a variable-size justified photo wall.
       Bigger than the old justified-grid target height, e621-style. */
    .fp-results-list--grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .fp-result {
      display: flex; gap: 1.75rem; padding: 1.85rem 0; cursor: pointer;
      border-bottom: 1px solid rgba(0,0,0,0.55); transition: background 0.12s;
    }
    .fp-result:hover { background: rgba(255,255,255,0.02); }
    /* display:flex + align-items:center here (this wrapper gets stretched
       to the full row height by .fp-result's default align-items:stretch)
       centers the fixed-size cover vertically against the card whenever
       the synopsis/tags on the right make the row taller than the cover
       itself, instead of the cover sticking to the top. */
    .fp-result-cover-link { flex-shrink: 0; text-decoration: none; display: flex; align-items: center; }
    .fp-result-cover {
      width: 130px; height: 195px; object-fit: cover; border-radius: 12px; display: block;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    /* search.html only links fanpages-nav.css, not the full fanpages.css
       where .wiki-generated-cover normally lives — without these rules the
       generated (no-cover) fallback renders as a bare, unstyled div and its
       title text shows as plain underlined link text instead of a cover. */
    .fp-result-cover-link .wiki-generated-cover {
      width: 130px; height: 195px; border-radius: 12px;
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a);
      border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .fp-result-cover-link .wiki-generated-cover-bg {
      position: absolute; inset: -25%; background-size: cover; background-position: center;
      filter: blur(12px) saturate(1.3) brightness(0.6); transform: scale(1.15);
    }
    .fp-result-cover-link .wiki-generated-cover-title {
      position: relative; z-index: 1; color: #fff; text-align: center; padding: 0 0.6rem;
      font-family: 'Cinzel', Georgia, serif; font-weight: 700; font-size: 0.92rem; line-height: 1.35;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
    }
    .fp-result-body { min-width: 0; flex: 1; display: flex; flex-direction: column; }

    .fp-result-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
    .fp-result-title {
      font-size: 1.7rem; font-weight: 700; color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    }
    .fp-result-title:hover { color: #fff; text-shadow: 0 0 6px rgba(255,255,255,0.25), 0 1px 3px rgba(0,0,0,0.4); }
    .fp-result-date { font-size: 0.8rem; color: #999; white-space: nowrap; flex-shrink: 0; }

    /* Author row — pfp + name, right under the title. */
    .fp-result-author {
      display: inline-flex; align-items: center; gap: 0.5rem; text-decoration: none;
      margin: 0.5rem 0 0.85rem; width: fit-content;
    }
    .fp-result-author:hover .fp-result-author-name { color: #7fa8d9; text-decoration: underline; }
    .fp-result-author-avatar, .fp-result-author-avatar-fallback {
      width: 26px; height: 26px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .fp-result-author-avatar-fallback {
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 0.72rem;
    }
    .fp-result-author-name { font-size: 0.92rem; font-weight: 600; color: #ccc; }

    .fp-tag-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.85rem; }
    .fp-tag-pill {
      display: inline-block; border-radius: 20px; padding: 0.32em 0.9em; font-size: 0.82rem; font-weight: 700;
      text-decoration: none; cursor: pointer; border: 1px solid transparent; white-space: nowrap;
    }
    .fp-tag-pill:hover { filter: brightness(1.25); }
    .fp-tag-pill--rating-general { background: rgba(90,180,110,0.2); color: #8fe0ac; border-color: rgba(90,180,110,0.45); }
    .fp-tag-pill--rating-teen { background: rgba(224,176,90,0.2); color: #f0c060; border-color: rgba(224,176,90,0.45); }
    .fp-tag-pill--rating-mature { background: rgba(217,122,114,0.2); color: #e69a92; border-color: rgba(217,122,114,0.45); }
    .fp-tag-pill--complete { background: rgba(127,168,217,0.2); color: #a8c6e8; border-color: rgba(127,168,217,0.45); }
    .fp-tag-pill--fandom { background: rgba(217,122,114,0.18); color: #e69a92; }
    .fp-tag-pill--relationship { background: rgba(217,122,114,0.12); color: #d9a49f; }
    .fp-tag-pill--category { background: rgba(217,122,114,0.09); color: #cc9a94; }
    .fp-tag-pill--tag { background: rgba(127,168,217,0.16); color: #a8c6e8; }

    /* Cut to a uniform length (in JS) so cards read as the same rough
       height, plus a soft fade on the last line instead of a hard stop. */
    .fp-result-synopsis {
      font-size: 0.98rem; color: #ccc; line-height: 1.6; margin-bottom: 0.9rem;
      -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
      mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
    }

    /* Small stat line at the bottom — word count stays plain text, the
       rest use the same cute emoji shorthand the profile Stories tab
       cards use (views/likes/comments/bookmarks), so a story reads the
       same whether you found it here or on an author's own profile. */
    .fp-result-stats { display: flex; flex-wrap: wrap; gap: 0.3rem 1.2rem; margin-top: auto; font-size: 0.82rem; color: #999; }
    .fp-result-stats strong { color: #eee; }

    /* Top-4 tagged-character chips -- same look as the profile Stories
       tab's teaser cards. */
    .fp-result-chars { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.15rem 0 0.85rem; }
    .fp-result-char-chip {
      display: flex; align-items: center; gap: 0.4rem; background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px; padding: 0.2rem 0.7rem 0.2rem 0.2rem; font-size: 0.78rem; color: #ddd; font-weight: 600;
      text-decoration: none; transition: border-color 0.15s, color 0.15s;
    }
    .fp-result-char-chip:hover { border-color: #7fa8d9; color: #fff; }
    .fp-result-char-chip img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; }

    .fp-search-empty { color: #ddd; font-size: 1rem; padding: 2rem 0; }
    .fp-pagination { display: flex; justify-content: center; gap: 0.6rem; margin-top: 2.5rem; }
    .fp-pagination button {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.25); color: #ddd; border-radius: 10px;
      padding: 0.55em 1.2em; cursor: pointer; font-family: inherit; font-size: 0.9rem;
    }
    .fp-pagination button:hover:not(:disabled) { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-pagination button:disabled { opacity: 0.4; cursor: default; }

    /* Numbered e621-style pager (Submissions) -- Story keeps the plain
       Previous/Next buttons above, styled by the generic rule. */
    .fp-page-btn {
      background: transparent; border: 1px solid rgba(255,255,255,0.18); color: #ccc; border-radius: 8px;
      min-width: 2.2rem; height: 2.2rem; padding: 0 0.5em; cursor: pointer; font-family: inherit; font-size: 0.9rem; font-weight: 600;
    }
    .fp-page-btn:hover:not(:disabled):not(.fp-page-btn--active) { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-page-btn:disabled { opacity: 0.35; cursor: default; }
    .fp-page-btn--active { background: #f0c060; border-color: #f0c060; color: #14121a; box-shadow: 0 0 16px rgba(240,192,96,0.65); }
    .fp-page-ellipsis { color: #777; padding: 0 0.2rem; font-size: 0.9rem; }
    /* Breathing room between the top pager and where the results actually
       start -- they used to sit right on top of each other. */
    #fp-pagination-top { margin-bottom: 1.75rem; }
    #fp-pagination-top:not([hidden]) { margin-top: 0.5rem; }

    /* ── Left-hand panel — three big section links (Story / Submissions /
       Profiles) near the top, then a "Current search" indicator + the
       "Filter Search" toggle pinned to the bottom (margin-top:auto on
       that wrapper). Fully transparent so it reads as content sitting on
       the shared blurred wallpaper, same as the results column, but with
       a clearly visible right-hand border marking where it ends. Pinned
       flush against the topbar and the page's left/bottom edges via the
       negative-margin trick. */
    .fp-side-panel {
      grid-column: 1;
      position: sticky; top: 76px;
      margin-bottom: -5rem; margin-left: -2.5rem;
      height: calc(100vh - 76px); max-height: calc(100vh - 76px);
      display: flex; flex-direction: column; align-items: center;
      background: #14121a; border-right: 1px solid rgba(255,255,255,0.14);
      padding: 2rem 1.5rem 3.5rem; overflow-y: auto;
      scrollbar-color: #444 transparent; /* Firefox */
    }
    .fp-side-panel::-webkit-scrollbar { width: 8px; }
    .fp-side-panel::-webkit-scrollbar-track { background: transparent; }
    .fp-side-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
    .fp-side-menu { display: flex; flex-direction: column; gap: 0.5rem; width: 100%; }
    /* Story starts already looking hovered/selected (it's the current
       section) via .fp-side-menu-item--active sharing the :hover rule.
       Submissions / Profiles get the same blue glow treatment the
       instant you hover them, and are real clickable links. Thinner than
       before -- these used to read as big heavy cards. */
    .fp-side-menu-item {
      display: flex; align-items: center; gap: 0.85rem; width: 100%;
      color: #999; text-decoration: none; border-radius: 12px; border: 1px solid transparent;
      padding: 0.7em 0.9em; transition: color 0.15s, background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .fp-side-menu-item:hover, .fp-side-menu-item--active {
      color: #fff; background: rgba(127,168,217,0.14); border-color: rgba(127,168,217,0.4);
      box-shadow: 0 0 14px rgba(127,168,217,0.3);
    }
    .fp-side-menu-icon { font-size: 1.4rem; line-height: 1; flex-shrink: 0; }
    .fp-side-menu-text { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .fp-side-menu-label { font-size: 1.05rem; font-weight: 700; }
    .fp-side-menu-count {
      font-size: 0.74rem; font-weight: 600; color: #888; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .fp-side-menu-item:hover .fp-side-menu-count, .fp-side-menu-item--active .fp-side-menu-count { color: #a8c6e8; }

    /* Current-search indicator + "Filter Search" toggle, pinned to the
       bottom of the left panel. */
    .fp-side-bottom { width: 100%; margin-top: auto; }
    .fp-side-search-wrap { position: relative; width: 100%; margin-bottom: 1rem; }
    .fp-side-search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; color: #888; pointer-events: none;
    }
    .fp-side-search-wrap input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.16); border-radius: 20px;
      color: #f0f0f0; font-family: inherit; font-size: 0.92rem; padding: 0.6em 0.9em 0.6em 2.4rem;
    }
    .fp-side-search-wrap input:focus { outline: none; border-color: #7fa8d9; }
    .fp-filter-toggle-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem; width: 100%;
      background: rgba(20,18,24,0.85); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
      color: #ddd; font-family: inherit; font-weight: 700; font-size: 1.05rem;
      padding: 0.75em 1.2em; cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s, color 0.15s;
    }
    .fp-filter-toggle-btn:hover { color: #fff; }
    /* box-shadow only appears in the --open state (panel visible) --
       no glow when collapsed. */
    .fp-filter-toggle-btn--open { color: #fff; border-color: rgba(127,168,217,0.65); box-shadow: 0 0 16px rgba(127,168,217,0.55); }

    /* ── Right-hand "Sort and Filter" panel — sticks to the page,
       flush against the topbar above and the page bottom/right edge
       below (negative margins cancel .fp-layout's own padding on those
       sides). Collapses fully out of view (.fp-layout--filters-collapsed
       shrinks the grid column to 0) -- the floating .fp-filter-fab arrow
       (outside this element, so it survives the collapse) is the only
       thing left on screen to bring it back. ── */
    .fp-filter-panel {
      grid-column: 3;
      position: sticky; top: 76px;
      margin-bottom: -5rem; margin-right: -2.5rem;
      height: calc(100vh - 76px);
      display: flex; flex-direction: column;
      background: #14121a;
      border: 1px solid rgba(255,255,255,0.14);
      padding: 1.5rem; max-height: calc(100vh - 76px); overflow-y: auto;
      scrollbar-color: #444 #1a1a1e; /* Firefox */
      /* Stops wheel scroll from chaining to the main page once you hit
         the top/bottom of this panel's own scroll -- hovering anywhere
         over it only ever scrolls the panel, never the page underneath. */
      overscroll-behavior: contain;
      contain: layout;
    }
    .fp-filter-panel::-webkit-scrollbar { width: 8px; }
    .fp-filter-panel::-webkit-scrollbar-track { background: #1a1a1e; border-radius: 8px; }
    .fp-filter-panel::-webkit-scrollbar-thumb { background: #444; border-radius: 8px; }
    .fp-filter-panel::-webkit-scrollbar-thumb:hover { background: #555; }
    .fp-layout--filters-collapsed .fp-filter-panel { display: none; }
    /* Floating round toggle, fixed to the viewport (not the panel) so it
       stays put and visible in both states. Vertically centered on
       screen; overlaps into the panel's left edge a bit while open, and
       tucks against the screen's right edge once collapsed. Reuses the
       chapter-editor's back chevron, just much bigger, rotating to show
       which way it'll move next. */
    .fp-filter-fab {
      /* Sits right at the screen edge, on the panel's own outer edge, in
         BOTH states now -- doesn't slide between two positions anymore,
         only the arrow direction flips. */
      position: fixed; top: 50%; right: 4px; transform: translateY(-50%);
      width: 48px; height: 48px; border-radius: 50%; z-index: 60;
      background: #14121a; border: 1px solid rgba(255,255,255,0.28);
      color: #ccc; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 22px rgba(0,0,0,0.55);
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .fp-filter-fab svg { transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1); transform: rotate(180deg); }
    .fp-filter-fab:hover { color: #fff; border-color: rgba(127,168,217,0.6); box-shadow: 0 4px 26px rgba(127,168,217,0.4); }
    .fp-filter-fab--collapsed svg { transform: rotate(0deg); }
    .fp-filter-query {
      font-size: 0.85rem; color: #bbb; background: rgba(127,168,217,0.1); border: 1px solid rgba(127,168,217,0.3);
      border-radius: 10px; padding: 0.6em 0.85em; margin-bottom: 1.25rem;
    }
    .fp-filter-query strong { color: #a8c6e8; }
    .fp-filter-section { margin-bottom: 1.4rem; }
    .fp-filter-section-title { font-size: 1.3rem; font-weight: 700; color: #ddd; margin-bottom: 0.7rem; }

    .fp-sort-select {
      width: 100%; background: transparent; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
      color: #f0f0f0; font-family: inherit; font-size: 1.05rem; font-weight: 600; padding: 0.7em 0.8em;
      cursor: pointer;
    }
    .fp-sort-select:focus { outline: none; border-color: #7fa8d9; }
    /* The dropdown's own popup list is browser-native chrome CSS mostly
       can't touch, but Chrome/Edge/Firefox on Windows do honor colors
       set directly on <option> -- without this the list defaults to a
       plain white background that clashes with the rest of the panel. */
    .fp-sort-select option { background: #1a1a1e; color: #f0f0f0; }

    .fp-filter-details { border-top: 1px solid rgba(255,255,255,0.1); padding: 0.75rem 0; }
    .fp-filter-details summary {
      cursor: pointer; font-size: 1.15rem; font-weight: 600; color: #ddd; list-style: none;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .fp-filter-details summary::-webkit-details-marker { display: none; }
    .fp-filter-details summary::before { content: '▸'; font-size: 0.9rem; color: #888; transition: transform 0.15s; }
    .fp-filter-details[open] summary::before { transform: rotate(90deg); }
    .fp-filter-options { display: flex; flex-direction: column; gap: 0.55rem; margin-top: 0.8rem; padding-left: 0.2rem; }
    .fp-filter-options label { display: flex; align-items: center; gap: 0.55rem; font-size: 1rem; color: #ccc; cursor: pointer; }

    .fp-filter-freeform-label { display: block; font-size: 0.92rem; color: #999; margin: 0.7rem 0 0.4rem; }
    .fp-filter-panel input[type="text"], .fp-filter-panel input[type="number"] {
      width: 100%; background: #1a1a1e; border: 1px solid rgba(255,255,255,0.16); border-radius: 8px;
      color: #f0f0f0; font-family: inherit; font-size: 0.98rem; padding: 0.6em 0.75em;
    }
    .fp-filter-panel input:focus { outline: none; border-color: #7fa8d9; }
    .fp-filter-word-row { display: flex; align-items: center; gap: 0.5rem; }
    .fp-filter-word-row input { flex: 1; min-width: 0; }
    .fp-filter-word-row span { color: #888; }

    /* Same blue gradient + white Inter text as the story view's own
       "Edit <character name>" button. */
    .fp-filter-apply-btn {
      width: 100%; background: linear-gradient(135deg, #3d6fa8, #7fa8d9); color: #fff; border: none; border-radius: 20px;
      padding: 0.7em; font-family: 'Inter', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 0 16px rgba(127,168,217,0.5); transition: box-shadow 0.15s, transform 0.15s;
    }
    .fp-filter-apply-btn:hover { box-shadow: 0 0 26px rgba(127,168,217,0.75); transform: translateY(-1px); }
    .fp-filter-apply-btn--top { margin-bottom: 1.1rem; }
    .fp-filter-apply-btn--bottom { margin-top: auto; }

    @media (max-width: 980px) {
      /* Collapse doesn't make sense once everything's stacked in one
         column -- the panel always shows and the floating arrow hides. */
      .fp-layout, .fp-layout--filters-collapsed, .fp-layout--submissions, .fp-layout--profiles, .fp-layout--no-side { grid-template-columns: 1fr; row-gap: 1.5rem; }
      .fp-layout--profiles .fp-results-col { max-width: none; }
      .fp-results-col { grid-column: 1; }
      .fp-filter-panel, .fp-layout--filters-collapsed .fp-filter-panel {
        grid-column: 1; display: flex;
        position: static; max-height: none; height: auto;
        margin-bottom: 0; margin-right: 0; border-radius: 18px;
      }
      .fp-filter-fab { display: none; }
      .fp-side-panel {
        position: static; max-height: none; height: auto;
        margin-bottom: 0; margin-left: 0;
        padding: 1.5rem 0; border-right: none; border-bottom: 2px solid rgba(255,255,255,0.4);
      }
    }
    @media (max-width: 720px) {
      .fp-result { flex-direction: column; }
      .fp-result-cover { width: 100%; height: auto; aspect-ratio: 2 / 3; }
    }
  </style>
</head>
<body>

<img class="fp-bg-img" src="/images/gallery/kloudsaphbedroom_1.png" alt="" />
<div class="fp-bg-overlay"></div>

<div class="fp-content-z">
<div id="fanpages-topbar-root"></div>

<main class="fp-layout">
  <aside class="fp-side-panel" id="fp-side-panel">
    <nav class="fp-side-menu">
      <a class="fp-side-menu-item fp-side-menu-item--active" href="/fanpages/search" id="fp-side-menu-story">
        <span class="fp-side-menu-icon">📖</span>
        <span class="fp-side-menu-text">
          <span class="fp-side-menu-label">Stories</span>
          <span class="fp-side-menu-count" id="fp-side-menu-count-story">Loading…</span>
        </span>
      </a>
      <a class="fp-side-menu-item" href="/fanpages/search?view=submissions" id="fp-side-menu-submissions">
        <span class="fp-side-menu-icon">🖼️</span>
        <span class="fp-side-menu-text">
          <span class="fp-side-menu-label">All Submissions</span>
          <span class="fp-side-menu-count" id="fp-side-menu-count-submissions">Gallery posts &amp; chapters</span>
        </span>
      </a>
      <a class="fp-side-menu-item" href="/fanpages/search?view=profiles" id="fp-side-menu-profiles">
        <span class="fp-side-menu-icon">👤</span>
        <span class="fp-side-menu-text">
          <span class="fp-side-menu-label">Profiles</span>
          <span class="fp-side-menu-count" id="fp-side-menu-count-profiles">Accounts</span>
        </span>
      </a>
    </nav>

    <div class="fp-side-bottom">
      <div class="fp-side-search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="search" id="fp-side-search-input" placeholder="Quick search…" />
      </div>
      <div class="fp-filter-query">Current search: <strong id="fp-filter-query-text-side">Everything</strong></div>
      <button class="fp-filter-toggle-btn fp-filter-toggle-btn--open" id="fp-filter-toggle-btn" type="button" aria-pressed="true" title="Hide filters">Filter Search</button>
    </div>
  </aside>

  <div class="fp-results-col">
    <h1 class="fp-browse-heading" id="fp-browse-heading" hidden></h1>
    <p class="fp-search-sub" id="fp-search-sub"></p>
    <div class="fp-pagination" id="fp-pagination-top" hidden></div>
    <div class="fp-results-list" id="fp-search-results"><p class="fp-search-empty">Loading…</p></div>
    <div class="fp-pagination" id="fp-pagination" hidden></div>
  </div>

  <button class="fp-filter-fab" id="fp-filter-rail-toggle" type="button" title="Hide filters" aria-label="Hide filters">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <aside class="fp-filter-panel" id="fp-filter-panel">
    <button class="fp-filter-apply-btn fp-filter-apply-btn--top" id="fp-filter-apply-top" type="button">Sort and Filter</button>
    <div class="fp-filter-query">Current search: <strong id="fp-filter-query-text">Everything</strong></div>

    <div class="fp-filter-section">
      <p class="fp-filter-section-title">Sort by</p>
      <select id="f-sort" class="fp-sort-select">
        <option value="best_match">Best Match</option>
        <option value="updated">Date Updated</option>
        <option value="kudos">Likes</option>
        <option value="hits">Reads</option>
      </select>
    </div>

    <div class="fp-filter-section">
      <p class="fp-filter-section-title">Include</p>
      <details class="fp-filter-details">
        <summary>Ratings</summary>
        <div class="fp-filter-options" id="f-rating-options">
          <label><input type="radio" name="f-rating" value="" checked /> Any</label>
          <label><input type="radio" name="f-rating" value="General Audiences" /> General Audiences</label>
          <label><input type="radio" name="f-rating" value="Teen & Up" /> Teen &amp; Up</label>
          <label><input type="radio" name="f-rating" value="Mature/Explicit (Adult)" /> Mature/Explicit (Adult)</label>
        </div>
      </details>
      <details class="fp-filter-details">
        <summary>Categories</summary>
        <div class="fp-filter-options" id="f-categories">
          <label><input type="checkbox" value="Gen" /> Gen</label>
          <label><input type="checkbox" value="M/F" /> M/F</label>
          <label><input type="checkbox" value="M/M" /> M/M</label>
          <label><input type="checkbox" value="F/F" /> F/F</label>
          <label><input type="checkbox" value="Multi" /> Multi</label>
          <label><input type="checkbox" value="Other" /> Other</label>
        </div>
      </details>
      <details class="fp-filter-details">
        <summary>Fandoms</summary>
        <input type="text" id="f-fandoms" placeholder="e.g. Pokémon" list="fp-fandom-list" style="margin-top:0.7rem;" />
        <datalist id="fp-fandom-list"></datalist>
      </details>
      <details class="fp-filter-details">
        <summary>Relationships</summary>
        <input type="text" id="f-relationships" placeholder="Comma-separated" list="fp-relationship-list" style="margin-top:0.7rem;" />
        <datalist id="fp-relationship-list"></datalist>
      </details>
      <details class="fp-filter-details">
        <summary>Additional Tags</summary>
        <input type="text" id="f-tags-include" placeholder="e.g. Espeon, Fluff" list="fp-tag-list" style="margin-top:0.7rem;" />
        <datalist id="fp-tag-list"></datalist>
      </details>
      <details class="fp-filter-details">
        <summary>Word Count</summary>
        <div class="fp-filter-word-row" style="margin-top:0.7rem;">
          <input type="number" id="f-word-min" placeholder="Min" min="0" />
          <span>–</span>
          <input type="number" id="f-word-max" placeholder="Max" min="0" />
        </div>
      </details>
      <details class="fp-filter-details">
        <summary>Completion Status</summary>
        <div class="fp-filter-options" id="f-completion">
          <label><input type="radio" name="f-completion" value="all" checked /> All works</label>
          <label><input type="radio" name="f-completion" value="complete" /> Complete only</label>
          <label><input type="radio" name="f-completion" value="wip" /> Work in progress</label>
        </div>
      </details>
    </div>

    <div class="fp-filter-section">
      <p class="fp-filter-section-title">Exclude</p>
      <details class="fp-filter-details">
        <summary>Additional Tags</summary>
        <input type="text" id="f-tags-exclude" placeholder="Comma-separated" list="fp-tag-list" style="margin-top:0.7rem;" />
      </details>
    </div>

    <button class="fp-filter-apply-btn fp-filter-apply-btn--bottom" id="fp-filter-apply" type="button">Sort and Filter</button>
  </aside>
</main>
</div>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});

// Story result cards are clickable anywhere on their (transparent) area,
// not just the cover/title -- but a click on the cover, title, an author
// link, a tag pill, or a character chip still goes to THAT destination
// instead, since those are real nested <a> elements.
document.addEventListener('click', (e) => {
  const card = e.target.closest('.fp-result[data-href]');
  if (!card || e.target.closest('a')) return;
  window.location.href = card.dataset.href;
});
// Live result count under the "Story" left-panel link, for the current
// query. Profiles doesn't have a backing search yet, so it just shows a
// static description instead.
function setStoryMenuCount(text) {
  const el = document.getElementById('fp-side-menu-count-story');
  if (el) el.textContent = text;
}
function setSubmissionsMenuCount(text) {
  const el = document.getElementById('fp-side-menu-count-submissions');
  if (el) el.textContent = text;
}
function setProfilesMenuCount(text) {
  const el = document.getElementById('fp-side-menu-count-profiles');
  if (el) el.textContent = text;
}
// Every synopsis cuts at the same length so cards read as a uniform size —
// the fade (see .fp-result-synopsis mask) softens the hard stop visually.
function truncateSynopsis(s) {
  const text = (s || '').trim();
  if (!text) return 'No description yet.';
  return text.length > 250 ? text.slice(0, 250).trim() + '…' : text;
}
function ratingClass(rating) {
  if (rating === 'Teen & Up') return 'fp-tag-pill--rating-teen';
  if (rating === 'Mature/Explicit (Adult)') return 'fp-tag-pill--rating-mature';
  return 'fp-tag-pill--rating-general';
}
function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function tagSearchUrl(params) {
  const usp = new URLSearchParams(params);
  usp.set('sort', 'updated');
  return `/fanpages/search?${usp.toString()}`;
}

function coverHtml(site) {
  return window.wikiGeneratedCoverHtml
    ? window.wikiGeneratedCoverHtml(site, { imgClass: 'fp-result-cover' })
    : `<img class="fp-result-cover" src="${site.cover_url || '/images/gallery/pixernbath_13.png'}" alt="" />`;
}

function authorRowHtml(w) {
  const avatar = w.author_avatar
    ? `<img class="fp-result-author-avatar" src="${escapeHtml(w.author_avatar)}" alt="" />`
    : `<span class="fp-result-author-avatar-fallback">${escapeHtml(((w.author || '?')[0] || '?').toUpperCase())}</span>`;
  return `
    <a class="fp-result-author" href="/fanpages/${escapeHtml(w.author_username || '')}">
      ${avatar}
      <span class="fp-result-author-name">by ${escapeHtml(w.author || 'Unknown')}</span>
    </a>
  `;
}

function tagsRowHtml(w) {
  const tags = [];
  if (w.rating) tags.push(`<a class="fp-tag-pill ${ratingClass(w.rating)}" href="${tagSearchUrl({ rating: w.rating })}">${escapeHtml(w.rating)}</a>`);
  if (w.is_complete) tags.push(`<span class="fp-tag-pill fp-tag-pill--complete">Complete</span>`);
  (w.fandoms || []).forEach(f => tags.push(`<a class="fp-tag-pill fp-tag-pill--fandom" href="${tagSearchUrl({ fandoms: f })}">${escapeHtml(f)}</a>`));
  (w.relationships || []).forEach(r => tags.push(`<a class="fp-tag-pill fp-tag-pill--relationship" href="${tagSearchUrl({ relationships: r })}">${escapeHtml(r)}</a>`));
  (w.categories || []).forEach(c => tags.push(`<a class="fp-tag-pill fp-tag-pill--category" href="${tagSearchUrl({ categories: c })}">${escapeHtml(c)}</a>`));
  (w.tags || []).forEach(t => tags.push(`<a class="fp-tag-pill fp-tag-pill--tag" href="${tagSearchUrl({ tags_include: t })}">${escapeHtml(t)}</a>`));
  return tags.length ? `<div class="fp-tag-row">${tags.join('')}</div>` : '';
}

function charsRowHtml(w) {
  const chars = w.characters || [];
  if (!chars.length) return '';
  return `
    <div class="fp-result-chars">
      ${chars.map(c => `<a class="fp-result-char-chip" href="/fanpages/${encodeURIComponent(c.owner_username)}?char=${c.id}#characters"><img src="${escapeHtml(c.ref_image || '/images/defaultchar.jpg')}" alt="" />${escapeHtml(c.name)}</a>`).join('')}
    </div>
  `;
}

function resultCard(w) {
  return `
    <div class="fp-result" data-href="/fanpages/${escapeHtml(w.story_path)}">
      <a class="fp-result-cover-link" href="/fanpages/${escapeHtml(w.story_path)}">${coverHtml(w)}</a>
      <div class="fp-result-body">
        <div class="fp-result-title-row">
          <a class="fp-result-title" href="/fanpages/${escapeHtml(w.story_path)}">${escapeHtml(w.site_title || 'Untitled Story')}</a>
          ${w.created_at ? `<span class="fp-result-date">${formatDate(w.created_at)}</span>` : ''}
        </div>
        ${authorRowHtml(w)}
        ${tagsRowHtml(w)}
        <p class="fp-result-synopsis">${escapeHtml(truncateSynopsis(w.synopsis))}</p>
        ${charsRowHtml(w)}
        <div class="fp-result-stats">
          ${w.word_count != null ? `<span>Words: <strong>${w.word_count.toLocaleString()}</strong></span>` : ''}
          <span>👁 <strong>${(w.hits || 0).toLocaleString()}</strong></span>
          <span>⭐ <strong>${(w.kudos || 0).toLocaleString()}</strong></span>
          <span>💬 <strong>${(w.comments || 0).toLocaleString()}</strong></span>
          <span>🔖 <strong>${(w.bookmarks || 0).toLocaleString()}</strong></span>
        </div>
      </div>
    </div>
  `;
}

function bookmarkCard(w) {
  return `
    <div class="fp-result">
      <a class="fp-result-cover-link" href="/fanpages/${escapeHtml(w.story_path)}">${coverHtml(w)}</a>
      <div class="fp-result-body">
        <a class="fp-result-title" href="/fanpages/${escapeHtml(w.story_path)}">${escapeHtml(w.site_title || 'Untitled Story')}</a>
        ${authorRowHtml(w)}
        <p class="fp-result-synopsis">${escapeHtml(truncateSynopsis(w.synopsis))}</p>
        <div class="fp-result-stats"><span>Bookmarked <strong>${formatDate(w.bookmarked_at)}</strong></span></div>
      </div>
    </div>
  `;
}

// ── Submissions view — gallery posts + chapter postings, laid out as the
// same justified photo-wall as the Fanpage Hub's "Recent Submissions" box
// (fanpages/index.html), just as the full paginated listing instead of a
// 3-row teaser. ──────────────────────────────────────────────────────────
function rsCaptionHtml(href, title, authorUsername, author) {
  return `
    <div class="rs-card-caption">
      <a class="rs-card-caption-title" href="${href}">${escapeHtml(title)}</a>
      <span class="rs-card-caption-author">by ${authorUsername ? `<a href="/fanpages/${encodeURIComponent(authorUsername)}">${escapeHtml(author || authorUsername)}</a>` : escapeHtml(author || 'Unknown')}</span>
    </div>
  `;
}
function submissionCard(it) {
  const tile = document.createElement('div');
  tile.className = 'rs-tile';
  const a = document.createElement('a');
  a.className = 'rs-card';
  const posX = it.position_x != null ? it.position_x : 50;
  const posY = it.position_y != null ? it.position_y : 50;
  if (it.type === 'art') {
    a.href = `/fanpages/gallery-post?id=${it.id}`;
    a.innerHTML = `
      <img src="${escapeHtml(it.image)}" alt="" style="object-position:${posX}% ${posY}%;" />
      <span class="rs-card-badge">🎨</span>
    `;
    tile.appendChild(a);
    tile.insertAdjacentHTML('beforeend', rsCaptionHtml(a.href, it.title || 'Untitled', it.author_username, it.author));
    return tile;
  }
  // Chapter — a chapter card's "image" is really the story's own cover;
  // when there isn't one, fall back to the same generated purple/rose
  // book cover the Story tab's results already use.
  a.href = `/fanpages/${escapeHtml(it.story_path)}/reader?ch=${it.id}`;
  if (it.image) {
    a.innerHTML = `
      <img src="${escapeHtml(it.image)}" alt="" style="object-position:${posX}% ${posY}%;" />
      <span class="rs-card-badge">📖</span>
    `;
  } else {
    a.innerHTML = `<span class="rs-card-badge">📖</span>`;
    if (window.wikiGeneratedCoverHtml) {
      a.insertAdjacentHTML('afterbegin', window.wikiGeneratedCoverHtml({ site_title: it.site_title, author_avatar: it.author_avatar }, {}));
    }
  }
  tile.appendChild(a);
  tile.insertAdjacentHTML('beforeend', rsCaptionHtml(a.href, it.title || 'Untitled Chapter', it.author_username, it.author));
  return tile;
}

// e621-style numbered pager, shared by Submissions (top and bottom). Always
// renders even with a single page -- prev/next just end up disabled -- so
// the page-number UI stays put instead of popping in and out.
function paginationHtml(page, totalPages) {
  const pageSet = new Set([1, totalPages, page]);
  for (let i = page - 2; i <= page + 2; i++) if (i >= 1 && i <= totalPages) pageSet.add(i);
  const sorted = [...pageSet].sort((a, b) => a - b);
  let html = `<button type="button" class="fp-page-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
  let prev = 0;
  sorted.forEach(p => {
    if (p - prev > 1) html += '<span class="fp-page-ellipsis">…</span>';
    html += `<button type="button" class="fp-page-btn${p === page ? ' fp-page-btn--active' : ''}" data-page="${p}">${p}</button>`;
    prev = p;
  });
  html += `<button type="button" class="fp-page-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''} aria-label="Next page">›</button>`;
  return html;
}
function wirePagination(el) {
  el.querySelectorAll('.fp-page-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const usp = new URLSearchParams(window.location.search);
      usp.set('page', btn.dataset.page);
      window.location.search = usp.toString();
    });
  });
}

async function runSubmissionsSearch() {
  const resultsEl = document.getElementById('fp-search-results');
  const subEl = document.getElementById('fp-search-sub');
  const topEl = document.getElementById('fp-pagination-top');
  const bottomEl = document.getElementById('fp-pagination');
  resultsEl.innerHTML = '<p class="fp-search-empty">Loading…</p>';
  topEl.hidden = true; bottomEl.hidden = true;

  const p = new URLSearchParams(window.location.search);
  const q = p.get('q') || '';
  const page = Math.max(1, parseInt(p.get('page'), 10) || 1);
  const limit = 42;

  try {
    const res = await fetch(`/api/search/submissions?q=${encodeURIComponent(q)}&page=${page}&limit=${limit}`, { headers: authHeaders() });
    const data = await res.json();
    const items = data.items || [];
    subEl.innerHTML = `<strong>${data.total || 0}</strong> submission${data.total === 1 ? '' : 's'} found${q ? ` for "${escapeHtml(q)}"` : ''}.`;
    setSubmissionsMenuCount(`${data.total || 0} submission${(data.total || 0) === 1 ? '' : 's'}${q ? ` for "${q}"` : ''}`);

    resultsEl.classList.add('fp-results-list--grid');
    if (!items.length) {
      resultsEl.innerHTML = '<p class="fp-search-empty">No submissions match that search.</p>';
      return;
    }

    resultsEl.innerHTML = '';
    items.forEach(it => resultsEl.appendChild(submissionCard(it)));

    const totalPages = Math.max(1, Math.ceil((data.total || 0) / limit));
    const pagHtml = paginationHtml(page, totalPages);
    topEl.hidden = false; topEl.innerHTML = pagHtml; wirePagination(topEl);
    bottomEl.hidden = false; bottomEl.innerHTML = pagHtml; wirePagination(bottomEl);
  } catch {
    resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load submissions right now.</p>';
  }
}

// ── Profiles view — accounts + characters, tabbed, matching every
// space-separated keyword in the query (AND, not OR — enforced server-side
// via bool_and() over the unnested word list). Condensed to a centered
// column instead of the full-width layouts Story/Submissions use. ────────
function accountCardHtml(u) {
  const avatar = u.avatar
    ? `<img class="fp-profile-avatar" src="${escapeHtml(u.avatar)}" alt="" />`
    : `<span class="fp-profile-avatar-fallback">${escapeHtml((u.display_name[0] || '?').toUpperCase())}</span>`;
  const followBtn = u.is_self ? '' : `
    <button class="fp-profile-follow-btn${u.is_following ? ' fp-profile-follow-btn--following' : ''}"
            data-username="${escapeHtml(u.username)}" data-following="${u.is_following ? '1' : '0'}" type="button">
      ${u.is_following ? '✓ Following' : '+ Follow'}
    </button>
  `;
  return `
    <div class="fp-profile-card">
      <a href="/fanpages/${escapeHtml(u.username)}">${avatar}</a>
      <div class="fp-profile-info">
        <a class="fp-profile-name" href="/fanpages/${escapeHtml(u.username)}">${escapeHtml(u.display_name)}</a>
        <p class="fp-profile-handle">@${escapeHtml(u.username)}</p>
        <div class="fp-profile-stats">
          <span><strong>${(u.story_count || 0).toLocaleString()}</strong> Stories</span>
          <span><strong>${(u.following_count || 0).toLocaleString()}</strong> Following</span>
          <span><strong>${(u.follower_count || 0).toLocaleString()}</strong> Followers</span>
          <span><strong>${(u.club_count || 0).toLocaleString()}</strong> Clubs</span>
        </div>
      </div>
      ${followBtn}
    </div>
  `;
}
function wireFollowButtons() {
  document.querySelectorAll('.fp-profile-follow-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!token) { window.location.href = `/fanpages/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`; return; }
      const username = btn.dataset.username;
      const following = btn.dataset.following === '1';
      btn.disabled = true;
      try {
        const res = await fetch(`/api/follows/${encodeURIComponent(username)}`, { method: following ? 'DELETE' : 'POST', headers: authHeaders() });
        if (res.ok) {
          btn.dataset.following = following ? '0' : '1';
          btn.classList.toggle('fp-profile-follow-btn--following', !following);
          btn.textContent = following ? '+ Follow' : '✓ Following';
        }
      } catch {}
      btn.disabled = false;
    });
  });
}
// Accounts only now -- Characters used to have its own sub-tab here, which
// is what made the sidebar's "Profiles" preview count (accounts+characters
// combined) read as a confusing, seemingly-wrong number.
async function runProfilesSearch() {
  const resultsEl = document.getElementById('fp-search-results');
  const subEl = document.getElementById('fp-search-sub');
  const paginationEl = document.getElementById('fp-pagination');
  paginationEl.hidden = true;

  const p = new URLSearchParams(window.location.search);
  const q = p.get('q') || '';
  const page = Math.max(1, parseInt(p.get('page'), 10) || 1);
  const limit = 30;

  resultsEl.innerHTML = '<p class="fp-search-empty">Loading…</p>';

  try {
    const res = await fetch(`/api/search/profiles?q=${encodeURIComponent(q)}&type=accounts&page=${page}&limit=${limit}`, { headers: authHeaders() });
    const data = await res.json();
    const items = data.items || [];
    const totalLabel = data.total_capped ? `${data.total}+` : String(data.total || 0);
    subEl.innerHTML = `<strong>${totalLabel}</strong> account${data.total === 1 ? '' : 's'} found${q ? ` for "${escapeHtml(q)}"` : ''}.`;
    setProfilesMenuCount(`${totalLabel} account${(data.total || 0) === 1 ? '' : 's'}${q ? ` for "${q}"` : ''}`);

    resultsEl.innerHTML = !items.length
      ? `<p class="fp-search-empty">No accounts match that search.</p>`
      : items.map(accountCardHtml).join('');
    wireFollowButtons();

    const totalPages = Math.max(1, Math.ceil((data.total || 0) / limit));
    if (totalPages > 1) {
      paginationEl.hidden = false;
      paginationEl.innerHTML = `
        <button id="fp-page-prev" ${page <= 1 ? 'disabled' : ''}>← Previous</button>
        <span style="align-self:center; color:#ddd; font-size:0.88rem;">Page ${page} of ${totalPages}</span>
        <button id="fp-page-next" ${page >= totalPages ? 'disabled' : ''}>Next →</button>
      `;
      const goPage = (pp) => { const usp = new URLSearchParams(window.location.search); usp.set('page', pp); window.location.search = usp.toString(); };
      if (page > 1) document.getElementById('fp-page-prev').addEventListener('click', () => goPage(page - 1));
      if (page < totalPages) document.getElementById('fp-page-next').addEventListener('click', () => goPage(page + 1));
    }
  } catch {
    resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load profiles right now.</p>';
  }
}

const SORT_LABELS = { best_match: 'Best Match', updated: 'Date Updated', kudos: 'Likes', hits: 'Reads' };

function readParamsFromUrl() {
  const p = new URLSearchParams(window.location.search);
  return {
    q: p.get('q') || '',
    fandoms: p.get('fandoms') || '',
    relationships: p.get('relationships') || '',
    rating: p.get('rating') || '',
    tags_include: p.get('tags_include') || '',
    tags_exclude: p.get('tags_exclude') || '',
    categories: p.get('categories') || '',
    word_min: p.get('word_min') || '',
    word_max: p.get('word_max') || '',
    completion: p.get('completion') || 'all',
    sort: p.get('sort') || '',
    page: parseInt(p.get('page'), 10) || 1,
  };
}

function applyParamsToPanel(f) {
  document.getElementById('f-sort').value = f.sort || 'best_match';
  document.getElementById('f-fandoms').value = f.fandoms;
  document.getElementById('f-relationships').value = f.relationships;
  document.getElementById('f-tags-include').value = f.tags_include;
  document.getElementById('f-tags-exclude').value = f.tags_exclude;
  document.getElementById('f-word-min').value = f.word_min;
  document.getElementById('f-word-max').value = f.word_max;
  const ratingInput = document.querySelector(`#f-rating-options input[value="${CSS.escape(f.rating)}"]`);
  if (ratingInput) ratingInput.checked = true;
  const cats = f.categories ? f.categories.split(',') : [];
  document.querySelectorAll('#f-categories input').forEach(cb => { cb.checked = cats.includes(cb.value); });
  document.querySelectorAll('#f-completion input').forEach(r => { r.checked = r.value === f.completion; });

  // Exact-tag filters (fandoms/tags/relationships/categories/rating) get a
  // "<tag> @X" marker so it's obvious this is a narrowed exact-match search,
  // not the fuzzy keyword search a plain "X" would imply.
  const queryBits = [];
  if (f.q) queryBits.push(`"${f.q}"`);
  ['fandoms', 'tags_include', 'relationships', 'categories'].forEach(key => {
    if (f[key]) f[key].split(',').filter(Boolean).forEach(v => queryBits.push(`<tag> @${v}`));
  });
  if (f.rating) queryBits.push(`<tag> @${f.rating}`);
  const queryText = queryBits.length ? queryBits.join(', ') : 'Everything';
  document.getElementById('fp-filter-query-text').textContent = queryText;
  document.getElementById('fp-filter-query-text-side').textContent = queryText;
}

function collectPanelParams() {
  const params = {};
  const q = new URLSearchParams(window.location.search).get('q');
  if (q) params.q = q;
  params.sort = document.getElementById('f-sort').value;
  const fandoms = document.getElementById('f-fandoms').value.trim();
  if (fandoms) params.fandoms = fandoms;
  const relationships = document.getElementById('f-relationships').value.trim();
  if (relationships) params.relationships = relationships;
  const rating = document.querySelector('#f-rating-options input:checked').value;
  if (rating) params.rating = rating;
  const tagsInclude = document.getElementById('f-tags-include').value.trim();
  if (tagsInclude) params.tags_include = tagsInclude;
  const tagsExclude = document.getElementById('f-tags-exclude').value.trim();
  if (tagsExclude) params.tags_exclude = tagsExclude;
  const cats = [...document.querySelectorAll('#f-categories input:checked')].map(c => c.value);
  if (cats.length) params.categories = cats.join(',');
  const wordMin = document.getElementById('f-word-min').value;
  if (wordMin) params.word_min = wordMin;
  const wordMax = document.getElementById('f-word-max').value;
  if (wordMax) params.word_max = wordMax;
  const completion = document.querySelector('#f-completion input:checked').value;
  if (completion !== 'all') params.completion = completion;
  return params;
}

async function loadCatalogsForAutocomplete() {
  try {
    const res = await fetch('/api/tag-catalog');
    const data = await res.json();
    document.getElementById('fp-tag-list').innerHTML = (data.tags || []).map(t => `<option value="${escapeHtml(t)}"></option>`).join('');
  } catch {}
  try {
    const res = await fetch('/api/fandom-catalog');
    const data = await res.json();
    document.getElementById('fp-fandom-list').innerHTML = (data.fandoms || []).map(f => `<option value="${escapeHtml(f)}"></option>`).join('');
  } catch {}
  try {
    const res = await fetch('/api/relationship-catalog');
    const data = await res.json();
    document.getElementById('fp-relationship-list').innerHTML = (data.relationships || []).map(r => `<option value="${escapeHtml(r)}"></option>`).join('');
  } catch {}
}

async function runSearch() {
  const resultsEl = document.getElementById('fp-search-results');
  const subEl = document.getElementById('fp-search-sub');
  const paginationEl = document.getElementById('fp-pagination');
  resultsEl.innerHTML = '<p class="fp-search-empty">Loading…</p>';
  paginationEl.hidden = true;

  const f = readParamsFromUrl();
  document.getElementById('fp-filter-panel').style.display = f.sort === 'bookmarks_recent' ? 'none' : '';
  applyParamsToPanel(f);

  if (f.sort === 'bookmarks_recent') {
    subEl.textContent = 'Stories the community has bookmarked most recently.';
    try {
      const res = await fetch('/api/search/recent-bookmarks?limit=30');
      const data = await res.json();
      setStoryMenuCount(`${data.works.length} bookmark${data.works.length === 1 ? '' : 's'}`);
      if (!data.works.length) { resultsEl.innerHTML = '<p class="fp-search-empty">No bookmarks yet.</p>'; return; }
      resultsEl.innerHTML = data.works.map(bookmarkCard).join('');
    } catch {
      resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load bookmarks right now.</p>';
    }
    return;
  }

  const apiParams = new URLSearchParams();
  if (f.q) apiParams.set('q', f.q);
  if (f.fandoms) apiParams.set('fandoms', f.fandoms);
  if (f.relationships) apiParams.set('relationships', f.relationships);
  if (f.rating) apiParams.set('rating', f.rating);
  if (f.tags_include) apiParams.set('tags_include', f.tags_include);
  if (f.tags_exclude) apiParams.set('tags_exclude', f.tags_exclude);
  if (f.categories) apiParams.set('categories', f.categories);
  if (f.word_min) apiParams.set('word_min', f.word_min);
  if (f.word_max) apiParams.set('word_max', f.word_max);
  if (f.completion !== 'all') apiParams.set('completion', f.completion);
  if (f.sort) apiParams.set('sort', f.sort);
  apiParams.set('page', f.page);
  // Browse mode is a plain "recent updates" feed, AO3-style — latest 30,
  // no pagination, no "X works found" line.
  if (isBrowseMode) apiParams.set('limit', '30');

  try {
    const res = await fetch(`/api/search/works?${apiParams.toString()}`);
    const data = await res.json();
    const works = data.works || [];
    if (isBrowseMode) {
      subEl.innerHTML = `These are some of the latest stories updated in our community. To find more stories, <a href="/fanpages/fandoms">choose a fandom</a> or enter a specific tag into the search bar above.`;
    } else {
      subEl.innerHTML = `<strong>${data.total || 0}</strong> work${data.total === 1 ? '' : 's'} found — sorted by ${escapeHtml(SORT_LABELS[data.sort] || 'Best Match')}.`;
    }
    setStoryMenuCount(`${data.total || 0} stor${(data.total || 0) === 1 ? 'y' : 'ies'}${f.q ? ` for "${f.q}"` : ''}`);

    if (!works.length) {
      resultsEl.innerHTML = '<p class="fp-search-empty">No works match that search.</p>';
      return;
    }
    resultsEl.innerHTML = works.map(resultCard).join('');

    if (isBrowseMode) return;

    const totalPages = Math.max(1, Math.ceil((data.total || 0) / (data.limit || 20)));
    if (totalPages > 1) {
      paginationEl.hidden = false;
      paginationEl.innerHTML = `
        <button id="fp-page-prev" ${f.page <= 1 ? 'disabled' : ''}>← Previous</button>
        <span style="align-self:center; color:#ddd; font-size:0.88rem;">Page ${f.page} of ${totalPages}</span>
        <button id="fp-page-next" ${f.page >= totalPages ? 'disabled' : ''}>Next →</button>
      `;
      const goPage = (p) => { const usp = new URLSearchParams(window.location.search); usp.set('page', p); window.location.search = usp.toString(); };
      if (f.page > 1) document.getElementById('fp-page-prev').addEventListener('click', () => goPage(f.page - 1));
      if (f.page < totalPages) document.getElementById('fp-page-next').addEventListener('click', () => goPage(f.page + 1));
    }
  } catch {
    resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load search results right now.</p>';
  }
}

// Both "Sort and Filter" buttons (top and bottom of the panel) do the
// same thing — apply everything currently set in the panel at once.
function applyFiltersAndSearch() {
  window.location.search = new URLSearchParams(collectPanelParams()).toString();
}
document.getElementById('fp-filter-apply-top').addEventListener('click', applyFiltersAndSearch);
document.getElementById('fp-filter-apply').addEventListener('click', applyFiltersAndSearch);

// Filter panel collapse/expand — the "Filter Search" button (bottom of
// the left panel) and the floating arrow fab both drive the same state.
// Collapsing shrinks .fp-layout's third grid column to 0 (pushing/pulling
// the results column as it goes) and fully hides the panel; the fab is a
// position:fixed sibling, not a child of the panel, so it stays on screen
// either way. The glow on "Filter Search" only shows while the panel is
// open.
const fpLayoutEl = document.querySelector('.fp-layout');
const filterToggleBtn = document.getElementById('fp-filter-toggle-btn');
const filterRailToggle = document.getElementById('fp-filter-rail-toggle');
function setFiltersCollapsed(collapsed) {
  fpLayoutEl.classList.toggle('fp-layout--filters-collapsed', collapsed);
  filterRailToggle.classList.toggle('fp-filter-fab--collapsed', collapsed);
  filterToggleBtn.classList.toggle('fp-filter-toggle-btn--open', !collapsed);
  filterToggleBtn.setAttribute('aria-pressed', String(!collapsed));
  const label = collapsed ? 'Show filters' : 'Hide filters';
  filterToggleBtn.title = label;
  filterRailToggle.title = label;
  filterRailToggle.setAttribute('aria-label', label);
}
filterToggleBtn.addEventListener('click', () => setFiltersCollapsed(!fpLayoutEl.classList.contains('fp-layout--filters-collapsed')));
filterRailToggle.addEventListener('click', () => setFiltersCollapsed(!fpLayoutEl.classList.contains('fp-layout--filters-collapsed')));
// Every fresh page load starts with the filter panel expanded -- no
// remembering last session's collapsed state.
setFiltersCollapsed(false);

// Keeps the current query attached to all three left-panel tab links, so
// clicking Story -> Submissions -> Profiles carries whatever you searched
// across every switch instead of resetting to "Everything" each time.
// Each tab's own search function (runSearch/runSubmissionsSearch/
// runProfilesSearch) already reads q from the URL and passes it to its
// backend route -- this is just what keeps that q attached to the link
// you'd click next.
function syncSideMenuLinks() {
  const q = new URLSearchParams(window.location.search).get('q') || '';
  const qParam = q ? `q=${encodeURIComponent(q)}` : '';
  const join = (view) => {
    const parts = [];
    if (view) parts.push(`view=${view}`);
    if (qParam) parts.push(qParam);
    return parts.length ? `/fanpages/search?${parts.join('&')}` : '/fanpages/search';
  };
  document.getElementById('fp-side-menu-story').href = join(null);
  document.getElementById('fp-side-menu-submissions').href = join('submissions');
  document.getElementById('fp-side-menu-profiles').href = join('profiles');
}
syncSideMenuLinks();

// Quick search box above "Current search" -- searches within whichever
// view (Stories/Submissions/Profiles) is currently active.
(() => {
  const input = document.getElementById('fp-side-search-input');
  const p = new URLSearchParams(window.location.search);
  input.value = p.get('q') || '';
  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const usp = new URLSearchParams(window.location.search);
    if (input.value.trim()) usp.set('q', input.value.trim()); else usp.delete('q');
    usp.delete('page');
    window.location.search = usp.toString();
  });
})();

// Whichever tab is active fetches its own full results and sets its own
// menu count as a side effect of that (setStoryMenuCount/etc, already
// wired into runSearch/runSubmissionsSearch/runProfilesSearch). The other
// two tabs never run, so without this their menu preview stayed stuck on
// the static "Gallery posts & chapters" text even with a query typed --
// this fires a cheap limit:1 request per inactive tab (just for its
// total) so all three previews stay in sync with the same query no
// matter which one you're looking at.
async function refreshInactiveMenuCounts(activeView) {
  const q = new URLSearchParams(window.location.search).get('q') || '';
  const qs = q ? `&q=${encodeURIComponent(q)}` : '';
  const suffix = q ? ` for "${q}"` : '';
  if (activeView !== 'story') {
    fetch(`/api/search/works?limit=1${qs}`).then(r => r.json()).then(data => {
      setStoryMenuCount(`${data.total || 0} stor${(data.total || 0) === 1 ? 'y' : 'ies'}${suffix}`);
    }).catch(() => {});
  }
  if (activeView !== 'submissions') {
    fetch(`/api/search/submissions?limit=1${qs}`, { headers: authHeaders() }).then(r => r.json()).then(data => {
      setSubmissionsMenuCount(`${data.total || 0} submission${(data.total || 0) === 1 ? '' : 's'}${suffix}`);
    }).catch(() => {});
  }
  if (activeView !== 'profiles') {
    fetch(`/api/search/profiles?type=accounts&limit=1${qs}`, { headers: authHeaders() }).then(r => r.json()).then(data => {
      const total = data.total_capped ? `${data.total}+` : (data.total || 0);
      setProfilesMenuCount(`${total} account${data.total === 1 ? '' : 's'}${suffix}`);
    }).catch(() => {});
  }
}

// ── View dispatch — Story (default) vs Submissions vs Profiles. All three
// are served by this same page/template; Submissions/Profiles just swap
// the active left-panel link, drop the filter panel/fab (grid-column 3 ->
// gone), and render into the same #fp-search-results element the Story
// tab uses. ───────────────────────────────────────────────────────────
const currentView = new URLSearchParams(window.location.search).get('view');
// ?browse=1 — reached via the nav's Browse dropdown instead of the left
// panel: no left panel at all, a plain "Recent Stories"/"Recent
// Submissions" heading up top, everything else (right filter panel,
// collapse arrow, the actual result-fetching) identical to the normal tab.
const isBrowseMode = new URLSearchParams(window.location.search).get('browse') === '1';
if (isBrowseMode) {
  fpLayoutEl.classList.add('fp-layout--no-side');
  const headingEl = document.getElementById('fp-browse-heading');
  headingEl.textContent = currentView === 'submissions' ? 'Recent Submissions' : 'Recent Stories';
  headingEl.hidden = false;
  document.getElementById('fp-search-sub').style.marginTop = '0';
}
if (currentView === 'submissions' || currentView === 'profiles') {
  fpLayoutEl.classList.add(currentView === 'submissions' ? 'fp-layout--submissions' : 'fp-layout--profiles');
  document.getElementById('fp-side-menu-story').classList.remove('fp-side-menu-item--active');
  document.getElementById(`fp-side-menu-${currentView}`).classList.add('fp-side-menu-item--active');
  if (currentView === 'submissions') runSubmissionsSearch();
  else runProfilesSearch();
} else {
  loadCatalogsForAutocomplete();
  runSearch();
}
if (!isBrowseMode) refreshInactiveMenuCounts(currentView === 'submissions' || currentView === 'profiles' ? currentView : 'story');
</script>
