<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    .fp-main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

    .fp-search-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
    .fp-search-heading { font-family: 'Cinzel', Georgia, serif; font-size: 1.6rem; }
    .fp-edit-search-btn {
      background: none; border: 1px solid rgba(255,255,255,0.25); color: #ccc; border-radius: 20px;
      padding: 0.55em 1.3em; font-family: 'Lato', Arial, sans-serif; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: border-color 0.15s, color 0.15s;
    }
    .fp-edit-search-btn:hover, .fp-edit-search-btn.active { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-search-sub { color: #999; font-size: 0.9rem; margin-bottom: 1.5rem; }
    .fp-search-sub strong { color: #f0f0f0; }

    /* ── Advanced filter panel ── */
    .fp-filters {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
      padding: 1.75rem; margin-bottom: 2.5rem; display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem 2rem;
    }
    .fp-filters.wide { grid-template-columns: 1fr; }
    .fp-field { display: flex; flex-direction: column; gap: 0.4rem; }
    .fp-field label { font-family: 'Fredoka', 'Lato', Arial, sans-serif; font-size: 0.85rem; font-weight: 700; color: #ccc; }
    .fp-field-hint { font-size: 0.74rem; color: #888; margin-top: -0.2rem; }
    .fp-field input[type="text"], .fp-field input[type="number"], .fp-field select {
      background: #17171a; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
      color: #f0f0f0; font-family: inherit; font-size: 0.92rem; padding: 0.6rem 0.8rem;
    }
    .fp-field input:focus, .fp-field select:focus { outline: none; border-color: #7fa8d9; }
    .fp-field-row { display: flex; gap: 0.75rem; align-items: center; }
    .fp-field-row input { flex: 1; min-width: 0; }
    .fp-radio-group, .fp-checkbox-group { display: flex; flex-wrap: wrap; gap: 0.6rem 1.1rem; }
    .fp-radio-group label, .fp-checkbox-group label {
      display: flex; align-items: center; gap: 0.4rem; font-weight: 500; font-size: 0.88rem; color: #ddd; cursor: pointer;
    }
    .fp-filters-actions { grid-column: 1 / -1; display: flex; gap: 1rem; justify-content: flex-end; margin-top: 0.5rem; }
    .fp-filters-btn {
      border-radius: 20px; padding: 0.65em 1.8em; font-family: 'Lato', Arial, sans-serif; font-size: 0.92rem; font-weight: 700; cursor: pointer;
    }
    .fp-filters-btn--search { background: #7fa8d9; color: #0a0a0a; border: none; }
    .fp-filters-btn--search:hover { background: #93b8e2; }
    .fp-filters-btn--clear { background: none; border: 1px solid rgba(255,255,255,0.25); color: #ccc; }
    .fp-filters-btn--clear:hover { border-color: #d97a72; color: #d97a72; }

    /* ── Sort bar ── */
    .fp-sort-bar { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.75rem; }
    .fp-sort-bar label { font-family: 'Fredoka', 'Lato', Arial, sans-serif; font-size: 0.88rem; font-weight: 700; color: #ccc; }
    .fp-sort-bar select {
      background: #17171a; border: 1px solid rgba(255,255,255,0.14); border-radius: 10px;
      color: #f0f0f0; font-family: inherit; font-size: 0.9rem; padding: 0.5rem 0.8rem;
    }

    /* ── Result list (AO3-style rows, not a card grid, once real filters
       exist — reads better with synopsis + stats + tag rows). ── */
    .fp-results-list { display: flex; flex-direction: column; gap: 1.75rem; }
    .fp-result {
      background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 1.5rem 1.75rem; display: flex; gap: 1.5rem;
    }
    .fp-result-cover-link { flex-shrink: 0; }
    .fp-result-cover { width: 90px; height: 130px; object-fit: cover; border-radius: 8px; display: block; background: #1e1e1e; border: 1px solid rgba(255,255,255,0.1); }
    .fp-result-cover--generated {
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a);
    }
    .fp-result-body { min-width: 0; flex: 1; }
    .fp-result-title-row { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 0.3rem; }
    .fp-result-title { font-family: 'Cinzel', Georgia, serif; font-size: 1.25rem; font-weight: 700; }
    .fp-result-title:hover { color: #7fa8d9; }
    .fp-result-by { font-size: 0.88rem; color: #999; }
    .fp-result-by a:hover { color: #7fa8d9; text-decoration: underline; }
    .fp-badge-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.6rem; }
    .fp-badge {
      display: inline-block; border-radius: 10px; padding: 0.15em 0.65em; font-size: 0.74rem; font-weight: 700;
      text-decoration: none; cursor: pointer; border: 1px solid transparent;
    }
    .fp-badge--rating-general { background: rgba(90,180,110,0.15); color: #7fd99a; border-color: rgba(90,180,110,0.4); }
    .fp-badge--rating-teen { background: rgba(224,176,90,0.15); color: #f0c060; border-color: rgba(224,176,90,0.4); }
    .fp-badge--rating-mature { background: rgba(217,122,114,0.15); color: #e08880; border-color: rgba(217,122,114,0.4); }
    .fp-badge--complete { background: rgba(127,168,217,0.15); color: #a8c6e8; border-color: rgba(127,168,217,0.4); }
    .fp-tag-row { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.7rem; }
    .fp-tag-link {
      font-size: 0.75rem; text-decoration: none; border-radius: 10px; padding: 0.15em 0.6em; font-weight: 600;
    }
    .fp-tag-link--fandom { background: rgba(217,122,114,0.14); color: #e08880; }
    .fp-tag-link--relationship { background: rgba(217,122,114,0.1); color: #d99a94; }
    .fp-tag-link--category { background: rgba(217,122,114,0.08); color: #cc8983; }
    .fp-tag-link--tag { background: rgba(127,168,217,0.12); color: #a8c6e8; }
    .fp-tag-link:hover { filter: brightness(1.3); }
    .fp-result-synopsis { font-size: 0.9rem; color: #ccc; line-height: 1.6; margin-bottom: 0.8rem; }
    .fp-result-stats { display: flex; flex-wrap: wrap; gap: 0.3rem 1.1rem; font-size: 0.8rem; color: #999; }
    .fp-result-stats strong { color: #ddd; }

    .fp-search-empty { color: #999; font-size: 0.95rem; padding: 2rem 0; }
    .fp-pagination { display: flex; justify-content: center; gap: 0.6rem; margin-top: 2.5rem; }
    .fp-pagination button {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: #ccc; border-radius: 8px;
      padding: 0.5em 1em; cursor: pointer; font-family: inherit; font-size: 0.88rem;
    }
    .fp-pagination button:hover:not(:disabled) { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-pagination button:disabled { opacity: 0.4; cursor: default; }

    @media (max-width: 720px) {
      .fp-filters { grid-template-columns: 1fr; }
      .fp-result { flex-direction: column; }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>

<main class="fp-main">
  <div class="fp-search-top">
    <div>
      <h1 class="fp-search-heading" id="fp-search-heading">Search</h1>
    </div>
    <button class="fp-edit-search-btn" id="fp-edit-search-toggle" type="button">Edit Your Search</button>
  </div>
  <p class="fp-search-sub" id="fp-search-sub"></p>

  <div class="fp-filters" id="fp-filters" hidden>
    <div class="fp-field">
      <label for="f-q">Any Field</label>
      <input type="text" id="f-q" placeholder="Title, tag, fandom, synopsis…" />
    </div>
    <div class="fp-field">
      <label for="f-fandoms">Fandoms</label>
      <input type="text" id="f-fandoms" placeholder="Comma-separated, e.g. Pokémon" list="fp-fandom-list" />
      <datalist id="fp-fandom-list"></datalist>
    </div>
    <div class="fp-field">
      <label for="f-relationships">Relationships</label>
      <input type="text" id="f-relationships" placeholder="Comma-separated" list="fp-relationship-list" />
      <datalist id="fp-relationship-list"></datalist>
    </div>
    <div class="fp-field">
      <label for="f-rating">Rating</label>
      <select id="f-rating">
        <option value="">Any</option>
        <option>General Audiences</option>
        <option>Teen & Up</option>
        <option>Mature/Explicit (Adult)</option>
      </select>
    </div>
    <div class="fp-field">
      <label for="f-tags-include">Additional Tags — Include</label>
      <input type="text" id="f-tags-include" placeholder="Comma-separated, must have all" list="fp-tag-list" />
    </div>
    <div class="fp-field">
      <label for="f-tags-exclude">Additional Tags — Exclude</label>
      <input type="text" id="f-tags-exclude" placeholder="Comma-separated, must have none" list="fp-tag-list" />
      <datalist id="fp-tag-list"></datalist>
    </div>
    <div class="fp-field">
      <label>Categories</label>
      <div class="fp-checkbox-group" id="f-categories">
        <label><input type="checkbox" value="Gen" /> Gen</label>
        <label><input type="checkbox" value="M/F" /> M/F</label>
        <label><input type="checkbox" value="M/M" /> M/M</label>
        <label><input type="checkbox" value="F/F" /> F/F</label>
        <label><input type="checkbox" value="Multi" /> Multi</label>
        <label><input type="checkbox" value="Other" /> Other</label>
      </div>
    </div>
    <div class="fp-field">
      <label>Word Count</label>
      <div class="fp-field-row">
        <input type="number" id="f-word-min" placeholder="Min" min="0" />
        <span>–</span>
        <input type="number" id="f-word-max" placeholder="Max" min="0" />
      </div>
    </div>
    <div class="fp-field">
      <label>Completion Status</label>
      <div class="fp-radio-group" id="f-completion">
        <label><input type="radio" name="fp-completion" value="all" checked /> All works</label>
        <label><input type="radio" name="fp-completion" value="complete" /> Complete only</label>
        <label><input type="radio" name="fp-completion" value="wip" /> Work in progress</label>
      </div>
    </div>
    <div class="fp-field">
      <label for="f-sort">Sort By</label>
      <select id="f-sort">
        <option value="best_match">Best Match</option>
        <option value="updated">Date Updated</option>
        <option value="published">Date Published</option>
        <option value="word_count">Word Count</option>
        <option value="hits">Hits</option>
        <option value="kudos">Kudos</option>
        <option value="comments">Comments</option>
        <option value="bookmarks">Bookmarks</option>
      </select>
    </div>
    <div class="fp-filters-actions">
      <button class="fp-filters-btn fp-filters-btn--clear" id="f-clear" type="button">Clear</button>
      <button class="fp-filters-btn fp-filters-btn--search" id="f-search" type="button">Search</button>
    </div>
  </div>

  <div class="fp-sort-bar" id="fp-sort-bar" hidden>
    <label for="fp-quick-sort">Sort by</label>
    <select id="fp-quick-sort">
      <option value="best_match">Best Match</option>
      <option value="updated">Date Updated</option>
      <option value="published">Date Published</option>
      <option value="word_count">Word Count</option>
      <option value="hits">Hits</option>
      <option value="kudos">Kudos</option>
      <option value="comments">Comments</option>
      <option value="bookmarks">Bookmarks</option>
    </select>
  </div>

  <div id="fp-search-results"><p class="fp-search-empty">Loading…</p></div>
  <div class="fp-pagination" id="fp-pagination" hidden></div>
</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function csv(str) { return String(str || '').split(',').map(s => s.trim()).filter(Boolean); }
function ratingClass(rating) {
  if (rating === 'Teen & Up') return 'fp-badge--rating-teen';
  if (rating === 'Mature/Explicit (Adult)') return 'fp-badge--rating-mature';
  return 'fp-badge--rating-general';
}
function formatDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function tagSearchUrl(params) {
  const usp = new URLSearchParams(params);
  usp.set('sort', 'updated');
  usp.set('expand', '1');
  return `/fanpages/search?${usp.toString()}`;
}

function coverHtml(site) {
  const wrapped = { ...site, cover_url: site.cover_url };
  return window.wikiGeneratedCoverHtml
    ? window.wikiGeneratedCoverHtml(wrapped, { imgClass: 'fp-result-cover', small: true })
    : `<img class="fp-result-cover" src="${site.cover_url || '/images/gallery/pixernbath_13.png'}" alt="" />`;
}

function resultCard(w) {
  const badges = [];
  if (w.rating) badges.push(`<a class="fp-badge ${ratingClass(w.rating)}" href="${tagSearchUrl({ rating: w.rating })}">${escapeHtml(w.rating)}</a>`);
  if (w.is_complete) badges.push(`<span class="fp-badge fp-badge--complete">Complete</span>`);

  const fandomLinks = (w.fandoms || []).map(f => `<a class="fp-tag-link fp-tag-link--fandom" href="${tagSearchUrl({ fandoms: f })}">${escapeHtml(f)}</a>`).join('');
  const relLinks = (w.relationships || []).map(r => `<a class="fp-tag-link fp-tag-link--relationship" href="${tagSearchUrl({ relationships: r })}">${escapeHtml(r)}</a>`).join('');
  const catLinks = (w.categories || []).map(c => `<a class="fp-tag-link fp-tag-link--category" href="${tagSearchUrl({ categories: c })}">${escapeHtml(c)}</a>`).join('');
  const tagLinks = (w.tags || []).map(t => `<a class="fp-tag-link fp-tag-link--tag" href="${tagSearchUrl({ tags_include: t })}">${escapeHtml(t)}</a>`).join('');

  const chapterCount = w.published_chapters != null ? `${w.published_chapters}/${w.published_chapters}` : '?';

  return `
    <div class="fp-result">
      <a class="fp-result-cover-link" href="/fanpages/${escapeHtml(w.story_path)}">${coverHtml(w)}</a>
      <div class="fp-result-body">
        <div class="fp-result-title-row">
          <a class="fp-result-title" href="/fanpages/${escapeHtml(w.story_path)}">${escapeHtml(w.site_title || 'Untitled Story')}</a>
          <span class="fp-result-by">by ${w.author_username ? `<a href="/fanpages/${escapeHtml(w.author_username)}">${escapeHtml(w.author)}</a>` : escapeHtml(w.author || 'Unknown')}</span>
        </div>
        <div class="fp-badge-row">${badges.join('')}</div>
        ${fandomLinks || relLinks || catLinks ? `<div class="fp-tag-row">${fandomLinks}${relLinks}${catLinks}</div>` : ''}
        <p class="fp-result-synopsis">${escapeHtml(w.synopsis || 'No description yet.')}</p>
        ${tagLinks ? `<div class="fp-tag-row">${tagLinks}</div>` : ''}
        <div class="fp-result-stats">
          <span>Language: <strong>English</strong></span>
          ${w.word_count != null ? `<span>Words: <strong>${w.word_count.toLocaleString()}</strong></span>` : ''}
          ${w.published_chapters != null ? `<span>Chapters: <strong>${chapterCount}</strong></span>` : ''}
          <span>Comments: <strong>${w.comments || 0}</strong></span>
          <span>Kudos: <strong>${w.kudos || 0}</strong></span>
          <span>Bookmarks: <strong>${w.bookmarks || 0}</strong></span>
          <span>Hits: <strong>${w.hits || 0}</strong></span>
        </div>
      </div>
    </div>
  `;
}

function bookmarkCard(w) {
  return `
    <div class="fp-result">
      <a class="fp-result-cover-link" href="/fanpages/${escapeHtml(w.story_path)}">${coverHtml(w)}</a>
      <div class="fp-result-body">
        <div class="fp-result-title-row">
          <a class="fp-result-title" href="/fanpages/${escapeHtml(w.story_path)}">${escapeHtml(w.site_title || 'Untitled Story')}</a>
          <span class="fp-result-by">by ${w.author_username ? `<a href="/fanpages/${escapeHtml(w.author_username)}">${escapeHtml(w.author)}</a>` : escapeHtml(w.author || 'Unknown')}</span>
        </div>
        <p class="fp-result-synopsis">${escapeHtml(w.synopsis || 'No description yet.')}</p>
        <div class="fp-result-stats"><span>Bookmarked <strong>${formatDate(w.bookmarked_at)}</strong></span></div>
      </div>
    </div>
  `;
}

// ── Filter panel state <-> URL ──────────────────────────────────────────
function readFiltersFromUrl() {
  const p = new URLSearchParams(window.location.search);
  return {
    q: p.get('q') || '',
    fandoms: p.get('fandoms') || '',
    relationships: p.get('relationships') || '',
    rating: p.get('rating') || '',
    tags_include: p.get('tags_include') || '',
    tags_exclude: p.get('tags_exclude') || '',
    categories: csv(p.get('categories') || ''),
    word_min: p.get('word_min') || '',
    word_max: p.get('word_max') || '',
    completion: p.get('completion') || 'all',
    sort: p.get('sort') || '',
    page: parseInt(p.get('page'), 10) || 1,
    expand: p.get('expand') === '1',
  };
}
function applyFiltersToForm(f) {
  document.getElementById('f-q').value = f.q;
  document.getElementById('f-fandoms').value = f.fandoms;
  document.getElementById('f-relationships').value = f.relationships;
  document.getElementById('f-rating').value = f.rating;
  document.getElementById('f-tags-include').value = f.tags_include;
  document.getElementById('f-tags-exclude').value = f.tags_exclude;
  document.getElementById('f-word-min').value = f.word_min;
  document.getElementById('f-word-max').value = f.word_max;
  document.querySelectorAll('#f-categories input').forEach(cb => { cb.checked = f.categories.includes(cb.value); });
  document.querySelectorAll('#f-completion input').forEach(r => { r.checked = r.value === f.completion; });
  document.getElementById('f-sort').value = f.sort || (f.q ? 'best_match' : 'updated');
  document.getElementById('fp-quick-sort').value = f.sort || (f.q ? 'best_match' : 'updated');
}
function formToParams() {
  const params = {};
  const q = document.getElementById('f-q').value.trim();
  if (q) params.q = q;
  const fandoms = document.getElementById('f-fandoms').value.trim();
  if (fandoms) params.fandoms = fandoms;
  const relationships = document.getElementById('f-relationships').value.trim();
  if (relationships) params.relationships = relationships;
  const rating = document.getElementById('f-rating').value;
  if (rating) params.rating = rating;
  const tagsInclude = document.getElementById('f-tags-include').value.trim();
  if (tagsInclude) params.tags_include = tagsInclude;
  const tagsExclude = document.getElementById('f-tags-exclude').value.trim();
  if (tagsExclude) params.tags_exclude = tagsExclude;
  const cats = [...document.querySelectorAll('#f-categories input:checked')].map(c => c.value);
  if (cats.length) params.categories = cats.join(',');
  const wordMin = document.getElementById('f-word-min').value;
  if (wordMin) params.word_min = wordMin;
  const wordMax = document.getElementById('f-word-max').value;
  if (wordMax) params.word_max = wordMax;
  const completion = document.querySelector('#f-completion input:checked').value;
  if (completion !== 'all') params.completion = completion;
  params.sort = document.getElementById('f-sort').value;
  return params;
}

let BOOKMARK_MODE = false;

async function loadPopularTagsForAutocomplete() {
  try {
    const res = await fetch('/api/tag-catalog');
    const data = await res.json();
    document.getElementById('fp-tag-list').innerHTML = (data.tags || []).map(t => `<option value="${escapeHtml(t)}"></option>`).join('');
  } catch {}
  try {
    const res = await fetch('/api/fandom-catalog');
    const data = await res.json();
    document.getElementById('fp-fandom-list').innerHTML = (data.fandoms || []).map(f => `<option value="${escapeHtml(f)}"></option>`).join('');
  } catch {}
  try {
    const res = await fetch('/api/relationship-catalog');
    const data = await res.json();
    document.getElementById('fp-relationship-list').innerHTML = (data.relationships || []).map(r => `<option value="${escapeHtml(r)}"></option>`).join('');
  } catch {}
}

async function runSearch() {
  const resultsEl = document.getElementById('fp-search-results');
  const subEl = document.getElementById('fp-search-sub');
  const paginationEl = document.getElementById('fp-pagination');
  resultsEl.innerHTML = '<p class="fp-search-empty">Loading…</p>';
  paginationEl.hidden = true;

  const f = readFiltersFromUrl();
  BOOKMARK_MODE = f.sort === 'bookmarks_recent';

  document.getElementById('fp-sort-bar').hidden = BOOKMARK_MODE;
  document.getElementById('fp-edit-search-toggle').style.display = BOOKMARK_MODE ? 'none' : '';

  if (BOOKMARK_MODE) {
    document.getElementById('fp-search-heading').textContent = 'Recently Bookmarked';
    subEl.textContent = 'Stories the community has bookmarked most recently.';
    try {
      const res = await fetch('/api/search/recent-bookmarks?limit=30');
      const data = await res.json();
      if (!data.works.length) { resultsEl.innerHTML = '<p class="fp-search-empty">No bookmarks yet.</p>'; return; }
      resultsEl.innerHTML = data.works.map(bookmarkCard).join('');
    } catch {
      resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load bookmarks right now.</p>';
    }
    return;
  }

  applyFiltersToForm(f);
  document.getElementById('fp-filters').hidden = !f.expand;
  document.getElementById('fp-edit-search-toggle').classList.toggle('active', f.expand);

  document.getElementById('fp-search-heading').textContent = f.q ? `Results for "${f.q}"` : 'Browse Works';

  const apiParams = new URLSearchParams();
  if (f.q) apiParams.set('q', f.q);
  if (f.fandoms) apiParams.set('fandoms', f.fandoms);
  if (f.relationships) apiParams.set('relationships', f.relationships);
  if (f.rating) apiParams.set('rating', f.rating);
  if (f.tags_include) apiParams.set('tags_include', f.tags_include);
  if (f.tags_exclude) apiParams.set('tags_exclude', f.tags_exclude);
  if (f.categories.length) apiParams.set('categories', f.categories.join(','));
  if (f.word_min) apiParams.set('word_min', f.word_min);
  if (f.word_max) apiParams.set('word_max', f.word_max);
  if (f.completion !== 'all') apiParams.set('completion', f.completion);
  if (f.sort) apiParams.set('sort', f.sort);
  apiParams.set('page', f.page);

  try {
    const res = await fetch(`/api/search/works?${apiParams.toString()}`);
    const data = await res.json();
    const works = data.works || [];
    subEl.innerHTML = `<strong>${data.total || 0}</strong> work${data.total === 1 ? '' : 's'} found — sorted by ${escapeHtml((document.getElementById('fp-quick-sort').options[document.getElementById('fp-quick-sort').selectedIndex] || {}).text || 'Best Match')}.`;

    if (!works.length) {
      resultsEl.innerHTML = '<p class="fp-search-empty">No works match that search. Try loosening a filter.</p>';
      return;
    }
    resultsEl.innerHTML = works.map(resultCard).join('');

    const totalPages = Math.max(1, Math.ceil((data.total || 0) / (data.limit || 20)));
    if (totalPages > 1) {
      paginationEl.hidden = false;
      paginationEl.innerHTML = `
        <button id="fp-page-prev" ${f.page <= 1 ? 'disabled' : ''}>← Previous</button>
        <span style="align-self:center; color:#999; font-size:0.88rem;">Page ${f.page} of ${totalPages}</span>
        <button id="fp-page-next" ${f.page >= totalPages ? 'disabled' : ''}>Next →</button>
      `;
      const goPage = (p) => { const usp = new URLSearchParams(window.location.search); usp.set('page', p); window.location.search = usp.toString(); };
      if (f.page > 1) document.getElementById('fp-page-prev').addEventListener('click', () => goPage(f.page - 1));
      if (f.page < totalPages) document.getElementById('fp-page-next').addEventListener('click', () => goPage(f.page + 1));
    }
  } catch {
    resultsEl.innerHTML = '<p class="fp-search-empty">Couldn\'t load search results right now.</p>';
  }
}

document.getElementById('fp-edit-search-toggle').addEventListener('click', () => {
  const panel = document.getElementById('fp-filters');
  panel.hidden = !panel.hidden;
  document.getElementById('fp-edit-search-toggle').classList.toggle('active', !panel.hidden);
});
document.getElementById('f-search').addEventListener('click', () => {
  const params = formToParams();
  window.location.search = new URLSearchParams(params).toString();
});
document.getElementById('f-clear').addEventListener('click', () => {
  window.location.search = '';
});
document.getElementById('fp-quick-sort').addEventListener('change', (e) => {
  const usp = new URLSearchParams(window.location.search);
  usp.set('sort', e.target.value);
  usp.delete('page');
  window.location.search = usp.toString();
});

loadPopularTagsForAutocomplete();
runSearch();
</script>

</body>
</html>
