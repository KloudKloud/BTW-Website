<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Already a dark page: tell dark-mode browser extensions (Dark Reader and similar) not to re-tint it. -->
  <meta name="color-scheme" content="dark" />
  <meta name="darkreader-lock" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    /* The one canonical character page -- independent of any profile, story or
       browse list, like gallery-post.html is for gallery posts. Near-black
       backdrop (the Clubs' colour), no banner/tabs, a generous column. */
    :root { --fp-accent: #f0c060; --fp-accent-light: #f7d68a; --fp-accent-rgb: 240,192,96; }
    html, body { background: #0a0c0d; }
    /* Image big and up front, everything else tucked underneath in one column. */
    .cp-page { max-width: 820px; margin: 0 auto; padding: 1.25rem 1.5rem 4rem; position: relative; }

    /* Light-blue perimeter glow (same family as the gallery post's Back). */
    /* Floats out in the left gutter, level with the top of the art, instead of
       sitting inside the column (it drops back above the art on narrow screens). */
    .cp-back-btn {
      position: absolute; top: 1.25rem; right: calc(100% + 0.5rem);
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(127,168,217,0.1); border: 1px solid rgba(127,168,217,0.55); color: #cfe2f7;
      border-radius: 30px; padding: 0.85em 1.6em; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; white-space: nowrap; box-shadow: 0 0 14px rgba(127,168,217,0.4);
      transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .cp-back-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .cp-back-btn:hover { border-color: rgba(127,168,217,0.9); background: rgba(127,168,217,0.18); color: #fff; box-shadow: 0 0 22px rgba(127,168,217,0.6); transform: translateY(-1px); }

    .char-profile { gap: 1.5rem; will-change: auto; }
    .cp-byline { margin: 0.1rem 0 0.9rem; color: #999; font-size: 0.9rem; }
    .cp-byline a { color: var(--fp-accent-light); text-decoration: none; }
    .cp-byline a:hover { text-decoration: underline; }

    /* Quote -- a little sign-off tucked under the Lore. */
    .cp-quote {
      text-align: center; padding: 1.4rem 1.5rem; border-radius: 16px;
      background: #000; border: 1px solid rgba(255,255,255,0.1);
    }
    .cp-quote-text { font-family: 'Fredoka', 'Lato', cursive; font-size: 1.25rem; font-style: italic; color: #f0f0f0; line-height: 1.5; }
    .cp-quote-text::before { content: '“'; color: var(--fp-accent); margin-right: 0.15em; }
    .cp-quote-text::after { content: '”'; color: var(--fp-accent); margin-left: 0.15em; }
    .cp-quote-by { margin-top: 0.55rem; font-size: 0.85rem; color: var(--fp-accent-light); }

    /* Comments: plain black, tidy and centred under the card. */
    .fp-char-empty { color: #999; text-align: center; padding: 3rem 0; }
    .cp-comments { margin: 2.25rem auto 0; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.08); }
    .cp-comments .cc-compose { margin-bottom: 1.25rem; }
    .cp-comments .cc-compose > textarea { background: #000; background-image: none; border-color: rgba(255,255,255,0.16); }
    .cp-comments .cc-compose-box { background: #000; }
    .cp-comments .cc-bubble { background: #000; border-color: rgba(255,255,255,0.1); }
    .cp-comments .cc-empty { padding: 0.3rem 0 0; }
    @media (max-width: 1180px) {
      .cp-back-btn { position: static; margin: 0 0 1.5rem; }
    }
    @media (max-width: 820px) {
      .cp-page { padding: 1rem 1rem 3rem; }
      .cp-back-btn { font-size: 0.85rem; padding: 0.55em 1.1em; }
      .cp-back-btn svg { width: 18px; height: 18px; }
    }
  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<main class="cp-page">
  <button type="button" class="cp-back-btn" id="cp-back-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    Back
  </button>

  <div id="fp-char-profile" class="char-profile"><p class="fp-char-empty">Loading…</p></div>

  <div class="cc-section cp-comments" id="fp-char-detail-comments" hidden>
    <p class="cc-title">💬 Comments</p>
    <div class="cc-compose" id="fp-char-cc-compose" style="display:none;">
      <textarea id="fp-char-cc-compose-input" placeholder="Add a comment…" maxlength="2000"></textarea>
      <button class="cc-compose-btn" id="fp-char-cc-compose-btn" type="button">Post</button>
    </div>
    <div class="cc-list" id="fp-char-cc-list"><p class="cc-empty">Loading…</p></div>
  </div>
</main>

<script>
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// Defensive client-side mirror of the server's protocol allowlist — rejects
// javascript:/data:/vbscript: URIs before they're ever assigned to an href.
function isSafeLinkUrl(url) {
  try { return ['http:', 'https:'].includes(new URL(String(url), location.origin).protocol); }
  catch { return false; }
}


const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});
let currentChar = null;

// A view only counts once a character has actually been open for 10s (not
// just refreshed, or clicked past mid-slideshow), and at most once per 5
// minutes per character -- both tracked client-side.
let pendingViewTimer = null;
function scheduleCharViewBump(id) {
  clearTimeout(pendingViewTimer);
  const cooldownKey = `btw_view_character_${id}`;
  pendingViewTimer = setTimeout(() => {
    const last = parseInt(localStorage.getItem(cooldownKey) || '0', 10);
    if (Date.now() - last < 5 * 60 * 1000) return;
    localStorage.setItem(cooldownKey, String(Date.now()));
    fetch(`/api/character/${id}/view`, { method: 'POST', headers: authHeaders() }).catch(() => {});
  }, 10000);
}

const NA = 'N/A';
const DEFAULT_REF = '/images/defaultchar.jpg';
let lastSearchItems = [];
function isBlank(v) { return !v || !String(v).trim() || String(v).trim() === NA; }

// Theme Song links: open.spotify.com is a plain https link, so clicking it
// just opens a browser tab -- it doesn't prompt to hand off to the Spotify
// app the way a real deep link does. Convert to the spotify: URI scheme and
// try that first; if the tab is still visible after a beat (no Spotify app
// installed, or a platform that doesn't support the handoff), fall back to
// the normal web link. Unregistered custom-protocol navigations are safely
// no-ops in every modern browser, so this can't break the click either way.
function wireSpotifyAppLink(a) {
  const webUrl = a.href;
  const m = webUrl.match(/open\.spotify\.com\/(track|album|playlist|artist|episode|show)\/([A-Za-z0-9]+)/);
  if (!m) return;
  // Exempts this link from fanpages-nav.js's "leaving BTWFics" interstitial
  // (which would otherwise capture the click first and block this
  // function's own app-then-web-fallback logic from ever running).
  a.dataset.skipLeavingWarning = '1';
  const spotifyUri = `spotify:${m[1]}:${m[2]}`;
  a.addEventListener('click', (e) => {
    e.preventDefault();
    let fallbackTimer;
    const cancelFallback = () => {
      clearTimeout(fallbackTimer);
      document.removeEventListener('visibilitychange', cancelFallback);
      window.removeEventListener('blur', cancelFallback);
    };
    fallbackTimer = setTimeout(() => { cancelFallback(); window.open(webUrl, '_blank', 'noopener'); }, 1500);
    document.addEventListener('visibilitychange', cancelFallback, { once: true });
    window.addEventListener('blur', cancelFallback, { once: true });
    window.location.href = spotifyUri;
  });
}
function richText(s) {
  let out = escapeHtml(s || '');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return out;
}


// "Art Credit" -- last row in the Fun Facts box. "Original" when the owner
// made/owns the art, "Referenced" when it's someone else's, in which case the
// source link (if they gave one) is shown truncated to fit the card. The
// link is target=_blank, so fanpages-nav.js's "You're Leaving BTWFics"
// interstitial gates it automatically.
function truncateLinkLabel(url, max) {
  let label = String(url).replace(/^https?:\/\/(www\.)?/i, '').replace(/\/$/, '');
  return label.length > max ? label.slice(0, max - 1) + '…' : label;
}
function artCreditFactRow(char) {
  if (!char.ref_image || char.ref_image === DEFAULT_REF) return null;
  const fact = document.createElement('div');
  fact.className = 'char-fact';
  const bullet = document.createElement('span');
  bullet.className = 'char-fact-bullet';
  bullet.textContent = '✦';
  fact.appendChild(bullet);
  const content = document.createElement('div');
  content.style.cssText = 'flex:1; min-width:0;';
  const heading = document.createElement('span');
  heading.style.cssText = 'color:#f0c060; font-weight:700; text-shadow:0 0 12px rgba(240,192,96,0.6);';
  heading.textContent = 'Art Credit:';
  content.appendChild(heading);
  content.appendChild(document.createTextNode(' '));
  if (char.is_official_art !== false) {
    const v = document.createElement('span');
    v.style.cssText = 'color:#2fbf5f; font-weight:600;';
    v.textContent = 'Original';
    content.appendChild(v);
  } else {
    const v = document.createElement('span');
    v.style.cssText = 'color:#d9a13a; font-weight:600;';
    v.textContent = 'Referenced';
    content.appendChild(v);
    const url = char.official_art_source_url;
    if (url && isSafeLinkUrl(url)) {
      const line = document.createElement('div');
      line.style.cssText = 'margin-top:0.35rem; min-width:0;';
      const a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer nofollow ugc';
      a.title = url;
      a.style.cssText = 'display:block; color:#d9a13a; text-decoration:underline; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:0.85rem;';
      a.textContent = truncateLinkLabel(url, 44);
      line.appendChild(a);
      content.appendChild(line);
    }
  }
  fact.appendChild(content);
  return fact;
}

const CURRENT_USER = (() => {
  try { return JSON.parse(localStorage.getItem('btw_user') || sessionStorage.getItem('btw_user') || 'null'); } catch { return null; }
})();
let ccTargetId = null;
function ccAvatarHtml(c) {
  const name = c.display_name || c.username || '?';
  const initial = escapeHtml(name.charAt(0).toUpperCase());
  return c.avatar ? `<img class="cc-avatar" src="${c.avatar}" alt="" />` : `<span class="cc-avatar-fallback">${initial}</span>`;
}
function ccTimeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}
function ccIsMine(c) { return CURRENT_USER && (CURRENT_USER.id === c.user_id || CURRENT_USER.is_admin); }
function ccCommentEl(c, isReply) {
  const wrap = document.createElement('div');
  wrap.className = 'cc-item';
  const avatarHolder = document.createElement('div');
  avatarHolder.innerHTML = ccAvatarHtml(c);
  wrap.appendChild(avatarHolder.firstElementChild);

  const body = document.createElement('div');
  body.className = 'cc-body-wrap';
  body.innerHTML = `
    <div class="cc-bubble">
      <span class="cc-name"><a href="${window.fpUrl(`/${encodeURIComponent(c.username)}`)}">${escapeHtml(c.display_name || c.username)}</a></span>
      <span class="cc-time">${ccTimeAgo(c.created_at)}</span>
      <p class="cc-text">${c.reply_to_username ? `<span class="cc-mention">@${escapeHtml(c.reply_to_username)}</span> ` : ''}${escapeHtml(c.body)}</p>
    </div>
    <div class="cc-actions">
      ${token && !isReply ? '<button class="cc-action-btn" data-action="reply">Reply</button>' : ''}
      ${ccIsMine(c) ? '<button class="cc-action-btn" data-action="delete">Delete</button>' : (token ? '<button class="cc-action-btn cc-action-btn--flag" data-action="report" title="Report">&#127987;&#65039;</button>' : '')}
    </div>
  `;
  wrap.appendChild(body);

  const replyBtn = body.querySelector('[data-action="reply"]');
  if (replyBtn) replyBtn.addEventListener('click', () => ccOpenReplyBox(body, c));
  const deleteBtn = body.querySelector('[data-action="delete"]');
  if (deleteBtn) deleteBtn.addEventListener('click', () => ccDeleteComment(c.id));
  const reportBtn = body.querySelector('[data-action="report"]');
  if (reportBtn) reportBtn.addEventListener('click', () => window.reportContent('comment', c.id));

  if (!isReply && (c.replies || []).length) {
    const repliesWrap = document.createElement('div');
    repliesWrap.className = 'cc-replies';
    c.replies.forEach(r => repliesWrap.appendChild(ccCommentEl(r, true)));
    body.appendChild(repliesWrap);
  }
  return wrap;
}
function ccOpenReplyBox(bodyEl, parentComment) {
  const existing = bodyEl.querySelector('.cc-reply-box');
  if (existing) { existing.querySelector('textarea').focus(); return; }
  const box = document.createElement('div');
  box.className = 'cc-reply-box';
  box.innerHTML = `
    <textarea placeholder="Reply to ${escapeHtml(parentComment.display_name || parentComment.username)}…" maxlength="2000"></textarea>
    <button class="cc-compose-btn" type="button">Reply</button>
  `;
  const textarea = box.querySelector('textarea');
  box.querySelector('button').addEventListener('click', async () => {
    const text = textarea.value.trim();
    if (!text) return;
    const btn = box.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/content-comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ target_type: 'character', target_id: ccTargetId, body: text, parent_id: parentComment.id }),
      });
      if (res.ok) {
        const data = await res.json().catch(() => null);
        if (data && data.levelUp && window.fpnavShowXpGain) window.fpnavShowXpGain(data.levelUp, btn);
        await ccLoadComments();
      }
    } finally { btn.disabled = false; }
  });
  const repliesWrap = bodyEl.querySelector('.cc-replies');
  bodyEl.insertBefore(box, repliesWrap || null);
  textarea.focus();
}
async function ccDeleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await fetch(`/api/content-comments/${id}`, { method: 'DELETE', headers: authHeaders() });
    ccLoadComments();
  } catch {}
}
async function ccLoadComments() {
  const list = document.getElementById('fp-char-cc-list');
  if (!list) return;
  try {
    const res = await fetch(`/api/content-comments?target_type=character&target_id=${ccTargetId}`);
    const data = await res.json();
    const comments = data.comments || [];
    list.innerHTML = '';
    if (!comments.length) { list.innerHTML = '<p class="cc-empty">No comments yet — be the first!</p>'; return; }
    comments.forEach(c => list.appendChild(ccCommentEl(c, false)));
  } catch { list.innerHTML = '<p class="cc-empty">Couldn\'t load comments right now.</p>'; }
}
function ccInitSection(targetId) {
  ccTargetId = targetId;
  document.getElementById('fp-char-cc-compose').style.display = token ? 'flex' : 'none';
  ccLoadComments();
}
async function ccHandleCompose() {
  const input = document.getElementById('fp-char-cc-compose-input');
  const text = input.value.trim();
  if (!text || !ccTargetId) return;
  const btn = document.getElementById('fp-char-cc-compose-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/content-comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ target_type: 'character', target_id: ccTargetId, body: text }),
    });
    if (res.ok) {
      const data = await res.json().catch(() => null);
      if (data && data.levelUp && window.fpnavShowXpGain) window.fpnavShowXpGain(data.levelUp, btn);
      input.value = ''; await ccLoadComments();
    }
  } finally { btn.disabled = false; }
}
document.getElementById('fp-char-cc-compose-btn').addEventListener('click', ccHandleCompose);

// ── Voice Claim playback — a single shared <audio> plus a Spotify-style
// bottom bar (seek slider, current/total time, volume, Close). Spamming the
// mic restarts the clip from the top instead of stacking overlapping plays;
// re-picking a different character's clip just swaps the source. The bar
// itself is built once on first play and reused/re-shown after that. ──
let fpVoiceSeeking = false;
function fpFormatVoiceTime(sec) {
  if (!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
const FP_VOICE_PLAY_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M8 5v14l11-7L8 5Z" fill="currentColor"/></svg>';
const FP_VOICE_PAUSE_ICON = '<svg viewBox="0 0 24 24" fill="none"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';
function fpSyncVoicePlayPauseIcon() {
  const btn = document.getElementById('fp-voice-bar-playpause');
  if (!btn) return;
  const audio = fpGetVoiceAudio();
  btn.innerHTML = audio.paused ? FP_VOICE_PLAY_ICON : FP_VOICE_PAUSE_ICON;
}
// Volume slider sits at 75% by default, which is just the file's normal
// (unboosted) volume -- anything past that pushes gain above 1.0 via a Web
// Audio GainNode, since a plain <audio>.volume can never exceed 100%. Below
// 75% behaves like a normal volume knob down to silence.
function fpVoiceSliderToGain(pct) {
  pct = Math.max(0, Math.min(100, Number(pct)));
  return pct <= 75 ? (pct / 75) : (1 + (pct - 75) / 25);
}
let fpVoiceAudioCtx = null;
let fpVoiceGainNode = null;
function fpEnsureVoiceGainNode(audio) {
  if (fpVoiceAudioCtx) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    fpVoiceAudioCtx = new Ctx();
    const source = fpVoiceAudioCtx.createMediaElementSource(audio);
    fpVoiceGainNode = fpVoiceAudioCtx.createGain();
    source.connect(fpVoiceGainNode).connect(fpVoiceAudioCtx.destination);
    audio.volume = 1;
  } catch {
    fpVoiceAudioCtx = null;
    fpVoiceGainNode = null;
  }
}
function fpApplyVoiceVolume(pct) {
  const audio = fpGetVoiceAudio();
  const gain = fpVoiceSliderToGain(pct);
  if (fpVoiceGainNode) fpVoiceGainNode.gain.value = gain;
  else audio.volume = Math.min(1, gain);
}
function fpGetVoiceAudio() {
  if (window.fpVoiceAudio) return window.fpVoiceAudio;
  const audio = new Audio();
  audio.addEventListener('loadedmetadata', () => {
    const totalEl = document.getElementById('fp-voice-bar-total');
    if (totalEl) totalEl.textContent = fpFormatVoiceTime(audio.duration);
  });
  audio.addEventListener('timeupdate', () => {
    if (fpVoiceSeeking) return;
    const seek = document.getElementById('fp-voice-bar-seek');
    const curEl = document.getElementById('fp-voice-bar-current');
    if (seek && audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
    if (curEl) curEl.textContent = fpFormatVoiceTime(audio.currentTime);
  });
  audio.addEventListener('play', fpSyncVoicePlayPauseIcon);
  audio.addEventListener('pause', fpSyncVoicePlayPauseIcon);
  window.fpVoiceAudio = audio;
  fpEnsureVoiceGainNode(audio);
  return audio;
}
function fpEnsureVoiceBar() {
  let bar = document.getElementById('fp-voice-bar');
  if (bar) return bar;
  bar = document.createElement('div');
  bar.id = 'fp-voice-bar';
  bar.className = 'fp-voice-bar';
  bar.hidden = true;
  bar.innerHTML = `
    <span class="fp-voice-bar-name" id="fp-voice-bar-name"></span>
    <button type="button" class="fp-voice-bar-playpause" id="fp-voice-bar-playpause" title="Play/Pause">${FP_VOICE_PAUSE_ICON}</button>
    <span class="fp-voice-bar-time" id="fp-voice-bar-current">0:00</span>
    <input type="range" class="fp-voice-bar-seek" id="fp-voice-bar-seek" min="0" max="100" step="0.1" value="0">
    <span class="fp-voice-bar-time" id="fp-voice-bar-total">0:00</span>
    <svg class="fp-voice-bar-vol-icon" viewBox="0 0 24 24" fill="none"><path d="M4 9v6h4l5 5V4L8 9H4Z" fill="currentColor"/><path d="M16.3 8.3a5.2 5.2 0 0 1 0 7.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input type="range" class="fp-voice-bar-volume" id="fp-voice-bar-volume" min="0" max="100" step="1" value="75">
    <button type="button" class="fp-voice-bar-close" id="fp-voice-bar-close">✕ Close</button>
  `;
  document.body.appendChild(bar);
  bar.querySelector('#fp-voice-bar-playpause').addEventListener('click', () => {
    const audio = fpGetVoiceAudio();
    if (audio.paused) fpResumeAndPlay(audio); else audio.pause();
  });
  const seek = bar.querySelector('#fp-voice-bar-seek');
  seek.addEventListener('input', () => {
    fpVoiceSeeking = true;
    const audio = fpGetVoiceAudio();
    const curEl = document.getElementById('fp-voice-bar-current');
    if (audio.duration) curEl.textContent = fpFormatVoiceTime((seek.value / 100) * audio.duration);
  });
  seek.addEventListener('change', () => {
    const audio = fpGetVoiceAudio();
    if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
    fpVoiceSeeking = false;
  });
  bar.querySelector('#fp-voice-bar-volume').addEventListener('input', (e) => {
    fpApplyVoiceVolume(e.target.value);
  });
  bar.querySelector('#fp-voice-bar-close').addEventListener('click', fpCloseVoiceBar);
  fpApplyVoiceVolume(75);
  return bar;
}
function fpResumeAndPlay(audio) {
  if (fpVoiceAudioCtx && fpVoiceAudioCtx.state === 'suspended') fpVoiceAudioCtx.resume().catch(() => {});
  audio.play().catch(() => {});
}
function fpCloseVoiceBar() {
  const audio = fpGetVoiceAudio();
  audio.pause();
  document.querySelectorAll('.fp-voice-icon-btn.is-playing').forEach(b => b.classList.remove('is-playing'));
  const bar = document.getElementById('fp-voice-bar');
  if (bar) bar.hidden = true;
}
function fpPlayVoiceClip(url, btn, charName) {
  const audio = fpGetVoiceAudio();
  if (audio.dataset.src !== url) { audio.src = url; audio.dataset.src = url; }
  audio.currentTime = 0;
  fpResumeAndPlay(audio);
  document.querySelectorAll('.fp-voice-icon-btn.is-playing').forEach(b => b.classList.remove('is-playing'));
  btn.classList.add('is-playing');
  audio.onended = () => btn.classList.remove('is-playing');
  audio.onpause = () => btn.classList.remove('is-playing');
  const bar = fpEnsureVoiceBar();
  bar.hidden = false;
  document.getElementById('fp-voice-bar-name').textContent = charName ? `${charName}'s Voice Claim` : 'Voice Claim';
  fpSyncVoicePlayPauseIcon();
}
function fpMakeVoiceBtn(url, charName) {
  const btn = document.createElement('button');
  btn.className = 'fp-share-icon-btn fp-voice-icon-btn';
  btn.type = 'button';
  btn.title = `Play ${charName}'s voice claim`;
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" fill="currentColor"/><path d="M19 11a7 7 0 0 1-14 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  btn.addEventListener('click', (e) => { e.stopPropagation(); fpPlayVoiceClip(url, btn, charName); });
  return btn;
}

function renderCharacter(char) {
  const locked = !!char.nsfw_locked;
  const profile = document.getElementById('fp-char-profile');
  profile.innerHTML = '';

  const refWrap = document.createElement('div');
  refWrap.className = 'char-ref-wrap';
  if (locked) {
    refWrap.style.aspectRatio = '1 / 1';
    refWrap.innerHTML = '<div class="char-ref-placeholder"><span>🔒</span><span>Hidden by SFW Mode</span></div>';
  } else {
    refWrap.style.aspectRatio = char.ref_image ? '1 / 1' : '13 / 10';
    const img = document.createElement('img');
    img.alt = char.name;
    img.src = char.ref_image || DEFAULT_REF;
    img.style.objectPosition = `${char.ref_position_x != null ? char.ref_position_x : 50}% ${char.ref_position_y != null ? char.ref_position_y : 50}%`;
    img.onerror = function () {
      refWrap.innerHTML = '<div class="char-ref-placeholder"><span>✦</span><span>No reference yet</span></div>';
    };
    refWrap.appendChild(img);
  }
  profile.appendChild(refWrap);

  const bio = document.createElement('div');
  bio.className = 'char-bio-box';
  const nameRow = document.createElement('div');
  nameRow.className = 'char-name-row';
  const nameEl = document.createElement('h1');
  nameEl.className = 'char-name';
  nameEl.textContent = char.name;
  nameRow.appendChild(nameEl);
  const shareBtn = document.createElement('button');
  shareBtn.className = 'fp-share-icon-btn';
  shareBtn.type = 'button';
  shareBtn.title = 'Share this character';
  shareBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 20.5c-0.5-8 5-13 11.5-13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M13.3 2.2l8.7 6.3-8.7 6.3V2.2z" fill="currentColor"/></svg>';
  shareBtn.addEventListener('click', (e) => {
    window.fpShare(e.currentTarget, `${window.location.origin}/character?id=${char.id}`);
  });
  nameRow.appendChild(shareBtn);
  if (char.voice_claim_url) nameRow.appendChild(fpMakeVoiceBtn(char.voice_claim_url, char.name));
  bio.appendChild(nameRow);
  const byline = document.createElement('p');
  byline.className = 'cp-byline';
  byline.innerHTML = `Created by <a href="${window.fpUrl(`/${encodeURIComponent(char.owner_username)}`)}">${escapeHtml(char.owner_display_name || char.owner_username)}</a>`;
  bio.appendChild(byline);
  const descWrap = document.createElement('div');
  descWrap.className = 'char-desc';
  (char.description || NA).split('\n').filter(Boolean).forEach(text => {
    const p = document.createElement('p');
    p.innerHTML = richText(text);
    descWrap.appendChild(p);
  });
  bio.appendChild(descWrap);
  profile.appendChild(bio);

  const row = document.createElement('div');
  row.className = 'char-cards-row';

  const statsBox = document.createElement('div');
  statsBox.className = 'char-box';
  const statsTitle = document.createElement('span');
  statsTitle.className = 'char-box-title';
  statsTitle.textContent = 'Stats';
  statsBox.appendChild(statsTitle);

  const stats = char.stats || {};
  Object.entries(stats).forEach(([label, value]) => {
    if (label === 'Theme Song') return;
    const statRow = document.createElement('div');
    statRow.className = 'char-stat-row';
    const lbl = document.createElement('span');
    lbl.className = 'char-stat-label';
    lbl.textContent = label;
    const val = document.createElement('span');
    val.className = 'char-stat-value';
    val.innerHTML = richText(value || NA);
    statRow.appendChild(lbl);
    statRow.appendChild(val);
    statsBox.appendChild(statRow);
  });

  const relationships = (char.relationships || []).filter(r => r && r.name);
  if (relationships.length) {
    const relDivider = document.createElement('div');
    relDivider.style.cssText = 'border-top:1px solid rgba(255,255,255,0.08); margin:0.75rem 0 0.6rem;';
    statsBox.appendChild(relDivider);
    const relLabel = document.createElement('span');
    relLabel.className = 'char-stat-label';
    relLabel.style.display = 'block';
    relLabel.style.marginBottom = '0.4rem';
    relLabel.textContent = 'Relationships';
    statsBox.appendChild(relLabel);
    relationships.forEach(rel => {
      const relLine = document.createElement('div');
      relLine.style.cssText = 'font-size:0.88rem; color:#ccc; padding:0.15rem 0;';

      if (rel.character_id) {
        const avatar = document.createElement('img');
        avatar.className = 'char-rel-avatar';
        avatar.alt = '';
        avatar.src = DEFAULT_REF;
        relLine.appendChild(avatar);

        const nameLink = document.createElement('a');
        nameLink.href = window.fpUrl(`/character?id=${encodeURIComponent(rel.character_id)}`);
        nameLink.style.cssText = 'color:#f0c060; font-weight:700; text-decoration:none; text-shadow:0 0 12px rgba(240,192,96,0.6);';
        nameLink.textContent = rel.name;
        relLine.appendChild(nameLink);

        const known = lastSearchItems.find(c => String(c.id) === String(rel.character_id));
        if (known && known.image) avatar.src = known.image;
        else {
          fetch(`/api/characters/${rel.character_id}`)
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d && d.character && d.character.ref_image) avatar.src = d.character.ref_image; })
            .catch(() => {});
        }
      } else {
        const nameSpan = document.createElement('span');
        nameSpan.style.cssText = 'color:#f0c060; font-weight:700;';
        nameSpan.textContent = rel.name;
        relLine.appendChild(nameSpan);
      }
      if (!isBlank(rel.type)) relLine.appendChild(document.createTextNode(' — ' + rel.type));
      statsBox.appendChild(relLine);
    });
  }
  row.appendChild(statsBox);

  const factsBox = document.createElement('div');
  factsBox.className = 'char-box';
  const factsTitle = document.createElement('span');
  factsTitle.className = 'char-box-title';
  factsTitle.textContent = 'Fun Facts';
  factsBox.appendChild(factsTitle);

  const themeSong = stats['Theme Song'];
  const themeFact = document.createElement('div');
  themeFact.className = 'char-fact';
  const themeBullet = document.createElement('span');
  themeBullet.className = 'char-fact-bullet';
  themeBullet.textContent = '✦';
  themeFact.appendChild(themeBullet);
  const themeContent = document.createElement('span');
  if (!isBlank(themeSong) && /^https?:\/\//i.test(themeSong.trim())) {
    const a = document.createElement('a');
    a.href = themeSong.trim(); a.target = '_blank'; a.rel = 'noopener noreferrer nofollow ugc'; a.style.color = '#f0c060'; a.textContent = 'Theme Song';
    wireSpotifyAppLink(a);
    themeContent.appendChild(a);
    themeContent.appendChild(document.createTextNode(' 🎵'));
  } else {
    themeContent.textContent = 'Theme Song: N/A';
  }
  themeFact.appendChild(themeContent);
  factsBox.appendChild(themeFact);

  const storiesFact = document.createElement('div');
  storiesFact.className = 'char-fact';
  const storiesBullet = document.createElement('span');
  storiesBullet.className = 'char-fact-bullet';
  storiesBullet.textContent = '✦';
  storiesFact.appendChild(storiesBullet);
  const storiesContent = document.createElement('div');
  storiesContent.style.cssText = 'flex:1; min-width:0;';
  const storiesHeading = document.createElement('span');
  storiesHeading.style.cssText = 'color:#f0c060; font-weight:700; text-shadow:0 0 12px rgba(240,192,96,0.6);';
  storiesHeading.textContent = 'Stories';
  storiesContent.appendChild(storiesHeading);
  const storiesWrap = document.createElement('div');
  storiesWrap.style.cssText = 'margin-top:0.55rem;';
  storiesWrap.innerHTML = '<p style="color:#888; font-size:0.82rem;">Loading…</p>';
  storiesContent.appendChild(storiesWrap);
  storiesFact.appendChild(storiesContent);
  factsBox.appendChild(storiesFact);
  fetch(`/api/characters/${char.id}/stories`)
    .then(r => r.ok ? r.json() : { stories: [] })
    .then(data => {
      const stories = data.stories || [];
      storiesWrap.innerHTML = '';
      if (!stories.length) {
        storiesWrap.innerHTML = `<p style="color:#888; font-size:0.82rem;">No linked stories with ${escapeHtml(char.name)} yet.</p>`;
        return;
      }
      const storiesRow = document.createElement('div');
      storiesRow.style.cssText = 'display:flex; flex-wrap:wrap; gap:0.6rem;';
      stories.forEach(s => {
        const a = document.createElement('a');
        a.href = window.fpUrl(`/${s.story_path}`);
        a.style.cssText = 'display:flex; align-items:center; gap:0.5rem; text-decoration:none; background:#1a1a1a; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:0.35rem 0.6rem 0.35rem 0.35rem; max-width:180px;';
        const cover = document.createElement('img');
        cover.src = s.cover_url || '/images/noimage.png';
        cover.alt = '';
        cover.style.cssText = 'width:28px; height:38px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#222;';
        const span = document.createElement('span');
        span.style.cssText = 'font-size:0.8rem; color:#ddd; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;';
        span.textContent = s.site_title;
        a.appendChild(cover); a.appendChild(span);
        storiesRow.appendChild(a);
      });
      storiesWrap.appendChild(storiesRow);
    })
    .catch(() => { storiesWrap.innerHTML = '<p style="color:#888; font-size:0.82rem;">Couldn\'t load linked stories right now.</p>'; });

  (char.facts && char.facts.length ? char.facts : [NA]).forEach(item => {
    const fact = document.createElement('div');
    fact.className = 'char-fact';
    const bullet = document.createElement('span');
    bullet.className = 'char-fact-bullet';
    bullet.textContent = '✦';
    const content = document.createElement('span');
    content.innerHTML = richText(item);
    fact.appendChild(bullet);
    fact.appendChild(content);
    factsBox.appendChild(fact);
  });
  const creditFact = artCreditFactRow(char);
  if (creditFact) factsBox.appendChild(creditFact);
  row.appendChild(factsBox);
  profile.appendChild(row);

  const loreBox = document.createElement('div');
  loreBox.className = 'char-box char-lore-box';
  const loreTitle = document.createElement('span');
  loreTitle.className = 'char-box-title';
  loreTitle.textContent = 'Lore';
  loreBox.appendChild(loreTitle);
  const spoiler = document.createElement('div');
  spoiler.className = 'char-lore-spoiler';
  const textWrap = document.createElement('div');
  textWrap.className = 'char-lore-text';
  ((char.lore && char.lore.length) ? char.lore : [NA]).forEach(item => {
    const p = document.createElement('p');
    p.innerHTML = richText(item);
    textWrap.appendChild(p);
  });
  spoiler.appendChild(textWrap);
  const revealBtn = document.createElement('button');
  revealBtn.className = 'char-lore-reveal';
  revealBtn.textContent = '⚠ Spoilers — click to reveal';
  revealBtn.addEventListener('click', () => spoiler.classList.add('revealed'));
  spoiler.appendChild(revealBtn);
  loreBox.appendChild(spoiler);
  profile.appendChild(loreBox);

  // Quote -- a little sign-off under the Lore.
  if (!isBlank(char.quote)) {
    const quoteBox = document.createElement('div');
    quoteBox.className = 'cp-quote';
    quoteBox.innerHTML = `<p class="cp-quote-text">${richText(char.quote)}</p><p class="cp-quote-by">— ${escapeHtml(char.name)}</p>`;
    profile.appendChild(quoteBox);
  }

  const footer = document.createElement('div');
  footer.className = 'char-detail-footer';

  const viewsEl = document.createElement('span');
  viewsEl.className = 'char-detail-views';
  viewsEl.innerHTML = `👁 <span class="char-detail-views-count">${char.view_count || 0}</span>`;
  footer.appendChild(viewsEl);

  const likeBtn = document.createElement('button');
  likeBtn.className = 'art-view-like art-view-like--big' + (char.liked ? ' liked' : '');
  likeBtn.type = 'button';
  likeBtn.setAttribute('aria-label', 'Like this character');
  likeBtn.innerHTML = `<span class="char-like-icon">${char.liked ? '♥' : '♡'}</span> <span class="char-like-count">${char.like_count || 0}</span>`;
  likeBtn.addEventListener('click', async () => {
    if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }
    likeBtn.disabled = true;
    try {
      const res = await fetch(`/api/moderator/character/${char.id}/like`, { method: char.liked ? 'DELETE' : 'POST', headers: authHeaders() });
      const data = await res.json();
      char.liked = data.liked; char.like_count = data.like_count;
      likeBtn.classList.toggle('liked', data.liked);
      likeBtn.querySelector('.char-like-icon').textContent = data.liked ? '♥' : '♡';
      likeBtn.querySelector('.char-like-count').textContent = data.like_count;
    } catch {}
    likeBtn.disabled = false;
  });
  footer.appendChild(likeBtn);

  const bookmarkBtn = document.createElement('button');
  bookmarkBtn.className = 'art-view-bookmark-btn' + (char.bookmarked ? ' bookmarked' : '');
  bookmarkBtn.type = 'button';
  bookmarkBtn.setAttribute('aria-label', 'Bookmark this character');
  bookmarkBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 3a1 1 0 0 0-1 1v16.5a.5.5 0 0 0 .8.4L12 16l6.2 4.9a.5.5 0 0 0 .8-.4V4a1 1 0 0 0-1-1H6z"/></svg>';
  bookmarkBtn.addEventListener('click', async () => {
    if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }
    bookmarkBtn.disabled = true;
    try {
      const res = await fetch(`/api/moderator/character/${char.id}/bookmark`, { method: char.bookmarked ? 'DELETE' : 'POST', headers: authHeaders() });
      const data = await res.json();
      char.bookmarked = data.bookmarked;
      bookmarkBtn.classList.toggle('bookmarked', data.bookmarked);
    } catch {}
    bookmarkBtn.disabled = false;
  });
  footer.appendChild(bookmarkBtn);

  profile.appendChild(footer);
  scheduleCharViewBump(char.id);

  document.title = `${char.name} ✦ BTW`;
  ccInitSection(char.id);
}


// Back returns to wherever you came from (a profile's Characters tab, the
// Characters browse page, a story, a gallery post...). Only a freshly opened
// shared link, with nothing to go back to, falls back to the owner's profile.
document.getElementById('cp-back-btn').addEventListener('click', () => {
  const cameFromHere = document.referrer && new URL(document.referrer, location.href).origin === location.origin;
  if (history.length > 1 && cameFromHere) history.back();
  else if (currentChar) window.location.href = window.fpUrl(`/${currentChar.owner_username}#characters`);
  else window.location.href = window.fpUrl('/characters');
});

(async () => {
  const id = new URLSearchParams(window.location.search).get('id');
  const profileEl = document.getElementById('fp-char-profile');
  if (!id) { profileEl.innerHTML = '<p class="fp-char-empty">No character specified.</p>'; return; }
  try {
    const res = await fetch(`/api/characters/${encodeURIComponent(id)}`, { headers: authHeaders() });
    if (!res.ok) { profileEl.innerHTML = '<p class="fp-char-empty">Character not found.</p>'; return; }
    const { character } = await res.json();
    currentChar = character;
    document.getElementById('fp-char-detail-comments').hidden = false;
    renderCharacter(character);
  } catch {
    profileEl.innerHTML = '<p class="fp-char-empty">Couldn\'t load this character right now.</p>';
  }
})();
</script>

</body>
