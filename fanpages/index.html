<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fanpages ✦ Between Two Worlds</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* Blurred full-bleed background, fixed behind everything */
    .fp-bg-wrap { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #0d0d0d; }
    .fp-bg-img {
      width: 100%; height: 100%; object-fit: cover;
      filter: blur(16px); transform: scale(1.08);
      opacity: 0.55;
    }
    .fp-bg-overlay { position: absolute; inset: 0; background: rgba(10,10,10,0.72); }

    /* ── Main ── */
    .fp-main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 2rem 5rem; }

    /* Billboard — the big "theater" banner, crossfades between promo slides */
    .fp-billboard {
      position: relative;
      width: 100%;
      aspect-ratio: 21 / 9;
      max-height: 420px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 3rem;
      background: #141018;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    }
    .fp-billboard-track { position: absolute; inset: 0; }
    .fp-billboard-slide {
      position: absolute; inset: 0;
      opacity: 0; transition: opacity 1.4s ease;
      text-decoration: none; color: #fff; display: block;
    }
    .fp-billboard-slide.active { opacity: 1; z-index: 1; }
    .fp-billboard-slide-bg { position: absolute; inset: 0; background-repeat: no-repeat; }
    .fp-billboard-slide-scrim {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 2.5rem 2.5rem 1.75rem;
      background: linear-gradient(to top, rgba(0,0,0,0.82), transparent);
    }
    .fp-billboard-slide-cap {
      font-family: 'Cinzel', Georgia, serif; font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 700;
      margin-bottom: 0.3rem; text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    }
    .fp-billboard-slide-credit { font-size: 0.82rem; color: rgba(255,255,255,0.75); }
    .fp-billboard-empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #999; font-size: 0.95rem; text-align: center; padding: 2rem;
    }
    .fp-billboard-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.45);
      color: #fff; font-size: 1.4rem; cursor: pointer; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .fp-billboard-arrow:hover { background: rgba(0,0,0,0.7); }
    .fp-billboard-arrow--prev { left: 1rem; }
    .fp-billboard-arrow--next { right: 1rem; }
    .fp-billboard-dots { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 0.4rem; z-index: 3; }
    .fp-billboard-dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35);
      cursor: pointer; transition: background 0.2s, transform 0.2s; border: none; padding: 0;
    }
    .fp-billboard-dot.active { background: #fff; transform: scale(1.3); }
    @media (max-width: 640px) {
      .fp-billboard { aspect-ratio: 4 / 3; }
      .fp-billboard-slide-scrim { padding: 1.5rem 1.25rem 1.1rem; }
    }

    /* Profile / welcome card */
    .fp-profile-card {
      display: flex; align-items: center; gap: 1.25rem;
      background: linear-gradient(135deg, rgba(127,168,217,0.12), rgba(217,122,114,0.08));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 3rem;
    }
    .fp-profile-card img, .fp-profile-card .fp-avatar-fallback {
      width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
    }
    .fp-profile-card .fp-avatar-fallback {
      font-size: 1.5rem; background: linear-gradient(135deg, #7fa8d9, #d97a72);
      color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700;
    }
    .fp-profile-card-name { font-family: 'Cinzel', Georgia, serif; font-size: 1.3rem; margin-bottom: 0.2rem; }
    .fp-profile-card-sub { font-size: 0.88rem; color: #bbb; }
    .fp-profile-card-actions { margin-left: auto; display: flex; gap: 0.6rem; flex-shrink: 0; }
    .fp-profile-card-btn {
      display: inline-block; text-decoration: none; font-size: 0.82rem; font-weight: 600;
      padding: 0.55rem 1.1rem; border-radius: 20px; white-space: nowrap;
    }
    .fp-profile-card-btn--edit { border: 1px solid rgba(255,255,255,0.2); color: #f0f0f0; }
    .fp-profile-card-btn--edit:hover { border-color: #7fa8d9; color: #7fa8d9; }
    .fp-profile-card-btn--login { background: #7fa8d9; color: #0a0a0a; }

    /* Story rows */
    .fp-row { margin-bottom: 3rem; }
    .fp-row-title { font-family: 'Cinzel', Georgia, serif; font-size: 1.25rem; margin-bottom: 1rem; }
    .fp-row-empty { color: #999; font-size: 0.92rem; }
    .fp-row-scroll { display: flex; gap: 1.1rem; overflow-x: auto; padding-bottom: 0.5rem; }
    .fp-row-scroll::-webkit-scrollbar { height: 6px; }
    .fp-row-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    .fp-card {
      position: relative;
      flex: 0 0 150px;
      text-decoration: none;
      color: inherit;
    }
    .fp-card-cover {
      width: 150px; height: 225px; object-fit: cover; border-radius: 10px; display: block;
      background: #1e1e1e; border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.15s;
    }
    .fp-card:hover .fp-card-cover { transform: translateY(-4px); }
    .fp-card-title { font-size: 0.9rem; font-weight: 700; margin-top: 0.5rem; line-height: 1.3; }
    .fp-card-author { font-size: 0.78rem; color: #999; margin-top: 0.15rem; }
    .fp-card-author-link:hover { color: #7fa8d9; text-decoration: underline; }

    .fp-bookmark-btn {
      position: absolute; top: 8px; right: 8px; z-index: 2;
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 0.95rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .fp-bookmark-btn.saved { color: #d97a72; }
  </style>
</head>
<body>

<div class="fp-bg-wrap">
  <img class="fp-bg-img" src="/images/gallery/kloudsaphbedroom_1.png" alt="" />
  <div class="fp-bg-overlay"></div>
</div>

<div id="fanpages-topbar-root"></div>

<main class="fp-main">

  <section class="fp-billboard" id="fp-billboard">
    <div class="fp-billboard-track" id="fp-billboard-track"></div>
    <div class="fp-billboard-empty" id="fp-billboard-empty">
      <p>✨ Something fun is coming to this spot soon!</p>
    </div>
    <button class="fp-billboard-arrow fp-billboard-arrow--prev" id="fp-billboard-prev" type="button" aria-label="Previous slide" style="display:none;">‹</button>
    <button class="fp-billboard-arrow fp-billboard-arrow--next" id="fp-billboard-next" type="button" aria-label="Next slide" style="display:none;">›</button>
    <div class="fp-billboard-dots" id="fp-billboard-dots"></div>
  </section>

  <div class="fp-profile-card" id="fp-profile-card"><!-- filled by JS --></div>

  <section class="fp-row">
    <p class="fp-row-title">Your Saved Stories</p>
    <div id="fp-saved-row"><p class="fp-row-empty">Log in to save stories to your shelf.</p></div>
  </section>

  <section class="fp-row">
    <p class="fp-row-title">Recommended Stories</p>
    <div id="fp-recommended-row"><p class="fp-row-empty">Loading…</p></div>
  </section>

</main>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  // ── Billboard — slides come from the DB now (managed via Hub Image Builder) ──
  let billboardSlides = [];
  let billboardIndex = 0;
  let billboardTimer = null;

  // Pan + zoom via background-image instead of object-fit + transform:scale.
  // object-position and a post-hoc CSS scale() don't compose — the scale
  // happens AFTER object-fit places the image, so the position sliders can
  // never reach the newly-revealed edges. background-size/background-position
  // are defined to compose correctly (position is resolved against the
  // *current* size), so zooming in genuinely opens up room to pan into.
  const billboardImgDims = {};
  function loadImageDims(url) {
    if (billboardImgDims[url]) return Promise.resolve(billboardImgDims[url]);
    return new Promise(resolve => {
      const probe = new Image();
      probe.onload = () => { const d = { w: probe.naturalWidth || 1, h: probe.naturalHeight || 1 }; billboardImgDims[url] = d; resolve(d); };
      probe.onerror = () => resolve({ w: 1, h: 1 });
      probe.src = url;
    });
  }
  function coverBgSize(dims, boxW, boxH, zoomPercent) {
    const scale = Math.max(boxW / dims.w, boxH / dims.h) || 1;
    const renderedW = dims.w * scale, renderedH = dims.h * scale;
    const factor = (zoomPercent || 100) / 100;
    return { w: (renderedW / (boxW || 1)) * 100 * factor, h: (renderedH / (boxH || 1)) * 100 * factor };
  }

  async function renderBillboard(slides) {
    billboardSlides = slides;
    const track   = document.getElementById('fp-billboard-track');
    const empty   = document.getElementById('fp-billboard-empty');
    const prevBtn = document.getElementById('fp-billboard-prev');
    const nextBtn = document.getElementById('fp-billboard-next');
    const dotsWrap = document.getElementById('fp-billboard-dots');

    if (!slides.length) {
      empty.style.display = 'flex';
      track.innerHTML = '';
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsWrap.innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    await Promise.all(slides.map(s => loadImageDims(s.image_url)));

    track.innerHTML = '';
    slides.forEach((slide, i) => {
      const el = document.createElement(slide.link ? 'a' : 'div');
      el.className = 'fp-billboard-slide' + (i === 0 ? ' active' : '');
      if (slide.link) el.href = slide.link;
      el.innerHTML = `
        <div class="fp-billboard-slide-bg"></div>
        ${(slide.caption || slide.credit) ? `
          <div class="fp-billboard-slide-scrim">
            ${slide.caption ? `<p class="fp-billboard-slide-cap">${slide.caption}</p>` : ''}
            ${slide.credit ? `<p class="fp-billboard-slide-credit">${slide.credit}</p>` : ''}
          </div>` : ''}
      `;
      track.appendChild(el);
    });

    if (slides.length > 1) {
      prevBtn.style.display = 'flex';
      nextBtn.style.display = 'flex';
      dotsWrap.innerHTML = '';
      slides.forEach((_, i) => {
        const dot = document.createElement('button');
        dot.className = 'fp-billboard-dot' + (i === 0 ? ' active' : '');
        dot.type = 'button';
        dot.setAttribute('aria-label', `Go to slide ${i + 1}`);
        dot.addEventListener('click', () => goToSlide(i));
        dotsWrap.appendChild(dot);
      });
    } else {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsWrap.innerHTML = '';
    }

    billboardIndex = 0;
    playSlideAnimation(0);
    restartBillboardTimer();
  }

  // Ken Burns-style pan/zoom — the CSS transition duration is set to exactly
  // the slide's on-screen time, so however far apart the start/end frames
  // are, the motion always finishes right as the next slide crossfades in.
  const BILLBOARD_INTERVAL_MS = 15000;

  function playSlideAnimation(index) {
    const slide = billboardSlides[index];
    if (!slide) return;
    const el = document.querySelectorAll('.fp-billboard-slide')[index];
    if (!el) return;
    const bg = el.querySelector('.fp-billboard-slide-bg');
    const dims = billboardImgDims[slide.image_url];
    if (!dims) return;
    const boxW = el.clientWidth, boxH = el.clientHeight;

    bg.style.transition = 'none';
    bg.style.backgroundImage = `url(${slide.image_url})`;
    const startSize = coverBgSize(dims, boxW, boxH, slide.zoom);
    bg.style.backgroundSize = `${startSize.w}% ${startSize.h}%`;
    bg.style.backgroundPosition = `${slide.position_x}% ${slide.position_y}%`;
    void bg.offsetWidth; // force reflow so the reset above applies before re-enabling transitions

    if (slide.animation_type && slide.animation_type !== 'none') {
      bg.style.transition = `background-position ${BILLBOARD_INTERVAL_MS}ms linear, background-size ${BILLBOARD_INTERVAL_MS}ms linear`;
      requestAnimationFrame(() => {
        if (slide.animation_type === 'pan_v') {
          bg.style.backgroundPosition = `${slide.position_x}% ${slide.end_position_y}%`;
        } else if (slide.animation_type === 'pan_h') {
          bg.style.backgroundPosition = `${slide.end_position_x}% ${slide.position_y}%`;
        } else if (slide.animation_type === 'zoom') {
          const endSize = coverBgSize(dims, boxW, boxH, slide.end_zoom);
          bg.style.backgroundSize = `${endSize.w}% ${endSize.h}%`;
        }
      });
    }
  }

  window.addEventListener('resize', () => { if (billboardSlides.length) playSlideAnimation(billboardIndex); });

  function goToSlide(i) {
    if (!billboardSlides.length) return;
    billboardIndex = (i + billboardSlides.length) % billboardSlides.length;
    document.querySelectorAll('.fp-billboard-slide').forEach((el, idx) => el.classList.toggle('active', idx === billboardIndex));
    document.querySelectorAll('.fp-billboard-dot').forEach((el, idx) => el.classList.toggle('active', idx === billboardIndex));
    playSlideAnimation(billboardIndex);
    restartBillboardTimer();
  }

  function restartBillboardTimer() {
    if (billboardTimer) clearInterval(billboardTimer);
    if (billboardSlides.length > 1) {
      billboardTimer = setInterval(() => goToSlide(billboardIndex + 1), BILLBOARD_INTERVAL_MS);
    }
  }

  document.getElementById('fp-billboard-prev').addEventListener('click', () => goToSlide(billboardIndex - 1));
  document.getElementById('fp-billboard-next').addEventListener('click', () => goToSlide(billboardIndex + 1));

  fetch('/api/hub-billboard')
    .then(r => r.ok ? r.json() : { slides: [] })
    .then(data => renderBillboard(data.slides || []))
    .catch(() => renderBillboard([]));
</script>
<script>
  const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
  const authHeaders = () => (token ? { Authorization: `Bearer ${token}` } : {});

  function storyCard(site, { showBookmark }) {
    const a = document.createElement('a');
    a.className = 'fp-card';
    a.href = `/fanpages/${site.story_path || site.slug}`;
    const cover = site.cover_url || '/images/gallery/kloudsaphbedroom_1.png';
    a.innerHTML = `
      <img class="fp-card-cover" src="${cover}" alt="${site.site_title} cover" loading="lazy" />
      <p class="fp-card-title">${site.site_title}</p>
      <p class="fp-card-author">by <span class="fp-card-author-link">${site.author}</span></p>
    `;
    // Author name links to their profile — nested <a> isn't valid HTML since
    // the whole card is already a link, so this is a click-through instead.
    if (site.author_username) {
      const authorLink = a.querySelector('.fp-card-author-link');
      authorLink.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        window.location.href = `/fanpages/${site.author_username}`;
      });
    }
    if (showBookmark && token) {
      const btn = document.createElement('button');
      btn.className = 'fp-bookmark-btn' + (site.bookmarked ? ' saved' : '');
      btn.type = 'button';
      btn.textContent = site.bookmarked ? '♥' : '♡';
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        const nowSaved = !btn.classList.contains('saved');
        try {
          await fetch(`/api/bookmarks/${site.slug}`, {
            method: nowSaved ? 'POST' : 'DELETE',
            headers: authHeaders(),
          });
          btn.classList.toggle('saved', nowSaved);
          btn.textContent = nowSaved ? '♥' : '♡';
          loadSaved();
        } catch {}
      });
      a.appendChild(btn);
    }
    return a;
  }

  async function loadRecommended() {
    const row = document.getElementById('fp-recommended-row');
    try {
      const res  = await fetch('/api/moderator-sites', { headers: authHeaders() });
      const data = await res.json();
      const sites = data.sites || [];
      if (!sites.length) { row.innerHTML = '<p class="fp-row-empty">No stories yet — check back soon!</p>'; return; }
      const scroller = document.createElement('div');
      scroller.className = 'fp-row-scroll';
      sites.forEach(s => scroller.appendChild(storyCard(s, { showBookmark: true })));
      row.innerHTML = '';
      row.appendChild(scroller);
    } catch { row.innerHTML = '<p class="fp-row-empty">Couldn\'t load stories right now.</p>'; }
  }

  async function loadSaved() {
    const row = document.getElementById('fp-saved-row');
    if (!token) { row.innerHTML = '<p class="fp-row-empty">Log in to save stories to your shelf.</p>'; return; }
    try {
      const res  = await fetch('/api/bookmarks', { headers: authHeaders() });
      const data = await res.json();
      const saved = data.bookmarks || [];
      if (!saved.length) { row.innerHTML = '<p class="fp-row-empty">You haven\'t saved any stories yet — tap the ♡ on a story below to add one!</p>'; return; }
      const scroller = document.createElement('div');
      scroller.className = 'fp-row-scroll';
      saved.forEach(s => scroller.appendChild(storyCard({ ...s, bookmarked: true }, { showBookmark: true })));
      row.innerHTML = '';
      row.appendChild(scroller);
    } catch { row.innerHTML = '<p class="fp-row-empty">Couldn\'t load your saved stories right now.</p>'; }
  }

  function renderProfileCard(user) {
    const card = document.getElementById('fp-profile-card');
    const initial = (user.display_name || user.username || '?').charAt(0).toUpperCase();
    const avatarHtml = user.avatar
      ? `<img src="${user.avatar}" alt="" />`
      : `<div class="fp-avatar-fallback">${initial}</div>`;
    card.innerHTML = `
      ${avatarHtml}
      <div>
        <p class="fp-profile-card-name">${user.display_name || user.username}</p>
        <p class="fp-profile-card-sub">Welcome back! Here's what's new on your shelf.</p>
      </div>
      <div class="fp-profile-card-actions">
        <a class="fp-profile-card-btn fp-profile-card-btn--edit" href="/fanpages/${user.username}">My Profile</a>
      </div>
    `;
  }

  function renderLoggedOutCard() {
    const card = document.getElementById('fp-profile-card');
    card.innerHTML = `
      <div class="fp-avatar-fallback">?</div>
      <div>
        <p class="fp-profile-card-name">Welcome to Fanpages!</p>
        <p class="fp-profile-card-sub">Log in to save stories to your shelf and get personalized recommendations.</p>
      </div>
      <div class="fp-profile-card-actions">
        <a class="fp-profile-card-btn fp-profile-card-btn--login" href="/login?from=${encodeURIComponent('/fanpages')}">Log In / Register</a>
      </div>
    `;
  }

  (async () => {
    loadRecommended();

    if (token) {
      try {
        const res  = await fetch('/api/auth/me', { headers: authHeaders() });
        if (res.ok) {
          const data = await res.json();
          renderProfileCard(data.user);
          loadSaved();
        } else {
          renderLoggedOutCard();
        }
      } catch { renderLoggedOutCard(); }
    } else {
      renderLoggedOutCard();
    }
  })();
</script>

</body>
</html>
