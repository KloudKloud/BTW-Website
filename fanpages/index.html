<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home ✦ Between Two Worlds</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #f0f0f0;
      font-family: 'Lato', Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }

    /* ── Hero row — five boxes across the top, exact fractions of the full
       page width: Gallery+Stories together = 1/4, the banner = 1/2 (double
       the left pair, edge-to-edge from Stories' inner border to Characters'
       inner border), Characters+Clubs together = 1/4. A fixed, generous row
       height (not just "however tall the content needs") so this reads as
       a real hero strip. Replaces the old Donations/Feedback side-panel
       layout entirely. ── */
    .fp-hero-row {
      /* overflow:hidden here (not on the individual .fp-comic-box elements,
         which intentionally stay visible so their glow/spark isn't clipped)
         -- without it, the traveling spark (.fp-comic-box::before) bleeds a
         few px past Gallery's outer-left edge, Clubs' outer-right edge, and
         every box's bottom edge as it rides along the border. Those are the
         row's own outer edges too, and now that the homepage has nothing
         below the hero row, that handful of px was enough to toggle real
         page scrollbars on/off as the sparks moved -- visible as the page
         "jerking". Clipping at the row's own bounds stops that while still
         leaving the spark free to bleed across box-to-box seams and the
         top edge, which don't affect the page's actual scrollable area. */
      position: relative; width: 100%; height: clamp(305px, 25vw, 425px);
      display: flex; align-items: stretch; border-bottom: 1px solid rgba(255,255,255,0.08);
      overflow: hidden;
    }

    /* Comic-strip link boxes — flat black, bold border, halftone dot
       texture, a center-right label, and a little traveling spark that
       circles the perimeter (instead of a static glow) to give each panel
       a subtle animated life. --comic-neon is each panel's full-brightness
       neon color, used for the border and the spark itself. Fixed 7.5%
       basis each (no grow/shrink) so Gallery+Stories and Characters+Clubs
       land on exactly 15% of the row apiece, leaving 70% for the banner. */
    .fp-comic-box {
      /* overflow stays visible -- overflow:hidden would clip the spark
         (::before, below) wherever it travels past the box's own edge,
         and clip this element's own box-shadow too. Nothing inside
         actually needs clipping: the bg/scrim children are inset:0
         (exactly bounded already) and the halftone background-image just
         tiles. */
      position: relative; flex: 0 0 7.5%; min-width: 0; height: 100%;
      display: block; text-decoration: none; cursor: pointer;
      background: #0a0a0a;
      background-image:
        radial-gradient(rgba(255,255,255,0.09) 1.1px, transparent 1.1px);
      background-size: 13px 13px;
      border: 2px solid var(--comic-neon, rgba(255,255,255,0.85));
      transition: transform 0.18s, background-color 0.22s;
    }
    .fp-comic-box::after {
      content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity 0.22s;
      background: radial-gradient(ellipse at center, var(--comic-glow, rgba(255,255,255,0.35)) 0%, transparent 72%);
    }
    /* The traveling spark -- a small glowing dot riding offset-path: inset
       around the box's own border rectangle, looping forever. Combines two
       independent animations: fp-spark-travel moves it around the
       perimeter at a steady pace, fp-spark-flicker is a much faster
       opacity/scale wobble layered on top for the "flickering fire" feel
       rather than a smoothly gliding dot. Each panel's animation-delay is
       offset so the four sparks aren't moving in lockstep. */
    .fp-comic-box::before {
      content: ''; position: absolute; top: 0; left: 0; z-index: 3;
      width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, var(--comic-neon, #fff) 55%, transparent 100%);
      box-shadow: 0 0 8px 2px var(--comic-neon, #fff), 0 0 18px 6px var(--comic-neon-dim, rgba(255,255,255,0.5));
      offset-path: inset(0 round 2px);
      offset-distance: 0%;
      pointer-events: none;
      animation: fp-spark-travel 7s linear infinite, fp-spark-flicker 0.45s ease-in-out infinite;
    }
    .fp-comic-box--stories::before { animation-delay: -1.75s, 0s; }
    .fp-comic-box--characters::before { animation-delay: -3.5s, 0s; }
    .fp-comic-box--clubs::before { animation-delay: -5.25s, 0s; }
    @keyframes fp-spark-travel { to { offset-distance: 100%; } }
    @keyframes fp-spark-flicker {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.8); }
    }
    /* Admin-picked image for this slot (see Admin > Bulletin > Hero Row
       Images) — only present once a crop has actually been saved for that
       box; otherwise the box just keeps its flat black/halftone look.
       Sized/positioned in JS via the same coverBgSize()/background-position
       math the billboard slides use. A dark scrim keeps the vertical label
       readable over busier art. */
    .fp-comic-box-bg { position: absolute; inset: 0; z-index: 0; background-repeat: no-repeat; }
    .fp-comic-box-scrim { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0,0,0,0.3), rgba(0,0,0,0.6)); }
    .fp-comic-box:hover { transform: translateY(-2px); background-color: #120f16; }
    .fp-comic-box:hover::after { opacity: 1; }
    .fp-comic-box:hover::before {
      width: 15px; height: 15px; margin: -7.5px 0 0 -7.5px;
      box-shadow: 0 0 12px 3px var(--comic-neon, #fff), 0 0 26px 9px var(--comic-neon-dim, rgba(255,255,255,0.6));
    }
    /* True neon tones -- Gallery purple, Stories red, Characters green,
       Clubs blue, each with a dimmer translucent twin for the outermost
       shadow layer and the inset glow (a 100%-alpha color that far out
       would just read as a flat color fill, not a soft halo). */
    .fp-comic-box--gallery { --comic-glow: rgba(200,70,255,0.55); --comic-neon: #c846ff; --comic-neon-dim: rgba(200,70,255,0.55); }
    .fp-comic-box--stories { --comic-glow: rgba(255,45,85,0.55); --comic-neon: #ff2d55; --comic-neon-dim: rgba(255,45,85,0.55); }
    .fp-comic-box--characters { --comic-glow: rgba(57,255,20,0.55); --comic-neon: #39ff14; --comic-neon-dim: rgba(57,255,20,0.55); }
    .fp-comic-box--clubs { --comic-glow: rgba(0,195,255,0.55); --comic-neon: #00c3ff; --comic-neon-dim: rgba(0,195,255,0.55); }

    /* The solid border (not the glow) literally doubles in apparent
       thickness wherever two comic boxes sit flush against each other --
       Gallery's right edge + Stories' left edge paint as one 4px seam, same
       for Characters' right + Clubs' left. The four "lone" edges (Gallery's
       outer-left, Stories' right against the banner, Characters' left
       against the banner, Clubs' outer-right) only ever get one box's 2px,
       so they read thinner. Thickening just that one side on each closes
       the gap without touching the box-sizing (border-box, so this doesn't
       shift any widths). The two sides that border the banner specifically
       (Stories' right, Characters' left) need even more than that: the
       banner-mid element paints right after Stories in DOM order, so it
       covers most of Stories' glow bleeding rightward onto it -- there's
       nothing on the other side to "swallow" a thin border the way there
       is at the Gallery/Stories or Characters/Clubs seams, so those two
       sides go to 6px instead of 4px to stay visible on their own, without
       depending on bleed that gets covered. */
    .fp-comic-box--gallery { border-left-width: 4px; }
    .fp-comic-box--stories { border-right-width: 6px; }
    .fp-comic-box--characters { border-left-width: 6px; }
    .fp-comic-box--clubs { border-right-width: 4px; }

    /* Seam colors at the two places where a comic box's border touches
       another comic box's border -- rather than two distinct hard-edged
       colors sitting side by side (purple next to red, green next to
       blue), the shared edge uses a blended color so it reads as one
       combined line instead of a visible seam. */
    .fp-comic-box--gallery { border-right-color: #e03aa6; }
    .fp-comic-box--stories { border-left-color: #e03aa6; }
    .fp-comic-box--characters { border-right-color: #1de18a; }
    .fp-comic-box--clubs { border-left-color: #1de18a; }

    /* Label runs vertically bottom-to-top (comic-book spine style) same as
       before, but now much bigger and stretched a bit taller per
       reference sketch -- the scaleY applies in the already-rotated
       coordinate space (transform functions apply in the order written,
       each operating in the space left by the previous one), so it
       elongates the glyphs along the visual vertical reading direction
       instead of warping them sideways. Kept the outline relatively light
       (thin text-stroke, modest shadow offsets) so it doesn't read "thick"
       at this larger size -- the size increase alone gives it presence. */
    .fp-comic-label {
      position: absolute; top: 50%; right: 0.15rem; z-index: 2;
      max-height: calc(100% - 1rem); overflow: hidden;
      writing-mode: vertical-rl; transform: translateY(-50%) rotate(180deg) scaleY(1.15);
      font-family: 'Bangers', 'Fredoka', cursive; font-weight: 400; text-transform: uppercase;
      font-size: clamp(1.3rem, 2.4vw, 2.1rem); letter-spacing: 0.38em;
      color: #fff; -webkit-text-stroke: 0.5px #000;
      text-shadow: 1.5px 0 0 #000, -1.5px 0 0 #000, 0 1.5px 0 #000, 0 -1.5px 0 #000, 0 0 5px var(--comic-glow, rgba(255,255,255,0.35));
      transition: text-shadow 0.22s;
      pointer-events: none;
    }

    /* Middle banner — the billboard slideshow itself IS the banner, filling
       this slot's entire width and height edge-to-edge (Stories' right
       border to Characters' left border). No video, no extra background
       layer behind it -- fixed 70% basis, matching the 7.5%+7.5%
       comic-box pair (15% each) on either side. */
    .fp-hero-banner-mid { position: relative; flex: 0 0 70%; min-width: 0; height: 100%; overflow: hidden; }

    /* Phone widths: stack the banner full-width on top, with the four
       comic boxes as an equal-width row underneath it instead of five
       cramped slivers squeezed into one row. */
    @media (max-width: 720px) {
      .fp-hero-row { height: auto; flex-wrap: wrap; }
      .fp-hero-banner-mid { flex: 1 1 100%; order: 1; height: 220px; }
      .fp-comic-box { flex: 1 1 25%; order: 2; height: 130px; }
      .fp-comic-label { font-size: 1.05rem; letter-spacing: 0.15em; right: 0.1rem; }
    }

    /* Billboard — the big "theater" banner, crossfades between promo slides.
       Everywhere it appears outside the hero it keeps its old boxed-card
       look (aspect-ratio, rounded corners, shadow); inside the hero slot
       (.fp-hero-banner-mid) it's overridden further down to fill that slot
       edge-to-edge instead, since the billboard IS the hero banner now. */
    .fp-billboard {
      position: relative;
      width: 100%;
      aspect-ratio: 20 / 9;
      max-height: 460px;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 3rem;
      background: #141018;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 24px 70px rgba(0,0,0,0.55);
    }
    .fp-hero-banner-mid .fp-billboard {
      width: 100%; height: 100%; aspect-ratio: auto; max-height: none;
      border-radius: 0; margin-bottom: 0; border: none; box-shadow: none;
    }
    .fp-billboard-track { position: absolute; inset: 0; }
    .fp-billboard-slide {
      position: absolute; inset: 0;
      opacity: 0; transition: opacity 1.4s ease;
      text-decoration: none; color: #fff; display: block;
    }
    .fp-billboard-slide.active { opacity: 1; z-index: 1; }
    .fp-billboard-slide-bg { position: absolute; inset: 0; background-repeat: no-repeat; }
    .fp-billboard-slide-scrim {
      position: absolute; left: 0; right: 0; bottom: 0; padding: 2.5rem 2.5rem 1.75rem;
      background: linear-gradient(to top, rgba(0,0,0,0.82), transparent);
    }
    .fp-billboard-slide-cap {
      font-family: 'Fredoka', 'Lato', cursive; font-size: clamp(1.3rem, 3vw, 2rem); font-weight: 700;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.6), 0 0 20px rgba(240,192,96,0.55);
    }
    .fp-billboard-slide-credit { font-family: 'Fredoka', 'Lato', cursive; font-size: 0.82rem; color: rgba(255,255,255,0.75); }
    .fp-billboard-empty {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #999; font-size: 0.95rem; text-align: center; padding: 2rem;
    }
    .fp-billboard-arrow {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(0,0,0,0.45);
      color: #fff; font-size: 1.4rem; cursor: pointer; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .fp-billboard-arrow:hover { background: rgba(0,0,0,0.7); }
    .fp-billboard-arrow--prev { left: 1rem; }
    .fp-billboard-arrow--next { right: 1rem; }
    /* "Infinite scroll" dot strip — the active dot always sits centered; a
       fixed-size window of dots is rendered around it (their slide index
       wrapped via modulo, so a handful of real slides can still fill a wide
       window), and the whole strip translates by one dot-step on every
       prev/next so dots visibly scroll past instead of just swapping which
       one is lit up. Width is set in JS once dot size is known. */
    .fp-billboard-dots { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); overflow: hidden; z-index: 3; }
    .fp-billboard-dots-track { display: flex; gap: 0.4rem; }
    .fp-billboard-dot {
      width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.35);
      transition: background 0.2s, transform 0.2s; flex-shrink: 0;
    }
    .fp-billboard-dot.active { background: #fff; transform: scale(1.3); }
    @media (max-width: 640px) {
      .fp-billboard { aspect-ratio: 4 / 3; }
      .fp-hero-banner-mid .fp-billboard { aspect-ratio: auto; }
      .fp-billboard-slide-scrim { padding: 1.5rem 1.25rem 1.1rem; }
    }

  </style>
</head>
<body>

<div id="fanpages-topbar-root"></div>

<!-- ══ Hero row — five boxes: Gallery/Stories comic strips (left quarter),
     the billboard slideshow itself as the banner (middle half, edge-to-edge,
     no video/background behind it), Characters/Clubs comic strips (right
     quarter). Each comic box is a plain link to its destination page. ══ -->
<section class="fp-hero-row">
  <a class="fp-comic-box fp-comic-box--gallery" href="/fanpages/search?view=submissions&browse=1" data-hero-slot="gallery">
    <span class="fp-comic-label">Gallery</span>
  </a>
  <a class="fp-comic-box fp-comic-box--stories" href="/fanpages/search?sort=updated&browse=1" data-hero-slot="stories">
    <span class="fp-comic-label">Stories</span>
  </a>

  <div class="fp-hero-banner-mid">
    <section class="fp-billboard" id="fp-billboard">
      <div class="fp-billboard-track" id="fp-billboard-track"></div>
      <div class="fp-billboard-empty" id="fp-billboard-empty" style="display:none;">
        <p>✨ Something fun is coming to this spot soon!</p>
      </div>
      <button class="fp-billboard-arrow fp-billboard-arrow--prev" id="fp-billboard-prev" type="button" aria-label="Previous slide" style="display:none;">‹</button>
      <button class="fp-billboard-arrow fp-billboard-arrow--next" id="fp-billboard-next" type="button" aria-label="Next slide" style="display:none;">›</button>
      <div class="fp-billboard-dots" id="fp-billboard-dots"><div class="fp-billboard-dots-track" id="fp-billboard-dots-track"></div></div>
    </section>
  </div>

  <a class="fp-comic-box fp-comic-box--characters" href="/fanpages/characters" data-hero-slot="characters">
    <span class="fp-comic-label">Characters</span>
  </a>
  <a class="fp-comic-box fp-comic-box--clubs" href="/fanpages/social" data-hero-slot="clubs">
    <span class="fp-comic-label">Clubs</span>
  </a>
</section>

<script src="/fanpages/fanpages-nav.js"></script>
<script>
  window.fpFixLinks();

  // ── Billboard — slides come from the DB now (managed via Hub Image Builder) ──
  let billboardSlides = [];
  let billboardIndex = 0;
  let billboardTimer = null;

  function shuffleInPlace(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // VIP slides (donation ads / important announcements, marked in Admin ->
  // Bulletin) get force-inserted into every 4th slot of the sequence, on
  // top of already being eligible for the normal shuffle everywhere else --
  // each slot gets its own independent random pick among the VIP pool, so
  // one particular VIP slide isn't guaranteed to always land on slot 40.
  function insertVipEveryFourth(ordered, allSlides) {
    const vips = allSlides.filter(s => s.is_vip);
    if (!vips.length) return ordered;
    for (let i = 3; i < ordered.length; i += 4) {
      ordered[i] = vips[Math.floor(Math.random() * vips.length)];
    }
    return ordered;
  }

  // The mandatory "intro" slide (slide 0 -- sort_order is never reassigned
  // once set, so this is always "Drawing is my passion~") only leads the
  // rotation on a visitor's very first-ever page load in this browser
  // (tracked via localStorage) -- every load/navigation after that is a
  // fully fresh shuffle including that slide, instead of resetting back to
  // it every single time someone returns to the hub.
  const BILLBOARD_INTRO_SEEN_KEY = 'btw_billboard_intro_seen';
  function buildBillboardOrder(slides) {
    if (slides.length < 3) return slides;
    const firstEverVisit = !localStorage.getItem(BILLBOARD_INTRO_SEEN_KEY);
    if (firstEverVisit) { try { localStorage.setItem(BILLBOARD_INTRO_SEEN_KEY, '1'); } catch {} }

    let ordered;
    if (firstEverVisit) {
      const [first, ...rest] = slides;
      ordered = [first, ...shuffleInPlace(rest)];
    } else {
      ordered = shuffleInPlace(slides.slice());
    }
    return insertVipEveryFourth(ordered, slides);
  }

  // Pan + zoom via background-image instead of object-fit + transform:scale.
  // object-position and a post-hoc CSS scale() don't compose — the scale
  // happens AFTER object-fit places the image, so the position sliders can
  // never reach the newly-revealed edges. background-size/background-position
  // are defined to compose correctly (position is resolved against the
  // *current* size), so zooming in genuinely opens up room to pan into.
  const billboardImgDims = {};
  function loadImageDims(url) {
    if (billboardImgDims[url]) return Promise.resolve(billboardImgDims[url]);
    return new Promise(resolve => {
      const probe = new Image();
      probe.onload = () => { const d = { w: probe.naturalWidth || 1, h: probe.naturalHeight || 1 }; billboardImgDims[url] = d; resolve(d); };
      probe.onerror = () => resolve({ w: 1, h: 1 });
      probe.src = url;
    });
  }
  function coverBgSize(dims, boxW, boxH, zoomPercent) {
    const scale = Math.max(boxW / dims.w, boxH / dims.h) || 1;
    const renderedW = dims.w * scale, renderedH = dims.h * scale;
    const factor = (zoomPercent || 100) / 100;
    return { w: (renderedW / (boxW || 1)) * 100 * factor, h: (renderedH / (boxH || 1)) * 100 * factor };
  }

  // ── Hero row comic-box images — admin-picked, per-slot (Gallery/Stories/
  // Characters/Clubs) background art set via Admin > Bulletin > Hero Row
  // Images, with the same drag/zoom crop as the billboard. A slot with no
  // image_url just keeps its default flat black/halftone look -- this only
  // inserts the bg+scrim layers for slots that actually have one.
  async function loadHeroComicBoxes() {
    let boxes;
    try {
      const res = await fetch('/api/hero-comic-boxes');
      boxes = (await res.json()).boxes || [];
    } catch { return; }

    const withImage = boxes.filter(b => b.image_url);
    if (!withImage.length) return;
    await Promise.all(withImage.map(b => loadImageDims(b.image_url)));

    withImage.forEach(b => {
      const el = document.querySelector(`.fp-comic-box[data-hero-slot="${b.slot}"]`);
      if (!el) return;
      const dims = billboardImgDims[b.image_url];
      const boxW = el.clientWidth || 1, boxH = el.clientHeight || 1;
      const size = coverBgSize(dims, boxW, boxH, b.zoom);

      const bg = document.createElement('div');
      bg.className = 'fp-comic-box-bg';
      bg.style.backgroundImage = `url('${b.image_url}')`;
      bg.style.backgroundSize = `${size.w}% ${size.h}%`;
      bg.style.backgroundPosition = `${b.position_x}% ${b.position_y}%`;

      const scrim = document.createElement('div');
      scrim.className = 'fp-comic-box-scrim';

      el.prepend(scrim);
      el.prepend(bg);
    });
  }

  async function renderBillboard(slides) {
    billboardSlides = slides;
    const track   = document.getElementById('fp-billboard-track');
    const empty   = document.getElementById('fp-billboard-empty');
    const prevBtn = document.getElementById('fp-billboard-prev');
    const nextBtn = document.getElementById('fp-billboard-next');
    const dotsWrap = document.getElementById('fp-billboard-dots');

    if (!slides.length) {
      empty.style.display = 'flex';
      track.innerHTML = '';
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsWrap.style.width = '';
      document.getElementById('fp-billboard-dots-track').innerHTML = '';
      return;
    }
    empty.style.display = 'none';

    await Promise.all(slides.map(s => loadImageDims(s.image_url)));

    track.innerHTML = '';
    slides.forEach((slide, i) => {
      const linkOk = slide.link && isSafeLinkUrl(slide.link);
      const el = document.createElement(linkOk ? 'a' : 'div');
      el.className = 'fp-billboard-slide' + (i === 0 ? ' active' : '');
      if (linkOk) el.href = slide.link;
      el.innerHTML = `
        <div class="fp-billboard-slide-bg"></div>
        ${(slide.caption || slide.credit) ? `
          <div class="fp-billboard-slide-scrim">
            ${slide.caption ? `<p class="fp-billboard-slide-cap">${escapeHtml(slide.caption)}</p>` : ''}
            ${slide.credit ? `<p class="fp-billboard-slide-credit">${escapeHtml(slide.credit)}</p>` : ''}
          </div>` : ''}
      `;
      track.appendChild(el);
    });

    if (slides.length > 1) {
      prevBtn.style.display = 'flex';
      nextBtn.style.display = 'flex';
      initBillboardDots();
    } else {
      prevBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      dotsWrap.style.width = '';
      document.getElementById('fp-billboard-dots-track').innerHTML = '';
    }

    billboardIndex = 0;
    playSlideAnimation(0);
    restartBillboardTimer();
  }

  // ── "Infinite scroll" dot strip ──────────────────────────────────────────
  // The lit-up dot always stays dead center. A fixed window of dots is
  // rendered around a virtual step counter (dotStep) that just keeps
  // counting up/down as you navigate — never wraps — while each dot's
  // *slide* index is dotStep wrapped via modulo, so a handful of real
  // slides can still fill (and endlessly repeat across) a wider strip.
  const DOT_RADIUS = 3; // 7 dots visible at rest
  let dotStep = 0;

  function billboardDotEl(v) {
    const real = ((v % billboardSlides.length) + billboardSlides.length) % billboardSlides.length;
    const dot = document.createElement('span');
    dot.className = 'fp-billboard-dot' + (v === dotStep ? ' active' : '');
    dot.dataset.v = v;
    dot.dataset.real = real;
    return dot;
  }

  function initBillboardDots() {
    dotStep = 0;
    const wrap  = document.getElementById('fp-billboard-dots');
    const track = document.getElementById('fp-billboard-dots-track');
    track.style.transition = 'none';
    track.style.transform = 'translateX(0px)';
    track.innerHTML = '';
    for (let v = -DOT_RADIUS; v <= DOT_RADIUS; v++) track.appendChild(billboardDotEl(v));
    // Lock the viewport to exactly this resting width so overflow:hidden
    // clips the extra dot added on each shift instead of just squeezing in.
    wrap.style.width = track.scrollWidth + 'px';
  }

  function shiftBillboardDots(direction) {
    const wrap  = document.getElementById('fp-billboard-dots');
    if (!wrap.style.width) return; // only 0-1 slides, no dot strip to animate
    const track = document.getElementById('fp-billboard-dots-track');
    const stepPx = track.children[1].offsetLeft - track.children[0].offsetLeft;

    const newV = dotStep + direction * (DOT_RADIUS + 1);
    const newDot = billboardDotEl(newV);
    if (direction === 1) track.appendChild(newDot);
    else track.insertBefore(newDot, track.firstChild);

    dotStep += direction;
    Array.from(track.children).forEach(d => d.classList.toggle('active', Number(d.dataset.v) === dotStep));

    track.style.transition = 'none';
    track.style.transform = direction === 1 ? 'translateX(0px)' : `translateX(${-stepPx}px)`;
    void track.offsetWidth; // force reflow so the jump above applies before animating
    track.style.transition = 'transform 0.35s ease';
    track.style.transform = direction === 1 ? `translateX(${-stepPx}px)` : 'translateX(0px)';

    track.addEventListener('transitionend', function handler() {
      track.removeEventListener('transitionend', handler);
      if (direction === 1) track.removeChild(track.firstChild);
      else track.removeChild(track.lastChild);
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
    }, { once: true });
  }

  // Ken Burns-style pan/zoom — the CSS transition duration is set to exactly
  // the slide's on-screen time, so however far apart the start/end frames
  // are, the motion always finishes right as the next slide crossfades in.
  const BILLBOARD_INTERVAL_MS = 15000;

  function playSlideAnimation(index) {
    const slide = billboardSlides[index];
    if (!slide) return;
    const el = document.querySelectorAll('.fp-billboard-slide')[index];
    if (!el) return;
    const bg = el.querySelector('.fp-billboard-slide-bg');
    const dims = billboardImgDims[slide.image_url];
    if (!dims) return;
    const boxW = el.clientWidth, boxH = el.clientHeight;

    bg.style.transition = 'none';
    bg.style.backgroundImage = `url(${slide.image_url})`;
    const startSize = coverBgSize(dims, boxW, boxH, slide.zoom);
    bg.style.backgroundSize = `${startSize.w}% ${startSize.h}%`;
    bg.style.backgroundPosition = `${slide.position_x}% ${slide.position_y}%`;
    void bg.offsetWidth; // force reflow so the reset above applies before re-enabling transitions

    if (slide.animation_type && slide.animation_type !== 'none') {
      bg.style.transition = `background-position ${BILLBOARD_INTERVAL_MS}ms linear, background-size ${BILLBOARD_INTERVAL_MS}ms linear`;
      requestAnimationFrame(() => {
        if (slide.animation_type === 'pan_v') {
          bg.style.backgroundPosition = `${slide.position_x}% ${slide.end_position_y}%`;
        } else if (slide.animation_type === 'pan_h') {
          bg.style.backgroundPosition = `${slide.end_position_x}% ${slide.position_y}%`;
        } else if (slide.animation_type === 'zoom') {
          const endSize = coverBgSize(dims, boxW, boxH, slide.end_zoom);
          bg.style.backgroundSize = `${endSize.w}% ${endSize.h}%`;
          bg.style.backgroundPosition = `${slide.end_position_x}% ${slide.end_position_y}%`;
        }
      });
    }
  }

  window.addEventListener('resize', () => { if (billboardSlides.length) playSlideAnimation(billboardIndex); });

  function goToSlide(i, direction) {
    if (!billboardSlides.length) return;
    // direction defaults to whichever way i actually moved from the current
    // index (handles the auto-advance timer, which always calls
    // goToSlide(billboardIndex + 1) without passing one explicitly).
    if (direction === undefined) direction = i >= billboardIndex ? 1 : -1;
    billboardIndex = (i + billboardSlides.length) % billboardSlides.length;
    document.querySelectorAll('.fp-billboard-slide').forEach((el, idx) => el.classList.toggle('active', idx === billboardIndex));
    if (billboardSlides.length > 1) shiftBillboardDots(direction);
    playSlideAnimation(billboardIndex);
    restartBillboardTimer();
  }

  function restartBillboardTimer() {
    if (billboardTimer) clearInterval(billboardTimer);
    if (billboardSlides.length > 1) {
      billboardTimer = setInterval(() => goToSlide(billboardIndex + 1, 1), BILLBOARD_INTERVAL_MS);
    }
  }

  document.getElementById('fp-billboard-prev').addEventListener('click', () => goToSlide(billboardIndex - 1, -1));
  document.getElementById('fp-billboard-next').addEventListener('click', () => goToSlide(billboardIndex + 1, 1));

  // Sends the auth token (if any) so the server can decide whether NSFW
  // slides belong in the mix — reads localStorage directly since this is
  // the only thing on the page that still needs a token.
  {
    const billboardToken = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
    fetch('/api/hub-billboard', { headers: billboardToken ? { Authorization: `Bearer ${billboardToken}` } : {} })
      .then(r => r.ok ? r.json() : { slides: [] })
      .then(data => renderBillboard(buildBillboardOrder(data.slides || [])))
      .catch(() => renderBillboard([]));
  }
</script>
<script>
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // Defensive client-side mirror of the server's protocol allowlist — rejects
  // javascript:/data:/vbscript: URIs before they're ever assigned to an href.
  function isSafeLinkUrl(url) {
    try { return ['http:', 'https:'].includes(new URL(String(url), location.origin).protocol); }
    catch { return false; }
  }

  loadHeroComicBoxes();
</script>
