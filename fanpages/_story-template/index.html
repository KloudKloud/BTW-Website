<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Story ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css?v=20260804a" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    /* Story viewer -- rebuilt from a blank template. Page background is the
       same flat navy News Posts uses. Fredoka headings + box-background art
       panels, per the site's current visual language. */
    html, body { background: #0e141b; min-height: 100vh; margin: 0; }
    [hidden] { display: none !important; }
    .sv-wrap { max-width: 1560px; margin: 0 auto; padding: 1.75rem 1.5rem 5rem; position: relative; z-index: 1; }

    /* ── Box tabs (Summary / Chapters) -- same bar as the profile tabs. ── */
    .sv-tabs {
      display: inline-flex; align-items: stretch; margin-bottom: 1.25rem;
      border-radius: 14px; border: 2px solid rgba(127,168,217,0.5); overflow: hidden;
      background: linear-gradient(160deg, rgba(10,8,14,0.94), rgba(10,8,14,0.88));
      box-shadow: 0 0 20px rgba(127,168,217,0.4), 0 10px 28px rgba(0,0,0,0.5);
    }
    .sv-tab {
      background: none; border: none; border-right: 2px solid rgba(127,168,217,0.3); cursor: pointer; color: #bbb;
      font-family: 'Fredoka', 'Lato', cursive; font-size: 0.92rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.03em; padding: 0.9rem 1.5rem; transition: color 0.15s, background 0.15s;
    }
    .sv-tab:last-child { border-right: none; }
    .sv-tab:hover { color: #fff; background: rgba(127,168,217,0.12); }
    .sv-tab.active { color: #9fc0e6; background: rgba(127,168,217,0.2); text-shadow: 0 0 12px rgba(127,168,217,0.8); }

    /* Shared panel look: starry art under a dark scrim. */
    .sv-panel {
      position: relative; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
      background: linear-gradient(160deg, rgba(10,8,18,0.82), rgba(10,8,18,0.72)), url('/images/home/box-background-3.png');
      background-size: cover; background-position: center; box-shadow: 0 10px 34px rgba(0,0,0,0.4);
    }
    .sv-h2 {
      display: flex; align-items: center; gap: 0.5rem; margin: 0 0 0.9rem;
      font-family: 'Fredoka', 'Lato', cursive; font-size: 1.35rem; font-weight: 600; color: #cfe0f5;
      text-shadow: 0 0 16px rgba(127,168,217,0.5), 0 1px 3px rgba(0,0,0,0.5);
    }
    .sv-h2 img { width: 18px; height: 18px; object-fit: contain; }

    /* ── Hero: cover + title + stats ── */
    .sv-main { overflow: hidden; }
    .sv-hero { display: flex; gap: 2.5rem; padding: 2.5rem 2.75rem; align-items: stretch; }
    .sv-sec { padding: 1.7rem 2.75rem 1.9rem; border-top: 1px solid rgba(255,255,255,0.09); }
    .sv-cover-col { flex-shrink: 0; width: 270px; }
    .sv-cover {
      display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 12px; background: #1a1a22;
      border: 1px solid rgba(255,255,255,0.18); box-shadow: 0 14px 40px rgba(0,0,0,0.6), 0 0 28px rgba(127,168,217,0.2);
    }
    .sv-hero-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .sv-title {
      margin: 0 0 0.7rem; font-family: 'Fredoka', 'Lato', cursive; font-size: 2.5rem; line-height: 1.12; font-weight: 700; color: #fff;
      text-shadow: 0 0 22px rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.5); overflow-wrap: anywhere;
    }
    .sv-author { display: inline-flex; align-items: center; gap: 0.6rem; text-decoration: none; color: #ddd; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.05rem; font-weight: 500; align-self: flex-start; }
    .sv-author:hover { color: #fff; }
    .sv-author-av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #2a2a36; border: 1px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #aaa; }
    /* Stats -- no boxes: a 3x2 grid of big glowing numbers split by hairlines, spread across the hero. */
    .sv-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 1.9rem; }
    .sv-stat { display: flex; flex-direction: column; padding: 1.3rem 1.8rem; border-left: 1px solid rgba(255,255,255,0.14); border-top: 1px solid rgba(255,255,255,0.14); }
    .sv-stat:nth-child(3n+1) { padding-left: 0; border-left: none; }
    .sv-stat:nth-child(-n+3) { border-top: none; padding-top: 0.2rem; }
    .sv-stat-top { display: flex; align-items: center; gap: 0.65rem; color: #fff; }
    .sv-stat-top svg { width: 28px; height: 28px; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
    .sv-stat-num { font-family: 'Fredoka', 'Lato', cursive; font-size: 2.6rem; font-weight: 700; line-height: 1; color: #fff; text-shadow: 0 0 18px rgba(255,255,255,0.5); }
    .sv-stat-label { margin-top: 0.45rem; font-family: 'Inter', sans-serif; font-size: 0.78rem; color: #8f98a6; text-transform: uppercase; letter-spacing: 0.1em; }
    /* Reading-progress bar above the Start/Continue button. */
    .sv-cta { margin-top: auto; padding-top: 1.75rem; }
    .sv-progress { margin-bottom: 1.1rem; }
    .sv-progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.45rem; font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 0.95rem; color: #cfe0f5; }
    .sv-progress-top b { color: #f0c060; font-size: 1.15rem; text-shadow: 0 0 12px rgba(240,192,96,0.5); }
    .sv-progress-track { height: 12px; border-radius: 999px; background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.12); overflow: hidden; }
    .sv-progress-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #3d6fa8, #7fa8d9, #f0c060); box-shadow: 0 0 14px rgba(127,168,217,0.6); transition: width 0.8s ease; }
    .sv-actions { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
    .sv-start {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem; text-decoration: none; cursor: pointer; border: none;
      min-width: 260px; padding: 0.95rem 2.4rem; border-radius: 999px;
      font-family: 'Fredoka', 'Lato', cursive; font-size: 1.3rem; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #3d6fa8, #7fa8d9); box-shadow: 0 0 22px rgba(127,168,217,0.5);
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .sv-start:hover { box-shadow: 0 0 34px rgba(127,168,217,0.8); transform: translateY(-2px); }
    .sv-start--off { background: rgba(255,255,255,0.08); box-shadow: none; color: #888; cursor: default; pointer-events: none; }
    .sv-iconbtn {
      width: 52px; height: 52px; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
      background: rgba(20,16,30,0.75); border: 1px solid rgba(255,255,255,0.28); color: #ddd; transition: all 0.15s; text-decoration: none;
    }
    .sv-iconbtn:hover { border-color: #f0c060; color: #f0c060; box-shadow: 0 0 12px rgba(240,192,96,0.3); }
    .sv-iconbtn.on { border-color: #f0c060; color: #f0c060; background: rgba(240,192,96,0.15); }
    .sv-iconbtn.on svg { fill: currentColor; }
    .sv-editbtn {
      display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.7em 1.4em; border-radius: 999px; text-decoration: none;
      font-family: 'Fredoka', 'Lato', cursive; font-weight: 700; font-size: 0.95rem; color: #f7d68a;
      background: linear-gradient(160deg, rgba(38,30,16,0.85), rgba(20,16,10,0.85)); border: 1px solid rgba(240,192,96,0.6);
      box-shadow: 0 0 8px rgba(240,192,96,0.22);
    }
    .sv-editbtn:hover { color: #fff; box-shadow: 0 0 16px rgba(240,192,96,0.4); }

    /* ── Tags ── */
    .sv-tags { margin-top: 0; }
    .sv-tags .sv-h2 { margin-bottom: 0.75rem; }
    .sv-chips { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .sv-chip {
      display: inline-flex; align-items: center; padding: 0.38em 0.95em; border-radius: 999px; text-decoration: none;
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 600; border: 1px solid transparent; transition: filter 0.15s, transform 0.15s;
    }
    a.sv-chip:hover { filter: brightness(1.25); transform: translateY(-1px); }
    .sv-chip--rating-sfw { color: #8fe0a8; background: rgba(143,224,168,0.12); border-color: rgba(143,224,168,0.5); }
    .sv-chip--rating-mature { color: #ffd479; background: rgba(255,212,121,0.12); border-color: rgba(255,212,121,0.5); }
    .sv-chip--rating-explicit { color: #ff8f86; background: rgba(255,143,134,0.12); border-color: rgba(255,143,134,0.5); }
    .sv-chip--fandom { color: #9fc0e6; background: rgba(127,168,217,0.14); border-color: rgba(127,168,217,0.5); }
    .sv-chip--cat { color: #c9a8f0; background: rgba(176,130,235,0.13); border-color: rgba(176,130,235,0.5); }
    .sv-chip--rel { color: #f5a9cf; background: rgba(240,130,190,0.12); border-color: rgba(240,130,190,0.5); }
    .sv-chip--tag { color: #c9ced8; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.14); }

    /* ── Summary body: description + chapters (left), HUD (right) ── */
    .sv-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 2.25rem; align-items: stretch; }
    .sv-left { display: flex; flex-direction: column; gap: 1.6rem; min-width: 0; }
    .sv-desc { padding: 0; }
    .sv-status-row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem 1rem; margin-bottom: 1rem; font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #98a2b2; }
    .sv-status { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.3em 0.85em; border-radius: 999px; font-weight: 700; font-family: 'Fredoka', 'Lato', cursive; font-size: 0.92rem; }
    .sv-status::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .sv-status--complete { color: #7fe3a0; background: rgba(127,227,160,0.12); border: 1px solid rgba(127,227,160,0.45); }
    .sv-status--ongoing { color: #8fbfff; background: rgba(143,191,255,0.12); border: 1px solid rgba(143,191,255,0.45); }
    /* Full description in a capped, scrolling box (same idea as the profile bio). */
    .sv-synopsis { margin: 0; overflow-y: auto; padding-right: 0.8rem; color: #dfe4ec; font-family: 'Lora', 'Georgia', serif; font-size: 1.04rem; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
    .sv-empty { color: #8a93a2; font-family: 'Inter', sans-serif; font-size: 0.9rem; margin: 0; }

    .sv-chsec { padding: 1.5rem 0 0; border-top: 1px solid rgba(255,255,255,0.09); }
    .sv-chsec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.8rem; }
    .sv-chsec-head .sv-h2 { margin: 0; }
    .sv-linkbtn { background: none; border: none; cursor: pointer; color: #7fa8d9; font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 0.92rem; }
    .sv-linkbtn:hover { color: #fff; }
    .sv-chlist { max-height: 290px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.35rem; padding-right: 0.35rem; }
    .sv-chrow {
      display: flex; align-items: center; gap: 0.9rem; padding: 0.65rem 0.9rem; border-radius: 10px; text-decoration: none; color: #e3e8f0;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-left: 3px solid #d9c9a3; transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .sv-chrow:hover { background: rgba(127,168,217,0.13); border-left-color: #7fa8d9; transform: translateX(2px); }
    .sv-chrow-num { flex-shrink: 0; min-width: 2.2rem; font-family: 'Fredoka', 'Lato', cursive; font-weight: 700; color: #d9c9a3; font-size: 0.95rem; }
    .sv-chrow-title { flex: 1; min-width: 0; font-family: 'Fredoka', 'Lato', cursive; font-weight: 500; font-size: 1.02rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sv-chrow-meta { flex-shrink: 0; font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #8a93a2; }
    .sv-draft-badge { flex-shrink: 0; font-family: 'Inter', sans-serif; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; color: #ffd479; border: 1px solid rgba(255,212,121,0.5); border-radius: 6px; padding: 0.1em 0.5em; }
    .sv-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .sv-scroll::-webkit-scrollbar-thumb { background: rgba(127,168,217,0.4); border-radius: 8px; }
    .sv-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 8px; }
    .sv-scroll { scrollbar-width: thin; scrollbar-color: rgba(127,168,217,0.4) rgba(255,255,255,0.04); }

    /* ── HUD: linked characters + gallery in one scanning console ── */
    .sv-hudwrap { position: relative; min-height: 440px; }
    .sv-hud {
      position: absolute; inset: 0; display: flex; flex-direction: column; padding: 1.2rem 1.1rem 1.1rem; overflow: hidden;
      border-color: rgba(127,168,217,0.35);
      background: linear-gradient(180deg, rgba(8,12,24,0.9), rgba(8,10,20,0.82)), url('/images/home/box-background-2.png');
      background-size: cover; background-position: center;
      box-shadow: 0 0 0 1px rgba(127,168,217,0.1), 0 10px 34px rgba(0,0,0,0.45), inset 0 0 40px rgba(127,168,217,0.08);
    }
    /* Corner brackets + faint scanline sheen. */
    .sv-hud::before, .sv-hud::after { content: ''; position: absolute; width: 22px; height: 22px; border: 2px solid #7fa8d9; pointer-events: none; opacity: 0.85; }
    .sv-hud::before { top: 8px; left: 8px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
    .sv-hud::after { bottom: 8px; right: 8px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }
    .sv-hud-scan { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(127,168,217,0.035) 0 1px, transparent 1px 4px); }
    .sv-hud-title { position: relative; display: flex; align-items: center; justify-content: space-between; margin: 0 0 0.75rem; padding: 0 0.3rem; font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: #9fc0e6; text-shadow: 0 0 12px rgba(127,168,217,0.7); }
    .sv-hud-dot { width: 9px; height: 9px; border-radius: 50%; background: #7fe3a0; box-shadow: 0 0 10px #7fe3a0; animation: sv-blink 2s ease-in-out infinite; }
    @keyframes sv-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .sv-seg { position: relative; display: flex; padding: 4px; border-radius: 12px; background: rgba(0,0,0,0.4); border: 1px solid rgba(127,168,217,0.25); margin-bottom: 0.8rem; }
    .sv-seg button { flex: 1; border: none; background: none; cursor: pointer; color: #8f9bb0; padding: 0.5rem 0.4rem; border-radius: 9px; font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 0.9rem; transition: all 0.15s; }
    .sv-seg button:hover { color: #fff; }
    .sv-seg button.active { color: #fff; background: rgba(127,168,217,0.28); box-shadow: 0 0 12px rgba(127,168,217,0.35); }
    .sv-hud-list { position: relative; flex: 1 1 0; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.65rem; align-content: start; grid-auto-rows: max-content; padding-right: 0.3rem; }
    .sv-tile { position: relative; display: block; border-radius: 12px; overflow: hidden; text-decoration: none; background: #14141c; border: 1px solid rgba(255,255,255,0.12); transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; }
    .sv-tile:hover { transform: translateY(-2px); border-color: #7fa8d9; box-shadow: 0 0 16px rgba(127,168,217,0.4); }
    /* Height via a padding spacer (not aspect-ratio) so grid rows can't collapse inside the scrolling list. */
    .sv-tile::before { content: ''; display: block; padding-top: 100%; }
    .sv-tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .sv-tile--locked img { filter: blur(14px); transform: scale(1.1); }
    .sv-tile-name { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.4rem 0.55rem 0.5rem; background: linear-gradient(to top, rgba(0,0,0,0.88), transparent); color: #fff; font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sv-hud-empty { grid-column: 1 / -1; text-align: center; padding: 2rem 0.5rem; }
    .sv-hud-foot { position: relative; margin-top: 0.7rem; padding: 0 0.3rem; display: flex; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: #6f7a8c; }
    .sv-hud-foot a { color: #7fa8d9; text-decoration: none; }
    .sv-hud-foot a:hover { color: #fff; }

    /* ── Chapters tab: cover box on the left, chapter list taking the rest ── */
    .sv-chlayout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 2.5rem; padding: 2.25rem 2.75rem 2.5rem; align-items: start; }
    .sv-chside { position: sticky; top: 1.25rem; padding: 1.25rem 1.25rem 1.4rem; border-radius: 16px; border: 1px solid rgba(127,168,217,0.3); background: linear-gradient(180deg, rgba(8,12,24,0.7), rgba(8,10,20,0.6)); box-shadow: inset 0 0 30px rgba(127,168,217,0.06); }
    .sv-chside .sv-cover { width: 100%; }
    .sv-chside-title { margin: 1rem 0 0.35rem; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.45rem; line-height: 1.15; font-weight: 700; color: #fff; text-shadow: 0 0 16px rgba(255,255,255,0.4); overflow-wrap: anywhere; }
    .sv-chside-by { display: block; text-decoration: none; color: #b9c2d0; font-family: 'Fredoka', 'Lato', cursive; font-size: 0.95rem; margin-bottom: 1rem; }
    .sv-chside-by:hover { color: #fff; }
    .sv-chside-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid rgba(255,255,255,0.12); }
    .sv-chside-stat { padding: 0.85rem 0.4rem 0.8rem 0; }
    .sv-chside-stat:nth-child(even) { padding-left: 0.9rem; border-left: 1px solid rgba(255,255,255,0.12); }
    .sv-chside-stat:nth-child(n+3) { border-top: 1px solid rgba(255,255,255,0.12); }
    .sv-chside-stat .sv-stat-top { gap: 0.4rem; }
    .sv-chside-stat .sv-stat-top svg { width: 18px; height: 18px; }
    .sv-chside-stat .sv-stat-num { font-size: 1.45rem; }
    .sv-chside-stat .sv-stat-label { font-size: 0.66rem; margin-top: 0.3rem; }
    .sv-chside-start { display: flex; justify-content: center; margin-top: 1rem; min-width: 0; padding: 0.7rem 1rem; font-size: 1.05rem; }
    .sv-pmain-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 0.4rem 1rem; padding-bottom: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.18); }
    .sv-pmain-head .sv-h2 { margin: 0; font-size: 1.7rem; }
    .sv-pmain-sum { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: #98a2b2; }
    .sv-pmain-sum b { color: #fff; font-weight: 700; }
    .sv-prow {
      position: relative; display: flex; align-items: center; gap: 1.1rem; padding: 1.15rem 0.6rem 1.15rem 0.4rem; text-decoration: none; color: #e8edf5;
      border-bottom: 1px solid rgba(255,255,255,0.09); transition: background 0.15s, padding-left 0.15s;
    }
    .sv-prow:hover { background: rgba(127,168,217,0.1); padding-left: 0.9rem; }
    .sv-prow-num { flex-shrink: 0; width: 2.6rem; text-align: center; font-family: 'Fredoka', 'Lato', cursive; font-weight: 700; font-size: 1.05rem; color: #7fa8d9; }
    .sv-prow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.3rem; }
    .sv-prow-title { font-family: 'Fredoka', 'Lato', cursive; font-weight: 500; font-size: 1.25rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sv-prow:hover .sv-prow-title { text-shadow: 0 0 14px rgba(255,255,255,0.45); }
    .sv-prow-stats { display: flex; flex-wrap: wrap; gap: 0.15rem 1.1rem; font-family: 'Inter', sans-serif; font-size: 0.78rem; color: #8a93a2; }
    .sv-prow-stats span { display: inline-flex; align-items: center; gap: 0.35rem; }
    .sv-prow-stats svg { width: 14px; height: 14px; color: #7fa8d9; }
    .sv-prow-right { flex-shrink: 0; display: flex; align-items: center; gap: 0.8rem; font-family: 'Inter', sans-serif; font-size: 0.88rem; color: #aab3c2; }
    .sv-prow-read { font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 0.8rem; color: #9fc0e6; border: 1px solid rgba(127,168,217,0.5); border-radius: 999px; padding: 0.1em 0.7em; }
    .sv-prow-read--done { color: #7fe3a0; border-color: rgba(127,227,160,0.5); }
    .sv-prow-bar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; }
    .sv-prow-bar i { display: block; height: 100%; background: linear-gradient(90deg, #3d6fa8, #7fa8d9); box-shadow: 0 0 8px rgba(127,168,217,0.7); }

    /* ── You may also like ── */
    .sv-rec { margin-top: 0; }
    .sv-rec-head { display: flex; align-items: center; justify-content: space-between; }
    .sv-rec-head .sv-h2 { margin-bottom: 0.9rem; }
    .sv-rec-arrows { display: flex; gap: 0.4rem; margin-bottom: 0.9rem; }
    .sv-rec-arrows button { width: 34px; height: 34px; border-radius: 50%; cursor: pointer; background: rgba(20,16,30,0.75); border: 1px solid rgba(255,255,255,0.25); color: #ddd; font-size: 1.1rem; line-height: 1; }
    .sv-rec-arrows button:hover { border-color: #f0c060; color: #f0c060; }
    .sv-rec-row { display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 0.7rem; }
    .sv-rcard { flex: 0 0 168px; width: 168px; min-width: 0; max-width: 168px; scroll-snap-align: start; text-decoration: none; color: #e8edf5; display: flex; flex-direction: column; gap: 0.45rem; }
    .sv-rcard-cover { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 10px; background: #1a1a22; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 6px 18px rgba(0,0,0,0.5); transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; }
    .sv-rcard:hover .sv-rcard-cover { transform: translateY(-4px); border-color: #7fa8d9; box-shadow: 0 12px 26px rgba(0,0,0,0.6), 0 0 18px rgba(127,168,217,0.4); }
    .sv-rcard-title { font-family: 'Fredoka', 'Lato', cursive; font-weight: 600; font-size: 1rem; line-height: 1.25; color: #cfe0f5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sv-rcard-by { max-width: 100%; font-family: 'Inter', sans-serif; font-size: 0.75rem; color: #8a93a2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sv-rcard-why { align-self: flex-start; font-family: 'Inter', sans-serif; font-size: 0.68rem; font-weight: 600; color: #f0c060; background: rgba(240,192,96,0.1); border: 1px solid rgba(240,192,96,0.35); border-radius: 999px; padding: 0.15em 0.65em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Resume prompt */
    .sv-overlay { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .sv-modal { width: min(92vw, 420px); text-align: center; padding: 1.75rem 2rem 1.9rem; border-top: 3px solid #7fa8d9; }
    .sv-modal h3 { margin: 0 0 0.5rem; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.35rem; color: #f0f0f0; }
    .sv-modal p { margin: 0 0 1.4rem; font-family: 'Inter', sans-serif; font-size: 0.92rem; color: #b8c0cc; }
    .sv-modal-actions { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; }
    .sv-modal-actions button { cursor: pointer; padding: 0.65em 1.4em; border-radius: 999px; font-family: 'Fredoka', 'Lato', cursive; font-weight: 700; font-size: 0.95rem; }
    .sv-btn-ghost { background: none; border: 1px solid rgba(255,255,255,0.3); color: #ddd; }
    .sv-btn-ghost:hover { border-color: #fff; color: #fff; }
    .sv-btn-blue { border: none; color: #fff; background: linear-gradient(135deg, #3d6fa8, #7fa8d9); box-shadow: 0 0 14px rgba(127,168,217,0.45); }
    .sv-loading { text-align: center; color: #8a93a2; padding: 6rem 0; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.1rem; }

    /* ── Mobile -- every rule here comes after the base rules it overrides. ── */
    @media (max-width: 980px) {
      .sv-grid { grid-template-columns: minmax(0, 1fr); }
      .sv-hudwrap { min-height: 420px; }
      .sv-chlayout { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
      .sv-chside { position: static; display: grid; grid-template-columns: 130px minmax(0, 1fr); column-gap: 1.1rem; align-items: start; }
      .sv-chside .sv-cover { grid-row: 1 / span 3; }
      .sv-chside-title { margin-top: 0; }
      .sv-chside-stats, .sv-chside-start { grid-column: 1 / -1; }
    }
    @media (max-width: 720px) {
      .sv-wrap { padding: 1rem 0.85rem 4rem; }
      .sv-tab { padding: 0.75rem 1.1rem; font-size: 0.85rem; }
      .sv-hero { flex-direction: column; align-items: center; padding: 1.4rem 1.1rem; gap: 1.25rem; }
      .sv-sec { padding: 1.3rem 1.1rem 1.4rem; }
      .sv-stats { max-width: none; width: 100%; }
      .sv-stat, .sv-stat:nth-child(3n+1), .sv-stat:nth-child(-n+3) { padding: 0.9rem 0.3rem; align-items: center; text-align: center; }
      .sv-stat:nth-child(-n+3) { padding-top: 0; }
      .sv-stat-top { justify-content: center; gap: 0.35rem; }
      .sv-stat-top svg { width: 20px; height: 20px; }
      .sv-stat-num { font-size: 1.55rem; }
      .sv-stat-label { font-size: 0.66rem; letter-spacing: 0.06em; }
      .sv-progress { margin-left: auto; margin-right: auto; }
      .sv-cover-col { width: 190px; }
      .sv-hero-main { width: 100%; align-items: center; text-align: center; }
      .sv-title { font-size: 1.75rem; }
      .sv-author { align-self: center; }
      .sv-actions { justify-content: center; width: 100%; }
      .sv-start { min-width: 0; flex: 1 1 100%; white-space: nowrap; font-size: 1.15rem; padding: 0.85rem 1.2rem; }
      .sv-chlayout { padding: 1.3rem 1rem 1.6rem; }
      .sv-chside-stat, .sv-chside-stat:nth-child(even) { align-items: flex-start; text-align: left; }
      .sv-chside-stat .sv-stat-top { justify-content: flex-start; }
      .sv-prow { gap: 0.6rem; }

      .sv-prow-right .sv-prow-date { display: none; }
      .sv-chrow-meta { display: none; }
      .sv-rcard { flex-basis: 140px; width: 140px; max-width: 140px; }
    }
  </style>
</head>
<body>
<div class="fp-content-z">
<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>
<script src="/fanpages/fanpages-site.js"></script>

<!-- "Continue where you left off?" prompt, shown by Start Reading when the
     server reports saved progress (site.resume). -->

<main class="sv-wrap" id="sv-wrap" hidden>

  <div class="sv-tabs" role="tablist">
    <button class="sv-tab active" id="sv-tab-summary" type="button" role="tab">Summary</button>
    <button class="sv-tab" id="sv-tab-chapters" type="button" role="tab">Chapters</button>
  </div>

  <!-- ONE main box holds everything below the tabs. -->
  <div class="sv-panel sv-main">

  <!-- Cover, title, stats -->
  <section class="sv-hero" id="sv-hero">
    <div class="sv-cover-col"><img class="sv-cover" id="sv-cover" alt="" /></div>
    <div class="sv-hero-main">
      <h1 class="sv-title" id="sv-title"></h1>
      <a class="sv-author" id="sv-author" href="#"></a>
      <div class="sv-stats" id="sv-stats"></div>
      <div class="sv-cta">
      <div class="sv-progress" id="sv-progress" hidden>
        <div class="sv-progress-top"><span id="sv-progress-label">Your progress</span><b id="sv-progress-pct">0%</b></div>
        <div class="sv-progress-track"><div class="sv-progress-fill" id="sv-progress-fill"></div></div>
      </div>
      <div class="sv-actions">
        <a class="sv-start" id="sv-start" href="#">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <span id="sv-start-label">Start Reading</span>
        </a>
        <button class="sv-iconbtn" id="sv-bookmark" type="button" title="Bookmark" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3a1 1 0 0 0-1 1v16.5a.5.5 0 0 0 .8.4L12 16l6.2 4.9a.5.5 0 0 0 .8-.4V4a1 1 0 0 0-1-1H6z"/></svg>
        </button>
        <a class="sv-editbtn" id="sv-edit" href="#" hidden>✎ Edit Story</a>

      </div>

  <!-- ═══ Summary tab ═══ -->
  <div id="sv-view-summary">
    <section class="sv-sec sv-tags">
      <h2 class="sv-h2">Tags <img src="/images/home/decoration-1.png" alt="" /></h2>

    <div class="sv-grid sv-sec">

          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
          <span>Start Reading</span>
        </a>
      </aside>

          <h2 class="sv-h2">Chapters <img src="/images/home/decoration-1.png" alt="" /></h2>

        </div>

  </div><!-- /sv-main -->
</main>

<script>
// ── Which story? /<owner>/<story> (btwfics.net) or /fanpages/<owner>/<story> ──
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const OFFSET = window.FP_BASE ? 1 : 0;
const SLUG = PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');
const STORY_BASE = (window.FP_BASE || '') + '/' + SLUG;
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => ({ Authorization: `Bearer ${token}`, 'X-Story-Path': SLUG });
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function formatCount(n) {
  n = Number(n) || 0;
  if (n < 1000) return String(n);
  if (n < 1000000) return (n / 1000).toFixed(n % 1000 >= 100 ? 1 : 0).replace(/\.0$/, '') + 'K';
  return (n / 1000000).toFixed(n % 1000000 >= 100000 ? 1 : 0).replace(/\.0$/, '') + 'M';
}
function fmtDate(d) {
  return d ? new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) : '';
}
// Description markup the story builder's lightbulb hint advertises:
// **bold** and *italics*. Escaped first, so nothing else can inject HTML.
// A cut-off (truncated) string with a dangling marker gets it closed.
function richText(raw) {
  let t = String(raw || '');
  if ((t.match(/\*\*/g) || []).length % 2) t += '**';
  if ((t.replace(/\*\*/g, '').match(/\*/g) || []).length % 2) t += '*';
  return esc(t).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*\n]+)\*/g, '<em>$1</em>');
}
function stripMarkup(t) { return String(t || '').replace(/\*+/g, ''); }
function plainText(html) {
  return String(html || '').replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim();
}
function wordCount(html) {
  const t = plainText(html);
  return t ? t.split(' ').length : 0;
}
function ytId(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? m[1] : null;
}
const ICONS = {
  eye: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  heart: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-9.3-9.3C1.6 7.6 3.5 4.5 6.7 4.5c2 0 3.5 1.1 5.3 3 1.8-1.9 3.3-3 5.3-3 3.2 0 5.1 3.1 4 6.2C19.500 15.400 12 20 12 20z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  mark: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3a1 1 0 0 0-1 1v16.5a.5.5 0 0 0 .8.4L12 16l6.2 4.9a.5.5 0 0 0 .8-.4V4a1 1 0 0 0-1-1H6z"/></svg>',
  words: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg>',
  book: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.500 4H11v15H5.500A1.500 1.500 0 0 0 4 20.500zM20 5.500A1.500 1.500 0 0 0 18.500 4H13v15h5.500a1.500 1.500 0 0 1 1.500 1.500z"/></svg>',
};

const RATING_META = {
  sfw: { label: 'General', cls: 'sfw' },
  mature: { label: 'Mature', cls: 'mature' },
  explicit: { label: 'Explicit', cls: 'explicit' },
};

let DATA = null;       // full API payload
let SITE = null;
let CHAPTERS = [];     // chapters + computed _words / _num
let hudMode = 'chars';

// ── Tabs ──
function setTab(name) {
  const isCh = name === 'chapters';
  $('sv-tab-summary').classList.toggle('active', !isCh);
  $('sv-tab-chapters').classList.toggle('active', isCh);
  $('sv-hero').hidden = isCh;
  $('sv-view-summary').hidden = isCh;
  $('sv-view-chapters').hidden = !isCh;
  history.replaceState(null, '', isCh ? '#chapters' : location.pathname + location.search);
}
$('sv-tab-summary').addEventListener('click', () => setTab('summary'));
$('sv-tab-chapters').addEventListener('click', () => setTab('chapters'));
$('sv-see-all').addEventListener('click', () => { setTab('chapters'); window.scrollTo({ top: 0, behavior: 'smooth' }); });

// ── Hero ──
function renderHero() {
  const s = SITE;
  document.title = `${s.site_title || 'Story'} ✦ BTW`;
  $('sv-title').textContent = s.site_title || 'Untitled Story';
  const coverEl = window.wikiSetCoverSlot($('sv-cover'), s, { alt: `${s.site_title || 'Untitled Story'} cover` });
  coverEl.classList.add('sv-cover');

  const a = $('sv-author');
  if (s.author_username) {
    a.href = window.fpUrl('/' + s.author_username);
    const name = s.author_display_name || s.author_username;
    a.innerHTML = (s.author_avatar
      ? `<img class="sv-author-av" src="${esc(s.author_avatar)}" alt="" />`
      : `<span class="sv-author-av">${esc(name.charAt(0).toUpperCase())}</span>`) + `<span>${esc(name)}</span>`;
  } else a.hidden = true;

  const totalWords = CHAPTERS.reduce((n, c) => n + c._words, 0);
  const stat = (icon, num, label) =>
    `<div class="sv-stat"><div class="sv-stat-top">${icon}<span class="sv-stat-num">${esc(num)}</span></div><div class="sv-stat-label">${label}</div></div>`;
  $('sv-stats').innerHTML =
    stat(ICONS.eye, formatCount(s.view_count), 'Reads') +
    stat(ICONS.heart, formatCount(s.like_count), 'Likes') +
    stat(ICONS.chat, formatCount(s.comment_count), 'Comments') +
    stat(ICONS.mark, formatCount(s.bookmark_count), 'Saved') +
    stat(ICONS.words, totalWords.toLocaleString(), 'Words') +
    stat(ICONS.book, CHAPTERS.length.toLocaleString(), CHAPTERS.length === 1 ? 'Chapter' : 'Chapters');

  // Reading progress (logged-in viewers only; guests aren't tracked).
  if (token && CHAPTERS.length) {
    const pct = Math.max(0, Math.min(100, Number(s.reading_progress_percent) || 0));
    $('sv-progress').hidden = false;
    $('sv-progress-label').textContent = pct >= 100 ? 'Finished — nice!' : pct > 0 ? 'Your progress' : 'Not started yet';
    $('sv-progress-pct').textContent = pct + '%';
    requestAnimationFrame(() => requestAnimationFrame(() => { $('sv-progress-fill').style.width = pct + '%'; }));
  }

  // Start Reading -> first chapter, or a resume prompt if there's progress.
  const btn = $('sv-start');
  const first = CHAPTERS[0];
  if (!first) {
    btn.classList.add('sv-start--off');
    btn.removeAttribute('href');
    $('sv-start-label').textContent = 'No Chapters Yet';
  } else {
    btn.href = `${STORY_BASE}/reader?ch=${first.id}`;
    if (s.resume) {
      $('sv-start-label').textContent = 'Continue Reading';
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        $('sv-resume-text').textContent = `You're ${s.resume.percent}% through "${s.resume.chapter_title || 'Untitled Chapter'}".`;
        $('sv-resume-overlay').hidden = false;
      });
      $('sv-resume-restart').addEventListener('click', () => { window.location.href = btn.href; });
      $('sv-resume-yes').addEventListener('click', () => { window.location.href = `${STORY_BASE}/reader?ch=${s.resume.chapter_id}&resume=1`; });
    }
  }

  // Bookmark
  const bm = $('sv-bookmark');
  if (!s.is_self) {
    bm.hidden = false;
    let on = !!s.is_bookmarked;
    const paint = () => { bm.classList.toggle('on', on); bm.title = on ? 'Bookmarked' : 'Bookmark'; };
    paint();
    bm.addEventListener('click', async () => {
      if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(location.pathname)}`); return; }
      bm.disabled = true;
      try {
        const r = await fetch(`/api/bookmarks/by-path/${SLUG}`, { method: on ? 'DELETE' : 'POST', headers: authHeaders() });
        if (r.ok) { on = !on; paint(); }
      } catch {}
      bm.disabled = false;
    });
  }
  if (s.is_self) {
    const e = $('sv-edit');
    e.hidden = false;
    e.href = window.fpUrl('/create?story=' + encodeURIComponent(SLUG) + '&from=hub');
  }
}

// ── Tags: rating, fandoms, categories, relationships, then every other tag ──
function renderTags() {
  const s = SITE;
  const r = RATING_META[s.rating] || RATING_META.sfw;
  const chips = [`<span class="sv-chip sv-chip--rating-${r.cls}">${r.label}</span>`];
  (s.fandoms || []).forEach(f => chips.push(`<span class="sv-chip sv-chip--fandom">${esc(f)}</span>`));
  (s.categories || []).forEach(c => chips.push(`<span class="sv-chip sv-chip--cat">${esc(c)}</span>`));
  (s.relationships || []).forEach(x => chips.push(`<span class="sv-chip sv-chip--rel">${esc(x)}</span>`));
  (s.tags || []).forEach(t => {
    const href = window.fpUrl(`/search?tags_include=${encodeURIComponent(t)}&q=${encodeURIComponent(t)}&sort=updated&view=story`);
    chips.push(`<a class="sv-chip sv-chip--tag" href="${href}">${esc(t)}</a>`);
  });
  $('sv-chips').innerHTML = chips.join('');
}

// ── Description + status ──
function renderDescription() {
  const s = SITE;
  const published = CHAPTERS.filter(c => c.status === 'published');
  const last = published.reduce((m, c) => (!m || new Date(c.updated_at) > new Date(m) ? c.updated_at : m), null);
  $('sv-status-row').innerHTML =
    `<span class="sv-status ${s.is_complete ? 'sv-status--complete' : 'sv-status--ongoing'}">${s.is_complete ? 'Complete' : 'Ongoing'}</span>` +
    (last ? `<span>Updated ${esc(fmtDate(last))}</span>` : '');
  const txt = (s.synopsis || '').trim();
  const el = $('sv-synopsis');
  if (!txt) { el.className = 'sv-empty'; el.textContent = 'No description yet.'; return; }
  el.innerHTML = richText(txt);
  fitSynopsis(txt);
  let t;
  window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => fitSynopsis(txt), 150); });
}

// The box is as tall as the FIRST 750 characters render (at the current width);
// anything longer than that scrolls inside it.
function fitSynopsis(txt) {
  const el = $('sv-synopsis');
  el.style.maxHeight = '';
  if (txt.length <= 750) return;
  const probe = el.cloneNode(false);
  probe.removeAttribute('id');
  probe.style.cssText = 'visibility:hidden;max-height:none;overflow:visible;';
  probe.innerHTML = richText(txt.slice(0, 750));
  el.parentNode.appendChild(probe);
  const h = probe.offsetHeight;
  probe.remove();
  if (h) el.style.maxHeight = h + 'px';
}

// ── Chapters: compact scroller (Summary) + full cards (Chapters tab) ──
function renderChapters() {
  const list = $('sv-chlist');
  if (!CHAPTERS.length) {
    list.innerHTML = '<p class="sv-empty">No chapters published yet.</p>';
    $('sv-see-all').hidden = true;
    renderChaptersTab();
    return;
  }
  list.innerHTML = CHAPTERS.map(c => `
    <a class="sv-chrow" href="${STORY_BASE}/reader?ch=${c.id}">
      <span class="sv-chrow-num">${c._num}</span>
      <span class="sv-chrow-title">${esc(c.title || 'Untitled Part')}</span>
      ${c.status === 'draft' ? '<span class="sv-draft-badge">Draft</span>' : ''}
      <span class="sv-chrow-meta">${c._words.toLocaleString()} words</span>
    </a>`).join('');

  renderChaptersTab();
}

// Chapters tab: Wattpad-style list (title left, date right) with Creator-Hub-style stats.
function renderChaptersTab() {
  const s = SITE;
  const totalWords = CHAPTERS.reduce((n, c) => n + c._words, 0);
  const coverEl = window.wikiSetCoverSlot($('sv-ch-cover'), s, { alt: `${s.site_title || 'Untitled Story'} cover` });
  coverEl.classList.add('sv-cover');
  $('sv-ch-title').textContent = s.site_title || 'Untitled Story';
  const by = $('sv-ch-by');
  if (s.author_username) { by.href = window.fpUrl('/' + s.author_username); by.textContent = 'by ' + (s.author_display_name || s.author_username); } else by.hidden = true;
  const mini = (icon, num, label) =>
    `<div class="sv-chside-stat"><div class="sv-stat-top">${icon}<span class="sv-stat-num">${esc(num)}</span></div><div class="sv-stat-label">${label}</div></div>`;
  $('sv-ch-stats').innerHTML =
    mini(ICONS.eye, formatCount(s.view_count), 'Reads') + mini(ICONS.heart, formatCount(s.like_count), 'Likes') +
    mini(ICONS.words, formatCount(totalWords), 'Words') + mini(ICONS.book, CHAPTERS.length.toLocaleString(), 'Chapters');
  const start = $('sv-ch-start');
  if (CHAPTERS[0]) start.href = `${STORY_BASE}/reader?ch=${s.resume ? s.resume.chapter_id : CHAPTERS[0].id}${s.resume ? '&resume=1' : ''}`;
  else { start.classList.add('sv-start--off'); start.removeAttribute('href'); }
  if (s.resume) start.querySelector('span').textContent = 'Continue Reading';

  const published = CHAPTERS.filter(c => c.status === 'published');
  const last = published.reduce((m, c) => (!m || new Date(c.updated_at) > new Date(m) ? c.updated_at : m), null);
  $('sv-pmain-sum').innerHTML = `<b>${CHAPTERS.length.toLocaleString()}</b> ${CHAPTERS.length === 1 ? 'chapter' : 'chapters'} · <b>${totalWords.toLocaleString()}</b> words${last ? ` · Updated <b>${esc(fmtDate(last))}</b>` : ''}`;

  $('sv-plist').innerHTML = CHAPTERS.length ? CHAPTERS.map(c => {
    const pct = Math.max(0, Math.min(100, Number(c.progress_percent) || 0));
    const readChip = pct >= 97 ? '<span class="sv-prow-read sv-prow-read--done">✓ Read</span>' : pct > 0 ? `<span class="sv-prow-read">${pct}%</span>` : '';
    return `
    <a class="sv-prow" href="${STORY_BASE}/reader?ch=${c.id}">
      <span class="sv-prow-num">${c._num}</span>
      <span class="sv-prow-main">
        <span class="sv-prow-title">${esc(c.title || 'Untitled Part')}</span>
        <span class="sv-prow-stats">
          <span>${ICONS.words} ${c._words.toLocaleString()} words</span>
          <span>${ICONS.heart} ${formatCount(c.like_count)}</span>
          <span>${ICONS.chat} ${formatCount(c.comment_count)}</span>
        </span>
      </span>
      <span class="sv-prow-right">
        ${c.status === 'draft' ? '<span class="sv-draft-badge">Draft</span>' : ''}${readChip}
        <span class="sv-prow-date">${esc(fmtDate(c.created_at))}</span>
      </span>
      ${pct > 0 ? `<span class="sv-prow-bar"><i style="width:${pct}%"></i></span>` : ''}
    </a>`;
  }).join('') : '<p class="sv-empty" style="padding:1.5rem 0.4rem;">No chapters published yet.</p>';
}

// ── HUD: linked characters / gallery ──
function renderHud() {
  const chars = DATA.characters || [];
  const gal = DATA.gallery || [];
  $('sv-n-chars').textContent = chars.length ? `· ${chars.length}` : '';
  $('sv-n-gallery').textContent = gal.length ? `· ${gal.length}` : '';
  const list = $('sv-hud-list');
  list.scrollTop = 0;
  if (hudMode === 'chars') {
    list.innerHTML = chars.length ? chars.map(c => {
      const ref = c.ref_image && c.ref_image !== '/images/defaultchar.jpg' ? c.ref_image : '';
      const pos = `${c.ref_position_x != null ? c.ref_position_x : 50}% ${c.ref_position_y != null ? c.ref_position_y : 15}%`;
      // Opens the character in its owner's profile Characters tab; Back there returns to this story.
      const href = c.owner_username
        ? `${window.fpUrl('/' + c.owner_username)}?char=${c.id}&back=${encodeURIComponent(STORY_BASE)}#characters`
        : STORY_BASE;
      return `<a class="sv-tile sv-tile--char${c.nsfw_locked ? ' sv-tile--locked' : ''}" href="${href}" title="${esc(c.name)}">
        <img src="${esc(ref || '/images/defaultchar.jpg')}" alt="" style="object-position:${pos}" loading="lazy" />
        <span class="sv-tile-name">${esc(c.name)}</span></a>`;
    }).join('') : '<p class="sv-empty sv-hud-empty">No characters linked to this story yet.</p>';
    $('sv-hud-foot').innerHTML = `<span>${chars.length} linked</span>`;
  } else {
    list.innerHTML = gal.length ? gal.map(g => {
      const src = g.preview_image_url || g.image_url;
      return `<a class="sv-tile sv-tile--gal" href="${window.fpUrl('/gallery-post?id=' + g.id)}" title="${esc(g.title || '')}">
        <img src="${esc(src)}" alt="" style="object-position:${g.position_x != null ? g.position_x : 50}% ${g.position_y != null ? g.position_y : 50}%" loading="lazy" />
        ${g.title ? `<span class="sv-tile-name">${esc(g.title)}</span>` : ''}</a>`;
    }).join('') : '<p class="sv-empty sv-hud-empty">No gallery posts linked to this story yet.</p>';
    $('sv-hud-foot').innerHTML = `<span>${gal.length} linked</span>`;
  }
}
$('sv-seg').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-mode]');
  if (!b) return;
  hudMode = b.dataset.mode;
  $('sv-seg').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
  renderHud();
});

// ── You may also like ──
async function loadSimilar() {
  try {
    const res = await fetch(`/api/stories/similar/${SLUG}`, { headers: token ? { Authorization: `Bearer ${token}` } : {} });
    if (!res.ok) return;
    const { stories } = await res.json();
    if (!stories || !stories.length) return;
    $('sv-rec-row').innerHTML = stories.map(st => `
      <a class="sv-rcard" href="${window.fpUrl('/' + st.story_path)}" title="${esc(stripMarkup(st.synopsis)).slice(0, 160)}">
        <img class="sv-rcard-cover" src="${esc(st.cover_url || '/images/defaultcover.png')}" alt="" loading="lazy" />
        <span class="sv-rcard-title">${esc(st.site_title || 'Untitled Story')}</span>
        <span class="sv-rcard-by">by ${esc(st.author)} · ${st.chapter_count} ch · ${st.is_complete ? 'Complete' : 'Ongoing'}</span>
        <span class="sv-rcard-why">${esc(st.reason)}</span>
      </a>`).join('');
    $('sv-rec').hidden = false;
    const row = $('sv-rec-row');
    $('sv-rec-prev').onclick = () => row.scrollBy({ left: -row.clientWidth * 0.8, behavior: 'smooth' });
    $('sv-rec-next').onclick = () => row.scrollBy({ left: row.clientWidth * 0.8, behavior: 'smooth' });
  } catch {}
}

(async () => {
  DATA = await window.ModeratorSite.load(SLUG);
  if (!DATA) { $('sv-loading').textContent = "Couldn't load this story."; return; }
  SITE = DATA.site;
  CHAPTERS = (DATA.chapters || []).map((c, i) => ({ ...c, _num: i + 1, _words: wordCount(c.body) }));
  renderHero();
  renderTags();
  renderDescription();
  renderChapters();
  renderHud();
  $('sv-loading').hidden = true;
  $('sv-wrap').hidden = false;
  if (location.hash === '#chapters') setTab('chapters');
  loadSimilar();
  // One view per page load (the server skips the owner's own visits).
  fetch(`/api/moderator-sites/by-path/${SLUG}/view`, { method: 'POST', headers: token ? { Authorization: `Bearer ${token}` } : {} }).catch(() => {});
})();
</script>
