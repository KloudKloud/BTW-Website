<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Story Builder ✦ BTW</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- The old multi-tab Story Editor was retired. The Story Builder (Details +
       Chapters tabs) now lives in /fanpages/create.html, which handles both
       creating and editing a story (?story=<owner>/<story>). This stub only
       keeps the many existing <story>/edit links alive by forwarding them. -->
  <script>
    (function () {
      var onMain = /^(www\.)?btwfics\.net$/.test(location.hostname);
      var base = onMain ? '' : '/fanpages';
      var parts = location.pathname.split('/').filter(Boolean);
      var off = parts[0] === 'fanpages' ? 1 : 0;
      var story = parts.slice(off, off + 2).join('/');
      var from = new URLSearchParams(location.search).get('from');
      var target = base + '/create?story=' + encodeURIComponent(story) + (from ? '&from=' + encodeURIComponent(from) : '');
      if (location.hash === '#chapters') target += '#chapters';
      location.replace(target);
    })();
  </script>
</head>
<body style="background:#0a0a0a;"></body>
</html>
