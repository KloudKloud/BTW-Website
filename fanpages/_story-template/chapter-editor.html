<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Editor ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0d0d0d; color: #f0f0f0;
      font-family: 'Georgia', 'Lato', serif; min-height: 100vh;
    }
    [hidden] { display: none !important; }

    /* ── Top bar — bigger, cover art as its own boxed thumbnail beside the
       story breadcrumb/chapter title/status, matching the Wattpad
       reference. Pinned while the body scrolls. ── */
    .ce-topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 1.1rem;
      background: #141414; border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 1rem 1.75rem;
    }
    .ce-back-btn {
      background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer;
      padding: 0.2rem 0.4rem; line-height: 1; flex-shrink: 0;
    }
    .ce-back-btn:hover { color: #fff; }
    .ce-topbar-cover-link { flex-shrink: 0; display: block; border-radius: 8px; }
    .ce-topbar-cover {
      width: 46px; height: 64px; border-radius: 8px; object-fit: cover;
      border: 1px solid rgba(255,255,255,0.15); display: block; background: #1c1c1c;
    }
    .ce-topbar-titles { flex: 1; min-width: 0; }
    .ce-breadcrumb {
      display: flex; align-items: center; gap: 0.3rem; font-size: 0.82rem; color: #999;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 0.2rem;
      font-family: 'Inter', sans-serif;
    }
    .ce-breadcrumb-chevron { font-size: 0.7rem; color: #777; }
    .ce-title-input {
      display: block; width: 100%; background: none; border: none; color: #f5f5f5;
      font-family: 'Georgia', serif; font-size: 1.4rem; font-weight: 700;
      padding: 0.1rem 0; outline: none;
    }
    .ce-title-input::placeholder { color: #666; }
    .ce-topbar-status {
      font-family: 'Inter', sans-serif; font-size: 0.8rem; color: #888; margin: 0.25rem 0 0;
    }
    .ce-topbar-status-word { color: #7fa8d9; font-weight: 700; }
    .ce-topbar-actions { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
    .ce-btn {
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700;
      padding: 0.55em 1.3em; border-radius: 22px; cursor: pointer; border: none;
      transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
    }
    .ce-btn:active { transform: translateY(1px); }
    .ce-btn--cancel { background: none; border: 1px solid rgba(255,255,255,0.25); color: #ccc; }
    .ce-btn--cancel:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
    .ce-btn--publish { background: linear-gradient(135deg, #f0c060, #f5a85a); color: #1a1408; box-shadow: 0 0 14px rgba(240,192,96,0.35); }
    .ce-btn--publish:hover { box-shadow: 0 0 20px rgba(240,192,96,0.55); }
    .ce-btn--publish:disabled { opacity: 0.45; box-shadow: none; cursor: default; }
    .ce-more-btn {
      background: none; border: 1px solid rgba(255,255,255,0.2); color: #aaa;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1rem; line-height: 1;
    }
    .ce-more-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    /* ── Editor toolbar (Insert Image, etc.) ── */
    .ce-editor-toolbar {
      max-width: 760px; margin: 0 auto; padding: 1.5rem 1.5rem 0;
      display: flex; gap: 0.6rem;
    }
    .ce-tool-btn {
      font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600; color: #ccc;
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.14);
      border-radius: 8px; padding: 0.45em 0.9em; cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .ce-tool-btn:hover { border-color: rgba(240,192,96,0.5); color: #f0c060; }

    /* ── Writing surface — a plain contenteditable div, paragraphs are just
       <p> elements (Enter = new paragraph, matching the "blank line between
       paragraphs" convention Wattpad/AO3 both use). Not a rich toolbar-
       heavy editor on purpose yet — this is the "start simple" pass. ── */
    .ce-page { max-width: 760px; margin: 0 auto; padding: 1.5rem 1.5rem 8rem; }
    .ce-editor {
      min-height: 60vh; color: #e8e8e8;
      font-family: 'Georgia', serif; font-size: 1.15rem; line-height: 1.9; outline: none;
    }
    .ce-editor p { margin: 0 0 1.2em; }
    .ce-editor p:empty::before { content: '\00a0'; }
    .ce-editor:empty::before {
      content: 'Start writing your chapter here…'; color: #555; pointer-events: none;
    }
    .ce-img-block { position: relative; margin: 0 0 1.4em; }
    .ce-img-block img { display: block; max-width: 100%; border-radius: 10px; }
    .ce-img-controls {
      position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.3rem;
      opacity: 0; transition: opacity 0.15s;
    }
    .ce-img-block:hover .ce-img-controls { opacity: 1; }
    .ce-img-controls button {
      width: 30px; height: 30px; border-radius: 50%; border: none; cursor: pointer;
      background: rgba(0,0,0,0.65); color: #fff; font-size: 0.85rem; line-height: 1;
    }
    .ce-img-controls button:hover { background: rgba(0,0,0,0.85); }

    /* ── Floating selection toolbar — Bold/Italic/Underline + alignment,
       appears above whatever text you've highlighted. ── */
    .ce-sel-toolbar {
      position: fixed; z-index: 40; display: flex; align-items: center; gap: 0.1rem;
      background: #1c1c1e; border: 1px solid rgba(255,255,255,0.18); border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.5); padding: 0.3rem;
    }
    .ce-sel-toolbar button {
      width: 32px; height: 32px; border-radius: 6px; border: none; background: none;
      color: #eee; font-family: 'Georgia', serif; font-size: 0.95rem; cursor: pointer;
    }
    .ce-sel-toolbar button:hover { background: rgba(255,255,255,0.12); }
    .ce-sel-toolbar button.active { background: rgba(240,192,96,0.25); color: #f0c060; }
    .ce-sel-toolbar-divider { width: 1px; align-self: stretch; background: rgba(255,255,255,0.15); margin: 0.2rem 0.15rem; }

    .ce-loading { text-align: center; padding: 4rem 0; color: #888; }
  </style>
</head>
<body>

<div class="ce-topbar">
  <button class="ce-back-btn" id="ce-back-btn" type="button" title="Back to Chapters">←</button>
  <a class="ce-topbar-cover-link" id="ce-topbar-cover-link" href="#">
    <img class="ce-topbar-cover" id="ce-story-cover" src="/images/characters/noreference.png" alt="" />
  </a>
  <div class="ce-topbar-titles">
    <div class="ce-breadcrumb">
      <span id="ce-story-title">Loading…</span>
      <span class="ce-breadcrumb-chevron">⌄</span>
    </div>
    <input class="ce-title-input" id="ce-title-input" placeholder="Chapter title…" maxlength="120" />
    <p class="ce-topbar-status" id="ce-topbar-status"></p>
  </div>
  <div class="ce-topbar-actions">
    <button class="ce-btn ce-btn--publish" id="ce-publish-btn" type="button" disabled>Publish Changes</button>
    <button class="ce-btn ce-btn--cancel" id="ce-cancel-btn" type="button">Cancel</button>
    <button class="ce-more-btn" id="ce-more-btn" type="button" title="More">⋯</button>
  </div>
</div>

<div class="ce-editor-toolbar" id="ce-editor-toolbar" hidden>
  <button type="button" class="ce-tool-btn" id="ce-insert-image-btn">🖼️ Image</button>
</div>
<div class="ce-page" id="ce-page" hidden>
  <div class="ce-editor" id="ce-editor" contenteditable="true" spellcheck="true"></div>
</div>
<p class="ce-loading" id="ce-loading">Loading…</p>

<div class="ce-sel-toolbar" id="ce-sel-toolbar" hidden>
  <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
  <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
  <button type="button" data-cmd="underline" title="Underline"><u>U</u></button>
  <span class="ce-sel-toolbar-divider"></span>
  <button type="button" data-align="left" title="Align Left">⯇</button>
  <button type="button" data-align="center" title="Align Center">☰</button>
  <button type="button" data-align="right" title="Align Right">⯈</button>
</div>

<input type="file" id="ce-image-file-input" accept="image/png,image/jpeg,image/webp,image/gif" style="display:none;" />

<script>
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const SLUG = PATH_PARTS.slice(1, 3).join('/');
const STORY_BASE = '/' + PATH_PARTS.slice(0, 3).join('/');
const CHAPTER_ID = new URLSearchParams(window.location.search).get('id');
const API = '/api';

const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
if (!token) window.location.href = `/fanpages/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`;
const authHeaders = () => ({ Authorization: `Bearer ${token}`, 'X-Story-Path': SLUG });

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

let currentChapter = null;
let dirty = false;
const editor = document.getElementById('ce-editor');

function markDirty() {
  dirty = true;
  document.getElementById('ce-publish-btn').disabled = false;
}
function updateStatusLine() {
  const words = editor.textContent.trim() ? editor.textContent.trim().split(/\s+/).length : 0;
  const status = currentChapter ? currentChapter.status : 'draft';
  document.getElementById('ce-topbar-status').innerHTML =
    `<span class="ce-topbar-status-word">${status === 'draft' ? 'Draft' : 'Published'}</span> (${words} Word${words === 1 ? '' : 's'})`;
}

document.getElementById('ce-back-btn').addEventListener('click', () => {
  window.location.href = `${STORY_BASE}/edit#chapters`;
});
document.getElementById('ce-cancel-btn').addEventListener('click', () => {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  window.location.href = `${STORY_BASE}/edit#chapters`;
});
document.getElementById('ce-topbar-cover-link').addEventListener('click', (e) => {
  e.preventDefault();
  if (dirty && !confirm('Discard unsaved changes?')) return;
  window.location.href = STORY_BASE;
});
document.getElementById('ce-title-input').addEventListener('input', () => { markDirty(); });
editor.addEventListener('input', () => { markDirty(); updateStatusLine(); });

// ── Images pasted along with rich text get dropped on purpose (per spec —
// re-attach images yourself); only formatted TEXT gets translated. ─────────
document.execCommand('defaultParagraphSeparator', false, 'p');

function sanitizePastedHtml(html) {
  const container = document.createElement('div');
  container.innerHTML = html;
  const BLOCK_TAGS = new Set(['P', 'DIV', 'LI', 'H1', 'H2', 'H3', 'H4', 'H5', 'H6', 'BLOCKQUOTE', 'TR']);
  const paragraphs = [];
  let current = [];
  function flushParagraph() {
    if (current.length) { paragraphs.push(current); current = []; }
  }
  function isBold(el) {
    const fw = el.style && el.style.fontWeight;
    if (!fw) return false;
    const n = parseInt(fw, 10);
    return fw === 'bold' || (!isNaN(n) && n >= 600);
  }
  function isItalic(el) { return el.style && el.style.fontStyle === 'italic'; }
  function isUnderline(el) {
    const td = el.style && (el.style.textDecorationLine || el.style.textDecoration || '');
    return td.includes('underline');
  }
  function walk(node, marks) {
    if (node.nodeType === Node.TEXT_NODE) {
      if (node.textContent) current.push({ text: node.textContent, marks: { ...marks } });
      return;
    }
    if (node.nodeType !== Node.ELEMENT_NODE) return;
    const tag = node.tagName;
    if (tag === 'IMG' || tag === 'SCRIPT' || tag === 'STYLE') return;
    if (tag === 'BR') { flushParagraph(); return; }
    const newMarks = { ...marks };
    if (tag === 'B' || tag === 'STRONG' || isBold(node)) newMarks.bold = true;
    if (tag === 'I' || tag === 'EM' || isItalic(node)) newMarks.italic = true;
    if (tag === 'U' || isUnderline(node)) newMarks.underline = true;
    // Google Docs wraps its whole clipboard payload in a <b style="font-weight:normal">
    // — an explicit "normal" override has to win over any tag-based guess above.
    if (node.style && node.style.fontWeight === 'normal') newMarks.bold = false;

    const isBlock = BLOCK_TAGS.has(tag);
    if (isBlock) flushParagraph();
    Array.from(node.childNodes).forEach(child => walk(child, newMarks));
    if (isBlock) flushParagraph();
  }
  Array.from(container.childNodes).forEach(n => walk(n, {}));
  flushParagraph();

  if (!paragraphs.length) return '';
  return paragraphs.map(runs => {
    const p = document.createElement('p');
    runs.forEach(run => {
      if (!run.text) return;
      let node = document.createTextNode(run.text);
      const wrap = (tag) => { const el = document.createElement(tag); el.appendChild(node); node = el; };
      if (run.marks.underline) wrap('u');
      if (run.marks.italic) wrap('em');
      if (run.marks.bold) wrap('strong');
      p.appendChild(node);
    });
    if (!p.childNodes.length) p.appendChild(document.createElement('br'));
    return p.outerHTML;
  }).join('');
}
function plainTextToParagraphs(text) {
  return text.split(/\r?\n/).map(line => `<p>${line ? escapeHtml(line) : '<br>'}</p>`).join('');
}
editor.addEventListener('paste', (e) => {
  e.preventDefault();
  const html = e.clipboardData.getData('text/html');
  const text = e.clipboardData.getData('text/plain');
  const cleaned = html ? sanitizePastedHtml(html) : plainTextToParagraphs(text);
  if (cleaned) document.execCommand('insertHTML', false, cleaned);
  markDirty();
  updateStatusLine();
});

// ── Floating selection toolbar — Bold/Italic/Underline + per-paragraph
// alignment. Text always starts left-aligned; picking an alignment applies
// it to the whole paragraph the selection is inside, not just the run. ──
const selToolbar = document.getElementById('ce-sel-toolbar');
function hideSelToolbar() { selToolbar.hidden = true; }
function showSelToolbarAt(rect) {
  selToolbar.hidden = false;
  const toolbarRect = selToolbar.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - toolbarRect.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - toolbarRect.width - 8));
  let top = rect.top - toolbarRect.height - 10;
  if (top < 8) top = rect.bottom + 10;
  selToolbar.style.left = `${left}px`;
  selToolbar.style.top = `${top}px`;
}
document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelToolbar(); return; }
  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) { hideSelToolbar(); return; }
  const rect = range.getBoundingClientRect();
  if (!rect || (rect.width === 0 && rect.height === 0)) { hideSelToolbar(); return; }
  showSelToolbarAt(rect);
});
selToolbar.querySelectorAll('[data-cmd]').forEach(btn => {
  btn.addEventListener('mousedown', (e) => e.preventDefault()); // keep the text selection alive
  btn.addEventListener('click', () => { document.execCommand(btn.dataset.cmd); markDirty(); });
});
selToolbar.querySelectorAll('[data-align]').forEach(btn => {
  btn.addEventListener('mousedown', (e) => e.preventDefault());
  btn.addEventListener('click', () => {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    let node = sel.getRangeAt(0).commonAncestorContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
    const block = node.closest('p, div, li, h1, h2, h3, h4') || editor;
    if (block === editor) return;
    block.style.textAlign = btn.dataset.align === 'left' ? '' : btn.dataset.align;
    markDirty();
  });
});
// Clicking anywhere outside the editor/toolbar closes it (a plain click,
// with no selection, doesn't fire selectionchange with a collapsed range
// reliably on every browser).
document.addEventListener('mousedown', (e) => {
  if (!selToolbar.contains(e.target) && !editor.contains(e.target)) hideSelToolbar();
});

// ── Inline images — uploaded, dropped in at the cursor, movable only up/
// down among the surrounding paragraphs via the hover controls. ───────────
function wireImageBlock(block) {
  block.querySelector('[data-dir="up"]').addEventListener('click', () => {
    const prev = block.previousElementSibling;
    if (prev) editor.insertBefore(block, prev);
    markDirty();
  });
  block.querySelector('[data-dir="down"]').addEventListener('click', () => {
    const next = block.nextElementSibling;
    if (next) editor.insertBefore(next, block);
    markDirty();
  });
  block.querySelector('[data-dir="remove"]').addEventListener('click', () => {
    if (confirm('Remove this image?')) { block.remove(); markDirty(); }
  });
}
function buildImageBlock(url) {
  const block = document.createElement('div');
  block.className = 'ce-img-block';
  block.contentEditable = 'false';
  block.innerHTML = `
    <img src="${url}" alt="" />
    <div class="ce-img-controls">
      <button type="button" data-dir="up" title="Move up">▲</button>
      <button type="button" data-dir="down" title="Move down">▼</button>
      <button type="button" data-dir="remove" title="Remove">✕</button>
    </div>
  `;
  wireImageBlock(block);
  return block;
}
function insertImageBlock(url) {
  const block = buildImageBlock(url);
  const sel = window.getSelection();
  let anchorBlock = null;
  if (sel.rangeCount && editor.contains(sel.anchorNode)) {
    let node = sel.getRangeAt(0).commonAncestorContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentElement;
    anchorBlock = node && node.closest && node.parentElement === editor ? node : (node && node.closest('p, div'));
    if (anchorBlock && anchorBlock.parentElement !== editor) anchorBlock = null;
  }
  if (anchorBlock) editor.insertBefore(block, anchorBlock.nextSibling);
  else editor.appendChild(block);
  markDirty();
  updateStatusLine();
}
document.getElementById('ce-insert-image-btn').addEventListener('click', () => {
  document.getElementById('ce-image-file-input').click();
});
document.getElementById('ce-image-file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const fd = new FormData();
  fd.append('image', file);
  try {
    const res = await fetch(`${API}/moderator/chapter-image`, { method: 'POST', headers: authHeaders(), body: fd });
    const data = await res.json();
    if (data.url) insertImageBlock(data.url);
    else alert('Image upload failed. Please try again.');
  } catch {
    alert('Image upload failed. Please try again.');
  }
});

document.getElementById('ce-publish-btn').addEventListener('click', async () => {
  const title = document.getElementById('ce-title-input').value.trim();
  const body = editor.innerHTML;
  if (!title) { alert('Chapter title is required.'); return; }

  const btn = document.getElementById('ce-publish-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch(`${API}/moderator/chapters/${CHAPTER_ID}/body`, {
      method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body }),
    });
    if (!res.ok) throw new Error('save failed');
    // "Publish Changes" also flips a draft to published — writing is done,
    // this is the moment it becomes visible to readers.
    if (currentChapter && currentChapter.status === 'draft') {
      await fetch(`${API}/moderator/chapters/${CHAPTER_ID}/status`, {
        method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'published' }),
      });
      currentChapter.status = 'published';
    }
    dirty = false;
    updateStatusLine();
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = 'Publish Changes'; btn.disabled = true; }, 1500);
  } catch {
    alert('Something went wrong saving. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Publish Changes';
  }
});

window.addEventListener('beforeunload', (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

(async () => {
  if (!CHAPTER_ID) { window.location.href = `${STORY_BASE}/edit#chapters`; return; }

  const [siteRes, chapterRes] = await Promise.all([
    fetch(`${API}/moderator/site`, { headers: authHeaders() }).catch(() => null),
    fetch(`${API}/moderator/chapters/${CHAPTER_ID}`, { headers: authHeaders() }),
  ]);
  if (!chapterRes || !chapterRes.ok) {
    document.getElementById('ce-loading').textContent = "Couldn't load this chapter.";
    return;
  }
  const { chapter } = await chapterRes.json();
  currentChapter = chapter;

  if (siteRes && siteRes.ok) {
    const { site } = await siteRes.json();
    document.title = `Editing: ${chapter.title || 'Chapter'} ✦ ${site.site_title || 'Fanpages'}`;
    document.getElementById('ce-story-title').textContent = site.site_title || 'Untitled Story';
    document.getElementById('ce-story-cover').src = site.cover_url || '/images/characters/noreference.png';
  }

  document.getElementById('ce-title-input').value = chapter.title || '';
  // Old chapters made before this editor existed have no HTML body — an
  // empty <p> gives the contenteditable a real first line to click into
  // instead of an empty div with no cursor target.
  editor.innerHTML = chapter.body && chapter.body.trim() ? chapter.body : '<p><br></p>';
  editor.querySelectorAll('.ce-img-block').forEach(wireImageBlock);
  updateStatusLine();

  document.getElementById('ce-loading').hidden = true;
  document.getElementById('ce-editor-toolbar').hidden = false;
  document.getElementById('ce-page').hidden = false;
})();
</script>

</body>
</html>
