<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapter Editor ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; background: #0d0d0d; color: #f0f0f0;
      font-family: 'Georgia', 'Lato', serif; min-height: 100vh;
    }
    [hidden] { display: none !important; }

    /* ── Top bar — Wattpad-style: back arrow, breadcrumb + chapter title,
       Publish/Cancel on the right, all pinned while the body scrolls. ── */
    .ce-topbar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 1rem;
      background: #141414; border-bottom: 1px solid rgba(255,255,255,0.1);
      padding: 0.75rem 1.5rem;
    }
    .ce-back-btn {
      background: none; border: none; color: #aaa; font-size: 1.3rem; cursor: pointer;
      padding: 0.2rem 0.4rem; line-height: 1; flex-shrink: 0;
    }
    .ce-back-btn:hover { color: #fff; }
    .ce-topbar-titles { flex: 1; min-width: 0; }
    .ce-breadcrumb {
      display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; color: #888;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 0.15rem;
    }
    .ce-breadcrumb-cover { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
    .ce-title-input {
      width: 100%; background: none; border: none; color: #f0f0f0;
      font-family: 'Georgia', serif; font-size: 1.15rem; font-weight: 700;
      padding: 0.15rem 0; outline: none;
    }
    .ce-title-input::placeholder { color: #666; }
    .ce-topbar-actions { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
    .ce-status-pill {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
      padding: 0.25em 0.7em; border-radius: 12px;
    }
    .ce-status-pill--draft { background: rgba(217,168,78,0.15); color: #d9a84e; border: 1px solid rgba(217,168,78,0.35); }
    .ce-status-pill--published { background: rgba(127,217,154,0.12); color: #7fd99a; border: 1px solid rgba(127,217,154,0.3); }
    .ce-btn {
      font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700;
      padding: 0.5em 1.1em; border-radius: 20px; cursor: pointer; border: none;
    }
    .ce-btn--cancel { background: none; border: 1px solid rgba(255,255,255,0.25); color: #ccc; }
    .ce-btn--cancel:hover { border-color: rgba(255,255,255,0.5); color: #fff; }
    .ce-btn--publish { background: #f0c060; color: #1a1a1a; }
    .ce-btn--publish:hover { background: #f5cd77; }
    .ce-btn--publish:disabled { opacity: 0.5; cursor: default; }

    /* ── Writing surface — plain, centered, generous line-height. Not a
       rich-text toolbar yet on purpose (this is the "start simple, revise
       soon" pass); a plain textarea keeps the actual writing experience
       closest to Wattpad's while the fancier stuff gets built later. ── */
    .ce-page { max-width: 760px; margin: 0 auto; padding: 3rem 1.5rem 8rem; }
    .ce-body-textarea {
      width: 100%; min-height: 60vh; background: none; border: none; color: #e8e8e8;
      font-family: 'Georgia', serif; font-size: 1.15rem; line-height: 1.9;
      resize: vertical; outline: none;
    }
    .ce-body-textarea::placeholder { color: #555; }
    .ce-footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 15;
      display: flex; justify-content: center; gap: 1.5rem;
      background: rgba(20,20,20,0.9); backdrop-filter: blur(6px);
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 0.6rem 1rem; font-size: 0.8rem; color: #888;
    }
    .ce-loading { text-align: center; padding: 4rem 0; color: #888; }
  </style>
</head>
<body>

<div class="ce-topbar">
  <button class="ce-back-btn" id="ce-back-btn" type="button" title="Back to Chapters">←</button>
  <div class="ce-topbar-titles">
    <div class="ce-breadcrumb">
      <img class="ce-breadcrumb-cover" id="ce-story-cover" alt="" />
      <span id="ce-story-title">Loading…</span>
    </div>
    <input class="ce-title-input" id="ce-title-input" placeholder="Chapter title…" maxlength="120" />
  </div>
  <div class="ce-topbar-actions">
    <span class="ce-status-pill" id="ce-status-pill" hidden></span>
    <button class="ce-btn ce-btn--cancel" id="ce-cancel-btn" type="button">Cancel</button>
    <button class="ce-btn ce-btn--publish" id="ce-publish-btn" type="button" disabled>Publish Changes</button>
  </div>
</div>

<div class="ce-page" id="ce-page" hidden>
  <textarea class="ce-body-textarea" id="ce-body-textarea" placeholder="Start writing your chapter here…"></textarea>
</div>
<p class="ce-loading" id="ce-loading">Loading…</p>

<div class="ce-footer-bar">
  <span id="ce-word-count">0 words</span>
</div>

<script>
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const SLUG = PATH_PARTS.slice(1, 3).join('/');
const STORY_BASE = '/' + PATH_PARTS.slice(0, 3).join('/');
const CHAPTER_ID = new URLSearchParams(window.location.search).get('id');
const API = '/api';

const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
if (!token) window.location.href = `/fanpages/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`;
const authHeaders = () => ({ Authorization: `Bearer ${token}`, 'X-Story-Path': SLUG });

let currentChapter = null;
let dirty = false;

function setStatusPill(status) {
  const pill = document.getElementById('ce-status-pill');
  pill.hidden = false;
  pill.textContent = status === 'draft' ? 'Draft' : 'Published';
  pill.className = 'ce-status-pill ' + (status === 'draft' ? 'ce-status-pill--draft' : 'ce-status-pill--published');
}
function updateWordCount() {
  const text = document.getElementById('ce-body-textarea').value.trim();
  const count = text ? text.split(/\s+/).length : 0;
  document.getElementById('ce-word-count').textContent = `${count} word${count === 1 ? '' : 's'}`;
}
function markDirty() {
  dirty = true;
  document.getElementById('ce-publish-btn').disabled = false;
}

document.getElementById('ce-back-btn').addEventListener('click', () => {
  window.location.href = `${STORY_BASE}/edit#chapters`;
});
document.getElementById('ce-cancel-btn').addEventListener('click', () => {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  window.location.href = `${STORY_BASE}/edit#chapters`;
});
document.getElementById('ce-title-input').addEventListener('input', () => { markDirty(); updateWordCount(); });
document.getElementById('ce-body-textarea').addEventListener('input', () => { markDirty(); updateWordCount(); });

document.getElementById('ce-publish-btn').addEventListener('click', async () => {
  const title = document.getElementById('ce-title-input').value.trim();
  const body = document.getElementById('ce-body-textarea').value;
  if (!title) { alert('Chapter title is required.'); return; }

  const btn = document.getElementById('ce-publish-btn');
  btn.disabled = true;
  btn.textContent = 'Saving…';
  try {
    const res = await fetch(`${API}/moderator/chapters/${CHAPTER_ID}/body`, {
      method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body }),
    });
    if (!res.ok) throw new Error('save failed');
    // "Publish Changes" also flips a draft to published — writing is done,
    // this is the moment it becomes visible to readers.
    if (currentChapter && currentChapter.status === 'draft') {
      await fetch(`${API}/moderator/chapters/${CHAPTER_ID}/status`, {
        method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: 'published' }),
      });
      currentChapter.status = 'published';
    }
    dirty = false;
    setStatusPill(currentChapter.status);
    btn.textContent = 'Saved ✓';
    setTimeout(() => { btn.textContent = 'Publish Changes'; }, 1500);
  } catch {
    alert('Something went wrong saving. Please try again.');
    btn.disabled = false;
    btn.textContent = 'Publish Changes';
  }
});

// Confirm before navigating away with unsaved changes via the browser
// itself (closing the tab, typing a new URL) — the in-page Back/Cancel
// buttons already handle their own confirm.
window.addEventListener('beforeunload', (e) => {
  if (!dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

(async () => {
  if (!CHAPTER_ID) { window.location.href = `${STORY_BASE}/edit#chapters`; return; }

  const [siteRes, chapterRes] = await Promise.all([
    fetch(`${API}/moderator/site`, { headers: authHeaders() }).catch(() => null),
    fetch(`${API}/moderator/chapters/${CHAPTER_ID}`, { headers: authHeaders() }),
  ]);
  if (!chapterRes || !chapterRes.ok) {
    document.getElementById('ce-loading').textContent = "Couldn't load this chapter.";
    return;
  }
  const { chapter } = await chapterRes.json();
  currentChapter = chapter;

  if (siteRes && siteRes.ok) {
    const { site } = await siteRes.json();
    document.title = `Editing: ${chapter.title || 'Chapter'} ✦ ${site.site_title || 'Fanpages'}`;
    document.getElementById('ce-story-title').textContent = site.site_title || 'Untitled Story';
    const coverImg = document.getElementById('ce-story-cover');
    coverImg.src = site.cover_url || '/images/characters/noreference.png';
  }

  document.getElementById('ce-title-input').value = chapter.title || '';
  document.getElementById('ce-body-textarea').value = chapter.body || '';
  setStatusPill(chapter.status);
  updateWordCount();

  document.getElementById('ce-loading').hidden = true;
  document.getElementById('ce-page').hidden = false;
})();
</script>

</body>
</html>
