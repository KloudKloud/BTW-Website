<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Creator Panel ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
</head>
<body class="mod-theme">

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div id="gate" class="mod-placeholder-wrap" hidden>
  <div>
    <h1 class="agegate-title" id="gate-title">Checking access…</h1>
    <p class="agegate-body" id="gate-text"></p>
  </div>
</div>

<div id="panel-app" class="mod-panel-wrap" hidden>

  <h1 class="mod-panel-title">Creator Panel</h1>
  <p class="mod-panel-sub">Edit everything on your <a href="#" id="story-link" style="color:#4d6f99;">story</a> page here.</p>

  <div class="mod-panel-tabs">
    <button class="mod-panel-tab active" data-tab="site">Site Info</button>
    <button class="mod-panel-tab" data-tab="chapters">Chapters</button>
    <button class="mod-panel-tab" data-tab="characters">Characters</button>
    <button class="mod-panel-tab" data-tab="gallery">Gallery</button>
  </div>

  <!-- ── Site Info ─────────────────────────────────────────────────────── -->
  <section class="mod-panel-section active" id="tab-site">
    <p class="mod-panel-msg" id="site-msg"></p>

    <div class="mod-field">
      <label for="site-title-input">Page Title</label>
      <input class="mod-input" id="site-title-input" maxlength="60" />
    </div>
    <div class="mod-field">
      <label for="site-synopsis-input">About (synopsis)</label>
      <textarea class="mod-textarea" id="site-synopsis-input"></textarea>
    </div>
    <div class="mod-field">
      <label for="site-bio-input" id="site-bio-label">Meet the Author (bio)</label>
      <textarea class="mod-textarea" id="site-bio-input"></textarea>
    </div>

    <div class="mod-field">
      <label>Find Me Links</label>
      <div id="site-links-rows"></div>
      <button class="mod-btn mod-btn--small" type="button" id="add-link-row">+ Add Link</button>
    </div>

    <button class="mod-btn" id="save-site-btn">Save Site Info</button>
  </section>

  <!-- ── Chapters ──────────────────────────────────────────────────────── -->
  <section class="mod-panel-section" id="tab-chapters">
    <p class="mod-panel-msg" id="chapters-msg"></p>
    <ul class="mod-panel-list" id="chapters-panel-list"></ul>

    <div class="mod-field">
      <label for="chapter-title-input">New Chapter Title</label>
      <input class="mod-input" id="chapter-title-input" placeholder="e.g. Chapter One" />
    </div>
    <div class="mod-field">
      <label for="chapter-url-input">Link (optional for now)</label>
      <input class="mod-input" id="chapter-url-input" placeholder="https://…" />
    </div>
    <button class="mod-btn" id="add-chapter-btn">Add Chapter</button>
  </section>

  <!-- ── Characters ────────────────────────────────────────────────────── -->
  <section class="mod-panel-section" id="tab-characters">
    <p class="mod-panel-msg" id="characters-msg"></p>
    <ul class="mod-panel-list" id="characters-panel-list"></ul>

    <h3 style="font-family:'Cinzel',serif;color:#1f1f1f;margin:1.5rem 0 1rem;" id="character-form-heading">New Character</h3>
    <input type="hidden" id="character-edit-id" />

    <div class="mod-field">
      <label for="char-name-input">Name</label>
      <input class="mod-input" id="char-name-input" maxlength="40" />
    </div>
    <div class="mod-field">
      <label for="char-ref-input">Reference Image URL</label>
      <input class="mod-input" id="char-ref-input" placeholder="/images/moderators/…" />
    </div>
    <div class="mod-field">
      <label for="char-desc-input">Description</label>
      <textarea class="mod-textarea" id="char-desc-input"></textarea>
    </div>

    <div class="mod-field">
      <label>Stats</label>
      <div id="char-stats-rows"></div>
      <button class="mod-btn mod-btn--small" type="button" id="add-stat-row">+ Add Stat</button>
    </div>

    <div class="mod-field">
      <label for="char-facts-input">Fun Facts (one per line)</label>
      <textarea class="mod-textarea" id="char-facts-input"></textarea>
    </div>
    <div class="mod-field">
      <label for="char-lore-input">Lore (one per line, spoiler-gated on the page)</label>
      <textarea class="mod-textarea" id="char-lore-input"></textarea>
    </div>

    <button class="mod-btn" id="save-character-btn">Save Character</button>
    <button class="mod-btn mod-btn--small" id="cancel-character-btn" type="button">New / Clear</button>
  </section>

  <!-- ── Gallery ───────────────────────────────────────────────────────── -->
  <section class="mod-panel-section" id="tab-gallery">
    <p class="mod-panel-msg" id="gallery-msg"></p>

    <div class="mod-field">
      <label for="gallery-category-input">Category</label>
      <select class="mod-select" id="gallery-category-input">
        <option value="sfw">General</option>
        <option value="mature">Mature</option>
        <option value="explicit">Explicit</option>
      </select>
    </div>
    <div class="mod-field">
      <label for="gallery-title-input">Title (optional)</label>
      <input class="mod-input" id="gallery-title-input" />
    </div>
    <div class="mod-field">
      <label for="gallery-file-input">Image</label>
      <input class="mod-input" type="file" id="gallery-file-input" accept="image/png,image/jpeg,image/webp,image/gif" />
    </div>
    <button class="mod-btn" id="upload-gallery-btn">Upload</button>

    <h3 style="font-family:'Cinzel',serif;color:#1f1f1f;margin:1.5rem 0 0.75rem;">General</h3>
    <div class="mod-panel-thumb-grid" id="gallery-sfw-grid"></div>

    <h3 style="font-family:'Cinzel',serif;color:#1f1f1f;margin:1.5rem 0 0.75rem;">Mature</h3>
    <div class="mod-panel-thumb-grid" id="gallery-mature-grid"></div>

    <h3 style="font-family:'Cinzel',serif;color:#1f1f1f;margin:1.5rem 0 0.75rem;">Explicit</h3>
    <div class="mod-panel-thumb-grid" id="gallery-explicit-grid"></div>
  </section>

</div>

<script>
const API = '/api/moderator';
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const OFFSET = window.FP_BASE ? 1 : 0;
const SLUG = PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');
const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => ({ Authorization: `Bearer ${token}`, 'X-Story-Path': SLUG });

function showGate(title, text) {
  document.getElementById('gate-title').textContent = title;
  document.getElementById('gate-text').textContent = text;
  document.getElementById('gate').hidden = false;
  document.getElementById('panel-app').hidden = true;
}

let ME = null;

async function boot() {
  if (!token) return showGate('Log in required', 'You need to log in with your moderator account to access this panel.');
  try {
    const res = await fetch('/api/auth/me', { headers: authHeaders() });
    if (!res.ok) throw new Error();
    ME = (await res.json()).user;
  } catch { return showGate('Log in required', 'You need to log in with your moderator account to access this panel.'); }

  if (!ME.is_moderator) return showGate('Access denied', 'Your account does not have moderator access.');

  document.getElementById('panel-app').hidden = false;
  initTabs();
  loadSite();
  loadChapters();
  loadCharacters();
  loadGallery();
}

function initTabs() {
  document.querySelectorAll('.mod-panel-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mod-panel-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.mod-panel-section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
}

function setMsg(id, text, isError) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'mod-panel-msg ' + (isError ? 'mod-panel-msg--error' : 'mod-panel-msg--success');
  if (text) setTimeout(() => { el.textContent = ''; }, 4000);
}

// ── Site Info ────────────────────────────────────────────────────────────────
function addLinkRow(label, url) {
  const wrap = document.createElement('div');
  wrap.className = 'mod-stat-row';
  wrap.innerHTML = `
    <input class="mod-input link-label" placeholder="Label (e.g. Twitter)" value="${label || ''}" />
    <input class="mod-input link-url" placeholder="https://…" value="${url || ''}" />
    <button class="mod-btn mod-btn--small mod-btn--danger" type="button">✕</button>`;
  wrap.querySelector('button').addEventListener('click', () => wrap.remove());
  document.getElementById('site-links-rows').appendChild(wrap);
}
document.getElementById('add-link-row').addEventListener('click', () => addLinkRow('', ''));

async function loadSite() {
  const res = await fetch(`${API}/site`, { headers: authHeaders() });
  if (!res.ok) return;
  const { site } = await res.json();
  document.title = `Creator Panel ✦ ${site.site_title || 'Fanpages'}`;
  document.getElementById('story-link').textContent = site.site_title || 'story';
  document.getElementById('story-link').href = window.fpUrl(`/${site.story_path || site.slug}`);
  document.getElementById('site-bio-label').textContent = `Meet ${(ME && ME.display_name) || 'the Author'} (bio)`;
  document.getElementById('site-title-input').value    = site.site_title || '';
  document.getElementById('site-synopsis-input').value = site.synopsis   || '';
  document.getElementById('site-bio-input').value       = site.bio       || '';
  document.getElementById('site-links-rows').innerHTML = '';
  (site.links || []).forEach(l => addLinkRow(l.label, l.url));
}

document.getElementById('save-site-btn').addEventListener('click', async () => {
  const links = Array.from(document.querySelectorAll('#site-links-rows .mod-stat-row')).map(row => ({
    label: row.querySelector('.link-label').value.trim(),
    url:   row.querySelector('.link-url').value.trim(),
  })).filter(l => l.label && l.url);

  const body = {
    site_title: document.getElementById('site-title-input').value.trim(),
    synopsis:   document.getElementById('site-synopsis-input').value.trim(),
    bio:        document.getElementById('site-bio-input').value.trim(),
    links,
  };
  const res = await fetch(`${API}/site`, { method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  setMsg('site-msg', res.ok ? 'Saved!' : 'Something went wrong.', !res.ok);
  if (res.ok) loadSite();
});

// ── Chapters ─────────────────────────────────────────────────────────────────
async function loadChapters() {
  const res = await fetch(`${API}/chapters`, { headers: authHeaders() });
  if (!res.ok) return;
  const { chapters } = await res.json();
  const list = document.getElementById('chapters-panel-list');
  list.innerHTML = '';
  if (!chapters.length) { list.innerHTML = '<li class="mod-panel-list-item"><span>No chapters yet.</span></li>'; return; }
  chapters.forEach(ch => {
    const li = document.createElement('li');
    li.className = 'mod-panel-list-item';
    li.innerHTML = `<span>${ch.title}</span><div class="mod-panel-list-actions"><button class="mod-btn mod-btn--small mod-btn--danger">Delete</button></div>`;
    li.querySelector('button').addEventListener('click', async () => {
      await fetch(`${API}/chapters/${ch.id}`, { method: 'DELETE', headers: authHeaders() });
      loadChapters();
    });
    list.appendChild(li);
  });
}

document.getElementById('add-chapter-btn').addEventListener('click', async () => {
  const title = document.getElementById('chapter-title-input').value.trim();
  const url   = document.getElementById('chapter-url-input').value.trim();
  if (!title) return setMsg('chapters-msg', 'Title is required.', true);
  const res = await fetch(`${API}/chapters`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify({ title, url }) });
  if (res.ok) {
    document.getElementById('chapter-title-input').value = '';
    document.getElementById('chapter-url-input').value = '';
    setMsg('chapters-msg', 'Added!', false);
    loadChapters();
  } else setMsg('chapters-msg', 'Something went wrong.', true);
});

// ── Characters ───────────────────────────────────────────────────────────────
function addStatRow(label, value) {
  const wrap = document.createElement('div');
  wrap.className = 'mod-stat-row';
  wrap.innerHTML = `
    <input class="mod-input stat-label" placeholder="Label (e.g. Age)" value="${label || ''}" />
    <input class="mod-input stat-value" placeholder="Value" value="${value || ''}" />
    <button class="mod-btn mod-btn--small mod-btn--danger" type="button">✕</button>`;
  wrap.querySelector('button').addEventListener('click', () => wrap.remove());
  document.getElementById('char-stats-rows').appendChild(wrap);
}
document.getElementById('add-stat-row').addEventListener('click', () => addStatRow('', ''));

function resetCharacterForm() {
  document.getElementById('character-edit-id').value = '';
  document.getElementById('character-form-heading').textContent = 'New Character';
  document.getElementById('char-name-input').value = '';
  document.getElementById('char-ref-input').value = '';
  document.getElementById('char-desc-input').value = '';
  document.getElementById('char-facts-input').value = '';
  document.getElementById('char-lore-input').value = '';
  document.getElementById('char-stats-rows').innerHTML = '';
}
document.getElementById('cancel-character-btn').addEventListener('click', resetCharacterForm);

async function loadCharacters() {
  const res = await fetch(`${API}/characters`, { headers: authHeaders() });
  if (!res.ok) return;
  const { characters } = await res.json();
  const list = document.getElementById('characters-panel-list');
  list.innerHTML = '';
  if (!characters.length) { list.innerHTML = '<li class="mod-panel-list-item"><span>No characters yet.</span></li>'; return; }
  characters.forEach(c => {
    const li = document.createElement('li');
    li.className = 'mod-panel-list-item';
    li.innerHTML = `<span>${c.name}</span><div class="mod-panel-list-actions">
      <button class="mod-btn mod-btn--small" data-act="edit">Edit</button>
      <button class="mod-btn mod-btn--small mod-btn--danger" data-act="delete">Delete</button>
    </div>`;
    li.querySelector('[data-act="edit"]').addEventListener('click', () => {
      document.getElementById('character-edit-id').value = c.id;
      document.getElementById('character-form-heading').textContent = `Editing: ${c.name}`;
      document.getElementById('char-name-input').value = c.name || '';
      document.getElementById('char-ref-input').value = c.ref_image || '';
      document.getElementById('char-desc-input').value = c.description || '';
      document.getElementById('char-facts-input').value = (c.facts || []).join('\n');
      document.getElementById('char-lore-input').value = (c.lore || []).join('\n');
      document.getElementById('char-stats-rows').innerHTML = '';
      Object.entries(c.stats || {}).forEach(([k, v]) => addStatRow(k, v));
      window.scrollTo({ top: document.getElementById('tab-characters').offsetTop, behavior: 'smooth' });
    });
    li.querySelector('[data-act="delete"]').addEventListener('click', async () => {
      await fetch(`${API}/characters/${c.id}`, { method: 'DELETE', headers: authHeaders() });
      loadCharacters();
    });
    list.appendChild(li);
  });
}

document.getElementById('save-character-btn').addEventListener('click', async () => {
  const name = document.getElementById('char-name-input').value.trim();
  if (!name) return setMsg('characters-msg', 'Name is required.', true);

  const stats = {};
  document.querySelectorAll('#char-stats-rows .mod-stat-row').forEach(row => {
    const k = row.querySelector('.stat-label').value.trim();
    const v = row.querySelector('.stat-value').value.trim();
    if (k) stats[k] = v;
  });

  const body = {
    name,
    ref_image: document.getElementById('char-ref-input').value.trim(),
    description: document.getElementById('char-desc-input').value.trim(),
    stats,
    facts: document.getElementById('char-facts-input').value.split('\n').map(s => s.trim()).filter(Boolean),
    lore: document.getElementById('char-lore-input').value.split('\n').map(s => s.trim()).filter(Boolean),
  };

  const editId = document.getElementById('character-edit-id').value;
  const res = editId
    ? await fetch(`${API}/characters/${editId}`, { method: 'PUT', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    : await fetch(`${API}/characters`, { method: 'POST', headers: { ...authHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  if (res.ok) {
    setMsg('characters-msg', 'Saved!', false);
    resetCharacterForm();
    loadCharacters();
  } else setMsg('characters-msg', 'Something went wrong.', true);
});

// ── Gallery ──────────────────────────────────────────────────────────────────
async function loadGallery() {
  const res = await fetch(`${API}/gallery`, { headers: authHeaders() });
  if (!res.ok) return;
  const { gallery } = await res.json();
  const sfwGrid      = document.getElementById('gallery-sfw-grid');
  const matureGrid   = document.getElementById('gallery-mature-grid');
  const explicitGrid = document.getElementById('gallery-explicit-grid');
  sfwGrid.innerHTML = ''; matureGrid.innerHTML = ''; explicitGrid.innerHTML = '';
  const grids = { sfw: sfwGrid, mature: matureGrid, explicit: explicitGrid };
  gallery.forEach(g => {
    const div = document.createElement('div');
    div.className = 'mod-panel-thumb';
    div.innerHTML = `<img src="${g.image_url}" alt="${g.title || ''}" /><button>✕</button>`;
    div.querySelector('button').addEventListener('click', async () => {
      await fetch(`${API}/gallery/${g.id}`, { method: 'DELETE', headers: authHeaders() });
      loadGallery();
    });
    (grids[g.category] || sfwGrid).appendChild(div);
  });
}

document.getElementById('upload-gallery-btn').addEventListener('click', async () => {
  const fileInput = document.getElementById('gallery-file-input');
  if (!fileInput.files.length) return setMsg('gallery-msg', 'Choose an image first.', true);
  const fd = new FormData();
  fd.append('image', fileInput.files[0]);
  fd.append('category', document.getElementById('gallery-category-input').value);
  fd.append('title', document.getElementById('gallery-title-input').value.trim());
  const res = await fetch(`${API}/gallery`, { method: 'POST', headers: authHeaders(), body: fd });
  if (res.ok) {
    fileInput.value = '';
    document.getElementById('gallery-title-input').value = '';
    setMsg('gallery-msg', 'Uploaded!', false);
    loadGallery();
  } else setMsg('gallery-msg', 'Upload failed.', true);
});

boot();
</script>

</body>
</html>
