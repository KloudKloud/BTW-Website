  <style>
    /* This page always forces the same "Browse > Posts" wallpaper
       (PotentialBoxBackground, scrolls *with* the page) instead of
       whatever theme the story picked for its Home/Chapters/Characters
       pages -- overrides the shared .mod-page-bg-img's own position:fixed
       just for this page. No blur -- same reasoning as the shared
       .mod-page-bg-img fix: a blurred element fades to nothing right at
       its own top/bottom edge, and that edge landing anywhere near the tab
       row read as a distinct hazy box breaking the background instead of a
       clean backdrop. Overlay opacity raised to compensate for the lost blur. */
    #page-bg-img {
      position: absolute; top: 0; left: 0; right: 0; bottom: auto;
      width: 100%; height: 100vh; object-fit: cover;
      /* The shared .mod-page-bg-img rule (fanpages.css) sets
         filter: blur(9px) brightness(0.95) -- overriding position/width/
         height above via this ID selector does NOT touch that filter
         property, since CSS cascades per-property, not per-rule. The "no
         blur" comment above describes intent that was never actually
         backed by a real override -- the wallpaper never actually stopped
         being blurred, which is exactly the hazy rectangle behind the tab
         row it was trying to fix. Re-declaring filter here (brightness
         only, no blur) is the real fix. */
      filter: brightness(0.95);
    }
    #page-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.68); }
    /* .wiki-page-title-block's margin-top:4.5rem (fanpages.css) collapses
       straight through .mod-page-bg-wrap -- it has no border/padding of
       its own to block collapse -- which shifted the wrap's rendered top
       edge (and #page-bg-img with it, anchored to the wrap's padding box)
       down by that same 4.5rem, leaving a bare gap between the banner and
       where the wallpaper actually starts. A trivial padding gives the
       wrap a padding box of its own, which blocks the collapse. */
    #page-bg-wrap { padding-top: 1px; }
  </style>
</head>

<script src="/fanpages/fanpages-site.js"></script>
<script>
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const OFFSET = window.FP_BASE ? 1 : 0;
const SLUG = PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');
const STORY_BASE = (window.FP_BASE || '') + '/' + PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');

document.getElementById('tab-home').href = STORY_BASE;
document.getElementById('tab-chapters').href = STORY_BASE + '/chapters';
document.getElementById('tab-characters').href = STORY_BASE + '/characters';
document.getElementById('tab-gallery').href = STORY_BASE + '/gallery';

document.getElementById('gallery-empty-editor-btn').addEventListener('click', () => {
  window.location.href = `${STORY_BASE}/edit#gallery`;
});

let GALLERY_ITEMS = [];
let IS_SELF = false;
let STORY_TITLE = 'this story';
let STORY_COVER_URL = '';
let STORY_AUTHOR_USERNAME = '';
let STORY_AUTHOR_DISPLAY = '';

const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => ({ Authorization: `Bearer ${token}`, 'X-Story-Path': SLUG });
const grid = document.getElementById('gallery-grid');

// ── Safe rich text: escape everything, then *italic*/**bold**, then the
// [Artist Name]<url> credit syntax as a real link. ──────────────────────────
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function richText(s) {
  let out = escapeHtml(s || '');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return out;
}
function renderGalleryText(s) {
  if (!s) return '<span style="color:#888;">No description provided</span>';
  const tokens = [];
  const working = String(s).replace(/\[([^\]]+)\]<([^>]+)>/g, (m, label, url) => {
    const safeUrl = /^https?:\/\//i.test(url.trim()) ? url.trim() : '#';
    tokens.push({ label, url: safeUrl });
    return ` TOKEN${tokens.length - 1} `;
  });
  let out = richText(working);
  tokens.forEach((t, i) => {
    out = out.replace(` TOKEN${i} `, `<a href="${t.url}" target="_blank" rel="noopener" style="color:#7fa8d9;">${escapeHtml(t.label)}</a>`);
  });
  return out;
}

function renderTiles(items, emptyMsg) {
  if (!items.length) {
    grid.innerHTML = `<p class="gallery-empty-msg">${emptyMsg}</p>`;
    return;
  }
  grid.innerHTML = '';
  items.forEach(g => {
    const a = document.createElement('a');
    a.className = 'gallery-tile';
    a.href = '#';
    // A real baked tile crop (preview_image_url) wins when the post has
    // one -- already the right shape, no position math needed. Falls back
    // to the old pan-position-on-the-full-image approach for older posts.
    a.innerHTML = g.preview_image_url
      ? `<img src="${g.preview_image_url}" alt="${g.title || 'Gallery image'}" loading="lazy" draggable="false" />`
      : `<img src="${g.image_url}" alt="${g.title || 'Gallery image'}" loading="lazy" draggable="false" style="object-position: ${g.position_x != null ? g.position_x : 50}% ${g.position_y != null ? g.position_y : 50}%;" />`;
    a.addEventListener('click', (e) => { e.preventDefault(); openPostDetail(g, true); });
    grid.appendChild(a);
  });
  syncBgHeight();
  grid.querySelectorAll('img').forEach(img => img.addEventListener('load', syncBgHeight, { once: true }));
}

// Every rating shows together now -- SFW/Mature/Explicit are no longer
// split across tabs. A viewer without NSFW access simply never receives
// the Mature/Explicit rows at all (filtered server-side), so there's
// nothing left to gate client-side either.
function renderGallery() {
  renderTiles(GALLERY_ITEMS, 'No artwork posted yet — check back soon.');
}

// ── Post detail "page" ──────────────────────────────────────────────────
// Not a modal — swaps the grid out for a big image + title + description
// view (matching the main site's art-view page), with the URL updated via
// pushState so it feels like a real page (back button, deep-linkable).
let currentDetailItem = null;

function ratingLabelFor(cat) {
  if (cat === 'mature') return 'Mature';
  if (cat === 'explicit') return 'Explicit';
  return 'General';
}

// Right-hand stats box — Views/Likes/Comments/Rating/Uploader plus the
// freeform tag pills (separate concept from "Characters/Stories Featured",
// which stays inside the description box). Tag pills reuse the Submissions
// search machinery so clicking one behaves exactly like a story tag pill.
function renderStatsBox(item) {
  const quickstats = document.getElementById('gallery-detail-quickstats');
  quickstats.innerHTML = `
    <div class="art-view-quickstat"><span class="art-view-quickstat-val">👁 ${item.view_count || 0}</span><span class="art-view-quickstat-label">Views</span></div>
    <div class="art-view-quickstat"><span class="art-view-quickstat-val">❤️ ${item.like_count || 0}</span><span class="art-view-quickstat-label">Likes</span></div>
    <div class="art-view-quickstat"><span class="art-view-quickstat-val">💬 ${item.comment_count || 0}</span><span class="art-view-quickstat-label">Comments</span></div>
  `;
  const rows = document.getElementById('gallery-detail-stats-rows');
  const uploadedDate = item.created_at
    ? new Date(item.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
    : '';
  rows.innerHTML = `
    <div class="art-view-stat-row"><span>Rating</span><span>${ratingLabelFor(item.category)}</span></div>
    <div class="art-view-stat-row"><span>Uploaded by</span><span><a href="${window.fpUrl(`/${encodeURIComponent(STORY_AUTHOR_USERNAME)}`)}">${escapeHtml(STORY_AUTHOR_DISPLAY)}</a></span></div>
    ${uploadedDate ? `<div class="art-view-stat-row"><span>Date Uploaded</span><span>${uploadedDate}</span></div>` : ''}
  `;

  const tagsWrap = document.getElementById('gallery-detail-stats-tags');
  const tags = Array.isArray(item.tags) ? item.tags : [];
  if (!tags.length) {
    tagsWrap.innerHTML = '<p class="art-view-stats-tags-empty">No tags yet.</p>';
    return;
  }
  tagsWrap.innerHTML = tags.map(t => `<a class="art-view-stats-tag-pill" href="${window.fpUrl(`/search?view=submissions&browse=1&q=${encodeURIComponent(t)}`)}">${escapeHtml(t)}</a>`).join('');
}

// A view only counts once a post has actually been open for 10s (not
// just refreshed/bounced off of, or clicked past mid-slideshow), and at
// most once per 5 minutes per item -- both tracked client-side.
let pendingViewTimer = null;
function bumpGalleryViewCount(id) {
  clearTimeout(pendingViewTimer);
  const cooldownKey = `btw_view_gallery_${id}`;
  pendingViewTimer = setTimeout(() => {
    const last = parseInt(localStorage.getItem(cooldownKey) || '0', 10);
    if (Date.now() - last < 5 * 60 * 1000) return;
    localStorage.setItem(cooldownKey, String(Date.now()));
    fetch(`/api/gallery/${id}/view`, { method: 'POST', headers: authHeaders() }).catch(() => {});
  }, 10000);
}

// ── Slideshow prev/next nav (mirrors the main site's art-view slideshow) ──
let navPrevItem = null;
let navNextItem = null;

function truncateLabel(s, n) { return s.length > n ? s.slice(0, n).trimEnd() + '…' : s; }

function renderDetailNav(item) {
  const siblings = GALLERY_ITEMS;
  const idx = siblings.findIndex(g => String(g.id) === String(item.id));
  navPrevItem = idx > 0 ? siblings[idx - 1] : null;
  navNextItem = idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1] : null;

  const navEl = document.getElementById('gallery-detail-nav');
  navEl.innerHTML = '';
  if (navPrevItem) {
    const a = document.createElement('a');
    a.className = 'art-nav-btn art-nav-prev';
    a.href = `${STORY_BASE}/gallery?post=${navPrevItem.id}`;
    a.innerHTML = `← <span class="art-nav-label">${escapeHtml(truncateLabel(navPrevItem.title || 'Previous', 28))}</span>`;
    a.addEventListener('click', (e) => { e.preventDefault(); openPostDetail(navPrevItem, true); });
    navEl.appendChild(a);
  }
  if (navNextItem) {
    const a = document.createElement('a');
    a.className = 'art-nav-btn art-nav-next';
    a.href = `${STORY_BASE}/gallery?post=${navNextItem.id}`;
    a.innerHTML = `<span class="art-nav-label">${escapeHtml(truncateLabel(navNextItem.title || 'Next', 28))}</span> →`;
    a.addEventListener('click', (e) => { e.preventDefault(); openPostDetail(navNextItem, true); });
    navEl.appendChild(a);
  }
}

// Swipe navigation — live drag + slide-out, same feel as the main site's gallery.
(function () {
  const page = document.getElementById('gallery-detail-view');
  let startX = 0, startY = 0, dirLock = null, busy = false, dragging = false;
  const THRESHOLD = () => window.innerWidth * 0.25;

  document.addEventListener('touchstart', (e) => {
    if (busy || page.style.display === 'none') return;
    startX = e.changedTouches[0].screenX;
    startY = e.changedTouches[0].screenY;
    dirLock = null; dragging = false;
    page.style.transition = 'none';
  }, { passive: true });

  document.addEventListener('touchmove', (e) => {
    if (busy || page.style.display === 'none') return;
    const dx = e.changedTouches[0].screenX - startX;
    const dy = e.changedTouches[0].screenY - startY;
    if (!dirLock && (Math.abs(dx) > 12 || Math.abs(dy) > 12)) {
      dirLock = Math.abs(dx) >= Math.abs(dy) * 0.8 ? 'h' : 'v';
    }
    if (dirLock === 'h') {
      e.preventDefault();
      dragging = true;
      let dampedDx = dx;
      if ((dx > 0 && !navPrevItem) || (dx < 0 && !navNextItem)) dampedDx = dx * 0.2;
      page.style.transform = `translateX(${dampedDx}px)`;
    }
  }, { passive: false });

  document.addEventListener('touchend', (e) => {
    if (busy || page.style.display === 'none') return;
    const dx = e.changedTouches[0].screenX - startX;
    if (dirLock !== 'h' || !dragging) {
      page.style.transition = '';
      page.style.transform = '';
      return;
    }
    if (Math.abs(dx) < THRESHOLD()) {
      page.style.transition = 'transform 0.22s cubic-bezier(0.4,0,0.2,1)';
      page.style.transform = '';
      setTimeout(() => { page.style.transition = ''; }, 250);
      return;
    }
    const target = dx < 0 ? navNextItem : navPrevItem;
    if (!target) {
      page.style.transition = 'transform 0.22s cubic-bezier(0.4,0,0.2,1)';
      page.style.transform = '';
      setTimeout(() => { page.style.transition = ''; }, 250);
      return;
    }
    busy = true;
    page.style.transition = 'transform 0.25s cubic-bezier(0.4,0,0.2,1)';
    page.style.transform = `translateX(${dx < 0 ? '-110vw' : '110vw'})`;
    setTimeout(() => {
      page.style.transition = '';
      page.style.transform = '';
      busy = false;
      openPostDetail(target, true);
    }, 240);
  }, { passive: true });
})();

function openPostDetail(item, pushHistory) {
  currentDetailItem = item;
  document.getElementById('gallery-detail-img').src = item.image_url;
  document.getElementById('gallery-detail-img').alt = item.title || '';
  document.getElementById('gallery-detail-title').textContent = item.title || 'No title provided';
  document.getElementById('gallery-detail-desc').innerHTML = renderGalleryText(item.description);
  renderDetailNav(item);
  updateLikeUI(item);
  updateBookmarkUI(item);
  loadGalleryTagsSection(item);
  renderStatsBox(item);
  ccInitSection('gallery', item.id);
  bumpGalleryViewCount(item.id);

  document.getElementById('gallery-grid-view').style.display = 'none';
  document.getElementById('gallery-detail-view').style.display = 'block';
  document.title = `${item.title || 'Gallery'} ✦ ${document.title.split('✦').pop().trim()}`;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const editBtn = document.getElementById('gallery-detail-edit-btn');
  if (IS_SELF) {
    editBtn.style.display = '';
    document.getElementById('gallery-detail-edit-btn-label').textContent = `✏️ Edit ${item.title || 'Untitled'}`;
    // Straight to the Gallery tab of the main Story Editor hub — editing a
    // gallery post no longer happens in place on this page at all.
    editBtn.onclick = () => { window.location.href = `${STORY_BASE}/edit#gallery`; };
  } else {
    editBtn.style.display = 'none';
  }

  if (pushHistory) history.pushState({ post: item.id }, '', `${STORY_BASE}/gallery?post=${item.id}`);
  syncBgHeight();
}

function closePostDetail(pushHistory) {
  currentDetailItem = null;
  document.getElementById('gallery-detail-view').style.display = 'none';
  document.getElementById('gallery-grid-view').style.display = '';
  if (pushHistory) history.pushState({}, '', `${STORY_BASE}/gallery`);
  syncBgHeight();
}

document.getElementById('gallery-detail-back').addEventListener('click', (e) => {
  e.preventDefault();
  closePostDetail(true);
});

// ── Gallery post likes ───────────────────────────────────────────────────
function updateLikeUI(item) {
  document.getElementById('gallery-detail-like-icon').textContent = item.liked ? '♥' : '♡';
  document.getElementById('gallery-detail-like-count').textContent = item.like_count || 0;
  document.getElementById('gallery-detail-like').classList.toggle('liked', !!item.liked);
}

document.getElementById('gallery-detail-like').addEventListener('click', async (e) => {
  if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }
  if (!currentDetailItem) return;
  const btn = e.currentTarget;
  if (btn.disabled) return; // in-flight guard — stops rapid double-clicks racing each other
  const item = currentDetailItem;
  const method = item.liked ? 'DELETE' : 'POST';
  btn.disabled = true;
  try {
    const res = await fetch(`/api/moderator/gallery/${item.id}/like`, { method, headers: authHeaders() });
    if (!res.ok) {
      if (res.status === 401) window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`);
      return;
    }
    const data = await res.json();
    item.liked = data.liked;
    item.like_count = data.like_count;
    updateLikeUI(item);
  } catch {} finally { btn.disabled = false; }
});

// ── Gallery post bookmarks ───────────────────────────────────────────────
function updateBookmarkUI(item) {
  document.getElementById('gallery-detail-bookmark').classList.toggle('bookmarked', !!item.bookmarked);
}
document.getElementById('gallery-detail-bookmark').addEventListener('click', async (e) => {
  if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }
  if (!currentDetailItem) return;
  const btn = e.currentTarget;
  if (btn.disabled) return;
  const item = currentDetailItem;
  const method = item.bookmarked ? 'DELETE' : 'POST';
  btn.disabled = true;
  try {
    const res = await fetch(`/api/moderator/gallery/${item.id}/bookmark`, { method, headers: authHeaders() });
    if (!res.ok) {
      if (res.status === 401) window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`);
      return;
    }
    const data = await res.json();
    item.bookmarked = data.bookmarked;
    updateBookmarkUI(item);
  } catch {} finally { btn.disabled = false; }
});

document.getElementById('gallery-detail-share').addEventListener('click', (e) => {
  fpShare(e.currentTarget, window.location.href);
});

// ── Characters Featured / Relevant Stories — tagged content under the
// description. NSFW character refs use the same blur-not-hide treatment as
// Character Spotlight; "Relevant Stories" only ever appears when a story is
// actually tagged, and "No tagged characters" is the only empty-state text
// (no equivalent message for stories, per design). ──────────────────────
async function loadGalleryTagsSection(item) {
  const wrap = document.getElementById('gallery-detail-tags');
  wrap.innerHTML = '<hr class="art-view-tags-hr" />';
  try {
    const res = await fetch(`/api/gallery/${item.id}/links`, { headers: authHeaders() });
    const data = await res.json();
    const chars = data.characters || [];
    const stories = data.stories || [];

    const charsBlock = document.createElement('div');
    charsBlock.innerHTML = '<p class="art-view-tags-label">Characters Featured: <img src="/images/home/decoration-2.png" alt="" /></p>';
    if (!chars.length) {
      charsBlock.innerHTML += '<p class="art-view-tags-empty">No tagged characters</p>';
    } else {
      const row = document.createElement('div');
      row.className = 'art-view-tags-row';
      chars.forEach(c => row.appendChild(galleryCharTagCard(c)));
      charsBlock.appendChild(row);
    }
    wrap.appendChild(charsBlock);

    if (stories.length) {
      const storiesBlock = document.createElement('div');
      storiesBlock.innerHTML = '<p class="art-view-tags-label">Relevant Stories <img src="/images/home/decoration-2.png" alt="" /></p>';
      const row = document.createElement('div');
      row.className = 'art-view-tags-row';
      stories.forEach(s => row.appendChild(galleryStoryTagCard(s)));
      storiesBlock.appendChild(row);
      wrap.appendChild(storiesBlock);
    }
  } catch {
    wrap.innerHTML += '<p class="art-view-tags-empty">Couldn\'t load tagged content right now.</p>';
  }
}
function galleryCharTagCard(c) {
  const a = document.createElement('a');
  a.className = 'art-view-tag-card';
  a.href = window.fpUrl(`/${c.owner_username}?char=${c.id}#characters`);
  if (c.nsfw_locked) {
    const lockMsg = token ? 'NSFW content must be enabled in Account Settings' : 'Only logged-in users can see this content';
    a.innerHTML = `
      <div class="art-view-tag-card-imgwrap">
        <img class="art-view-tag-card-img--blurred" src="/images/defaultchar.jpg" alt="" />
        <span class="art-view-tag-card-lock-msg">${escapeHtml(lockMsg)}</span>
      </div>
      <div class="art-view-tag-card-info">
        <span class="art-view-tag-card-name">${escapeHtml(c.name)}</span>
      </div>
    `;
  } else {
    a.innerHTML = `
      <div class="art-view-tag-card-imgwrap"><img src="${c.image || '/images/defaultchar.jpg'}" alt="" /></div>
      <div class="art-view-tag-card-info">
        <span class="art-view-tag-card-name">${escapeHtml(c.name)}</span>
        ${c.species ? `<span class="art-view-tag-card-sub">${escapeHtml(c.species)}</span>` : ''}
      </div>
    `;
  }
  return a;
}
function galleryStoryTagCard(s) {
  const a = document.createElement('a');
  a.className = 'art-view-tag-card';
  a.href = window.fpUrl(`/${s.story_path}`);
  a.innerHTML = `
    <div class="art-view-tag-card-imgwrap art-view-tag-card-imgwrap--story">${window.wikiGeneratedCoverHtml(s, { small: true })}</div>
    <div class="art-view-tag-card-info">
      <span class="art-view-tag-card-name">${escapeHtml(s.site_title || 'Untitled')}</span>
      ${s.synopsis ? `<span class="art-view-tag-card-sub">${escapeHtml(truncateLabel(s.synopsis, 90))}</span>` : ''}
    </div>
  `;
  return a;
}

// ── Universal comments (target_type/target_id) — one level of replies,
// "@username" prefix on a reply, avatar-card layout. Reused as-is on the
// account-level profile gallery view; will back Newspaper/Social later. ──
const CURRENT_USER = (() => {
  try { return JSON.parse(localStorage.getItem('btw_user') || sessionStorage.getItem('btw_user') || 'null'); } catch { return null; }
})();
let ccTargetType = null, ccTargetId = null;

function ccAvatarHtml(c) {
  const name = c.display_name || c.username || '?';
  const initial = escapeHtml(name.charAt(0).toUpperCase());
  return c.avatar
    ? `<img class="cc-avatar" src="${c.avatar}" alt="" />`
    : `<span class="cc-avatar-fallback">${initial}</span>`;
}
function ccTimeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}
function ccIsMine(c) { return CURRENT_USER && CURRENT_USER.id === c.user_id; }

function ccCommentEl(c, isReply) {
  const wrap = document.createElement('div');
  wrap.className = 'cc-item';
  const avatarHolder = document.createElement('div');
  avatarHolder.innerHTML = ccAvatarHtml(c);
  wrap.appendChild(avatarHolder.firstElementChild);

  const body = document.createElement('div');
  body.className = 'cc-body-wrap';
  body.innerHTML = `
    <div class="cc-bubble">
      <span class="cc-name"><a href="${window.fpUrl(`/${encodeURIComponent(c.username)}`)}">${escapeHtml(c.display_name || c.username)}</a></span>
      <span class="cc-time">${ccTimeAgo(c.created_at)}</span>
      <p class="cc-text">${c.reply_to_username ? `<span class="cc-mention">@${escapeHtml(c.reply_to_username)}</span> ` : ''}${escapeHtml(c.body)}</p>
    </div>
    <div class="cc-actions">
      ${token && !isReply ? '<button class="cc-action-btn" data-action="reply">Reply</button>' : ''}
      ${ccIsMine(c) ? '<button class="cc-action-btn" data-action="delete">Delete</button>' : ''}
    </div>
  `;
  wrap.appendChild(body);

  const replyBtn = body.querySelector('[data-action="reply"]');
  if (replyBtn) replyBtn.addEventListener('click', () => ccOpenReplyBox(body, c));
  const deleteBtn = body.querySelector('[data-action="delete"]');
  if (deleteBtn) deleteBtn.addEventListener('click', () => ccDeleteComment(c.id));

  if (!isReply && (c.replies || []).length) {
    const repliesWrap = document.createElement('div');
    repliesWrap.className = 'cc-replies';
    c.replies.forEach(r => repliesWrap.appendChild(ccCommentEl(r, true)));
    body.appendChild(repliesWrap);
  }
  return wrap;
}

function ccOpenReplyBox(bodyEl, parentComment) {
  const existing = bodyEl.querySelector('.cc-reply-box');
  if (existing) { existing.querySelector('textarea').focus(); return; }
  const box = document.createElement('div');
  box.className = 'cc-reply-box';
  box.innerHTML = `
    <textarea placeholder="Reply to ${escapeHtml(parentComment.display_name || parentComment.username)}…" maxlength="2000"></textarea>
    <button class="cc-compose-btn" type="button">Reply</button>
  `;
  const textarea = box.querySelector('textarea');
  box.querySelector('button').addEventListener('click', async () => {
    const text = textarea.value.trim();
    if (!text) return;
    const btn = box.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/content-comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ target_type: ccTargetType, target_id: ccTargetId, body: text, parent_id: parentComment.id }),
      });
      if (res.ok) await ccLoadComments();
    } finally { btn.disabled = false; }
  });
  const repliesWrap = bodyEl.querySelector('.cc-replies');
  bodyEl.insertBefore(box, repliesWrap || null);
  textarea.focus();
}

async function ccDeleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await fetch(`/api/content-comments/${id}`, { method: 'DELETE', headers: authHeaders() });
    ccLoadComments();
  } catch {}
}

async function ccLoadComments() {
  const list = document.getElementById('cc-list');
  if (!list) return;
  try {
    const res = await fetch(`/api/content-comments?target_type=${ccTargetType}&target_id=${ccTargetId}`);
    const data = await res.json();
    const comments = data.comments || [];
    list.innerHTML = '';
    if (!comments.length) { list.innerHTML = '<p class="cc-empty">No comments yet — be the first!</p>'; return; }
    comments.forEach(c => list.appendChild(ccCommentEl(c, false)));
  } catch { list.innerHTML = '<p class="cc-empty">Couldn\'t load comments right now.</p>'; }
}

function ccInitSection(targetType, targetId) {
  ccTargetType = targetType;
  ccTargetId = targetId;
  document.getElementById('cc-compose').style.display = token ? 'flex' : 'none';
  ccLoadComments();
}

document.getElementById('cc-compose-btn').addEventListener('click', async () => {
  const input = document.getElementById('cc-compose-input');
  const text = input.value.trim();
  if (!text || !ccTargetType) return;
  const btn = document.getElementById('cc-compose-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/content-comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ target_type: ccTargetType, target_id: ccTargetId, body: text }),
    });
    if (res.ok) { input.value = ''; await ccLoadComments(); }
  } finally { btn.disabled = false; }
});

window.addEventListener('popstate', () => {
  const id = new URLSearchParams(window.location.search).get('post');
  if (!id) { closePostDetail(false); return; }
  const item = GALLERY_ITEMS.find(g => String(g.id) === String(id));
  if (item) openPostDetail(item, false);
});


function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function renderVipBadge(s) {
  document.getElementById('vip-badge').style.display =
    (s.author_username || '').toLowerCase() === 'veekitpaws' ? 'flex' : 'none';
}

function applyStoryTheme(theme, bgUrl) {
  const bgImg = document.getElementById('page-bg-img');
  const bgOverlay = document.getElementById('page-bg-overlay');
  if (theme === 'custom' && bgUrl) {
    bgImg.src = bgUrl;
    bgImg.style.display = 'block';
    bgOverlay.style.background = hexToRgba('#0a0a0a', 0.78);
    bgOverlay.style.display = 'block';
  } else {
    bgImg.style.display = 'none';
    bgOverlay.style.display = 'none';
  }
}

// Background scrolls *with* the page instead of staying pinned, same
// treatment as the Fanpage Hub's Characters browse page -- height
// measured in JS since percentage/inset sizing can't resolve against a
// wrap whose own height is just "however tall its content is." Reset to
// 0 before each measurement since the element itself contributes to
// scrollHeight, or a previously-tall page could never shrink back down.
function syncBgHeight() {
  const bgEl = document.getElementById('page-bg-img');
  bgEl.style.height = '0';
  bgEl.style.height = Math.max(document.documentElement.scrollHeight, window.innerHeight) + 'px';
}
window.addEventListener('resize', syncBgHeight);

// Book box — the story's own cover + a follow-the-author row, under the
// Navigate box, so browsing feels anchored to this specific book instead of
// a generic gallery feed. No follow control on your own story.
function renderBookBox(site) {
  const box = document.getElementById('mod-book-box');
  if (!site) { box.hidden = true; return; }
  box.hidden = false;

  document.getElementById('mod-book-cover-link').href = STORY_BASE;
  window.wikiSetCoverSlot(document.getElementById('mod-book-cover'), site, { alt: `${site.site_title} cover` });
  document.getElementById('mod-book-title').textContent = site.site_title || 'Untitled Story';

  const authorRow = document.getElementById('mod-book-author-row');
  authorRow.innerHTML = '';

  const authorLink = document.createElement('a');
  authorLink.className = 'mod-book-box-author-link';
  authorLink.href = window.fpUrl(`/${site.author_username}`);
  if (site.author_avatar) {
    const img = document.createElement('img');
    img.className = 'mod-book-box-author-avatar';
    img.src = site.author_avatar;
    img.alt = '';
    authorLink.appendChild(img);
  } else {
    const fallback = document.createElement('span');
    fallback.className = 'mod-book-box-author-avatar-fallback';
    fallback.textContent = (site.author_display_name || site.author_username || '?').charAt(0).toUpperCase();
    authorLink.appendChild(fallback);
  }
  const nameSpan = document.createElement('span');
  nameSpan.className = 'mod-book-box-author-name';
  nameSpan.textContent = site.author_display_name || site.author_username;
  authorLink.appendChild(nameSpan);
  authorRow.appendChild(authorLink);

  if (site.is_self) return;

  if (!token) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mod-book-box-follow-btn';
    btn.textContent = 'Follow';
    btn.addEventListener('click', () => window.fpRequireSignIn('To follow this author, you must create an account!'));
    authorRow.appendChild(btn);
    return;
  }

  const btn = document.createElement('button');
  btn.type = 'button';
  let following = !!site.is_following;
  function paint() {
    btn.className = 'mod-book-box-follow-btn' + (following ? ' following' : '');
    btn.textContent = following ? '✓ Following' : 'Follow';
  }
  paint();
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await fetch(`/api/follows/${site.author_username}`, { method: following ? 'DELETE' : 'POST', headers: authHeaders() });
      following = !following;
      paint();
    } catch {}
    btn.disabled = false;
  });
  authorRow.appendChild(btn);
}

(async () => {
  const data = await ModeratorSite.load(SLUG);
  ModeratorSite.applyBanner(document.getElementById('page-banner-img'), data && data.site);
  if (data && data.site) renderVipBadge(data.site);
  renderBookBox(data && data.site);
  // Forces the same "Browse > Posts" wallpaper the Fanpage Hub uses,
  // regardless of whatever theme this story picked for its Home/
  // Chapters/Characters pages -- this page always gets its own look.
  applyStoryTheme('custom', '/images/home/potential-box-background.png');
  // applyStoryTheme's own scrim is tuned for the fixed-background pages --
  // override to match the Characters browse page's lighter scrim exactly.
  document.getElementById('page-bg-overlay').style.background = 'rgba(8,6,10,0.45)';
  syncBgHeight();
  if (data && data.site && data.site.site_title) document.title = `Gallery ✦ ${data.site.site_title}`;
  STORY_TITLE = (data && data.site && data.site.site_title) || 'this story';
  STORY_COVER_URL = (data && data.site && data.site.cover_url) || '';
  STORY_AUTHOR_USERNAME = (data && data.site && data.site.author_username) || '';
  STORY_AUTHOR_DISPLAY = (data && data.site && data.site.author_display_name) || STORY_AUTHOR_USERNAME;
  IS_SELF = !!(data && data.site && data.site.is_self);
  const pageTitleEl = document.getElementById('page-title-display');
  pageTitleEl.textContent = STORY_TITLE;
  pageTitleEl.classList.remove('mod-title-loading');

  GALLERY_ITEMS = (data && data.gallery) || [];

  // Nothing posted at all yet (or nothing this viewer can see) — swap the
  // grid for an "Add Artwork" prompt instead of showing an empty grid.
  if (!GALLERY_ITEMS.length) {
    document.getElementById('gallery-grid').style.display = 'none';
    document.getElementById('gallery-empty-box').style.display = '';
    document.getElementById('gallery-empty-editor-btn').style.display = IS_SELF ? '' : 'none';
  }

  const deepLinkId = new URLSearchParams(window.location.search).get('post');
  const deepLinkItem = deepLinkId ? GALLERY_ITEMS.find(g => String(g.id) === String(deepLinkId)) : null;

  renderGallery();
  if (deepLinkItem) openPostDetail(deepLinkItem, false);
})();
</script>
