<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Characters ✦ BTW</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    /* ── Card grid + single-character detail view, same pattern as the
       Fanpage Hub's Characters browse page -- replaces "Explore the
       Cast!"'s sidebar-nav list. The Cover box (.wiki-side-col) stays put
       on the right in both states; only the grid/detail column swaps. ── */
    .fp-char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; }
    .fp-char-card {
      position: relative; display: block; text-decoration: none; color: inherit;
      background: #161616; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
      overflow: hidden; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .fp-char-card:hover { transform: translateY(-3px); box-shadow: 0 10px 22px rgba(0,0,0,0.45); border-color: rgba(240,192,96,0.4); }
    .fp-char-card-img-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: #1e1e1e; overflow: hidden; }
    .fp-char-card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fp-char-card-fallback {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #6b3fa0, #c2547a); color: #fff; font-weight: 700; font-size: 2rem;
    }
    .fp-char-card-body {
      position: relative; overflow: hidden; height: 72px; padding: 0.45rem 0.55rem 0.55rem;
      background: linear-gradient(160deg, rgba(10,8,14,0.82), rgba(10,8,14,0.72)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
    }
    .fp-char-card-body-deco { position: absolute; top: -8px; right: -6px; width: 26px; height: 26px; object-fit: contain; opacity: 0.9; pointer-events: none; }
    .fp-char-card-name-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.3rem; }
    .fp-char-card-name {
      font-family: 'Fredoka', 'Lato', cursive; font-size: 1.05rem; font-weight: 700; color: #fff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
    }
    .fp-char-card-species {
      display: inline-block; flex-shrink: 0; background: rgba(127,168,217,0.16); color: #a8c6e8; border-radius: 20px;
      padding: 0.15em 0.6em; font-size: 0.92rem; font-weight: 700;
    }
    .fp-char-card-owner { font-size: 0.72rem; color: #999; }

    /* Centered in the main column instead of hugging the left edge -- reads
       closer to the Cover box on the right this way. */
    #chars-detail-view { max-width: 760px; margin: 0 auto; }
    .chars-detail-topbar { display: flex; align-items: center; gap: 0.9rem; margin: 0 0 1.1rem; flex-wrap: wrap; }
    .fp-char-back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: linear-gradient(160deg, rgba(38,30,16,0.85), rgba(20,16,10,0.85));
      border: 1px solid rgba(240,192,96,0.6); color: #f7d68a;
      border-radius: 30px; padding: 0.85em 1.6em; font-family: 'Fredoka', 'Lato', cursive; font-size: 1.05rem; font-weight: 700;
      cursor: pointer; white-space: nowrap;
      /* Softer/tighter than the plain Characters browse page's version --
         against this page's own busy blurred wallpaper (rather than a
         mostly-flat dark area) a wide 20px glow read as a hazy rectangle
         behind the pill instead of a clean ambient glow. */
      box-shadow: 0 0 8px rgba(240,192,96,0.22);
      transition: box-shadow 0.15s, transform 0.15s, border-color 0.15s;
    }
    .fp-char-back-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
    .fp-char-back-btn:hover { border-color: #f0c060; color: #fff; box-shadow: 0 0 16px rgba(240,192,96,0.4); transform: translateY(-1px); }
    /* Edit box only ever shows inside the topbar now (next to Back), never
       in the grid view -- .chars-create-box's own width:100% button needs
       an explicit width here since it's no longer a full-width sidebar card. */
    .chars-detail-topbar .chars-create-box { padding: 0; background: none; border: none; backdrop-filter: none; width: auto; }
    .chars-detail-topbar .chars-create-btn { width: auto; }

    /* Comments on this page keep their guest-name compose card (unlike the
       login-only Characters browse page/profile tab), but the textarea
       itself gets the same PotentialBoxBackground/bubbly treatment. */
    #char-detail-comments .cc-compose-box textarea {
      background: linear-gradient(160deg, rgba(10,8,14,0.78), rgba(10,8,14,0.68)), url('/images/home/potential-box-background.png');
      background-size: cover; background-position: center;
      border-radius: 12px; font-family: 'Fredoka', 'Lato', cursive;
    }

    /* This page always forces PotentialBoxBackground (applyStoryTheme call
       below) instead of whatever theme the story picked for its Home/
       Chapters/Gallery pages -- and unlike those pages, it scrolls *with*
       the content instead of staying pinned to the viewport, same as the
       Fanpage Hub's Characters browse page. Overrides the shared
       .mod-page-bg-img's own position:fixed just for this page. */
    /* No blur -- same reasoning as the shared .mod-page-bg-img fix: a
       blurred element fades to nothing right at its own top/bottom edge,
       and that edge landing anywhere near the tab row read as a distinct
       hazy box breaking the background instead of a clean backdrop.
       Overlay opacity raised to compensate for the lost blur. */
    #page-bg-img {
      position: absolute; top: 0; left: 0; right: 0; bottom: auto;
      width: 100%; height: 100vh; object-fit: cover;
      /* The shared .mod-page-bg-img rule (fanpages.css) sets
         filter: blur(9px) brightness(0.95) -- overriding position/width/
         height above via this ID selector does NOT touch that filter
         property, since CSS cascades per-property, not per-rule. The "no
         blur" comment above describes intent that was never actually
         backed by a real override -- the wallpaper never actually stopped
         being blurred, which is exactly the hazy rectangle behind the tab
         row it was trying to fix. Re-declaring filter here (brightness
         only, no blur) is the real fix. */
      filter: brightness(0.95);
    }
    #page-bg-overlay { position: fixed; inset: 0; background: rgba(8,6,10,0.68); }
    /* .wiki-page-title-block's margin-top:4.5rem (fanpages.css) collapses
       straight through .mod-page-bg-wrap -- it has no border/padding of
       its own to block collapse -- which shifted the wrap's rendered top
       edge (and #page-bg-img with it, anchored to the wrap's padding box)
       down by that same 4.5rem, leaving a bare gap between the banner and
       where the wallpaper actually starts. A trivial padding gives the
       wrap a padding box of its own, which blocks the collapse. */
    #page-bg-wrap { padding-top: 1px; }

    @media (max-width: 900px) { .fp-char-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 640px) { .fp-char-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body class="mod-theme">

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="site-banner">
  <div class="site-banner-inner">
    <img id="page-banner-img" alt="Characters — banner" />
    <div class="mod-vip-badge" id="vip-badge" style="display:none;">

</div>

<!-- Story's chosen background (plain dark by default, or the author's
     uploaded blurred image) — same theme system as the story home page.
     Wraps the actual content, since an empty wrapper with only absolutely-
     positioned children collapses to zero height. -->
<div class="mod-page-bg-wrap" id="page-bg-wrap">
  <img class="mod-page-bg-img" id="page-bg-img" style="display:none;" alt="" />
  <div class="mod-page-bg-overlay" id="page-bg-overlay" style="display:none;"></div>

  <div class="wiki-page-title-block">
    <h1 class="wiki-title wiki-page-title mod-title-loading" id="page-title-display"></h1>
  </div>

  <nav class="wiki-story-tabs wiki-story-tabs--top wiki-story-tabs--centered">
    <a href="#" id="tab-home" class="wiki-story-tab">Home</a>
    <a href="#" id="tab-chapters" class="wiki-story-tab">Chapters</a>
    <a href="#" id="tab-characters" class="wiki-story-tab active">Characters</a>
    <a href="#" id="tab-gallery" class="wiki-story-tab">Gallery</a>
  </nav>

  <!-- Same 1300px cap as the story home page's .wiki-layout — the shared
       .chars-layout class (style.css, also used by other non-story pages)
       defaults to 1240px, which read visibly narrower/wider than Home. -->
  <!-- padding-top:0 — .chars-layout's own 2.5rem default (style.css) left

  <!-- The left "Explore the Cast!" sidebar-nav column is gone -- .chars-layout
       is normally 3 columns (200px sidebar / 1fr main / 220px cover, see
       fanpages.css) so this page narrows it to 2 (main / cover) instead. -->
  <div class="chars-layout" style="max-width:1300px; padding-top:0; grid-template-columns:1fr 220px;">

    <main class="chars-main">
      <div id="chars-grid-view">
        <div class="fp-char-grid" id="chars-grid"></div>
        <div class="fp-pagination" id="chars-pagination"></div>
      </div>

      <div id="chars-detail-view" hidden>
        <div class="chars-detail-topbar">
          <button type="button" class="fp-char-back-btn" id="chars-back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
            Back
          </button>
          <aside class="chars-create-box" id="char-edit-box" style="display:none;">
            <button class="chars-create-btn chars-create-btn--edit" id="char-edit-btn" type="button"></button>
          </aside>
        </div>

        <div id="char-profile" class="char-profile"></div>

        <div id="char-detail-nav" class="art-nav"></div>

        <div class="cc-section" id="char-detail-comments">
          <p class="cc-title">💬 Comments</p>
          <div class="cc-compose" id="cc-compose" style="display:none;">
            <div class="cc-compose-box">
              <p class="cc-guest-note" id="cc-guest-note" style="display:none;">Guest accounts can still leave comments, and they will display with the chosen name above! Consider <a href="#" id="cc-guest-signin-link">signing in</a> to give the author a real follow and support!</p>
              <label class="cc-guest-label" id="cc-guest-label" style="display:none;">Guest Name<span class="cc-required-star">*</span></label>
              <input type="text" id="cc-guest-name" class="cc-guest-name-input" placeholder="Guest name" maxlength="40" style="display:none;" />
              <textarea id="cc-compose-input" placeholder="Add a comment…" maxlength="2000"></textarea>
            </div>
            <div class="cc-compose-actions-row">
            <button class="cc-compose-btn" id="cc-compose-btn" type="button">Post</button>
            </div>
          </div>
          <div class="cc-list" id="cc-list"><p class="cc-empty">Loading…</p></div>
        </div>
      </div>
    </main>

    <div class="wiki-side-col">

      <aside class="mod-book-box" id="mod-book-box" hidden>
        <a class="mod-book-box-cover-link" id="mod-book-cover-link" href="#">
          <img class="mod-book-box-cover" id="mod-book-cover" alt="" />
        </a>
        <p class="mod-book-box-title" id="mod-book-title"></p>
        <div class="mod-book-box-author-row" id="mod-book-author-row"></div>
      </aside>

    </div>

  </div>
</div>

<footer>
  <p>This story is a fan-made page hosted on Between Two Worlds.</p>
</footer>

<script src="/fanpages/fanpages-site.js"></script>
<script>
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const OFFSET = window.FP_BASE ? 1 : 0;
const SLUG = PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');
const STORY_BASE = (window.FP_BASE || '') + '/' + PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');

document.getElementById('tab-home').href = STORY_BASE;
document.getElementById('tab-chapters').href = STORY_BASE + '/chapters';
document.getElementById('tab-characters').href = STORY_BASE + '/characters';
document.getElementById('tab-gallery').href = STORY_BASE + '/gallery';

const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => ({ Authorization: `Bearer ${token}`, 'X-Story-Path': SLUG });

let CHARACTERS = [];
let STORY_TITLE = 'Fanpages';
let STORY_COVER_URL = '';
let IS_SELF = false;
// The relationship-linked character currently being viewed, when they're NOT
// part of this story's own cast (character_story_links) — a "ghost slot"
// shown at the top of the sidebar instead of navigating away from the page.
// Cleared the instant you land back on any character who IS in CHARACTERS.
let GHOST_CHAR = null;

const DEFAULT_REF = '/images/characters/noreference.png';
const NA = 'N/A';

// A view only counts once a character has actually been open for 10s (not
// just refreshed, or clicked past mid-slideshow), and at most once per 5
// minutes per character -- both tracked client-side.
let pendingViewTimer = null;
function scheduleCharViewBump(id) {
  clearTimeout(pendingViewTimer);
  const cooldownKey = `btw_view_character_${id}`;
  pendingViewTimer = setTimeout(() => {
    const last = parseInt(localStorage.getItem(cooldownKey) || '0', 10);
    if (Date.now() - last < 5 * 60 * 1000) return;
    localStorage.setItem(cooldownKey, String(Date.now()));
    fetch(`/api/character/${id}/view`, { method: 'POST', headers: authHeaders() }).catch(() => {});
  }, 10000);
}

// ── Story theme background (default black, or the author's uploaded image) ──
function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function renderVipBadge(s) {
  document.getElementById('vip-badge').style.display =
    (s.author_username || '').toLowerCase() === 'veekitpaws' ? 'flex' : 'none';
}

function applyStoryTheme(theme, bgUrl) {
  const bgImg = document.getElementById('page-bg-img');
  const bgOverlay = document.getElementById('page-bg-overlay');
  if (theme === 'custom' && bgUrl) {
    bgImg.src = bgUrl;
    bgImg.style.display = 'block';
    bgOverlay.style.background = hexToRgba('#0a0a0a', 0.78);
    bgOverlay.style.display = 'block';
  } else {
    bgImg.style.display = 'none';
    bgOverlay.style.display = 'none';
  }
}

// Background scrolls *with* the page instead of staying pinned, same
// treatment as the Fanpage Hub's Characters browse page -- needs its
// height measured in JS since percentage/inset sizing can't resolve
// against a wrap whose own height is just "however tall its content is."
// Reset to 0 before each measurement, since the element being measured is
// itself absolutely positioned and contributes to scrollHeight -- without
// that reset a previously-tall page could never report shrinking back down.
function syncBgHeight() {
  const bgEl = document.getElementById('page-bg-img');
  bgEl.style.height = '0';
  bgEl.style.height = Math.max(document.documentElement.scrollHeight, window.innerHeight) + 'px';
}
window.addEventListener('resize', syncBgHeight);

function isBlank(v) { return !v || !v.trim() || v.trim() === NA; }

// Lightweight, safe markup for Description/Interests/Fun Facts/Lore —
// escapes everything first, then converts *italic* and **bold** the way
// authors already write them. Never trusts raw HTML from the field itself.
function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function richText(s) {
  let out = escapeHtml(s || '');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*(.+?)\*/g, '<em>$1</em>');
  return out;
}

// "Official Ref" -- last row in the Fun Facts box, only for characters with
// a real (non-default) reference image. Green check when the owner marked
// the art as their own/commissioned; otherwise a found-elsewhere note that
// links out to the source if one was given.
function officialRefFactRow(char) {
  if (!char.ref_image || char.ref_image === '/images/defaultchar.jpg') return null;
  const fact = document.createElement('div');
  fact.className = 'char-fact';
  const bullet = document.createElement('span');
  bullet.className = 'char-fact-bullet';
  bullet.textContent = '✦';
  fact.appendChild(bullet);
  const content = document.createElement('div');
  content.style.cssText = 'flex:1; min-width:0;';
  const heading = document.createElement('span');
  heading.style.cssText = 'color:#f0c060; font-weight:700; text-shadow:0 0 12px rgba(240,192,96,0.6);';
  heading.textContent = 'Official Ref';
  content.appendChild(heading);
  const line = document.createElement('div');
  line.style.cssText = 'margin-top:0.4rem;';
  if (char.is_official_art !== false) {
    line.innerHTML = '<span style="color:#2fbf5f; font-weight:600;">Official ✅</span>';
  } else if (char.official_art_source_url) {
    const a = document.createElement('a');
    a.href = char.official_art_source_url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.cssText = 'color:#d9a13a; font-weight:600; text-decoration:underline;';
    a.textContent = 'Unofficial 🎨';
    line.appendChild(a);
  } else {
    line.innerHTML = '<span style="color:#d9a13a; font-weight:600;">Unofficial 🎨</span>';
  }
  content.appendChild(line);
  fact.appendChild(content);
  return fact;
}

function renderProfile(char) {
  const profile = document.getElementById('char-profile');
  profile.innerHTML = '';

  // Reference image
  const refWrap = document.createElement('div');
  refWrap.className = 'char-ref-wrap';
  refWrap.style.aspectRatio = char.hasRef ? '1 / 1' : '13 / 10';
  const imgSrc = char.ref || DEFAULT_REF;
  const img = document.createElement('img');
  img.alt = char.name;
  img.src = imgSrc;
  img.style.objectPosition = `${char.refPosX}% ${char.refPosY}%`;
  img.onerror = function () {
    refWrap.innerHTML = '<div class="char-ref-placeholder"><span>✦</span><span>No reference yet</span></div>';
  };
  refWrap.appendChild(img);
  profile.appendChild(refWrap);

  // Bio box
  const bio = document.createElement('div');
  bio.className = 'char-bio-box';

  const nameRow = document.createElement('div');
  nameRow.className = 'char-name-row';
  const nameEl = document.createElement('h1');
  nameEl.className = 'char-name';
  nameEl.textContent = char.name;
  nameRow.appendChild(nameEl);
  const shareBtn = document.createElement('button');
  shareBtn.className = 'fp-share-icon-btn';
  shareBtn.type = 'button';
  shareBtn.title = 'Share this character';
  shareBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none"><path d="M3.5 20.5c-0.5-8 5-13 11.5-13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M13.3 2.2l8.7 6.3-8.7 6.3V2.2z" fill="currentColor"/></svg>';
  shareBtn.addEventListener('click', (e) => {
    fpShare(e.currentTarget, `${window.location.origin}${STORY_BASE}/characters?char=${char.id}`);
  });
  nameRow.appendChild(shareBtn);
  bio.appendChild(nameRow);

  const descWrap = document.createElement('div');
  descWrap.className = 'char-desc';
  char.desc.forEach(text => {
    const p = document.createElement('p');
    p.innerHTML = richText(text);
    descWrap.appendChild(p);
  });
  bio.appendChild(descWrap);
  profile.appendChild(bio);

  // Stats + Facts row
  const row = document.createElement('div');
  row.className = 'char-cards-row';

  const statsBox = document.createElement('div');
  statsBox.className = 'char-box';
  const statsTitle = document.createElement('span');
  statsTitle.className = 'char-box-title';
  statsTitle.textContent = 'Stats';
  statsBox.appendChild(statsTitle);

  const stats = char.stats || {};
  Object.entries(stats).forEach(([label, value]) => {
    if (label === 'Theme Song') return;
    const statRow = document.createElement('div');
    statRow.className = 'char-stat-row';
    const lbl = document.createElement('span');
    lbl.className = 'char-stat-label';
    lbl.textContent = label;
    const val = document.createElement('span');
    val.className = 'char-stat-value';
    val.innerHTML = richText(value || NA);
    statRow.appendChild(lbl);
    statRow.appendChild(val);
    statsBox.appendChild(statRow);
  });

  // Relationships — its own little list under the plain stat rows. Any
  // tagged character is clickable now, whether they're in this story's cast
  // or not — if not, viewCharacter() fetches them and shows a "ghost slot"
  // instead of leaving the page.
  const relationships = (char.relationships || []).filter(r => r && r.name);
  if (relationships.length) {
    const relDivider = document.createElement('div');
    relDivider.style.cssText = 'border-top:1px solid rgba(255,255,255,0.08); margin:0.75rem 0 0.6rem;';
    statsBox.appendChild(relDivider);

    const relLabel = document.createElement('span');
    relLabel.className = 'char-stat-label';
    relLabel.textContent = 'Relationships';
    relLabel.style.display = 'block';
    relLabel.style.marginBottom = '0.4rem';
    statsBox.appendChild(relLabel);

    relationships.forEach(rel => {
      const relLine = document.createElement('div');
      relLine.style.cssText = 'font-size:0.88rem; color:#ccc; padding:0.15rem 0;';

      // The avatar itself is a visual "this is clickable" indicator — only
      // show one when the relationship is actually linked to a real
      // character page. If it's linked but that character turns out not to
      // exist (deleted, or the id was never valid), the avatar gets pulled
      // once that's confirmed rather than showing a misleading default pfp.
      if (rel.character_id) {
        const avatar = document.createElement('img');
        avatar.className = 'char-rel-avatar';
        avatar.alt = '';
        avatar.src = DEFAULT_REF;
        relLine.appendChild(avatar);

        const known = CHARACTERS.find(c => c.id === String(rel.character_id));
        if (known && known.ref) {
          avatar.src = known.ref;
        } else if (!known) {
          fetch(`/api/characters/${rel.character_id}`)
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (d && d.character) {
                if (d.character.ref_image) avatar.src = d.character.ref_image;
              } else {
                avatar.remove();
              }
            })
            .catch(() => avatar.remove());
        }
        const nameLink = document.createElement('a');
        nameLink.href = '#';
        nameLink.style.cssText = 'color:#f0c060; font-weight:700; text-decoration:none; text-shadow:0 0 12px rgba(240,192,96,0.6); cursor:pointer;';
        nameLink.textContent = rel.name;
        nameLink.addEventListener('click', (e) => { e.preventDefault(); viewCharacter(rel.character_id); });
        relLine.appendChild(nameLink);
      } else {
        const nameSpan = document.createElement('span');
        nameSpan.style.cssText = 'color:#f0c060; font-weight:700;';
        nameSpan.textContent = rel.name;
        relLine.appendChild(nameSpan);
      }
      if (!isBlank(rel.type)) {
        relLine.appendChild(document.createTextNode(' — ' + rel.type));
      }
      statsBox.appendChild(relLine);
    });
  }

  row.appendChild(statsBox);

  const factsBox = document.createElement('div');
  factsBox.className = 'char-box';
  const factsTitle = document.createElement('span');
  factsTitle.className = 'char-box-title';
  factsTitle.textContent = 'Fun Facts';
  factsBox.appendChild(factsTitle);

  // Theme Song always comes first, as a real link when set
  const themeSong = stats['Theme Song'];
  const themeFact = document.createElement('div');
  themeFact.className = 'char-fact';
  const themeBullet = document.createElement('span');
  themeBullet.className = 'char-fact-bullet';
  themeBullet.textContent = '✦';
  themeFact.appendChild(themeBullet);
  const themeContent = document.createElement('span');
  if (!isBlank(themeSong) && /^https?:\/\//i.test(themeSong.trim())) {
    themeContent.innerHTML = '';
    const a = document.createElement('a');
    a.href = themeSong.trim();
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.color = '#f0c060';
    a.textContent = 'Theme Song';
    themeContent.appendChild(a);
    themeContent.appendChild(document.createTextNode(' 🎵'));
  } else {
    themeContent.textContent = 'Theme Song: N/A';
  }
  themeFact.appendChild(themeContent);
  factsBox.appendChild(themeFact);

  // Stories — its own bullet, same as Theme Song, with the linked-story
  // cards nested underneath it instead of a separate boxed section.
  const storiesFact = document.createElement('div');
  storiesFact.className = 'char-fact';
  const storiesBullet = document.createElement('span');
  storiesBullet.className = 'char-fact-bullet';
  storiesBullet.textContent = '✦';
  storiesFact.appendChild(storiesBullet);
  const storiesContent = document.createElement('div');
  storiesContent.style.cssText = 'flex:1; min-width:0;';
  const storiesHeading = document.createElement('span');
  storiesHeading.style.cssText = 'color:#f0c060; font-weight:700; text-shadow:0 0 12px rgba(240,192,96,0.6);';
  storiesHeading.textContent = 'Stories';
  storiesContent.appendChild(storiesHeading);
  const storiesWrap = document.createElement('div');
  storiesWrap.style.cssText = 'margin-top:0.55rem;';
  storiesWrap.innerHTML = '<p style="color:#888; font-size:0.82rem;">Loading…</p>';
  storiesContent.appendChild(storiesWrap);
  storiesFact.appendChild(storiesContent);
  factsBox.appendChild(storiesFact);
  fetch(`/api/characters/${char.id}/stories`)
    .then(r => r.ok ? r.json() : { stories: [] })
    .then(data => {
      const stories = data.stories || [];
      storiesWrap.innerHTML = '';
      if (!stories.length) {
        storiesWrap.innerHTML = `<p style="color:#888; font-size:0.82rem;">No linked stories with ${escapeHtml(char.name)} yet.</p>`;
        return;
      }
      const storiesRow = document.createElement('div');
      storiesRow.style.cssText = 'display:flex; flex-wrap:wrap; gap:0.6rem;';
      stories.forEach(s => {
        const a = document.createElement('a');
        a.href = window.fpUrl(`/${s.story_path}`);
        a.style.cssText = 'display:flex; align-items:center; gap:0.5rem; text-decoration:none; background:#1a1a1a; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:0.35rem 0.6rem 0.35rem 0.35rem; max-width:180px;';
        a.innerHTML = `
          ${window.wikiGeneratedCoverHtml(s, { small: true, style: 'width:28px; height:38px; object-fit:cover; border-radius:4px; flex-shrink:0; background:#222;' })}
          <span style="font-size:0.8rem; color:#ddd; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(s.site_title)}</span>
        `;
        storiesRow.appendChild(a);
      });
      storiesWrap.appendChild(storiesRow);
    })
    .catch(() => {
      storiesWrap.innerHTML = '<p style="color:#888; font-size:0.82rem;">Couldn\'t load linked stories right now.</p>';
    });

  char.facts.forEach(item => {
    const fact = document.createElement('div');
    fact.className = 'char-fact';
    const bullet = document.createElement('span');
    bullet.className = 'char-fact-bullet';
    bullet.textContent = '✦';
    const content = document.createElement('span');
    content.innerHTML = richText(item);
    fact.appendChild(bullet);
    fact.appendChild(content);
    factsBox.appendChild(fact);
  });
  const officialFact = officialRefFactRow(char);
  if (officialFact) factsBox.appendChild(officialFact);
  row.appendChild(factsBox);

  profile.appendChild(row);

  // Lore spoiler box — always shown, N/A placeholder when empty
  const loreBox = document.createElement('div');
  loreBox.className = 'char-box char-lore-box';

  const loreTitle = document.createElement('span');
  loreTitle.className = 'char-box-title';
  loreTitle.textContent = 'Lore';
  loreBox.appendChild(loreTitle);

  const spoiler = document.createElement('div');
  spoiler.className = 'char-lore-spoiler';

  const textWrap = document.createElement('div');
  textWrap.className = 'char-lore-text';
  const loreItems = (char.lore && char.lore.length) ? char.lore : [NA];
  loreItems.forEach(item => {
    const p = document.createElement('p');
    p.innerHTML = richText(item);
    textWrap.appendChild(p);
  });
  spoiler.appendChild(textWrap);

  const revealBtn = document.createElement('button');
  revealBtn.className = 'char-lore-reveal';
  revealBtn.textContent = '⚠ Spoilers — click to reveal';
  revealBtn.addEventListener('click', () => spoiler.classList.add('revealed'));
  spoiler.appendChild(revealBtn);

  loreBox.appendChild(spoiler);
  profile.appendChild(loreBox);

  // Views/Like/Bookmark footer — sits at the very bottom of the card, under
  // Lore and before the slideshow nav (a sibling element, not appended here).
  const footer = document.createElement('div');
  footer.className = 'char-detail-footer';

  const viewsEl = document.createElement('span');
  viewsEl.className = 'char-detail-views';
  viewsEl.innerHTML = `👁 <span class="char-detail-views-count">${char.viewCount}</span>`;
  footer.appendChild(viewsEl);

  const likeBtn = document.createElement('button');
  likeBtn.className = 'art-view-like art-view-like--big' + (char.liked ? ' liked' : '');
  likeBtn.type = 'button';
  likeBtn.setAttribute('aria-label', 'Like this character');
  likeBtn.innerHTML = `<span class="char-like-icon">${char.liked ? '♥' : '♡'}</span> <span class="char-like-count">${char.likeCount}</span>`;
  likeBtn.addEventListener('click', async () => {
    likeBtn.disabled = true;
    try {
      const res = await fetch(`/api/moderator/character/${char.id}/like`, { method: char.liked ? 'DELETE' : 'POST', headers: authHeaders() });
      const data = await res.json();
      char.liked = data.liked; char.likeCount = data.like_count;
      likeBtn.classList.toggle('liked', data.liked);
      likeBtn.querySelector('.char-like-icon').textContent = data.liked ? '♥' : '♡';
      likeBtn.querySelector('.char-like-count').textContent = data.like_count;
    } catch {}
    likeBtn.disabled = false;
  });
  footer.appendChild(likeBtn);

  const bookmarkBtn = document.createElement('button');
  bookmarkBtn.className = 'art-view-bookmark-btn' + (char.bookmarked ? ' bookmarked' : '');
  bookmarkBtn.type = 'button';
  bookmarkBtn.setAttribute('aria-label', 'Bookmark this character');
  bookmarkBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 3a1 1 0 0 0-1 1v16.5a.5.5 0 0 0 .8.4L12 16l6.2 4.9a.5.5 0 0 0 .8-.4V4a1 1 0 0 0-1-1H6z"/></svg>';
  bookmarkBtn.addEventListener('click', async () => {
    if (!token) { window.location.href = window.fpUrl(`/login?from=${encodeURIComponent(window.location.pathname + window.location.search)}`); return; }
    bookmarkBtn.disabled = true;
    try {
      const res = await fetch(`/api/moderator/character/${char.id}/bookmark`, { method: char.bookmarked ? 'DELETE' : 'POST', headers: authHeaders() });
      const data = await res.json();
      char.bookmarked = data.bookmarked;
      bookmarkBtn.classList.toggle('bookmarked', data.bookmarked);
    } catch {}
    bookmarkBtn.disabled = false;
  });
  footer.appendChild(bookmarkBtn);

  profile.appendChild(footer);
  scheduleCharViewBump(char.id);

  // Edit box under Navigate — story owner only, for whichever character is
  // showing. A character linked onto the story by its actual owner (e.g. a
  // friend's character tagged in via "Link Existing") isn't yours to edit —
  // show a remove-only option there instead of opening their whole editor.
  const editBox = document.getElementById('char-edit-box');
  const editBtn = document.getElementById('char-edit-btn');
  if (IS_SELF && char.isMine) {
    editBox.style.display = 'block';
    editBtn.className = 'chars-create-btn chars-create-btn--edit';
    editBtn.style.cssText = 'flex-direction:column; gap:0.15rem; padding:0.55em 0.9em; line-height:1.3;';
    editBtn.innerHTML = `<span>✏️ Edit ${escapeHtml(char.name)}</span><span style="font-size:0.72em; font-weight:600; opacity:0.8;">(Story Editor)</span>`;
    // Straight to the character's own tab in the main Story Editor hub —
    // editing a character no longer happens in place on this page at all.
    editBtn.onclick = () => { window.location.href = `${STORY_BASE}/edit?char=${char.id}#characters`; };
  } else if (IS_SELF && !char.isMine) {
    editBox.style.display = 'block';
    editBtn.className = 'chars-create-btn chars-create-btn--danger';
    editBtn.textContent = 'Remove From Book?';
    editBtn.onclick = () => removeBorrowedCharacter(char);
  } else {
    editBox.style.display = 'none';
  }

  renderCharNav(char);
  ccInitSection('character', char.id);
}

// ── Slideshow prev/next nav between this story's own cast (mirrors the
// gallery's art-view slideshow) — only makes sense within CHARACTERS, so a
// ghost character (viewed from outside this story) gets no nav at all. ──
function renderCharNav(char) {
  const navEl = document.getElementById('char-detail-nav');
  navEl.innerHTML = '';
  const idx = CHARACTERS.findIndex(c => c.id === char.id);
  if (idx === -1) return;
  const prev = idx > 0 ? CHARACTERS[idx - 1] : null;
  const next = idx < CHARACTERS.length - 1 ? CHARACTERS[idx + 1] : null;
  if (prev) {
    const a = document.createElement('a');
    a.className = 'art-nav-btn art-nav-prev';
    a.href = `${STORY_BASE}/characters?char=${prev.id}`;
    a.innerHTML = `← <span class="art-nav-label">${escapeHtml(prev.name)}</span>`;
    a.addEventListener('click', (e) => { e.preventDefault(); viewCharacter(prev.id); });
    navEl.appendChild(a);
  }
  if (next) {
    const a = document.createElement('a');
    a.className = 'art-nav-btn art-nav-next';
    a.href = `${STORY_BASE}/characters?char=${next.id}`;
    a.innerHTML = `<span class="art-nav-label">${escapeHtml(next.name)}</span> →`;
    a.addEventListener('click', (e) => { e.preventDefault(); viewCharacter(next.id); });
    navEl.appendChild(a);
  }
}

// A character that isn't yours — only ever unlinked from this story's
// roster, never edited or permanently deleted (that stays entirely up to
// its actual owner).
async function removeBorrowedCharacter(char) {
  if (!confirm(`Remove ${char.name} from this story? They aren't your character, so this only unlinks them here — they'll stay untouched on their owner's profile.`)) return;
  try {
    await fetch(`/api/moderator/characters/${char.id}`, { method: 'DELETE', headers: authHeaders() });
    const fresh = await ModeratorSite.load(SLUG);
    renderCharList((fresh && fresh.characters) || []);
  } catch {}
}

// Normalizes a raw character row (from either this story's own list or the
// cross-story /api/characters/:id lookup) into the shape renderProfile expects.
function normalizeChar(r) {
  return {
    id: String(r.id),
    name: r.name,
    hasRef: !!r.ref_image,
    ref: r.ref_image || null,
    refPosX: r.ref_position_x != null ? r.ref_position_x : 50,
    refPosY: r.ref_position_y != null ? r.ref_position_y : 50,
    desc: (r.description || NA).split('\n').filter(Boolean),
    stats: r.stats || {},
    facts: (r.facts && r.facts.length) ? r.facts : [NA],
    lore: r.lore || [],
    relationships: r.relationships || [],
    isMine: !!r.is_mine,
    refIsNsfw: !!r.ref_is_nsfw,
    liked: !!r.liked,
    likeCount: r.like_count || 0,
    bookmarked: !!r.bookmarked,
    viewCount: r.view_count || 0,
  };
}

// The single navigation entry point for both the card grid AND relationship
// links. If the id is part of this story's own cast, it's a normal
// instant switch. If not, it fetches the character (regardless of owner/
// story) and shows them via the temporary "ghost slot" instead of leaving
// the page — replacing whatever ghost was showing before, if any. Either
// way this opens (or stays in) the single-character detail view.
async function viewCharacter(id) {
  id = String(id);
  const known = CHARACTERS.find(c => c.id === id);
  if (known) {
    GHOST_CHAR = null;
    history.pushState(null, '', `?char=${known.id}`);
    document.title = `${known.name} ✦ ${STORY_TITLE}`;
    document.getElementById('chars-grid-view').hidden = true;
    document.getElementById('chars-detail-view').hidden = false;
    renderProfile(known);
    syncBgHeight();
    return;
  }
  try {
    const res = await fetch(`/api/characters/${id}`);
    if (!res.ok) return;
    const data = await res.json();
    GHOST_CHAR = normalizeChar(data.character);
    history.pushState(null, '', `?char=${GHOST_CHAR.id}`);
    document.title = `${GHOST_CHAR.name} ✦ ${STORY_TITLE}`;
    document.getElementById('chars-grid-view').hidden = true;
    document.getElementById('chars-detail-view').hidden = false;
    renderProfile(GHOST_CHAR);
    syncBgHeight();
  } catch {}
}

function closeCharDetail() {
  clearTimeout(pendingViewTimer);
  GHOST_CHAR = null;
  document.getElementById('chars-detail-view').hidden = true;
  document.getElementById('chars-grid-view').hidden = false;
  document.title = `Characters ✦ ${STORY_TITLE}`;
  const usp = new URLSearchParams(window.location.search);
  usp.delete('char');
  const qs = usp.toString();
  history.pushState(null, '', qs ? `?${qs}` : window.location.pathname);
  syncBgHeight();
}
document.getElementById('chars-back-btn').addEventListener('click', closeCharDetail);

// ── Card grid — 4 per row, 20 per page, same card look as the Fanpage
// Hub's Characters browse page. ──────────────────────────────────────────
const CHARS_PAGE_SIZE = 20;
let charsPage = 1;

function fpCharCardHtml(c) {
  const species = (c.stats && c.stats.Species) ? String(c.stats.Species).trim() : '';
  const imgHtml = c.ref
    ? `<img src="${escapeHtml(c.ref)}" alt="" style="object-position:${c.refPosX}% ${c.refPosY}%;" />`
    : `<div class="fp-char-card-fallback">${escapeHtml((c.name[0] || '?').toUpperCase())}</div>`;
  return `
    <div class="fp-char-card">
      <a href="${STORY_BASE}/characters?char=${c.id}" data-char-id="${c.id}">
        <div class="fp-char-card-img-wrap">${imgHtml}</div>
        <div class="fp-char-card-body">
          <img class="fp-char-card-body-deco" src="/images/home/decoration-8.png" alt="" />
          <div class="fp-char-card-name-row">
            <p class="fp-char-card-name">${escapeHtml(c.name)}</p>
            ${species ? `<span class="fp-char-card-species">${escapeHtml(species)}</span>` : ''}
          </div>
        </div>
      </a>
    </div>
  `;
}

function renderCharsGrid(page) {
  charsPage = page;
  const gridEl = document.getElementById('chars-grid');
  const pagEl = document.getElementById('chars-pagination');
  const totalPages = Math.max(1, Math.ceil(CHARACTERS.length / CHARS_PAGE_SIZE));
  const start = (page - 1) * CHARS_PAGE_SIZE;
  const pageItems = CHARACTERS.slice(start, start + CHARS_PAGE_SIZE);
  gridEl.innerHTML = pageItems.map(fpCharCardHtml).join('');
  gridEl.querySelectorAll('.fp-char-card > a[data-char-id]').forEach(a => {
    a.addEventListener('click', (e) => {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      viewCharacter(a.dataset.charId);
    });
  });
  pagEl.innerHTML = totalPages > 1 ? fpGalleryPaginationHtml(page, totalPages) : '';
  pagEl.querySelectorAll('.fp-page-btn').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      renderCharsGrid(parseInt(btn.dataset.page, 10));
      document.getElementById('chars-grid-view').scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
  syncBgHeight();
  gridEl.querySelectorAll('img').forEach(img => img.addEventListener('load', syncBgHeight, { once: true }));
}

// Same e621-style numbered pager markup as the Fanpage Hub pages.
function fpGalleryPaginationHtml(page, totalPages) {
  const pageSet = new Set([1, totalPages, page]);
  for (let i = page - 2; i <= page + 2; i++) if (i >= 1 && i <= totalPages) pageSet.add(i);
  const sorted = [...pageSet].sort((a, b) => a - b);
  let html = `<button type="button" class="fp-page-btn" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} aria-label="Previous page">‹</button>`;
  let prev = 0;
  sorted.forEach(p => {
    if (p - prev > 1) html += '<span class="fp-page-ellipsis">…</span>';
    html += `<button type="button" class="fp-page-btn${p === page ? ' fp-page-btn--active' : ''}" data-page="${p}">${p}</button>`;
    prev = p;
  });
  html += `<button type="button" class="fp-page-btn" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''} aria-label="Next page">›</button>`;
  return html;
}

function renderCharList(rows, preferId) {
  GHOST_CHAR = null;
  CHARACTERS = rows.map(normalizeChar);

  if (!CHARACTERS.length) {
    document.title = `Characters ✦ ${STORY_TITLE}`;
    document.getElementById('chars-grid').innerHTML = IS_SELF
      ? `<p class="gallery-empty-msg">No characters yet! <a href="${STORY_BASE}/edit#characters" style="color:#7fa8d9;">Add some in the Story Editor</a>.</p>`
      : '<p class="gallery-empty-msg">No characters yet! Check back soon~</p>';
    document.getElementById('chars-pagination').innerHTML = '';
    closeCharDetail();
    return;
  }
  renderCharsGrid(1);
  if (preferId) viewCharacter(preferId);
}

// Book box — the story's own cover + a follow-the-author row, under the
// Navigate box, so browsing feels anchored to this specific book instead of
// a generic character feed. No follow control on your own story.
function renderBookBox(site) {
  const box = document.getElementById('mod-book-box');
  if (!site) { box.hidden = true; return; }
  box.hidden = false;

  document.getElementById('mod-book-cover-link').href = STORY_BASE;
  window.wikiSetCoverSlot(document.getElementById('mod-book-cover'), site, { alt: `${site.site_title} cover` });
  document.getElementById('mod-book-title').textContent = site.site_title || 'Untitled Story';

  const authorRow = document.getElementById('mod-book-author-row');
  authorRow.innerHTML = '';

  const authorLink = document.createElement('a');
  authorLink.className = 'mod-book-box-author-link';
  authorLink.href = window.fpUrl(`/${site.author_username}`);
  if (site.author_avatar) {
    const img = document.createElement('img');
    img.className = 'mod-book-box-author-avatar';
    img.src = site.author_avatar;
    img.alt = '';
    authorLink.appendChild(img);
  } else {
    const fallback = document.createElement('span');
    fallback.className = 'mod-book-box-author-avatar-fallback';
    fallback.textContent = (site.author_display_name || site.author_username || '?').charAt(0).toUpperCase();
    authorLink.appendChild(fallback);
  }
  const nameSpan = document.createElement('span');
  nameSpan.className = 'mod-book-box-author-name';
  nameSpan.textContent = site.author_display_name || site.author_username;
  authorLink.appendChild(nameSpan);
  authorRow.appendChild(authorLink);

  if (site.is_self) return;

  if (!token) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'mod-book-box-follow-btn';
    btn.textContent = 'Follow';
    btn.addEventListener('click', () => window.fpRequireSignIn('To follow this author, you must create an account!'));
    authorRow.appendChild(btn);
    return;
  }

  const btn = document.createElement('button');
  btn.type = 'button';
  let following = !!site.is_following;
  function paint() {
    btn.className = 'mod-book-box-follow-btn' + (following ? ' following' : '');
    btn.textContent = following ? '✓ Following' : 'Follow';
  }
  paint();
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await fetch(`/api/follows/${site.author_username}`, { method: following ? 'DELETE' : 'POST', headers: authHeaders() });
      following = !following;
      paint();
    } catch {}
    btn.disabled = false;
  });
  authorRow.appendChild(btn);
}

// ── Universal comments (target_type/target_id) — same system used on
// gallery posts, just pointed at this character instead. ──────────────────
const CURRENT_USER = (() => {
  try { return JSON.parse(localStorage.getItem('btw_user') || sessionStorage.getItem('btw_user') || 'null'); } catch { return null; }
})();
let ccTargetType = null, ccTargetId = null;

function ccAvatarHtml(c) {
  if (c.is_guest) return '<img class="cc-avatar" src="/images/defaultchar.jpg" alt="" />';
  const name = c.display_name || c.username || '?';
  const initial = escapeHtml(name.charAt(0).toUpperCase());
  return c.avatar
    ? `<img class="cc-avatar" src="${c.avatar}" alt="" />`
    : `<span class="cc-avatar-fallback">${initial}</span>`;
}
function ccNameHtml(c) {
  if (c.is_guest) return `<span class="cc-name cc-name-guest">${escapeHtml(c.display_name || 'Guest')}</span>`;
  return `<span class="cc-name"><a href="${window.fpUrl(`/${encodeURIComponent(c.username)}`)}">${escapeHtml(c.display_name || c.username)}</a></span>`;
}
function ccGuestName() {
  const input = document.getElementById('cc-guest-name');
  return input ? input.value.trim() : (localStorage.getItem('btw_guest_name') || '');
}
document.getElementById('cc-guest-signin-link').addEventListener('click', (e) => {
  e.preventDefault();
  window.fpOpenLoginModal();
});
function ccTimeAgo(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  if (diff < 2592000) return `${Math.floor(diff / 86400)}d ago`;
  return new Date(iso).toLocaleDateString();
}
function ccIsMine(c) { return CURRENT_USER && CURRENT_USER.id === c.user_id; }

function ccCommentEl(c, isReply) {
  const wrap = document.createElement('div');
  wrap.className = 'cc-item';
  const avatarHolder = document.createElement('div');
  avatarHolder.innerHTML = ccAvatarHtml(c);
  wrap.appendChild(avatarHolder.firstElementChild);

  const body = document.createElement('div');
  body.className = 'cc-body-wrap';
  body.innerHTML = `
    <div class="cc-bubble">
      ${ccNameHtml(c)}
      <span class="cc-time">${ccTimeAgo(c.created_at)}</span>
      <p class="cc-text">${c.reply_to_username ? `<span class="cc-mention">@${escapeHtml(c.reply_to_username)}</span> ` : ''}${escapeHtml(c.body)}</p>
    </div>
    <div class="cc-actions">
      ${!isReply ? '<button class="cc-action-btn" data-action="reply">Reply</button>' : ''}
      ${ccIsMine(c) ? '<button class="cc-action-btn" data-action="delete">Delete</button>' : ''}
    </div>
  `;
  wrap.appendChild(body);

  const guestNameEl = body.querySelector('.cc-name-guest');
  if (guestNameEl) guestNameEl.addEventListener('click', () => alert('Account does not exist.'));
  const replyBtn = body.querySelector('[data-action="reply"]');
  if (replyBtn) replyBtn.addEventListener('click', () => ccOpenReplyBox(body, c));
  const deleteBtn = body.querySelector('[data-action="delete"]');
  if (deleteBtn) deleteBtn.addEventListener('click', () => ccDeleteComment(c.id));

  if (!isReply && (c.replies || []).length) {
    const repliesWrap = document.createElement('div');
    repliesWrap.className = 'cc-replies';
    c.replies.forEach(r => repliesWrap.appendChild(ccCommentEl(r, true)));
    body.appendChild(repliesWrap);
  }
  return wrap;
}

function ccOpenReplyBox(bodyEl, parentComment) {
  const existing = bodyEl.querySelector('.cc-reply-box');
  if (existing) { existing.querySelector('textarea').focus(); return; }
  const box = document.createElement('div');
  box.className = 'cc-reply-box';
  box.innerHTML = `
    <textarea placeholder="Reply to ${escapeHtml(parentComment.display_name || parentComment.username)}…" maxlength="2000"></textarea>
    <button class="cc-compose-btn" type="button">Reply</button>
  `;
  const textarea = box.querySelector('textarea');
  box.querySelector('button').addEventListener('click', async () => {
    const text = textarea.value.trim();
    if (!text) return;
    const guestName = token ? null : ccGuestName();
    if (!token && !guestName) { alert('Add your name in the comment box above first.'); return; }
    const btn = box.querySelector('button');
    btn.disabled = true;
    try {
      const res = await fetch('/api/content-comments', {
        method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify({ target_type: ccTargetType, target_id: ccTargetId, body: text, parent_id: parentComment.id, guest_name: guestName }),
      });
      if (res.ok) await ccLoadComments();
    } finally { btn.disabled = false; }
  });
  const repliesWrap = bodyEl.querySelector('.cc-replies');
  bodyEl.insertBefore(box, repliesWrap || null);
  textarea.focus();
}

async function ccDeleteComment(id) {
  if (!confirm('Delete this comment?')) return;
  try {
    await fetch(`/api/content-comments/${id}`, { method: 'DELETE', headers: authHeaders() });
    ccLoadComments();
  } catch {}
}

async function ccLoadComments() {
  const list = document.getElementById('cc-list');
  if (!list) return;
  try {
    const res = await fetch(`/api/content-comments?target_type=${ccTargetType}&target_id=${ccTargetId}`);
    const data = await res.json();
    const comments = data.comments || [];
    list.innerHTML = '';
    if (!comments.length) { list.innerHTML = '<p class="cc-empty">No comments yet — be the first!</p>'; return; }
    comments.forEach(c => list.appendChild(ccCommentEl(c, false)));
  } catch { list.innerHTML = '<p class="cc-empty">Couldn\'t load comments right now.</p>'; }
}

function ccInitSection(targetType, targetId) {
  ccTargetType = targetType;
  ccTargetId = targetId;
  document.getElementById('cc-compose').style.display = 'flex';
  if (!token) {
    document.getElementById('cc-guest-note').style.display = 'block';
    document.getElementById('cc-guest-label').style.display = 'block';
    const guestInput = document.getElementById('cc-guest-name');
    guestInput.style.display = 'block';
    guestInput.value = localStorage.getItem('btw_guest_name') || '';
  }
  ccLoadComments();
}

document.getElementById('cc-compose-btn').addEventListener('click', async () => {
  const input = document.getElementById('cc-compose-input');
  const text = input.value.trim();
  if (!text || !ccTargetType) return;
  let guestName = null;
  if (!token) {
    guestName = ccGuestName();
    if (!guestName) { alert('Please enter a name.'); document.getElementById('cc-guest-name').focus(); return; }
    localStorage.setItem('btw_guest_name', guestName);
  }
  const btn = document.getElementById('cc-compose-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/content-comments', {
      method: 'POST', headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ target_type: ccTargetType, target_id: ccTargetId, body: text, guest_name: guestName }),
    });
    if (res.ok) { input.value = ''; await ccLoadComments(); }
  } finally { btn.disabled = false; }
});

(async () => {
  const data = await ModeratorSite.load(SLUG);
  ModeratorSite.applyBanner(document.getElementById('page-banner-img'), data && data.site);
  if (data && data.site) renderVipBadge(data.site);
  renderBookBox(data && data.site);
  STORY_TITLE = (data && data.site && data.site.site_title) || 'Fanpages';
  STORY_COVER_URL = (data && data.site && data.site.cover_url) || '';
  IS_SELF = !!(data && data.site && data.site.is_self);
  // Forces the same blurred PotentialBoxBackground the Fanpage Hub's
  // Characters browse page uses, regardless of whatever theme this story
  // has picked for its Home/Chapters/Gallery pages -- this page always
  // gets its own dedicated look.
  applyStoryTheme('custom', '/images/home/potential-box-background.png');
  // applyStoryTheme's own scrim is tuned for the fixed-background pages
  // (Home/Chapters/Gallery) -- override to match the Characters browse
  // page's lighter scrim exactly.
  document.getElementById('page-bg-overlay').style.background = 'rgba(8,6,10,0.45)';
  const pageTitleEl = document.getElementById('page-title-display');
  pageTitleEl.textContent = STORY_TITLE;
  pageTitleEl.classList.remove('mod-title-loading');

  renderCharList((data && data.characters) || []);
  syncBgHeight();

  // A ?char= deep link (a cast member, a relationship-linked "ghost" not
  // in this story's own cast, or a shared URL) opens straight into the
  // detail view instead of landing on the grid -- viewCharacter() already
  // handles both the known-cast and ghost cases.
  const urlCharId = new URLSearchParams(window.location.search).get('char');
  if (urlCharId) viewCharacter(urlCharId);
})();
</script>
