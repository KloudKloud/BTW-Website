<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapters ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    /* ── Chapter cards — thumbnail (chapter art, or a YouTube thumbnail if
       the chapter's cover is a video instead of an image), title, a
       colored Published/Draft + date line, and a mini stat row. Replaces
       the old bare "thumbnail + title" .chapter-row list. ── */
    .ch-card-list { display: flex; flex-direction: column; gap: 0.9rem; margin-top: 1.5rem; }
    /* Grid, not flex — two equal 1fr columns flank the progress bar (info on
       the left, stats on the right), so the bar lands dead-center across the
       card's remaining width instead of just wherever flex leftover space put it. */
    .ch-card {
      display: grid; grid-template-columns: 96px minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 1.25rem;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 1rem 1.25rem; text-decoration: none; color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .ch-card:hover { border-color: rgba(240,192,96,0.35); background: rgba(255,255,255,0.06); }
    .ch-card-thumb {
      width: 96px; height: 96px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
      background: #1a1a1a; border: 1px solid rgba(255,255,255,0.08); position: relative;
    }
    .ch-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ch-card-thumb .wiki-generated-cover { width: 100%; height: 100%; }
    .ch-card-thumb .wiki-generated-cover-title { font-size: 0.58rem; line-height: 1.15; padding: 0 0.3rem; }
    .ch-card-thumb-play {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; background: rgba(0,0,0,0.25); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .ch-card-info { min-width: 0; display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; padding: 0.15rem 0; }
    .ch-card-title {
      font-family: 'Baloo 2', 'Cinzel', serif; font-weight: 700; font-size: 1.25rem;
      color: #f0f0f0; margin: 0 0 0.3rem; line-height: 1.25;
    }
    /* Sits at the bottom of the left side now (.ch-card-info is a column
       flexed to fill the card's full height), bigger than before so it
       reads as real information instead of a small afterthought caption. */
    .ch-card-meta { font-size: 0.95rem; margin: 0; font-family: 'Inter', sans-serif; }
    .ch-card-status--published { color: #7fa8d9; font-weight: 700; }
    .ch-card-status--draft { color: #f0c060; font-weight: 700; }
    .ch-card-meta-date { color: #999; }

    /* Placeholder for real reading-progress tracking once the in-browser
       reader exists — always 0% for now, Wattpad-style pill + bar. */
    .ch-card-progress {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      justify-self: center; width: 320px;
    }
    .ch-card-progress-label { font-size: 0.8rem; color: #999; font-weight: 700; font-family: 'Inter', sans-serif; white-space: nowrap; }
    .ch-card-progress-bar { width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .ch-card-progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7fa8d9, #3dd6b8); border-radius: 3px; }

    .ch-card-stats {
      display: flex; flex-direction: row; gap: 1.25rem;
      font-size: 0.85rem; color: #aaa; justify-self: end;
    }
    .ch-card-stats span { white-space: nowrap; }
    /* Emoji glyphs render at different optical widths, so the counts after
       them didn't actually line up vertically even in a flex column — a
       fixed-width icon slot fixes that. */
    .ch-card-stat-icon { display: inline-block; width: 1.4em; text-align: center; }
  </style>
</head>
<body class="mod-theme">

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="site-banner">
  <div class="site-banner-inner">
    <img id="page-banner-img" alt="Chapters — banner" />
    <div class="mod-vip-badge" id="vip-badge" style="display:none;">
      <span class="mod-vip-badge-star">⭐</span> VeekitPaws — Developer
    </div>
  </div>
</div>

<!-- Story's chosen background — same theme system as the story home page. -->
<div class="mod-page-bg-wrap" id="page-bg-wrap">
  <img class="mod-page-bg-img" id="page-bg-img" style="display:none;" alt="" />
  <div class="mod-page-bg-overlay" id="page-bg-overlay" style="display:none;"></div>

  <div class="wiki-page-title-block">
    <h1 class="wiki-title wiki-page-title mod-title-loading" id="page-title-display"></h1>
  </div>

  <nav class="wiki-story-tabs wiki-story-tabs--top wiki-story-tabs--centered">
    <a href="#" id="tab-home" class="wiki-story-tab">Home</a>
    <a href="#" id="tab-chapters" class="wiki-story-tab active">Chapters</a>
    <a href="#" id="tab-characters" class="wiki-story-tab">Characters</a>
    <a href="#" id="tab-gallery" class="wiki-story-tab">Gallery</a>
  </nav>

  <!-- Same 1300px cap as the story home page's .wiki-layout — the shared
       .mod-page-row class (also used by profile-template.html) defaults
       to 1340px, which read visibly wider than Home. -->
  <main class="mod-page-row" style="padding: 0 3rem; max-width: 1300px; grid-template-columns: 1fr;">

    <div class="mod-chapters-main" id="chapters-list-view">

      <h1 class="wiki-section-title">Chapters</h1>

      <div class="ch-card-list" id="chapters-list">
        <p class="gallery-empty-msg">Loading…</p>
      </div>

    </div>

  </main>
</div>


<footer>
  <p>This story is a fan-made page hosted on Between Two Worlds.</p>
</footer>

<script src="/fanpages/fanpages-site.js"></script>
<script>
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const OFFSET = window.FP_BASE ? 1 : 0;
const SLUG = PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');
const STORY_BASE = (window.FP_BASE || '') + '/' + PATH_PARTS.slice(OFFSET, OFFSET + 2).join('/');

document.getElementById('tab-home').href = STORY_BASE;
document.getElementById('tab-chapters').href = STORY_BASE + '/chapters';
document.getElementById('tab-characters').href = STORY_BASE + '/characters';
document.getElementById('tab-gallery').href = STORY_BASE + '/gallery';

let CHAPTERS = [];
let SITE = null;
let IS_SELF = false;

function renderVipBadge(s) {
  document.getElementById('vip-badge').style.display =
    (s.author_username || '').toLowerCase() === 'veekitpaws' ? 'flex' : 'none';
}

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function applyStoryTheme(theme, bgUrl) {
  const bgImg = document.getElementById('page-bg-img');
  const bgOverlay = document.getElementById('page-bg-overlay');
  if (theme === 'custom' && bgUrl) {
    bgImg.src = bgUrl;
    bgImg.style.display = 'block';
    bgOverlay.style.background = hexToRgba('#0a0a0a', 0.78);
    bgOverlay.style.display = 'block';
  } else {
    bgImg.style.display = 'none';
    bgOverlay.style.display = 'none';
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Chapter list ─────────────────────────────────────────────────────────
function extractYouTubeId(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  return m ? m[1] : null;
}
// Chapter art wins if it's set; otherwise a YouTube video's own thumbnail
// (there's clearly a cover either way); otherwise the story's own cover.
// Falls back chapter image -> YouTube thumbnail -> the story's own cover
// -> (if the story has no cover either) the same generated purple/rose
// book-cover treatment used everywhere else a cover is missing, instead of
// a random stock placeholder image with no relation to this story.
function chapterThumb(ch) {
  if (ch.image_url) return { src: ch.image_url, isVideo: false, generated: false };
  const videoId = extractYouTubeId(ch.video_url);
  if (videoId) return { src: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`, isVideo: true, generated: false };
  if (SITE && SITE.cover_url) return { src: SITE.cover_url, isVideo: false, generated: false };
  return { generated: true, isVideo: false };
}
function formatChapterDate(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function formatStatCount(n) {
  n = n || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function renderChapterList() {
  const list = document.getElementById('chapters-list');
  if (!CHAPTERS.length) {
    list.innerHTML = '<p class="gallery-empty-msg">No chapters yet — check back soon.</p>';
    return;
  }
  list.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const isPublished = ch.status === 'published';
    const thumb = chapterThumb(ch);
    // Everyone sees "Published - <date>" on real chapters; only the owner
    // sees "Draft - <date created>" ones at all (server already keeps
    // drafts out of CHAPTERS for anyone else).
    const dateLabel = isPublished
      ? `<span class="ch-card-status--published">Published</span> - <span class="ch-card-meta-date">${formatChapterDate(ch.updated_at || ch.created_at)}</span>`
      : `<span class="ch-card-status--draft">Draft</span> - <span class="ch-card-meta-date">${formatChapterDate(ch.created_at)}</span>`;
    const card = document.createElement('a');
    card.className = 'ch-card';
    card.href = `${STORY_BASE}/reader?ch=${ch.id}`;
    card.innerHTML = `
      <div class="ch-card-thumb">
        ${thumb.generated
          ? window.wikiGeneratedCoverHtml(SITE || {}, { imgClass: '' })
          : `<img src="${thumb.src}" alt="${escapeHtml(ch.title)} thumbnail" />`}
        ${thumb.isVideo ? '<span class="ch-card-thumb-play">▶</span>' : ''}
      </div>
      <div class="ch-card-info">
        <p class="ch-card-title">${escapeHtml(ch.title || 'Untitled Chapter')}</p>
        <p class="ch-card-meta">${dateLabel}</p>
      </div>
      <!-- Placeholder until the in-browser reader tracks real progress —
           always 0% for now. -->
      <div class="ch-card-progress">
        <span class="ch-card-progress-label">0% Complete</span>
        <div class="ch-card-progress-bar"><div class="ch-card-progress-bar-fill"></div></div>
      </div>
      <div class="ch-card-stats">
        <span><span class="ch-card-stat-icon">👁</span> ${formatStatCount(ch.view_count)}</span>
        <span><span class="ch-card-stat-icon">❤️</span> ${formatStatCount(ch.like_count)}</span>
        <span><span class="ch-card-stat-icon">💬</span> ${formatStatCount(ch.comment_count)}</span>
      </div>`;
    list.appendChild(card);
  });
}

(async () => {
  const data = await ModeratorSite.load(SLUG);
  SITE = (data && data.site) || null;
  ModeratorSite.applyBanner(document.getElementById('page-banner-img'), SITE);
  if (SITE) renderVipBadge(SITE);
  applyStoryTheme(SITE && SITE.theme, SITE && SITE.theme_bg_url);
  if (SITE && SITE.site_title) document.title = `Chapters ✦ ${SITE.site_title}`;
  const pageTitleEl = document.getElementById('page-title-display');
  pageTitleEl.textContent = (SITE && SITE.site_title) || 'Fanpages';
  pageTitleEl.classList.remove('mod-title-loading');
  IS_SELF = !!(SITE && SITE.is_self);

  CHAPTERS = (data && data.chapters) || [];
  renderChapterList();
})();
</script>
</body>
</html>
