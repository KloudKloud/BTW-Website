<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chapters ✦ Fanpages</title>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/fanpages/fanpages.css" />
  <link rel="stylesheet" href="/fanpages/fanpages-nav.css" />
  <style>
    /* ── Chapter cards — thumbnail (chapter art, or a YouTube thumbnail if
       the chapter's cover is a video instead of an image), title, a
       colored Published/Draft + date line, and a mini stat row. Replaces
       the old bare "thumbnail + title" .chapter-row list. ── */
    .ch-card-list { display: flex; flex-direction: column; gap: 0.9rem; margin-top: 1.5rem; }
    .ch-card {
      display: flex; align-items: center; gap: 1.25rem;
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px;
      padding: 1rem 1.25rem; text-decoration: none; color: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    .ch-card:hover { border-color: rgba(240,192,96,0.35); background: rgba(255,255,255,0.06); }
    .ch-card-thumb {
      width: 96px; height: 96px; flex-shrink: 0; border-radius: 10px; overflow: hidden;
      background: #1a1a1a; border: 1px solid rgba(255,255,255,0.08); position: relative;
    }
    .ch-card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ch-card-thumb-play {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; background: rgba(0,0,0,0.25); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .ch-card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; padding: 0.15rem 0; }
    .ch-card-title {
      font-family: 'Baloo 2', 'Cinzel', serif; font-weight: 700; font-size: 1.25rem;
      color: #f0f0f0; margin: 0 0 0.3rem; line-height: 1.25;
    }
    /* Sits at the bottom of the left side now (.ch-card-info is a column
       flexed to fill the card's full height), bigger than before so it
       reads as real information instead of a small afterthought caption. */
    .ch-card-meta { font-size: 0.95rem; margin: 0; font-family: 'Inter', sans-serif; }
    .ch-card-status--published { color: #7fa8d9; font-weight: 700; }
    .ch-card-status--draft { color: #f0c060; font-weight: 700; }
    .ch-card-meta-date { color: #999; }

    /* Placeholder for real reading-progress tracking once the in-browser
       reader exists — always 0% for now, Wattpad-style pill + bar. */
    .ch-card-progress {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      flex-shrink: 0; width: 320px;
    }
    .ch-card-progress-label { font-size: 0.8rem; color: #999; font-weight: 700; font-family: 'Inter', sans-serif; white-space: nowrap; }
    .ch-card-progress-bar { width: 100%; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
    .ch-card-progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7fa8d9, #3dd6b8); border-radius: 3px; }

    /* Center-right of the card, not flush against the right edge. */
    .ch-card-stats {
      display: flex; flex-direction: column; gap: 0.5rem; flex-shrink: 0;
      font-size: 0.85rem; color: #aaa; margin-right: 2.5rem;
    }
    .ch-card-stats span { white-space: nowrap; }
  </style>
</head>
<body class="mod-theme">

<div id="fanpages-topbar-root"></div>
<script src="/fanpages/fanpages-nav.js"></script>

<div class="site-banner">
  <div class="site-banner-inner">
    <img id="page-banner-img" alt="Chapters — banner" />
    <div class="mod-vip-badge" id="vip-badge" style="display:none;">
      <span class="mod-vip-badge-star">⭐</span> VeekitPaws — Developer
    </div>
  </div>
</div>

<!-- Story's chosen background — same theme system as the story home page. -->
<div class="mod-page-bg-wrap" id="page-bg-wrap">
  <img class="mod-page-bg-img" id="page-bg-img" style="display:none;" alt="" />
  <div class="mod-page-bg-overlay" id="page-bg-overlay" style="display:none;"></div>

  <div class="wiki-page-title-block">
    <h1 class="wiki-title wiki-page-title mod-title-loading" id="page-title-display"></h1>
  </div>

  <nav class="wiki-story-tabs wiki-story-tabs--top wiki-story-tabs--centered">
    <a href="#" id="tab-home" class="wiki-story-tab">Home</a>
    <a href="#" id="tab-chapters" class="wiki-story-tab active">Chapters</a>
    <a href="#" id="tab-characters" class="wiki-story-tab">Characters</a>
    <a href="#" id="tab-gallery" class="wiki-story-tab">Gallery</a>
  </nav>

  <!-- Same 1300px cap as the story home page's .wiki-layout — the shared
       .mod-page-row class (also used by profile-template.html) defaults
       to 1340px, which read visibly wider than Home. -->
  <main class="mod-page-row" style="padding: 0 3rem; max-width: 1300px; grid-template-columns: 1fr;">

    <div class="mod-chapters-main" id="chapters-list-view">

      <h1 class="wiki-section-title">Chapters</h1>

      <div class="ch-card-list" id="chapters-list">
        <p class="gallery-empty-msg">Loading…</p>
      </div>

    </div>

    <!-- Chapter detail "page" — swapped in for #chapters-list-view -->
    <div class="chapter-detail-view" id="chapter-detail-view" style="display:none;">
      <a class="art-view-back" href="#" id="chapter-detail-back">← Back to Chapters</a>

      <div class="chapter-detail-card">
        <div class="chapter-detail-side">
          <p class="chapter-detail-side-label">Where to Read!</p>
          <div class="chapter-view-links" id="chapter-detail-links"></div>
          <button class="btn btn-outline chapter-read-btn" id="chapter-detail-pdf-btn" type="button" style="display:none; margin-top:0.5rem;">📄 Read as PDF?</button>
          <p class="chapter-detail-no-pdf" id="chapter-detail-no-pdf" style="display:none;"><em>No PDF available to view</em></p>
        </div>

        <div class="chapter-detail-main">
          <h1 class="chapter-detail-title" id="chapter-detail-title"></h1>
          <p class="chapter-detail-teaser" id="chapter-detail-teaser"></p>
          <div class="chapter-detail-image-wrap" id="chapter-detail-image-wrap">
            <img id="chapter-detail-image" alt="" />
          </div>
        </div>
      </div>

      <!-- In-page PDF reader -->
      <div id="chapter-pdf-view" hidden>
        <div class="chapter-pdf-header">
          <button class="chapter-pdf-back" id="chapter-pdf-close" type="button">← Back to Chapter</button>
          <a class="chapter-pdf-download" id="chapter-pdf-download" download>⬇ Download</a>
        </div>
        <iframe id="chapter-pdf-iframe" class="chapter-pdf-viewer" title="Chapter PDF"></iframe>
      </div>
    </div>

  </main>
</div>


<footer>
  <p>This story is a fan-made page hosted on Between Two Worlds.</p>
</footer>

<script src="/fanpages/fanpages-site.js"></script>
<script>
const PATH_PARTS = window.location.pathname.split('/').filter(Boolean);
const SLUG = PATH_PARTS.slice(1, 3).join('/');
const STORY_BASE = '/' + PATH_PARTS.slice(0, 3).join('/');

document.getElementById('tab-home').href = STORY_BASE;
document.getElementById('tab-chapters').href = STORY_BASE + '/chapters';
document.getElementById('tab-characters').href = STORY_BASE + '/characters';
document.getElementById('tab-gallery').href = STORY_BASE + '/gallery';

const token = localStorage.getItem('btw_token') || sessionStorage.getItem('btw_token');
const authHeaders = () => ({ Authorization: `Bearer ${token}`, 'X-Story-Path': SLUG });

let CHAPTERS = [];
let SITE = null;
let IS_SELF = false;
let currentDetailChapter = null;

function renderVipBadge(s) {
  document.getElementById('vip-badge').style.display =
    (s.author_username || '').toLowerCase() === 'veekitpaws' ? 'flex' : 'none';
}

function hexToRgba(hex, alpha) {
  const n = parseInt(hex.replace('#', ''), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}
function applyStoryTheme(theme, bgUrl) {
  const bgImg = document.getElementById('page-bg-img');
  const bgOverlay = document.getElementById('page-bg-overlay');
  if (theme === 'custom' && bgUrl) {
    bgImg.src = bgUrl;
    bgImg.style.display = 'block';
    bgOverlay.style.background = hexToRgba('#0a0a0a', 0.78);
    bgOverlay.style.display = 'block';
  } else {
    bgImg.style.display = 'none';
    bgOverlay.style.display = 'none';
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ── Chapter list ─────────────────────────────────────────────────────────
function extractYouTubeId(url) {
  const m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);
  return m ? m[1] : null;
}
// Chapter art wins if it's set; otherwise a YouTube video's own thumbnail
// (there's clearly a cover either way); otherwise the story's own cover.
function chapterThumb(ch) {
  if (ch.image_url) return { src: ch.image_url, isVideo: false };
  const videoId = extractYouTubeId(ch.video_url);
  if (videoId) return { src: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`, isVideo: true };
  return { src: (SITE && SITE.cover_url) || '/images/gallery/pixernbath_13.png', isVideo: false };
}
function formatChapterDate(dateStr) {
  if (!dateStr) return '';
  return new Date(dateStr).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
}
function formatStatCount(n) {
  n = n || 0;
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
  return String(n);
}

function renderChapterList() {
  const list = document.getElementById('chapters-list');
  if (!CHAPTERS.length) {
    list.innerHTML = '<p class="gallery-empty-msg">No chapters yet — check back soon.</p>';
    return;
  }
  list.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const isPublished = ch.status === 'published';
    const thumb = chapterThumb(ch);
    // Everyone sees "Published - <date>" on real chapters; only the owner
    // sees "Draft - <date created>" ones at all (server already keeps
    // drafts out of CHAPTERS for anyone else).
    const dateLabel = isPublished
      ? `<span class="ch-card-status--published">Published</span> - <span class="ch-card-meta-date">${formatChapterDate(ch.updated_at || ch.created_at)}</span>`
      : `<span class="ch-card-status--draft">Draft</span> - <span class="ch-card-meta-date">${formatChapterDate(ch.created_at)}</span>`;
    const card = document.createElement('a');
    card.className = 'ch-card';
    card.href = `${STORY_BASE}/chapters?ch=${ch.id}`;
    card.innerHTML = `
      <div class="ch-card-thumb">
        <img src="${thumb.src}" alt="${escapeHtml(ch.title)} thumbnail" />
        ${thumb.isVideo ? '<span class="ch-card-thumb-play">▶</span>' : ''}
      </div>
      <div class="ch-card-info">
        <p class="ch-card-title">${escapeHtml(ch.title || 'Untitled Chapter')}</p>
        <p class="ch-card-meta">${dateLabel}</p>
      </div>
      <!-- Placeholder until the in-browser reader tracks real progress —
           always 0% for now. -->
      <div class="ch-card-progress">
        <span class="ch-card-progress-label">0% Complete</span>
        <div class="ch-card-progress-bar"><div class="ch-card-progress-bar-fill"></div></div>
      </div>
      <div class="ch-card-stats">
        <span>👁 ${formatStatCount(ch.view_count)}</span>
        <span>⭐ ${formatStatCount(ch.like_count)}</span>
        <span>💬 ${formatStatCount(ch.comment_count)}</span>
      </div>`;
    card.addEventListener('click', (e) => {
      e.preventDefault();
      openChapterDetail(ch, true);
    });
    list.appendChild(card);
  });
}

// ── Chapter detail "page" ───────────────────────────────────────────────
function closePdfView() {
  document.getElementById('chapter-pdf-view').hidden = true;
  document.getElementById('chapter-detail-image-wrap').style.display = 'block';
  document.getElementById('chapter-pdf-iframe').src = '';
}

function truncateLabel(s, n) { return s.length > n ? s.slice(0, n).trimEnd() + '…' : s; }

// Counts as a "read" once per chapter per browser session — opening the
// same chapter again (or just refreshing the page on it) within the same
// tab session doesn't re-count, so this can't be spammed by reloading.
// Owner previews of their own story don't count either (handled server-side).
function trackChapterView(ch) {
  const key = `btw_viewed_ch_${ch.id}`;
  if (sessionStorage.getItem(key)) return;
  sessionStorage.setItem(key, '1');
  const url = SLUG.includes('/') ? `/api/moderator-sites/by-path/${SLUG}/view` : `/api/moderator-sites/${SLUG}/view`;
  fetch(url, { method: 'POST', headers: authHeaders() }).catch(() => {});
}

function openChapterDetail(ch, pushHistory) {
  currentDetailChapter = ch;
  closePdfView();
  trackChapterView(ch);

  document.getElementById('chapter-detail-title').textContent = ch.title || 'Untitled Chapter';
  document.getElementById('chapter-detail-teaser').textContent = ch.teaser && ch.teaser.trim() ? ch.teaser : 'No description provided';

  document.getElementById('chapter-detail-image').src = chapterThumb(ch).src;
  document.getElementById('chapter-detail-image-wrap').style.display = 'block';

  const linksWrap = document.getElementById('chapter-detail-links');
  linksWrap.innerHTML = '';
  (ch.links || []).forEach(l => {
    const a = document.createElement('a');
    a.className = 'btn btn-primary chapter-read-btn';
    a.href = l.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = truncateLabel(l.label, 20);
    linksWrap.appendChild(a);
  });

  const pdfBtn = document.getElementById('chapter-detail-pdf-btn');
  const noPdf = document.getElementById('chapter-detail-no-pdf');
  if (ch.file_url) {
    pdfBtn.style.display = 'block';
    noPdf.style.display = 'none';
  } else {
    pdfBtn.style.display = 'none';
    noPdf.style.display = 'block';
  }

  document.getElementById('chapters-list-view').style.display = 'none';
  document.getElementById('chapter-detail-view').style.display = 'block';
  document.title = `${ch.title || 'Chapter'} ✦ ${document.title.split('✦').pop().trim()}`;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (pushHistory) history.pushState({ ch: ch.id }, '', `${STORY_BASE}/chapters?ch=${ch.id}`);
}

function closeChapterDetail(pushHistory) {
  currentDetailChapter = null;
  closePdfView();
  document.getElementById('chapter-detail-view').style.display = 'none';
  document.getElementById('chapters-list-view').style.display = '';
  if (pushHistory) history.pushState({}, '', `${STORY_BASE}/chapters`);
}

document.getElementById('chapter-detail-back').addEventListener('click', (e) => {
  e.preventDefault();
  closeChapterDetail(true);
});

document.getElementById('chapter-detail-pdf-btn').addEventListener('click', () => {
  if (!currentDetailChapter || !currentDetailChapter.file_url) return;
  const iframe = document.getElementById('chapter-pdf-iframe');
  if (!iframe.src) iframe.src = currentDetailChapter.file_url;
  document.getElementById('chapter-pdf-download').href = currentDetailChapter.file_url;
  document.getElementById('chapter-pdf-download').setAttribute('download', currentDetailChapter.file_name || '');
  document.getElementById('chapter-detail-image-wrap').style.display = 'none';
  document.getElementById('chapter-pdf-view').hidden = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
document.getElementById('chapter-pdf-close').addEventListener('click', () => {
  document.getElementById('chapter-pdf-view').hidden = true;
  document.getElementById('chapter-detail-image-wrap').style.display = 'block';
});

window.addEventListener('popstate', () => {
  const id = new URLSearchParams(window.location.search).get('ch');
  if (!id) { closeChapterDetail(false); return; }
  const ch = CHAPTERS.find(c => String(c.id) === String(id));
  if (ch) openChapterDetail(ch, false);
});

(async () => {
  const data = await ModeratorSite.load(SLUG);
  SITE = (data && data.site) || null;
  ModeratorSite.applyBanner(document.getElementById('page-banner-img'), SITE);
  if (SITE) renderVipBadge(SITE);
  applyStoryTheme(SITE && SITE.theme, SITE && SITE.theme_bg_url);
  if (SITE && SITE.site_title) document.title = `Chapters ✦ ${SITE.site_title}`;
  const pageTitleEl = document.getElementById('page-title-display');
  pageTitleEl.textContent = (SITE && SITE.site_title) || 'Fanpages';
  pageTitleEl.classList.remove('mod-title-loading');
  IS_SELF = !!(SITE && SITE.is_self);

  CHAPTERS = (data && data.chapters) || [];
  renderChapterList();

  const deepLinkId = new URLSearchParams(window.location.search).get('ch');
  const deepLinkChapter = deepLinkId ? CHAPTERS.find(c => String(c.id) === String(deepLinkId)) : null;
  if (deepLinkChapter) openChapterDetail(deepLinkChapter, false);
})();
</script>
</body>
</html>
